# Spiegelt den Inhalt von app/ bei jedem Push (der app/ betrifft) in den
# eigenstaendigen Branch "hostinger-deploy", sodass app/-Dateien dort direkt
# im Branch-Root liegen (nicht mehr in einem Unterordner). Hostingers native
# Git-Integration (hPanel -> Website -> Advanced -> Git) wird auf genau diesen
# Branch zeigen - so landen nur die echten Website-Dateien auf dem Server,
# nicht db/, supabase/ oder .github/. Nutzt "git subtree split", das die
# Historie fuer app/ eigenstaendig nachbildet.
name: Deploy-Branch fuer Hostinger synchronisieren

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
  workflow_dispatch:

jobs:
  sync-deploy-branch:
    name: app/ in hostinger-deploy-Branch spiegeln
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Code auschecken (volle Historie)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git-Identitaet setzen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: app/-Unterordner als eigenstaendigen Branch abspalten und pushen
        run: |
          git subtree split --prefix=app -b hostinger-deploy-tmp
          git push origin hostinger-deploy-tmp:hostinger-deploy --force
          git branch -D hostinger-deploy-tmp
