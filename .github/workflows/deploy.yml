# HINWEIS (2026-07-25): Wird durch die native Hostinger-Git-Integration ersetzt
# (siehe sync-hostinger-deploy-branch.yml) - die loest vermutlich auch das
# CDN-Cache-Problem, weil sie ueber Hostingers eigenen Deploy-Mechanismus laeuft
# statt per rohem FTP-Schreiben. Dieser Workflow bleibt vorerst als Fallback
# aktiv, bis die Git-Integration in hPanel eingerichtet und bestaetigt ist -
# danach kann er inkl. FTP_SERVER/FTP_USERNAME/FTP_PASSWORD-Secrets entfernt werden.
name: Deploy zu Hostinger (FTP, alt)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: FTP-Upload
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Per FTP zu Hostinger hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: app/
          server-dir: public_html/
