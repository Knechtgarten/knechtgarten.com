<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=41"></script>
<title>Alkalinität – Werkzeuge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#323E4E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kg-werkzeuge.js?v=9"></script>
</head>
<body>
<header class="app"><div class="wrap">
  <a class="backlink" href="index.html">Startseite</a>
  <div class="brand"><h1>Werkzeuge</h1></div>
  <span class="userbar hidden" id="userbar"><span id="userbarText"></span><button id="logoutBtn">Abmelden</button></span>
</div></header>
<main id="appMain"></main>
<script>
// Alkalinität: (TA Ziel − TA aktuell) × m³ × 1.8 g Alca Plus (NaHCO₃) (aus dem bisherigen Pool-Rechner)
KGW.werkzeug('pool_alk', inhalt => {
  const $ = id => document.getElementById(id), g = (id, alt) => KGW.lsGet('kgw-alk-' + id, alt);
  inhalt.insertAdjacentHTML('beforeend', KGW.karte('Total Alkalinität (mg/L als CaCO₃)', `${KGW.feld('taIst', 'TA aktuell', g('taIst', '60'), 10)}${KGW.feld('taZiel', 'TA Ziel', g('taZiel', '100'), 10)}
    <span class="kgw-hinweis">Ideal: 80–120 mg/L</span>`, 'taKarte'));
  inhalt.insertAdjacentHTML('beforeend', KGW.karte('Dosierung', `<span class="kgw-klein" style="font-size:13px">Alca Plus (NaHCO₃)</span>
    <div class="kgw-gross" id="ergebnis"><b id="menge"></b><span id="einheit"></span></div><div class="kgw-warn hidden" id="zuHoch">Zu hoch – Wasser teilweise ersetzen</div>
    <span class="kgw-klein" id="weg"></span>`));
  inhalt.insertAdjacentHTML('beforeend', KGW.karte('So gehts', `<div>
    <div class="kgw-info"><b>Danach</b><span>4 h zirkulieren lassen, dann nachmessen</span></div>
    <div class="kgw-info"><b>Zu hoch</b><span>Wasser teilweise ersetzen</span></div></div>`));
  let vol = 0;
  const rechne = () => {
    const diff = KGW.zahl('taZiel') - KGW.zahl('taIst'), hoch = diff <= 0;
    $('ergebnis').classList.toggle('hidden', hoch); $('zuHoch').classList.toggle('hidden', !hoch);
    const [m, e] = KGW.gewicht(Math.max(0, diff) * vol * 1.8);
    $('menge').textContent = m; $('einheit').textContent = e;
    $('weg').textContent = hoch ? '' : `${KGW.fmt(diff, 0)} mg/L × ${KGW.fmt(vol, 1)} m³ × 1.8 g`;
  };
  const volumen = KGW.poolVolumen(inhalt, v => { vol = v; rechne(); });
  inhalt.prepend($('pvKarte'));
  KGW.binden($('taKarte'), rechne, 'kgw-alk-');
  vol = volumen(); rechne();
});
</script>
</body>
</html>
