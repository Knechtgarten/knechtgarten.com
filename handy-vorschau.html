<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=61"></script>
<title>Handy-Vorschau – Knechtgarten</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* Handy-Vorschau am PC: die Handy-Seiten in Originalgrösse (390 × 844, wie ein aktuelles Handy) – zum Anschauen und für Bildschirmfotos.
   Gleiche Anmeldung wie das Tool (gleiche Seite), also nichts extra einloggen. */
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#E9EDF1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#232B35;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 16px 30px;}
.leiste{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;}
.leiste button{all:unset;cursor:pointer;font-size:13px;font-weight:600;color:#4C5C70;background:#fff;border:1px solid #D5DBE1;border-radius:8px;padding:6px 12px;}
.leiste button.on{background:#323E4E;border-color:#323E4E;color:#fff;}
.leiste .neu{font-weight:400;}
.handy{width:414px;padding:12px;border-radius:46px;background:#1F252D;box-shadow:0 20px 50px rgba(35,43,53,.3);}
.handy iframe{display:block;width:390px;height:844px;border:0;border-radius:34px;background:#F5F7F9;}
.klein{font-size:12px;color:#6B7079;}
</style>
</head>
<body>
<div class="leiste" id="leiste"></div>
<div class="handy"><iframe id="f" title="Handy-Vorschau"></iframe></div>
<div class="klein">390 × 844 Pixel wie ein Handy · Link in der Adresszeile merken, z. B. ?seite=kontakte</div>
<script>
const SEITEN = [['heute', 'Start', 'heute-live-v1.html'], ['kontakte', 'Kontakte', 'kontakte-handy-live-v1.html'], ['pendenzen', 'Pendenzen', 'pendenzen-app.html'],
  ['werkzeuge', 'Werkzeuge', 'werkzeuge-live-v1.html'], ['fotos', 'Fotos', 'fotos-live-v1.html'], ['planer', 'Planer', 'einsatzplaner-live-v1.html']];
const f = document.getElementById('f'), l = document.getElementById('leiste');
function zeige(k){ const s = SEITEN.find(x => x[0] === k) || SEITEN[0];
  f.src = s[2]; history.replaceState(null, '', '?seite=' + s[0]);
  l.querySelectorAll('[data-k]').forEach(b => b.classList.toggle('on', b.dataset.k === s[0])); }
l.innerHTML = SEITEN.map(([k, n]) => `<button type="button" data-k="${k}">${n}</button>`).join('') + '<button type="button" class="neu" id="neu">Neu laden</button>';
l.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if(b) zeige(b.dataset.k); if(e.target.id === 'neu') f.contentWindow.location.reload(); });
// Navigation innerhalb des Handys (Leiste unten) markiert oben die passende Seite
f.addEventListener('load', () => { try { const p = f.contentWindow.location.pathname.split('/').pop(); const s = SEITEN.find(x => x[2] === p);
  l.querySelectorAll('[data-k]').forEach(b => b.classList.toggle('on', !!s && b.dataset.k === s[0])); } catch(e){} });
zeige(new URLSearchParams(location.search).get('seite') || 'heute');
</script>
</body>
</html>
