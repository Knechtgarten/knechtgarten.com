<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=65"></script>
<title>Spritzmittel – Werkzeuge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#323E4E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kg-werkzeuge.js?v=10"></script>
<style>
.wahl{height:48px;border:1px solid #B9C0C8;border-radius:8px;padding:0 10px;font:inherit;font-size:16px;background:#fff;width:100%;color:#232B35;}
#mittelKarte{overflow:visible;} #mittelKarte .kgw-kopf{border-radius:10px 10px 0 0;}
.cb{position:relative;}
.cb input{padding-right:46px;}
.cbx{all:unset;cursor:pointer;position:absolute;right:4px;top:4px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#8B9097;}
.cbListe{position:absolute;left:0;right:0;top:52px;z-index:30;background:#fff;border:1px solid #D5DBE1;border-radius:8px;box-shadow:0 12px 32px rgba(35,43,53,.16);max-height:340px;overflow:auto;}
.cbListe .gr{font-size:11px;font-weight:600;letter-spacing:.05em;color:#6B7079;text-transform:uppercase;padding:10px 12px 4px;}
.cbListe button{all:unset;box-sizing:border-box;display:block;width:100%;padding:11px 12px;font-size:15px;cursor:pointer;}
.cbListe button:hover,.cbListe button.on{background:#F5F7F9;}
.cbListe .leer{padding:12px;font-size:13.5px;color:#6B7079;}
/* Fläche: eine kleine Zeile, damit sie als freiwillig erkennbar ist */
.flz{display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap;font-size:13px;color:#6B7079;}
.flz label{font-size:13.5px;color:#4C5C70;} .flz label span{color:#8B9097;}
.flz #l10Aendern{all:unset;cursor:pointer;font-weight:600;color:#4C5C70;text-decoration:underline;}
.flz .fl{margin-left:auto;width:150px;}
.flz .fl input{width:150px;height:34px;font-size:15px;}
.flz .cbx{width:30px;height:30px;top:2px;right:2px;}
.rad{height:52px;font-size:20px;font-weight:700;text-align:center;text-align-last:center;width:140px;}
.reihe{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px;}
.reihe .kgw-zahl{width:100%;}
.tab{width:100%;border-collapse:collapse;font-size:14px;}
.tab td{padding:7px 0;border-bottom:1px solid #F1F3F5;}
.tab td:last-child{text-align:right;font-weight:700;color:#323E4E;}
.tab tr:last-child td{border-bottom:0;}
.pz{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #F1F3F5;}
.pz:last-child{border-bottom:0;}
.pz span{flex:1;min-width:0;}
.pz small{display:block;color:#6B7079;font-size:12px;}
.pz.aus span{opacity:.5;}
.form{display:flex;flex-direction:column;gap:8px;}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:#6B7079;}
.form .zwei{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
.dos{display:grid;grid-template-columns:minmax(0,1fr) 70px 70px 28px;gap:6px;align-items:center;}
.knoepfe{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
.k1,.k2{all:unset;box-sizing:border-box;cursor:pointer;height:40px;padding:0 16px;border-radius:8px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;}
.k1{background:#323E4E;color:#fff;} .k2{border:1px solid #D5DBE1;color:#323E4E;background:#fff;}
.wlink{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:#323E4E;text-decoration:none;}
.wlink:hover{text-decoration:underline;}
</style>
</head>
<body>
<header class="app"><div class="wrap">
  <a class="backlink" href="index.html">Startseite</a>
  <div class="brand"><h1>Werkzeuge</h1></div>
  <span class="userbar hidden" id="userbar"><span id="userbarText"></span><button id="logoutBtn">Abmelden</button></span>
</div></header>
<main id="appMain"></main>
<script>
// Spritzmittel: Dosierung (Menge auf L Wasser) × Liter Brühe = Mittel in den Tank.
// Liter Brühe direkt oder aus der Fläche (L Brühe pro m² vom Produkt bzw. von Hand).
// Produkte in werkzeug_spritzmittel, bearbeiten mit Recht werkzeuge.spritzmittel_pflegen.
// Liter-Auswahl (auf dem Handy ein Drehrad)
const LITER = [...Array.from({ length: 30 }, (_, i) => i + 1), ...Array.from({ length: 14 }, (_, i) => 35 + i * 5), 120, 150, 200, 250, 300];
KGW.werkzeug('pflege_spritz', async inhalt => {
  const $ = id => document.getElementById(id), g = (id, alt) => KGW.lsGet('kgw-spritz-' + id, alt), f = KGW.fmt;
  let produkte = [], alle = [];
  const darfPflegen = !window.KG || !KG.darf || KG.darf('werkzeuge', 'spritzmittel_pflegen', 'an') !== 'N';
  const laden = async () => {
    const { data, error } = await KGW.sb.from('werkzeug_spritzmittel').select('*').order('sortierung').order('name');
    if(error) KGW.toast('Produkte konnten nicht geladen werden: ' + error.message, true);
    alle = data || []; produkte = alle.filter(p => p.aktiv);
  };
  await laden();

  // Ein Feld für beides: Mittel suchen (Liste) oder direkt eine Dosierung wie «0,5 %» / «3 ‰» eintippen
  inhalt.insertAdjacentHTML('beforeend', KGW.karte('Mittel', `<div class="cb"><input class="wahl" id="mittel" type="text" autocomplete="off" enterkeyhint="done"
      placeholder="Mittel suchen oder z. B. 0,5 % eingeben" aria-label="Mittel oder Dosierung">
      <button type="button" class="cbx" id="mittelLeer" aria-label="Feld leeren">${KG.icon('x', 16)}</button>
      <div class="cbListe hidden" id="mittelListe" role="listbox"></div></div>
    <div id="varianten"></div>
    <span class="kgw-klein" id="dosisText"></span>
    <a class="wlink hidden" id="wissenLink" target="_blank" rel="noopener">${KGW.svg(KG.pfad('link'), 15)}Nachschlagewerk</a>`, 'mittelKarte'));
  // Fläche (freiwillig) und Liter in einer Karte: es gilt, was zuletzt angefasst wurde
  inhalt.insertAdjacentHTML('beforeend', KGW.karte('Menge Brühe', `<div class="flz"><label for="flaeche">Fläche m² <span>· optional</span></label>
      <span class="hidden" id="flInfo" title="Richtwert vom Hersteller für Bäume und Sträucher – bei niedrigen Pflanzen tropfnass spritzen, braucht meist weniger.">Annahme <span id="l10Text"></span> ·
        <button type="button" id="l10Aendern">ändern</button></span>
      <div class="cb fl"><input class="kgw-zahl" id="flaeche" inputmode="decimal" autocomplete="off" placeholder="–" value="${KGW.esc(g('flaeche', ''))}">
        <button type="button" class="cbx" id="flLeer" aria-label="Fläche leeren">${KG.icon('x', 13)}</button></div></div>
    <div id="l10Feld" class="hidden">${KGW.feld('l10', 'Brühe pro 10 m² (L)', g('l10', '1'), 0.1)}</div>
    <div class="kgw-feld kgw-trenn"><label for="liter">Brühe (L)<span class="kgw-klein" id="lInfo" style="display:block"></span></label>
      <select class="wahl rad" id="liter">${LITER.map(l => `<option value="${l}">${l} L</option>`).join('')}</select></div>`, 'mengeKarte'));
  inhalt.insertAdjacentHTML('beforeend', KGW.karte('In den Tank', `<span class="kgw-klein" style="font-size:13px" id="tankName"></span>
    <div class="kgw-gross"><b id="menge"></b><span id="einheit"></span></div>
    <span class="kgw-klein" id="weg"></span><span class="kgw-klein hidden" id="umger"></span>
    <div class="kgw-warn hidden" id="hinweis" style="font-weight:600"></div>`));
  inhalt.insertAdjacentHTML('beforeend', KGW.karte('Umrechner', `<div class="reihe"><input class="kgw-zahl" id="uWert" inputmode="decimal" autocomplete="off" value="${KGW.esc(g('uWert', '100'))}" aria-label="Wert">
      <select class="wahl" id="uEinh" aria-label="Einheit">${['mg', 'g', 'kg', 'ml', 'L'].map(e => `<option${e === g('uEinh', 'g') ? ' selected' : ''}>${e}</option>`).join('')}</select></div>
    ${KGW.feld('dichte', 'Dichte (g pro ml)', g('dichte', '1'), 0.05)}<span class="kgw-hinweis">Wasser = 1. Ohne genaue Dichte ist g ↔ ml nur ungefähr.</span>
    <table class="tab" id="uTab"></table>
    <div class="kgw-trenn" style="display:flex;flex-direction:column;gap:10px">
      <div class="reihe"><input class="kgw-zahl" id="kWert" inputmode="decimal" autocomplete="off" value="${KGW.esc(g('kWert', '0.5'))}" aria-label="Konzentration">
        <select class="wahl" id="kEinh" aria-label="Konzentration in">${[['proz', '%'], ['prom', '‰'], ['proL', 'ml pro L']].map(([v, t]) => `<option value="${v}"${v === g('kEinh', 'proz') ? ' selected' : ''}>${t}</option>`).join('')}</select></div>
      <table class="tab" id="kTab"></table></div>`, 'umKarte'));
  if(darfPflegen) inhalt.insertAdjacentHTML('beforeend', KGW.karte('Produktliste', '<div id="liste"></div><div class="knoepfe"><button type="button" class="k2" id="neuProdukt">' + KGW.svg(KG.pfad('plus'), 15) + 'Produkt</button></div>', 'listeKarte'));

  let quelle = g('quelle', 'liter'), l10Offen = false;
  // Liter ins Drehrad setzen; krumme Werte (aus der Fläche) bekommen einen eigenen Eintrag
  const literSetzen = v => {
    const s = $('liter'), w = String(+(+v).toFixed(1));
    s.querySelectorAll('option[data-x]').forEach(o => o.remove());
    if(!LITER.some(l => String(l) === w) && +w > 0){
      const o = document.createElement('option'); o.value = w; o.textContent = f(+w, 1) + ' L'; o.dataset.x = '1';
      const nach = [...s.options].find(x => +x.value > +w); s.insertBefore(o, nach || null);
    }
    s.value = w; if(s.value !== w) s.value = '10';
  };
  const ausFlaeche = () => {
    const A = KGW.zahl('flaeche');
    if(A > 0){ quelle = 'flaeche'; literSetzen(A * KGW.zahl('l10') / 10); KGW.lsSet('kgw-spritz-liter', $('liter').value); }
    else quelle = 'liter';
    KGW.lsSet('kgw-spritz-quelle', quelle);
  };
  let selId = g('produkt', '');
  // Umrechner und Produktliste: zugeklappt, Klick auf den Kopf öffnet
  const klappbar = id => {
    const k = $(id); if(!k) return;
    const kopf = k.querySelector('.kgw-kopf'), body = k.querySelector('.kgw-body');
    body.classList.add('hidden');
    kopf.insertAdjacentHTML('beforeend', KGW.svg('<path d="M6 9l6 6 6-6"/>', 18, 'class="kgw-chev" style="transition:transform .15s"'));
    Object.assign(kopf, { tabIndex: 0 }); kopf.setAttribute('role', 'button'); kopf.setAttribute('aria-expanded', 'false'); kopf.style.cursor = 'pointer';
    const um = () => { const auf = body.classList.toggle('hidden') === false; kopf.setAttribute('aria-expanded', auf); kopf.querySelector('.kgw-chev').style.transform = auf ? 'rotate(180deg)' : ''; };
    kopf.addEventListener('click', um);
    kopf.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); um(); } });
  };
  klappbar('umKarte'); klappbar('listeKarte');
  const akt = () => produkte.find(p => p.id === selId);
  // eingetippte Dosierung: «0,5 %», «0.5», «3 ‰», «3 promille», «5 ml/L» → Menge pro Liter
  const eigeneDosis = txt => {
    const m = String(txt).trim().replace(',', '.').match(/^(\d+(?:\.\d+)?)\s*(%|prozent|‰|promille|ml\/l|g\/l|ml|g)?$/i);
    if(!m) return null;
    const v = +m[1], u = (m[2] || '%').toLowerCase();
    return { proL: u === '%' || u === 'prozent' ? v * 10 : v };
  };
  const listeZeigen = () => {
    const txt = $('mittel').value.trim().toLowerCase(), p = akt();
    if(eigeneDosis(txt)){ $('mittelListe').classList.add('hidden'); return; }
    const treffer = produkte.filter(x => !txt || (p && p.name.toLowerCase() === txt) || x.name.toLowerCase().includes(txt));
    const arten = [...new Set(treffer.map(x => x.art || 'Weitere'))];
    $('mittelListe').innerHTML = arten.map(a => `<div class="gr">${KGW.esc(a)}</div>` + treffer.filter(x => (x.art || 'Weitere') === a)
      .map(x => `<button type="button" role="option" data-pid="${x.id}"${p && x.id === p.id ? ' class="on"' : ''}>${KGW.esc(x.name)}</button>`).join('')).join('')
      || '<div class="leer">Kein Mittel gefunden. Für eine eigene Dosierung eine Zahl eingeben, z. B. 0,5 % oder 3 ‰.</div>';
    $('mittelListe').classList.remove('hidden');
    $('mittelListe').querySelectorAll('[data-pid]').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); waehlen(b.dataset.pid); }));
  };
  const waehlen = id => {
    selId = id; const p = akt();
    $('mittel').value = p ? p.name : ''; $('mittelListe').classList.add('hidden'); $('mittel').blur();
    KGW.lsSet('kgw-spritz-produkt', selId); KGW.lsSet('kgw-spritz-mittelText', $('mittel').value);
    varianten(); rechne();
  };
  const produktListe = () => {
    if(selId && !akt()) selId = '';
    $('mittel').value = akt() ? akt().name : g('mittelText', '');
  };
  const varianten = () => {
    const p = akt(), d = (p && p.dosierungen) || [];
    $('varianten').innerHTML = d.length > 1 ? KGW.seg('variante', d.map((x, i) => [i, x.n || 'Variante ' + (i + 1)]), 0) : '';
    $('varianten').querySelectorAll('[data-seg]').forEach(b => b.addEventListener('click', () => {
      $('varianten').querySelectorAll('[data-seg]').forEach(x => x.setAttribute('aria-pressed', x === b)); rechne();
    }));
    // Brühmenge pro Fläche: vom Mittel übernehmen; fehlt sie, gleich das Feld zeigen
    if(p && p.bruehe_l_m2) $('l10').value = String(+(p.bruehe_l_m2 * 10).toFixed(2));
    l10Offen = !(p && p.bruehe_l_m2);
    if(quelle === 'flaeche') ausFlaeche();
    if(p && p.dichte){ $('dichte').value = String(p.dichte); }
    $('wissenLink').classList.toggle('hidden', !(p && p.wissen_eintrag_id));
    if(p && p.wissen_eintrag_id) $('wissenLink').href = 'wissen-live-v1.html#e-' + p.wissen_eintrag_id;
  };
  // Dosierung als Menge pro Liter Wasser
  const dosis = () => {
    const p = akt();
    if(p){
      const d = p.dosierungen || [], i = +(KGW.segWert($('varianten'), 'variante') || 0), x = d[i] || d[0];
      return x ? { proL: KGW.num(x.menge) / (KGW.num(x.pro_l) || 1), e: p.einheit, text: `${f(KGW.num(x.menge), 0)} ${p.einheit} auf ${f(KGW.num(x.pro_l), 0)} L` } : { proL: 0, e: p.einheit, text: 'Keine Dosierung hinterlegt' };
    }
    const eig = eigeneDosis($('mittel').value);
    return eig ? { proL: eig.proL, e: 'ml', eigen: true, text: '' } : { proL: 0, e: 'ml', leer: true, text: '' };
  };
  const menge = (x, e) => x >= 1000 ? [f(x / 1000, 2), e === 'g' ? 'kg' : 'L'] : [f(x, x < 10 ? 1 : 0), e];
  const rechne = () => {
    const p = akt(), d = dosis(), A = KGW.zahl('flaeche'), mitFlaeche = A > 0;
    const L = KGW.zahl('liter');
    $('flInfo').classList.toggle('hidden', !mitFlaeche || l10Offen);
    $('l10Feld').classList.toggle('hidden', !mitFlaeche || !l10Offen);
    $('l10Text').textContent = `${f(KGW.zahl('l10'), 1)} L/10 m²`;
    $('flLeer').classList.toggle('hidden', !$('flaeche').value);
    // Fläche ausgegraut, wenn danach die Liter von Hand gewählt wurden
    $('flaeche').style.opacity = mitFlaeche && quelle === 'liter' ? '.45' : '';
    $('lInfo').textContent = mitFlaeche && quelle === 'flaeche' ? `aus ${f(A, 0)} m²` : mitFlaeche ? 'von Hand gewählt' : '';
    const m = d.proL * L, [mw, me] = menge(m, d.e);
    $('tankName').textContent = p ? p.name : d.eigen ? 'Eigene Dosierung (ml bzw. g)' : 'Mittel';
    $('menge').textContent = d.leer ? '–' : mw; $('einheit').textContent = d.leer ? '' : me;
    $('weg').textContent = `auf ${f(L, 1)} L Wasser`;
    // Dosierung nur zeigen, wenn sie sonst nirgends steht (Mittel mit nur einer Dosierung)
    const einzeln = p && (p.dosierungen || []).length === 1;
    $('dosisText').textContent = einzeln ? `${d.text} = ${f(d.proL / 10, 2)} %` : '';
    $('dosisText').classList.toggle('hidden', !einzeln);
    const dichte = p && p.dichte;
    $('umger').classList.toggle('hidden', !dichte || d.leer);
    if(dichte){ const [uw, ue] = menge(d.e === 'g' ? m / dichte : m * dichte, d.e === 'g' ? 'ml' : 'g'); $('umger').textContent = `≈ ${uw} ${ue}`; }
    $('hinweis').classList.toggle('hidden', !(p && p.hinweis)); $('hinweis').textContent = p && p.hinweis ? p.hinweis : '';
  };
  const umrechnen = () => {
    const w = KGW.zahl('uWert'), e = $('uEinh').value, di = KGW.zahl('dichte') || 1;
    const gramm = { mg: w / 1000, g: w, kg: w * 1000, ml: w * di, L: w * 1000 * di }[e];
    const r = [['mg', gramm * 1000], ['g', gramm], ['kg', gramm / 1000], ['ml', gramm / di], ['L', gramm / di / 1000]].filter(([u]) => u !== e);
    $('uTab').innerHTML = r.map(([u, v]) => `<tr><td>${u}</td><td>${f(v, v < 1 ? 4 : v < 100 ? 2 : 0)}</td></tr>`).join('');
    const k = KGW.zahl('kWert'), ke = $('kEinh').value, proL = ke === 'proz' ? k * 10 : k;
    // 1 ‰ = 1 ml (bzw. g) pro L
    $('kTab').innerHTML = [['proz', '%', proL / 10], ['prom', '‰ = ml (bzw. g) pro L', proL], ['p10', 'ml (bzw. g) auf 10 L', proL * 10]]
      .filter(([v]) => v !== ke && !(ke === 'proL' && v === 'prom'))
      .map(([, t, v]) => `<tr><td>${t}</td><td>${f(v, 2)}</td></tr>`).join('');
  };

  produktListe(); varianten();
  $('mittel').addEventListener('focus', listeZeigen);
  $('mittel').addEventListener('input', () => {
    selId = ''; KGW.lsSet('kgw-spritz-produkt', ''); KGW.lsSet('kgw-spritz-mittelText', $('mittel').value);
    listeZeigen(); varianten(); rechne();
  });
  $('mittel').addEventListener('blur', () => setTimeout(() => $('mittelListe').classList.add('hidden'), 150));
  $('mittel').addEventListener('keydown', e => { if(e.key === 'Enter'){ const b = $('mittelListe').querySelector('[data-pid]'); if(b && !eigeneDosis($('mittel').value)) waehlen(b.dataset.pid); else $('mittel').blur(); } });
  $('mittelLeer').addEventListener('click', () => { selId = ''; $('mittel').value = ''; KGW.lsSet('kgw-spritz-produkt', ''); KGW.lsSet('kgw-spritz-mittelText', ''); varianten(); rechne(); $('mittel').focus(); });
  KGW.binden($('mengeKarte'), () => { ausFlaeche(); rechne(); }, 'kgw-spritz-');
  $('liter').addEventListener('change', () => { quelle = 'liter'; KGW.lsSet('kgw-spritz-quelle', quelle); KGW.lsSet('kgw-spritz-liter', $('liter').value); rechne(); });
  $('l10Aendern').addEventListener('click', () => { l10Offen = true; rechne(); $('l10').focus(); });
  $('flLeer').addEventListener('click', () => { $('flaeche').value = ''; KGW.lsSet('kgw-spritz-flaeche', ''); quelle = 'liter'; KGW.lsSet('kgw-spritz-quelle', quelle); rechne(); });
  literSetzen(g('liter', '10'));
  KGW.binden($('umKarte'), umrechnen, 'kgw-spritz-');
  ['uEinh', 'kEinh'].forEach(id => $(id).addEventListener('change', () => { KGW.lsSet('kgw-spritz-' + id, $(id).value); umrechnen(); }));
  rechne(); umrechnen();

  // --- Produktliste bearbeiten ------------------------------------------------
  if(!darfPflegen) return;
  const liste = () => {
    $('liste').innerHTML = alle.map(p => `<div class="pz${p.aktiv ? '' : ' aus'}"><span><b>${KGW.esc(p.name)}</b><small>${KGW.esc([p.art, p.hersteller].filter(Boolean).join(' · '))}${p.aktiv ? '' : ' · ausgeblendet'}</small></span>
      <button type="button" class="kg-ibtn" data-bearb="${p.id}" aria-label="Bearbeiten" title="Bearbeiten">${KG.icon('edit', 14)}</button>
      <button type="button" class="kg-ibtn danger" data-loesch="${p.id}" aria-label="Löschen" title="Löschen">${KG.icon('trash', 14)}</button></div>`).join('') || '<div class="kgw-leer">Noch keine Produkte.</div>';
    $('liste').querySelectorAll('[data-bearb]').forEach(b => b.addEventListener('click', () => formular(alle.find(p => p.id === b.dataset.bearb))));
    $('liste').querySelectorAll('[data-loesch]').forEach(b => b.addEventListener('click', async () => {
      const p = alle.find(x => x.id === b.dataset.loesch);
      if(!confirm(`«${p.name}» wirklich löschen?`)) return;
      const { error } = await KGW.sb.from('werkzeug_spritzmittel').delete().eq('id', p.id);
      if(error){ KGW.toast('Löschen ging nicht: ' + error.message, true); return; }
      await neuLaden();
    }));
  };
  const neuLaden = async () => { await laden(); produktListe(); varianten(); rechne(); liste(); };
  const dosZeile = x => `<div class="dos"><input class="kgw-text" data-d="n" value="${KGW.esc(x.n || '')}" placeholder="Bezeichnung" aria-label="Bezeichnung">
    <input class="kgw-text" data-d="menge" inputmode="decimal" value="${KGW.esc(x.menge ?? '')}" placeholder="Menge" aria-label="Menge">
    <input class="kgw-text" data-d="pro_l" inputmode="decimal" value="${KGW.esc(x.pro_l ?? '')}" placeholder="auf L" aria-label="auf Liter">
    <button type="button" class="kg-ibtn danger" data-dweg aria-label="Dosierung entfernen">${KG.icon('x', 12)}</button></div>`;
  const formular = p => {
    p = p || { name: '', einheit: 'ml', dosierungen: [{ n: 'Standard', menge: '', pro_l: 10 }], aktiv: true };
    $('liste').innerHTML = `<div class="form">
      <label>Name<input class="kgw-text" id="fName" value="${KGW.esc(p.name)}"></label>
      <div class="zwei"><label>Art<input class="kgw-text" id="fArt" value="${KGW.esc(p.art || '')}" placeholder="z. B. Fungizid"></label>
        <label>Hersteller<input class="kgw-text" id="fHerst" value="${KGW.esc(p.hersteller || '')}"></label></div>
      <div class="zwei"><label>Einheit<select class="kgw-text" id="fEinh"><option${p.einheit === 'ml' ? ' selected' : ''}>ml</option><option${p.einheit === 'g' ? ' selected' : ''}>g</option></select></label>
        <label>Dichte (g pro ml)<input class="kgw-text" id="fDichte" inputmode="decimal" value="${KGW.esc(p.dichte ?? '')}"></label></div>
      <label>Dosierungen (Menge auf L Wasser)</label><div id="fDos" style="display:flex;flex-direction:column;gap:6px">${(p.dosierungen || []).map(dosZeile).join('')}</div>
      <button type="button" class="k2" id="fDosNeu" style="align-self:flex-start">${KGW.svg(KG.pfad('plus'), 15)}Dosierung</button>
      <label>Brühe pro 10 m² (L)<input class="kgw-text" id="fBruehe" inputmode="decimal" value="${p.bruehe_l_m2 ? +(p.bruehe_l_m2 * 10).toFixed(3) : ''}"></label>
      <label>Wichtiger Hinweis<input class="kgw-text" id="fHinweis" value="${KGW.esc(p.hinweis || '')}" placeholder="nur wenn wirklich wichtig"></label>
      <label>Quelle (Link)<input class="kgw-text" id="fQuelle" value="${KGW.esc(p.quelle || '')}"></label>
      <label class="kgw-schalter"><input type="checkbox" id="fAktiv"${p.aktiv ? ' checked' : ''}>Im Rechner anzeigen</label>
      <div class="knoepfe"><button type="button" class="k2" id="fAbbr">Abbrechen</button><button type="button" class="k1" id="fSpeichern">${KG.icon('check', 15)}Speichern</button></div></div>`;
    const dosBinden = () => $('fDos').querySelectorAll('[data-dweg]').forEach(b => b.onclick = () => b.parentElement.remove());
    dosBinden();
    $('fDosNeu').addEventListener('click', () => { $('fDos').insertAdjacentHTML('beforeend', dosZeile({ pro_l: 10 })); dosBinden(); });
    $('fAbbr').addEventListener('click', liste);
    $('fSpeichern').addEventListener('click', async () => {
      const name = $('fName').value.trim(); if(!name){ KGW.toast('Name fehlt', true); return; }
      const dos = [...$('fDos').querySelectorAll('.dos')].map(z => ({ n: z.querySelector('[data-d="n"]').value.trim(),
        menge: KGW.num(z.querySelector('[data-d="menge"]').value), pro_l: KGW.num(z.querySelector('[data-d="pro_l"]').value) })).filter(x => x.menge && x.pro_l);
      const b10 = KGW.num($('fBruehe').value), di = KGW.num($('fDichte').value);
      const zeile = { name, art: $('fArt').value.trim() || null, hersteller: $('fHerst').value.trim() || null, einheit: $('fEinh').value, dosierungen: dos,
        bruehe_l_m2: b10 ? b10 / 10 : null, dichte: di || null, hinweis: $('fHinweis').value.trim() || null, quelle: $('fQuelle').value.trim() || null,
        aktiv: $('fAktiv').checked, geaendert_am: new Date().toISOString() };
      const { error } = p.id ? await KGW.sb.from('werkzeug_spritzmittel').update(zeile).eq('id', p.id) : await KGW.sb.from('werkzeug_spritzmittel').insert(zeile);
      if(error){ KGW.toast('Speichern ging nicht: ' + error.message, true); return; }
      KGW.toast('Gespeichert'); await neuLaden();
    });
  };
  $('neuProdukt').addEventListener('click', () => formular());
  liste();
});
</script>
</body>
</html>
