<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=25"></script>
<title>Salzzugabe – Werkzeuge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#323E4E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kg-werkzeuge.js?v=1"></script>
</head>
<body>
<header class="app"><div class="wrap">
  <a class="backlink" href="index.html">Startseite</a>
  <div class="brand"><h1>Werkzeuge</h1></div>
  <span class="userbar hidden" id="userbar"><span id="userbarText"></span><button id="logoutBtn">Abmelden</button></span>
</div></header>
<main id="appMain"></main>
<script>
// Salzzugabe: (TDS Ziel − TDS aktuell) × m³ ÷ 1000 = kg Salz, davon 85 % NaCl und 15 % MgCl₂ (aus dem bisherigen Pool-Rechner)
KGW.werkzeug('pool_salz', inhalt => {
  const $ = id => document.getElementById(id), g = (id, alt) => KGW.lsGet('kgw-salz-' + id, alt);
  inhalt.insertAdjacentHTML('beforeend', KGW.karte('TDS-Werte (mg/L)', `${KGW.feld('tdsIst', 'TDS aktuell', g('tdsIst', '190'), 50)}${KGW.feld('tdsZiel', 'TDS Ziel', g('tdsZiel', '1200'), 50)}
    <label class="kgw-schalter kgw-trenn"><input type="checkbox" id="nurNacl"${g('nurNacl', false) ? ' checked' : ''}>Nur NaCl (ohne MgCl₂)</label>`, 'tdsKarte'));
  inhalt.insertAdjacentHTML('beforeend', KGW.karte('Dosierung', `<div class="kgw-zeile"><span>NaCl</span></div><div class="kgw-gross"><b id="nacl"></b><span>kg</span></div>
    <div id="mgZeile"><div class="kgw-zeile kgw-trenn"><span>MgCl₂</span></div><div class="kgw-gross"><b id="mgcl"></b><span>kg</span></div></div>
    <span class="kgw-klein" id="weg"></span>`));
  inhalt.insertAdjacentHTML('beforeend', KGW.karte('So gehts', `<div>
    <div class="kgw-info"><b>Mischung</b><span>Salzelektrolyse: NaCl 85 %, MgCl₂ 15 %</span></div>
    <div class="kgw-info"><b>Wie</b><span>Schrittweise zugeben</span></div>
    <div class="kgw-info"><b>Danach</b><span>Nach 24 h nachmessen</span></div></div>`));
  let vol = 0;
  const rechne = () => {
    const diff = Math.max(0, KGW.zahl('tdsZiel') - KGW.zahl('tdsIst')), total = diff * vol / 1000, nur = $('nurNacl').checked;
    $('nacl').textContent = KGW.fmt(Math.round(nur ? total : total * 0.85), 0);
    $('mgcl').textContent = KGW.fmt(Math.round(total * 0.15), 0);
    $('mgZeile').classList.toggle('hidden', nur);
    $('weg').textContent = `${KGW.fmt(diff, 0)} mg/L × ${KGW.fmt(vol, 1)} m³ = ${KGW.fmt(total, 1)} kg Salz total`;
  };
  const volumen = KGW.poolVolumen(inhalt, v => { vol = v; rechne(); });
  inhalt.prepend($('pvKarte'));
  KGW.binden($('tdsKarte'), rechne, 'kgw-salz-');
  $('nurNacl').addEventListener('change', () => { KGW.lsSet('kgw-salz-nurNacl', $('nurNacl').checked); rechne(); });
  vol = volumen(); rechne();
});
</script>
</body>
</html>
