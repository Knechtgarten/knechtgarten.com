<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=43"></script>
<title>Dokument – Doku-Tools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#323E4E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kg-doku.js?v=8"></script>
<style>
.kgd-weg{display:flex;align-items:center;gap:6px;font-size:14px;color:#6B7079;flex-wrap:wrap;min-width:0;}
.kgd-weg a{color:#A63A52;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:2px;}
.kgd-weg b{color:#323E4E;font-size:15px;}
.kgd-zurueck svg{transform:rotate(90deg);}
</style>
</head>
<body>
<header class="app"><div class="wrap">
  <a class="backlink" href="index.html">Startseite</a>
  <div class="brand"><h1>Doku-Tools</h1></div>
  <span class="userbar hidden" id="userbar"><span id="userbarText"></span><button id="logoutBtn">Abmelden</button></span>
</div></header>
<nav class="subnav"><div class="wrap">
  <a href="doku-live-v1.html" class="on">Dokumente</a>
</div></nav>
<span class="kgd-weg" data-kg-seite="links"><a class="kgd-zurueck" href="doku-live-v1.html" id="ordnerLink"></a><span>/</span><b id="docTitel"></b></span>
<button type="button" class="kgd-btn ghost" data-kg-seite="rechts" id="datenBtn">Angaben</button>
<button type="button" class="kg-ibtn hidden" data-kg-seite="rechts" id="zahnrad" title="Vorlage bearbeiten" aria-label="Vorlage bearbeiten"></button>
<a class="kgd-status nein" data-kg-seite="rechts" id="driveStatus" target="_blank" rel="noopener">nicht im Drive</a>
<button type="button" class="kgd-btn ghost" data-kg-seite="rechts" id="driveBtn"></button>
<button type="button" class="kgd-btn ghost" data-kg-seite="rechts" id="ladenBtn"></button>
<button type="button" class="kgd-btn prim kg-haupt" data-kg-seite="rechts" id="druckBtn"></button>
<main id="appMain"></main>
<script>
// Dokument ausfüllen: Brief wie gedruckt, Daten-Fenster schwebt darüber (Werte im Brief hellblau, solange offen).
// Zahnrad (Recht doku/vorlagen): Brieftext direkt im Blatt bearbeiten, Felder sind fix (KGD.FELDER).
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
async function aufbau(main){
  const { esc, ic } = KGD, sb = KGD.sb;
  $('zahnrad').innerHTML = ic('gear'); $('driveBtn').innerHTML = ic('ordner') + 'In Drive ablegen'; $('ladenBtn').innerHTML = ic('herunterladen') + 'Herunterladen'; $('druckBtn').innerHTML = ic('drucken') + 'Drucken';
  $('ordnerLink').innerHTML = KG.icon('chev', 14);

  // Dokument / Kopie / neues Dokument laden
  let dokId = null, werte = null, vorlageId = P.get('v'), drive = null; // drive = Ablage-Spalten von doku_dokument
  const quelle = P.get('d') || P.get('kopie');
  if(quelle){
    const { data, error } = await sb.from('doku_dokument').select('*').eq('id', quelle).maybeSingle();
    if(error || !data){ main.innerHTML = '<div class="kgd-typen"><p class="kgd-hinweis">Dokument nicht gefunden.</p></div>'; return; }
    vorlageId = data.vorlage_id; werte = data.werte || {};
    if(P.get('d')){ dokId = data.id; drive = data; }
  }
  const { data: V, error: ve } = await sb.from('doku_vorlage').select('*, ordner:doku_ordner(name)').eq('id', vorlageId).maybeSingle();
  if(ve || !V){ main.innerHTML = '<div class="kgd-typen"><p class="kgd-hinweis">Vorlage nicht gefunden.</p></div>'; return; }
  const TYP = KGD.TYPEN[V.schluessel] || { daten: [], pflicht: () => '', dateiname: () => V.name };
  document.title = V.name + ' – Doku-Tools';
  $('docTitel').textContent = V.name; $('ordnerLink').insertAdjacentText('beforeend', V.ordner ? V.ordner.name : 'Dokumente');
  const PL = KGD.personen.filter(p => p.merkmale.includes('projektleiter') || p.merkmale.includes('bauleiter')), VA = KGD.personen.filter(p => p.merkmale.includes('vorarbeiter'));
  if(!werte){
    const ich = PL.find(p => p.id === KGD.ich) || PL[0];
    werte = { pl: ich ? ich.id : null, va: null };
  }
  let gespeichert = dokId ? JSON.stringify(werte) : null, admin = false;

  main.innerHTML = `<div class="kgd-adminband hidden" id="adminBand">${ic('gear')}<span class="t">Vorlage bearbeiten: Klick in den Text und ändere ihn direkt. Gilt für alle neuen Dokumente «${esc(V.name)}».</span>
      <button type="button" class="kgd-btn ghost" id="adminZu">Abbrechen</button><button type="button" class="kgd-btn prim" id="adminOk">Vorlage speichern</button></div>
    <div class="kgd-flaeche" id="flaeche"><div id="leisteSlot"></div><div class="kgd-rand" id="rand"></div>
      <div class="kgd-schleier" id="schleier"></div>
      <div class="kgd-daten" id="daten" role="dialog" aria-label="Angaben ausfüllen"><header><b>Angaben</b><span class="kgd-hinweis">alles andere steht schon</span></header>
        <div class="kgd-felder" id="felder"></div>
        <footer><button type="button" class="kgd-btn ghost" id="datenZu">Schliessen</button><button type="button" class="kgd-btn prim" id="datenOk">Fertig</button></footer></div></div>`;

  // Daten-Fenster je nach Dokumenttyp
  const opt = (liste, wert, leer) => (leer ? `<option value="">${leer}</option>` : '') + liste.map(p => `<option value="${p.id}"${p.id === wert ? ' selected' : ''}>${esc(p.name)}${p.id === KGD.ich ? ' (ich)' : ''} · ${esc(KGD.ROLLEN[p.rolle])}</option>`).join('');
  // Zeit = zwei Auswahlfelder: Stunde 05–21 und Minuten im Viertelstunden-Takt (alte Minute ausserhalb bleibt wählbar)
  const zeit = (id, wert) => {
    const [h, m] = (wert || '').split(':'), zwei = n => String(n).padStart(2, '0');
    const stunden = []; for(let i = 5; i <= 21; i++) stunden.push(zwei(i));
    const minuten = ['00', '15', '30', '45']; if(m && !minuten.includes(m)){ minuten.push(m); minuten.sort(); }
    const o = (L, w) => L.map(x => `<option value="${x}"${x === w ? ' selected' : ''}>${x}</option>`).join('');
    return `<div class="kgd-reihe" style="gap:4px;align-items:center"><select class="kgd-t" id="${id}H" aria-label="${id} Stunde"><option value="">–</option>${o(stunden, h)}</select>
      <span>:</span><select class="kgd-t" id="${id}M" aria-label="${id} Minuten">${o(minuten, m || '00')}</select></div>`;
  };
  const BAU = {
    // nur Strasse und Ort (z. B. Helikoptereinsatz): frei tippen/einfügen oder aus Easybill übernehmen
    adresse: () => `<div class="kgd-feld"><label for="adresse">Strasse Nr., PLZ Ort</label>
      <div class="kgd-reihe" style="align-items:stretch"><input class="kgd-t" id="adresse" autocomplete="off" placeholder="Ländteweg 6, 3600 Thun" value="${esc([werte.strasse, werte.ort].filter(Boolean).join(', '))}">
        <button type="button" class="kgd-btn ghost" id="ebBtn" style="flex:none;height:36px">Aus Easybill</button></div>
      <div class="kgd-feld hidden" id="ebSuche" style="margin-top:6px"><input class="kgd-t" id="ebQ" autocomplete="off" placeholder="Kunde suchen (Name, Strasse, Ort oder Nummer)">
        <div class="kgd-menue hidden" id="ebMenue"></div></div>
      <span class="kgd-hinweis" id="adrInfo"></span></div>`,
    kunde: () => `<div class="kgd-feld"><label for="kunde">Kunde oder Adresse</label><input class="kgd-t" id="kunde" autocomplete="off" placeholder="Name, Strasse oder Ort suchen">
      <div class="kgd-menue hidden" id="kundeMenue"></div><span class="kgd-hinweis" id="kundeInfo"></span></div>`,
    termin: () => `<div class="kgd-feld"><label for="datum">Datum</label><input class="kgd-t" type="date" id="datum" value="${esc(werte.datum || '')}" style="max-width:180px"></div>
      <div class="kgd-reihe"><div class="kgd-feld"><label for="vonH">von <small class="opt">optional</small></label>${zeit('von', werte.von)}</div>
      <div class="kgd-feld"><label for="bisH">bis <small class="opt">optional</small></label>${zeit('bis', werte.bis)}</div></div>
      <span class="kgd-hinweis">Ohne Zeit steht: «die genaue Zeit geben wir kurzfristig bekannt».</span>`,
    zeitraum: () => `<div class="kgd-reihe"><div class="kgd-feld"><label for="vonDatum">von <small class="opt">optional</small></label><input class="kgd-t" type="date" id="vonDatum" value="${esc(werte.von_datum || '')}"></div>
      <div class="kgd-feld"><label for="bisDatum">bis <small class="opt">optional</small></label><input class="kgd-t" type="date" id="bisDatum" value="${esc(werte.bis_datum || '')}"></div></div>
      <span class="kgd-hinweis">Ohne Datum steht: «in nächster Zeit».</span>`,
    arbeiten: () => `<div class="kgd-feld"><label for="arbeiten">Arbeiten</label><input class="kgd-t" id="arbeiten" autocomplete="off" value="${esc(werte.arbeiten || 'Umgebungsarbeiten')}"></div>`,
    zusatz: () => `<div class="kgd-feld"><label for="zusatz">Zusatz <small class="opt">optional</small></label>
      <textarea class="kgd-t" id="zusatz" rows="2" style="height:auto;padding:7px 10px;resize:vertical" placeholder="z. B. Die Zu- und Wegfahrt ist via Schlüsselackerweg möglich.">${esc(werte.zusatz || '')}</textarea></div>`,
    pl: () => `<div class="kgd-feld"><label for="pl">Projektleiter</label><select class="kgd-t" id="pl">${opt(PL, werte.pl, PL.length ? '' : 'niemand mit Merkmal Projektleiter oder Bauführer')}</select></div>`,
    va: () => `<div class="kgd-feld"><label for="va">Vorarbeiter vor Ort <small class="opt">optional</small></label><select class="kgd-t" id="va">${opt(VA, werte.va, 'keiner')}</select></div>`
  };
  $('felder').innerHTML = TYP.daten.map(k => BAU[k] ? BAU[k]() : '').join('');
  delete werte.offen; // früher Haken «Zeit noch nicht bekannt», jetzt = von/bis leer

  let ed = null;
  const zeichnen = () => { ed = KGD.brief($('rand'), V.html, werte, admin ? 'admin' : ($('daten').classList.contains('hidden') ? 'druck' : 'fuellen')); };
  const geaendert = () => { zeichnen(); statusZeigen(); };
  function statusZeigen(){
    const s = KGD.driveStatus(drive, werte), el = $('driveStatus');
    el.className = 'kgd-status ' + s.art + (admin ? ' hidden' : '');
    el.innerHTML = s.art === 'ja' ? ic('check', 13) + esc('im Drive · ' + ((drive.drive_pfad || '').split(' › ').pop() || 'abgelegt')) : esc(s.text);
    if(s.link){ el.href = s.link; el.title = 'Im Drive öffnen: ' + (drive.drive_pfad || ''); } else { el.removeAttribute('href'); el.removeAttribute('title'); }
  }
  const an = (id, ev, fn) => { const el = $(id); if(el) el.addEventListener(ev, fn); };
  an('datum', 'input', e => { werte.datum = e.target.value; geaendert(); });
  ['von', 'bis'].forEach(k => ['H', 'M'].forEach(t => an(k + t, 'change', () => {
    const h = $(k + 'H').value; werte[k] = h ? h + ':' + $(k + 'M').value : ''; geaendert();
  })));
  an('zusatz', 'input', e => { werte.zusatz = e.target.value.trim(); geaendert(); });
  an('vonDatum', 'input', e => { werte.von_datum = e.target.value; geaendert(); });
  an('bisDatum', 'input', e => { werte.bis_datum = e.target.value; geaendert(); });
  an('arbeiten', 'input', e => { werte.arbeiten = e.target.value.trim(); geaendert(); });
  an('pl', 'change', e => { werte.pl = e.target.value || null; geaendert(); });
  an('va', 'change', e => { werte.va = e.target.value || null; geaendert(); });

  // Adresse: «Strasse Nr., PLZ Ort»; der Easybill-Name bleibt unsichtbar und hilft nur beim Finden des Drive-Ordners
  if($('adresse')){
    const a = $('adresse');
    const info = () => { $('adrInfo').textContent = werte.kunde_name ? `Kunde: ${werte.kunde_name} (Name kommt nicht aufs Blatt)` : ''; };
    a.addEventListener('input', () => {
      const t = a.value.split(','); werte.strasse = t[0].trim(); werte.ort = t.slice(1).join(',').trim();
      werte.kunde_name = ''; werte.kunde_id = null; info(); geaendert();
    });
    an('ebBtn', 'click', () => { const s = $('ebSuche'); s.classList.toggle('hidden'); if(!s.classList.contains('hidden')) $('ebQ').focus(); });
    const q = $('ebQ'), m = $('ebMenue'); let lauf = 0, treffer = [], warte = null;
    q.addEventListener('input', () => { clearTimeout(warte); warte = setTimeout(async () => {
      const text = q.value.trim(), nr = ++lauf;
      if(text.length < 2){ m.classList.add('hidden'); return; }
      // Kundenliste (jede Nacht aus Easybill abgeglichen): schnell, und der Kunde wird beim Dokument gespeichert (Kontakte zeigen es dort)
      const { data, error } = await sb.rpc('kunde_suche', { q: text, anzahl: 12 });
      if(nr !== lauf) return;
      if(error){ m.innerHTML = `<div class="kopfzeile">Suche fehlgeschlagen: ${esc(error.message)}</div>`; m.classList.remove('hidden'); return; }
      treffer = data || [];
      m.innerHTML = treffer.length ? treffer.map((k, i) => `<button type="button" data-i="${i}"><b>${esc(k.name || '')}</b><small>${esc([k.strasse, [k.plz, k.ort].filter(Boolean).join(' ')].filter(Boolean).join(', ') || 'keine Adresse')}${k.kundennummer ? ' · Nr. ' + esc(k.kundennummer) : ''}</small></button>`).join('')
        : '<div class="kopfzeile">Kein Kunde gefunden.</div>';
      m.classList.remove('hidden');
    }, 250); });
    m.addEventListener('mousedown', e => {
      const b = e.target.closest('button'); if(!b) return; e.preventDefault();
      const k = treffer[+b.dataset.i];
      werte.strasse = k.strasse || ''; werte.ort = [k.plz, k.ort].filter(Boolean).join(' '); werte.kunde_name = k.name || ''; werte.kunde_id = k.id;
      a.value = [werte.strasse, werte.ort].filter(Boolean).join(', ');
      m.classList.add('hidden'); $('ebSuche').classList.add('hidden'); q.value = ''; info(); geaendert();
    });
    q.addEventListener('blur', () => setTimeout(() => m.classList.add('hidden'), 180));
    info();
  }

  // Kunde suchen (Kundenliste, nur lesen) oder Adresse frei eingeben; aufs Blatt kommen nur Strasse und Ort
  if($('kunde')){
    const k = $('kunde'), m = $('kundeMenue');
    const anzeigen = () => {
      k.value = werte.kunde_name || KGD.adresse(werte);
      $('kundeInfo').textContent = werte.kunde_id ? `Aufs Blatt: ${KGD.adresse(werte) || 'keine Adresse hinterlegt'} (ohne Name)` : KGD.adresse(werte) ? 'Adresse von Hand, kein Kunde verknüpft' : '';
    };
    const kname = x => x.name || x.firma || [x.vorname, x.nachname].filter(Boolean).join(' ') || '(ohne Name)';
    let lauf = 0, treffer = [];
    const suchen = async () => {
      const q = k.value.trim().replace(/[,()%*]/g, ' ').trim(), nr = ++lauf;
      if(q.length < 2){ m.classList.add('hidden'); return; }
      const { data } = await sb.from('kunde').select('id,name,firma,vorname,nachname,strasse,plz,ort')
        .or(`name.ilike.%${q}%,firma.ilike.%${q}%,nachname.ilike.%${q}%,strasse.ilike.%${q}%,ort.ilike.%${q}%`).order('name').limit(8);
      if(nr !== lauf) return;
      treffer = data || [];
      m.innerHTML = '<div class="kopfzeile">Kunden aus der Kundenliste</div>' + treffer.map((x, i) => `<button type="button" data-i="${i}"><b>${esc(kname(x))}</b><small>${esc([x.strasse, [x.plz, x.ort].filter(Boolean).join(' ')].filter(Boolean).join(', ') || 'keine Adresse')}</small></button>`).join('')
        + `<button type="button" data-frei="1"><b>«${esc(k.value.trim())}» als Adresse übernehmen</b><small>Strasse Nr., PLZ Ort</small></button>`;
      m.classList.remove('hidden');
    };
    let warte = null;
    k.addEventListener('input', () => { clearTimeout(warte); warte = setTimeout(suchen, 220); });
    k.addEventListener('focus', () => k.select());
    k.addEventListener('blur', () => setTimeout(() => { m.classList.add('hidden'); anzeigen(); }, 180));
    m.addEventListener('mousedown', e => {
      const b = e.target.closest('button'); if(!b) return; e.preventDefault();
      if(b.dataset.frei){ const t = k.value.split(','); werte.kunde_id = null; werte.kunde_name = ''; werte.strasse = t[0].trim(); werte.ort = (t.slice(1).join(',') || '').trim(); }
      else { const x = treffer[+b.dataset.i]; werte.kunde_id = x.id; werte.kunde_name = kname(x); werte.strasse = x.strasse || ''; werte.ort = [x.plz, x.ort].filter(Boolean).join(' '); }
      m.classList.add('hidden'); k.blur(); anzeigen(); geaendert();
    });
    anzeigen();
  }

  // Daten-Fenster auf/zu
  const fenster = auf => { $('daten').classList.toggle('hidden', !auf); $('schleier').classList.toggle('hidden', !auf); zeichnen(); };
  an('datenBtn', 'click', () => fenster(true));
  an('datenOk', 'click', () => { fenster(false); speichern(); });
  an('datenZu', 'click', () => fenster(false));
  an('schleier', 'click', () => fenster(false));

  // Speichern (Kopiervorlage in «Zuletzt erstellt»), nur wenn sich etwas geändert hat
  async function speichern(){
    const json = JSON.stringify(werte); if(json === gespeichert) return true;
    const zeile = { vorlage_id: V.id, kunde_id: werte.kunde_id || null, werte, adresse: KGD.adresse(werte) || null, datum: werte.datum || null, geaendert_am: new Date().toISOString() };
    const r = dokId ? await sb.from('doku_dokument').update(zeile).eq('id', dokId).select('id').single() : await sb.from('doku_dokument').insert(zeile).select('id').single();
    if(r.error){ KGD.toast('Speichern fehlgeschlagen: ' + r.error.message, true); return false; }
    dokId = r.data.id; gespeichert = json;
    history.replaceState(null, '', 'doku-dokument-live-v1.html?d=' + dokId);
    return true;
  }
  const bereit = () => { const f = TYP.pflicht(werte); if(f){ KGD.toast(f + ' Bitte bei «Angaben» ergänzen.', true); fenster(true); return false; } return true; };

  // In Drive ablegen: mit Google verbinden (einmal), Kundenordner vorschlagen, bestätigen, PDF hochladen
  async function ablegen(){
    if(!bereit() || !await speichern()) return false;
    let token;
    try { token = await KGD.googleToken(); } catch(e){ KGD.toast(e.message, true); return false; }
    if(!token){
      try { await KGD.gsiLaden(); } catch(e){ KGD.toast(e.message, true); return false; }
      const ok = await KGD.dialog(`<h3>Mit Google verbinden</h3><p>Damit das Tool PDFs in die Kundenordner ablegen kann, braucht es einmal deine Erlaubnis für Google Drive. Danach geht es ohne Nachfrage.</p>`,
        [['Abbrechen', 'ghost', null], ['Mit Google verbinden', 'prim', 'los']], (el, zu) => {
          el.querySelector('[data-i="1"]').addEventListener('click', e => { e.stopPropagation(); KGD.googleVerbinden().then(() => zu('ok'), f => { KGD.toast(f.message, true); zu(null); }); });
        });
      if(ok !== 'ok') return false;
    }
    let vorschlaege;
    $('driveBtn').disabled = true; KGD.toast('Suche Kundenordner …');
    try {
      vorschlaege = await KGD.ordnerVorschlag(werte);
      vorschlaege = await Promise.all(vorschlaege.map(async v => ({ ...v, ziel: await KGD.zielOrdner(v) })));
    } catch(e){ KGD.toast(e.message, true); $('driveBtn').disabled = false; return false; }
    $('driveBtn').disabled = false;
    const name = KGD.dateiName(TYP.dateiname(werte)), schon = drive && drive.drive_datei_id;
    const wahl = (vorschlaege.map((v, i) => `<label><input type="radio" name="ziel" value="${i}"${i === 0 && !schon ? ' checked' : ''}><span><b>${esc(v.ziel.pfad)}</b><small>${esc(v.gruende.join(' · ') || 'ähnlicher Name')}</small></span></label>`).join(''))
      + `<label><input type="radio" name="ziel" value="link"${!vorschlaege.length && !schon ? ' checked' : ''}><span><b>Anderer Ordner</b><small>Link des Drive-Ordners einfügen</small>
          <input class="kgd-t" id="zielLink" placeholder="https://drive.google.com/drive/folders/…" style="margin-top:6px" autocomplete="off"></span></label>`;
    let form = null;
    const los = await KGD.dialog(`<h3>In Drive ablegen</h3>
      ${schon ? `<div class="kgd-wahl"><label><input type="radio" name="ziel" value="ersetzen" checked><span><b>Datei ersetzen</b><small>liegt schon in ${esc(drive.drive_pfad || 'Drive')}</small></span></label></div><p class="kgd-hinweis">oder neu ablegen in:</p>` : ''}
      ${vorschlaege.length ? '' : '<p>Kein passender Kundenordner gefunden.</p>'}
      <div class="kgd-wahl">${wahl}</div>
      <div class="kgd-feld"><label for="zielName">Dateiname</label><input class="kgd-t" id="zielName" value="${esc(name)}" autocomplete="off"></div>`,
      [['Abbrechen', 'ghost', null], ['Ablegen', 'prim', 'los']], el => {
        form = el;
        const link = el.querySelector('#zielLink');
        link.addEventListener('focus', () => { el.querySelector('input[value="link"]').checked = true; });
      });
    if(los !== 'los') return false;
    const sel = (form.querySelector('input[name="ziel"]:checked') || {}).value, dname = KGD.dateiName(form.querySelector('#zielName').value.replace(/\.pdf$/i, '') || TYP.dateiname(werte));
    let ziel, ersetzen = null;
    try {
      if(sel === 'ersetzen'){ ziel = { id: drive.drive_ordner_id, pfad: drive.drive_pfad }; ersetzen = drive.drive_datei_id; }
      else if(sel === 'link') ziel = await KGD.ordnerAusLink(form.querySelector('#zielLink').value.trim());
      else if(sel != null) ziel = vorschlaege[+sel].ziel;
      else { KGD.toast('Bitte einen Ordner wählen.', true); return false; }
      $('driveBtn').disabled = true; KGD.toast('Lege ab …');
      const pdf = await KGD.pdf(V.html, werte, dname, true);
      const r = await KGD.hochladen(pdf.output('blob'), dname, ziel.id, ersetzen);
      const zeile = { drive_datei_id: r.id, drive_ordner_id: ziel.id, drive_pfad: ziel.pfad, drive_stand: JSON.stringify(werte), drive_abgelegt_am: new Date().toISOString() };
      const { error } = await sb.from('doku_dokument').update(zeile).eq('id', dokId);
      if(error) throw new Error('Abgelegt, aber nicht vermerkt: ' + error.message);
      drive = { ...(drive || {}), ...zeile }; statusZeigen();
      KGD.toast('Abgelegt in ' + ziel.pfad);
      return true;
    } catch(e){ KGD.toast(e.message || String(e), true); return false; }
    finally { $('driveBtn').disabled = false; }
  }
  // Drucken/Herunterladen ohne aktuelle Ablage: nachfragen, ob zusätzlich ablegen
  async function nachfrage(was){
    const s = KGD.driveStatus(drive, werte).art;
    if(s === 'ja') return true;
    const w = await KGD.dialog(`<h3>${s === 'alt' ? 'Geändert seit der Ablage' : 'Noch nicht im Drive'}</h3>
      <p>${s === 'alt' ? 'Das Dokument im Drive ist nicht mehr aktuell. Willst du die neue Fassung auch ablegen?' : 'Willst du das Dokument zusätzlich im Kundenordner ablegen?'}</p>`,
      [['Abbrechen', 'ghost', null], ['Nur ' + was.toLowerCase(), 'ghost', 'nur'], ['Ablegen und ' + was.toLowerCase(), 'prim', 'beides']]);
    if(w === 'beides') await ablegen();
    return w !== null;
  }
  an('driveBtn', 'click', () => ablegen());
  an('druckBtn', 'click', async () => { if(!bereit()) return; await speichern(); if(!await nachfrage('Drucken')) return; KGD.drucken(V.html, werte); });
  an('ladenBtn', 'click', async () => {
    if(!bereit()) return; await speichern(); if(!await nachfrage('Herunterladen')) return;
    const b = $('ladenBtn'); b.disabled = true;
    try { await KGD.pdf(V.html, werte, TYP.dateiname(werte)); } catch(e){ KGD.toast(e.message || String(e), true); }
    b.disabled = false;
  });

  // Vorlage bearbeiten (Zahnrad)
  $('zahnrad').classList.toggle('hidden', !KGD.darfVorlagen);
  const adminSetzen = auf => {
    admin = auf;
    document.body.classList.toggle('kgd-admin', auf);
    $('adminBand').classList.toggle('hidden', !auf);
    ['datenBtn', 'zahnrad', 'driveBtn', 'driveStatus', 'ladenBtn', 'druckBtn'].forEach(id => $(id).classList.toggle('hidden', auf || (id === 'zahnrad' && !KGD.darfVorlagen)));
    $('leisteSlot').innerHTML = auf ? KGD.leisteHtml() : '';
    $('daten').classList.add('hidden'); $('schleier').classList.add('hidden');
    zeichnen();
    if(auf) KGD.editor(ed, $('kgdLeiste'));
  };
  an('zahnrad', 'click', () => adminSetzen(true));
  an('adminZu', 'click', () => adminSetzen(false));
  an('adminOk', 'click', async () => {
    const html = KGD.vorlageLesen(ed), b = $('adminOk'); b.disabled = true;
    const { error } = await sb.from('doku_vorlage').update({ html, geaendert_am: new Date().toISOString(), geaendert_von: KGD.ich }).eq('id', V.id);
    b.disabled = false;
    if(error){ KGD.toast('Vorlage konnte nicht gespeichert werden: ' + error.message, true); return; }
    V.html = html; KGD.toast('Vorlage gespeichert'); adminSetzen(false);
  });

  // neues Dokument: Daten-Fenster offen; geöffnetes Dokument: Brief wie gedruckt
  fenster(!dokId); statusZeigen();
}
KGD.start(aufbau);
</script>
</body>
