<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=60"></script>
<title>Stahl – Werkzeuge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#323E4E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kg-werkzeuge.js?v=10"></script>
<style>
.zei{position:relative;height:160px;width:342px;max-width:100%;margin:0 auto;}
.zei svg{position:absolute;left:0;top:0;}
.zf{position:absolute;display:flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#4C5C70;}
.zf.unter{flex-direction:column;gap:0;}
.zf input{width:60px;height:30px;box-sizing:border-box;border:1px solid #B9C0C8;border-radius:7px;text-align:center;font:inherit;font-size:14px;font-weight:400;color:#232B35;background:#fff;}
.zf.unter input{width:52px;height:26px;}
.zf input:focus{outline:none;border-color:#323E4E;}
.erg{display:flex;justify-content:flex-end;align-items:baseline;gap:6px;color:#323E4E;}
.erg b{font-size:24px;} .erg span{font-size:14px;} .erg small{font-size:12px;color:#6B7079;margin-right:auto;}
.einh{font-size:12px;color:#8B9097;}
</style>
</head>
<body>
<header class="app"><div class="wrap">
  <a class="backlink" href="index.html">Startseite</a>
  <div class="brand"><h1>Werkzeuge</h1></div>
  <span class="userbar hidden" id="userbar"><span id="userbarText"></span><button id="logoutBtn">Abmelden</button></span>
</div></header>
<main id="appMain"></main>
<script>
// Stahl: Gewicht aus den Massen (alle Masse in mm). Dichten in kg/dm³.
// Gefässe: Wände = Umfang × (Höhe + 2×25 mm oben + 50 mm unten), Gefäss mit Boden zusätzlich L × B.
// Profile: Querschnitt (mm²) × Dichte ÷ 1000 = kg pro m.
const DICHTE = { stahl: 7.85, edel: 7.93, alu: 2.70 };
const S = 'fill="none" stroke="#4C5C70" stroke-width="1.5" stroke-linejoin="round"';
// Kasten mit fein gezeichneten Abkantungen: oben 2×25 mm nach innen (Rand rundum), unten 50 mm Fuss nur ohne Boden
const KASTEN = '<path d="M80 52 H220 L280 22 H140 Z"/><path d="M80 52 V122 H220 V52"/><path d="M220 122 L280 92 V22"/>'
  + '<path d="M90 49 H212 L268 25 H148 Z" stroke-width=".8"/>'
  + '<path class="fuss" d="M80 122 L72 127 H226 L290 95 L280 92 M220 122 L226 127" stroke-width=".8"/>';
const FORMEN = [
  { k: 'ge', n: 'Gefäss / Hochbeet', h: 165, seg: [['mit', 'Mit Boden'], ['ohne', 'Ohne Boden']],
    svg: KASTEN + '<path d="M80 122 L140 92 V22 M140 92 H280" stroke-dasharray="4 4"/>',
    f: [['l', 'L', 114, 134, '1200'], ['b', 'B', 262, 110, '400'], ['h', 'H', 0, 74, '500'], ['t', 'Dicke', 0, 0, '3']],
    // Wände: Umfang × (Höhe + 2×25 oben); ohne Boden + 50 unten, mit Boden + Bodenfläche L × B
    rechne: (v, r, seg) => {
      const ohne = seg === 'ohne', m2 = 2 * (v.l + v.b) * (v.h + 50 + (ohne ? 50 : 0)) / 1e6 + (ohne ? 0 : v.l * v.b / 1e6);
      const fuss = document.querySelector('#karte-ge .fuss'); if(fuss) fuss.style.display = ohne ? '' : 'none';
      return [m2 * v.t * r, `${KGW.fmt(m2, 2)} m² Blech`];
    } },
  { k: 'bl', n: 'Blech', h: 120, svg: '<path d="M70 70 H230 L300 30 H140 Z"/><path d="M70 70 V77 H230 L300 37 V30 M230 70 V77"/>',
    f: [['l', 'L', 120, 86, '2000'], ['b', 'B', 268, 66, '1000'], ['t', 'Dicke', 0, 58, '3']],
    rechne: (v, r) => { const m2 = v.l * v.b / 1e6; return [m2 * v.t * r, `${KGW.fmt(m2, 2)} m²`]; } },
  { k: 'fl', n: 'Flachstahl', h: 112, svg: '<path d="M70 60 H270 L300 40 H100 Z"/><path d="M70 60 V68 H270 L300 48 V40 M270 60 V68"/>',
    f: [['l', 'L', 140, 78, '3000'], ['b', 'B', 268, 4, '100'], ['t', 'Dicke', 0, 46, '8']],
    profil: v => v.b * v.t },
  // Querschnitte: Wand grau gefüllt, Wandstärke s steht direkt auf der Wand
  { k: 'vk', n: 'Vierkantrohr', h: 160, svg: '<path d="M8 70 H22 V90 H8 Z M8 70 L126 36 H140 L22 70 M140 36 V56 L22 90"/><path d="M226 30 H310 V100 H226 Z M240 44 H296 V86 H240 Z" fill="#E1E5E9" fill-rule="evenodd"/>',
    f: [['l', 'L', 50, 96, '6000'], ['b', 'B', 232, 108, '60'], ['h', 'H', 150, 50, '40'], ['s', 's', 284, 44, '3', 'unter']],
    profil: v => v.b * v.h - Math.max(0, v.b - 2 * v.s) * Math.max(0, v.h - 2 * v.s) },
  { k: 'rr', n: 'Rundrohr', h: 160, svg: '<circle cx="16" cy="80" r="10"/><path d="M16 70 L148 36 M16 90 L148 56 M148 36 A10 10 0 0 1 148 56"/><path d="M226 65 a44 44 0 1 0 88 0 a44 44 0 1 0 -88 0 Z M238 65 a32 32 0 1 0 64 0 a32 32 0 1 0 -64 0 Z" fill="#E1E5E9" fill-rule="evenodd"/>',
    f: [['l', 'L', 56, 96, '6000'], ['d', 'Ø', 236, 116, '48.3'], ['s', 's', 284, 36, '3', 'unter']],
    profil: v => Math.PI / 4 * (v.d ** 2 - Math.max(0, v.d - 2 * v.s) ** 2) },
  { k: 'wi', n: 'Winkel', h: 160, svg: '<path d="M10 64 V92 H38 V88 H14 V64 Z M10 64 L142 30 H146 L14 64 M38 92 L170 58 V54 L38 88 M146 30 V54"/><path d="M244 30 V104 H330 V92 H256 V30 Z" fill="#E1E5E9"/>',
    f: [['l', 'L', 56, 96, '3000'], ['a', 'a', 258, 112, '50'], ['b', 'b', 172, 56, '50'], ['s', 's', 224, 0, '5', 'unter']],
    profil: v => (v.a + v.b - v.s) * v.s }
];
KGW.werkzeug('bau_stahl', inhalt => {
  const $ = id => document.getElementById(id), g = (id, alt) => KGW.lsGet('kgw-stahl-' + id, alt);
  inhalt.insertAdjacentHTML('beforeend', `<div style="display:flex;flex-direction:column;gap:6px">
    ${KGW.seg('mat', [['stahl', 'Stahl / Corten'], ['edel', 'Edelstahl'], ['alu', 'Alu']], g('seg-mat', 'stahl'))}
    <span class="einh" style="text-align:right">Masse in mm</span></div>`);
  const matBox = inhalt.lastElementChild;
  FORMEN.forEach(fo => {
    inhalt.insertAdjacentHTML('beforeend', KGW.karte(fo.n, `${fo.seg ? KGW.seg(fo.k + '-seg', fo.seg, g('seg-' + fo.k + '-seg', fo.seg[0][0])) : ''}<div class="zei" style="height:${fo.h}px">
      <svg aria-hidden="true" width="342" height="${fo.h}" viewBox="0 0 342 ${fo.h}" ${S}>${fo.svg}</svg>
      ${fo.f.map(([k, lab, x, y, std, cls]) => `<label class="zf${cls ? ' ' + cls : ''}" style="left:${x}px;top:${y}px">${lab}<input id="${fo.k}-${k}" inputmode="decimal" autocomplete="off" aria-label="${fo.n} ${lab} in mm" value="${KGW.esc(g(fo.k + '-' + k, std))}"></label>`).join('')}
    </div><div class="erg"><small id="${fo.k}-info"></small><b id="${fo.k}-kg"></b><span>kg</span></div>`, 'karte-' + fo.k));
  });
  const rechne = () => {
    const r = DICHTE[KGW.segWert(matBox, 'mat')] || DICHTE.stahl;
    FORMEN.forEach(fo => {
      const v = {}; fo.f.forEach(([k]) => { v[k] = KGW.zahl(fo.k + '-' + k); });
      let kg, info;
      if(fo.profil){ const kgm = fo.profil(v) * r / 1000; kg = kgm * v.l / 1000; info = `${KGW.fmt(kgm, 2)} kg/m`; }
      else [kg, info] = fo.rechne(v, r, fo.seg && KGW.segWert($('karte-' + fo.k), fo.k + '-seg'));
      $(fo.k + '-kg').textContent = KGW.fmt(isFinite(kg) ? kg : 0, 1); $(fo.k + '-info').textContent = info;
    });
  };
  KGW.binden(matBox, rechne, 'kgw-stahl-');
  FORMEN.filter(fo => fo.seg).forEach(fo => KGW.binden($('karte-' + fo.k), rechne, 'kgw-stahl-'));
  inhalt.querySelectorAll('.zf input').forEach(i => i.addEventListener('input', () => { KGW.lsSet('kgw-stahl-' + i.id, i.value); rechne(); }));
  rechne();
});
</script>
</body>
</html>
