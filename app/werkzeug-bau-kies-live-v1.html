<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=30"></script>
<title>Kies-Gewicht – Werkzeuge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#323E4E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kg-werkzeuge.js?v=8"></script>
<style>
.wahl{height:44px;border:1px solid #B9C0C8;border-radius:8px;padding:0 10px;font:inherit;font-size:15px;background:#fff;width:100%;color:#232B35;}
</style>
</head>
<body>
<header class="app"><div class="wrap">
  <a class="backlink" href="index.html">Startseite</a>
  <div class="brand"><h1>Werkzeuge</h1></div>
  <span class="userbar hidden" id="userbar"><span id="userbarText"></span><button id="logoutBtn">Abmelden</button></span>
</div></header>
<main id="appMain"></main>
<script>
// Kies-Gewicht: Volumen × Schüttgewicht = Tonnen.
// Schüttgewichte (t pro m³, lose) aus der Preisliste des Kieswerks, Sorten die wir brauchen.
const KIES = [
  ['105', 'Sandgemisch 0/4', 1.51], ['102', 'Rundsand 0/8', 1.54], ['110', 'Sandkastensand 0/4', 1.38],
  ['201', 'Gartenkies 4/8', 1.56], ['202', 'Gartenkies 8/16', 1.60], ['203', 'Rundkies 16/32', 1.62],
  ['301', 'Betonkies 0/16', 1.72], ['302', 'Betonkies 0/32', 1.82], ['208', 'Biotop-Mischung 8/50', 1.73],
  ['511', 'Splitt 4/8', 1.34], ['512', 'Splitt 8/11', 1.40], ['503', 'Splitt 11/16', 1.44], ['504', 'Splitt 16/22', 1.46],
  ['112', 'Brechsand 0/4', 1.50], ['601', 'Wandkies 1. Kl.', 2.00]
];
KGW.werkzeug('bau_kies', inhalt => {
  const $ = id => document.getElementById(id), g = (id, alt) => KGW.lsGet('kgw-kies-' + id, alt), f = KGW.fmt;
  const sortiert = [...KIES].sort((a, b) => a[1].localeCompare(b[1], 'de', { numeric: true }));
  inhalt.insertAdjacentHTML('beforeend', KGW.karte('Material', `<select class="wahl" id="sorte" aria-label="Material">${sortiert.map(([nr, n]) =>
    `<option value="${nr}">${KGW.esc(n)}</option>`).join('')}</select>
    ${KGW.feld('m3', 'Volumen (m³)', g('m3', '5'), 0.5)}`, 'eingabeKarte'));
  inhalt.insertAdjacentHTML('beforeend', KGW.karte('Gewicht', `<div class="kgw-gross"><b id="wert"></b><span>t</span></div>`));
  $('sorte').value = KIES.some(s => s[0] === g('sorte', '')) ? g('sorte', '') : '301';
  const rechne = () => {
    const [, , sg] = KIES.find(x => x[0] === $('sorte').value);
    $('wert').textContent = f(KGW.zahl('m3') * sg, 2);
  };
  $('sorte').addEventListener('change', () => { KGW.lsSet('kgw-kies-sorte', $('sorte').value); rechne(); });
  KGW.binden($('eingabeKarte'), rechne, 'kgw-kies-');
  rechne();
});
</script>
</body>
</html>
