<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
:root{ --bg:#F5F7F9; --primary:#323E4E; --ink:#232B35; --muted:#6B7079; --line:#E1E5E9; }
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);line-height:1.4;font-size:15px;-webkit-tap-highlight-color:transparent;}
.hidden{display:none !important;}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.kopf{background:var(--primary);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;gap:10px;}
.kopf a{color:#fff;display:flex;width:36px;height:36px;align-items:center;justify-content:center;}
.kopf b{font-size:18px;flex:1;}
.w{max-width:560px;margin:0 auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;}
.gross{all:unset;box-sizing:border-box;cursor:pointer;width:100%;min-height:150px;border-radius:20px;background:var(--primary);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:20px;font-weight:600;}
.gross svg.i{width:52px;height:52px;stroke-width:1.4;}
.knopf{all:unset;box-sizing:border-box;cursor:pointer;width:100%;min-height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:16px;text-align:center;padding:0 14px;}
.knopf.hell{border:1px solid #D5DBE1;background:#fff;color:var(--primary);}
.knopf.dunkel{background:var(--primary);color:#fff;}
.knopf[disabled]{opacity:.45;pointer-events:none;}
.karte{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;}
.karte h2{font-size:18px;color:var(--primary);}
.klein{font-size:12.5px;color:var(--muted);}
.ok{color:#3F7D3F;} .warn{color:#8A6410;}
.vor{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.vor img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#eef1f4;display:block;}
.vor .f{position:relative;}
.vor .f button{all:unset;cursor:pointer;position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:rgba(35,43,53,.7);color:#fff;display:flex;align-items:center;justify-content:center;}
.vor .f button svg.i{width:14px;height:14px;stroke-width:2;}
.vor .plus{all:unset;box-sizing:border-box;cursor:pointer;aspect-ratio:1;border-radius:8px;border:1.5px dashed #C5CCD3;color:var(--primary);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;}
.ziel{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:center;min-height:58px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);}
.ziel[aria-pressed=true]{border:2px solid var(--primary);background:#F5F7F9;padding:7px 11px;}
.ziel .p{width:20px;height:20px;border-radius:50%;border:2px solid #D5DBE1;flex:none;}
.ziel[aria-pressed=true] .p{border:6px solid var(--primary);}
.ziel span.t{display:flex;flex-direction:column;flex:1;min-width:0}.ziel b{font-size:15px}.ziel small{font-size:12.5px;color:var(--muted)}
.such{display:flex;align-items:center;gap:8px;height:46px;border:1px solid #D5DBE1;border-radius:10px;padding:0 12px;color:#8B9097;background:#fff;}
.such input{border:0;outline:none;font:inherit;font-size:16px;flex:1;min-width:0;color:var(--ink);}
.balken{height:8px;border-radius:99px;background:#EEF1F4;overflow:hidden}.balken i{display:block;height:100%;background:#3F7D3F;width:0;transition:width .2s}
.fertig{align-items:center;text-align:center;padding:28px 16px;}
.fertig .kreis{width:72px;height:72px;border-radius:50%;background:#3F7D3F;color:#fff;display:flex;align-items:center;justify-content:center}
.fertig .kreis svg.i{width:38px;height:38px;stroke-width:2}
.loginwrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.logincard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
.logincard input{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
.toastwrap{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;z-index:50;pointer-events:none}
.toast{background:#323E4E;color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;max-width:90%}.toast.err{background:#7A2638}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-cam" viewBox="0 0 24 24"><path d="M3.5 8a1.5 1.5 0 0 1 1.5-1.5h2.5L9 4.5h6l1.5 2H19A1.5 1.5 0 0 1 20.5 8v10A1.5 1.5 0 0 1 19 19.5H5A1.5 1.5 0 0 1 3.5 18z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  <symbol id="i-bild" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M20.5 16l-5-5-8 8.5"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
</svg>

<div class="loginwrap hidden" id="loginwrap"><div class="logincard"><b style="font-size:18px;color:#323E4E">Fotos Baustelle</b>
  <input autocomplete="username" id="loginEmail" type="email" placeholder="E-Mail"><input autocomplete="current-password" id="loginPassword" type="password" placeholder="Passwort">
  <button class="knopf dunkel" id="loginBtn">Anmelden</button><div class="klein" id="loginStatus"></div></div></div>

<div id="app" class="hidden">
  <div class="kopf"><a href="index.html" aria-label="Zur Startseite"><svg class="i"><use href="#i-back"/></svg></a><b>Fotos Baustelle</b></div>
  <div class="w" id="inhalt"></div>
</div>
<input type="file" id="inKamera" accept="image/*" capture="environment" multiple hidden>
<input type="file" id="inGalerie" accept="image/*" multiple hidden>
<div class="toastwrap" id="toastwrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const $ = id => document.getElementById(id);
const sb = window.supabase.createClient('https://oalapdxinqlnzwxhyuzy.supabase.co', 'sb_publishable_DoeD4uEnwemmnFu4AxE9uw_5lmQYc5P');
const I = id => `<svg class="i"><use href="#i-${id}"/></svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const toast = (t, err) => { const d = document.createElement('div'); d.className = 'toast' + (err ? ' err' : ''); d.textContent = t; $('toastwrap').appendChild(d); setTimeout(() => d.remove(), err ? 5000 : 2200); };
const fn = async body => { const { data, error } = await sb.functions.invoke('fotos', { body }); if(error || data?.error) throw new Error(data?.error || error.message); return data; };

// ---------------------------------------------------------------------------
// Anmelden (alle freigeschalteten Rollen)
// ---------------------------------------------------------------------------
let ICH = null;
async function pruefeAnmeldung(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ $('loginwrap').classList.remove('hidden'); return; }
  const { data: b } = await sb.from('benutzer').select('id,anzeigename,email,rolle,aktiv').eq('id', session.user.id).maybeSingle();
  if(!b?.rolle || b.aktiv === false){ $('loginwrap').classList.remove('hidden'); $('loginStatus').textContent = 'Dein Konto ist noch nicht freigeschaltet.'; return; }
  ICH = b; $('loginwrap').classList.add('hidden'); $('app').classList.remove('hidden'); start(); warteschlange();
}
$('loginBtn').onclick = async () => { $('loginStatus').textContent = 'Melde an …';
  const { error } = await KG.anmelden(sb, { email: $('loginEmail').value.trim(), password: $('loginPassword').value });
  if(error){ $('loginStatus').textContent = 'Anmelden hat nicht geklappt: ' + error.message; return; } pruefeAnmeldung(); };

// ---------------------------------------------------------------------------
// Ablauf: Fotos aufnehmen → Baustelle bestätigen (Standort-Vorauswahl) → hochladen
// Die gewählte Baustelle gilt 2 Stunden lang ohne Nachfrage (nur auf diesem Handy).
// ---------------------------------------------------------------------------
let FOTOS = [], POS = null, ZIELE = [], WAHL = null;
const MERK = 'kg-fotos-ziel';
const gemerkt = () => { try { const m = JSON.parse(localStorage.getItem(MERK) || 'null'); return m && Date.now() - m.zeit < 2 * 3600e3 ? m : null; } catch(_){ return null; } };
const merken = z => { try { localStorage.setItem(MERK, JSON.stringify({ ...z, zeit: Date.now() })); } catch(_){} };

function start(){
  AUSWAHL = false; FOTOS = []; URLS.forEach(u => URL.revokeObjectURL(u)); URLS.clear(); const m = gemerkt();
  $('inhalt').innerHTML = `<button type="button" class="gross" id="bKamera">${I('cam')}Fotos aufnehmen</button>
    <button type="button" class="knopf hell" id="bGalerie">${I('bild')}Aus der Galerie wählen</button>
    ${m ? `<div class="karte"><span class="klein">Fotos gehen zurzeit an</span><b>${esc(m.name)}</b><button type="button" class="knopf hell" id="bVergessen" style="min-height:40px;font-size:14px">Andere Baustelle wählen</button></div>` : ''}
    <div id="wsInfo"></div>
    <p class="klein">Die Fotos landen im Kundenordner des aktuellen Jahres unter «22-Fotos-Bauablauf und Schluss».</p>`;
  $('bKamera').onclick = () => $('inKamera').click();
  $('bGalerie').onclick = () => $('inGalerie').click();
  if($('bVergessen')) $('bVergessen').onclick = () => { try { localStorage.removeItem(MERK); } catch(_){} start(); };
  wsAnzeige();
}
// Fotos sammeln: jedes neue Foto kommt dazu, bis «Alle ablegen» (die Kamera liefert pro Aufnahme meist nur ein Bild)
const URLS = new Map(), bildUrl = f => URLS.get(f) || (URLS.set(f, URL.createObjectURL(f)), URLS.get(f));
let AUSWAHL = false;
const gewaehlt = e => { const f = [...e.target.files].filter(x => /^image\//.test(x.type)); e.target.value = ''; if(!f.length) return; FOTOS.push(...f); AUSWAHL ? zeichneWahl() : bestaetigen(); };
$('inKamera').onchange = gewaehlt; $('inGalerie').onchange = gewaehlt;

async function bestaetigen(){
  AUSWAHL = true; const m = gemerkt();
  WAHL = m ? { kunde_id: m.kunde_id, name: m.name } : null;
  zeichneWahl('Suche Baustellen in deiner Nähe …');
  // Standort (höchstens 6 Sekunden), dann die Einsätze von heute mit Distanz
  POS = await new Promise(ok => { if(!navigator.geolocation) return ok(null);
    navigator.geolocation.getCurrentPosition(p => ok({ lat: p.coords.latitude, lon: p.coords.longitude }), () => ok(null), { enableHighAccuracy: true, timeout: 6000, maximumAge: 60000 }); });
  try { const d = await fn({ aktion: 'ziele', lat: POS?.lat, lon: POS?.lon }); ZIELE = d.ziele || [];
    if(!WAHL && d.naechste){ const z = ZIELE.find(x => x.kunde_id === d.naechste); WAHL = { kunde_id: z.kunde_id, name: z.name, standort: true }; }
    if(!WAHL && ZIELE.length === 1 && !POS) WAHL = { kunde_id: ZIELE[0].kunde_id, name: ZIELE[0].name };
  } catch(err){ ZIELE = []; toast(err.message, true); }
  zeichneWahl();
}
function zeichneWahl(laedt){
  const hinweis = laedt ? `<span class="klein">${laedt}</span>`
    : WAHL?.standort ? `<span class="klein ok" style="display:flex;gap:6px;align-items:center">${I('pin')}Nach deinem Standort vorausgewählt</span>`
    : gemerkt() ? `<span class="klein">Wie bei den letzten Fotos</span>`
    : POS ? `<span class="klein warn">Keine Baustelle in deiner Nähe. Bitte auswählen.</span>` : `<span class="klein warn">Standort nicht verfügbar. Bitte auswählen.</span>`;
  const liste = [...ZIELE]; if(WAHL && !liste.some(z => z.kunde_id === WAHL.kunde_id)) liste.unshift({ kunde_id: WAHL.kunde_id, name: WAHL.name, info: 'zuletzt gewählt' });
  if(!FOTOS.length){ start(); return; }
  $('inhalt').innerHTML = `<div class="karte"><h2>${FOTOS.length} Foto${FOTOS.length === 1 ? '' : 's'}</h2>
      <div class="vor">${FOTOS.map((f, i) => `<span class="f"><img alt="" src="${bildUrl(f)}"><button type="button" data-weg="${i}" aria-label="Foto entfernen">${I('x')}</button></span>`).join('')}
        <button type="button" class="plus" id="pKam">${I('cam')}Foto</button><button type="button" class="plus" id="pGal">${I('bild')}Galerie</button></div></div>
    <div class="karte"><h2>Wohin?</h2>${hinweis}
      ${liste.map(z => `<button type="button" class="ziel" data-z="${esc(z.kunde_id)}" aria-pressed="${WAHL?.kunde_id === z.kunde_id}"><i class="p"></i><span class="t"><b>${esc(z.name)}</b><small>${esc([z.info, z.distanz != null ? (z.distanz < 1000 ? z.distanz + ' m entfernt' : (z.distanz / 1000).toFixed(1) + ' km') : ''].filter(Boolean).join(' · '))}</small></span></button>`).join('')}
      <label class="such">${I('search')}<input type="text" id="qKunde" placeholder="Anderen Kunden suchen" autocomplete="off" data-lpignore="true" data-1p-ignore="true" data-dashlane-ignore="true" data-form-type="other"></label>
      <div id="trefTer"></div>
      <button type="button" class="knopf dunkel" id="bAblegen"${WAHL ? '' : ' disabled'}>${WAHL ? `Alle ${FOTOS.length} hier ablegen` : 'Baustelle auswählen'}</button>
      <button type="button" class="knopf hell" id="bAbbr">Abbrechen</button></div>`;
  $('inhalt').querySelectorAll('[data-weg]').forEach(b => b.onclick = () => { const f = FOTOS.splice(+b.dataset.weg, 1)[0]; URL.revokeObjectURL(URLS.get(f)); URLS.delete(f); zeichneWahl(); });
  $('pKam').onclick = () => $('inKamera').click(); $('pGal').onclick = () => $('inGalerie').click();
  $('inhalt').querySelectorAll('[data-z]').forEach(b => b.onclick = () => { const z = liste.find(x => x.kunde_id === b.dataset.z) || ZIELE.find(x => x.kunde_id === b.dataset.z); WAHL = { kunde_id: z.kunde_id, name: z.name }; zeichneWahl(); });
  let qT = null, nr = 0;
  $('qKunde').oninput = e => { clearTimeout(qT); qT = setTimeout(async () => { const q = e.target.value.trim(), n = ++nr; if(q.length < 2){ $('trefTer').innerHTML = ''; return; }
    try { const d = await fn({ aktion: 'suche', q }); if(n !== nr) return;
      $('trefTer').innerHTML = (d.ziele || []).map(z => `<button type="button" class="ziel" data-s="${esc(z.kunde_id)}" data-n="${esc(z.name)}" style="margin-bottom:6px"><i class="p"></i><span class="t"><b>${esc(z.name)}</b><small>${esc(z.adresse)}</small></span></button>`).join('') || '<span class="klein">Kein Kunde gefunden.</span>';
      $('trefTer').querySelectorAll('[data-s]').forEach(b => b.onclick = () => { WAHL = { kunde_id: b.dataset.s, name: b.dataset.n }; ZIELE = [{ kunde_id: b.dataset.s, name: b.dataset.n, info: 'gesucht' }, ...ZIELE.filter(z => z.kunde_id !== b.dataset.s)]; zeichneWahl(); });
    } catch(err){ toast(err.message, true); } }, 300); };
  $('bAblegen').onclick = ablegen; $('bAbbr').onclick = start;
}

// Bild verkleinern (längste Seite 2000 px, JPEG) – reicht für Baustellenfotos und geht deutlich schneller
async function verkleinern(f){
  const bmp = await createImageBitmap(f, { imageOrientation: 'from-image' }).catch(() => null);
  if(!bmp) return f;
  const s = Math.min(1, 2000 / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s); c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); if(bmp.close) bmp.close();
  return await new Promise(ok => c.toBlob(b => ok(b || f), 'image/jpeg', 0.82));
}
// höchstens n Aufgaben gleichzeitig
const parallel = async (liste, n, f) => { let i = 0; await Promise.all(Array.from({ length: Math.min(n, liste.length) }, async () => { while(i < liste.length){ const j = i++; await f(liste[j], j); } })); };
const zuB64 = b => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.readAsDataURL(b); });
const zeit = () => { const d = new Date(), z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}_${z(d.getHours())}-${z(d.getMinutes())}-${z(d.getSeconds())}`; };

async function ablegen(){
  const ziel = WAHL; if(!ziel) return; merken(ziel);
  const wer = String(ICH?.anzeigename || ICH?.email || '').split(/[\s@]/)[0] || 'Foto';
  $('inhalt').innerHTML = `<div class="karte"><h2>Fotos werden abgelegt …</h2><span class="klein" id="fz">0 von ${FOTOS.length}</span><div class="balken"><i id="fb"></i></div></div>`;
  // Einmal vorbereiten (Ordner + Upload-Sitzungen), dann direkt vom Handy zu Google, 3 gleichzeitig.
  // Klappt das nicht: alter Weg über den Server, ohne Netz in die Warteschlange.
  let ok = 0, offen = 0, fertig = 0, ordner = '', vb = null; const t0 = zeit(), erfasst = [];
  const blobs = new Array(FOTOS.length); await parallel(FOTOS, 3, async (f, i) => { blobs[i] = await verkleinern(f); });
  const namen = FOTOS.map((_, i) => `${t0}_${wer}${FOTOS.length > 1 ? '_' + (i + 1) : ''}.jpg`);
  try { vb = await fn({ aktion: 'vorbereiten', kunde_id: ziel.kunde_id, origin: location.origin, dateien: blobs.map((b, i) => ({ name: namen[i], typ: 'image/jpeg', groesse: b.size })) }); ordner = vb.ordner; }
  catch(_){ vb = null; }
  await parallel(blobs, 3, async (b, i) => {
    try {
      if(!vb || !vb.sitzungen[i]) throw new Error('ohne Sitzung');
      const r = await fetch(vb.sitzungen[i], { method: 'PUT', headers: { 'Content-Type': 'image/jpeg' }, body: b });
      if(!r.ok) throw new Error('Upload ' + r.status);
      const d = await r.json(); erfasst.push({ id: d.id, name: d.name }); ok++;
    } catch(_){
      const auftrag = { aktion: 'hochladen', kunde_id: ziel.kunde_id, dateiname: namen[i], lat: POS?.lat, lon: POS?.lon, typ: 'image/jpeg', daten: await zuB64(b) };
      try { const d = await fn(auftrag); ok++; ordner = d.ordner; } catch(err){ await wsNeu({ ...auftrag, name: ziel.name }); offen++; }
    }
    fertig++; $('fz').textContent = `${fertig} von ${FOTOS.length}`; $('fb').style.width = Math.round(fertig / FOTOS.length * 100) + '%';
  });
  if(erfasst.length) fn({ aktion: 'erfasst', kunde_id: ziel.kunde_id, ordner_id: vb.ordner_id, dateien: erfasst, lat: POS?.lat, lon: POS?.lon }).catch(() => {});
  $('inhalt').innerHTML = `<div class="karte fertig"><span class="kreis">${I('check')}</span><h2>${ok} Foto${ok === 1 ? '' : 's'} abgelegt</h2>
      <span>${esc(ziel.name)}${ordner ? ' · ' + esc(ordner) : ''}</span>
      ${offen ? `<span class="klein warn">${offen} Foto${offen === 1 ? '' : 's'} warten auf Netz und werden automatisch nachgeladen.</span>` : ''}
      <span class="klein">Die nächsten 2 Stunden gehen weitere Fotos ohne Nachfrage an diese Baustelle.</span>
      <button type="button" class="knopf dunkel" id="bWeiter">${I('cam')}Weitere Fotos</button><button type="button" class="knopf hell" id="bFertig">Fertig</button></div>`;
  $('bWeiter').onclick = () => { start(); $('inKamera').click(); }; $('bFertig').onclick = start;
}

// ---------------------------------------------------------------------------
// Warteschlange (IndexedDB): Fotos, die ohne Netz nicht hochgeladen werden konnten
// ---------------------------------------------------------------------------
const db = () => new Promise((ok, no) => { const r = indexedDB.open('kg-fotos', 1); r.onupgradeneeded = () => r.result.createObjectStore('ws', { keyPath: 'id', autoIncrement: true }); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
const ws = async (art, wert) => { const d = await db(); return new Promise((ok, no) => { const t = d.transaction('ws', art === 'liste' ? 'readonly' : 'readwrite'), s = t.objectStore('ws');
  const r = art === 'liste' ? s.getAll() : art === 'neu' ? s.add(wert) : s.delete(wert); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }); };
const wsNeu = a => ws('neu', a).catch(() => {});
async function wsAnzeige(){ const el = $('wsInfo'); if(!el) return; const l = await ws('liste').catch(() => []);
