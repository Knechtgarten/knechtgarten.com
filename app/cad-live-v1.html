<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=82"></script>
<script src="/kg-karte.js?v=4"></script>
<title>Knecht-Tool · CAD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* CAD (Etappe 1, 15.11.2026): Pläne pro Kunde; Zeichnen = links Werkzeuge, Mitte Plan, rechts Eigenschaften + Mengen, unten Eingabezeile.
   Grundlage (Parzelle, Gebäude) aus der amtlichen Vermessung (geodienste.ch), Luftbild swisstopo, Höhen swissALTI3D (kg-karte.js). */
:root{
  --primary:#323E4E; --bg:#F5F7F9; --grau:#8B9097; --hellblau:#D6E7F4; --gruen:#D1DB5F; --erde:#E3D2C0;
  --card:#FFFFFF; --ink:#323E4E; --muted:#8B9097; --line:#E1E5E9; --soft:#EEF3F7; --papier:#FFFFFF; --raster:#EDF1F5; --raster2:#DDE3EA;
  --bestand:#323E4E; --sel:#2F6FB5; --danger:#B4655F; --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:13px;line-height:1.45;margin:0}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
header.app{background:var(--primary);color:#fff}
header.app .wrap{display:flex;align-items:center;gap:20px;padding:0 16px}
header.app .brand{padding:11px 0}
header.app .brand h1{font-size:15px;font-weight:600;color:#fff;margin:0}
header.app .userbar{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:12px}
header.app .userbar button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.loginwrap{display:flex;justify-content:center;padding:60px 0}
.logincard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px;width:340px;display:flex;flex-direction:column;gap:10px}
.logincard h2{margin:0 0 4px;font-size:16px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12px;color:var(--muted)}
.fld input,.fld select{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff}
.status{font-size:12px;color:var(--muted)}
.status.err{color:var(--danger)}
.btn-primary{background:var(--primary);border:1px solid var(--primary);color:#fff;border-radius:6px;padding:6px 14px;font-weight:600;cursor:pointer}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 14px;font-weight:600;cursor:pointer}
/* Pläne-Liste */
.lbar{background:var(--card);border-bottom:1px solid var(--line)}
.lbar .wrap{display:flex;align-items:center;gap:10px;padding:8px 16px}
.lsuche{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:5px 9px;background:#fff;color:var(--muted);min-width:260px}
.lsuche input{border:0;outline:0;flex:1;min-width:0;background:transparent;color:var(--ink)}
.ltab{width:100%;border-collapse:collapse}
.ltab th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
.ltab td{padding:10px 8px;border-bottom:1px solid var(--soft);vertical-align:middle}
.ltab tbody tr{cursor:pointer}
.ltab tbody tr:hover{background:var(--soft)}
.ltab td.akt{text-align:right;white-space:nowrap}
.leerliste{color:var(--muted);padding:30px 8px;text-align:center}
.ovl{position:fixed;inset:0;background:rgba(35,43,53,.35);display:flex;align-items:flex-start;justify-content:center;padding-top:10vh;z-index:50}
.dlg{background:#fff;border-radius:10px;width:min(460px,calc(100vw - 32px));padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(35,43,53,.25)}
.dlg h3{margin:0;font-size:15px}
.dlg .knoepfe{display:flex;justify-content:flex-end;gap:8px}
/* «Neuer Plan» wie «Neue Offerte» im Offertentool */
.ovl:has(.npbox){padding-top:5vh}
.npbox{width:min(1040px,94vw);max-height:92vh;overflow:auto;position:relative;padding:22px 24px}
.npbox h3{font-size:17px}
.npzu{position:absolute;top:14px;right:14px}
.npinfo{font-size:12.5px;color:var(--muted);margin-top:-6px}
.npsuch{position:relative}
.npsuch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);pointer-events:none}
.npsuch input{width:100%;box-sizing:border-box;padding:10px 12px 10px 34px;border:1px solid var(--line,#E1E5E9);border-radius:7px;font:inherit;font-size:13px;background:#D6E7F4}
.npsuch input:focus{outline:none;border-color:var(--primary,#323E4E);background:#fff}
.npabc{display:flex;flex-wrap:wrap;gap:2px;margin:8px 0 6px}
.npabc button{min-width:24px;height:24px;border:0;background:none;border-radius:5px;font:inherit;font-size:12px;color:var(--primary,#323E4E);cursor:pointer;padding:0 5px}
.npabc button:hover{background:#F5F7F9}
.npabc button.on{background:var(--primary,#323E4E);color:#fff}
.npabc button:disabled{color:#c3c8ce;cursor:default;background:none}
.nptab{max-height:300px;overflow:auto;border:1px solid var(--line,#E1E5E9);border-radius:8px}
.nptab table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12.5px}
.nptab th{position:sticky;top:0;background:#fff;text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:7px 10px;border-bottom:1px solid var(--line,#E1E5E9);z-index:1}
.nptab td{padding:6px 10px;border-bottom:1px solid #F0F2F4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.nptab td:first-child{font-weight:600}
.nptab tr:hover td,.nptab tr.akt td{background:#F5F7F9}
.nptab .leer td{color:var(--muted);font-weight:400;cursor:default}
.nplink{all:unset;cursor:pointer;display:inline-block;margin-top:6px;font-size:12px;font-weight:600;color:var(--primary,#323E4E)}
.nplink:hover{text-decoration:underline}
.npinfo .nplink{margin:0 0 0 6px}
.npfelder{display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--line,#E1E5E9)}
.npfelder[hidden]{display:none}
.ktreffer{border:1px solid var(--line);border-radius:6px;max-height:220px;overflow:auto}
.ktreffer div{padding:7px 9px;cursor:pointer;border-bottom:1px solid var(--soft)}
.ktreffer div:hover,.ktreffer div.on{background:var(--soft)}
.ktreffer small{color:var(--muted)}
.speicher{font-size:11.5px;color:var(--muted);margin-left:4px}
/* Editor füllt die Höhe unter der Leiste (Höhe setzt das Skript) */
.cadapp{height:calc(100vh - 46px);display:grid;grid-template-rows:auto 1fr auto}
body.imEditor{overflow:hidden}
/* dunkle Leiste */
.kopf{background:#323E4E;color:#fff;display:flex;align-items:center;gap:6px;padding-block:6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));min-width:0}
.tool{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border-radius:6px;padding:5px 10px;font-weight:600;white-space:nowrap}
.tool i{width:22px;height:22px;border-radius:5px;background:#C9D3DF;display:grid;place-items:center;color:#323E4E}
.reiter{display:flex;gap:2px;margin-left:10px;overflow-x:auto}
.reiter a{color:#C9D3DF;text-decoration:none;padding:8px 12px;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.reiter a.on{color:#fff;border-bottom-color:#D6E7F4}
.kopf .sp{flex:1}
.person{width:28px;height:28px;border-radius:50%;background:#fff;color:#323E4E;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
/* weisse Werkzeugzeile */
.zeile2{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:7px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.projekt{font-weight:700;font-size:14px}
.projekt small{font-weight:500;color:var(--muted);margin-left:6px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 10px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chip .pkt{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chip.on .pkt{background:#fff}
.feld{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.feld select,.feld input[type=range]{accent-color:var(--primary)}
select{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:4px 6px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 12px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.zeile2 .sp{flex:1}
/* Hauptbereich */
.haupt{display:grid;grid-template-columns:188px minmax(0,1fr) 270px;min-height:0}
.links{background:var(--card);border-right:1px solid var(--line);overflow:auto;padding:10px 10px 14px;display:flex;flex-direction:column;gap:12px}
.gruppe h3{margin:0 0 6px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.wz{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.wzb{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-size:10.5px;color:var(--ink);min-width:0}
.wzb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.wzb:hover{border-color:var(--muted)}
.wzb.on{background:var(--primary);border-color:var(--primary);color:#fff}
.wzb .tast{font-size:9px;color:var(--muted)}
.wzb.on .tast{color:#C9D3DF}
.bt{display:flex;flex-direction:column;gap:4px}
.btz{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 8px;cursor:pointer;text-align:left}
.btz .farb{width:22px;height:14px;border-radius:3px;border:1px solid rgba(50,62,78,.25);flex:none}
.btz:hover{border-color:var(--muted)}
.btz.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.btz span{flex:1;min-width:0}
.btz small{color:var(--muted)}
/* Plan */
.mitte{position:relative;min-width:0;min-height:0;background:var(--papier)}
#plan{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;user-select:none}
#plan.auswahl{cursor:default}
.kompass{position:absolute;top:10px;right:12px;width:34px;height:34px;color:var(--muted)}
.massstab{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.massstab .bar{height:6px;border:1px solid var(--muted);border-top:0}
.hinweisbox{position:absolute;left:12px;top:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;max-width:min(420px,calc(100% - 70px));box-shadow:0 2px 8px rgba(50,62,78,.08)}
.hinweisbox b{font-weight:600}
/* rechts */
.rechts{background:var(--card);border-left:1px solid var(--line);overflow:auto;display:flex;flex-direction:column}
.abschnitt{padding:12px;border-bottom:1px solid var(--line)}
.abschnitt h3{margin:0 0 8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.abschnitt h3 .sp{flex:1}
.leer{color:var(--muted);font-size:12px;line-height:1.45}
.eig{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.eig label{color:var(--muted);font-size:12px}
.eig input,.eig select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:4px 6px;text-align:right}
.eig select{text-align:left}
.eig .wert{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.typzeile{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:600;font-size:14px}
.typzeile .farb{width:22px;height:14px;border-radius:3px;border:1px solid rgba(50,62,78,.25)}
.typzeile .sp{flex:1}
.ibtn{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.ibtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ibtn.danger:hover{color:#B4655F;border-color:#B4655F}
.mengen{width:100%;border-collapse:collapse;font-size:12px}
.mengen td{padding:4px 0;border-bottom:1px solid var(--soft)}
.mengen td:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mengen tr.grp td{color:var(--muted);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding-top:9px;border-bottom:0}
.ki{display:flex;flex-direction:column;gap:6px}
.ki textarea{width:100%;min-height:54px;resize:none;border:1px dashed var(--line);border-radius:8px;padding:7px 9px;background:var(--soft);color:var(--muted)}
.etappe{font-size:10px;font-weight:600;background:var(--hellblau);color:#323E4E;border-radius:99px;padding:1px 7px;letter-spacing:0;text-transform:none}
/* Eingabezeile unten */
.unten{background:var(--card);border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.eingabe{display:flex;align-items:center;gap:6px}
.eingabe label{font-weight:600}
.eingabe input{width:120px;border:1px solid var(--primary);border-radius:6px;padding:5px 8px;text-align:right;font-variant-numeric:tabular-nums}
.eingabe input:focus{outline:2px solid var(--hellblau)}
.koord{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;min-width:150px}
.unten .sp{flex:1}
.schalt{display:inline-flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;color:var(--muted)}
.schalt input{accent-color:var(--primary)}
.toast{position:fixed;left:50%;bottom:calc(60px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#323E4E;color:#fff;padding:8px 14px;border-radius:8px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.an{opacity:1}
.pop{position:absolute;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(50,62,78,.16);padding:6px;width:250px}
.pop .pz{display:flex;align-items:center;gap:8px;padding:6px;border-radius:6px;cursor:pointer}
.pop .pz:hover{background:var(--soft)}
.pop .pz i{width:26px;height:26px;border-radius:50%;flex:none;border:1px solid rgba(50,62,78,.3)}
.pop .pz div{min-width:0}
.pop .pz b{display:block;font-weight:600;font-style:italic}
.pop .pz small{color:var(--muted)}
.pop .pk{font-size:11px;color:var(--muted);padding:4px 6px 2px}
:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
@media (max-width:900px){
  body{overflow:auto}
  .cadapp{height:auto;min-height:100%}
  .haupt{grid-template-columns:1fr;grid-template-rows:auto 62vh auto}
  .links{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;overflow-x:auto;gap:14px}
  .links .gruppe{flex:none}
  .wz{grid-template-columns:repeat(9,52px)}
  .bt{flex-direction:row}
  .btz{white-space:nowrap}
  .rechts{border-left:0;border-top:1px solid var(--line)}
  .reiter{display:none}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>

<header class="app"><div class="wrap">
  <div class="brand"><h1>CAD</h1></div>
  <span class="userbar hidden" id="userbar"><span id="userbarText"></span><button id="logoutBtn">Abmelden</button></span>
</div></header>
<nav class="subnav" id="subnav"><a href="#" data-r="plaene" class="active">Pläne</a><a href="#" data-r="zeichnen">Zeichnen</a></nav>

<div class="wrap hidden" id="loginwrap"><div class="loginwrap"><div class="logincard">
  <h2>Anmelden</h2>
  <div class="fld"><label for="loginEmail">E-Mail</label><input autocomplete="username" id="loginEmail" type="email"></div>
  <div class="fld"><label for="loginPassword">Passwort</label><input autocomplete="current-password" id="loginPassword" type="password"></div>
  <button class="btn-primary" id="loginBtn">Anmelden</button>
  <div class="status" id="loginStatus"></div>
</div></div></div>
<div class="wrap hidden" id="keinZugriff"><div class="card" style="margin-top:20px">CAD ist nur für Büro-Team und Admin.</div></div>

<!-- Pläne-Liste -->
<div class="lbar hidden" id="lbar"><div class="wrap">
  <label class="lsuche"><span id="icSuche"></span><input type="text" id="lQ" placeholder="Kunde oder Plan suchen" aria-label="Suchen" autocomplete="off" data-lpignore="true" data-1p-ignore="true" data-dashlane-ignore="true" data-form-type="other"></label>
  <span style="flex:1"></span>
  <button type="button" class="btn-primary" id="neuBtn">Neuer Plan</button>
</div></div>
<main class="wrap hidden" id="liste" style="padding-top:16px;padding-bottom:30px">
  <div class="card" style="padding:0;overflow-x:auto"><table class="ltab"><thead><tr><th style="padding-left:16px">Kunde</th><th>Plan</th><th>Variante</th><th>Parzelle</th><th>Geändert</th><th></th></tr></thead><tbody id="lBody"></tbody></table></div>
</main>

<div class="cadapp hidden" id="editor">

  <div class="zeile2">
    <div class="projekt" id="planTitel"></div><span class="speicher" id="speicher"></span>
    <button class="btn" id="grundBtn" title="Parzelle und Gebäude neu aus der amtlichen Vermessung laden">Vermessung</button>
    <div class="chips" id="ebenen">
      <button class="chip on" data-e="bestand"><span class="pkt"></span>Bestand (Vermessung)</button>
      <button class="chip on" data-e="projekt"><span class="pkt"></span>Projekt</button>
      <button class="chip on" data-e="pflanzen"><span class="pkt"></span>Bepflanzung</button>
      <button class="chip on" data-e="mbew" title="Grenz- und Hausabstände, Länge × Breite der bewilligungsrelevanten Objekte"><span class="pkt"></span>Masse Bewilligung</button>
      <button class="chip on" data-e="maus" title="Massketten, Platzmasse, eigene Masslinien"><span class="pkt"></span>Masse Ausführung</button>
      <button class="chip on" data-e="koten"><span class="pkt"></span>Koten</button>
    </div>
    <label class="feld">Luftbild <input type="range" id="luft" min="0" max="40" value="12" aria-label="Deckkraft Luftbild"></label>
    <span class="sp"></span>
    <label class="feld">Massstab <select id="mst"><option>1:50</option><option selected>1:100</option><option>1:200</option><option>1:500</option></select></label>
    <button class="btn" id="vermassen" title="Massketten und Grenzabstände automatisch setzen">Vermassen</button>
    <button class="btn" data-toast="Schnitt: Linie ziehen, Gelände (swisstopo) + Mauern + Koten werden gerechnet – kommt in Etappe 3">Schnitt</button>
    <button class="btn primary" data-toast="PDF im Massstab mit Knechtgarten-Plankopf – im Mockup nicht aktiv">PDF</button>
  </div>

  <div class="haupt">
    <aside class="links">
      <div class="gruppe"><h3>Zeichnen</h3>
        <div class="wz" id="werkzeuge"></div>
      </div>
      <div class="gruppe"><h3>Bauteile</h3>
        <div class="bt" id="bauteile"></div>
      </div>
      <div class="gruppe"><h3>Bibliothek</h3>
        <div class="bt">
          <button class="btz" id="bibPflanzen"><span class="farb" style="background:#D1DB5F;border-radius:50%"></span><span>Pflanzen<br><small>aus dem Pflanzentool</small></span></button>
          <button class="btz" id="bibObjekte"><span class="farb" style="background:var(--soft)"></span><span>Objekte<br><small>Grill, Bank, Schirm …</small></span></button>
        </div>
      </div>
    </aside>

    <main class="mitte" id="mitte">
      <svg id="plan" aria-label="Gartenplan"></svg>
      <div class="hinweisbox" id="hinweis"></div>
      <svg class="kompass" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="currentColor" stroke-width="1"/><path d="M17 4l4 13h-8z" fill="currentColor"/><text x="17" y="30" text-anchor="middle" font-size="7" fill="currentColor" font-family="Segoe UI,Arial,sans-serif">N</text></svg>

// Ansicht auf die Parzelle (bzw. alles Gezeichnete) einpassen, mit Rand für die Aussenmasse
function einpassen(){
  const r = plan.getBoundingClientRect(); if(!r.width) return;
  const pts = [...parzelle, ...haus, ...objs.flatMap(o => o.pts || (o.c ? [o.c] : []))];
  const b = pts.length ? bb(pts) : { minX: 0, minY: 0, maxX: 30, maxY: 20 }, w = b.maxX - b.minX + 8, h = b.maxY - b.minY + 8;
  ansicht.s = Math.max(4, Math.min(80, Math.min((r.width - 30) / w, (r.height - 30) / h)));
  ansicht.ox = (r.width - (b.maxX - b.minX) * ansicht.s) / 2 - b.minX * ansicht.s; ansicht.oy = (r.height - (b.maxY - b.minY) * ansicht.s) / 2 - b.minY * ansicht.s;
}

// ----- Grundlage aus der amtlichen Vermessung (geodienste.ch WFS) + Luftbild + Höhen -----
async function grundlageLaden(neu){
  const k = PLAN?.kunde, adr = kadresse(k);
  if(!adr){ toast('Beim Kunden fehlt die Adresse – Grundlage kann nicht geladen werden'); return; }
  toast('Parzelle und Gebäude werden aus der Vermessung geladen …');
  try {
    const p = await KGK.koordinaten(adr); if(!p) throw new Error('Adresse «' + adr + '» nicht gefunden');
    const R = 70, wfs = async t => (await (await fetch(`https://geodienste.ch/db/av_0/deu?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAMES=ms:${t}&BBOX=${p.e - R},${p.n - R},${p.e + R},${p.n + R},urn:ogc:def:crs:EPSG::2056&OUTPUTFORMAT=geojson&SRSNAME=urn:ogc:def:crs:EPSG::2056`)).json()).features || [];
    const [RESF, LCSF] = await Promise.all([wfs('RESF'), wfs('LCSF')]);
    const ring = f => f.geometry?.type === 'Polygon' ? f.geometry.coordinates[0] : f.geometry?.type === 'MultiPolygon' ? f.geometry.coordinates[0][0] : null;
    const imRing = (x, y, r) => { let c = false; for(let i = 0, j = r.length - 1; i < r.length; j = i++){ const [xi, yi] = r[i], [xj, yj] = r[j]; if(((yi > y) !== (yj > y)) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; };
    let eigen = RESF.find(f => { const r = ring(f); return r && imRing(p.e, p.n, r); });
    if(!eigen) eigen = RESF.map(f => ({ f, r: ring(f) })).filter(x => x.r).sort((a, b) => { const d = x => { const c = x.r.reduce((s, q) => [s[0] + q[0] / x.r.length, s[1] + q[1] / x.r.length], [0, 0]); return Math.hypot(c[0] - p.e, c[1] - p.n); }; return d(a) - d(b); })[0]?.f;
    if(!eigen) throw new Error('Keine Parzelle gefunden');
    const er = ring(eigen), e0 = Math.min(...er.map(q => q[0])), n0 = Math.max(...er.map(q => q[1]));
    const geb = LCSF.filter(f => f.properties?.Art === 'Gebaeude').map(ring).filter(Boolean);
    const mitte = r => r.reduce((s, q) => [s[0] + q[0] / r.length, s[1] + q[1] / r.length], [0, 0]);
    const drin = geb.filter(r => { const c = mitte(r); return imRing(c[0], c[1], er); }), draussen = geb.filter(r => !drin.includes(r));
    const flaecheLv = r => Math.abs(r.reduce((a, q, i) => { const s = r[(i + 1) % r.length]; return a + q[0] * s[1] - s[0] * q[1]; }, 0)) / 2;
    drin.sort((a, b) => flaecheLv(b) - flaecheLv(a));
    // Plan am Haus ausrichten: längste Hauswand waagrecht (Drehung höchstens ±45°), damit Rechtecke, Fangen und Massketten zum Haus passen
    const u = q => [q[0] - e0, n0 - q[1]];   // ungedreht, Meter, Y nach unten
    let th = 0;
    if(drin[0]){ let best = 0; drin[0].forEach((q, i, r) => { const a = u(q), b = u(r[(i + 1) % r.length]), l = dist(a, b); if(l > best){ best = l; th = -Math.atan2(b[1] - a[1], b[0] - a[0]); } });
      while(th > Math.PI / 4) th -= Math.PI / 2; while(th < -Math.PI / 4) th += Math.PI / 2; }
    const rot = (p, t) => [p[0] * Math.cos(t) - p[1] * Math.sin(t), p[0] * Math.sin(t) + p[1] * Math.cos(t)];
    const pr = er.map(q => rot(u(q), th)), sx = Math.min(...pr.map(q => q[0])), sy = Math.min(...pr.map(q => q[1]));
    const lokal = r => { const out = r.map(q => { const p = rot(u(q), th); return [Math.round((p[0] - sx) * 1000) / 1000, Math.round((p[1] - sy) * 1000) / 1000]; }); if(out.length > 1 && dist(out[0], out[out.length - 1]) < 0.001) out.pop(); return out; };
    const parz = lokal(er), rand = 18;
    // Luftbild: Ausschnitt in ungedrehten Koordinaten (Nord oben), wird beim Zeichnen mitgedreht
    const ub = bb(er.map(u)), L = { x0: ub.minX - rand, y0: ub.minY - rand, x1: ub.maxX + rand, y1: ub.maxY + rand };
    const pxB = Math.round(Math.min(2400, (L.x1 - L.x0) * 25)), pxH = Math.round(pxB * (L.y1 - L.y0) / (L.x1 - L.x0));
    L.url = `https://wms.geo.admin.ch/?SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0&LAYERS=ch.swisstopo.swissimage&STYLES=&CRS=EPSG:2056&BBOX=${e0 + L.x0},${n0 - L.y1},${e0 + L.x1},${n0 - L.y0}&WIDTH=${pxB}&HEIGHT=${pxH}&FORMAT=image/jpeg`;
    const g = { e0, n0, drehung: th, sx, sy, lv: { minE: ub.minX + e0, maxE: ub.maxX + e0, minN: n0 - ub.maxY, maxN: n0 - ub.minY }, adresse: adr, parzelle_nr: eigen.properties?.Nummer || '', egrid: eigen.properties?.EGRIS_EGRID || '', flaeche: eigen.properties?.Flaeche || null,
      parzelle: parz, haus: drin[0] ? lokal(drin[0]) : [], nebengeb: drin.slice(1).map(lokal), nachbarn: draussen.map(lokal),
      nachbarParz: RESF.filter(f => f !== eigen).map(ring).filter(Boolean).map(lokal), luft: L, stand: new Date().toISOString().slice(0, 10) };
    const { error } = await sb.from('cad_plan').update({ grundlage: g }).eq('id', PLAN.id); if(error) throw error;
    PLAN.grundlage = g; grundlageAnwenden(g); einpassen(); alles();
    toast(`Parzelle ${g.parzelle_nr} geladen${g.haus.length ? ' mit Wohnhaus' : ' (kein Gebäude gefunden)'}`);
    hoehenLaden();
  } catch(e){ fehler(e, 'Vermessung'); }
}
async function hoehenLaden(){
  if(!grundlage?.lv || HOEHEN) return; const v = grundlage.lv;
  try { await KGK.laden(); HOEHEN = await KGK.hoehenGitter(v.minE - 5, v.minN - 5, v.maxE + 5, v.maxN + 5); eigenschaften(); } catch(_){ HOEHEN = null; }
}

start();
