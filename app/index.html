<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Offertentool 2027 – Knechtgarten</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg:#F5F7F9; --card:#FFFFFF; --primary:#323E4E; --primary-l:#4C5C70;
  --ink:#232B35; --muted:#8B9097; --line:#E1E5E9;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.wrap{max-width:480px;width:100%;padding:24px;}
h1{font-size:20px;color:var(--primary);margin-bottom:4px;}
.sub{font-size:12.5px;color:var(--muted);margin-bottom:22px;}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:16px 18px;
  margin-bottom:12px;text-decoration:none;color:inherit;}
a.card:hover{border-color:var(--primary);}
a.card .nm{font-size:14px;font-weight:700;color:var(--primary);margin-bottom:3px;}
a.card .desc{font-size:12px;color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Offertentool 2027</h1>
  <div class="sub">Knechtgarten – Naturnahe Gärten</div>

  <a class="card" href="tool-a-live-v1.html">
    <div class="nm">Tool A – Offerten-Eingabe</div>
    <div class="desc">Offerten erfassen, berechnen, bearbeiten</div>
  </a>
  <a class="card" href="tool-b-live-v1.html">
    <div class="nm">Tool B – Arbeitsschritt-Verwaltung</div>
    <div class="desc">Formeln, Arbeitsschritte, Tagessätze pflegen (Admin)</div>
  </a>
  <a class="card" href="tool-c-live-v1.html">
    <div class="nm">Tool C – Artikelstamm-Pflege</div>
    <div class="desc">Lieferanten, Artikelgruppen, Artikel pflegen (Admin)</div>
  </a>
</div>
</body>
</html>
