<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=51"></script>
<title>Werkzeuge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#323E4E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kg-werkzeuge.js?v=9"></script>
</head>
<body>
<header class="app"><div class="wrap">
  <a class="backlink" href="index.html">Startseite</a>
  <div class="brand"><h1>Werkzeuge</h1></div>
  <span class="userbar hidden" id="userbar"><span id="userbarText"></span><button id="logoutBtn">Abmelden</button></span>
</div></header>
<main id="appMain"></main>
<script>
// Werkzeuge: oben die eigenen Favoriten, darunter die Kategorien zum Aufklappen.
// Offen beim ersten Besuch: Kategorie der eigenen Gruppe (KGW.START_OFFEN), danach merkt sich das Gerät den Zustand.
function aufbau(main){
  const LS = 'kgw-offen';
  const sichtbar = KGW.LISTE.filter(KGW.darf), startKat = KGW.START_OFFEN[KGW.gruppe];
  const offen = new Set(KGW.lsGet(LS, null) || (sichtbar.some(w => w.kat === startKat) ? [startKat] : []));
  main.className = 'kgw';
  const chev = KGW.svg('<path d="M6 9l6 6 6-6"/>', 18, 'class="kgw-chev"'), pfeil = KGW.svg('<path d="M9 6l6 6-6 6"/>', 16);
  const favs = () => {
    const liste = sichtbar.filter(w => KGW.favs.has(w.k));
    document.getElementById('favs').innerHTML = liste.length
      ? `<div class="kgw-favs">${liste.map(w => `<a class="kgw-fav" href="${w.seite}.html"><span class="kgw-punkt" style="background:${KGW.kat(w.kat).farbe}"></span>${KGW.esc(w.n)}</a>`).join('')}</div>`
      : '<div class="kgw-leer">Noch keine Favoriten. Tippe bei einem Werkzeug auf den Stern, dann erscheint es hier und auf deiner Startseite.</div>';
  };
  main.innerHTML = `<section class="kgw-karte"><div class="kgw-kopf">${KGW.svg(KG.pfad('stern'), 16, 'fill="currentColor"')}<h2>Meine Favoriten</h2></div><div id="favs"></div></section>`
    + KGW.KATEGORIEN.map(k => {
      const ws = sichtbar.filter(w => w.kat === k.k);
      return `<section class="kgw-karte kgw-kat" data-kat="${k.k}" data-offen="${offen.has(k.k) ? 1 : 0}">
        <button type="button" aria-expanded="${offen.has(k.k)}"><span class="kgw-katicon" style="background:${k.farbe}">${KGW.svg(k.d, 20)}</span>
          <span class="kgw-katname"><b>${k.n}</b><small>${ws.length ? ws.length + (ws.length === 1 ? ' Werkzeug' : ' Werkzeuge') : 'leer'}</small></span>${chev}</button>
        <div class="kgw-liste${offen.has(k.k) ? '' : ' hidden'}">${ws.length ? ws.map(w => `<div class="kgw-z">${KGW.sternKnopf(w.k, KGW.favs.has(w.k))}
          <a href="${w.seite}.html"><span><b>${KGW.esc(w.n)}</b><small>${KGW.esc(w.h)}</small></span>${pfeil}</a></div>`).join('')
          : '<div class="kgw-leer" style="padding-left:62px">Noch keine Werkzeuge.</div>'}</div></section>`;
    }).join('');
  main.querySelectorAll('.kgw-kat > button').forEach(b => b.addEventListener('click', () => {
    const s = b.parentElement, k = s.dataset.kat, auf = s.dataset.offen !== '1';
    s.dataset.offen = auf ? 1 : 0; b.setAttribute('aria-expanded', auf); s.querySelector('.kgw-liste').classList.toggle('hidden', !auf);
    if(auf) offen.add(k); else offen.delete(k); KGW.lsSet(LS, [...offen]);
  }));
  KGW.sternBinden(main, favs);
  favs();
}
KGW._start = aufbau; // zum Prüfen ohne Login
KGW.start(aufbau);
</script>
</body>
</html>
