<style>
.unvoll{display:none !important;}
.kgd-weg{display:flex;align-items:center;gap:6px;font-size:14px;color:#6B7079;flex-wrap:wrap;min-width:0;}
.kgd-weg a{color:#A63A52;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:2px;}
.kgd-weg b{color:#323E4E;font-size:15px;} .kgd-zurueck svg{transform:rotate(90deg);}
/* Formular: Blatt genau wie gedruckt (Original-PDF + unsere Angaben), Angaben-Fenster schwebt darüber wie in den anderen Doku-Tools */
.ffdaten{width:min(540px,calc(100% - 24px));}
.ffdaten .kgd-felder{gap:12px;}
.ffpos{border:1px solid #E1E5E9;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;}
.ffpos .kopf{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;} .ffpos .kopf .kg-ibtn{margin-left:auto;}
.ffpos .kopf .ffhand{margin-left:auto;display:flex;gap:5px;align-items:center;font-weight:400;font-size:12.5px;color:#4C5C70;cursor:pointer;} .ffpos .kopf .ffhand + .kg-ibtn{margin-left:4px;} .ffhand input{width:15px;height:15px;accent-color:#323E4E;margin:0;}
.ffart{font-size:12.5px;background:#F5F7F9;border-radius:8px;padding:0 4px 0 10px;min-height:36px;box-sizing:border-box;display:flex;gap:8px;align-items:center;} .ffart b{font-variant-numeric:tabular-nums;}
.ffgrund{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12.5px;} .ffgrund label{display:flex;gap:6px;align-items:center;cursor:pointer;}
.ffre{border-radius:10px;padding:10px;font-size:12.5px;display:flex;flex-direction:column;gap:8px;}
.ffre.noetig{background:#FDF1EF;border:1px solid #F0C9C3;} .ffre.ok{background:#EEF6EC;border:1px solid #C9E2C3;}
.ffre .zeile{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.ffre a{color:#323E4E;font-weight:600;}
.ffpx{display:flex;flex-direction:column;background:#fff;border:1px solid #E1E5E9;border-radius:8px;overflow:hidden;}
.ffpx button{all:unset;display:flex;gap:10px;align-items:baseline;padding:7px 10px;cursor:pointer;border-top:1px solid #EEF1F4;font-size:12.5px;}
.ffpx button:first-child{border-top:0;} .ffpx button:hover:not([disabled]){background:#F5F7F9;} .ffpx button[disabled]{cursor:default;opacity:.7;}
.ffpx .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;} .ffpx .d{color:#6B7079;} .ffpx .b{font-variant-numeric:tabular-nums;text-align:right;min-width:78px;}
.ffblatt{width:760px;max-width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;}
.ffblatt canvas{width:100%;cursor:pointer;height:auto;background:#fff;box-shadow:0 4px 18px rgba(35,43,53,.15);border-radius:2px;}
.ffhinweis{font-size:12px;color:#6B7079;}
.ffsig{display:flex;align-items:center;gap:8px;font-size:12.5px;flex-wrap:wrap;color:#6B7079;} .ffsig img{height:28px;max-width:140px;object-fit:contain;background:#fff;border:1px solid #E1E5E9;border-radius:4px;} .ffsig img.aus{opacity:.3;} .ffsig a{color:#323E4E;font-weight:600;}
.ffsig .kgd-schalter{height:auto;font-size:12.5px;} .ffsig .kgd-schalter input{width:15px;height:15px;}
.ffnr{display:flex;gap:6px;align-items:center;} .ffnr .kgd-t{flex:1;min-width:0;} .ffbuch{width:36px;height:36px;flex:none;color:#323E4E;border-color:#B9C0C8;} .ffbuch svg{width:20px;height:20px;stroke-width:1.7;}
/* Katalog-Fenster */
.kkat{position:fixed;inset:0;background:rgba(35,43,53,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;}
.kkat-box{background:#fff;border-radius:12px;width:min(1200px,100%);height:min(94vh,1100px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 50px rgba(20,28,38,.35);}
.kkat-kopf{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid #EEF1F4;} .kkat-kopf b{font-size:15px;color:#323E4E;} .kkat-kopf .kgd-t{margin-left:auto;width:300px;}
.kkat-rumpf{flex:1;display:flex;min-height:0;}
.kkat-rumpf aside{width:300px;flex:none;border-right:1px solid #EEF1F4;overflow:auto;padding:8px;display:flex;flex-direction:column;}
.kkat-rumpf aside button{all:unset;cursor:pointer;padding:5px 8px;border-radius:6px;font-size:12.5px;color:#323E4E;line-height:1.35;}
.kkat-rumpf aside button:hover{background:#F5F7F9;} .kkat-rumpf aside button.an{background:#EEF3F7;} .kkat-rumpf aside button.e0{font-weight:600;margin-top:4px;} .kkat-rumpf aside button.e1{padding-left:18px;color:#4C5C70;}
.kkat-rumpf aside button small{display:block;color:#8B9097;font-size:11px;} .kkat-titel{font-size:11px;color:#8B9097;text-transform:uppercase;letter-spacing:.04em;padding:4px 8px;}
.kkat-seite{flex:1;overflow:auto;background:#E3E7EC;padding:12px;position:relative;}
.kkat-seiten{display:flex;flex-direction:column;align-items:center;gap:12px;}
.kkat-blatt{position:relative;flex:none;box-shadow:0 4px 18px rgba(35,43,53,.15);background:#fff;}
.kkat-layer{position:absolute;inset:0;}
.kkat-nr{all:unset;position:absolute;cursor:pointer;border-radius:3px;box-shadow:inset 0 0 0 1.5px rgba(209,219,95,.0);}
.kkat-nr:hover{background:rgba(209,219,95,.45);box-shadow:inset 0 0 0 1.5px #A3AE3A;}
.kkat-nr.treffer{background:rgba(209,219,95,.55);box-shadow:inset 0 0 0 1.5px #A3AE3A;}
.kkat-link{position:absolute;cursor:pointer;} .kkat-link:hover{background:rgba(214,231,244,.5);}
.kkat-fuss{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid #EEF1F4;font-size:13px;}
.kkat-fuss input{width:50px;height:28px;border:1px solid #B9C0C8;border-radius:6px;text-align:center;font:inherit;}
@media (max-width:760px){ .kkat-rumpf aside{display:none;} .kkat-kopf .kgd-t{width:150px;} }
@media print{ body > *:not(#druckFrame){display:none!important;} }
</style>

<body>
<header class="app"><div class="wrap">
  <a class="backlink" href="index.html">Startseite</a>
  <div class="brand"><h1>Doku-Tools</h1></div>
  <span class="userbar hidden" id="userbar"><span id="userbarText"></span><button id="logoutBtn">Abmelden</button></span>
</div></header>
<nav class="subnav"><div class="wrap">
  <a href="doku-live-v1.html" class="on">Dokumente</a>
</div></nav>
<span class="kgd-weg" data-kg-seite="links"><a class="kgd-zurueck" href="doku-live-v1.html" id="ordnerLink"></a><span>/</span><b id="docTitel"></b></span>
<button type="button" class="kgd-btn ghost" data-kg-seite="rechts" id="datenBtn">Angaben anpassen</button>
<button type="button" class="kgd-btn prim kg-haupt unvoll" data-kg-seite="rechts" id="druckBtn"></button>
<main id="appMain"></main>
<script>
// Formular eines Lieferanten (Art «formular»): Original-PDF als Hintergrund, unsere Angaben werden mit pdf-lib daraufgeschrieben.
// Vorschau = genau das PDF, das gedruckt bzw. abgelegt wird (pdf.js zeichnet Seite 1). Rechnungskopie wird als weitere Seiten angehängt.
// Erste Vorlage: «Rücksendung Aqua Solar» (Positionen in PDF-Punkten, Ursprung unten links, A4 = 595 × 842).
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
const AS_LIEFERANT = 'd792a7b8-cdb5-4443-bd9d-67bdf4a6f87b';
const ABSENDER = ['Knecht AG Naturnahe Gärten', 'Badhaus 42, 3615 Heimenschwand · Kunde Nr. 240043'];
// Gründe (nur die vier, die wir brauchen) mit Lage des Kästchens; Reparatur braucht keine Rechnungskopie
const GRUENDE = [
  { k: 'lieferung', n: 'falsche Lieferung (Fehler AS)', x: 123, y: 566, rechnung: true },
  { k: 'bestellung', n: 'falsche Bestellung (Fehler Kunde)', x: 123, y: 543, rechnung: true },
  { k: 'reparatur', n: 'zur Reparatur', x: 257, y: 566, rechnung: false },
  { k: 'garantie', n: 'zur Garantiereparatur', x: 257, y: 543, rechnung: true },
];
const BLOCK = 131;   // Abstand der drei Artikelblöcke
async function aufbau(main){
  const { esc, ic } = KGD, sb = KGD.sb;
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  $('druckBtn').innerHTML = ic('drucken') + 'Drucken'; $('ordnerLink').innerHTML = KG.icon('chev', 14);

  let dokId = null, werte = null, vorlageId = P.get('v');
  const quelle = P.get('d') || P.get('kopie');   // Kopie = gleiche Angaben, neues Dokument (ohne Rechnungskopie)
  if(quelle){
    const { data } = await sb.from('doku_dokument').select('*').eq('id', quelle).maybeSingle();
    if(!data){ main.innerHTML = '<p class="kgd-hinweis" style="padding:20px">Dokument nicht gefunden.</p>'; return; }
    vorlageId = data.vorlage_id; werte = data.werte || {}; if(P.get('d')) dokId = data.id; else { werte.rechnung = null; werte.rechnungen = []; }
  }
  const { data: V } = await sb.from('doku_vorlage').select('*, ordner:doku_ordner(name)').eq('id', vorlageId).maybeSingle();
  if(!V){ main.innerHTML = '<p class="kgd-hinweis" style="padding:20px">Vorlage nicht gefunden.</p>'; return; }
  document.title = V.name + ' – Doku-Tools'; $('docTitel').textContent = V.name; $('ordnerLink').insertAdjacentText('beforeend', V.ordner ? V.ordner.name : 'Dokumente');
  werte = werte || { sb: KGD.ich, pos: [{ menge: '1' }] };
  if(!werte.pos?.length) werte.pos = [{ menge: '1' }];
  // Ein Kunde pro Rücksendung (werte.kunde = { id, name, adresse }); leer = Knecht AG (eigenes Lager).
  // Die Adresse steht bei jedem Artikel auf der ersten Bemerkungszeile, der Zusatz (p.bem) darunter. Dokument hängt am Kunden (Kontakte).
  // Name wie in der Kundensuche (kunde_suche): Firma, sonst Vorname Nachname, sonst Name
  const kundeName = k => (k.firma || '').trim() || [k.vorname, k.nachname].filter(Boolean).join(' ').trim() || k.name || '';
  const kundeAdr = k => [k.strasse, [k.plz, k.ort].filter(Boolean).join(' ')].filter(Boolean).join(', ');
  if(!quelle && P.get('kunde')){   // aus Kontakte (Kachel «Doku-Tool» › Neu)
    const { data: k } = await sb.from('kunde').select('id,name,firma,vorname,nachname,strasse,plz,ort').eq('id', P.get('kunde')).maybeSingle();
    if(k) werte.kunde = { id: k.id, name: kundeName(k), adresse: kundeAdr(k) };
  }
  // ältere Dokumente: Kunde stand in der Bemerkung
  if(werte.kunde_id && !werte.kunde){ werte.kunde = { id: werte.kunde_id, name: werte.kunde_name || '', adresse: '' }; werte.pos.forEach(p => { if(p.bem === werte.kunde_name) p.bem = ''; }); }
  delete werte.kunde_id; delete werte.kunde_name;
  // Rechnungskopien: mehrere möglich (Artikel von verschiedenen Rechnungen), früher nur werte.rechnung
  werte.rechnungen = werte.rechnungen || (werte.rechnung ? [werte.rechnung] : []); delete werte.rechnung;
  const kundeZeile = () => werte.kunde ? 'Kunde: ' + [werte.kunde.name, werte.kunde.adresse].filter(Boolean).join(', ') : 'Knecht AG Naturnahe Gärten, Badhaus 42, 3615 Heimenschwand';
  let gespeichert = dokId ? JSON.stringify(werte) : null;

  const vorlageBytes = await (await fetch(V.datei_pfad)).arrayBuffer();
  const person = id => (KGD.personen || []).find(p => p.id === id) || null;
  const sigCache = {};   // Unterschrift pro Person (PNG-Bytes) aus dem Speicher «unterschriften»
  async function unterschrift(id){
    if(!id) return null; if(id in sigCache) return sigCache[id];
    const { data } = await sb.storage.from('unterschriften').download(`mitarbeiter/${id}.png`);
    return sigCache[id] = data ? new Uint8Array(await data.arrayBuffer()) : null;
  }
  // «Von Hand» (p.vonHand): Artikel bleibt auf dem Blatt leer (Nummer, Bezeichnung, Menge, Grund mit Kugelschreiber), Kundenadresse steht trotzdem
  const aktiv = p => p.nr || p.vonHand;
  const rechnungNoetig = () => werte.pos.some(p => !p.vonHand && GRUENDE.find(g => g.k === p.grund)?.rechnung);
  const pflicht = () => !werte.sb ? 'Sachbearbeiter fehlt.' : !werte.pos.some(aktiv) ? 'Mindestens ein Artikel fehlt.'
    : werte.pos.some(p => p.nr && !p.vonHand && !p.grund) ? 'Grund der Rücksendung fehlt.' : '';
  const rechnungFehlt = () => rechnungNoetig() && !werte.rechnungen.length;

  // PDF erzeugen: Vorlage + Angaben (+ Rechnungskopie)
  async function erzeugen(mitRechnung){
    const { PDFDocument, StandardFonts, rgb } = PDFLib;
    const doc = await PDFDocument.load(vorlageBytes), s = doc.getPage(0);
    const f = await doc.embedFont(StandardFonts.Helvetica), fb = await doc.embedFont(StandardFonts.HelveticaBold), farbe = rgb(0.08, 0.1, 0.16);
    // Standardschrift kennt nur westeuropäische Zeichen: Rest weglassen statt Fehler
    const text = (t, x, y, gr = 10, bold = false, maxB = 0) => { t = String(t || '').replace(/[^\x20-\x7E\xA0-\xFF€–—‘’“”„…•]/g, ''); if(!t) return; const font = bold ? fb : f; let g = gr;
      if(maxB) while(g > 6.5 && font.widthOfTextAtSize(t, g) > maxB) g -= 0.5;
      if(maxB) while(t.length > 3 && font.widthOfTextAtSize(t, g) > maxB) t = t.slice(0, -2) + '…';
      s.drawText(t, { x, y, size: g, font, color: farbe }); };
    text(ABSENDER[0], 125, 698, 11, true); text(ABSENDER[1], 125, 675, 10);
    const pe = person(werte.sb); text([pe?.name, pe?.telefon, pe?.mail].filter(Boolean).join(' · '), 125, 651, 10, false, 420);
    werte.pos.slice(0, 3).forEach((p, i) => { const d = i * BLOCK, g = GRUENDE.find(x => x.k === p.grund);
      if(g && !p.vonHand) s.drawText('X', { x: g.x + 1.2, y: g.y - d + 0.8, size: 10, font: fb, color: farbe });
      if(p.nr && !p.vonHand){ text(p.nr, 36, 505 - d, 10, true, 88); text(p.bez, 125, 505 - d, 9.5, false, 385); text(p.menge, 522, 505 - d, 10, true, 50); }
      if(aktiv(p)){ text(kundeZeile(), 125, 483 - d, 9.5, false, 425); text(p.bem, 125, 471 - d, 9.5, false, 425); } });
    const heute = new Date(); text(`Heimenschwand, ${heute.getDate()}.${heute.getMonth() + 1}.${heute.getFullYear()}`, 96, 173, 10);
    const sig = werte.vonHand ? null : await unterschrift(werte.sb);   // «Von Hand unterschreiben»: Feld bleibt leer
    if(sig){ try { const bild = await doc.embedPng(sig), h = 24, b = Math.min(150, bild.width * h / bild.height); s.drawImage(bild, { x: 335, y: 164, width: b, height: h * b / (bild.width * h / bild.height) }); } catch(e){} }
    if(mitRechnung) for(const re of werte.rechnungen){
      const { data, error } = await sb.storage.from('doku-anhaenge').download(re.pfad);
      if(error) throw new Error('Rechnungskopie konnte nicht geladen werden: ' + error.message);
      const r = await PDFDocument.load(await data.arrayBuffer(), { ignoreEncryption: true });
      (await doc.copyPages(r, r.getPageIndices())).forEach(pg => doc.addPage(pg));
    }
    return doc.save();
  }

  // Vorschau: Seite 1 des erzeugten PDF
  let laeuft = 0;
  async function vorschau(){
    const nr = ++laeuft, bytes = await erzeugen(false); if(nr !== laeuft) return;
    const pdf = await pdfjsLib.getDocument({ data: bytes }).promise, pg = await pdf.getPage(1), vp = pg.getViewport({ scale: 2 });
    const c = $('blatt'); c.width = vp.width; c.height = vp.height; await pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    $('druckBtn').classList.toggle('unvoll', !!pflicht());   // fehlende Rechnungskopie blockiert nicht, beim Drucken kommt eine Nachfrage
  }
  let warte = null; const neu = () => { clearTimeout(warte); warte = setTimeout(() => { vorschau(); speichernSpaeter(); }, 250); };

  // Speichern (still, nach Änderungen)
  let spT = null; const speichernSpaeter = () => { clearTimeout(spT); spT = setTimeout(speichern, 900); };
  async function speichern(){
    const json = JSON.stringify(werte); if(json === gespeichert || !werte.pos.some(aktiv)) return true;
    const zeile = { vorlage_id: V.id, kunde_id: werte.kunde?.id || null, werte, datum: new Date().toISOString().slice(0, 10), adresse: werte.pos.filter(aktiv).map(p => p.vonHand ? 'von Hand' : p.nr).join(', '), geaendert_am: new Date().toISOString() };
    const r = dokId ? await sb.from('doku_dokument').update(zeile).eq('id', dokId).select('id').single() : await sb.from('doku_dokument').insert(zeile).select('id').single();
    if(r.error){ KGD.toast('Speichern fehlgeschlagen: ' + r.error.message, true); return false; }
    dokId = r.data.id; gespeichert = json; history.replaceState(null, '', 'doku-formular-live-v1.html?d=' + dokId); return true;
  }

  // Rechnungskopie aus PEAX über die Chrome-Erweiterung «Knechtgarten» (kg-seite.js → PEAX-Tab):
  // Volltextsuche nach den Artikelnummern, nur Rechnungen von Aqua Solar, Klick auf einen Treffer hängt das PDF an.
  const px = { laeuft: false, treffer: null, fehler: '', schluessel: '', holt: null };
  // PEAX immer im selben Tab (Name «peax»): ein zweiter Klick springt in diesen Tab statt einen neuen zu öffnen
  const PEAX_URL = 'https://app.peax.ch/inbox/search', PEAX_LINK = '<a href="' + PEAX_URL + '" target="peax">PEAX öffnen</a>';
  function ext(auftrag, daten){
    return new Promise((ok, nein) => {
      const ver = document.documentElement.dataset.kgExt; if(!ver) return nein(new Error('ohne'));
      if(auftrag === 'liste' && ver.split('.').map(Number).reduce((s, v) => s * 1000 + v, 0) < 33000) return nein(new Error('alt'));   // Rechnungsliste ab 0.33
      const nr = crypto.randomUUID();
      const f = e => { if(e.source !== window || e.data?.kanal !== 'kg-ext' || e.data.typ !== 'antwort' || e.data.nr !== nr) return;
        removeEventListener('message', f); clearTimeout(t); ok(e.data.antwort || { fehler: 'keine Antwort' }); };
      const t = setTimeout(() => { removeEventListener('message', f); nein(new Error('PEAX antwortet nicht')); }, 120000);
      addEventListener('message', f);
      postMessage({ kanal: 'kg-ext', typ: 'anfrage', nr, auftrag, daten }, location.origin);
    });
  }
  const pxFehler = f => f === 'alt' ? 'Dafür braucht es die Chrome-Erweiterung «Knechtgarten» ab Version 0.33 (wird gerade von Google geprüft).'
    : f === 'ohne' ? `Automatisch geht es mit der Chrome-Erweiterung «Knechtgarten» (ab Version 0.32). Sonst Rechnung in PEAX ausdrucken und von Hand ins Paket legen. ${PEAX_LINK}`
    : f === 'anmelden' ? `In PEAX nicht angemeldet. ${PEAX_LINK}, anmelden und nochmals suchen.`
    : /\b401\b/.test(f) ? 'PEAX-Anmeldung abgelaufen. PEAX-Tab neu laden und nochmals suchen.'
    : esc(f) + ` ${PEAX_LINK}`;
  const nummern = () => [...new Set(werte.pos.filter(p => p.nr).map(p => p.nr))];
  const datumCH = d => d ? d.split('-').reverse().join('.') : '';
  function pxListe(){
    if(px.laeuft) return '<span class="ffhinweis">Suche in PEAX …</span>';
    if(px.fehler) return `<span>${px.fehler}</span>`;
    if(!px.treffer) return '';
    if(!px.treffer.length) return `<span>Keine Rechnung von Aqua Solar mit ${esc(nummern().join(', '))} gefunden.</span>`;
    return `<div class="ffpx">${px.treffer.map((t, j) => `<button type="button" data-px="${j}" ${px.holt != null ? 'disabled' : ''}><span class="t">${esc(t.titel)}${nummern().length > 1 ? ` <small class="d">${esc((t.nr || []).join(', '))}</small>` : ''}</span><span class="d">${datumCH(t.datum)}</span><span class="b">${t.betrag != null ? 'CHF ' + Number(t.betrag).toLocaleString('de-CH', { minimumFractionDigits: 2 }) : ''}</span>${px.holt === j ? '<span class="d">lädt …</span>' : ''}</button>`).join('')}</div>`;
  }
  async function pxSuchen(){
    if(!document.documentElement.dataset.kgExt){ window.open(PEAX_URL, 'peax'); px.fehler = pxFehler('ohne'); angaben(); return; }   // ohne Erweiterung: PEAX zum Suchen von Hand öffnen
    const nr = nummern();
    if(!nr.length){ px.fehler = 'Zuerst einen Artikel wählen.'; angaben(); return; }
    px.laeuft = true; px.fehler = ''; px.treffer = null; px.schluessel = nr.join('|'); angaben();
    try { const a = await ext('suche', { suche: nr, sender: 'aqua.?solar' });
      if(a.fehler) px.fehler = pxFehler(a.fehler); else px.treffer = a.treffer || []; }

  // Artikel: ein Feld «Nummer oder Stichwort» (Ziffern = Aqua-Solar-Nummer, Wörter = Bezeichnung), Treffer aus dem Katalog

  // Rechnungs-Fenster (Erweiterung «Knechtgarten», PEAX): links alle Aqua-Solar-Rechnungen (neueste zuerst, Volltextsuche),

  const AS_ABSENDER = ['Aqua Solar AG', 'Aqua-Solar AG'];   // so heisst Aqua Solar in PEAX (zwei Schreibweisen)
  let reListe = null, reFuer = null, reT = null, reLauf = 0, reWahl = null;
  async function rechnungenOeffnen(i){

      <div class="kkat-kopf"><b>Rechnungen Aqua Solar</b><span class="kgd-hinweis">aus PEAX</span>
        <input class="kgd-t" id="reQ" placeholder="In Rechnungen suchen: Wort oder Nummer" autocomplete="off"><button type="button" class="kg-ibtn" id="reZu" title="Schliessen">${ic('x', 13)}</button></div>

  let reZu = () => {};

    artikelSetzen(i, nr, kat ? kat.bez : art ? art.bezeichnung : bezZeile, art ? art.id : null);
    try { if(await rechnungAnhaengen(t)){ angaben(); neu(); KGD.toast(`${t.titel} als Rechnungskopie angehängt`); } }
    catch(err){ KGD.toast('Rechnung konnte nicht angehängt werden: ' + err.message, true); }
  }

  // Angaben (links)
  const gr = GRUENDE.map(g => g.k);
  function angaben(){
    const pe = person(werte.sb);
    $('ang').innerHTML = `<div class="kgd-feld"><label for="sb">Sachbearbeiter</label><select class="kgd-t" id="sb">${(KGD.personen || []).map(p => `<option value="${p.id}" ${p.id === werte.sb ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>
        <div class="ffsig" id="sigZeile"></div></div>
      <div class="kgd-feld"><label for="kundeQ">Kunde</label>${werte.kunde ? `<div class="ffart"><span style="flex:1;min-width:0"><b>${esc(werte.kunde.name)}</b>${werte.kunde.adresse ? ' · ' + esc(werte.kunde.adresse) : ''}</span><button type="button" class="kg-ibtn" id="kundeWeg" title="Anderen Kunden wählen">${ic('x', 12)}</button></div>`
        : `<input class="kgd-t" id="kundeQ" autocomplete="off" placeholder="Kunde suchen (Name, Ort …)"><div class="kgd-menue hidden" id="kundeM"></div><span class="ffhinweis">Leer = Knecht AG (eigenes Lager). Ein Kunde pro Rücksendung.</span>`}</div>
      ${werte.pos.map((p, i) => `<div class="ffpos"><div class="kopf">Artikel ${i + 1}<label class="ffhand" title="Artikel auf dem Blatt leer lassen und beim Versand von Hand ausfüllen"><input type="checkbox" data-vonhand="${i}"${p.vonHand ? ' checked' : ''}>Von Hand</label>${werte.pos.length > 1 ? `<button type="button" class="kg-ibtn danger" data-posweg="${i}" title="Artikel entfernen">${ic('trash', 13)}</button>` : ''}</div>
        ${p.vonHand ? '<div class="ffhinweis">Nummer, Bezeichnung, Menge und Grund bleiben leer und werden beim Versand von Hand eingetragen.</div>' : `<div class="kgd-reihe"><div class="kgd-feld"><label>Artikel</label>${p.nr ? `<div class="ffart"><b>${esc(p.nr)}</b><span style="flex:1;min-width:0">${esc(p.bez || '')}</span><button type="button" class="kg-ibtn" data-artweg="${i}" title="Anderen Artikel wählen">${ic('x', 12)}</button></div>`
          : `<div class="ffnr"><input class="kgd-t" data-artq="${i}" autocomplete="off" placeholder="Nummer oder Stichwort"><button type="button" class="kg-ibtn ffbuch" data-rechnungen="${i}" title="In Aqua-Solar-Rechnungen suchen (PEAX)" aria-label="In Aqua-Solar-Rechnungen suchen">${ic('rechnung', 16)}</button><button type="button" class="kg-ibtn ffbuch" data-katalog="${i}" title="Im Katalog suchen" aria-label="Im Katalog suchen">${ic('buch', 16)}</button><div class="kgd-menue hidden" data-artm="${i}"></div></div>`}</div>
          <div class="kgd-feld" style="flex:0 0 70px"><label>Menge</label><input class="kgd-t" data-menge="${i}" value="${esc(p.menge || '')}" inputmode="numeric"></div></div>`}
        <div class="kgd-feld"><label>Zusatz <small class="opt">optional, steht unter der Kundenadresse</small></label><input class="kgd-t" data-bem="${i}" value="${esc(p.bem || '')}" placeholder="z. B. Pumpe läuft nicht an, brummt nur" autocomplete="off"></div>
        ${p.vonHand ? '' : `<div class="ffgrund">${GRUENDE.map(g => `<label><input type="radio" name="g${i}" data-grund="${i}" value="${g.k}" ${p.grund === g.k ? 'checked' : ''}>${esc(g.n)}</label>`).join('')}</div>`}</div>`).join('')}
      ${werte.pos.length < 3 ? '<button type="button" class="kgd-btn ghost" id="posNeu">+ Artikel</button>' : ''}
      ${rechnungNoetig() ? `<div class="ffre ${werte.rechnungen.length ? 'ok' : 'noetig'}"><b>${werte.rechnungen.length ? (werte.rechnungen.length > 1 ? werte.rechnungen.length + ' Rechnungskopien angehängt' : 'Rechnungskopie angehängt') : 'Rechnungskopie nötig'}</b>
        ${werte.rechnungen.map((r, k) => `<div class="zeile">${ic('rechnung', 14)}<span style="flex:1;min-width:0">${esc(r.name)}</span><button type="button" class="kg-ibtn danger" data-reweg="${k}" title="Rechnungskopie entfernen">${ic('trash', 13)}</button></div>`).join('')}
        ${werte.rechnungen.length ? '' : '<span>Für Gutschrift und Garantie verlangt Aqua Solar die Rechnung. Wählst du den Artikel über das Rechnungs-Icon, hängt sie automatisch an.</span>'}
        <div class="zeile"><button type="button" class="kgd-btn ${werte.rechnungen.length ? 'ghost' : 'prim'}" id="rePeax" ${px.laeuft ? 'disabled' : ''}>${ic('suche', 14)}${werte.rechnungen.length ? 'Weitere in PEAX suchen' : 'In PEAX suchen'}</button></div>
        ${pxListe()}</div>` : ''}`;
    sigZeile(); setTimeout(pxAuto, 0);
  }
  async function sigZeile(){
    const el = $('sigZeile'); if(!el) return; const sig = await unterschrift(werte.sb);
    // Unterschriften werden in Kontakte › Mitarbeitende › «Merkmale & Unterschrift» gepflegt
    el.innerHTML = sig ? `<img src="${URL.createObjectURL(new Blob([sig], { type: 'image/png' }))}" alt="Unterschrift"${werte.vonHand ? ' class="aus"' : ''}><label class="kgd-schalter"><input type="checkbox" id="vonHand"${werte.vonHand ? ' checked' : ''}>Von Hand unterschreiben</label>`
      : `<span>Keine Unterschrift hinterlegt – von Hand unterschreiben.</span><a href="tool-d-kunden-live-v1.html?modus=mitarbeitende&person=${encodeURIComponent(werte.sb || '')}" target="_blank" rel="noopener">In Kontakte hinterlegen</a>`;
  }
  // zurück aus Kontakte (anderer Tab): Unterschrift neu laden
  addEventListener('focus', () => { if(werte.sb && !sigCache[werte.sb]){ delete sigCache[werte.sb]; sigZeile(); neu(); } });

  main.innerHTML = `<div class="kgd-flaeche"><div class="ffblatt"><canvas id="blatt" aria-label="Vorschau des Formulars" title="Angaben bearbeiten"></canvas><span class="ffhinweis" id="seitenHinweis"></span></div>
    <div class="kgd-schleier" id="schleier"></div>
    <div class="kgd-daten ffdaten" id="daten" role="dialog" aria-label="Angaben ausfüllen"><header><b>Angaben</b><span class="kgd-hinweis">Absender, Ort und Datum stehen schon</span></header>
      <div class="kgd-felder" id="ang"></div>
      <footer><button type="button" class="kgd-btn ghost" id="datenZu">Schliessen</button><button type="button" class="kgd-btn prim" id="datenOk">Fertig</button></footer></div></div>`;
  angaben(); vorschau();
  // Angaben-Fenster: neues Dokument offen, geöffnetes Dokument zeigt das Blatt; Klick aufs Blatt oder «Angaben» öffnet es wieder
  const fenster = auf => { $('daten').classList.toggle('hidden', !auf); $('schleier').classList.toggle('hidden', !auf); if(auf) scrollTo({ top: 0 }); };
  $('datenBtn').addEventListener('click', () => fenster(true));
  $('blatt').addEventListener('click', () => fenster(true));
  $('datenZu').addEventListener('click', () => fenster(false));
  $('schleier').addEventListener('click', () => fenster(false));
  $('datenOk').addEventListener('click', () => { fenster(false); speichern(); });
  fenster(!dokId);

  // Kunde (einmal pro Rücksendung): Kundenliste wie im Doku-Dokument
  let kuT = null, kuLauf = 0, kuTreffer = [];
  function kundeSuchen(q){
    clearTimeout(kuT); const m = $('kundeM'); if(!m) return;
    if(q.length < 2){ m.classList.add('hidden'); return; }
    kuT = setTimeout(async () => { const nr = ++kuLauf;
      const { data } = await sb.rpc('kunde_suche', { q, anzahl: 10 }); if(nr !== kuLauf) return;
      kuTreffer = data || [];
      m.innerHTML = kuTreffer.map((k, j) => `<button type="button" data-kuw="${j}"><b>${esc(k.name || '')}</b><small>${esc(kundeAdr(k) || 'keine Adresse')}${k.kundennummer ? ' · Nr. ' + esc(k.kundennummer) : ''}</small></button>`).join('') || '<div class="kopfzeile">Kein Kunde gefunden.</div>';
      m.classList.remove('hidden'); }, 250);
  }
  main.addEventListener('mousedown', e => {
    const k = e.target.closest('[data-kuw]'), a = e.target.closest('[data-artw]'); if(!k && !a) return; e.preventDefault();
    if(k){ const x = kuTreffer[+k.dataset.kuw]; werte.kunde = { id: x.id, name: x.name || '', adresse: kundeAdr(x) }; angaben(); neu(); return; }
    const [i, j] = a.dataset.artw.split(':').map(Number), t = artTreffer[i][j]; artikelSetzen(i, t.nr, t.bez, t.id || null);
  });
  main.addEventListener('focusout', e => { const t = e.target;
    if(t.id === 'kundeQ') setTimeout(() => $('kundeM')?.classList.add('hidden'), 180);
    if(t.dataset?.artq != null) setTimeout(() => main.querySelector(`[data-artm="${t.dataset.artq}"]`)?.classList.add('hidden'), 180); });

  // Ereignisse
  main.addEventListener('input', e => {
    const t = e.target;
    if(t.dataset.menge != null){ werte.pos[+t.dataset.menge].menge = t.value.trim(); neu(); }
    else if(t.dataset.bem != null){ werte.pos[+t.dataset.bem].bem = t.value.trim(); neu(); }
    else if(t.dataset.artq != null) artSuchen(+t.dataset.artq, t.value.trim());
    else if(t.id === 'kundeQ') kundeSuchen(t.value.trim());
  });
  // Enter im Artikelfeld: ersten Treffer übernehmen (bei genauer Nummer genau diesen)
  main.addEventListener('keydown', e => { const t = e.target; if(t.dataset.artq == null || e.key !== 'Enter') return; e.preventDefault();
    const i = +t.dataset.artq, L = artTreffer[i] || [], q = t.value.trim(), x = L.find(y => y.nr === q) || (L.length === 1 ? L[0] : null);
    if(x) artikelSetzen(i, x.nr, x.bez, x.id || null); });
  main.addEventListener('change', e => {
    const t = e.target;
    if(t.id === 'sb'){ werte.sb = t.value; angaben(); neu(); }
    else if(t.id === 'vonHand'){ werte.vonHand = t.checked || undefined; sigZeile(); neu(); }
    else if(t.dataset.vonhand != null){ const p = werte.pos[+t.dataset.vonhand]; if(t.checked){ p.vonHand = true; p.nr = ''; p.bez = ''; p.artikel_id = null; p.grund = ''; } else delete p.vonHand; angaben(); neu(); }
    else if(t.dataset.grund != null){ werte.pos[+t.dataset.grund].grund = t.value; angaben(); neu(); }
  });
  main.addEventListener('click', async e => {
    const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.rechnungen != null){ rechnungenOeffnen(+b.dataset.rechnungen); return; }
    if(b.dataset.katalog != null){ katalogOeffnen(+b.dataset.katalog); return; }
    if(b.id === 'kundeWeg'){ werte.kunde = null; angaben(); neu(); setTimeout(() => $('kundeQ')?.focus(), 0); return; }
    if(b.id === 'posNeu'){ werte.pos.push({ menge: '1' }); angaben(); return; }
    if(b.dataset.posweg != null){ werte.pos.splice(+b.dataset.posweg, 1); angaben(); neu(); return; }
    if(b.dataset.artweg != null){ const p = werte.pos[+b.dataset.artweg]; p.nr = ''; p.bez = ''; p.artikel_id = null; angaben(); neu(); return; }
    if(b.dataset.reweg != null){ const [alt] = werte.rechnungen.splice(+b.dataset.reweg, 1); angaben(); neu(); if(alt) sb.storage.from('doku-anhaenge').remove([alt.pfad]); return; }
    if(b.id === 'rePeax'){ pxSuchen(); return; }
    if(b.dataset.px != null){ pxHolen(+b.dataset.px); return; }
  });

  // Drucken: fertiges PDF (mit Rechnungskopie) in einem unsichtbaren Rahmen drucken
  $('druckBtn').addEventListener('click', async () => {
    const f = pflicht(); if(f) return KGD.toast(f, true);
    if(rechnungFehlt()){   // Gutschrift/Garantie ohne Rechnungskopie: nachfragen statt blockieren
      const w = await KGD.dialog('<h3>Rechnungskopie fehlt</h3><p class="kgd-hinweis" style="font-size:13px">Für Gutschrift und Garantie verlangt Aqua Solar die Rechnung. Trotzdem drucken und die Kopie von Hand ins Paket legen?</p>',
        [['Zurück', 'ghost', null], ['Trotzdem drucken', 'prim', 'los']]);
      if(w !== 'los') return;
    }
    await speichern();
    try { const bytes = await erzeugen(true), url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
      $('druckFrame')?.remove(); const fr = document.createElement('iframe'); fr.id = 'druckFrame'; fr.style.cssText = 'position:fixed;width:0;height:0;border:0;right:0;bottom:0'; fr.src = url;
      fr.onload = () => { try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch(e){ window.open(url, '_blank'); } }; document.body.appendChild(fr);
    } catch(err){ KGD.toast(err.message || String(err), true); }
  });
}
KGD.start(aufbau);
</script>
</body>
</html>
