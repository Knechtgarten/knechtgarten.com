<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=58"></script>
<title>Heute – Knechtgarten</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#323E4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Knechtgarten">
<link rel="manifest" href="/heute-manifest.json">
<link rel="apple-touch-icon" href="/knecht-tool-180.png">
<style>
/* Handy-Startseite: Infos vom Büro, mein Einsatz (Tage durchblättern), meine Pendenzen heute, Schnellzugriffe, Leiste unten */
:root{ --bg:#F5F7F9; --primary:#323E4E; --ink:#232B35; --muted:#6B7079; --line:#E1E5E9; --gruen:#3F7D3F; }
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);line-height:1.4;font-size:15px;-webkit-tap-highlight-color:transparent;}
.hidden{display:none !important;}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.kopf{background:var(--primary);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;display:flex;align-items:center;gap:10px;}
.kopf .t{flex:1;display:flex;flex-direction:column;}
.kopf b{font-size:19px;}
.kopf small{font-size:13px;opacity:.75;}
.kopf button{all:unset;cursor:pointer;font-size:13px;opacity:.8;padding:6px 4px;}
.w{max-width:560px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;}
.karte{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;}
.karte h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px;}
.karte h2 a{margin-left:auto;text-transform:none;letter-spacing:0;font-size:13px;color:var(--primary);text-decoration:none;font-weight:600;}
.klein{font-size:12.5px;color:var(--muted);}
.leer{font-size:14px;color:var(--muted);padding:4px 0;}
/* Tage */
.tage{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px;}
.tage::-webkit-scrollbar{display:none;}
.tag{all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:52px;height:56px;border-radius:12px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--muted);position:relative;}
.tag b{font-size:17px;color:var(--ink);}
.tag[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:#D6E7F4;}
.tag[aria-pressed=true] b{color:#fff;}
.tag i{position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:#8B9097;}
.tag[aria-pressed=true] i{background:#D1DB5F;}
/* Einsatz */
.eins{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;background:var(--bg);border-left:4px solid var(--primary);}
.eins.absenz{border-left-color:#8B9097;}
.eins .art{font-size:12px;color:var(--muted);}
.eins .n{font-size:18px;font-weight:600;color:var(--primary);line-height:1.25;}
.eins .adr{font-size:14px;}
.eins .info{font-size:14px;background:#fff;border-radius:8px;padding:8px 10px;border:1px solid var(--line);white-space:pre-line;}
.knoepfe{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.knopf{all:unset;box-sizing:border-box;cursor:pointer;min-height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;text-align:center;padding:0 12px;text-decoration:none;}
.knopf.hell{border:1px solid #D5DBE1;background:#fff;color:var(--primary);}
.knopf.dunkel{background:var(--primary);color:#fff;}
/* Pendenzen */
.pz{display:flex;align-items:center;gap:12px;min-height:46px;padding:4px 0;border-top:1px solid var(--line);}
.pz:first-of-type{border-top:0;}
.pz input{width:24px;height:24px;accent-color:var(--gruen);flex:none;}
.pz span{flex:1;min-width:0;font-size:15px;}
.pz small{display:block;font-size:12px;color:var(--muted);}
/* Schnellzugriffe */
.schnell{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.schnell a{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:12px;text-align:center;padding:6px 2px;border-radius:12px;}
.schnell a:active{background:var(--bg);}
/* Leiste unten */
.unten{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));z-index:20;}
.unten a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);text-decoration:none;padding:4px 0;}
.unten a svg.i{width:24px;height:24px;}
.unten a.akt{color:var(--primary);font-weight:600;}
.unten a.kam{color:#fff;}
.unten a.kam span.r{width:52px;height:52px;margin-top:-22px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(50,62,78,.25);}
.unten a.kam span.r svg.i{width:26px;height:26px;}
.unten a.kam em{font-style:normal;color:var(--muted);}
.loginwrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.logincard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
.logincard input{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
.toastwrap{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;z-index:50;pointer-events:none}
.toast{background:#323E4E;color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;max-width:90%}.toast.err{background:#7A2638}
</style>
</head>
<body>
<div class="loginwrap hidden" id="loginwrap"><div class="logincard"><b style="font-size:18px;color:#323E4E">Knechtgarten</b>
  <input autocomplete="username" id="loginEmail" type="email" placeholder="E-Mail"><input autocomplete="current-password" id="loginPassword" type="password" placeholder="Passwort">
  <button class="knopf dunkel" id="loginBtn">Anmelden</button><div class="klein" id="loginStatus"></div></div></div>

<div id="app" class="hidden">
  <div class="kopf"><span class="t"><b id="gruss">Guten Tag</b><small id="datum"></small></span><button type="button" id="logoutBtn">Abmelden</button></div>
  <div class="w">
    <div data-kg-infos></div><!-- Infos vom Büro (kg-infos.js) -->
    <div class="karte"><h2>Mein Einsatz<a href="einsatzplaner-live-v1.html">Planer</a></h2><div class="tage" id="tage"></div><div id="einsatz"><div class="leer">Lädt …</div></div></div>
    <div class="karte"><h2>Meine Pendenzen heute<a href="pendenzen-app.html">Alle</a></h2><div id="pend"><div class="leer">Lädt …</div></div></div>
    <div class="karte"><h2>Schnellzugriff</h2><div class="schnell" id="schnell"></div></div>
  </div>
  <nav class="unten" id="unten"></nav>
</div>
<div class="toastwrap" id="toastwrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const sb = window.supabase.createClient('https://oalapdxinqlnzwxhyuzy.supabase.co', 'sb_publishable_DoeD4uEnwemmnFu4AxE9uw_5lmQYc5P');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const svg = p => `<svg class="i" viewBox="0 0 24 24">${p}</svg>`;
const I = k => svg(KG.pfade[k] || KG.toolIcons[k] || '');
const toast = (t, err) => { const d = document.createElement('div'); d.className = 'toast' + (err ? ' err' : ''); d.textContent = t; $('toastwrap').appendChild(d); setTimeout(() => d.remove(), 3500); };
const tagKey = d => new Date(d).toLocaleDateString('sv');   // JJJJ-MM-TT in Ortszeit
const WT = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const ART = { baustelle: 'Baustelle', termin: 'Termin', hilfe: 'Mithilfe', absenz: 'Abwesend' };

let ICH = null, PERS = [], TAGE = [], EINS = [], HAUPT = [], KUNDEN = {}, INFOS = [], TAG = null;

async function pruefeAnmeldung(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ $('loginwrap').classList.remove('hidden'); return; }
  const { data: b } = await sb.from('benutzer').select('id,anzeigename,email,rolle,aktiv').eq('id', session.user.id).maybeSingle();
  if(!b?.rolle || b.aktiv === false){ $('loginwrap').classList.remove('hidden'); $('loginStatus').textContent = 'Dein Konto ist noch nicht freigeschaltet.'; return; }
  ICH = b; $('loginwrap').classList.add('hidden'); $('app').classList.remove('hidden');
  KG.infosBereit.then(i => i && i.start());
  start();
}
$('loginBtn').onclick = async () => { $('loginStatus').textContent = 'Melde an …';
  const { error } = await sb.auth.signInWithPassword({ email: $('loginEmail').value.trim(), password: $('loginPassword').value });
  if(error){ $('loginStatus').textContent = 'Anmelden hat nicht geklappt: ' + error.message; return; } pruefeAnmeldung(); };
$('logoutBtn').onclick = async () => { await sb.auth.signOut(); location.reload(); };

function start(){
  const h = new Date().getHours(), vn = (ICH.anzeigename || '').split(' ')[0];
  $('gruss').textContent = (h < 11 ? 'Guten Morgen' : h < 17 ? 'Guten Tag' : 'Guten Abend') + (vn ? ', ' + vn : '');
  $('datum').textContent = new Date().toLocaleDateString('de-CH', { weekday: 'long', day: 'numeric', month: 'long' });
  leisteUnten(); schnell(); ladeEinsatz(); ladePend();
}

function leisteUnten(){
  $('unten').innerHTML = [
    `<a class="akt" href="heute-live-v1.html">${I('home')}Heute</a>`,
    `<a href="pendenzen-app.html">${I('pend')}Pendenzen</a>`,
    `<a class="kam" href="fotos-live-v1.html"><span class="r">${I('foto')}</span><em>Fotos</em></a>`,
    `<a href="einsatzplaner-live-v1.html">${I('plan')}Planer</a>`,
    `<a href="index.html?voll=1">${I('raster')}Mehr</a>`].join('');
}

function schnell(){
  const L = [['wissen-live-v1', 'wissen', 'Nachschlagewerk', 'violett'], ['werkzeuge-live-v1', 'werkzeuge', 'Werkzeuge', 'grau'], ['tool-d-kunden-live-v1', 'kunden', 'Kontakte', 'gold'], ['pflege-handy-live-v1', 'pflege', 'Pflege', 'gruen']];
  $('schnell').innerHTML = L.filter(([s]) => !(KG.seiteErlaubt && KG.seiteErlaubt(s) === false))
    .map(([s, k, n]) => `<a href="${s}.html">${KG.toolIcon(k, 40)}<span>${n}</span></a>`).join('');
}

/* ---------- Mein Einsatz: eigene Einsätze der nächsten Arbeitstage, Mithilfe zeigt den Einsatz der Person, bei der ich helfe ---------- */
async function ladeEinsatz(){
  const heute = new Date(); heute.setHours(0, 0, 0, 0);
  TAGE = []; for(let d = new Date(heute); TAGE.length < 7; d.setDate(d.getDate() + 1)) if(d.getDay() % 6 || !TAGE.length) TAGE.push(tagKey(d));
  TAG = TAGE[0];
  const bis = new Date(heute); bis.setDate(bis.getDate() + 12);
  const { data: pp } = await sb.from('planer_person').select('id,name').eq('benutzer_id', ICH.id).eq('aktiv', true);
  PERS = (pp || []).map(p => p.id);
  if(!PERS.length){ $('tage').innerHTML = ''; $('einsatz').innerHTML = '<div class="leer">Du bist im Planer noch keiner Person zugeordnet. Das Büro kann das in der Verwaltung nachholen.</div>'; return; }
  const felder = 'id,person_id,mit_person_id,art,beginn,ende,kunde_id,titel,notiz';
  const { data: e, error } = await sb.from('planer_einsatz').select(felder).in('person_id', PERS).lt('beginn', bis.toISOString()).gte('ende', heute.toISOString()).order('beginn');
  if(error){ $('einsatz').innerHTML = '<div class="leer">Planer konnte nicht geladen werden.</div>'; return; }
  EINS = e || [];
  const mit = [...new Set(EINS.filter(x => x.art === 'hilfe' && x.mit_person_id).map(x => x.mit_person_id))];
  HAUPT = mit.length ? ((await sb.from('planer_einsatz').select(felder + ',person:person_id(name)').in('person_id', mit).in('art', ['baustelle', 'termin']).lt('beginn', bis.toISOString()).gte('ende', heute.toISOString())).data || []) : [];
  const kIds = [...new Set([...EINS, ...HAUPT].map(x => x.kunde_id).filter(Boolean))];
  if(kIds.length) ((await sb.from('kunde').select('id,name,firma,strasse,plz,ort,geo_lat,geo_lon').in('id', kIds)).data || []).forEach(k => KUNDEN[k.id] = k);
  const eIds = [...EINS, ...HAUPT].map(x => x.id);
  INFOS = eIds.length ? ((await sb.from('planer_einsatz_info').select('einsatz_id,tag,text').in('einsatz_id', eIds)).data || []) : [];
  if(!TAGE.some(t => anTag(t).length) && !EINS.length){
    const { data: n } = await sb.from('planer_einsatz').select('beginn,titel,art').in('person_id', PERS).gte('beginn', bis.toISOString()).neq('art', 'absenz').order('beginn').limit(1);
    if(n && n[0]) $('einsatz').dataset.naechster = `Nächster Einsatz: ${new Date(n[0].beginn).toLocaleDateString('de-CH', { weekday: 'short', day: 'numeric', month: 'long' })}${n[0].titel ? ' · ' + n[0].titel : ''}`;
  }
  zeigeTage(); zeigeEinsatz();
}
const deckt = (x, t) => tagKey(x.beginn) <= t && tagKey(x.ende) >= t;
const anTag = t => EINS.filter(x => deckt(x, t));

function zeigeTage(){
  $('tage').innerHTML = TAGE.map((t, i) => { const d = new Date(t + 'T12:00');
    return `<button type="button" class="tag" data-t="${t}" aria-pressed="${t === TAG}">${i ? WT[d.getDay()] : 'Heute'}<b>${d.getDate()}</b>${anTag(t).some(x => x.art !== 'absenz') ? '<i></i>' : ''}</button>`; }).join('');
  $('tage').querySelectorAll('.tag').forEach(b => b.onclick = () => { TAG = b.dataset.t; zeigeTage(); zeigeEinsatz(); });
}

function einsatzHtml(x){
  let ziel = x, bei = '';
  if(x.art === 'hilfe'){ const h = HAUPT.find(y => y.person_id === x.mit_person_id && deckt(y, TAG)); bei = `Mithilfe bei ${esc((h && h.person && h.person.name) || '')}`; if(h) ziel = h; }
  const k = KUNDEN[ziel.kunde_id], name = (k && (k.name || k.firma)) || ziel.titel || (x.art === 'hilfe' ? '' : ART[x.art]);
  const adr = k ? [k.strasse, [k.plz, k.ort].filter(Boolean).join(' ')].filter(Boolean).join(', ') : '';
  const nav = k && (k.geo_lat ? `${k.geo_lat},${k.geo_lon}` : adr);
  const infos = INFOS.filter(i => i.einsatz_id === x.id || i.einsatz_id === ziel.id).filter(i => !i.tag || i.tag === TAG).map(i => i.text);
  if(ziel.notiz) infos.unshift(ziel.notiz);
  return `<div class="eins ${x.art}"><span class="art">${bei || ART[x.art] || ''}${tagKey(x.beginn) !== tagKey(x.ende) ? ` · bis ${new Date(x.ende).toLocaleDateString('de-CH', { weekday: 'short', day: 'numeric', month: 'numeric' })}` : ''}</span>
    ${name ? `<span class="n">${esc(name)}</span>` : ''}${adr ? `<span class="adr">${esc(adr)}</span>` : ''}
    ${infos.map(t => `<div class="info">${esc(t)}</div>`).join('')}
    ${x.art !== 'absenz' ? `<div class="knoepfe">${nav ? `<a class="knopf hell" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(nav)}" target="_blank" rel="noopener">${I('karte')}Navigation</a>` : ''}<a class="knopf dunkel" href="fotos-live-v1.html"${nav ? '' : ' style="grid-column:1/-1"'}>${I('foto')}Fotos</a></div>` : ''}</div>`;
}
function zeigeEinsatz(){
  const l = anTag(TAG);
  $('einsatz').innerHTML = l.length ? l.map(einsatzHtml).join('')
    : `<div class="leer">An diesem Tag ist für dich nichts geplant.</div>${TAG === TAGE[0] && $('einsatz').dataset.naechster ? `<div class="klein">${esc($('einsatz').dataset.naechster)}</div>` : ''}`;
}

/* ---------- Meine Pendenzen heute (Zeit = Heute), wie auf der Startseite ---------- */
async function ladePend(){
  const el = $('pend');
  const { data: boards } = await sb.from('pendenz_board').select('id').eq('besitzer_id', ICH.id);
  const bIds = (boards || []).map(b => b.id);
  if(!bIds.length){ el.innerHTML = '<div class="leer">Noch kein eigenes Board.</div>'; return; }
  const { data: listen } = await sb.from('pendenz_liste').select('id,titel').in('board_id', bIds);
  const L = Object.fromEntries((listen || []).map(l => [l.id, l]));
  const { data: pz, error } = Object.keys(L).length ? await sb.from('pendenz').select('id,titel,liste_id').eq('erledigt', false).eq('zeit', 1).in('liste_id', Object.keys(L)).order('zeit_sortierung') : { data: [] };
  if(error){ el.innerHTML = '<div class="leer">Pendenzen konnten nicht geladen werden.</div>'; return; }
  el.innerHTML = (pz || []).map(p => `<label class="pz"><input type="checkbox" data-erl="${p.id}" aria-label="Erledigt"><span>${esc(p.titel)}<small>${esc((L[p.liste_id] || {}).titel || '')}</small></span></label>`).join('')
    || '<div class="leer">Für heute ist nichts offen.</div>';
  el.querySelectorAll('[data-erl]').forEach(c => c.addEventListener('change', async () => {
    const { error: e2 } = await sb.from('pendenz').update({ erledigt: true, erledigt_am: new Date().toISOString(), erledigt_von: ICH.id }).eq('id', c.dataset.erl);
    if(e2){ c.checked = false; toast('Konnte nicht gespeichert werden: ' + e2.message, true); return; }
    c.closest('.pz').remove(); toast('Erledigt');
    if(!el.querySelector('.pz')) el.innerHTML = '<div class="leer">Für heute ist nichts offen.</div>';
  }));
}

pruefeAnmeldung();
</script>
</body>
</html>
