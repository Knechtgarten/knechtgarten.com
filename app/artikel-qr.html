<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=100"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Knechtgarten · Artikel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@600&display=swap" rel="stylesheet">
<style>
/* Handy-Seite nach dem Scan eines Artikel-Klebers im Lager (ohne Anmeldung): Artikel, Nummer, Lieferant und – falls
   verknüpft – das Sicherheitsdatenblatt. «Bestellen» kommt später auf diese Seite (nur bei angebundenem Shop). Daten über die Edge Function «artikel-qr». */
:root{--navy:#323E4E;--bg:#F5F7F9;--grau:#8B9097;--line:#E1E5EA;--gelbhell:#FFF8D6;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--navy);font:16px/1.5 -apple-system,"Segoe UI",Arial,sans-serif;}
.kopf{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;}
.kopf .marke{font-family:Jost,sans-serif;font-weight:600;font-size:17px;letter-spacing:.2px;}
main{max-width:640px;margin:0 auto;padding:14px 16px 32px;}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;}
.titel{display:flex;gap:12px;align-items:center;}
.titel img{width:80px;height:80px;object-fit:contain;border-radius:8px;flex:none;background:#fff;border:1px solid var(--line);}
h1{font-family:Jost,sans-serif;font-weight:600;font-size:21px;line-height:1.25;margin:0;}
.daten{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;} .daten span{color:var(--grau);} .daten b{font-variant-numeric:tabular-nums;}
.knopf{display:flex;align-items:center;gap:12px;background:var(--gelbhell);border:1px solid #F0E2A0;border-radius:10px;padding:14px;color:var(--navy);text-decoration:none;}
.knopf svg{width:26px;height:26px;flex:none;} .knopf b{display:block;font-size:17px;} .knopf small{color:var(--grau);font-size:13px;}
.leer{color:var(--grau);}
.fuss{text-align:center;color:var(--grau);font-size:13px;margin-top:20px;}
.fuss a{color:var(--navy);}
</style>
</head>
<body data-kg-ohne-leiste>
<div class="kopf"><span class="marke">Knechtgarten</span></div>
<main id="inhalt"><div class="card leer">Lädt …</div></main>
<script>
const SUPABASE_URL = 'https://oalapdxinqlnzwxhyuzy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_DoeD4uEnwemmnFu4AxE9uw_5lmQYc5P';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
// Überschrift-Icon (eigenes erlaubt): Warnzeichen
const WARN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4.5M12 17.5h.01"/></svg>';
async function start(){
  const m = location.pathname.match(/^\/a\/([a-z0-9]+)/i), code = m ? m[1] : new URLSearchParams(location.search).get('c');
  const el = document.getElementById('inhalt');
  if(!code){ el.innerHTML = '<div class="card leer">Kein Code gefunden. Bitte den QR-Code nochmals scannen.</div>'; return; }
  let d;
  try{
    const r = await fetch(`${SUPABASE_URL}/functions/v1/artikel-qr`, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY }, body: JSON.stringify({ code }) });
    d = await r.json(); if(!r.ok) throw new Error(d.error || r.status);
  }catch(e){ el.innerHTML = '<div class="card leer">Dieser QR-Code ist nicht mehr gültig. Bitte im Büro melden.</div>'; return; }
  document.title = d.bezeichnung + ' · Knechtgarten';
  let h = `<div class="card titel">${d.foto ? `<img src="${esc(d.foto)}" alt="">` : ''}<h1>${esc(d.bezeichnung)}</h1></div>
    <div class="card daten">${d.nummer ? `<span>Artikel-Nr.</span><b>${esc(d.nummer)}</b>` : ''}${d.einheit ? `<span>Einheit</span><b>${esc(d.einheit)}</b>` : ''}${d.lieferant ? `<span>Lieferant</span><b>${esc(d.lieferant)}</b>` : ''}</div>`;
  if(d.sdb) h += `<a class="knopf" href="${esc(d.sdb.url)}">${WARN}<span><b>Sicherheitsdatenblatt</b><small>${esc(d.sdb.titel)} · mit Notfallnummer</small></span></a>`;
  h += `<div class="fuss">Fragen? Knechtgarten · <a href="tel:+41334531020">033 453 10 20</a></div>`;
  el.innerHTML = h;
}
start();
</script>
</body>
</html>
