<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=35"></script>
<title>Zugang – Knechtgarten</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F5F7F9;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#232B35;}
.karte{background:#fff;border:1px solid #E1E5E9;border-radius:12px;padding:28px 24px;max-width:340px;width:calc(100% - 32px);text-align:center;}
h1{font-size:17px;color:#323E4E;margin:0 0 10px;}
p{font-size:13px;color:#8B9097;line-height:1.5;margin:0;}
p.err{color:#C05A1C;}
</style>
</head>
<body>
<!-- Persönlicher Link für temporäre Mitarbeitende: zugang.html#t=<schlüssel> meldet ohne Passwort an und öffnet den Einsatzplaner -->
<div class="karte"><h1>Knechtgarten</h1><p id="txt">Anmelden …</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://oalapdxinqlnzwxhyuzy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_DoeD4uEnwemmnFu4AxE9uw_5lmQYc5P';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const txt = document.getElementById('txt');
const fehler = m => { txt.textContent = m; txt.className = 'err'; };
(async () => {
  const token = new URLSearchParams(location.hash.slice(1)).get('t');
  if(!token){ fehler('Dieser Link ist unvollständig. Bitte im Büro einen neuen verlangen.'); return; }
  try {
    const r = await fetch(`${SUPABASE_URL}/functions/v1/zugang`, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY }, body: JSON.stringify({ token }) });
    const d = await r.json().catch(() => ({}));
    if(!r.ok || !d.token_hash){ fehler(d.error || 'Anmelden hat nicht geklappt. Bitte später nochmals versuchen.'); return; }
    const { error } = await sb.auth.verifyOtp({ type: 'magiclink', token_hash: d.token_hash });
    if(error){ fehler('Anmelden hat nicht geklappt: ' + error.message); return; }
    history.replaceState(null, '', location.pathname); // Schlüssel nicht im Verlauf lassen
    location.replace('einsatzplaner-live-v1.html');
  } catch(e){ fehler('Keine Verbindung. Bitte später nochmals versuchen.'); }
})();
</script>
</body>
</html>
