<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=66"></script>
<title>Handy-Ansichten – Knechtgarten</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* Einstellungen › Handy-Ansichten: ein Handy in Originalgrösse (390 × 844), oben die Gruppe wählen, links ihre Handy-Einstellungen (Widgets).
   Was eine Gruppe darf und hat (auch Pendenzen Büro/Mitarbeiter), steht in Verwaltung › Gruppen & Rechte – die Vorschau zeigt beides zusammen.
   Gezeigt werden Aufbau und Rechte der Gruppe, aber mit den eigenen Daten (Pendenzen, Einsatz). */
:root{ --bg:#F5F7F9; --card:#FFFFFF; --primary:#323E4E; --primary-l:#4C5C70; --ink:#232B35; --muted:#8B9097; --line:#E1E5E9; }
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;}
.hidden{display:none !important;}
header.app{background:var(--primary);color:#fff;}
header.app .wrap{display:flex;align-items:center;gap:20px;padding:0 16px;}
header.app .brand{padding:11px 0;}
header.app .brand h1{font-size:15px;font-weight:600;color:#fff;}
main{padding:18px 16px 30px;}
h1.page{font-size:20px;color:var(--primary);}
.pagesub{color:var(--muted);font-size:13px;margin:4px 0 14px;max-width:760px;}
.gruppen{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.gruppen button{all:unset;cursor:pointer;font-size:13px;font-weight:600;color:#4C5C70;background:#fff;border:1px solid #D5DBE1;border-radius:8px;padding:6px 12px;}
.gruppen button.on{background:var(--primary);border-color:var(--primary);color:#fff;}
.flaeche{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;}
.links{width:300px;display:flex;flex-direction:column;gap:12px;}
.karte{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;}
.karte h3{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;}
.wz{display:flex;align-items:center;gap:8px;height:32px;border-top:1px solid #EEF1F4;font-size:13px;}
.wz:first-of-type{border-top:0;}
.wz label{flex:1;display:flex;align-items:center;gap:8px;cursor:pointer;}
.wz input{width:16px;height:16px;accent-color:var(--primary);}
.wz .aus{color:var(--muted);}
.wz .griff{color:#A9B0B7;cursor:grab;display:inline-flex;width:16px;}
.wz[draggable=true]{cursor:grab;} .wz.zieht{opacity:.4;} .wz.ueber{box-shadow:inset 0 2px 0 var(--primary);}
.klein{font-size:12px;color:var(--muted);line-height:1.45;}
.klein a{color:var(--primary);font-weight:600;}
.handy{width:414px;padding:12px;border-radius:46px;background:#1F252D;box-shadow:0 14px 34px rgba(35,43,53,.22);}
.handy iframe{display:block;width:390px;height:844px;border:0;border-radius:34px;background:var(--bg);}
.leer{color:var(--muted);padding:20px 0;}
</style>
</head>
<body>
<header class="app"><div class="wrap"><div class="brand"><h1>Handy-Ansichten</h1></div><span class="userbar hidden" id="userbar"><button id="logoutBtn">Abmelden</button></span></div></header>
<main>
  <h1 class="page">Handy-Ansichten</h1>
  <p class="pagesub">So sieht eine Gruppe die Startseite auf dem Handy (390 × 844 Pixel). Gruppe wählen, links die Widgets einstellen – das Handy zeigt es sofort. Gezeigt werden Aufbau und Rechte der Gruppe, mit deinen eigenen Pendenzen und Einsätzen.</p>
  <div class="gruppen" id="gruppen"></div>
  <div class="flaeche" id="flaeche"><div class="leer">Lädt …</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const sb = window.supabase.createClient('https://oalapdxinqlnzwxhyuzy.supabase.co', 'sb_publishable_DoeD4uEnwemmnFu4AxE9uw_5lmQYc5P');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const W = [['erfassen', 'Pendenz erfassen'], ['pend', 'Meine Pendenzen heute'], ['einsatz', 'Mein Einsatz'], ['schnell', 'Schnellzugriff']];
const STANDARD = ['erfassen', 'pend', 'einsatz', 'schnell'];
let GR = [], SEL = null, DARF = false;
const lies = () => { try { return localStorage.getItem('handy_ansicht_gruppe'); } catch(e){ return null; } };
const merke = v => { try { localStorage.setItem('handy_ansicht_gruppe', v); } catch(e){} };

async function start(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ location.href = 'einstellungen-uebersicht-live-v1.html'; return; }
  const { data: b } = await sb.from('benutzer').select('rolle').eq('id', session.user.id).maybeSingle();
  if(!b || !['admin', 'buero_team'].includes(b.rolle)){ $('flaeche').innerHTML = '<div class="leer">Diese Seite ist nur für Büro und Admin.</div>'; return; }
  DARF = b.rolle === 'admin';   // speichern darf nur der Admin (Rechte-Gruppen)
  const { data } = await sb.from('recht_gruppe').select('id,name,bereich,sortierung,handy_widgets,pendenzen_ansicht').order('sortierung');
  GR = data || []; if(!GR.length){ $('flaeche').innerHTML = '<div class="leer">Keine Gruppen.</div>'; return; }
  SEL = GR.find(g => g.id === lies()) ? lies() : GR[0].id;
  $('flaeche').innerHTML = `<div class="links"><div class="karte" id="wahl"></div><div class="karte" id="info"></div></div>
    <div class="handy"><iframe id="f" title="Handy-Ansicht"></iframe></div>`;
  zeige();
}
function zeige(){
  $('gruppen').innerHTML = GR.map(g => `<button type="button" data-g="${g.id}" class="${g.id === SEL ? 'on' : ''}">${esc(g.name)}</button>`).join('');
  $('gruppen').querySelectorAll('[data-g]').forEach(b => b.onclick = () => { SEL = b.dataset.g; merke(SEL); zeige(); });
  const g = GR.find(x => x.id === SEL);
  zeichneWahl(g);
  $('info').innerHTML = `<h3>Rechte dieser Gruppe</h3><div class="klein">Pendenzen: <b>${g.pendenzen_ansicht === 'mitarbeiter' ? 'Mitarbeiter (nur Heute und Notizen)' : 'Büro (ganzes Pendenzen-Tool)'}</b><br>
    Was die Gruppe sieht und darf, stellst du in <a href="verwaltung-live-v1.html">Verwaltung › Gruppen &amp; Rechte</a> ein.</div>`;
  $('f').src = 'heute-live-v1.html?als_gruppe=' + g.id;
}
// Widgets: gewählte in ihrer Reihenfolge oben (mit der Maus ziehen zum Sortieren), nicht gewählte grau darunter
// Ziehen & Ablegen: Zeilen mit data-zk umsortieren, Ergebnis = neue Reihenfolge der Schlüssel
function KG_ZIEHEN(box, an, fertig){
  let von = null;
  box.querySelectorAll('[data-zk]').forEach(z => {
    z.addEventListener('dragstart', e => { von = z.dataset.zk; z.classList.add('zieht'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', von); } catch(x){} });
    z.addEventListener('dragend', () => { z.classList.remove('zieht'); box.querySelectorAll('.ueber').forEach(x => x.classList.remove('ueber')); });
    z.addEventListener('dragover', e => { if(!von) return; e.preventDefault(); box.querySelectorAll('.ueber').forEach(x => x.classList.remove('ueber')); z.classList.add('ueber'); });
    z.addEventListener('drop', e => { e.preventDefault(); const nach = z.dataset.zk; if(!von || von === nach) return;
      const neu = an.filter(k => k !== von); neu.splice(neu.indexOf(nach), 0, von); von = null; fertig(neu); });
  });
}
function zeichneWahl(g){
  const an = g.handy_widgets && g.handy_widgets.length ? g.handy_widgets.slice() : STANDARD.slice();
  const liste = [...an, ...W.map(w => w[0]).filter(k => !an.includes(k))];
  $('wahl').innerHTML = '<h3>Widgets auf der Startseite</h3>' + liste.map((k, i) => { const on = an.includes(k), n = (W.find(w => w[0] === k) || [k, k])[1];
    return `<div class="wz"${on && DARF ? ` draggable="true" data-zk="${k}"` : ''}>${on && DARF ? `<span class="griff">${KG.icon('griff', 14)}</span>` : ''}<label class="${on ? '' : 'aus'}"><input type="checkbox" data-k="${k}"${on ? ' checked' : ''}${DARF ? '' : ' disabled'}>${esc(n)}</label></div>`; }).join('')
    + (DARF ? '' : '<div class="klein">Ändern kann nur der Admin.</div>');
  $('wahl').querySelectorAll('[data-k]').forEach(c => c.onchange = () => speichern(g, c.checked ? [...an, c.dataset.k] : an.filter(x => x !== c.dataset.k)));
  KG_ZIEHEN($('wahl'), an, neu => speichern(g, neu));
}
async function speichern(g, neu){
  const { error } = await sb.from('recht_gruppe').update({ handy_widgets: neu }).eq('id', g.id);
  if(error){ alert('Konnte nicht gespeichert werden: ' + error.message); return zeichneWahl(g); }
  g.handy_widgets = neu; zeichneWahl(g); $('f').contentWindow.location.reload();
}
start();
</script>
</body>
</html>
