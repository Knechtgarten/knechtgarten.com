<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Einsatzplaner – Knechtgarten</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg:#F5F7F9; --card:#FFFFFF; --primary:#323E4E; --primary-l:#4C5C70;
  --ink:#232B35; --muted:#8B9097; --line:#E1E5E9; --soft:#EEF3F7;
  --accent-blue:#D6E7F4; --accent-lime:#D1DB5F; --danger:#B4655F; --red:#C0392B;
  --namew:190px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);line-height:1.45;font-size:13px;}
.wrap{max-width:1400px;margin:0 auto;padding:0 16px;}
.hidden{display:none !important;}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;}

header.app{background:var(--primary);color:#fff;}
header.app .wrap{display:flex;align-items:center;gap:20px;max-width:none;}
header.app .backlink{display:inline-flex;align-items:center;gap:5px;color:var(--primary);text-decoration:none;font-size:12px;font-weight:700;flex-shrink:0;background:var(--accent-lime);border-radius:20px;padding:6px 12px;}
header.app .brand{padding:11px 0;}
header.app .brand h1{font-size:15px;font-weight:600;color:#fff;}
header.app .brand .sub{font-size:11px;opacity:.75;margin-top:1px;}
header.app .userbar{display:flex;align-items:center;gap:10px;margin-left:auto;}
header.app .userbar span{opacity:.85;font-size:11.5px;}
header.app .userbar button{font-size:11.5px;color:#c7ccd1;background:none;border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:3px 9px;cursor:pointer;}
nav.subnav{background:#fff;border-bottom:1px solid var(--line);}
nav.subnav .wrap{display:flex;gap:2px;max-width:none;overflow-x:auto;}
nav.subnav a{display:flex;align-items:center;gap:7px;padding:12px 12px 10px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;text-decoration:none;font-size:12.5px;white-space:nowrap;cursor:pointer;}
nav.subnav a:hover{color:var(--primary);}
nav.subnav a.on{color:var(--primary);border-bottom-color:var(--primary);}
nav.subnav a .i{width:16px;height:16px;}

input[type=text],input[type=date],input[type=search],select,textarea{font:inherit;font-size:12.5px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 8px;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);}
.btn{border:none;border-radius:7px;padding:7px 14px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-l);}
.btn-ghost{background:#fff;color:var(--primary);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--primary);}
.btn-danger{background:#fff;color:var(--danger);border:1px solid #E6CFCC;}
.btn .i{width:15px;height:15px;}
.icon-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;flex:none;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--primary);box-sizing:border-box;}
.icon-btn .i{width:14px;height:14px;}
.icon-btn:hover{border-color:var(--primary);}
.seg{display:inline-flex;}
.seg button{all:unset;cursor:pointer;padding:5px 11px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--primary);}
.seg button + button{border-left:0;}
.seg button:first-child{border-radius:6px 0 0 6px;}
.seg button:last-child{border-radius:0 6px 6px 0;}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff;border-color:var(--primary);}
.muted{color:var(--muted);} .small{font-size:11.5px;}
.hint{font-size:11.5px;color:var(--muted);}
.card{background:#fff;border:1px solid var(--line);border-radius:11px;}

/* Login */
.loginwrap{min-height:80vh;display:flex;align-items:center;justify-content:center;}
.logincard,.pendingcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:28px 26px;width:100%;max-width:330px;}
.logincard h2,.pendingcard h2{font-size:16px;color:var(--primary);margin-bottom:14px;}
.logincard .fld{margin-bottom:10px;}
.logincard label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;}
.logincard input{width:100%;}
.status{font-size:11.5px;color:var(--muted);margin-top:6px;} .status.err{color:var(--danger);}

/* Werkzeugleiste */
.bar-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px 8px;}
.range{font-weight:700;color:var(--primary);font-size:13.5px;margin:0 4px;white-space:nowrap;}
.bar-top .sp{flex:1;}
.chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center;}
.chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:11.5px;}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block;}
.chip[aria-pressed="true"]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);}
.legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:0 16px 8px;font-size:11px;color:var(--muted);}
.legend .lg{display:inline-flex;gap:5px;align-items:center;}
.legend .sw{width:16px;height:9px;border-radius:2px;border:1px solid rgba(50,62,78,.25);display:inline-block;}

/* Planer-Raster */
.tl{position:relative;overflow:auto;background:#fff;border-top:1px solid var(--line);height:calc(100vh - 200px);min-height:300px;}
.grid{position:relative;}
.hdr{position:sticky;top:0;z-index:6;display:flex;background:#fff;border-bottom:1px solid var(--line);}
.hdr .corner{position:sticky;left:0;z-index:7;width:var(--namew);flex:none;background:#fff;border-right:1px solid var(--line);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;display:flex;align-items:flex-end;padding:0 10px 5px;}
.hlane{position:relative;flex:none;}
.hc{position:absolute;overflow:hidden;white-space:nowrap;text-overflow:clip;font-size:10.5px;color:var(--muted);border-left:1px solid var(--line);padding:0 4px;}
.hc.t1{top:0;height:20px;line-height:20px;font-weight:700;color:var(--primary);}
.hc.t2{top:20px;height:20px;line-height:20px;text-align:center;}
.hc.t3{top:40px;height:15px;line-height:15px;text-align:center;font-size:9.5px;}
.hc.we{background:#F3F5F7;} .hc.fe{background:#F6F2E6;} .hc.td{background:#F2F5D6;color:var(--primary);font-weight:700;}
.row{display:flex;border-bottom:1px solid #EEF1F3;}
.row .nm{position:sticky;left:0;z-index:4;width:var(--namew);flex:none;background:#fff;border-right:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 8px 0 10px;font-size:12px;white-space:nowrap;overflow:hidden;}
.row .nm .n{overflow:hidden;text-overflow:ellipsis;font-weight:600;}
.row .nm .z{font-size:10.5px;color:var(--muted);flex:none;}
.row .nm .dot{width:9px;height:9px;border-radius:2px;flex:none;border:1px solid rgba(50,62,78,.25);}
.row .nm .me{font-size:9.5px;background:var(--accent-lime);color:var(--primary);border-radius:3px;padding:0 4px;font-weight:700;}
.row.grp .nm{background:var(--primary);color:#fff;font-weight:700;cursor:pointer;font-size:11.5px;}
.row.grp .nm .i{width:13px;height:13px;transition:transform .15s;}
.row.grp.zu .nm .i{transform:rotate(-90deg);}
.row.grp .lane{background:#F7F9FA;}
.lane{position:relative;flex:none;height:24px;}
.lane.ed{cursor:crosshair;}
.tdl{position:absolute;top:0;bottom:0;width:2px;background:var(--accent-lime);pointer-events:none;z-index:1;}
.fel{position:absolute;top:0;bottom:0;background:rgba(214,190,120,.16);pointer-events:none;}
.bar{position:absolute;top:3px;height:17px;border-radius:3px;border:1px solid;font-size:10.5px;font-weight:600;cursor:pointer;user-select:none;touch-action:none;overflow:hidden;z-index:1;}
.bar.ed{cursor:grab;}
.bar .t,.brg .t{position:absolute;top:0;bottom:0;line-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;font-size:10.5px;pointer-events:none;}
.bar .hl,.bar .hr{position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize;z-index:2;}
.bar .hl{left:0;} .bar .hr{right:0;}
.bar:not(.ed) .hl,.bar:not(.ed) .hr{display:none;}
.bar:hover{filter:brightness(.95);}
.bar.sel{outline:2px solid var(--primary);outline-offset:1px;z-index:3;}
.bar.dim,.brg.dim{opacity:.22;}
.bar.provi{border-style:dashed;}
.bar.mini{top:13px;height:9px;z-index:2;box-shadow:0 0 0 1.5px #fff;border-radius:2px;}
.bar.mini .t{line-height:7px;font-size:8px;}
.bar.tgrp{background:#fff;color:var(--primary);border:1px dashed #8B9097;}
.bar.tgrp .t{font-weight:600;}
.bar.occ{border-style:dotted;}
.brg{position:absolute;top:10px;height:3px;opacity:.55;pointer-events:none;overflow:visible;}
.brg .t{top:-7px;height:17px;line-height:15px;}
.rdot{position:absolute;top:0;width:7px;height:7px;border-radius:50%;background:var(--red);border:1px solid #fff;z-index:3;pointer-events:none;}
.bdot{position:absolute;top:0;width:7px;height:7px;border-radius:50%;background:#2F6F9F;border:1px solid #fff;z-index:3;pointer-events:none;}
.planwrap{display:flex;}
.planwrap .tl{flex:1;min-width:0;}
.aufp{width:270px;flex:none;border-left:1px solid var(--line);border-top:1px solid var(--line);background:#fff;overflow:auto;height:calc(100vh - 200px);min-height:300px;font-size:12px;}
.aufp.zu{width:34px;overflow:hidden;}
.aufp.drop{background:#F2F5D6;}
.auftab{all:unset;cursor:pointer;writing-mode:vertical-rl;padding:12px 8px;font-weight:700;color:var(--primary);font-size:12px;}
.ahead{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line);}
.ahint{font-size:10.5px;color:var(--muted);padding:6px 10px;}
.ash{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--soft);font-weight:700;color:var(--primary);cursor:pointer;font-size:11.5px;border-top:1px solid #fff;}
.ash .i{width:13px;height:13px;transition:transform .15s;}
.ash .n{color:var(--muted);font-weight:400;margin-left:auto;}
.ash .icon-btn{width:20px;height:20px;}
.asec.zu .ash > .i{transform:rotate(-90deg);}
.arow{display:flex;align-items:center;gap:6px;padding:4px 10px;border-bottom:1px solid var(--soft);cursor:grab;white-space:nowrap;overflow:hidden;user-select:none;touch-action:none;}
.arow i{width:8px;height:8px;border-radius:2px;flex:none;}
.arow span{overflow:hidden;text-overflow:ellipsis;}
.arow:hover{background:#F7F9FA;}
.aleer{padding:4px 10px;color:var(--muted);}
.bar.prov{background:repeating-linear-gradient(135deg,#E9EDB8 0 4px,#FFFFFF 4px 8px);border:1px dashed #9CA43A;color:#323E4E;cursor:grab;}
.bar.prov.over{border:1.5px solid var(--red);}
.row.grp .lane .bar{top:2px;height:15px;}
.aghost{position:fixed;z-index:95;background:var(--primary);color:#fff;font-size:11.5px;padding:4px 8px;border-radius:5px;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.2);}
.lane.drop{background:#F2F5D6 !important;}
.pzb{all:unset;cursor:pointer;margin-left:auto;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;color:#C3C8CE;flex:none;}
.pzb .i{width:13px;height:13px;}
.pzb.has{color:var(--primary);background:var(--soft);}
.pzb.od{color:#fff;background:var(--danger);}
.row.grp .pzb{color:rgba(255,255,255,.45);}
.row.grp .pzb.has{color:var(--primary);background:#fff;}
.dlg .in.board{max-width:980px;}
.bcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;}
.bcol{background:var(--soft);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;}
.bcol h4{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
.pzi{background:#fff;border-radius:6px;padding:6px 8px;display:flex;gap:6px;align-items:flex-start;font-size:12.5px;}
.pzi input{accent-color:var(--primary);margin-top:2px;}
.pzi .tx{flex:1;min-width:0;word-break:break-word;}
.pzi .dt{font-size:10.5px;color:var(--muted);display:block;}
.pzi .dt.od{color:var(--danger);font-weight:700;}
.pzi .lk{all:unset;cursor:pointer;font-size:10.5px;color:var(--primary);white-space:nowrap;}
.padd{display:flex;gap:4px;align-items:center;}
.padd input{flex:1;min-width:0;}
.m-pz{margin:6px 12px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 12px;display:flex;flex-direction:column;gap:6px;font-size:14px;}
.m-pz label{display:flex;gap:8px;align-items:flex-start;}
.m-pz .od{color:var(--danger);font-size:11px;}
@media (max-width:900px){ .aufp:not(.zu){width:220px;} }
.band{position:absolute;border-radius:3px;font-size:10px;font-weight:600;overflow:hidden;white-space:nowrap;display:flex;align-items:center;padding:0 5px;cursor:pointer;background:var(--c);border:1px solid rgba(35,43,53,.2);user-select:none;touch-action:none;z-index:1;}
.band span{overflow:hidden;text-overflow:ellipsis;pointer-events:none;}
.band .hl,.band .hr{position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize;pointer-events:auto;}
.band .hl{left:0;} .band .hr{right:0;}
.band.ed{cursor:grab;}
.band.cf{background:var(--red) !important;color:#fff !important;}
.band.ev{background:repeating-linear-gradient(135deg,var(--c) 0 4px,#fff 4px 8px);opacity:.6;color:var(--ink) !important;}
.row.ov .nm{gap:5px;font-size:11.5px;}
.vl{position:absolute;bottom:1px;height:3px;border-radius:2px;pointer-events:auto;z-index:2;}
.vl.red{background:var(--red);} .vl.blue{background:#2F6F9F;}
.mchips{display:flex;flex-wrap:wrap;gap:5px;}
.mchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 4px 3px 8px;border-radius:5px;background:var(--soft);}
.mchip.cf{background:#F7E6E3;color:#7A3A33;}
.mchip .icon-btn{width:20px;height:20px;}
.ghost{position:absolute;top:3px;height:17px;border-radius:3px;background:rgba(50,62,78,.18);border:1px dashed var(--primary);pointer-events:none;z-index:2;}
.leer{padding:40px 20px;text-align:center;color:var(--muted);}

/* Seitenfenster (Details) */
.sidepanel{position:fixed;top:0;right:0;bottom:0;z-index:45;width:380px;max-width:100vw;background:#fff;border-left:1px solid var(--line);box-shadow:-6px 0 24px rgba(30,37,48,.10);overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:16px 20px 24px;}
.sd-head{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.sd-head h3{font-size:16px;color:var(--primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fld{display:flex;flex-direction:column;gap:4px;}
.fld > label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
.fld input[type=text],.fld select,.fld textarea{width:100%;}
.fld textarea{min-height:90px;resize:vertical;line-height:1.45;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.dt{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:6px;}
label.chk{display:flex;gap:8px;align-items:center;font-size:12.5px;cursor:pointer;}
label.chk input{accent-color:var(--primary);width:15px;height:15px;}
.quick{display:flex;gap:4px;flex-wrap:wrap;}
.quick button{all:unset;cursor:pointer;font-size:11.5px;padding:3px 8px;border:1px solid var(--line);border-radius:5px;color:var(--primary);}
.quick button:hover{border-color:var(--primary);}
.info{font-size:12px;background:var(--soft);border-radius:6px;padding:8px 10px;}
.info.warn{background:#F7E6E3;color:#7A3A33;}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px;}
.file{position:relative;aspect-ratio:4/3;border-radius:5px;background:var(--soft);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:10.5px;text-align:center;padding:4px;cursor:pointer;color:var(--primary);}
.file img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.file .x{position:absolute;top:2px;right:2px;width:20px;height:20px;}
.sd-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center;}
.pop{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(30,37,48,.16);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:220px;max-width:300px;font-size:12.5px;}
.lbox{position:fixed;inset:0;z-index:80;background:rgba(20,25,32,.9);display:flex;align-items:center;justify-content:center;padding:40px;}
.lbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;}
.lbox .x{position:absolute;top:14px;right:14px;}
.toastwrap{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;}
.toast{background:var(--primary);color:#fff;font-size:12.5px;padding:9px 14px;border-radius:7px;box-shadow:0 6px 20px rgba(0,0,0,.2);display:flex;gap:12px;align-items:center;}
.toast.err{background:var(--danger);}
.toast button{all:unset;cursor:pointer;color:var(--accent-lime);font-weight:700;}

/* Einstellungen */
.page{padding:18px 16px 40px;max-width:1000px;}
.page h2{font-size:17px;color:var(--primary);margin-bottom:4px;}
.gcard{margin-top:14px;}
.ghead{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);}
.ghead b{font-size:13.5px;color:var(--primary);}
.prow{display:grid;grid-template-columns:16px minmax(0,1.6fr) minmax(0,1fr) minmax(0,1.4fr) auto;gap:10px;align-items:center;padding:7px 14px;border-bottom:1px solid var(--soft);font-size:12.5px;}
.prow:last-child{border-bottom:0;}
.prow.off{opacity:.5;}
.tag{font-size:10.5px;background:var(--soft);border-radius:4px;padding:1px 6px;margin-right:4px;color:var(--primary);}
.acts{display:flex;gap:4px;}
.dlg{position:fixed;inset:0;z-index:70;background:rgba(20,26,34,.35);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;}
.dlg .in{background:#fff;border-radius:11px;width:100%;max-width:520px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;}
.pal{display:flex;gap:5px;flex-wrap:wrap;}
.pal button{all:unset;cursor:pointer;width:24px;height:24px;border-radius:5px;border:2px solid transparent;}
.pal button[aria-pressed="true"]{border-color:var(--ink);}
.ser{display:flex;gap:8px;align-items:center;font-size:12px;padding:5px 0;border-bottom:1px solid var(--soft);}
table.ft{border-collapse:collapse;width:100%;font-size:12.5px;}
table.ft td{padding:7px 10px;border-bottom:1px solid var(--soft);}

/* Handy */
.m{max-width:560px;margin:0 auto;padding:0 0 90px;}
.m-top{position:sticky;top:0;z-index:5;background:var(--primary);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px;}
.m-top .nav{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;}
.m-top .ti{flex:1;text-align:center;}
.m-top .ti b{display:block;font-size:15px;}
.m-top .ti span{font-size:11.5px;opacity:.8;}
.m-sw{display:flex;gap:8px;padding:10px 12px;}
.m-sw .seg{flex:1;} .m-sw .seg button{flex:1;text-align:center;padding:7px 0;}
.m-day{padding:12px 12px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;}
.m-day.td{color:var(--primary);}
.mc{margin:6px 12px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;cursor:pointer;}
.mc .h{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--muted);}
.mc .h .who{margin-left:auto;}
.mc b{font-size:15px;color:var(--ink);}
.mc .o{font-size:12px;color:var(--muted);}
.mc .nt{font-size:12.5px;white-space:pre-wrap;display:none;border-top:1px solid var(--soft);padding-top:6px;margin-top:2px;}
.mc.open .nt{display:block;}
.mc .fl{display:none;gap:6px;flex-wrap:wrap;}
.mc.open .fl{display:flex;}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');

// ---------------------------------------------------------------------------
// Meldungen (mit «Rückgängig»)

function toast(msg, undo, isErr){

}

// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
let ROLLE = null, ME = null;
const isBuero = () => ROLLE === 'admin' || ROLLE === 'buero_team';
function zeigeNur(id){ ['loginwrap','pendingWrap','appMain'].forEach(x => $(x).classList.toggle('hidden', x !== id)); }

}
$('loginBtn').addEventListener('click', async () => {
  const st = $('loginStatus'); st.textContent = 'Melde an …'; st.className = 'status';
  const { error } = await sb.auth.signInWithPassword({ email: $('loginEmail').value.trim(), password: $('loginPassword').value });
  if(error){ st.textContent = 'Login fehlgeschlagen: ' + error.message; st.className = 'status err'; return; }

$('loginPassword').addEventListener('keydown', e => { if(e.key === 'Enter') $('loginBtn').click(); });

// ---------------------------------------------------------------------------
// Zeitachse: 1 Einheit = 1 Tag, jeder Tag zeigt 06:00–18:00.
// Halbtage: Vormittag 06–12, Nachmittag 12–18. Tag-Index ab D0 (Montag).
// ---------------------------------------------------------------------------
const heute = new Date(); heute.setHours(0,0,0,0);
const D0 = new Date(heute); D0.setDate(D0.getDate() - ((D0.getDay() + 6) % 7) - 7 * 8);
const NDAYS = 7 * 70;
const dDate = i => new Date(D0.getFullYear(), D0.getMonth(), D0.getDate() + i);
const dayIdx = dt => Math.round((Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()) - Date.UTC(D0.getFullYear(), D0.getMonth(), D0.getDate())) / 864e5);
const TODAY = dayIdx(heute);
const toU = ts => { const t = new Date(ts); const h = t.getHours() + t.getMinutes() / 60; return dayIdx(t) + Math.max(0, Math.min(1, (h - 6) / 12)); };
function fromU(u, isEnd){ let d = Math.floor(u + 1e-9), f = u - d; if(isEnd && f < 1e-9){ d -= 1; f = 1; } const x = dDate(d); x.setHours(0, Math.round((6 + f * 12) * 60), 0, 0); return x.toISOString(); }
const isoDate = d => { const x = dDate(d); return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`; };
const fromIso = s => { const [y,m,d] = s.split('-').map(Number); return dayIdx(new Date(y, m-1, d)); };
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'], WDL = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MON = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'], MONL = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function kw(d){ const x = dDate(d); const t = new Date(Date.UTC(x.getFullYear(), x.getMonth(), x.getDate())); const w = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - w); const j = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - j) / 864e5 + 1) / 7); }
const tStr = h => { const m = Math.round(h * 60); return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
const hOf = (u, d) => tStr(6 + (u - d) * 12);
const dLab = d => { const x = dDate(d); return `${WD[x.getDay()]} ${x.getDate()}.${x.getMonth()+1}.`; };
const fmtN = n => String(Math.round(n * 10) / 10).replace('.', ',');
const r48 = u => Math.round(u * 48) / 48;

// ---------------------------------------------------------------------------
// Daten
// ---------------------------------------------------------------------------
let RES = [], RESE = [], GRUPPEN = [], PERSONEN = [], P = {}, EINS = [], SERIEN = [], FEIER = new Map(), KUNDEN = {}, KLIST = [], BENUTZER = [];
async function fetchAll(mk){ let out = [], i = 0; for(;;){ const { data, error } = await mk().range(i, i + 999); if(error) throw error; out = out.concat(data); if(data.length < 1000) break; i += 1000; } return out; }
async function ladeAlles(){
  try{
    const von = fromU(0), bis = fromU(NDAYS);
    const [g, p, e, s, f, k, r, z, au, pz] = await Promise.all([
      fetchAll(() => sb.from('planer_gruppe').select('*').order('sortierung')),
      fetchAll(() => sb.from('planer_person').select('*').order('sortierung')),
      fetchAll(() => sb.from('planer_einsatz').select('*, planer_datei(id,art,name,storage_pfad)').lt('beginn', bis).gt('ende', von)),
      fetchAll(() => sb.from('planer_serie').select('*')),
      fetchAll(() => sb.from('planer_feiertag').select('*')),
      Object.keys(KUNDEN).length ? Promise.resolve(null) : fetchAll(() => sb.from('kunde').select('id,name,firma,vorname,nachname,strasse,plz,ort').order('name')),
      fetchAll(() => sb.from('planer_ressource').select('*').order('sortierung')),
      fetchAll(() => sb.from('planer_ressource_einsatz').select('*')),
      fetchAll(() => sb.from('planer_auftrag').select('*').order('erstellt_am')),
      fetchAll(() => sb.from('planer_pendenz').select('*').eq('erledigt', false))
    ]);
    AUF = au; PZ = pz;
    RES = r; RESE = z.map(x => ({ id: x.id, rid: x.ressource_id, art: x.art, eid: x.einsatz_id, mid: x.person_id, s: x.beginn ? toU(x.beginn) : null, e: x.ende ? toU(x.ende) : null }));
    GRUPPEN = g; PERSONEN = p; P = {}; p.forEach(x => P[x.id] = x);
    EINS = e.map(rowToItem); SERIEN = s;
    FEIER = new Map(); f.forEach(x => FEIER.set(fromIso(x.datum), x.name));
    if(k){ KUNDEN = {}; k.forEach(x => KUNDEN[x.id] = x); KLIST = k.map(x => ({ id: x.id, lab: kLabel(x) })); }
    if(isBuero() && !BENUTZER.length){ const { data } = await sb.rpc('pflege_zustaendige'); BENUTZER = data || []; }
    if(!PF || Date.now() - (PF.t || 0) > 300000){ await ladePflege(); if(PF) PF.t = Date.now(); }
  }catch(err){ fehler(err, 'Laden'); }
}
function rowToItem(r){ return { id: r.id, mid: r.person_id, kind: r.art, s: toU(r.beginn), e: toU(r.ende), kid: r.kunde_id, title: r.titel || '', text: r.notiz || '', pl: r.projektleiter_id, link: r.mit_einsatz_id, allein: r.allein, ok: r.abgemacht, soll: r.soll_tage, files: r.planer_datei || [], pkk: r.pflege_kunde_kategorie_id, pj: r.pflege_jahr, pkw: r.pflege_kw }; }
function itemToRow(it){ return { person_id: it.mid, art: it.kind, beginn: fromU(it.s), ende: fromU(it.e, true), kunde_id: it.kid || null, titel: it.title || null, notiz: it.text || null, projektleiter_id: it.pl || null, mit_einsatz_id: it.link || null, allein: !!it.allein, abgemacht: it.ok !== false, soll_tage: it.soll ?? null, pflege_kunde_kategorie_id: it.pkk || null, pflege_jahr: it.pj || null, pflege_kw: it.pkw || null }; }
const kName = k => k ? (k.firma || [k.nachname, k.vorname].filter(Boolean).join(' ') || k.name) : '';
const kShort = k => k ? (k.firma || k.nachname || k.name || '') : '';
const kOrt = k => k ? [k.strasse, [k.plz, k.ort].filter(Boolean).join(' ')].filter(Boolean).join(', ') : '';
const kLabel = k => `${kName(k)}${k.ort ? ' · ' + k.ort : ''}`;
const byId = id => EINS.find(x => x.id === id);
const first = n => String(n || '').split(' ')[0];
const canEdit = mid => isBuero() || (P[mid] && P[mid].benutzer_id === ME);
const myPerson = () => PERSONEN.find(p => p.benutzer_id === ME && p.aktiv);
const ART = { baustelle: 'Baustelle', termin: 'Termin', absenz: 'Absenz', intern: 'Werkhof / intern', hilfe: 'Mithilfe' };
const PALETTE = ['#3E6B4F','#5B8C6A','#7FA88A','#2F6F6B','#4F8F8A','#86B3AE','#56707F','#6E8F4E','#9DB27C','#2F4F5F','#7D8B5A','#4A6C8C'];

function titleOf(it){
  if(it.kind === 'hilfe'){ const l = byId(it.link); return l ? `Mit ${first(P[l.mid]?.name)} · ${kShort(KUNDEN[l.kid]) || l.title}` : (it.title || 'Mithilfe'); }
  return kName(KUNDEN[it.kid]) || it.title || ART[it.kind] || 'Ohne Titel';
}
function labOf(it){
  if(it.kind === 'hilfe'){ const l = byId(it.link); return l ? `Mit ${first(P[l.mid]?.name)} · ${kShort(KUNDEN[l.kid]) || l.title}` : (it.title || 'Mithilfe'); }
  return kShort(KUNDEN[it.kid]) || it.title || ART[it.kind];
}
const txtOn = c => { const m = /^#?([0-9a-f]{6})$/i.exec(c || ''); if(!m) return '#FFFFFF'; const n = parseInt(m[1], 16); const l = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; return l > .62 ? '#232B35' : '#FFFFFF'; };
function barStyle(it){
  if(it.kind === 'termin') return { bg: '#D6E7F4', fg: '#232B35', bd: '#A9C7E0' };
  if(it.kind === 'absenz') return { bg: '#C9CED4', fg: '#323E4E', bd: '#B3B9C0' };
  if(it.kind === 'intern') return { bg: '#E9ECEF', fg: '#323E4E', bd: '#C9CED4' };
  let c;
  if(it.kind === 'hilfe'){ const l = byId(it.link); c = l ? (P[l.pl]?.farbe || P[l.mid]?.farbe) : null; c = c || '#86B3AE'; }
  else c = P[it.pl]?.farbe || P[it.mid]?.farbe || '#5B8C6A';
  return { bg: c, fg: txtOn(c), bd: 'rgba(35,43,53,.25)' };
}

// ---------------------------------------------------------------------------
// Berechnung: Serien-Termine, Unterbrüche, «Personal fehlt»
// ---------------------------------------------------------------------------
const isOff = d => { const w = dDate(d).getDay(); return w === 0 || w === 6 || FEIER.has(d); };
const isShort = o => o.e - o.s < .5 - 1e-6;
function covered(list, a, b){ const iv = list.map(o => [Math.max(a, o.s), Math.min(b, o.e)]).filter(x => x[1] > x[0]).sort((x, y) => x[0] - y[0]); let t = 0, ce = a; iv.forEach(([s, e]) => { s = Math.max(s, ce); if(e > s){ t += e - s; ce = e; } }); return t; }
function occs(){
  const out = [];
  SERIEN.forEach(sr => {
    const von = Math.max(0, fromIso(sr.von)), bis = Math.min(NDAYS - 1, sr.bis ? fromIso(sr.bis) : NDAYS - 1);
    const ex = new Set((sr.ausnahmen || []).map(fromIso));
    for(let d = von; d <= bis; d++){
      const wd = dDate(d).getDay() || 7;
      if(wd !== sr.wochentag || ex.has(d) || FEIER.has(d)) continue;
      if(sr.alle_zwei_wochen && Math.floor((d - von) / 7) % 2) continue;
      const [a, b] = sr.teil === 'vm' ? [0, .5] : sr.teil === 'nm' ? [.5, 1] : [0, 1];
      out.push({ id: 'S' + sr.id + '_' + d, ser: sr.id, d, mid: sr.person_id, kind: sr.art, s: d + a, e: d + b, title: sr.titel, files: [] });
    }
  });
  return out;
}
let ALL = [], LAY = {};
function compute(){
  ALL = EINS.concat(occs()); LAY = {};
  const rows = {}; ALL.forEach(it => (rows[it.mid] ??= []).push(it));
  Object.values(rows).forEach(list => {
    list.forEach((it, i) => it._o = i);
    list.sort((a, b) => (b.e - b.s) - (a.e - a.s) || a._o - b._o);
    list.forEach((it, i) => {
      const over = list.slice(i + 1).filter(o => o.s < it.e - 1e-6 && o.e > it.s + 1e-6);
      const multi = it.e - it.s > 1 + 1e-6, free = [];
      const k0 = Math.floor(it.s * 2 + 1e-9), k1 = Math.ceil(it.e * 2 - 1e-9) - 1;
      for(let k = k0; k <= k1; k++){
        const d = k >> 1; if(multi && isOff(d)) continue;
        const a = Math.max(it.s, k / 2), b = Math.min(it.e, (k + 1) / 2); if(b - a < 1e-6) continue;
        // Kurze Termine (unter einem Halbtag) unterbrechen nicht – ausser sie füllen zusammen mind. 4 Std. des Halbtags
        const ov = over.filter(o => o.s < b - 1e-6 && o.e > a + 1e-6);
        if(ov.length && (ov.some(o => !isShort(o)) || covered(ov, a, b) >= Math.min(b - a, 1 / 3) - 1e-6)) continue;
        free.push(k);
      }
      const segs = []; free.forEach(k => { const a = Math.max(it.s, k / 2), b = Math.min(it.e, (k + 1) / 2); const L = segs[segs.length - 1]; if(L && Math.abs(L[1] - a) < 1e-6) L[1] = b; else segs.push([a, b]); });
      LAY[it.id] = { segs, free, n: free.length / 2, miss: [] };
    });
    // Kurzer Termin auf einer laufenden Baustelle = Markierung auf dem Balken

let PF = null, PROV = [], PROVLAY = {}, showProv = lsGet('prov', true);
async function ladePflege(){
  try{
    const y = new Date().getFullYear();

      fetchAll(() => sb.from('pflege_kategorie').select('id,name,kuerzel,farbe')),
      fetchAll(() => sb.from('pflege_arbeit').select('id,kategorie_id,name,standard_kws,dauer_min')),
      fetchAll(() => sb.from('pflege_kunde').select('kunde_id,abo_typ,wunsch_wochentage')),
      fetchAll(() => sb.from('pflege_kunde_kategorie').select('id,kunde_id,kategorie_id')),
      fetchAll(() => sb.from('pflege_kunde_arbeit').select('id,kunde_kategorie_id,arbeit_id,titel,kws,kws_plus,kws_minus,abgewaehlte_jahre,dauer_min')),
      fetchAll(() => sb.from('pflege_kunde_kategorie_zustaendig').select('*')),

    ]);
    const m = l => { const o = {}; l.forEach(x => o[x.id] = x); return o; };
    PF = { kat: m(kat), arb: m(arb), ku: Object.fromEntries(ku.map(x => [x.kunde_id, x])), kk, ka, zu, st: new Set(st.map(s => `${s.kunde_kategorie_id}_${s.jahr}_${s.kw}`)) };
  }catch(e){ console.warn('Pflege-Daten nicht geladen', e); PF = null; }
}
function kwMonday(y, w){ const j4 = new Date(y, 0, 4); const mon = new Date(y, 0, 4 - ((j4.getDay() + 6) % 7) + (w - 1) * 7); return dayIdx(mon); }
const teamLaneId = () => (GRUPPEN.find(g => /pflege|service/i.test(g.name)) || GRUPPEN[0])?.id;
function computeProv(){
  PROV = []; PROVLAY = {}; if(!PF || !showProv) return;
  let base = TODAY; while(dDate(base).getDay() === 0 || dDate(base).getDay() === 6) base++; const y0 = dDate(base + 3 - ((dDate(base).getDay() + 6) % 7)).getFullYear(), k0 = kw(base);
  const linked = new Set(EINS.filter(e => e.pkk).map(e => `${e.pkk}_${e.pj}_${e.pkw}`));
  const weeks = []; for(let i = 0; i < 12; i++){ const mon = kwMonday(y0, k0) + i * 7; if(mon >= NDAYS) break; const x = dDate(mon + 3); weeks.push({ y: x.getFullYear(), w: kw(mon), mon }); }
  const byKk = {}; PF.ka.forEach(a => (byKk[a.kunde_kategorie_id] ??= []).push(a));
  PF.kk.forEach(kk => {
    const ku = PF.ku[kk.kunde_id]; if(!ku || ku.abo_typ === 'kein_abo') return; const kat = PF.kat[kk.kategorie_id]; const k = KUNDEN[kk.kunde_id]; if(!kat || !k) return;
    const zu = PF.zu.filter(z => z.kunde_kategorie_id === kk.id).map(z => PERSONEN.find(p => p.benutzer_id === z.benutzer_id && p.aktiv)).filter(Boolean);
    const lane = zu.length ? 'p:' + zu[0].id : (teamLaneId() ? 'g:' + teamLaneId() : null); if(!lane) return;
    weeks.forEach(({ y, w, mon }) => {
      if(PF.st.has(`${kk.id}_${y}_${w}`) || linked.has(`${kk.id}_${y}_${w}`)) return;
      const arb = []; let min = 0;
      (byKk[kk.id] || []).forEach(a => { if((a.abgewaehlte_jahre || []).includes(y)) return; const std = a.arbeit_id ? PF.arb[a.arbeit_id] : null;
        const kws = std ? new Set([...(std.standard_kws || []).filter(x => !(a.kws_minus || []).includes(x)), ...(a.kws_plus || [])]) : new Set(a.kws || []);
        if(!kws.has(w)) return; arb.push(std ? std.name : a.titel); min += a.dauer_min || std?.dauer_min || 60; });
      if(!arb.length) return;
      PROV.push({ id: `${kk.id}_${y}_${w}`, kk: kk.id, y, w, mon, kid: kk.kunde_id, kat, arb, min, lane, wd: ku.wunsch_wochentage || [] });
    });
  });
  // Perlenkette pro Zeile
  const lanes = {}; PROV.forEach(p => (lanes[p.lane] ??= []).push(p));
  Object.entries(lanes).forEach(([key, list]) => {
    list.sort((a, b) => a.mon - b.mon || (KUNDEN[a.kid]?.ort || '').localeCompare(KUNDEN[b.kid]?.ort || '') || kShort(KUNDEN[a.kid]).localeCompare(kShort(KUNDEN[b.kid])));
    const bl = key.startsWith('p:') ? ALL.filter(i => i.mid === key.slice(2)).map(i => [i.s, i.e]) : [];
    let cur = -1; const out = [];
    list.forEach(p => {
      const len = p.min / 60 / 12; const start = Math.max(p.mon, TODAY) + 1 / 12; if(cur < start) cur = start;
      for(let g = 0; g < 300; g++){
        const d = Math.floor(cur);
        if(isOff(d) || (p.wd.length && !p.wd.includes(dDate(d).getDay() || 7))){ cur = d + 1 + 1 / 12; continue; }
        if(cur + len > d + 11 / 12 + 1e-6){ cur = d + 1 + 1 / 12; continue; }
        const c = bl.find(([a, b]) => a < cur + len - 1e-6 && b > cur + 1e-6); if(c){ cur = c[1] - Math.floor(c[1]) < 1e-6 ? c[1] + 1 / 12 : c[1]; continue; }
        break;
      }
      out.push({ p, s: cur, e: cur + len, over: Math.floor(cur) >= p.mon + 5 }); cur += len;
    });
    PROVLAY[key] = out;
  });
}
function provBars(key){ return (PROVLAY[key] || []).map(x => { const p = x.p, k = KUNDEN[p.kid]; const l = x.s * dayW + 1, w = Math.max(4, (x.e - x.s) * dayW - 2);
  const tip = `${kName(k)} · ${p.kat.name}\n${k?.ort || ''} · KW ${p.w} · ${fmtN(p.min / 60)} Std.\n${p.arb.join(', ')}\nNoch nicht abgemacht${x.over ? '\nPasst nicht mehr in die KW!' : ''}`;
  return `<div class="bar prov${x.over ? ' over' : ''}" data-prov="${p.id}" style="left:${l}px;width:${w}px" title="${esc(tip)}">${w > 16 ? `<span class="t" style="left:3px;width:${w - 6}px">${esc(kShort(k))}</span>` : ''}</div>`; }).join(''); }

      drag.moved = true; const it = byId(drag.id); const du = snapU(uAt(e.clientX) - drag.u0); const sn = SNAP[zoom];
      if(drag.mode === 'move'){ it.s = r48(drag.s0 + du); it.e = r48(drag.e0 + du);
        const el = document.elementFromPoint(e.clientX, e.clientY)?.closest('.lane[data-mid]'); if(el && canEdit(el.dataset.mid)) it.mid = el.dataset.mid; }
      else if(drag.mode === 'l') it.s = r48(Math.min(drag.e0 - sn, drag.s0 + du));
      else it.e = r48(Math.max(drag.s0 + sn, drag.e0 + du));
      if(!drag.raf){ drag.raf = requestAnimationFrame(() => { if(drag) drag.raf = 0; renderRows(); }); }
    } else if(drag.kind === 'auf' || drag.kind === 'prov'){
      if(!drag.moved && Math.abs(e.clientX - drag.x0) < 5 && Math.abs(e.clientY - drag.y0) < 5) return;
      if(!drag.moved){ drag.moved = true; drag.gh = document.createElement('div'); drag.gh.className = 'aghost'; drag.gh.textContent = drag.kind === 'auf' ? aufLab(drag.a) : kShort(KUNDEN[PROV.find(x => x.id === drag.pid)?.kid]); document.body.appendChild(drag.gh); }
      drag.gh.style.left = e.clientX + 10 + 'px'; drag.gh.style.top = e.clientY + 8 + 'px';
      document.querySelectorAll('.lane.drop').forEach(l => l.classList.remove('drop'));
      const ln = document.elementFromPoint(e.clientX, e.clientY)?.closest('.lane[data-mid]'); if(ln && canEdit(ln.dataset.mid)) ln.classList.add('drop');
    } else if(drag.kind === 'rbar'){
      if(!drag.moved && Math.abs(e.clientX - drag.x0) < 4) return; drag.moved = true;
      const z = RESE.find(o => o.id === drag.zid); if(!z) return; const du = rsnap(uAt(e.clientX) - drag.u0), sn = RS();
      if(drag.mode === 'move'){ z.s = drag.s0 + du; z.e = drag.e0 + du; } else if(drag.mode === 'l') z.s = Math.min(drag.e0 - sn, drag.s0 + du); else z.e = Math.max(drag.s0 + sn, drag.e0 + du);
      if(!drag.raf){ drag.raf = requestAnimationFrame(() => { if(drag) drag.raf = 0; renderRows(); }); }
    } else if(drag.kind === 'rnew'){
      if(!drag.moved && Math.abs(e.clientX - drag.x0) < 4) return; drag.moved = true;
      const u = rsnap(uAt(e.clientX)); drag.a = Math.min(drag.u0, u); drag.b = Math.max(drag.u0 + RS(), u);
      let gh = drag.lane.querySelector('.ghost'); if(!gh){ gh = document.createElement('div'); gh.className = 'ghost'; drag.lane.appendChild(gh); }
      gh.style.left = drag.a * dayW + 'px'; gh.style.width = (drag.b - drag.a) * dayW + 'px';
    } else if(drag.kind === 'new'){
      if(!drag.moved && Math.abs(e.clientX - drag.x0) < 4) return; drag.moved = true;
      const u = snapU(uAt(e.clientX)); const a = Math.min(drag.u0, u), b = Math.max(drag.u0 + SNAP[zoom], u);
      drag.a = a; drag.b = b;
      let gh = drag.lane.querySelector('.ghost'); if(!gh){ gh = document.createElement('div'); gh.className = 'ghost'; drag.lane.appendChild(gh); }
      gh.style.left = a * dayW + 'px'; gh.style.width = (b - a) * dayW + 'px';
    }
  });
  addEventListener('pointerup', async e => {
    const d = drag; drag = null; if(!d) return;
    if(d.kind === 'click'){ d.fn(); return; }
    if(d.kind === 'prov'){
      d.gh?.remove(); document.querySelectorAll('.lane.drop').forEach(l => l.classList.remove('drop'));
      if(!d.moved){ openProvPop(d.pid, d.rect); return; }
      const p = PROV.find(x => x.id === d.pid); const ln = document.elementFromPoint(e.clientX, e.clientY)?.closest('.lane[data-mid]');
      if(p && ln && canEdit(ln.dataset.mid)){ const len = p.min / 60 / 12; const s = zoom === 'tag' || zoom === 'woche' ? Math.round(uAt(e.clientX) * 48) / 48 : Math.floor(uAt(e.clientX)) + 1 / 12; await provToEinsatz(p.id, ln.dataset.mid, s, s + len, false); }
      return;
    }
    if(d.kind === 'auf'){
      d.gh?.remove(); document.querySelectorAll('.lane.drop').forEach(l => l.classList.remove('drop'));
      if(!d.moved){ aufDlg(d.a, false); return; }
      const ln = document.elementFromPoint(e.clientX, e.clientY)?.closest('.lane[data-mid]');
      if(ln && canEdit(ln.dataset.mid)) await planeAuftrag(d.a, ln.dataset.mid, uAt(e.clientX));
      return;
    }
    if(d.kind === 'bar' && d.moved && document.elementFromPoint(e.clientX, e.clientY)?.closest('#aufp')){
      const it = byId(d.id); Object.assign(it, { s: d.s0, e: d.e0, mid: d.mid0 }); $('aufp').classList.remove('drop');
      await zurueckAlsAuftrag(it); return;
    }
    if(d.kind === 'rbar'){
      if(!d.moved){ openResPop(d.zid, d.rid, d.rect, d.u0); return; }
      const z = RESE.find(o => o.id === d.zid); if(!z) return;
      const { error } = await sb.from('planer_ressource_einsatz').update({ beginn: fromU(z.s), ende: fromU(z.e, true) }).eq('id', z.id);
      if(error){ fehler(error); z.s = d.s0; z.e = d.e0; renderRows(); return; }
      toast(`${resName(resById(d.rid))}: ${spanLabel({ s: z.s, e: z.e })}`, async () => { z.s = d.s0; z.e = d.e0; renderRows(); await sb.from('planer_ressource_einsatz').update({ beginn: fromU(z.s), ende: fromU(z.e, true) }).eq('id', z.id); });
      return;
    }
    if(d.kind === 'rnew'){
      const gh = d.lane.querySelector('.ghost'); const rect = (gh || d.lane).getBoundingClientRect(); gh?.remove();
      const a = d.moved ? d.a : rsnap(uAt(e.clientX) - .25), b = d.moved ? d.b : a + RS();
      openResChooser(d.rid, a, b, gh ? rect : { left: e.clientX, bottom: e.clientY });
      return;
    }
    if(d.kind === 'bar'){
      const it = byId(d.id);
      if(!d.moved){ openPanel(d.id); return; }
      if(it.s === d.s0 && it.e === d.e0 && it.mid === d.mid0) return;
      const vorher = { s: d.s0, e: d.e0, mid: d.mid0 };
      const ok = await speichere(it, { beginn: fromU(it.s), ende: fromU(it.e, true), person_id: it.mid });
      if(!ok){ Object.assign(it, vorher); renderRows(); return; }
      const msg = it.mid !== d.mid0 ? `${labOf(it)} → ${P[it.mid].name}` : `Verschoben auf ${spanLabel(it)}`;
      toast(msg, async () => { Object.assign(it, vorher); renderRows(); await speichere(it, { beginn: fromU(it.s), ende: fromU(it.e, true), person_id: it.mid }); });
      if(selId === it.id) openPanel(it.id);
      return;
    }
    if(d.kind === 'new'){
      d.lane.querySelector('.ghost')?.remove();
      const a = d.moved ? d.a : snapU(uAt(e.clientX) - (zoom === 'tag' ? 2 / 48 : zoom === 'woche' ? 1 / 12 : .25));
      const b = d.moved ? d.b : a + (zoom === 'tag' ? 4 / 48 : zoom === 'woche' ? 1 / 6 : .5);
      const kind = d.shift ? 'absenz' : (b - a < .5 - 1e-6 ? 'termin' : 'baustelle');
      const mePl = myPerson(); const pl = kind === 'baustelle' ? (P[d.mid]?.ist_projektleiter ? d.mid : (mePl?.ist_projektleiter ? mePl.id : null)) : null;
      await neuerEinsatz({ mid: d.mid, kind, s: r48(a), e: r48(b), title: kind === 'absenz' ? 'Ferien' : '', ok: d.alt ? false : true, pl }, true);
    }
  });
}
async function speichere(it, patch){

async function neuerEinsatz(it, open){

async function renderFiles(it){

  box.innerHTML = fs.map(f => `<div class="file" data-f="${f.id}" title="${esc(f.name)}">${f.art === 'foto' ? `<img src="${esc(url[f.storage_pfad] || '')}" alt="">` : `${I('file')}<br>${esc(f.name)}`}${canEdit(it.mid) ? `<button class="icon-btn x" data-fx="${f.id}" aria-label="Datei löschen">${I('x')}</button>` : ''}</div>`).join('');

    const lb = document.createElement('div'); lb.className = 'lbox'; lb.innerHTML = `<img src="${esc(u)}" alt=""><button class="icon-btn x" aria-label="Schliessen">${I('x')}</button>`; lb.onclick = () => lb.remove(); document.body.appendChild(lb); });
  box.querySelectorAll('[data-fx]').forEach(b => b.onclick = async () => { const f = fs.find(x => x.id === b.dataset.fx);

}
async function ladeHoch(it, files){
  for(const f of files){
    const isPdf = f.type === 'application/pdf'; const fid = crypto.randomUUID();
    const ext = isPdf ? 'pdf' : (f.name.split('.').pop() || 'jpg').toLowerCase();
    const pfad = `${it.id}/${fid}.${ext}`;
    toast('Lade hoch: ' + f.name);
    const { error } = await sb.storage.from('planer-dateien').upload(pfad, f, { contentType: f.type });
    if(error){ fehler(error, 'Hochladen'); continue; }
    const { data, error: e2 } = await sb.from('planer_datei').insert({ id: fid, einsatz_id: it.id, art: isPdf ? 'pdf' : 'foto', name: f.name, storage_pfad: pfad }).select().single();
    if(e2){ fehler(e2); continue; }
    (it.files ||= []).push(data);

  renderFiles(it);
}

function renderHandy(){
  const me = myPerson(); if(!M.mid) M.mid = me ? me.id : null;
  if(!M.mid && M.who === 'ich') M.who = 'team';
  const day = TODAY + M.off; const x = dDate(day);
  const days = M.mode === 'tag' ? [day] : [...Array(7)].map((_, i) => day - ((x.getDay() + 6) % 7) + i);
  const persons = PERSONEN.filter(p => p.aktiv);
  const title = M.mode === 'tag' ? `${WDL[x.getDay()]}, ${x.getDate()}. ${MONL[x.getMonth()]}` : `KW ${kw(day)}`;
  const sub = M.off === 0 ? 'heute' : M.mode === 'tag' ? `KW ${kw(day)}` : `${dLab(days[0])} – ${dLab(days[6])}`;
  let body = '';
  days.forEach(d => {
    const its = ALL.filter(i => LAY[i.id] && i.s < d + 1 - 1e-6 && i.e > d + 1e-6 && (LAY[i.id].free.some(k => (k >> 1) === d) ) && (M.who === 'team' || i.mid === M.mid)).sort((a, b) => a.s - b.s || (P[a.mid]?.name || '').localeCompare(P[b.mid]?.name || ''));
    if(M.mode === 'woche' || M.who === 'team') body += `<div class="m-day${d === TODAY ? ' td' : ''}">${WDL[dDate(d).getDay()]} ${dDate(d).getDate()}.${dDate(d).getMonth() + 1}.${FEIER.has(d) ? ' · ' + esc(FEIER.get(d)) : ''}</div>`;
    body += its.length ? its.map(i => mCard(i, d)).join('') : `<div class="m-empty">${isOff(d) ? 'Frei.' : 'Nichts eingeteilt.'}</div>`;
  });
  const canAdd = M.who === 'ich' ? canEdit(M.mid) : isBuero();
  $('appMain').innerHTML = `<div class="m">
    <div class="m-top"><button class="nav" id="mPrev" aria-label="Zurück">${I('back')}</button><div class="ti"><b>${title}</b><span>${sub}${M.who === 'ich' && P[M.mid] ? ' · ' + esc(P[M.mid].name) : ''}</span></div><button class="nav" id="mNext" aria-label="Weiter">${I('next')}</button></div>
    <div class="m-sw"><div class="seg"><button data-mm="tag" aria-pressed="${M.mode === 'tag'}">Tag</button><button data-mm="woche" aria-pressed="${M.mode === 'woche'}">Woche</button></div>
      <div class="seg"><button data-mw="ich" aria-pressed="${M.who === 'ich'}">Ich</button><button data-mw="team" aria-pressed="${M.who === 'team'}">Team</button></div></div>
    ${isBuero() && M.who === 'ich' ? `<div style="padding:0 12px"><select id="mPers" class="m-in" style="font-size:13px;padding:7px">${persons.map(p => `<option value="${p.id}"${p.id === M.mid ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>` : ''}
    ${!me && !isBuero() ? `<div class="m-empty">Dein Login ist noch keiner Zeile im Planer zugeordnet. Das Büro kann das unter «Personen &amp; Gruppen» einstellen.</div>` : ''}
    ${mPzHTML(day)}
    ${body}
    ${canAdd && M.mode === 'tag' ? `<button class="m-add" id="mAdd">${I('plus')}Termin eintragen</button>` : ''}
  </div>`;
  $('mPrev').onclick = () => { M.off -= M.mode === 'tag' ? 1 : 7; renderHandy(); };
  $('mNext').onclick = () => { M.off += M.mode === 'tag' ? 1 : 7; renderHandy(); };
  document.querySelectorAll('[data-mm]').forEach(b => b.onclick = () => { M.mode = b.dataset.mm; renderHandy(); });
  document.querySelectorAll('[data-mw]').forEach(b => b.onclick = () => { if(b.dataset.mw === 'ich' && !M.mid){ toast('Dein Login ist noch keiner Zeile zugeordnet.'); return; } M.who = b.dataset.mw; renderHandy(); });
  const mp = $('mPers'); if(mp) mp.onchange = () => { M.mid = mp.value; renderHandy(); };
  document.querySelectorAll('.mc').forEach(c => c.onclick = () => { c.classList.toggle('open'); if(c.classList.contains('open')) mFiles(c); });
  const ma = $('mAdd'); if(ma) ma.onclick = () => mSheet(day);
  bindMPz(day);
}
function resLine(it, d){
  const per = vehOn(it.mid); const vs = [...new Set([...(per[d * 2] || []), ...(per[d * 2 + 1] || [])].map(x => resName(resById(x.rid))))];
  const ms = RESE.filter(z => z.eid === it.id && z.art === 'zuteilung' && (z.s == null || (z.s < d + 1 && z.e > d))).map(z => resName(resById(z.rid)));
  const t = [vs.length ? 'Fahrzeug: ' + vs.join(', ') : '', ms.length ? 'Maschinen: ' + ms.join(', ') : ''].filter(Boolean).join(' · ');
  return t ? `<span class="o">${esc(t)}</span>` : '';
}
// Tagespendenzen auf dem Handy: abhaken und schnell für heute/morgen erfassen
function mPzHTML(day){
  if(M.mode !== 'tag' || M.who !== 'ich' || !M.mid) return '';
  const l = pzList('person', M.mid, 'tag').filter(z => !z.tag || fromIso(z.tag) <= day).sort((a, b) => (a.tag || '').localeCompare(b.tag || ''));
  return `<div class="m-pz"><b style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">Tagespendenzen</b>${l.map(z => `<label><input type="checkbox" data-mpz="${z.id}" style="width:18px;height:18px;accent-color:var(--primary)"><span>${esc(z.text)}${z.tag && fromIso(z.tag) < day ? `<br><span class="od">seit ${esc(dLab(fromIso(z.tag)))} offen</span>` : ''}</span></label>`).join('') || '<span class="small muted">Nichts offen</span>'}
    <div class="padd"><input id="mpzIn" class="m-in" style="padding:8px;font-size:14px" placeholder="Neue Pendenz …"><select id="mpzDay" class="m-in" style="width:auto;padding:8px;font-size:14px"><option value="1">Morgen</option><option value="0">Heute</option></select><button class="icon-btn" id="mpzGo" style="width:36px;height:36px" aria-label="Hinzufügen">${I('plus')}</button></div></div>`;
}
function bindMPz(day){
  document.querySelectorAll('[data-mpz]').forEach(c => c.onchange = async () => { const { error } = await sb.from('planer_pendenz').update({ erledigt: true, erledigt_am: new Date().toISOString() }).eq('id', c.dataset.mpz); if(error) return fehler(error); await neuLaden(); });
  const go = $('mpzGo'); if(!go) return;
  const add = async () => { const t = $('mpzIn').value.trim(); if(!t) return; const d = day + (+$('mpzDay').value);
    const { error } = await sb.from('planer_pendenz').insert({ ebene: 'person', person_id: M.mid, spalte: 'tag', text: t, tag: isoDate(d), erstellt_von: ME }); if(error) return fehler(error); await neuLaden(); toast('Pendenz für ' + (d === TODAY ? 'heute' : d === TODAY + 1 ? 'morgen' : dLab(d))); };
  go.onclick = add; $('mpzIn').onkeydown = e => { if(e.key === 'Enter') add(); };
}
function mCard(it, d){
  const st = barStyle(it), k = KUNDEN[it.kid] || (it.kind === 'hilfe' ? KUNDEN[byId(it.link)?.kid] : null);
  const a = Math.max(it.s, d), b = Math.min(it.e, d + 1);
  const zeit = a - d === 0 && b - d === 1 ? 'ganzer Tag' : a - d === 0 && b - d === .5 ? 'Vormittag' : a - d === .5 && b - d === 1 ? 'Nachmittag' : `${hOf(a, d)}–${hOf(b, d)}`;
  const multi = it.e - it.s > 1 + 1e-6; const L = LAY[it.id];
  const tag = multi && L ? ` · Tag ${[...new Set(L.free.map(k => k >> 1))].indexOf(d) + 1} von ${fmtN(L.n)}` : '';
  const mit = it.kind === 'baustelle' ? ALL.filter(h => h.kind === 'hilfe' && h.link === it.id && h.s < d + 1 && h.e > d).map(h => first(P[h.mid]?.name)) : [];
  return `<div class="mc${it.ok === false ? ' provi' : ''}" style="--c:${st.bg}" data-id="${it.id}">
    <div class="h">${I('cal').replace('class="i"', 'class="i" style="width:14px;height:14px"')}${zeit}${tag}${it.ok === false ? ' · noch nicht abgemacht' : ''}<span class="who">${M.who === 'team' ? esc(P[it.mid]?.name || '') : esc(ART[it.kind])}</span></div>
    <b>${esc(titleOf(it))}</b>${k && kOrt(k) ? `<span class="o">${esc(kOrt(k))}</span>` : ''}${k && it.title ? `<span class="o">${esc(it.title)}</span>` : ''}
    ${mit.length ? `<span class="o">mit ${esc(mit.join(', '))}</span>` : ''}
    ${it.kind === 'baustelle' ? resLine(it, d) : ''}
    ${it.text ? `<div class="nt">${esc(it.text)}</div>` : ''}${(it.files || []).length ? `<div class="fl" data-fl="${it.id}"><span class="small muted">Lade Dateien …</span></div>` : ''}
  </div>`;
}
async function mFiles(card){
  const box = card.querySelector('[data-fl]'); if(!box || box.dataset.ok) return; const it = byId(box.dataset.fl); if(!it) return;
  const { data } = await sb.storage.from('planer-dateien').createSignedUrls(it.files.map(f => f.storage_pfad), 3600);
  const url = {}; (data || []).forEach(x => url[x.path] = x.signedUrl);
  box.innerHTML = it.files.map(f => `<a href="${esc(url[f.storage_pfad] || '#')}" target="_blank" rel="noopener">${f.art === 'pdf' ? 'PDF' : 'Foto'}: ${esc(f.name)}</a>`).join(''); box.dataset.ok = 1;
}
function mSheet(day){
  const mid = M.who === 'ich' ? M.mid : (myPerson()?.id || PERSONEN.find(p => p.aktiv)?.id);
  const busy = ALL.filter(i => i.mid === mid && i.s < day + 1 && i.e > day && isShort(i)).reduce((m, i) => Math.max(m, i.e), day + 2 / 12);
  const q0 = Math.min(44, Math.round((busy - day) * 48 / 1) ), q1 = Math.min(48, q0 + 4);
  const sh = document.createElement('div'); sh.className = 'm-sheet';
  sh.innerHTML = `<div class="in"><div style="display:flex;align-items:center;gap:8px"><b style="font-size:15px">Termin · ${WDL[dDate(day).getDay()]} ${dDate(day).getDate()}.${dDate(day).getMonth() + 1}.</b><button class="icon-btn" style="margin-left:auto" id="sX" aria-label="Schliessen">${I('x')}</button></div>
    ${M.who === 'team' && isBuero() ? `<select id="sP" class="m-in">${PERSONEN.filter(p => p.aktiv).map(p => `<option value="${p.id}"${p.id === mid ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</select>` : ''}
    <input id="sK" list="kList2" placeholder="Kunde" class="m-in" autocomplete="off"><datalist id="kList2">${KLIST.map(x => `<option value="${esc(x.lab)}">`).join('')}</datalist>
    <input id="sJ" placeholder="Was? z. B. Wasserwerte messen" class="m-in">
    <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center"><select id="sA" class="m-in">${qOpts(q0)}</select><span>bis</span><select id="sB" class="m-in">${qOpts(q1)}</select></div>
    <label class="chk" style="font-size:14px"><input type="checkbox" id="sO">Noch nicht abgemacht</label>
    <button class="btn btn-primary" id="sGo" style="justify-content:center;padding:11px">Speichern</button></div>`;
  document.body.appendChild(sh);
  sh.querySelector('#sX').onclick = () => sh.remove(); sh.onclick = e => { if(e.target === sh) sh.remove(); };
  sh.querySelector('#sGo').onclick = async () => {
    const a = +sh.querySelector('#sA').value, b = +sh.querySelector('#sB').value; if(b <= a){ toast('«bis» muss nach «von» sein.', null, true); return; }
    const kv = sh.querySelector('#sK').value.trim(), was = sh.querySelector('#sJ').value.trim();
    const hit = KLIST.find(x => x.lab === kv) || (kv.length > 2 ? KLIST.find(x => x.lab.toLowerCase().includes(kv.toLowerCase())) : null);
    const pm = sh.querySelector('#sP')?.value || mid;
    const titel = hit ? was : [kv, was].filter(Boolean).join(' · ') || 'Termin';
    sh.querySelector('#sGo').disabled = true;
    const neu = await neuerEinsatz({ mid: pm, kind: 'termin', s: day + a / 48, e: day + b / 48, kid: hit ? hit.id : null, title: titel, text: '', ok: !sh.querySelector('#sO').checked }, false);
    if(neu){ sh.remove(); render(); toast(`Termin ${tStr(6 + a / 4)}–${tStr(6 + b / 4)} gespeichert`, () => loescheEinsatz(neu)); } else sh.querySelector('#sGo').disabled = false;
  };
}

function frage(titel, wert){
  return new Promise(res => { const d = document.createElement('div'); d.className = 'dlg';
    d.innerHTML = `<div class="in"><b>${esc(titel)}</b><input type="text" id="fIn" value="${esc(wert || '')}"><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-ghost" id="fNo">Abbrechen</button><button class="btn btn-primary" id="fOk">OK</button></div></div>`;
    document.body.appendChild(d); const inp = d.querySelector('#fIn'); inp.focus(); inp.select();
    const fertig = v => { d.remove(); res(v); };
    d.querySelector('#fOk').onclick = () => fertig(inp.value.trim()); d.querySelector('#fNo').onclick = () => fertig(null);
    inp.onkeydown = e => { if(e.key === 'Enter') fertig(inp.value.trim()); if(e.key === 'Escape') fertig(null); }; });
}

      <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center"><select id="sArt"><option value="absenz">Absenz</option><option value="termin">Termin</option><option value="intern">Werkhof / intern</option></select><input type="date" id="sBis" title="Bis (leer = offen)"><label class="chk small"><input type="checkbox" id="s2">alle 2 Wo.</label></div>
      <button class="btn btn-ghost" id="sAdd" style="align-self:flex-start">${I('plus')}Wiederkehrend hinzufügen</button></div>`}
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">${neu ? '' : `<span class="small muted" style="margin-right:auto;align-self:center">Löschen geht nicht, damit alte Einsätze erhalten bleiben – «Aktiv» abwählen.</span>`}<button class="btn btn-ghost" id="dNo">Abbrechen</button><button class="btn btn-primary" id="dOk">Speichern</button></div>
  </div>`;
  document.body.appendChild(d);
  let farbe = p.farbe;
  d.querySelectorAll('#dF button').forEach(b => b.onclick = () => { farbe = b.dataset.c; d.querySelectorAll('#dF button').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  d.querySelector('#dX').onclick = d.querySelector('#dNo').onclick = () => d.remove();
  d.querySelector('#dOk').onclick = async () => {
    const row = { name: d.querySelector('#dN').value.trim(), kuerzel: d.querySelector('#dK').value.trim() || null, zusatz: d.querySelector('#dZ').value.trim() || null, gruppe_id: d.querySelector('#dG').value || null, farbe, ist_vorarbeiter: d.querySelector('#dV').checked, ist_projektleiter: d.querySelector('#dP').checked, benutzer_id: d.querySelector('#dB').value || null, aktiv: d.querySelector('#dA').checked };
    if(!row.name){ toast('Bitte einen Namen eingeben.', null, true); return; }
    if(neu) row.sortierung = 10 + Math.max(0, ...PERSONEN.filter(x => (x.gruppe_id || null) === row.gruppe_id).map(x => x.sortierung));
    const { error } = neu ? await sb.from('planer_person').insert(row) : await sb.from('planer_person').update(row).eq('id', p.id);
    if(error) return fehler(error, 'Speichern');
    d.remove(); await neuLaden(); toast(neu ? 'Person erfasst' : 'Gespeichert');
  };
  d.querySelectorAll('[data-sx]').forEach(b => b.onclick = async () => { const { error } = await sb.from('planer_serie').delete().eq('id', b.dataset.sx); if(error) return fehler(error); d.remove(); await neuLaden(); personDlg(P[p.id]); });
  const sa = d.querySelector('#sAdd'); if(sa) sa.onclick = async () => {
    const t = d.querySelector('#sT').value.trim(); if(!t){ toast('Bitte einen Titel eingeben.', null, true); return; }
    const row = { person_id: p.id, titel: t, art: d.querySelector('#sArt').value, wochentag: +d.querySelector('#sW').value, teil: d.querySelector('#sTe').value, alle_zwei_wochen: d.querySelector('#s2').checked, von: isoDate(TODAY), bis: d.querySelector('#sBis').value || null };
    const { error } = await sb.from('planer_serie').insert(row); if(error) return fehler(error);
    d.remove(); await neuLaden(); personDlg(P[p.id]);
  };
}

// ---------------------------------------------------------------------------
// FAHRZEUGE & MASCHINEN (Stammdaten, Büro / Admin)
// ---------------------------------------------------------------------------
function renderRessourcen(){
  const typen = [['fahrzeug', 'Fahrzeuge', 'Ein Fahrzeug mit Stamm-Fahrer fährt automatisch mit, wenn dieser eine Baustelle hat.'], ['maschine', 'Maschinen', 'Bagger, Dumper usw. Werden einer Baustelle zugeteilt und wandern mit.'], ['anhaenger', 'Anhänger', 'Können auch Mitarbeitende für die eigene Zeile reservieren.']];
  $('appMain').innerHTML = `<div class="page"><h2>Fahrzeuge &amp; Maschinen</h2><p class="hint">Eingeteilt wird im Planer über den Umschalter «Maschinen / Fahrzeuge / Anhänger»: in einer Zeile ziehen, dann Baustelle oder Person wählen.</p>
    ${typen.map(([t, n, h]) => { const rs = RES.filter(r => r.typ === t).sort((a, b) => a.sortierung - b.sortierung || resName(a).localeCompare(resName(b)));
      return `<div class="card gcard"><div class="ghead"><b>${n}</b><span class="muted small">${esc(h)}</span><button class="btn btn-ghost" data-radd="${t}" style="margin-left:auto">${I('plus')}${RTYP[t]}</button></div>
        ${rs.map((r, i) => `<div class="prow${r.aktiv ? '' : ' off'}" style="grid-template-columns:60px minmax(0,1.6fr) minmax(0,1.4fr) auto"><b>${esc(r.nummer || '')}</b><span>${esc(r.name)}${r.aktiv ? '' : ' <span class="tag">inaktiv</span>'}</span><span class="small muted">${r.stamm_person_id ? 'Stamm: ' + esc(P[r.stamm_person_id]?.name || '?') : ''}</span>
          <span class="acts"><button class="icon-btn" data-ru="${r.id}" aria-label="Nach oben" ${i === 0 ? 'disabled' : ''}>${I('up')}</button><button class="icon-btn" data-rd="${r.id}" aria-label="Nach unten" ${i === rs.length - 1 ? 'disabled' : ''}>${I('down')}</button><button class="icon-btn" data-re="${r.id}" aria-label="Bearbeiten">${I('edit')}</button></span></div>`).join('') || '<div class="prow"><span></span><span class="muted small">Noch keine erfasst</span></div>'}</div>`; }).join('')}</div>`;
  const q = s => $('appMain').querySelectorAll(s);
  q('[data-radd]').forEach(b => b.onclick = () => resDlg({ typ: b.dataset.radd, nummer: '', name: '', stamm_person_id: null, aktiv: true }, true));
  q('[data-re]').forEach(b => b.onclick = () => resDlg(resById(b.dataset.re), false));
  const move = async (id, dir) => { const r = resById(id); const l = RES.filter(x => x.typ === r.typ).sort((a, b) => a.sortierung - b.sortierung || resName(a).localeCompare(resName(b))); const i = l.findIndex(x => x.id === id), j = i + dir; if(j < 0 || j >= l.length) return; [l[i], l[j]] = [l[j], l[i]]; await Promise.all(l.map((x, k) => sb.from('planer_ressource').update({ sortierung: (k + 1) * 10 }).eq('id', x.id))); await neuLaden(); };
  q('[data-ru]').forEach(b => b.onclick = () => move(b.dataset.ru, -1)); q('[data-rd]').forEach(b => b.onclick = () => move(b.dataset.rd, 1));
}
function resDlg(r, neu){
  const d = document.createElement('div'); d.className = 'dlg';
  d.innerHTML = `<div class="in"><div style="display:flex;align-items:center"><b style="font-size:15px">${neu ? 'Neu: ' + RTYP[r.typ] : esc(resName(r))}</b><button class="icon-btn" id="rX" style="margin-left:auto" aria-label="Schliessen">${I('x')}</button></div>
    <div class="two"><div class="fld"><label>Nummer</label><input type="text" id="rN" value="${esc(r.nummer || '')}" placeholder="z. B. B4, F03"></div><div class="fld"><label>Name</label><input type="text" id="rName" value="${esc(r.name)}" placeholder="z. B. Mitsubishi Canter"></div></div>
    ${r.typ === 'fahrzeug' ? `<div class="fld"><label>Stamm-Fahrer</label><select id="rS"><option value="">Kein Stamm-Fahrer (Pool)</option>${PERSONEN.filter(p => p.aktiv).map(p => `<option value="${p.id}"${p.id === r.stamm_person_id ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>` : ''}
    <label class="chk"><input type="checkbox" id="rA" ${r.aktiv ? 'checked' : ''}>Aktiv</label>
    <div style="display:flex;gap:8px;justify-content:flex-end">${neu ? '' : `<button class="btn btn-danger" id="rDel" style="margin-right:auto">${I('trash')}Löschen</button>`}<button class="btn btn-ghost" id="rNo">Abbrechen</button><button class="btn btn-primary" id="rOk">Speichern</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector('#rX').onclick = d.querySelector('#rNo').onclick = () => d.remove();
  d.querySelector('#rOk').onclick = async () => {
    const row = { typ: r.typ, nummer: d.querySelector('#rN').value.trim() || null, name: d.querySelector('#rName').value.trim(), stamm_person_id: d.querySelector('#rS')?.value || null, aktiv: d.querySelector('#rA').checked };
    if(!row.name){ toast('Bitte einen Namen eingeben.', null, true); return; }
    if(neu) row.sortierung = 10 + Math.max(0, ...RES.filter(x => x.typ === r.typ).map(x => x.sortierung));
    const { error } = neu ? await sb.from('planer_ressource').insert(row) : await sb.from('planer_ressource').update(row).eq('id', r.id);
    if(error) return fehler(error, 'Speichern'); d.remove(); await neuLaden(); toast('Gespeichert');
  };
  const del = d.querySelector('#rDel'); if(del) del.onclick = async () => {
    const n = RESE.filter(z => z.rid === r.id).length;
    if(n && !del.dataset.sicher){ del.dataset.sicher = 1; del.textContent = `Wirklich? ${n} Einteilung(en) gehen verloren`; return; }
    const { error } = await sb.from('planer_ressource').delete().eq('id', r.id); if(error) return fehler(error); d.remove(); await neuLaden(); toast('Gelöscht');
  };
}

// ---------------------------------------------------------------------------
// FEIERTAGE
// ---------------------------------------------------------------------------
function renderFeiertage(){
  const l = [...FEIER.entries()].sort((a, b) => a[0] - b[0]);
  $('appMain').innerHTML = `<div class="page"><h2>Feiertage &amp; Betriebsferien</h2><p class="hint">An diesen Tagen werden mehrtägige Einsätze automatisch unterbrochen und nicht als Arbeitstage gezählt.</p>
    <div class="card" style="margin-top:12px;padding:6px 4px"><table class="ft">${l.map(([d, n]) => `<tr><td style="width:150px">${dLab(d)} ${dDate(d).getFullYear()}</td><td>${esc(n)}</td><td style="width:40px"><button class="icon-btn" data-fx="${isoDate(d)}" aria-label="Löschen">${I('trash')}</button></td></tr>`).join('') || '<tr><td class="muted">Keine</td></tr>'}</table></div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><input type="date" id="fD"><input type="text" id="fN" placeholder="Name, z. B. Betriebsferien"><button class="btn btn-primary" id="fAdd">${I('plus')}Hinzufügen</button></div>
    <p class="hint" style="margin-top:6px">Betriebsferien über mehrere Tage: jeden Tag einzeln eintragen (Wochenenden nicht nötig).</p></div>`;
  $('fAdd').onclick = async () => { const d = $('fD').value, n = $('fN').value.trim(); if(!d || !n){ toast('Datum und Name eingeben.', null, true); return; } const { error } = await sb.from('planer_feiertag').upsert({ datum: d, name: n }); if(error) return fehler(error); await neuLaden(); };
  document.querySelectorAll('[data-fx]').forEach(b => b.onclick = async () => { const { error } = await sb.from('planer_feiertag').delete().eq('datum', b.dataset.fx); if(error) return fehler(error); await neuLaden(); });
}

// ---------------------------------------------------------------------------
// Live-Abgleich: Änderungen anderer erscheinen sofort
// ---------------------------------------------------------------------------
let reloadT = null;
async function neuLaden(){ await ladeAlles(); if(drag) return; if(boardRef) renderBoard(); if(VIEW === 'plan'){ renderRows(); renderChips(); renderAuf(); if(selId && !byId(selId)) closePanel(); } else render(); }
async function starteLive(){
  // Live-Verbindung braucht das Login-Ticket, sonst gilt sie als anonym und die Rechte filtern alles weg
  const { data: { session } } = await sb.auth.getSession(); if(session) await sb.realtime.setAuth(session.access_token);
  sb.auth.onAuthStateChange((ev, s) => { if(s && (ev === 'TOKEN_REFRESHED' || ev === 'SIGNED_IN')) sb.realtime.setAuth(s.access_token); });
  const ch = sb.channel('einsatzplaner');
  ['planer_einsatz', 'planer_serie', 'planer_person', 'planer_gruppe', 'planer_feiertag', 'planer_ressource', 'planer_ressource_einsatz', 'planer_auftrag', 'planer_pendenz'].forEach(t =>
    ch.on('postgres_changes', { event: '*', schema: 'public', table: t }, () => { clearTimeout(reloadT); reloadT = setTimeout(() => { if(drag){ reloadT = setTimeout(neuLaden, 800); return; } if(document.activeElement && $('side').contains(document.activeElement)) return; neuLaden(); }, 500); }));
  ch.subscribe();
  // Beim Zurückkommen auf die Seite (Handy entsperrt) frisch laden
  document.addEventListener('visibilitychange', () => { if(!document.hidden) neuLaden(); });
}
let rzT; addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if(VIEW === 'plan' && (zoom === 'woche' || zoom === 'tag')){ const c = centerU(); dayW = calcDayW(); renderRows(); scrollToU(c, 'center'); } }, 200); });

pruefeAnmeldung();
})();
</script>
