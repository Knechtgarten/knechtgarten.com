<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=68"></script>
<title>Einsatzplaner – Knechtgarten</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg:#F5F7F9; --card:#FFFFFF; --primary:#323E4E; --primary-l:#4C5C70;
  --ink:#232B35; --muted:#8B9097; --line:#E1E5E9; --soft:#EEF3F7;
  --accent-blue:#D6E7F4; --accent-lime:#D1DB5F; --danger:#B4655F; --red:#C05A1C; /* Rot wie im Pendenzen-Tool */ --prot:#C0392B; /* Personal fehlt: auffälliges Rot */
  --namew:170px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);line-height:1.45;font-size:13px;}
.wrap{max-width:1400px;margin:0 auto;padding:0 16px;}
.hidden{display:none !important;}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;}

header.app{background:var(--primary);color:#fff;}
header.app .wrap{display:flex;align-items:center;gap:20px;max-width:none;}
header.app .backlink{display:inline-flex;align-items:center;gap:5px;color:var(--primary);text-decoration:none;font-size:12px;font-weight:700;flex-shrink:0;background:var(--accent-lime);border-radius:20px;padding:6px 12px;}
header.app .brand{padding:11px 0;}
header.app .brand h1{font-size:15px;font-weight:600;color:#fff;}
header.app .brand .sub{font-size:11px;opacity:.75;margin-top:1px;}
header.app .userbar{display:flex;align-items:center;gap:10px;margin-left:auto;}
header.app .userbar span{opacity:.85;font-size:11.5px;}
header.app .userbar button{font-size:11.5px;color:#c7ccd1;background:none;border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:3px 9px;cursor:pointer;}
nav.subnav{background:#fff;border-bottom:1px solid var(--line);}
nav.subnav .wrap{display:flex;gap:2px;max-width:none;overflow-x:auto;}
nav.subnav a{display:flex;align-items:center;gap:7px;padding:12px 12px 10px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;text-decoration:none;font-size:12.5px;white-space:nowrap;cursor:pointer;}
nav.subnav a:hover{color:var(--primary);}
nav.subnav a.on{color:var(--primary);border-bottom-color:var(--primary);}
nav.subnav a .i{width:16px;height:16px;}
nav.subnav .navsp{flex:1;}
nav.subnav .navic{all:unset;cursor:pointer;display:flex;align-items:center;padding:12px 9px 10px;color:var(--muted);border-bottom:2px solid transparent;}
nav.subnav .navic .i{width:18px;height:18px;}
nav.subnav .navic:hover,nav.subnav .navic.on{color:var(--primary);}
nav.subnav .navic.on{border-bottom-color:var(--primary);}
nav.subnav .navic[hidden]{display:none;}
nav.subnav .navic:focus-visible{outline:2px solid var(--primary);outline-offset:-2px;}

input[type=text],input[type=date],input[type=search],select,textarea{font:inherit;font-size:12.5px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 8px;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);}
.btn{border:none;border-radius:7px;padding:7px 14px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-l);}
.btn-ghost{background:#fff;color:var(--primary);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--primary);}
.btn-danger{background:#fff;color:var(--danger);border:1px solid #E6CFCC;}
.btn .i{width:15px;height:15px;}
.icon-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;flex:none;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--muted);box-sizing:border-box;}
.icon-btn .i{width:14px;height:14px;}
.icon-btn:hover{border-color:var(--primary);color:var(--primary);}
.icon-btn.danger:hover{border-color:var(--danger);color:var(--danger);background:#FBEFEC;}
.icon-btn.on{background:var(--primary);color:#fff;border-color:var(--primary);}
.icon-btn.sdrep{cursor:default;} /* Serie im Detailfeld: nur Anzeige */
.seg{display:inline-flex;}
.seg button{all:unset;cursor:pointer;display:inline-flex;align-items:center;height:32px;box-sizing:border-box;padding:0 12px;border:1px solid #D5DBE1;background:#fff;font-size:12.5px;font-weight:600;color:#4C5C70;justify-content:center;}
.seg button + button{border-left:0;}
.seg button:first-child{border-radius:8px 0 0 8px;}
.seg button:last-child{border-radius:0 8px 8px 0;}
.seg button[aria-pressed="true"]{background:var(--kg-tool,var(--primary));color:#fff;border-color:var(--kg-tool,var(--primary));}
.muted{color:var(--muted);} .small{font-size:11.5px;}
.hint{font-size:11.5px;color:var(--muted);}
.card{background:#fff;border:1px solid var(--line);border-radius:11px;}

/* Login */
.loginwrap{min-height:80vh;display:flex;align-items:center;justify-content:center;}
.logincard,.pendingcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:28px 26px;width:100%;max-width:330px;}
.logincard h2,.pendingcard h2{font-size:16px;color:var(--primary);margin-bottom:14px;}
.logincard .fld{margin-bottom:10px;}
.logincard label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;}
.logincard input{width:100%;}
.status{font-size:11.5px;color:var(--muted);margin-top:6px;} .status.err{color:var(--danger);}

/* Werkzeugleiste */
.bar-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px;min-height:50px;box-sizing:border-box;background:#fff;border-bottom:1px solid var(--line);} /* = weisse Leiste (kg-seite) */
.bar-top .sp{flex:1;}
.plsel{padding:4px 8px;font-size:12.5px;max-width:190px;}
.plsel.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);font-weight:700;}
.cpychip{display:inline-flex;align-items:center;gap:5px;color:var(--primary);font-weight:700;font-size:12px;}
.cpychip .i{width:13px;height:13px;}
.cpychip .icon-btn{width:18px;height:18px;}
.rgrip{color:#A9AFB5;display:inline-flex;cursor:pointer;touch-action:none;}
.rgrip .i{width:14px;height:14px;}
.prow.rdrag{opacity:.5;}
.wdhp{display:flex;flex-direction:column;gap:7px;width:260px;}
.wdhp select{width:100%;}
.wdhp .wrow{display:flex;align-items:center;gap:6px;}
.wdhp .wrow input{width:54px;}
.wdhp .wtage{display:flex;gap:3px;}
.wdhp .wtage button{all:unset;cursor:pointer;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);}
.wdhp .wtage button.on{background:var(--primary);border-color:var(--primary);color:#fff;}
.wdhp .wrad{display:flex;flex-direction:column;gap:4px;font-size:12.5px;}
.wdhp .wrad label{display:flex;align-items:center;gap:6px;}
.wdhp .wrad input[type=radio]{accent-color:var(--primary);}
.wdhp .wrad input[type=number]{width:56px;}
.wdhp .wlab{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-top:2px;}
.wdhp .wsum{font-size:12px;color:var(--primary);}
.infop{display:flex;flex-direction:column;gap:5px;max-height:72vh;overflow:auto;}
.infop > b{margin-top:6px;color:var(--primary);}
.infop > b:first-child{margin-top:0;}
.infop .ir{display:flex;align-items:center;gap:8px;font-size:12px;}
.infop .ir > :first-child{flex:none;}
.infop .sw{width:22px;height:11px;border-radius:2px;border:1px solid rgba(50,62,78,.25);display:inline-block;}
.infop .ir .i{width:14px;height:14px;}
.infop a{color:var(--primary);}
.hc.t1.kw{font-size:14px;font-weight:800;}
.hc.t1.kw .kwm{font-size:12px;font-weight:600;color:var(--muted);margin-left:6px;} /* Monat neben der KW */
.hc.t2.m1{border-left:2px solid var(--primary);} /* Monatsanfang */

/* Planer-Raster */
.tl{position:relative;overflow:auto;background:#fff;border-top:1px solid var(--line);height:calc(100vh - 200px);min-height:300px;}
.grid{position:relative;}
.hdr{position:sticky;top:0;z-index:6;display:flex;background:#fff;border-bottom:1px solid var(--line);}
.hdr .corner{position:sticky;left:0;z-index:7;width:var(--namew);flex:none;background:#fff;border-right:1px solid var(--line);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;display:flex;align-items:flex-end;padding:0 10px 5px;}
.hlane{position:relative;flex:none;}
.hc{position:absolute;overflow:hidden;white-space:nowrap;text-overflow:clip;font-size:10.5px;color:var(--muted);border-left:1px solid var(--line);padding:0 4px;}
.hc.t1{top:0;height:20px;line-height:20px;font-weight:700;color:var(--primary);}
.hc.t2{top:20px;height:20px;line-height:20px;text-align:center;}
.hc.t3{top:40px;height:15px;line-height:15px;text-align:center;font-size:9.5px;}
.hc.we{background:#F3F5F7;} .hc.fe{background:#F6F2E6;} .hc.td{background:rgba(50,62,78,.08);color:var(--primary);font-weight:700;}
.row{display:flex;border-bottom:1px solid #EEF1F3;}
.row .nm{position:sticky;left:0;z-index:5;width:var(--namew);flex:none;background:#fff;border-right:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 8px 0 10px;font-size:12px;white-space:nowrap;overflow:hidden;}
.row .nm .n{overflow:hidden;text-overflow:ellipsis;font-weight:600;}
.row .nm .z{font-size:10.5px;color:var(--muted);flex:none;}
.row .nm .dot{width:9px;height:9px;border-radius:2px;flex:none;border:1px solid rgba(50,62,78,.25);}
.row .nm .me{font-size:9.5px;background:var(--accent-lime);color:var(--primary);border-radius:3px;padding:0 4px;font-weight:700;}
.row.grp .nm{background:#E6E9ED;color:#4C5C70;font-weight:600;cursor:pointer;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;} /* Gruppenköpfe hell (wie im Start-Widget) */
/* Personenfarbe ohne Punkt: erscheint als Hintergrund, wenn man mit der Maus über den Namen fährt */
.row[data-mid] > .nm[style*="--pf"]:hover{background:var(--pf);color:var(--pft);}
.row[data-mid] > .nm[style*="--pf"]:hover .n,.row[data-mid] > .nm[style*="--pf"]:hover .z,.row[data-mid] > .nm[style*="--pf"]:hover .mab,.row[data-mid] > .nm[style*="--pf"]:hover .pgrip{color:inherit;}
.row.grp .nm .i{width:13px;height:13px;transition:transform .15s;}
.row.grp.zu .nm .i{transform:rotate(-90deg);}
.row.grp .lane{background:#E6E9ED;}
.row.grp.arch .nm{background:#DCE2E8;}
.row.grp.ajahr .nm{background:#F7F9FA;color:var(--primary);padding-left:22px;font-weight:600;text-transform:none;letter-spacing:0;}
.lane{position:relative;flex:none;height:24px;}
/* Grauer Rand (16 px) rechts der Namensspalte, wie ein Wochenende: der Plan klebt nicht an den Namen (RAND() im Code) */
html:not(.ep-eingebettet) .row > .nm,html:not(.ep-eingebettet) .hdr .corner{box-shadow:var(--rand,16px) 0 0 #F3F5F7,calc(var(--rand,16px) + 1px) 0 0 #E3E7EA;} /* wie ein Wochenende: grau mit Tageslinie */
html:not(.ep-eingebettet) .row.grp > .nm{box-shadow:var(--rand,16px) 0 0 #E6E9ED;}
/* Personen-Zeilen kompakter: Balken gleich hoch (19 px), nur weniger Zwischenraum */
.row[data-mid] > .lane{height:21px;}
.row[data-mid] .bar{top:1px;} .row[data-mid] .bar.dup1{top:0;} .row[data-mid] .bar.dup2{top:11px;}
.row[data-mid] .ghost,.row[data-mid] .bgrip,.row[data-mid] .bpz{top:2px;} .row[data-mid] .brg{top:9px;}
.tl.zw .row[data-mid] .rdot,.tl.zm .row[data-mid] .rdot{top:1px;} .tl.zq .row[data-mid] .rdot{top:1px!important;}
.row[data-mid] .mk{top:0.5px;width:21px;height:21px;} .row[data-mid] .mk.eng{top:2.5px;}
.tfov{position:absolute;border-radius:3px;z-index:4;pointer-events:none;font-size:10.5px;font-weight:500;line-height:17px;padding:0 5px;white-space:nowrap;overflow:hidden;box-sizing:border-box;} /* Tag voll gefärbt (Maus über der Kopfzeile) */
.lane.ed{cursor:crosshair;}
.tdl{position:absolute;top:0;bottom:0;width:2px;background:rgba(50,62,78,.35);pointer-events:none;z-index:1;}
.fel{position:absolute;top:0;bottom:0;background:rgba(214,190,120,.16);pointer-events:none;}
.mittag{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,#E3E7EA 0 4px,#F5F7F9 4px 8px);z-index:3;pointer-events:none;} /* Tagesansicht 12–13 Uhr */
.bar{position:absolute;top:2px;height:19px;border-radius:3px;border:1px solid;font-size:10.5px;font-weight:600;cursor:pointer;user-select:none;touch-action:none;overflow:hidden;z-index:1;}
.bar.hilfe{font-weight:500;}
html:not(.ep-eingebettet) .bar.kopf .t.tz{max-width:none;color:#4C5C70;} html:not(.ep-eingebettet) .bar.kopf{font-weight:500;} html:not(.ep-eingebettet) .bar.strich .t,html:not(.ep-eingebettet) .bar.tgrp .t{line-height:14px;} /* Aufträge wie Mithilfe: Name nur im Farbfeld, Rest abgeschnitten */ /* Mithilfe: Farbfeld mit Namen vorne, sonst weiss mit feinem farbigem Rahmen */
.bar.ed{cursor:pointer;}
.bar .t,.brg .t{position:absolute;top:0;bottom:0;line-height:17px;white-space:nowrap;overflow:hidden;text-overflow:clip;font-weight:500;font-size:10.5px;pointer-events:none;}
.bar .hl,.bar .hr{position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize;z-index:2;}
.bar .hl{left:0;} .bar .hr{right:0;}
.bar:not(.ed) .hl,.bar:not(.ed) .hr{display:none;}
.bar:hover{filter:brightness(.95);}
.bar.sel{outline:2px solid var(--primary);outline-offset:1px;z-index:3;}
.bar.dim,.brg.dim{opacity:.22;}
.bar.provi{border-style:dashed;}
.bar.mini{top:13px;height:9px;z-index:2;box-shadow:0 0 0 1.5px #fff;border-radius:2px;}
.bar.dup1,.bar.dup2{height:10px;} /* übereinander: je halb hoch */
.bar.duprot{background:var(--prot)!important;color:#fff!important;border-color:var(--prot)!important;} /* der hinzugeschobene: ganz rot gefüllt */
.bar.dup1{top:1px;} .bar.dup2{top:12px;}
.bar.dup1 .t,.bar.dup2 .t{line-height:7px;font-size:8.5px;}
.dupz{all:unset;cursor:pointer;margin-left:8px;border:1px solid var(--red);color:var(--red);background:#fff;border-radius:6px;padding:3px 9px;font-size:12px;font-weight:600;white-space:nowrap;}
.dupz:hover{background:var(--red);color:#fff;}
.upop{min-width:0!important;width:150px;padding:4px!important;gap:2px!important;} .upop .btn{justify-content:flex-start;padding:4px 10px;font-size:12.5px;}
.bar.mini .t{line-height:7px;font-size:8px;}
.bar.tgrp{background:#fff;color:var(--primary);border:1px solid #8B9097;}
.bar.tgrp .t{font-weight:600;}
.bar.occ{border-style:dotted;}
.brg{position:absolute;top:10px;height:3px;opacity:.55;pointer-events:none;overflow:visible;}
.brg .t{top:-8px;height:19px;line-height:17px;}
.rdot{position:absolute;top:1px;width:9px;height:9px;border-radius:50%;background:var(--prot);border:1px solid #fff;z-index:3;pointer-events:none;}
/* Wochenansicht: Punkte und Lieferwagen-Icons mitten im Balken statt am oberen bzw. unteren Rand */
.tl.zw .rdot{top:7px;}
.tl.zw .vic{top:5px!important;}
.tl.zm .rdot{top:7px;} .tl.zm .vic{top:5px!important;}
.tl.zq .rdot{width:2px!important;height:19px!important;top:2px!important;border-width:0!important;border-radius:0!important;transform:none!important;} /* Quartal: feiner Strich links im Tag */
.tl.zw .rdot,.tl.zm .rdot{box-shadow:1px 0 0 #fff;width:5px;height:19px;top:2px;margin-left:-6.5px;border-width:0;border-radius:3px 0 0 3px;} /* Personal: Streifen ganz links am Tagesanfang (rot = fehlt, blau = allein) */
.tl.zw .rdot.klick:hover,.tl.zm .rdot.klick:hover,.tl.zw .rdot.wahl,.tl.zm .rdot.wahl{transform:none;filter:brightness(1.25);}.vsq{position:absolute;top:13px;width:7px;height:7px;border-radius:1px;background:var(--red);z-index:3;cursor:pointer;} .vsq.zwei{background:#2F5C9A;} /* Feld: Quadrat oben rechts (Lieferwagen) */
.itri{position:absolute;top:5px;width:12px;height:12px;color:var(--red);z-index:3;pointer-events:none;display:flex;} .itri svg{width:100%;height:100%;} /* nur Anzeige: Info steht im Termin */ /* Warndreieck = wichtige Info, Klick öffnet sie */
.tl.zw .vic,.tl.zm .vic{transform:scale(.85);transform-origin:left center;}
html:not(.ep-eingebettet) .tl .grid{margin-bottom:50vh;} /* unten Platz, damit auch die untersten Gruppen ganz aufgeklappt sichtbar sind */
.tl.zq .rdot{top:7px;} .tl.zq .vic{display:none!important;} /* Quartal: grobe Übersicht */
.rdot.blau{background:#2E9BF0;}
.avor{position:absolute;top:2px;height:19px;box-sizing:border-box;border:1px dashed #2E9BF0;border-left:5px solid #2E9BF0;border-radius:3px;background:#fff;z-index:0;font-size:10.5px;color:#2E9BF0;line-height:17px;padding-left:4px;overflow:hidden;white-space:nowrap;} .row[data-mid] .avor{top:1px;} .avor.ed{cursor:pointer;} /* Vorab «Allein»: leerer Termin mit blauem Strich */
.rdot.blau.cf{background:#B061E8;border-color:#B061E8;}
.row.neup > .nm{background:#D6E7F4 !important;} /* neu eingeladene Person: hellblau, bis sie in ihren Block gezogen wird */
.sallein{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);cursor:pointer;} .sallein input{accent-color:#2E9BF0;} /* violett: allein gewollt, aber trotzdem Mithilfe eingeteilt */
.rdot.halb{border-width:1.5px;box-shadow:0 0 0 1px #fff;}
.rdot.ph{background:#C3C8CE;opacity:0;transition:opacity .1s;}
.rdot.ph.klick:hover{opacity:1;} /* Platzhalter nur unter der Maus zeigen, nicht in der ganzen Zeile (Text bleibt lesbar) */
.rdot.klick{pointer-events:auto;cursor:pointer;}
.rdot.klick:hover,.rdot.wahl{transform:scale(1.45);}
.rdot.wahl{outline:1.5px solid var(--primary);outline-offset:1px;opacity:1;}
.bdot{position:absolute;top:0;width:7px;height:7px;border-radius:50%;background:#2F6F9F;border:1px solid #fff;z-index:3;pointer-events:none;}
.planwrap{display:flex;}
.planwrap .tlcol{flex:1;min-width:0;display:flex;flex-direction:column;}
.tltop{overflow-x:auto;overflow-y:hidden;height:auto;min-height:14px;flex:none;background:#fff;border-top:1px solid var(--line);}
.tltop > div{height:1px;}
.tltop + .tl{border-top:0;height:calc(100vh - 214px);}
/* Arbeitsvorrat oben: eigene Achse (Wochen 1, 2, 3 …), eigener Scroll, Balken stapeln sich selber */
.vorrat{display:flex;flex:none;background:#fff;border-top:1px solid var(--line);}
.vnm{width:170px;flex:none;box-sizing:border-box;border-right:1px solid var(--line);background:#F5F7F9;padding:6px 8px;display:flex;flex-direction:column;gap:5px;font-size:12px;color:#6B7079;}
.vorrat.zu .vnm{flex-direction:row;align-items:center;width:auto;border-right:0;background:#fff;padding:3px 8px;}
.vtog{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;color:#323E4E;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;} .vtog .i{width:13px;height:13px;}
.vsum{font-variant-numeric:tabular-nums;} .vleg{display:flex;align-items:center;gap:5px;font-size:11px;} .vleg i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-left:4px;}
.vneu{align-self:flex-start;padding:2px 8px!important;height:24px!important;font-size:12px!important;}
.vsc{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;}
/* Vorrat unter dem Gruppentitel: bleibt beim Scrollen des Plans links stehen, eigener Scroll */
.row.vrow > .vorrat{position:sticky;left:calc(var(--namew) + var(--rand, 16px) + 1px);margin-left:calc(var(--rand, 16px) + 1px);border-top:0;}
.row.vrow > .nm{font-size:10.5px;color:#4C5C70;font-weight:700;text-transform:uppercase;letter-spacing:.04em;align-items:flex-start;padding-top:2px;}
.vorrat.drop{background:#F2F5D6;box-shadow:inset 0 0 0 2px var(--primary);}
.vin{position:relative;}
.vw{position:absolute;top:1px;height:14px;line-height:14px;font-size:10.5px;font-weight:700;color:#323E4E;padding-left:4px;box-sizing:border-box;}
.vt{position:absolute;top:1px;height:14px;line-height:14px;font-size:9.5px;color:#8B9097;text-align:center;}
.vwl{position:absolute;top:0;bottom:0;width:0;border-left:1px solid #DCE1E6;}

<script>
(function(){
const $ = id => document.getElementById(id);
const SUPABASE_URL = 'https://oalapdxinqlnzwxhyuzy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_DoeD4uEnwemmnFu4AxE9uw_5lmQYc5P';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const ROLLE_LABEL = { admin: 'Admin', buero_team: 'Büro-Team', mitarbeitende: 'Mitarbeitende', service_team: 'Service-Team' };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// ?eingebettet = Widget auf der Startseite: nur der Plan in der Wochenansicht, nur ansehen, Einstellungen bleiben unverändert
const EINGEBETTET = new URLSearchParams(location.search).has('eingebettet');
if(EINGEBETTET) document.documentElement.classList.add('ep-eingebettet');
// Farben im Widget: meine = nur eigene Einsätze farbig, alle = wie im Planer, aus = alles nur mit Rahmen
let EFARBE = new URLSearchParams(location.search).get('farbe') || 'meine';
const pad = n => String(n).padStart(2, '0');
const lsGet = (k, d) => { try { const v = localStorage.getItem('ep_' + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } };
const lsSet = (k, v) => { try { localStorage.setItem('ep_' + k, JSON.stringify(v)); } catch(e){} };

// ---------------------------------------------------------------------------
// Meldungen (mit «Rückgängig»)
// ---------------------------------------------------------------------------
function toast(msg, undo, isErr){
  const t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : '');
  t.innerHTML = `<span>${esc(msg)}</span>`;
  // undo = Funktion («Rückgängig») oder Liste [{ l: Beschriftung, fn }] für mehrere Knöpfe
  if(undo) (Array.isArray(undo) ? undo : [{ l: 'Rückgängig', fn: undo }]).forEach(k => { const b = document.createElement('button'); b.textContent = k.l; b.onclick = () => { t.remove(); k.fn(); }; t.appendChild(b); });
  $('toastwrap').appendChild(t);
  setTimeout(() => t.remove(), undo ? 10000 : isErr ? 6000 : 2200);
}
const fehler = (e, was) => { console.error(e); toast((was ? was + ': ' : '') + (e?.message || 'Unbekannter Fehler'), null, true); };

// ---------------------------------------------------------------------------
// Login / Rollen
// ---------------------------------------------------------------------------
let ROLLE = null, ME = null;
const isBuero = () => ROLLE === 'admin' || ROLLE === 'buero_team';
function zeigeNur(id){ ['loginwrap','pendingWrap','appMain'].forEach(x => $(x).classList.toggle('hidden', x !== id)); }
async function pruefeAnmeldung(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ zeigeNur('loginwrap'); return; }
  ME = session.user.id;
  const { data: b } = await sb.from('benutzer').select('rolle,email,anzeigename').eq('id', ME).maybeSingle();
  if(!b || !b.rolle){ zeigeNur('pendingWrap'); return; }
  ROLLE = b.rolle;
  if(window.KG && KG.ladeRechte) await KG.ladeRechte(); // Gruppen & Rechte (kg-stil.js) für canEdit
  $('userbar').classList.remove('hidden');
  $('userbarText').textContent = `${b.anzeigename || b.email} (${ROLLE_LABEL[b.rolle] || b.rolle})`;
  $('subnav').classList.remove('hidden');
  document.querySelectorAll('#subnav .buero').forEach(a => a.classList.toggle('hidden', !isBuero()));
  zeigeNur('appMain');
  await ladeAlles();
  await starteLive();
  route();
}
$('loginBtn').addEventListener('click', async () => {
  const st = $('loginStatus'); st.textContent = 'Melde an …'; st.className = 'status';
  const { error } = await KG.anmelden(sb, { email: $('loginEmail').value.trim(), password: $('loginPassword').value });
  if(error){ st.textContent = 'Login fehlgeschlagen: ' + error.message; st.className = 'status err'; return; }
  await pruefeAnmeldung();
});
$('loginPassword').addEventListener('keydown', e => { if(e.key === 'Enter') $('loginBtn').click(); });
$('logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });
$('pendingLogoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

// ---------------------------------------------------------------------------
// Zeitachse: 1 Einheit = 1 Tag, jeder Tag zeigt 06:00–18:00.
// Halbtage: Vormittag 06–12, Nachmittag 12–18. Tag-Index ab D0 (Montag).
// ---------------------------------------------------------------------------
const heute = new Date(); heute.setHours(0,0,0,0);
const D0 = new Date(heute); D0.setDate(D0.getDate() - ((D0.getDay() + 6) % 7) - 7 * 8);
const NDAYS = 7 * 70;
const dDate = i => new Date(D0.getFullYear(), D0.getMonth(), D0.getDate() + i);
const dayIdx = dt => Math.round((Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()) - Date.UTC(D0.getFullYear(), D0.getMonth(), D0.getDate())) / 864e5);
const TODAY = dayIdx(heute);
const toU = ts => { const t = new Date(ts); const h = t.getHours() + t.getMinutes() / 60; return dayIdx(t) + Math.max(0, Math.min(1, (h - 6) / 12)); };
function fromU(u, isEnd){ let d = Math.floor(u + 1e-9), f = u - d; if(isEnd && f < 1e-9){ d -= 1; f = 1; } const x = dDate(d); x.setHours(0, Math.round((6 + f * 12) * 60), 0, 0); return x.toISOString(); }
const isoDate = d => { const x = dDate(d); return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`; };
const fromIso = s => { const [y,m,d] = s.split('-').map(Number); return dayIdx(new Date(y, m-1, d)); };
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'], WDL = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MON = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'], MONL = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function kw(d){ const x = dDate(d); const t = new Date(Date.UTC(x.getFullYear(), x.getMonth(), x.getDate())); const w = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - w); const j = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - j) / 864e5 + 1) / 7); }
const tStr = h => { const m = Math.round(h * 60); return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
const hOf = (u, d) => tStr(6 + (u - d) * 12);
const dLab = d => { const x = dDate(d); return `${WD[x.getDay()]} ${x.getDate()}.${x.getMonth()+1}.`; };
const fmtN = n => String(Math.round(n * 10) / 10).replace('.', ',');
const tageTxt = n => `${fmtN(n)} ${Math.abs(n - 1) < 1e-6 ? 'Tag' : 'Tage'}`;
const r48 = u => Math.round(u * 48) / 48;

// ---------------------------------------------------------------------------
// Daten
// ---------------------------------------------------------------------------
let ABL = [], ABLAGE = !!lsGet('ablage', false); // Ablage-Zeilen unter jeder Gruppe (Knopf oben links, gemerkt im Browser)
let INFO = new Map(); // wichtige Info pro Termin und Tag: «einsatz_id|JJJJ-MM-TT» -> Zeile

function vorratLage(ber, gid){
  const items = VOR.filter(v => (v.bereich || 'bau') === ber).map(v => ({ v, n: vTage(v) }))
    .concat(gid ? PROV.filter(p => p.lane === 'g:' + gid).sort((a, b) => a.mon - b.mon).map(p => ({ p, n: Math.max(.25, Math.round(p.min / 60 / 8 * 4) / 4, 72 / dayW) })) : []); // Pflege-Vorschläge mind. 72 px breit: lesbar, hintereinander statt übereinander
  // Pflege: der Reihe nach 3 Wochen (15 Arbeitstage) pro Zeile, dann neue Zeile; unter jeder Zeile eine leere (Luft)
  if(ber === 'pflege'){ let z = 0, a = 0; const L = items.map(x => { if(a > 1e-9 && a + x.n > 15 + 1e-9){ z++; a = 0; } const o = { ...x, z: 2 * z, a }; a += x.n; return o; }); return { R: 2 * (z + 1), L }; }
  const R = Math.min(VZ, Math.max(1, items.length)), ende = new Array(R).fill(0);
  return { R, L: items.map(x => { let z = 0; for(let i = 1; i < R; i++) if(ende[i] < ende[z] - 1e-9) z = i; const a = ende[z]; ende[z] = a + x.n; return { ...x, z, a }; }) };

// Vorrat-Block (Zeile unter dem Gruppentitel): eigene Achse Woche 1, 2, 3 … ohne Datum, eigener Scroll, bleibt beim Scrollen des Plans stehen
function vorratBlock(ber, gid, lab){

    const st = []; for(let q = Math.floor(a / 5 + 1e-9); q * 5 < a + n - 1e-9; q++) st.push([Math.max(a, 5 * q), Math.min(a + n, 5 * q + 5)]);

// Lieferwagen zuteilen: sofort sichtbar (ohne auf das Neuladen zu warten), gleicher Wagen nie doppelt bei derselben Person

      fetchAll(() => sb.from('wissen_service').select('id,eintrag_id,arbeit,kws,zeit,wer,im_planer,wichtig,erstellt_am,aus_jahre').eq('im_planer', true)),

  const nowMon = base - ((dDate(base).getDay() + 6) % 7), yB = dDate(nowMon + 3).getFullYear();

    const ab = s.erstellt_am ? dayIdx(new Date(s.erstellt_am)) : null, seit = ab == null ? -Infinity : ab - (dDate(ab).getDay() + 6) % 7;
    for(const y of [yB - 1, yB, yB + 1]) if(!(s.aus_jahre || []).includes(y)) for(const w of s.kws){
      // zurück: wichtig bis ein Jahr, sonst ein halbes Jahr – aber nie vor der Erfassung der Arbeit (sonst wäre beim Start jeder Jahresservice vom Vorjahr «überfällig»)
      const mon = kwMonday(y, w); if(kw(mon) !== w || mon >= NDAYS || mon < Math.max(nowMon - 7 * (s.wichtig ? 52 : 26), seit)) continue;

function openAbmachen(q, anchor){ // q = { it } (Einsatz) oder { pid } (Pflege-Vorschlag)

  else { p = PROV.find(x => x.id === q.pid); if(!p) return; const L = Object.values(PROVLAY).flat().find(x => x.p === p); if(!L) return;
    s = L.s; e = L.e; if(p.lane.startsWith('g:')) gid = p.lane.slice(2); else mid = p.lane.slice(2); pl = VNOT[p.id]?.pl || null; titel = kName(KUNDEN[p.kid]); }

  if(mid && !pers.some(x => x.id === mid)) mid = null;
  const multi = e - s > 1 + 1e-6, d0 = Math.floor(s + 1e-9), d1 = Math.ceil(e - 1e-9) - 1, fs = s - d0, fe = e - d1;

  pop.classList.add('abmp');

function wdhFrage(titel, fn){

function wdhVerschieben(o, neu){
  const m = o.rep ? byId(o.rep) : o; if(!m || !m.wdh) return; const tag = wdhTag(o), d0 = Math.floor(m.s + 1e-9);

      await neuerEinsatz({ ...wdhFelder(m), mid: neu.mid, s: neu.s, e: neu.e }, false); await neuLaden(); toast('Nur dieser Termin verschoben'); return; }
    const delta = Math.floor(neu.s + 1e-9) - tag;
    const r = { ...m.wdh, aus: (m.wdh.aus || []).filter(x => fromIso(x) > tag).map(x => isoDate(fromIso(x) + delta)) };
    if(r.u === 'w' && r.days) r.days = r.days.map(x => ((x + delta) % 7 + 7) % 7);
    if(tag === d0){ // ab dem ersten Termin = ganze Serie verschieben
      const { error } = await sb.from('planer_einsatz').update({ beginn: fromU(neu.s), ende: fromU(neu.e, true), person_id: neu.mid, wdh: r }).eq('id', m.id);
      if(error) return fehler(error, 'Verschieben'); await neuLaden(); toast('Ganze Serie verschoben'); return; }
    if(r.ende === 'anzahl'){ const vorher = 1 + wdhTage(m, true).filter(x => x.d < tag).length; r.anzahl = Math.max(1, (m.wdh.anzahl || 1) - vorher); }

    await neuerEinsatz({ ...wdhFelder(m), mid: neu.mid, s: neu.s, e: neu.e, wdh: r }, false); await neuLaden(); toast('Ab diesem Termin verschoben');
  });
}
async function wdhLoeschen(o, art){

const mChefIt = (h, its) => its.find(m => m.mid === h.mp && m.kind !== 'hilfe' && m.kind !== 'absenz' && mUeber(m, h)) || byId(h.link);
const mHelfer = (it, its) => its.filter(h => h.kind === 'hilfe' && h.mid !== it.mid && (h.link === it.id || (h.mp === it.mid && mUeber(h, it))));

function mIch(d){

    const haupt = it.kind === 'hilfe' ? mChefIt(it, its) : it, k = haupt && KUNDEN[haupt.kid];
    const leute = it.kind === 'hilfe' ? [it.mp, ...its.filter(h => h.kind === 'hilfe' && h.mp === it.mp && h.mid !== it.mid && mUeber(h, it)).map(h => h.mid)]

function mTeam(d){

  its.filter(i => i.kind !== 'hilfe' && i.kind !== 'absenz').sort((a, b) => a.s - b.s).forEach(it => {

    if(!gruppen.has(key)) gruppen.set(key, []); gruppen.get(key).push(it); });
  // Mithilfen ohne passenden Haupteinsatz: eigene Zeile «Mithilfe bei …»
  its.filter(h => h.kind === 'hilfe' && !mChefIt(h, its)).forEach(h => los.push(h));
  let h = [...gruppen.values()].map(g => { const it = g[0], k = KUNDEN[it.kid];
    const chefs = istAllg(it.mid) ? [] : [...new Set(g.map(x => x.mid))], hel = [...new Set(g.flatMap(x => mHelfer(x, its)).map(x => x.mid))].filter(m => !chefs.includes(m));

  const rest = [...abs.entries()].map(([t, l]) => `<div class="mr"><span>${esc(t)}</span>${esc([...new Set(l)].map(mVn).join(', '))}</div>`).join('')

  return (h || '') + (rest ? `</div><div class="m-liste m-rest">${rest}` : '');
}

// Sprechen: Spracherkennung des Browsers (Chrome / Safari); sonst Mikrofon der Handy-Tastatur
let diktat = null;
function diktiere(inp){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('Sprechen: bitte das Mikrofon auf der Tastatur verwenden.'); return; }
  try{ diktat?.stop(); }catch(e){}
  const r = new SR(); diktat = r; r.lang = 'de-CH'; r.interimResults = true; r.continuous = false;
  const vorher = inp.value ? inp.value + ' ' : ''; inp.classList.add('hoert');
  r.onresult = e => { inp.value = vorher + [...e.results].map(x => x[0].transcript).join(''); };
  r.onerror = e => { inp.classList.remove('hoert'); if(e.error === 'not-allowed') toast('Mikrofon ist nicht erlaubt. Bitte im Browser freigeben oder das Mikrofon der Tastatur verwenden.', null, true); };

}

    const line = document.createElement('div'); line.className = 'dropline'; line.hidden = true; document.body.appendChild(line); row.classList.add('rdrag'); let ziel = null;
    const mv = ev => { ziel = null; line.hidden = true;
      const t = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('[data-rrow]'); if(!t || t === row || t.closest('.card') !== card) return;
      const rc = t.getBoundingClientRect(), vor = ev.clientY < rc.top + rc.height / 2; ziel = { id: t.dataset.rrow, vor };
      line.style.cssText = `left:${rc.left}px;width:${rc.width}px;top:${(vor ? rc.top : rc.bottom) - 1}px`; line.hidden = false; };
    const up = async () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); line.remove(); row.classList.remove('rdrag'); if(!ziel) return;
      const l = RES.filter(x => x.typ === r.typ && x.id !== r.id).sort((a, b) => a.sortierung - b.sortierung || resName(a).localeCompare(resName(b)));
      const i = l.findIndex(x => x.id === ziel.id); l.splice(ziel.vor ? i : i + 1, 0, r);
      const { error } = (await Promise.all(l.map((x, k) => sb.from('planer_ressource').update({ sortierung: (k + 1) * 10 }).eq('id', x.id)))).find(x => x.error) || {};
      if(error) fehler(error, 'Sortieren'); await neuLaden(); };
    addEventListener('pointermove', mv); addEventListener('pointerup', up); }));
}
// Stamm-Fahrer eines Lieferwagens (alles andere im Nachschlagewerk)
function resDlg(r){
  if(!r || r.typ !== 'fahrzeug') return;
  const d = document.createElement('div'); d.className = 'dlg';
  d.innerHTML = `<div class="in"><div style="display:flex;align-items:center"><b style="font-size:15px">${esc(resName(r))}</b><button class="icon-btn" id="rX" style="margin-left:auto" aria-label="Schliessen">${I('x')}</button></div>
    <div class="fld"><label>Stamm-Fahrer</label><select id="rS"><option value="">Kein Stamm-Fahrer (Pool)</option>${PERSONEN.filter(p => p.aktiv).map(p => `<option value="${p.id}"${p.id === r.stamm_person_id ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</select><span class="small muted">Gehört an allen Arbeitstagen zu dieser Person, ausser bei Absenz oder Freigabe.</span></div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-ghost" id="rNo">Abbrechen</button><button class="btn btn-primary" id="rOk">Speichern</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector('#rX').onclick = d.querySelector('#rNo').onclick = () => d.remove();
  d.querySelector('#rOk').onclick = async () => {
    const { error } = await sb.from('planer_ressource').update({ stamm_person_id: d.querySelector('#rS').value || null }).eq('id', r.id);
    if(error) return fehler(error, 'Speichern'); d.remove(); await neuLaden(); toast('Gespeichert');
  };
}

// ---------------------------------------------------------------------------
// FEIERTAGE
// ---------------------------------------------------------------------------
function renderFeiertage(){
  const l = [...FEIER.entries()].sort((a, b) => a[0] - b[0]);
  $('appMain').innerHTML = `<div class="page"><h2>Feiertage &amp; Betriebsferien</h2><p class="hint">An diesen Tagen werden mehrtägige Einsätze automatisch unterbrochen und nicht als Arbeitstage gezählt.</p>
    <div class="card" style="margin-top:12px;padding:6px 4px"><table class="ft">${l.map(([d, n]) => `<tr><td style="width:150px">${dLab(d)} ${dDate(d).getFullYear()}</td><td>${esc(n)}</td><td style="width:40px"><button class="icon-btn danger" data-fx="${isoDate(d)}" aria-label="Löschen">${I('trash')}</button></td></tr>`).join('') || '<tr><td class="muted">Keine</td></tr>'}</table></div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><input type="date" id="fD"><input type="text" id="fN" placeholder="Name, z. B. Betriebsferien"><button class="btn btn-primary" id="fAdd">${I('plus')}Hinzufügen</button></div>
    <p class="hint" style="margin-top:6px">Betriebsferien über mehrere Tage: jeden Tag einzeln eintragen (Wochenenden nicht nötig).</p></div>`;
  $('fAdd').onclick = async () => { const d = $('fD').value, n = $('fN').value.trim(); if(!d || !n){ toast('Datum und Name eingeben.', null, true); return; } const { error } = await sb.from('planer_feiertag').upsert({ datum: d, name: n }); if(error) return fehler(error); await neuLaden(); };
  document.querySelectorAll('[data-fx]').forEach(b => b.onclick = async () => { const { error } = await sb.from('planer_feiertag').delete().eq('datum', b.dataset.fx); if(error) return fehler(error); await neuLaden(); });
  // Absenz-Typen mit Grauton
  const box = document.createElement('div'); box.className = 'page'; box.style.paddingTop = '0';
  box.innerHTML = `<h2>Absenz-Typen</h2><p class="hint">Jeder Typ bekommt einen von sechs gut unterscheidbaren Grautönen, auf Wunsch gestreift. Der Typ steht auch als Text auf dem Balken. Beim Eintragen: ziehen, 4 drücken, dann die Nummer des Typs.</p>
    <div class="card" style="margin-top:12px;padding:4px 14px">${ABST.map((t, i) => `<div class="abrow"><b class="small muted">${i + 1}</b><input type="text" data-an="${t.id}" value="${esc(t.name)}" aria-label="Name">
      <div class="greys">${GREYS.map((c, j) => `<button data-ag="${t.id}" data-g="${j}" class="${t.grauton === j ? 'on' : ''}" style="background:${c}" aria-label="Grauton ${j + 1}"></button>`).join('')}<button data-as="${t.id}" class="stp${t.gestreift ? ' on' : ''}" title="gestreift" aria-label="gestreift"></button></div>
      <span class="prev" style="background:${absStyle(t.name).bg};color:${absStyle(t.name).fg}">${esc(t.name)}</span>
      <span class="acts"><button class="icon-btn" data-au="${t.id}" aria-label="Nach oben" ${i === 0 ? 'disabled' : ''}>${I('up')}</button><button class="icon-btn danger" data-ax="${t.id}" aria-label="Löschen">${I('trash')}</button></span></div>`).join('')}</div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><input type="text" id="aNeu" placeholder="Neuer Typ, z. B. Weiterbildung"><button class="btn btn-primary" id="aAdd">${I('plus')}Hinzufügen</button></div>`;
  $('appMain').appendChild(box);
  const upd = async (id, row) => { const { error } = await sb.from('planer_absenz_typ').update(row).eq('id', id); if(error) return fehler(error); await neuLaden(); };
  box.querySelectorAll('[data-ag]').forEach(b => b.onclick = () => upd(b.dataset.ag, { grauton: +b.dataset.g }));
  box.querySelectorAll('[data-as]').forEach(b => b.onclick = () => upd(b.dataset.as, { gestreift: !ABST.find(t => t.id === b.dataset.as).gestreift }));
  box.querySelectorAll('[data-an]').forEach(i => i.onchange = () => { const n = i.value.trim(); if(n) upd(i.dataset.an, { name: n }); });
  box.querySelectorAll('[data-au]').forEach(b => b.onclick = async () => { const l = [...ABST]; const k = l.findIndex(t => t.id === b.dataset.au); if(k < 1) return; [l[k - 1], l[k]] = [l[k], l[k - 1]]; await Promise.all(l.map((t, j) => sb.from('planer_absenz_typ').update({ sortierung: (j + 1) * 10 }).eq('id', t.id))); await neuLaden(); });
  box.querySelectorAll('[data-ax]').forEach(b => b.onclick = async () => { const { error } = await sb.from('planer_absenz_typ').delete().eq('id', b.dataset.ax); if(error) return fehler(error); await neuLaden(); });
  $('aAdd').onclick = async () => { const n = $('aNeu').value.trim(); if(!n) return; const { error } = await sb.from('planer_absenz_typ').insert({ name: n, grauton: 2, sortierung: 10 + Math.max(0, ...ABST.map(t => t.sortierung)) }); if(error) return fehler(error); await neuLaden(); };
}

// ---------------------------------------------------------------------------
// Live-Abgleich: Änderungen anderer erscheinen sofort
// ---------------------------------------------------------------------------
let reloadT = null;
async function neuLaden(){ await ladeAlles(); if(drag) return; if(boardRef) renderBoard(); if(VIEW === 'plan'){ renderRows(); renderChips(); renderAuf(); if(selId && !byId(selId)) closePanel(); } else render(); }
async function starteLive(){
  // Live-Verbindung braucht das Login-Ticket, sonst gilt sie als anonym und die Rechte filtern alles weg
  const { data: { session } } = await sb.auth.getSession(); if(session) await sb.realtime.setAuth(session.access_token);
  sb.auth.onAuthStateChange((ev, s) => { if(s && (ev === 'TOKEN_REFRESHED' || ev === 'SIGNED_IN')) sb.realtime.setAuth(s.access_token); });
  const ch = sb.channel('einsatzplaner');
  ['planer_einsatz', 'planer_person', 'planer_gruppe', 'planer_feiertag', 'planer_ressource', 'planer_ressource_einsatz', 'planer_magazin', 'planer_pendenz', 'planer_absenz_typ', 'planer_vorschlag_notiz'].forEach(t =>
    ch.on('postgres_changes', { event: '*', schema: 'public', table: t }, () => { clearTimeout(reloadT); reloadT = setTimeout(() => { if(drag){ reloadT = setTimeout(neuLaden, 800); return; } if(document.activeElement && ($('side').contains(document.activeElement) || document.activeElement.closest?.('.mdet,.maddln'))) return; neuLaden(); }, 500); }));
  ch.subscribe();
  // Beim Zurückkommen auf die Seite (Handy entsperrt) frisch laden
  document.addEventListener('visibilitychange', () => { if(!document.hidden) neuLaden(); });
}
let rzT; addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if(VIEW === 'plan'){ const c = centerU(); dayW = calcDayW(); renderRows(); scrollToU(c, 'center'); } }, 200); });

pruefeAnmeldung();
})();
