<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Tool A (live) – Aushub-Berechnung</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg:#F5F7F9; --card:#FFFFFF; --primary:#323E4E; --primary-l:#4C5C70;
  --ink:#232B35; --muted:#8B9097; --line:#E1E5E9; --soft:#EEF3F7;
  --accent-blue:#D6E7F4; --accent-lime:#D1DB5F;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--ink);line-height:1.4;font-size:13px;}
.proto{background:#20262E;color:#c7ccd1;padding:8px 0;font-size:12px;}
.proto .wrap{max-width:1200px;margin:0 auto;padding:0 16px;}
.proto b{color:#fff;font-weight:600;}
.wrap{max-width:900px;margin:0 auto;padding:0 16px;}
main{padding:18px 0 60px;}

.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:14px;}
.cardlabel{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:12px;}
.bauteiltitle{font-size:21px;font-weight:800;color:var(--primary);margin-bottom:10px;}

.offergrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:10px;}
.fld label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;}
.fld select, .fld input{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;font:inherit;font-size:13px;color:var(--ink);}
.fld select:focus, .fld input:focus{outline:none;border-color:var(--primary);}
.savebtn{font-size:13px;font-weight:700;color:#fff;background:var(--primary);border:none;border-radius:7px;
  padding:9px 16px;cursor:pointer;}
.savebtn:hover{background:var(--primary-l);}
.savebtn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;}

/* Teilbereich-Karte */
.tbcard{background:var(--card);border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden;}
.tbhead{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--primary);color:#fff;}
.tbname{font-size:12px;font-weight:700;color:#fff;}
.tbbody{padding:12px 14px 8px;}
.dimsrow{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:4px;}
.tbdim label{display:block;font-size:10px;color:var(--muted);margin-bottom:3px;white-space:nowrap;}
.tbdim input{width:80px;border:1px solid var(--line);border-radius:6px;padding:6px 7px;font:inherit;font-size:12.5px;color:var(--ink);}
.tbdim input:focus{outline:none;border-color:var(--primary);}

.afblock{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
.afblock label.flabel{display:block;font-size:11.5px;font-weight:700;color:var(--ink);margin-bottom:6px;}
.optrow{display:flex;gap:6px;flex-wrap:wrap;}
.opt{font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:7px;padding:6px 12px;cursor:pointer;}
.opt.on{background:var(--primary);color:#fff;border-color:var(--primary);}

.costwrap{margin-top:14px;transition:background-color .1s;border-radius:8px;}
.costwrap.flash{animation:flashfade .7s ease-out;}
@keyframes flashfade{from{background-color:var(--accent-blue);}to{background-color:transparent;}}
table.cost{width:100%;border-collapse:collapse;font-size:12px;}
table.cost thead th{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
  text-align:left;padding:0 8px 6px 0;font-weight:700;}
tr.cgrouphead td{font-size:11px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.03em;
  padding:12px 0 5px;border-bottom:1px solid var(--line);}
tr.crow td{padding:6px 8px 6px 0;border-bottom:1px solid var(--soft);vertical-align:middle;}
td.cbetrag{font-weight:700;text-align:right;white-space:nowrap;color:var(--ink);}
tr.csubtotal td{padding:6px 0;font-size:11.5px;color:var(--ink);border-top:1px solid var(--line);}
tr.csubtotal td:first-child{font-weight:600;}
tr.csubtotal .csubval{font-weight:700;text-align:right;white-space:nowrap;}
tr.ctotalrow td{padding:12px 0 4px;font-size:15px;font-weight:800;color:var(--primary);border-top:2px solid var(--line);}
tr.ctotalrow .ctotalval{text-align:right;white-space:nowrap;}
tr.cdescrow td{padding:2px 0 10px;}
.descblock{width:100%;min-height:44px;font:inherit;font-size:11.5px;color:var(--ink);line-height:1.5;
  background:var(--soft);border:1px solid transparent;border-radius:7px;padding:9px 11px;resize:vertical;}
.descblock:hover{border-color:var(--line);}
.descblock:focus{outline:none;border-color:var(--primary);background:#fff;}

.status{font-size:11px;color:var(--muted);margin-top:8px;}
.status.err{color:#B4655F;}
.status.ok{color:#3d7a3d;}
</style>
</head>
<body>
<div class="proto"><div class="wrap"><b>LIVE</b> Tool A – rechnet gegen die echte Supabase-Pilot-Kette, kein Mockup.</div></div>

<main class="wrap">

  <div class="card">
    <div class="cardlabel">Kunde &amp; Offerte</div>
    <div class="offergrid">
      <div class="fld">
        <label>Gespeicherte Offerte laden</label>
        <select id="offerteSelect"><option value="">+ Neue Offerte</option></select>
      </div>
    </div>
    <div class="offergrid" id="newOfferFields">
      <div class="fld"><label>Kunde</label><input id="kundeName" placeholder="z.B. Familie Muster"></div>
      <div class="fld"><label>Offerte-Titel</label><input id="offerteTitel" value="Pool - Neubau"></div>
    </div>
    <button class="savebtn" id="saveBtn">Offerte speichern</button>
    <div class="status" id="saveStatus"></div>
  </div>

  <div class="card">
    <div class="bauteiltitle">Poolbecken</div>

    <div class="tbcard">
      <div class="tbhead"><span class="tbname">Teilbereich 1</span></div>
      <div class="tbbody">
        <div class="dimsrow" id="geofields"><!-- per JS befuellt --></div>
        <div id="auswahlfelder"><!-- per JS befuellt --></div>
      </div>
    </div>

    <div class="costwrap" id="costwrap">
      <table class="cost">
        <thead><tr><th>Bezeichnung</th><th>Menge</th><th></th><th>Preis</th><th>Betrag</th></tr></thead>
        <tbody id="costbody"><tr><td colspan="5">Lade Daten …</td></tr></tbody>
        <tfoot><tr class="ctotalrow"><td colspan="4">Total Poolbecken</td><td class="ctotalval" id="total">–</td></tr></tfoot>
      </table>
    </div>
    <div class="status" id="status"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://oalapdxinqlnzwxhyuzy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_DoeD4uEnwemmnFu4AxE9uw_5lmQYc5P';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $status = document.getElementById('status');
const $costbody = document.getElementById('costbody');
const $total = document.getElementById('total');
const $costwrap = document.getElementById('costwrap');
const $geofields = document.getElementById('geofields');
const $auswahlfelder = document.getElementById('auswahlfelder');
const $offerteSelect = document.getElementById('offerteSelect');
const $newOfferFields = document.getElementById('newOfferFields');
const $kundeName = document.getElementById('kundeName');
const $offerteTitel = document.getElementById('offerteTitel');
const $saveBtn = document.getElementById('saveBtn');
const $saveStatus = document.getElementById('saveStatus');

const KAT_LABEL = { personal:'Personalaufwand', maschine:'Maschinenaufwand', logistik:'Logistik, Transporte', material:'Materialaufwand' };
const KAT_ORDER = ['personal','maschine','logistik','material'];
const START_WERTE = { 'Poollaenge': 8, 'Poolbreite': 4, 'Beckentiefe': 1.5 };

const fmtCHF = n => n.toLocaleString('de-CH', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' CHF';

let offertentypId = null;
let auswahlfelder = [];       // [{id,name,mehrfachauswahl,optionen:[{id,name}]}]
let selectedOptions = new Set();
let eingabefelder = [];       // [{id,name,einheit}]
let ressourcenzeilen = [];    // [{optionId, arbeitsschritt, kategorie, bezeichnung, einheit, preis, menge_ausdruck}]
let werteMap = {};

function renderAuswahlfelder(){
  $auswahlfelder.innerHTML = '';
  auswahlfelder.forEach(af => {
    const div = document.createElement('div');
    div.className = 'afblock';
    div.innerHTML = `<label class="flabel">${af.name}</label>
      <div class="optrow">${af.optionen.map(o => `<button type="button" class="opt ${selectedOptions.has(o.id)?'on':''}" data-opt="${o.id}" data-af="${af.id}" data-multi="${af.mehrfachauswahl}">${o.name}</button>`).join('')}</div>`;
    $auswahlfelder.appendChild(div);
  });
  $auswahlfelder.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => {
      const optId = btn.dataset.opt;
      const afId = btn.dataset.af;
      const multi = btn.dataset.multi === 'true';
      if(!multi){
        auswahlfelder.find(a => a.id === afId).optionen.forEach(o => selectedOptions.delete(o.id));
        selectedOptions.add(optId);
      }else{
        if(selectedOptions.has(optId)) selectedOptions.delete(optId); else selectedOptions.add(optId);
      }
      renderAuswahlfelder();
      recalc();
    });
  });
}

function flash(){
  $costwrap.classList.remove('flash');
  void $costwrap.offsetWidth; // reflow, damit die Animation neu startet
  $costwrap.classList.add('flash');
}

function renderGeofields(){
  $geofields.innerHTML = '';
  eingabefelder.forEach(ef => {
    const div = document.createElement('div');
    div.className = 'tbdim';
    div.innerHTML = `<label>${ef.name} (${ef.einheit})</label>
      <input type="number" step="0.01" value="${werteMap[ef.id]}" data-ef="${ef.id}">`;
    $geofields.appendChild(div);
  });
  $geofields.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', () => {
      werteMap[inp.dataset.ef] = parseFloat(inp.value) || 0;
      recalc();
    });
  });
}

async function loadOfferteListe(){
  const { data, error } = await sb
    .from('offerte')
    .select('id, titel, datum, kunde(name)')
    .eq('offertentyp_id', offertentypId)
    .order('datum', { ascending:false });
  if(error){ console.error(error); return; }
  $offerteSelect.innerHTML = '<option value="">+ Neue Offerte</option>' +
    data.map(o => `<option value="${o.id}">${o.kunde?.name || '?'} – ${o.titel} (${o.datum})</option>`).join('');
}

let mode = 'new';               // 'new' oder 'edit'
let currentOfferteId = null;
let currentTeilflaecheId = null;

function setMode(neu){
  mode = neu;
  if(mode === 'new'){
    $kundeName.disabled = false;
    $saveBtn.textContent = 'Offerte speichern';
    currentOfferteId = null;
    currentTeilflaecheId = null;
  }else{
    $kundeName.disabled = true;
    $saveBtn.textContent = 'Änderungen speichern';
  }
}

async function ladeBestehendeOfferte(offerteId){
  const { data: offerte, error: oErr } = await sb
    .from('offerte').select('id, titel, kunde(name)').eq('id', offerteId).single();
  if(oErr){ console.error(oErr); $saveStatus.textContent = 'Fehler beim Laden: ' + oErr.message; $saveStatus.className='status err'; return; }

  const { data: tf, error } = await sb
    .from('teilflaeche')
    .select('id, teilflaeche_eingabefeld_wert(eingabefeld_id, wert), teilflaeche_auswahl(option_id)')
    .eq('offerte_id', offerteId).limit(1).single();
  if(error){ console.error(error); $saveStatus.textContent = 'Fehler beim Laden: ' + error.message; $saveStatus.className='status err'; return; }

  (tf.teilflaeche_eingabefeld_wert || []).forEach(w => { werteMap[w.eingabefeld_id] = w.wert; });
  renderGeofields();
  selectedOptions = new Set((tf.teilflaeche_auswahl || []).map(a => a.option_id));
  renderAuswahlfelder();
  $kundeName.value = offerte.kunde?.name || '';
  $offerteTitel.value = offerte.titel;
  currentOfferteId = offerte.id;
  currentTeilflaecheId = tf.id;
  setMode('edit');
  await recalc();
  $saveStatus.textContent = 'Bestehende Offerte geladen - Masse/Auswahl aendern und "Änderungen speichern" klicken.';
  $saveStatus.className = 'status';
}

$offerteSelect.addEventListener('change', async () => {
  if($offerteSelect.value){
    await ladeBestehendeOfferte($offerteSelect.value);
  }else{
    setMode('new');
    eingabefelder.forEach(ef => { werteMap[ef.id] = START_WERTE[ef.name] ?? 0; });
    renderGeofields();
    waehleStandardOptionen();
    renderAuswahlfelder();
    $kundeName.value = '';
    $offerteTitel.value = 'Pool - Neubau';
    $saveStatus.textContent = '';
    await recalc();
  }
});

function waehleStandardOptionen(){
  selectedOptions = new Set();
  auswahlfelder.forEach(af => { if(af.optionen[0]) selectedOptions.add(af.optionen[0].id); });
}

async function speichereNeueOfferte(kundeNameVal, titelVal){
  const { data: kunde, error: kErr } = await sb.from('kunde').insert({ name: kundeNameVal }).select().single();
  if(kErr) throw kErr;

  const { data: offerte, error: oErr } = await sb.from('offerte')
    .insert({ kunde_id: kunde.id, offertentyp_id: offertentypId, titel: titelVal }).select().single();
  if(oErr) throw oErr;

  const { data: teilflaeche, error: tErr } = await sb.from('teilflaeche')
    .insert({ offerte_id: offerte.id, name: 'Teilbereich 1' }).select().single();
  if(tErr) throw tErr;

  const werteRows = eingabefelder.map(ef => ({
    teilflaeche_id: teilflaeche.id, eingabefeld_id: ef.id, wert: werteMap[ef.id]
  }));
  const { error: wErr } = await sb.from('teilflaeche_eingabefeld_wert').insert(werteRows);
  if(wErr) throw wErr;

  if(selectedOptions.size){
    const { error: aErr } = await sb.from('teilflaeche_auswahl')
      .insert([...selectedOptions].map(oid => ({ teilflaeche_id: teilflaeche.id, option_id: oid })));
    if(aErr) throw aErr;
  }

  $saveStatus.textContent = `Gespeichert (Offerte-ID ${offerte.id.slice(0,8)}…).`;
  await loadOfferteListe();
  $offerteSelect.value = offerte.id;
  currentOfferteId = offerte.id;
  currentTeilflaecheId = teilflaeche.id;
  setMode('edit');
}

async function speichereAenderungen(titelVal){
  const { error: oErr } = await sb.from('offerte').update({ titel: titelVal }).eq('id', currentOfferteId);
  if(oErr) throw oErr;

  const werteRows = eingabefelder.map(ef => ({
    teilflaeche_id: currentTeilflaecheId, eingabefeld_id: ef.id, wert: werteMap[ef.id]
  }));
  const { error: wErr } = await sb.from('teilflaeche_eingabefeld_wert')
    .upsert(werteRows, { onConflict: 'teilflaeche_id,eingabefeld_id' });
  if(wErr) throw wErr;

  const { error: delErr } = await sb.from('teilflaeche_auswahl').delete().eq('teilflaeche_id', currentTeilflaecheId);
  if(delErr) throw delErr;
  if(selectedOptions.size){
    const { error: aErr } = await sb.from('teilflaeche_auswahl')
      .insert([...selectedOptions].map(oid => ({ teilflaeche_id: currentTeilflaecheId, option_id: oid })));
    if(aErr) throw aErr;
  }

  $saveStatus.textContent = 'Änderungen gespeichert.';
  await loadOfferteListe();
  $offerteSelect.value = currentOfferteId;
}

$saveBtn.addEventListener('click', async () => {
  const kundeNameVal = $kundeName.value.trim();
  const titelVal = $offerteTitel.value.trim();
  if((mode === 'new' && !kundeNameVal) || !titelVal){
    $saveStatus.textContent = 'Bitte Kunde und Offerte-Titel ausfuellen.';
    $saveStatus.className = 'status err';
    return;
  }
  $saveBtn.disabled = true;
  $saveStatus.textContent = 'Speichere …';
  $saveStatus.className = 'status';
  try{
    if(mode === 'new'){
      await speichereNeueOfferte(kundeNameVal, titelVal);
    }else{
      await speichereAenderungen(titelVal);
    }
    $saveStatus.className = 'status ok';
  }catch(e){
    console.error(e);
    $saveStatus.textContent = 'Fehler beim Speichern: ' + (e.message || e);
    $saveStatus.className = 'status err';
  }finally{
    $saveBtn.disabled = false;
  }
});

async function init(){
  try{
    const { data: ot, error: otErr } = await sb
      .from('offertentyp').select('id').eq('name','Pool/Wasseranlagen').single();
    if(otErr) throw otErr;
    offertentypId = ot.id;

    const { data: efs, error: efErr } = await sb
      .from('eingabefeld').select('id,name,einheit').eq('offertentyp_id', ot.id);
    if(efErr) throw efErr;
    eingabefelder = efs;
    eingabefelder.forEach(ef => { werteMap[ef.id] = START_WERTE[ef.name] ?? 0; });
    renderGeofields();

    const { data: arbeitsschritte, error: asErr } = await sb
      .from('arbeitsschritt')
      .select(`id, name, reihenfolge,
        teilschritt ( id, name, beschreibung,
          auswahlfeld ( id, name, mehrfachauswahl,
            auswahloption ( id, name,
              ressourcenzeile ( id, kategorie, bezeichnung_override, preis_override, menge_ausdruck,
                artikel ( bezeichnung, einheit, vp_knecht ) ) ) ) )`)
      .eq('offertentyp_id', ot.id).order('reihenfolge');
    if(asErr) throw asErr;

    ressourcenzeilen = [];
    auswahlfelder = [];
    (arbeitsschritte || []).forEach(as => {
      (as.teilschritt || []).forEach(ts => {
        (ts.auswahlfeld || []).forEach(af => {
          auswahlfelder.push({
            id: af.id, name: af.name, mehrfachauswahl: af.mehrfachauswahl,
            optionen: (af.auswahloption || []).map(o => ({ id: o.id, name: o.name }))
          });
          (af.auswahloption || []).forEach(opt => {
            (opt.ressourcenzeile || []).forEach(rz => {
              ressourcenzeilen.push({
                optionId: opt.id,
                arbeitsschritt: as.name,
                kategorie: rz.kategorie,
                bezeichnung: rz.bezeichnung_override || rz.artikel?.bezeichnung || '(unbenannt)',
                einheit: rz.artikel?.einheit || '',
                preis: rz.preis_override ?? rz.artikel?.vp_knecht ?? 0,
                menge_ausdruck: rz.menge_ausdruck
              });
            });
          });
        });
      });
    });

    waehleStandardOptionen();
    renderAuswahlfelder();

    await loadOfferteListe();
    $status.textContent = 'Verbunden mit Supabase.';
    await recalc();
  }catch(e){
    console.error(e);
    $status.textContent = 'Fehler beim Laden: ' + (e.message || e);
    $status.classList.add('err');
  }
}

async function recalc(){
  try{
    const aktive = ressourcenzeilen.filter(rz => selectedOptions.has(rz.optionId));
    const results = await Promise.all(aktive.map(async rz => {
      const { data: menge, error } = await sb.rpc('eval_ausdruck', { node: rz.menge_ausdruck, werte: werteMap });
      if(error) throw error;
      return { ...rz, menge, betrag: menge * rz.preis };
    }));

    $costbody.innerHTML = '';
    let grandTotal = 0;

    function addRow(bezeichnung, menge, einheit, preis, betrag){
      grandTotal += betrag;
      const tr = document.createElement('tr');
      tr.className = 'crow';
      tr.innerHTML = `<td>${bezeichnung}</td><td style="text-align:right">${menge.toFixed(2)}</td>
        <td style="color:var(--muted)">${einheit}</td><td style="text-align:right">${fmtCHF(preis)}</td>
        <td class="cbetrag">${fmtCHF(betrag)}</td>`;
      $costbody.appendChild(tr);
    }

    KAT_ORDER.forEach(kat => {
      const zeilen = results.filter(r => r.kategorie === kat);
      if(!zeilen.length) return;
      const trHead = document.createElement('tr');
      trHead.className = 'cgrouphead';
      trHead.innerHTML = `<td colspan="5">${KAT_LABEL[kat]}</td>`;
      $costbody.appendChild(trHead);

      if(kat === 'personal'){
        // Personalaufwand bleibt einzeln aufgelistet, keine Aggregation.
        zeilen.forEach(r => addRow(r.bezeichnung, r.menge, r.einheit, r.preis, r.betrag));

      }else if(kat === 'maschine'){
        // Maschinenaufwand: ALLES ueber das ganze Bauteil zu einer Budget-Zeile.
        const summe = zeilen.reduce((s, r) => s + r.betrag, 0);
        addRow('Maschinenaufwand', 1, 'Budget', summe, summe);

      }else{
        // Logistik/Material: eine Zeile PRO Arbeitsschritt (Logistik als "Budget",
        // Material als "1 Stueck" - das gesamte Materialpaket dieses Arbeitsschritts).
        const einheitLabel = kat === 'material' ? 'Stück' : 'Budget';
        const proArbeitsschritt = {};
        zeilen.forEach(r => {
          proArbeitsschritt[r.arbeitsschritt] = (proArbeitsschritt[r.arbeitsschritt] || 0) + r.betrag;
        });
        Object.entries(proArbeitsschritt).forEach(([as, summe]) => {
          addRow(as, 1, einheitLabel, summe, summe);
        });
      }
    });

    $total.textContent = fmtCHF(grandTotal);
    $status.textContent = 'Live neu berechnet.';
    $status.classList.remove('err');
    flash();
  }catch(e){
    console.error(e);
    $status.textContent = 'Fehler bei der Berechnung: ' + (e.message || e);
    $status.classList.add('err');
  }
}

init();
</script>
</body>
</html>
