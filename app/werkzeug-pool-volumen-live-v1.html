<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=67"></script>
<title>Pool-Volumen – Werkzeuge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#323E4E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kg-werkzeuge.js?v=10"></script>
</head>
<body>
<header class="app"><div class="wrap">
  <a class="backlink" href="index.html">Startseite</a>
  <div class="brand"><h1>Werkzeuge</h1></div>
  <span class="userbar hidden" id="userbar"><span id="userbarText"></span><button id="logoutBtn">Abmelden</button></span>
</div></header>
<main id="appMain"></main>
<script>
// Pool-Volumen nach Beckenform: Wasserfläche × mittlere Tiefe ((flach + tief) ÷ 2).
// Oval = Rechteck mit zwei Halbkreisen (Länge ≥ Breite).
KGW.werkzeug('pool_volumen', inhalt => {
  const $ = id => document.getElementById(id), g = (id, alt) => KGW.lsGet('kgw-pvol-' + id, alt);
  inhalt.insertAdjacentHTML('beforeend', KGW.karte('Beckenform', `${KGW.seg('form', [['rechteck', 'Rechteck'], ['rund', 'Rund'], ['oval', 'Oval'], ['frei', 'Freiform']], g('seg-form', 'rechteck'))}
    <div id="fLB" style="display:flex;flex-direction:column;gap:10px">${KGW.feld('l', 'Länge (m)', g('l', '10'), 0.5)}${KGW.feld('b', 'Breite (m)', g('b', '4'), 0.5)}</div>
    <div id="fD">${KGW.feld('d', 'Durchmesser (m)', g('d', '6'), 0.5)}</div>
    <div id="fA">${KGW.feld('a', 'Wasserfläche (m²)', g('a', '35'), 1)}</div>
    <div class="kgw-trenn" style="display:flex;flex-direction:column;gap:10px">${KGW.feld('t1', 'Tiefe flach (m)', g('t1', '1.2'), 0.1)}${KGW.feld('t2', 'Tiefe tief (m)', g('t2', '1.8'), 0.1)}
    <span class="kgw-hinweis">Überall gleich tief? Zweimal dieselbe Tiefe eingeben.</span></div>`, 'formKarte'));
  inhalt.insertAdjacentHTML('beforeend', KGW.karte('Wasservolumen', `<div class="kgw-gross"><b id="m3"></b><span>m³</span></div>
    <div class="kgw-zeile"><span>Liter</span><b id="liter"></b></div><span class="kgw-klein" id="weg"></span>
    <button type="button" class="kg-neben" id="uebernehmen" style="all:unset;box-sizing:border-box;cursor:pointer;height:44px;border:1px solid #D5DBE1;border-radius:8px;text-align:center;font-weight:600;color:#323E4E">Für die Pool-Rechner übernehmen</button>`));
  let v = 0;
  const rechne = () => {
    const form = KGW.segWert($('formKarte'), 'form'), L = KGW.zahl('l'), B = KGW.zahl('b'), D = KGW.zahl('d');
    $('fLB').classList.toggle('hidden', form === 'rund' || form === 'frei'); $('fD').classList.toggle('hidden', form !== 'rund'); $('fA').classList.toggle('hidden', form !== 'frei');
    const [fl, weg] = form === 'rechteck' ? [L * B, 'Länge × Breite'] : form === 'rund' ? [Math.PI * D * D / 4, 'π × (Durchmesser ÷ 2)²']
      : form === 'oval' ? [L >= B ? (L - B) * B + Math.PI * B * B / 4 : 0, 'Rechteck mit zwei Halbkreisen'] : [KGW.zahl('a'), 'Wasserfläche'];
    const tm = (KGW.zahl('t1') + KGW.zahl('t2')) / 2; v = fl * tm;
    $('m3').textContent = KGW.fmt(v, 1); $('liter').textContent = KGW.fmt(Math.round(v * 10) * 100, 0);
    $('weg').textContent = `${weg} × mittlere Tiefe (${KGW.fmt(fl, 2)} m² × ${KGW.fmt(tm, 2)} m)` + (form === 'oval' && L < B ? ' – Länge muss grösser als Breite sein' : '');
  };
  KGW.binden($('formKarte'), rechne, 'kgw-pvol-');
  $('uebernehmen').addEventListener('click', () => {
    KGW.lsSet('kgw-pv-pvVol', String(+v.toFixed(2))); KGW.lsSet('kgw-pv-seg-pvmodus', 'direkt');
    KGW.toast(`${KGW.fmt(v, 1)} m³ übernommen – gilt jetzt in allen Pool-Rechnern`);
  });
  rechne();
});
</script>
</body>
</html>
