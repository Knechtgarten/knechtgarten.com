<style>
:root{
  --bg:#F5F7F9; --card:#FFFFFF; --primary:#323E4E; --primary-l:#4C5C70;
  --ink:#232B35; --muted:#8B9097; --line:#E1E5E9; --soft:#EEF3F7;

  --listw:320px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);line-height:1.45;font-size:13px;}
.wrap{padding:0 16px;}
.hidden,[hidden]{display:none !important;}
header.app .wrap{flex-wrap:wrap;row-gap:0;}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;}
header.app{background:var(--primary);color:#fff;}
header.app .wrap{display:flex;align-items:center;gap:20px;}
header.app .backlink{display:inline-flex;align-items:center;gap:5px;color:var(--primary);text-decoration:none;font-size:12px;font-weight:700;flex-shrink:0;background:var(--accent-lime);border-radius:20px;padding:6px 12px;}
header.app .brand{padding:11px 0;}
header.app .brand h1{font-size:15px;font-weight:600;color:#fff;}
header.app .brand .sub{font-size:11px;opacity:.75;margin-top:1px;}
header.app .userbar{display:flex;align-items:center;gap:10px;margin-left:auto;}
header.app .userbar span{opacity:.85;font-size:11.5px;}
header.app .userbar button.lo{font-size:11.5px;color:#c7ccd1;background:none;border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:3px 9px;cursor:pointer;}
.hbtn{all:unset;cursor:pointer;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;border:1px solid rgba(255,255,255,.3);}
.hbtn:hover,.hbtn[aria-pressed="true"]{background:rgba(255,255,255,.15);}
.hbtn svg{width:16px;height:16px;}
.bmenu{padding:4px;min-width:220px;}
.bopt > span{white-space:nowrap;}
.bopt{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:6px;font-size:14px;color:var(--primary);cursor:pointer;}
.bopt:hover{background:#F5F7F9;}
.bopt.an{background:#D6E7F4;font-weight:700;}
.bopt > span{flex:1;}
.btrenn{height:1px;background:var(--line);margin:4px 6px;}
.avs{display:flex;} .avs .av{width:22px;height:22px;font-size:9px;border:2px solid #fff;margin-left:-5px;} .avs .av:first-child{margin-left:0;}
.dzs{display:flex;gap:8px;flex-wrap:wrap;}
/* Ablagefelder «Hierher ziehen» oben in der grauen Spalte rechts (gestrichelt, keine Knöpfe) */

.ablage .dzs{flex-direction:column;gap:6px;}
.ablspalte{width:220px;} .ablspalte.breit{width:280px;}
body.offest .lresize{display:none;} body.offest .lh{cursor:default;}
/* Offerten-Board rechts: «Zugesagt» als Ablagefeld wie Archivieren (beim Darüberziehen hellblau), darunter ruhige Liste */
.dz[data-dzone="zusage"].hot{background:#D6E7F4;}
.ablzu{padding:18px 20px 0;} .zuliste{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:2px;}

.zuliste .card:first-child{border-top:0;} .zuliste .card:hover{background:rgba(50,62,78,.04);} .zuliste .card .tx{font-size:13px;}
.zuliste .zhint{padding:8px 10px;}
.ablspalte .dz{height:44px;font-size:13px;}
.ablliste{padding:10px 20px 0;} .ablliste .list{position:relative !important;left:0 !important;top:0 !important;width:100% !important;} .ablliste .lh{cursor:default;} .ablliste [data-set]{display:none;}
.pane.schmal .ablage{padding:6px 7px;}
.pane.schmal .ablage .ptitle{display:none;}
.pane.schmal .ablage .dz{justify-content:center;padding:0;}

.dz{display:flex;align-items:center;gap:8px;height:36px;box-sizing:border-box;border:1.5px dashed #A3B0BE;border-radius:8px;padding:0 12px;color:var(--primary);font-size:12px;font-weight:700;background:rgba(255,255,255,.55);user-select:none;}

.pick{width:100%;max-width:420px;background:#fff;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 18px 50px rgba(35,43,53,.25);max-height:85vh;overflow:auto;}

.pick .opt .ty,.arow .ty{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none;}

.set{max-height:85vh;overflow:auto;}

.arow .n2{flex:1;min-width:0;font-size:13px;}

input[type=text],input[type=email],input[type=password],select{font:inherit;font-size:12.5px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 8px;}
input:focus,select:focus{outline:none;border-color:var(--primary);}
.btn{border:none;border-radius:7px;padding:7px 14px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn-primary{background:var(--primary);color:#fff;} .btn-primary:hover{background:var(--primary-l);}
.btn-ghost{background:#fff;color:var(--primary);border:1px solid var(--line);} .btn-ghost:hover{border-color:var(--primary);}
.btn-danger{background:var(--danger);color:#fff;}
.btn svg{width:15px;height:15px;}
button:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
.seg{display:inline-flex;flex-wrap:wrap;}
.seg button{all:unset;cursor:pointer;padding:5px 11px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--primary);display:inline-flex;align-items:center;gap:5px;}
.seg button + button{border-left:0;}
.seg button:first-child{border-radius:6px 0 0 6px;} .seg button:last-child{border-radius:0 6px 6px 0;}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff;border-color:var(--primary);}
.seg i{width:9px;height:9px;border-radius:50%;}
.muted{color:var(--muted);} .small{font-size:11.5px;}
.av{width:17px;height:17px;border-radius:50%;color:#fff;font-size:8px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;}

/* Login */
.loginwrap{display:flex;justify-content:center;padding:60px 0;}

/* Bereiche */
.zones{display:flex;height:calc(100vh - var(--oben, 106px));min-height:480px;}
.pane{display:flex;flex-direction:column;min-width:0;flex:none;}
.pane.flex{flex:1;}
.pane.seite{background:#EFF2F5;}
.ptitle{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;height:34px;box-sizing:border-box;padding:0 20px;display:flex;gap:6px;align-items:center;flex:none;}
.pgriff{cursor:grab;display:inline-flex;margin-left:-14px;color:#B8BEC4;border-radius:4px;touch-action:none;}
.pgriff:hover{color:var(--primary);background:rgba(50,62,78,.08);}
.pgriff:active{cursor:grabbing;}
.pane.schmal .pgriff{margin-left:0;}
.pane.ziel{box-shadow:inset 0 0 0 2px var(--primary);background:var(--accent-blue) !important;}
.ptitle svg{width:13px;height:13px;}

.canvas{position:relative;overflow-x:hidden;overflow-y:auto;flex:1;min-height:0;}
.sheet{position:relative;}
.canvas.ziehen .sheet{background-image:radial-gradient(circle,#C5CCD3 1px,transparent 1.2px);background-size:20px 20px;}
.scols{display:flex;gap:20px;padding:20px;align-items:flex-start;}
.scol{flex:1;min-width:0;max-width:var(--listw);display:flex;flex-direction:column;gap:12px;}

.canvas.spalten .list{position:relative;left:auto !important;top:auto !important;width:100%;}
.split{width:9px;flex:none;cursor:col-resize;position:relative;touch-action:none;}

.split:hover::before,.split.on::before{background:var(--primary);width:2px;left:3.5px;}
.split .grip{position:absolute;top:50%;left:1px;width:7px;height:30px;margin-top:-15px;border-radius:4px;background:#fff;border:1px solid #C9D0D7;}
.split:hover .grip,.split.on .grip{border-color:var(--primary);}
.vstack{display:flex;flex-direction:column;gap:8px;padding:10px 0;align-items:center;overflow-y:auto;flex:1;}
.vstrip{all:unset;cursor:pointer;width:32px;border-radius:9px;color:#fff;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;gap:8px;padding:12px 0;font-weight:700;font-size:12.5px;white-space:nowrap;flex:none;}
.vstrip svg.i{width:18px;height:18px;transform:rotate(180deg);}
.vstrip.hell{color:var(--ink);}

/* Listen und Pendenzen */
.list{position:absolute;width:var(--listw);background:var(--soft);border-radius:10px;box-shadow:0 1px 2px rgba(35,43,53,.08);display:flex;flex-direction:column;}

.tog{all:unset;cursor:pointer;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;flex:none;}
.tog:hover{background:rgba(255,255,255,.18);}

.zu > .lh .tog svg,.gh.zu .tog svg{transform:rotate(-90deg);}

/* Wann?-Listen ruhig: weisse Liste mit Zeilen (feine Linie), graues Art-Icon, kein Zeit-Streifen, Plus im Kopf */
.list.zl{background:#fff;}

.list.zl .cards{gap:0;padding:0 0 4px;}
.list.zl .card{border-radius:0;border:0;border-top:1px solid rgba(50,62,78,.07);padding:0 8px 0 10px;gap:8px;height:28px;background:transparent;}
.list.zl .card .tx{font-size:13px;}
.list.zl .card .pr{margin-left:-10px;width:4px;}
.list.zl .card .pr:hover{width:7px;}
.list.zl .card .pr.person{width:4px;}
.list.zl .card.ohnepr{padding-left:10px;}
.list.zl .cards .gh{margin:4px 8px 0;}
.list.zl .zhint{padding:4px 10px 6px;}
.list.zl .card:first-child{border-top:0;}
.list.zl .card:hover{background:rgba(50,62,78,.04);}
.list.zl .card.sel{background:rgba(157,194,223,.25);}
.list.zl .card .ty{background:none !important;color:#8B9097;width:18px;}
.list.zl .card .ty svg{width:16px;height:16px;}
.lh .lplus{margin-left:auto;}
.zadd{display:flex;align-items:center;gap:6px;margin:5px 6px;border:1px solid #9DC2DF;border-radius:6px;padding:0 4px 0 8px;background:#fff;}
.zadd input{flex:1;min-width:0;height:28px;border:0;padding:0;background:transparent;}
.zadd input:focus{outline:none;}
.zadd .kg-ibtn{border-color:transparent;}
.druckpop{padding:4px;width:180px;}
.cards{display:flex;flex-direction:column;gap:4px;padding:6px 6px 2px;min-height:12px;}
.gh{display:flex;align-items:center;gap:4px;margin:6px 6px 0;padding:3px 4px;font-size:11.5px;font-weight:700;color:var(--primary);border-radius:6px;cursor:pointer;user-select:none;}
.gh:hover{background:rgba(50,62,78,.06);}
.cards .gh{margin:6px 0 0;cursor:grab;}
.cards .gh.dragging{opacity:.35;}
.card.ingr{margin-left:12px;}
.card.gzu{display:none;}
.card{background:#fff;border-radius:6px;height:30px;display:flex;align-items:center;gap:6px;padding:0 6px 0 0;cursor:pointer;border:1px solid transparent;overflow:hidden;flex:none;}
.card .vst{font-size:10.5px;font-weight:600;color:#4C5C70;background:#EEF1F4;border-radius:99px;padding:1px 7px;white-space:nowrap;line-height:16px;}
.card .vst.ein{background:#D6E7F4;color:#323E4E;} .card button.vst.neu{all:unset;cursor:pointer;font-size:10.5px;font-weight:600;line-height:16px;padding:0 7px;border-radius:99px;border:1px dashed #8B9097;color:#4C5C70;white-space:nowrap;} .card button.vst.neu:hover{border-color:#323E4E;color:#323E4E;}
.card.vhell{opacity:.55;}
.vset .vhint{font-size:13px;color:#6B7079;margin:0;} .vset .vfl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#6B7079;} .vset input[type=text],.vset input[type=number]{height:34px;border:1px solid #D5DBE1;border-radius:8px;padding:0 10px;font:inherit;font-size:13.5px;box-sizing:border-box;width:100%;}
.vset .vpj{padding:4px 0 0;flex-wrap:wrap;} .vset .vpj small{color:#8B9097;font-size:11.5px;}
.vset .vrw{display:flex;align-items:flex-end;gap:12px;} .vset .vrw .sp{flex:1;} .vset .vrw .vfl{width:110px;} .vset .vck{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding-bottom:8px;}
.vks{position:relative;display:block;} .vkm{position:absolute;left:0;right:0;top:36px;background:#fff;border:1px solid #D5DBE1;border-radius:8px;box-shadow:0 8px 24px rgba(35,43,53,.15);z-index:5;display:flex;flex-direction:column;max-height:260px;overflow:auto;}
.vkm button{all:unset;cursor:pointer;padding:6px 10px;display:flex;flex-direction:column;font-size:13px;color:#232B35;} .vkm button small{color:#8B9097;font-size:11.5px;} .vkm button:hover{background:#F5F7F9;} .vkl{padding:8px 10px;font-size:12.5px;color:#8B9097;}
/* Kundensuche wie im Offertentool: Lupe im Feld, Treffer aus Kontakte, dann Easybill, sonst «als neuen Kunden erfassen»; gewählt = Feld mit Name + × */
.zadd.zkunde{display:block;padding:6px 8px;background:none;box-shadow:none;border:0;} .zadd.zkunde input[type=text]{width:100%;box-sizing:border-box;height:32px;border:1px solid #D5DBE1;border-radius:8px;padding:0 10px 0 32px;font:inherit;font-size:13px;}

.ofrow.okrow{align-items:flex-start;} .ofrow.okrow > span{padding-top:9px;} #dkunde{flex:1;min-width:0;padding:0;background:none;box-shadow:none;border:0;display:block;}

#vorratDlg .vset{width:min(640px,calc(100vw - 32px));max-width:none;}
.vset .vzus{flex-wrap:wrap;} .vset .vzus .vfl:first-child{width:150px;flex:none;} .vset .vzus .vfl.vgr{min-width:200px;} .vset .vtot{flex-wrap:wrap;}
.vset .vtot{display:flex;align-items:center;gap:8px;font-size:13px;color:#6B7079;} .vset .vtot .vck{padding:0;} .vset .vtot .sp{flex:1;} .vset .vtot b{color:#232B35;font-size:15px;}

document.addEventListener('pointermove', e => {
  if(sd?.paar){ // zwischen zwei festen Bereichen: Summe bleibt gleich; unter 200 px schnappt einer auf «hochkant» zu

    let wa = sd.wa + dx;

    return; }

document.addEventListener('pointerup', e => {

// Pendenzen ziehen: in Liste/Gruppe (wechselt Liste), in Zeitliste (setzt Zeit); Pendenzenart aufs Blatt = neue Liste
let dc = null, dArt = null, dg = null;
document.addEventListener('dragstart', e => {
  const a = e.target.closest('[data-neuart]'); if(a){ dArt = a.dataset.neuart; e.dataTransfer.setData('text/plain', dArt); document.querySelectorAll('.canvas').forEach(c => c.classList.add('ziehen')); return; }

  const gh = e.target.closest('[data-ghead]'); if(gh){ dg = S.gruppen.find(g => g.id === gh.dataset.ghead); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dg.id); setTimeout(() => gh.classList.add('dragging')); return; }

document.addEventListener('dragend', () => { dc = null; dArt = null; dg = null; document.body.classList.remove('zieht-pendenz'); document.querySelectorAll('.dz.hot').forEach(z => z.classList.remove('hot')); document.querySelectorAll('.ph').forEach(p => p.remove()); document.querySelectorAll('.ziehen').forEach(c => c.classList.remove('ziehen')); document.querySelectorAll('.dragging').forEach(c => c.classList.remove('dragging')); });

// Rückmeldung oben: Feld wippt kurz, wenn eine Pendenz darauf abgelegt wurde (überlebt das Neuzeichnen der Leiste)
function treffer(zone){ S.treffer = zone; document.querySelector(`[data-dzone="${zone}"]`)?.classList.add('treffer');
  clearTimeout(treffer.t); treffer.t = setTimeout(() => { S.treffer = null; document.querySelectorAll('.dz.treffer').forEach(x => x.classList.remove('treffer')); }, 900); }
// Zeilen der Liste (Pendenzen und Gruppentitel, ohne zugeklappte), Einfügestelle nach Mausposition
const dropIdx = (zone, y) => { const cs = [...zone.querySelectorAll(':scope > [data-card]:not(.dragging):not(.gzu), :scope > [data-ghead]:not(.dragging)')]; const i = cs.findIndex(c => { const r = c.getBoundingClientRect(); return y < r.top + r.height / 2; }); return { cs, i: i < 0 ? cs.length : i }; };
const sortVon = el => el ? (el.dataset.ghead ? S.gruppen.find(g => g.id === el.dataset.ghead)?.sortierung : S.pz.find(x => x.id === el.dataset.card)?.sortierung) : undefined;
// Gruppe einer Stelle = letzter Gruppentitel darüber
const gruppeVor = (cs, i) => { for(let k = i - 1; k >= 0; k--) if(cs[k].dataset.ghead) return S.gruppen.find(g => g.id === cs[k].dataset.ghead) || null; return null; };
// nach dem Verschieben eines Gruppentitels: Gruppe jeder Pendenz der Liste aus der Reihenfolge neu bestimmen und speichern
function gruppenNeu(listeId){
  const gs = S.gruppen.filter(g => g.liste_id === listeId).sort((a, b) => a.sortierung - b.sortierung);
  S.pz.filter(p => p.liste_id === listeId).forEach(p => { let gid = null; for(const g of gs) if(g.sortierung < p.sortierung) gid = g.id;
    if((p.gruppe_id || null) !== gid){ p.gruppe_id = gid; upd('pendenz', p.id, { gruppe_id: gid }); } });
}
document.addEventListener('dragover', e => {
  if(dArt){ if(e.target.closest('[data-cv]')) e.preventDefault(); return; }
  if(dg){ const z = dropZone(e.target); if(!z || z.dataset.drop !== dg.liste_id) return; e.preventDefault();
    document.querySelectorAll('.ph').forEach(p => p.remove()); const { cs, i } = dropIdx(z, e.clientY); const ph = document.createElement('div'); ph.className = 'ph';
    if(cs[i]) z.insertBefore(ph, cs[i]); else z.appendChild(ph); return; }
  if(!dc) return;
  const dz = e.target.closest('[data-dzone]'); // Ablageflächen oben: Archivieren, anderes Board, Planer
  document.querySelectorAll('.dz.hot').forEach(x => { if(x !== dz) x.classList.remove('hot'); });
  if(dz){ e.preventDefault(); dz.classList.add('hot'); return; }
  const z = dropZone(e.target); if(!z) return; e.preventDefault();
  document.querySelectorAll('.ph').forEach(p => p.remove()); const { cs, i } = dropIdx(z, e.clientY); const ph = document.createElement('div'); ph.className = 'ph';
  if(cs[i]) z.insertBefore(ph, cs[i]); else z.appendChild(ph); });
document.addEventListener('drop', async e => {
  if(dArt){ const cv = e.target.closest('[data-cv]'); if(!cv) return; e.preventDefault(); const r = cv.getBoundingClientRect(), id = dArt; dArt = null; S.neuListe = false;
    return neueListe(id, { bereich: cv.dataset.cv, x: Math.max(0, Math.round((e.clientX - r.left + cv.scrollLeft - 20) / R) * R), y: Math.max(0, Math.round((e.clientY - r.top + cv.scrollTop - 15) / R) * R) }); }
