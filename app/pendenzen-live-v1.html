<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=6"></script>
<title>Pendenzen – Knechtgarten</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg:#F5F7F9; --card:#FFFFFF; --primary:#323E4E; --primary-l:#4C5C70;
  --ink:#232B35; --muted:#8B9097; --line:#E1E5E9; --soft:#EEF3F7;
  --accent-blue:#D6E7F4; --accent-lime:#D1DB5F; --danger:#B4655F; --red:#C0392B;
  --z1:#D1DB5F; --z2:#9DC2DF; --z3:#A9B0B7;
  --listw:320px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);line-height:1.45;font-size:13px;}
.wrap{padding:0 16px;}
.hidden,[hidden]{display:none !important;}
header.app .wrap{flex-wrap:wrap;row-gap:0;}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;}
header.app{background:var(--primary);color:#fff;}
header.app .wrap{display:flex;align-items:center;gap:20px;}
header.app .backlink{display:inline-flex;align-items:center;gap:5px;color:var(--primary);text-decoration:none;font-size:12px;font-weight:700;flex-shrink:0;background:var(--accent-lime);border-radius:20px;padding:6px 12px;}
header.app .brand{padding:11px 0;}
header.app .brand h1{font-size:15px;font-weight:600;color:#fff;}
header.app .brand .sub{font-size:11px;opacity:.75;margin-top:1px;}
header.app .userbar{display:flex;align-items:center;gap:10px;margin-left:auto;}
header.app .userbar span{opacity:.85;font-size:11.5px;}
header.app .userbar button.lo{font-size:11.5px;color:#c7ccd1;background:none;border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:3px 9px;cursor:pointer;}
.hbtn{all:unset;cursor:pointer;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;border:1px solid rgba(255,255,255,.3);}
.hbtn:hover,.hbtn[aria-pressed="true"]{background:rgba(255,255,255,.15);}
.hbtn svg{width:16px;height:16px;}
.bbar{background:#fff;border-bottom:1px solid var(--line);}
.bzones{position:relative;display:flex;align-items:center;min-height:46px;}
.bflow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 12px;}
.brechts{margin-left:auto;}
.bslot.bpos{position:absolute;top:50%;transform:translateY(-50%);}
.bselw{display:flex;} .bselw > *{flex:1;min-width:0;}
.bbar .bname{font-size:14px;font-weight:700;color:var(--primary);}
.bbar .bsel{font-size:14px;font-weight:700;color:var(--primary);padding:6px 8px;}
.dz.bpos{justify-content:center;padding:6px 10px;}
.avs{display:flex;} .avs .av{width:22px;height:22px;font-size:9px;border:2px solid #fff;margin-left:-5px;} .avs .av:first-child{margin-left:0;}
.dzs{display:flex;gap:8px;flex-wrap:wrap;}
.dz{display:inline-flex;align-items:center;gap:7px;border:1.5px dashed #B8C2CC;border-radius:8px;padding:5px 12px;color:var(--primary);font-size:12px;font-weight:700;background:#fff;user-select:none;}
.dz svg{width:15px;height:15px;}
body.zieht-pendenz .dz{border-color:var(--primary);background:var(--soft);}
.dz.hot{border-style:solid;border-color:var(--primary) !important;background:var(--accent-blue) !important;}
.pick{width:100%;max-width:420px;background:#fff;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 18px 50px rgba(35,43,53,.25);max-height:85vh;overflow:auto;}
.pick.breit{max-width:760px;}
.hkreihe{display:flex;flex-wrap:wrap;gap:6px;}
.hkspalten{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 12px;align-items:start;}
.hkspalte{display:flex;flex-direction:column;gap:4px;}
.hk{display:flex;align-items:center;gap:7px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;cursor:pointer;font-size:12.5px;background:#fff;}
.hk:hover{border-color:var(--primary);}
.hk:has(input:checked){border-color:var(--primary);background:var(--soft);font-weight:700;}
.hk input{accent-color:var(--primary);margin:0;}
.hk i{width:10px;height:10px;border-radius:50%;flex:none;}
.pick h2{font-size:14px;display:flex;align-items:center;gap:8px;}
.pick .was{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pick .sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-top:8px;}
.pick .opt{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;font-size:13px;}
.pick .opt:hover,.pick .opt:focus-visible{background:var(--soft);}
.pick .opt .ty,.arow .ty{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none;}
.pick .opt .ty svg,.arow .ty svg{width:15px;height:15px;}
.pick .opt .av{width:22px;height:22px;font-size:9px;}
.set{max-height:85vh;overflow:auto;}
.arow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);}
.arow .n2{flex:1;min-width:0;font-size:13px;}
.arow small{display:block;color:var(--muted);font-size:11px;}
.sp{flex:1;}
input[type=text],input[type=email],input[type=password],select{font:inherit;font-size:12.5px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 8px;}
input:focus,select:focus{outline:none;border-color:var(--primary);}
.btn{border:none;border-radius:7px;padding:7px 14px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn-primary{background:var(--primary);color:#fff;} .btn-primary:hover{background:var(--primary-l);}
.btn-ghost{background:#fff;color:var(--primary);border:1px solid var(--line);} .btn-ghost:hover{border-color:var(--primary);}
.btn-danger{background:var(--danger);color:#fff;}
.btn svg{width:15px;height:15px;}
button:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
.seg{display:inline-flex;flex-wrap:wrap;}
.seg button{all:unset;cursor:pointer;padding:5px 11px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--primary);display:inline-flex;align-items:center;gap:5px;}
.seg button + button{border-left:0;}
.seg button:first-child{border-radius:6px 0 0 6px;} .seg button:last-child{border-radius:0 6px 6px 0;}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff;border-color:var(--primary);}
.seg i{width:9px;height:9px;border-radius:50%;}
.muted{color:var(--muted);} .small{font-size:11.5px;}
.av{width:17px;height:17px;border-radius:50%;color:#fff;font-size:8px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;}

/* Login */
.loginwrap{display:flex;justify-content:center;padding:60px 0;}
.logincard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:28px 26px;width:100%;max-width:330px;display:flex;flex-direction:column;gap:12px;}
.logincard h2{font-size:17px;}
.logincard .fld{display:flex;flex-direction:column;gap:4px;}
.logincard label{font-size:11.5px;color:var(--muted);}
.status{font-size:12px;color:var(--muted);} .status.err{color:var(--danger);}

/* Bereiche */
.zones{display:flex;height:calc(100vh - 106px);min-height:480px;}
.pane{display:flex;flex-direction:column;min-width:0;flex:none;}
.pane.flex{flex:1;}
.pane.seite{background:#EFF2F5;}
.ptitle{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;height:34px;box-sizing:border-box;padding:0 20px;display:flex;gap:6px;align-items:center;flex:none;}
.pgriff{cursor:grab;display:inline-flex;margin-left:-14px;color:#B8BEC4;border-radius:4px;touch-action:none;}
.pgriff:hover{color:var(--primary);background:rgba(50,62,78,.08);}
.pgriff:active{cursor:grabbing;}
.pane.schmal .pgriff{margin-left:0;}
.pane.ziel{box-shadow:inset 0 0 0 2px var(--primary);background:var(--accent-blue) !important;}
.ptitle svg{width:13px;height:13px;}
.pane.schmal .ptitle{padding:8px 0 0;justify-content:center;}
.pane.schmal .ptitle span{display:none;}
.canvas{position:relative;overflow-x:hidden;overflow-y:auto;flex:1;min-height:0;}
.sheet{position:relative;}
.canvas.ziehen .sheet{background-image:radial-gradient(circle,#C5CCD3 1px,transparent 1.2px);background-size:20px 20px;}
.scols{display:flex;gap:20px;padding:20px;align-items:flex-start;}
.scol{flex:1;min-width:0;max-width:var(--listw);display:flex;flex-direction:column;gap:12px;}
.pane[data-pane="zeit"] .scol{gap:24px;} /* Heute / Woche / Monat etwas luftiger */
.canvas.spalten .list{position:relative;left:auto !important;top:auto !important;width:100%;}
.split{width:9px;flex:none;cursor:col-resize;position:relative;touch-action:none;}
.split::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:1px;background:#C9D0D7;}
.split:hover::before,.split.on::before{background:var(--primary);width:2px;left:3.5px;}
.split .grip{position:absolute;top:50%;left:1px;width:7px;height:30px;margin-top:-15px;border-radius:4px;background:#fff;border:1px solid #C9D0D7;}
.split:hover .grip,.split.on .grip{border-color:var(--primary);}
.vstack{display:flex;flex-direction:column;gap:8px;padding:10px 0;align-items:center;overflow-y:auto;flex:1;}
.vstrip{all:unset;cursor:pointer;width:32px;border-radius:9px;color:#fff;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;gap:8px;padding:12px 0;font-weight:700;font-size:12.5px;white-space:nowrap;flex:none;}
.vstrip svg.i{width:18px;height:18px;transform:rotate(180deg);}
.vstrip.hell{color:var(--ink);}

/* Listen und Pendenzen */
.list{position:absolute;width:var(--listw);background:var(--soft);border-radius:10px;box-shadow:0 1px 2px rgba(35,43,53,.08);display:flex;flex-direction:column;}
.list.flieg{position:fixed !important;z-index:40;box-shadow:0 14px 34px rgba(35,43,53,.28);pointer-events:none;}
.lh{display:flex;align-items:center;gap:7px;padding:7px 8px 7px 6px;border-radius:10px;color:#fff;cursor:grab;user-select:none;}
.list:not(.zu) .lh{border-radius:10px 10px 0 0;}
.lh.hell{color:var(--ink);}
.lh > svg.i{width:20px;height:20px;}
.lh b{font-size:13px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tog{all:unset;cursor:pointer;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;flex:none;}
.tog:hover{background:rgba(255,255,255,.18);}
.tog svg{width:14px;height:14px;transition:transform .15s;}
.zu > .lh .tog svg,.gh.zu .tog svg{transform:rotate(-90deg);}
.lh .kg-ibtn{background:transparent;border-color:rgba(255,255,255,.45);color:inherit;}
.lh.hell .kg-ibtn{border-color:rgba(35,43,53,.25);}
.lh .kg-ibtn:hover{background:rgba(255,255,255,.2);color:inherit;}
.list.zu .body{display:none;}
.cards{display:flex;flex-direction:column;gap:4px;padding:6px 6px 2px;min-height:12px;}
.gh{display:flex;align-items:center;gap:4px;margin:6px 6px 0;padding:3px 4px;font-size:11.5px;font-weight:700;color:var(--primary);border-radius:6px;cursor:pointer;user-select:none;}
.gh:hover{background:rgba(50,62,78,.06);}
.gcards{padding-left:12px;}
.gh.zu + .gcards{display:none;}
.card{background:#fff;border-radius:6px;height:30px;display:flex;align-items:center;gap:6px;padding:0 6px 0 0;cursor:pointer;border:1px solid transparent;overflow:hidden;flex:none;}
.card:hover{border-color:var(--line);}
.card.sel{border-color:var(--primary);}
.card .pr{all:unset;cursor:pointer;width:6px;align-self:stretch;flex:none;background:#EEF1F4;}
.card .pr:hover{width:9px;}
.card .pr.person,.card .pr.person:hover{cursor:inherit;width:6px;}
.herk{display:inline-flex;flex:none;}
.herk svg{width:15px;height:15px;}
.herk.mail{color:var(--red);}
.herk.board{color:var(--primary-l);}
.card .ck{all:unset;width:14px;height:14px;border:1.5px solid #B8BEC4;border-radius:4px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;margin-left:2px;}
.card .ck:hover{border-color:var(--primary);}
.card .ty{width:21px;height:21px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none;}
.card .ty svg{width:17px;height:17px;}
.card .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px;}
.card .ind{display:flex;gap:3px;align-items:center;color:var(--muted);flex:none;}
.card .ind svg{width:12px;height:12px;}
.card.dragging{opacity:.35;}
.ph{height:3px;background:var(--primary);border-radius:2px;margin:-2px 0;}
.ladd{display:flex;gap:4px;padding:4px 6px 8px;}
.ladd input{flex:1;min-width:0;height:30px;background:transparent;border-color:transparent;}
.ladd input:hover,.ladd input:focus{background:#fff;border-color:var(--line);}
.ladd .kg-ibtn{margin-top:3px;}
.kg-ibtn.on,.eb.on{background:var(--danger);border-color:var(--danger);color:#fff;}
.eb.mic{margin-left:auto;}
.lresize{position:absolute;top:0;right:-4px;bottom:0;width:8px;cursor:ew-resize;z-index:2;}
.lresize:hover{background:linear-gradient(90deg,transparent 3px,var(--primary) 3px,var(--primary) 5px,transparent 5px);}
.canvas.spalten .lresize{display:none;}
.canvas.spalten .list{width:100% !important;}
#tip{position:fixed;z-index:35;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(35,43,53,.18);padding:8px 11px;font-size:13px;pointer-events:none;white-space:pre-line;overflow-wrap:anywhere;}
#tip b{display:block;}
#tip span{display:block;color:var(--muted);font-size:12px;margin-top:4px;}
.zhint{font-size:11px;color:var(--muted);padding:4px 4px 6px;}

/* Popover */
.pop{position:fixed;z-index:25;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(35,43,53,.18);padding:10px;display:flex;flex-direction:column;gap:9px;}
.fld{display:flex;flex-direction:column;gap:5px;}
.fld > label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.zopt{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;font-size:12.5px;}
.zopt:hover{background:var(--soft);}
.zopt i{width:10px;height:10px;border-radius:50%;border:1px solid var(--line);}
.zopt[aria-pressed="true"]{font-weight:700;}
.artchip{all:unset;cursor:grab;display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;color:#fff;font-weight:700;font-size:12.5px;}
.artchip svg{width:18px;height:18px;}
.confirm{background:#FBEFEC;border:1px solid #E6CFCC;border-radius:8px;padding:8px;display:flex;gap:6px;align-items:center;font-size:12px;flex-wrap:wrap;}

/* Pendenz: Fenster oder rechts angeheftet */
.dbg{position:fixed;inset:0;background:rgba(35,43,53,.35);z-index:15;display:flex;justify-content:center;align-items:flex-start;padding:7vh 16px 16px;overflow:auto;}
.det{background:#fff;display:flex;flex-direction:column;gap:14px;}
.det.fenster{width:100%;max-width:600px;border-radius:12px;padding:18px;box-shadow:0 18px 50px rgba(35,43,53,.25);}
.det.rechts{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(35,43,53,.12);padding:16px;overflow:auto;z-index:15;}
.det .hd{display:flex;gap:8px;align-items:flex-start;}
.det .hd .ty{width:28px;height:28px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none;margin-top:2px;}
.det .hd .ty svg{width:20px;height:20px;}
.det .hd input{flex:1;min-width:0;font-size:16px;font-weight:700;border-color:transparent;padding:4px 6px;}
.det .hd input:hover{border-color:var(--line);}
.det .von{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:-8px;padding-left:36px;}
.ed{border:1px solid #C9CFD5;border-radius:8px;display:flex;flex-direction:column;}
.ed:focus-within{border-color:var(--primary);}
.etb{display:flex;align-items:center;gap:2px;padding:5px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap;position:relative;}
.etb .sepv{width:1px;height:18px;background:var(--line);margin:0 6px;}
.eb{all:unset;cursor:pointer;height:28px;min-width:28px;padding:0 5px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:2px;color:var(--primary);font-size:13px;}
.eb:hover{background:var(--soft);}
.eb svg{width:17px;height:17px;}
.eb svg.dd{width:11px;height:11px;}
.emenu{position:absolute;top:36px;z-index:3;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 20px rgba(35,43,53,.15);padding:4px;display:flex;flex-direction:column;min-width:150px;}
.emenu button{all:unset;cursor:pointer;padding:6px 9px;border-radius:5px;font-size:12.5px;}
.emenu button:hover{background:var(--soft);}
.elink{display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);}
.elink input{flex:1;min-width:0;}
.ebody{min-height:130px;padding:10px 14px;outline:none;font-size:13.5px;line-height:1.55;overflow-wrap:anywhere;}
.ebody:empty::before{content:attr(data-ph);color:var(--muted);}
.ebody h3{font-size:15px;margin:6px 0 2px;} .ebody p{margin:0 0 4px;} .ebody ul,.ebody ol{margin:2px 0 6px;padding-left:20px;}
.ebody a{color:#2E6A9A;} .ebody img{max-width:100%;border-radius:6px;}
.strip{display:flex;flex-direction:column;gap:6px;}
.strip .lab{display:flex;align-items:center;gap:6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;}
.strip .lab svg{width:13px;height:13px;}
.tiles{display:flex;gap:6px;flex-wrap:wrap;}
.tile{position:relative;}
.tile a{display:block;text-decoration:none;color:var(--ink);}
.tile img{width:64px;height:48px;border-radius:6px;object-fit:cover;display:block;background:var(--soft);}
.datei{height:48px;max-width:190px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;display:flex;align-items:center;gap:7px;font-size:11.5px;background:#fff;}
.datei:hover{border-color:var(--primary);}
.datei span:last-child{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.ft{font-size:9px;font-weight:800;color:#fff;border-radius:3px;padding:2px 4px;flex:none;background:#4F7C8A;}
.ft.pdf{background:var(--danger);}
.tile .kg-ibtn{position:absolute;top:-7px;right:-7px;width:20px;height:20px;display:none;}
.tile .kg-ibtn svg{width:11px;height:11px;}
.tile:hover .kg-ibtn{display:inline-flex;}
.fadd{width:48px;height:48px;border-radius:6px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;background:#fff;}
.fadd:hover{border-color:var(--primary);color:var(--primary);}
.det .foot{display:flex;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:10px;font-size:11px;color:var(--muted);}

/* Einstellungen, Notizzettel, Meldungen */
.set{width:100%;max-width:520px;background:#fff;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 50px rgba(35,43,53,.25);}
.set h2{font-size:15px;display:flex;justify-content:space-between;align-items:center;}
.artrow{display:flex;align-items:center;gap:8px;padding:4px 0;flex-wrap:wrap;}
.artrow .ty{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none;}
.artrow .ty svg{width:17px;height:17px;}
.artrow .n{width:150px;font-size:12.5px;}
.sws{display:flex;gap:3px;flex-wrap:wrap;}
.sw{all:unset;cursor:pointer;width:16px;height:16px;border-radius:50%;}
.dbg.oben{z-index:28;}
.farbwahl{width:100%;max-width:580px;background:#fff;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:16px;box-shadow:0 18px 50px rgba(35,43,53,.25);}
.farbwahl h2{font-size:15px;display:flex;justify-content:space-between;align-items:center;}
.fgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.fkachel{all:unset;cursor:pointer;height:54px;border-radius:9px;}

(function(){

const AI = {

};
const A = (n, s) => `<svg class="i" viewBox="0 0 24 24"${s ? ` style="width:${s}px;height:${s}px"` : ''}>${AI[n] || AI.dok}</svg>`;
const ZEIT = [null, { t:'Heute', c:'var(--z1)', icon:'sonne', hell:true }, { t:'Diese Woche', c:'var(--z2)', icon:'woche', hell:true }, { t:'Dieser Monat', c:'var(--z3)', icon:'monat', hell:true }];
const BEREICHE = { zeit:['Wann?','sonne'], mitte:['Pendenzen','dok'], team:['Allgemein','leute'] };
const FARBEN = ['#323E4E','#4C5C70','#3F6E8C','#4F7C8A','#2F7A70','#5F8A6B','#7A8F4E','#9A8A3A','#B07A4A','#8A6F5F','#9A6B7E','#6B5F8A','#46505E','#5A7D9A','#3D8C8C','#556B5A','#6E8B3D','#8C7A5B','#8E5B4A','#7D6B9E'];
const PFARBEN = ['#579DFF','#FEA362','#F5CD47','#4BCE97','#9F8FEF','#F87168','#6CC3E0','#94C748','#E774BB','#8590A2']; // Personenfarben (Trello-Töne)
const AVF = ['#5F8A6B','#4F7C8A','#B07A4A','#6B5F8A','#9A6B7E','#3F6E8C','#7A8F4E','#8A6F5F'];
const R = 20, LW = 320;

let ME = null, ROLLE = null;
const S = { boards:[], mitglieder:[], archiv:null, pick:null, arten:{}, board:null, listen:[], gruppen:[], pz:[], dateien:[], benutzer:{}, ein:{ oeffnen:'fenster', breiten:{}, farben:{}, notizzettel:'' },
  sel:null, del:false, delDatei:null, delListe:false, pop:null, zpick:null, neuListe:false, set:false, zettel:false, toast:null, urls:{}, splitOn:null, pwLast:{ zeit:360, team:380 } };

// ---------------------------------------------------------------------------
// Helfer
// ---------------------------------------------------------------------------
const art = id => S.arten[id] || { titel:'?', icon:'dok', farbe:'#8B9097' };
const artFarbe = id => S.ein.farben[id] || art(id).farbe;
const listeById = id => S.listen.find(l => l.id === id);
const fixListe = l => l.art_id === 'team' || l.art_id === 'notizen'; // Eingangs-Listen: fester Name, nicht löschbar
const listFarbe = l =>l.farbe || artFarbe(l.art_id); // eigene Listenfarbe, sonst Farbe der Pendenzenart
const bereichOf = l => l.bereich || 'mitte';
// Drei Bereiche (zeit, mitte, team) in frei wählbarer Reihenfolge: aussen eingestellte Breite, Mitte = Rest
const SEITE_MIN = LW + 2 * R, STD_BREITE = { zeit:SEITE_MIN, mitte:680, team:SEITE_MIN }, MITTE_MIN = SEITE_MIN; // Seitenbereich = eine Liste plus 20 px Rand
const breite = b => { const v = S.ein.breiten[b] ?? STD_BREITE[b]; return v <= 60 || b === 'mitte' ? v : Math.max(v, SEITE_MIN); };
// fest für alle; eigenes Board: Zeit | Arten | Team, gemeinsame Boards: Arten | Team. Jede Liste bleibt in ihrem Bereich
// Reihenfolge pro Person (am Griff tauschbar), gespeichert in pendenz_benutzer.breiten._reihe / _reiheG
const reihe = () => { const eigen = S.board?.typ === 'person', std = eigen ? ['zeit', 'mitte', 'team'] : ['mitte', 'team'], r = S.ein.breiten[eigen ? '_reihe' : '_reiheG'];
  return Array.isArray(r) && r.length === std.length && std.every(z => r.includes(z)) ? r : std; };
const bereichFuerArt = artId => artId === 'team' || artId === 'notizen' ? 'team' : 'mitte'; // rechts: Team-box und Dauernde Notizen
const platz = () => innerWidth - 9 * (reihe().length - 1);
// Seitenbereiche haben ihre Breite, die Mitte bekommt den Rest; bei schmalem Fenster klappen zuerst rechts, dann links hochkant zu
function anzeigeBreiten(){ const seiten = reihe().filter(z => z !== 'mitte'), w = {};
  seiten.forEach(z => w[z] = breite(z));
  const rest = () => platz() - seiten.reduce((s, z) => s + w[z], 0);
  [...seiten].reverse().forEach(z => { if(rest() < MITTE_MIN && w[z] > 60) w[z] = 46; });
  w.mitte = Math.max(46, rest()); return w; }
// Darstellung je nach Breite: frei (eigene Anordnung), Spalten (automatisch gestapelt), schmal (Titel hochkant)
// Wann? und Allgemein: immer frei anordnen – zu breite Listen werden auf die Bereichsbreite gekürzt, Überlappungen rutschen nach unten
let KAPPE = Infinity;
const lBreite = l => Math.min(l.breite || LW, KAPPE), lX = l => Math.max(0, Math.min(l.x, Math.floor((KAPPE + R - lBreite(l)) / R) * R));
function modusFuer(ls, w, zn){ if(w <= 60) return 'schmal'; if(zn !== 'mitte') return 'frei'; return w >= Math.max(0, ...ls.map(l => l.x + (l.breite || LW))) + R ? 'frei' : 'spalten'; }
const sortiert = l => S.pz.filter(p => p.liste_id === l.id).sort((a, b) => a.sortierung - b.sortierung || a.erstellt_am.localeCompare(b.erstellt_am));
const zeitIds = z => S.pz.filter(p => p.zeit === z).sort((a, b) => (a.zeit_sortierung ?? 1e12) - (b.zeit_sortierung ?? 1e12) || a.sortierung - b.sortierung);
const estH = l => 44 + (l.zu ? 0 : (l.zeit ? zeitIds(l.zeit) : sortiert(l)).length * 34 + S.gruppen.filter(g => g.liste_id === l.id).length * 30 + 46);
const avatar = uid => { const b = S.benutzer[uid]; if(!b) return ''; const n = b.anzeigename || b.email || '?'; const k = n.split(/[\s.@]+/).filter(Boolean).slice(0, 2).map(x => x[0].toUpperCase()).join('');
  let h = 0; for(const c of uid) h = (h * 31 + c.charCodeAt(0)) >>> 0; const pf = S.pfarbe?.[uid]; // Personenfarbe, sonst feste Ersatzfarbe
  return `<span class="av" style="background:${pf || AVF[h % AVF.length]}${pf ? ';color:var(--ink)' : ''}" title="${esc(n)}">${esc(k)}</span>`; };
const name = uid => { const b = S.benutzer[uid]; return b ? (b.anzeigename || b.email) : ''; };
function fehler(e, was){ console.error(e); toast((was ? was + ': ' : '') + (e?.message || e), null, true); }
function toast(t, undo, err){ S.toast = { t, undo, err }; zeichneOver(); clearTimeout(toast.h); toast.h = setTimeout(() => { S.toast = null; zeichneOver(); }, 4500); }
// Reihenfolge: neuer Wert zwischen den Nachbarn
const zwischen = (a, b) => a == null && b == null ? 1 : a == null ? b - 1 : b == null ? a + 1 : (a + b) / 2;
let einTimer = null;
function speichereEin(){ clearTimeout(einTimer); einTimer = setTimeout(async () => { const { error } = await sb.from('pendenz_benutzer').upsert({ benutzer_id: ME, ...S.ein }); if(error) fehler(error, 'Einstellungen'); }, 600); }

// ---------------------------------------------------------------------------
// Login
// ---------------------------------------------------------------------------
function zeige(id){ ['loginwrap','pendingWrap','appMain'].forEach(x => $(x).classList.toggle('hidden', x !== id)); }
async function pruefeAnmeldung(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ zeige('loginwrap'); $('userbar').classList.add('hidden'); return; }
  const { data: b } = await sb.from('benutzer').select('rolle,email,anzeigename').eq('id', session.user.id).maybeSingle();
  if(!b || !b.rolle){ zeige('pendingWrap'); return; }
  ME = session.user.id; ROLLE = b.rolle;
  $('userbar').classList.remove('hidden');
  $('userbarText').textContent = `${b.anzeigename || b.email} (${ROLLE_LABEL[b.rolle] || b.rolle})`;
  zeige('appMain');
  await ladeAlles();
}
$('loginBtn').addEventListener('click', async () => {
  const st = $('loginStatus'); st.textContent = 'Melde an …'; st.className = 'status';
  const { error } = await sb.auth.signInWithPassword({ email: $('loginEmail').value.trim(), password: $('loginPassword').value });
  if(error){ st.textContent = 'Login fehlgeschlagen: ' + error.message; st.className = 'status err'; return; }
  await pruefeAnmeldung();
});
$('loginPassword').addEventListener('keydown', e => { if(e.key === 'Enter') $('loginBtn').click(); });
$('logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

// ---------------------------------------------------------------------------
// Daten laden; eigenes Board beim ersten Mal mit Startlisten anlegen
// ---------------------------------------------------------------------------
// Board einer Person (eigenes oder das eines Kollegen, z. B. um in seine Team-box zu schreiben)
async function eigenesBoard(uid = ME){
  let { data: b, error } = await sb.from('pendenz_board').select('*').eq('typ', 'person').eq('besitzer_id', uid).maybeSingle();
  if(error) throw error;
  if(b) return b;
  ({ data: b, error } = await sb.from('pendenz_board').insert({ name: 'Mein Board', typ: 'person', besitzer_id: uid }).select().single());
  if(error) throw error;
  const arten = Object.values(S.arten).filter(a => a.aktiv).sort((x, y) => x.sortierung - y.sortierung);
  const rows = [1, 2, 3].map((z, i) => ({ board_id: b.id, zeit: z, titel: ZEIT[z].t, bereich: 'zeit', x: R, y: R + i * 120 }));
  rows.push({ board_id: b.id, art_id: 'team', titel: art('team').titel, bereich: 'team', x: R, y: R });
  rows.push({ board_id: b.id, art_id: 'notizen', titel: art('notizen').titel, bereich: 'team', x: R, y: R + 140 });
  arten.filter(a => !a.funktion).forEach((a, i) => rows.push({ board_id: b.id, art_id: a.id, titel: a.titel, bereich: 'mitte', x: R + (i % 3) * (LW + R), y: R + Math.floor(i / 3) * 140 }));
  const { error: e2 } = await sb.from('pendenz_liste').insert(rows); if(e2) throw e2;
  return b;
}
async function ladeAlles(){
  try {
    const [ra, rb, re] = await Promise.all([
      sb.from('pendenz_art').select('*').order('sortierung'),
      sb.from('benutzer').select('id,anzeigename,email'),
      sb.from('pendenz_benutzer').select('*').eq('benutzer_id', ME).maybeSingle()
    ]);
    if(ra.error) throw ra.error;
    S.arten = Object.fromEntries(ra.data.map(a => [a.id, a]));
    S.benutzer = Object.fromEntries((rb.data || []).map(b => [b.id, b]));
    // Pendenzen-Farbe pro Person (für gemeinsame Boards: wer hat die Pendenz eingetragen)
    const { data: pp } = await sb.from('pendenz_person_farbe').select('benutzer_id,farbe');
    S.pfarbe = Object.fromEntries((pp || []).map(x => [x.benutzer_id, x.farbe]));
    if(re.data) S.ein = { oeffnen: re.data.oeffnen, breiten: re.data.breiten || {}, farben: re.data.farben || {}, notizzettel: re.data.notizzettel || '' };
    // eigenes Board + gemeinsame Boards, in denen ich Mitglied bin
    const eigen = await eigenesBoard();
    const { data: ms } = await sb.from('pendenz_board_mitglied').select('board_id').eq('benutzer_id', ME);
    const ids = (ms || []).map(m => m.board_id);
    const { data: gb } = ids.length ? await sb.from('pendenz_board').select('*').in('id', ids).neq('typ', 'person').order('name') : { data: [] };
    S.boards = [eigen, ...(gb || [])];
    let gew = null; try { gew = localStorage.getItem('pz_board'); } catch(e){}
    S.board = S.boards.find(b => b.id === gew) || eigen;
    await ladeBoard();
  } catch(e){ fehler(e, 'Laden'); }
}
async function ladeBoard(){
  const { data: ls, error } = await sb.from('pendenz_liste').select('*').eq('board_id', S.board.id); if(error) return fehler(error, 'Listen');
  S.listen = ls; const ids = ls.map(l => l.id);
  const [rg, rp] = await Promise.all([
    sb.from('pendenz_gruppe').select('*').in('liste_id', ids).order('sortierung'),
    sb.from('pendenz').select('*').in('liste_id', ids).eq('erledigt', false)
  ]);
  if(rg.error) return fehler(rg.error); if(rp.error) return fehler(rp.error);
  S.gruppen = rg.data; S.pz = rp.data;
  S.mitglieder = [];
  if(S.board.typ !== 'person'){ const { data: mm } = await sb.from('pendenz_board_mitglied').select('benutzer_id').eq('board_id', S.board.id); S.mitglieder = (mm || []).map(m => m.benutzer_id); }
  const pids = S.pz.map(p => p.id);
  S.dateien = [];
  for(let i = 0; i < pids.length; i += 200){ const { data } = await sb.from('pendenz_datei').select('*').in('pendenz_id', pids.slice(i, i + 200)); S.dateien.push(...(data || [])); }
  zeichne();
}
let rzTimer = null;
window.addEventListener('resize', () => { clearTimeout(rzTimer); rzTimer = setTimeout(() => { if(S.board && !ld && !sd) zeichne(); }, 150); });
document.addEventListener('visibilitychange', () => { if(!document.hidden && S.board && !S.sel && !ld && !dc) ladeBoard(); });

// ---------------------------------------------------------------------------
// Zeichnen
// ---------------------------------------------------------------------------
function pdHtml(p, opt = {}){
  const l = listeById(p.liste_id), a = l.art_id ? art(l.art_id) : null, ind = [], fs = S.dateien.filter(d => d.pendenz_id === p.id);
  if(fs.some(d => d.art === 'mail')) ind.push(A('brief'));
  if(p.notiz && p.notiz.replace(/<[^>]*>/g, '').trim()) ind.push(K('notiz', 12));
  if(fs.some(d => d.art !== 'mail')) ind.push(K('foto', 12));
  if(p.planer_einsatz_id) ind.push(`<span title="Im Einsatzplaner">${K('kalender', 12)}</span>`);
  // gemeinsames Board: keine Zeit, Streifen links in der Pendenzen-Farbe der Person, die sie eingetragen hat; eigenes Board: Zeit-Streifen, Avatar bei fremden
  const gemeinsam = S.board.typ !== 'person', pf = gemeinsam && S.pfarbe?.[p.erstellt_von], notiz = l.art_id === 'notizen';
  if(!gemeinsam && p.erstellt_von && p.erstellt_von !== ME) ind.push(avatar(p.erstellt_von));
  // Team-box: vorne die Herkunft – rotes Mail-Icon (per Mail), Pfeil (von einem Kollegen im Tool zugeschoben)
  const herkunft = l.art_id === 'team' && p.herkunft ? `<span class="herk ${p.herkunft}" title="${p.herkunft === 'mail' ? 'Per Mail gekommen' : 'Von einem Kollegen zugeschoben'}">${p.herkunft === 'mail' ? A('brief') : K('senden', 14)}</span>` : '';
  return `<div class="card${S.sel === p.id ? ' sel' : ''}" draggable="true" data-card="${p.id}">
    ${gemeinsam ? `<span class="pr person" style="${pf ? `background:${pf}` : ''}"></span>`
      : notiz ? '<span class="pr person"></span>' // Notizen haben keine Zeit
      : `<button class="pr" data-zp="${p.id}" style="${p.zeit ? `background:${ZEIT[p.zeit].c}` : ''}" aria-label="Zeit: ${p.zeit ? ZEIT[p.zeit].t : 'irgendwann'}"></button>`}
    ${opt.zeit && a ? `<span class="ty" style="background:${listFarbe(l)}" title="${esc(l.titel)}">${A(a.icon)}</span>` : ''}${herkunft}
    <span class="tx">${esc(p.titel)}</span><span class="ind">${ind.join('')}</span></div>`;
}
function listHtml(l){

// Freie Anordnung: wächst eine Liste, weichen die Listen darunter nach unten aus (nur Anzeige – gespeicherte Lage bleibt,
// wird die Liste wieder kürzer, rücken sie zurück). Mindestabstand 20 px.
function entzerren(){
  document.querySelectorAll('.canvas[data-modus="frei"]').forEach(cv => {
    const sheet = cv.querySelector('.sheet'); if(!sheet) return;
    const items = [...sheet.querySelectorAll(':scope > .list')].map(el => ({ el, x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight })).sort((a, b) => a.y - b.y || a.x - b.x);
    const fertig = [];
    items.forEach(it => {
      let y = it.y, weiter = true;
      while(weiter){ weiter = false;
        for(const p of fertig) if(it.x < p.x + p.w && p.x < it.x + it.w && y < p.y + p.h + R && p.y < y + it.h){ y = p.y + p.h + R; weiter = true; } }
      if(y !== it.y) it.el.style.top = y + 'px';
      it.y = y; fertig.push(it); });
    sheet.style.height = (Math.max(0, ...items.map(i => i.y + i.h)) + 200) + 'px';
  });
}
// Board-Leiste eingefroren im Standard-Raster (4 Spalten à Listenbreite ab links), unabhängig davon, wie Listen

function platziereLeiste(){
  const bar = $('bbar'), b0 = bar.getBoundingClientRect(), slots = [...bar.querySelectorAll('.bslot')];
  slots.forEach(s => { s.classList.remove('bpos'); s.style.left = s.style.width = ''; });
  const rechts = bar.querySelector('.brechts').getBoundingClientRect();
  // Standard-Geometrie: Zeit-Bereich LW+24 breit (Liste bei 12), Trennlinie 9, Pendenzen-Spalten bei 12 + i·(LW+12)
  const links = i => i === 0 ? R : SEITE_MIN + 9 + R + (i - 1) * (LW + R); // gleiches Raster wie die Listen: 20 px Rand, 20 px Abstand
  if(b0.left + links(slots.length - 1) + LW > rechts.left - 8) return;

const isoTag = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const naechsterWerktag = () => { const d = new Date(); d.setDate(d.getDate() + 1); while(d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1); return isoTag(d); };
const datumCH = s => { const d = new Date(s); return isNaN(d) ? '' : d.toLocaleDateString('de-CH', { weekday:'short', day:'numeric', month:'numeric' }); };
// Auswahlfenster nach dem Ablegen auf «In anderes Board» / «In den Planer»
async function oeffnePick(artZiel, p){
  S.pick = { art: artZiel, id: p.id, q: '', daten: null, ziel: null, datum: naechsterWerktag() }; zeichneOver();
  if(artZiel === 'planer'){
    const [rp, rg] = await Promise.all([sb.from('planer_person').select('id,name,gruppe_id').eq('aktiv', true).order('name'), sb.from('planer_gruppe').select('id,name,sortierung').order('sortierung')]);
    if(rp.error) return fehler(rp.error, 'Planer'); if(S.pick) S.pick.daten = { personen: rp.data, gruppen: rg.data || [] };
  } else {
    // drei Teile: gemeinsame Boards · Büro-Team (Team-box) · Mitarbeitende (Pendenzen im Einsatzplaner), wie «Mithilfe» im Planer geordnet
    const [rp, rg] = await Promise.all([sb.from('planer_person').select('id,name,farbe,gruppe_id,benutzer_id,ist_projektleiter,aktiv').eq('aktiv', true).order('name'), sb.from('planer_gruppe').select('id,name')]);
    if(rp.error) return fehler(rp.error, 'Personen');
    const gname = id => (rg.data || []).find(g => g.id === id)?.name || '';
    const buero = rp.data.filter(x => /büro/i.test(gname(x.gruppe_id)) && x.benutzer_id && x.benutzer_id !== ME);
    const ma = rp.data.filter(x => !x.ist_projektleiter && !/büro|allgemein|planungshilfe/i.test(gname(x.gruppe_id)));
    const spalte = { rest: [], pflege: [], bau: [] }; ma.forEach(x => spalte[farbSpalte(x.farbe)].push(x));
    // pro Spalte dunkel → hell; links zuerst Blau (Marco), dann Braun, Personen ohne Farbe zuletzt
    const rang = x => !x.farbe ? 2 : (() => { const [r, g, b] = rgbVon(x.farbe); return b > r && b >= g ? 0 : 1; })();
    Object.values(spalte).forEach(l => l.sort((u, v) => rang(u) - rang(v) || hellwert(u.farbe || '#FFFFFF') - hellwert(v.farbe || '#FFFFFF')));
    if(S.pick) S.pick.daten = { boards: S.boards.filter(b => b.id !== S.board.id), buero, spalten: [spalte.rest, spalte.pflege, spalte.bau] };
    if(S.pick) S.pick.sel = new Set();
  }
  zeichneOver();
}
// Farbfamilie wie im Einsatzplaner («Mithilfe»): violett = Bau, kräftiges Orange/Gelb = Unterhalt/Pflege, übrige (braun, blau) = rest
const rgbVon = hex => { const d = parseInt((hex || '#000000').slice(1), 16) || 0; return [d >> 16, (d >> 8) & 255, d & 255]; };
const hellwert = hex => { const [r, g, b] = rgbVon(hex); return 0.299 * r + 0.587 * g + 0.114 * b; };
function farbSpalte(hex){
  const [r, g, b] = rgbVon(hex), mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0; if(d){ h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h = (h * 60 + 360) % 360; }
  const s = d / Math.max(1, mx), l = hellwert(hex) / 255;
  if(h >= 250 && h <= 300) return 'bau';
  if(h >= 18 && h <= 60 && l > .4 && (s > .65 || h > 40)) return 'pflege';
  return 'rest';
}

// Spracheingabe (Chrome/Edge): ins Feld «+ Pendenz» oder in die Notiz; nochmals tippen = stopp
let rec = null, recZiel = null;
function sprechen(zielId){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return toast('Spracheingabe geht in diesem Browser nicht. Bitte Chrome oder Edge verwenden.', null, true);
  if(rec){ const alt = recZiel; rec.stop(); if(alt === zielId) return; }
  const el = $(zielId); if(!el) return;
  const editor = el.isContentEditable, vorher = editor ? '' : el.value.trim();
  let fertig = '';
  const r = new SR(); rec = r; r.lang = 'de-CH'; r.interimResults = true; r.continuous = editor; recZiel = zielId;
  const knopf = on => document.querySelectorAll(`[data-mic="${zielId}"]`).forEach(b => b.classList.toggle('on', on));
  knopf(true);
  r.onresult = ev => { let zw = '';
    for(let i = ev.resultIndex; i < ev.results.length; i++){ const t = ev.results[i][0].transcript;
      if(!ev.results[i].isFinal){ zw += t; continue; }
      if(editor){ const z = $(zielId); if(!z) continue; z.focus(); const s = getSelection();
        if(!z.contains(s.anchorNode)){ const r = document.createRange(); r.selectNodeContents(z); r.collapse(false); s.removeAllRanges(); s.addRange(r); }
        document.execCommand('insertText', false, (z.textContent.trim() ? ' ' : '') + t.trim()); zielId === 'eb-det' ? speichereNotiz() : speichereZettel(); }
      else fertig += t; }
    if(!editor){ const z = $(zielId); if(z) z.value = [vorher, (fertig + zw).trim()].filter(Boolean).join(' '); } };
  r.onerror = ev => { if(ev.error === 'not-allowed') toast('Mikrofon ist blockiert. Im Browser oben links beim Schloss erlauben.', null, true); };
  r.onend = () => { knopf(false); if(rec === r){ rec = null; recZiel = null; } if(!editor) $(zielId)?.focus(); };
  r.start();
}
