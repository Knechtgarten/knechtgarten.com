<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=101"></script>
<title>Etiketten – Einstellungen</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#323E4E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kg-doku.js?v=9"></script>
<script src="/kg-etikette.js?v=5"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="/kg-sdb.js?v=1"></script>
<style>
.kgd-weg{display:flex;align-items:center;gap:6px;font-size:14px;color:#6B7079;flex-wrap:wrap;min-width:0;}
.kgd-weg a{color:#A63A52;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:2px;}
.kgd-weg b{color:#323E4E;font-size:15px;} .kgd-zurueck svg{transform:rotate(90deg);}
.ek{max-width:760px;margin:24px auto;padding:0 16px;display:flex;flex-direction:column;gap:14px;}
.ekarte{background:#fff;border:1px solid #E1E5E9;border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;}
.ekarte h2{margin:0;font-size:16px;color:#323E4E;display:flex;align-items:center;gap:10px;} .ekarte h2 .kgd-btn{margin-left:auto;}
.ereihe{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;} .ereihe .kgd-feld{flex:1;min-width:120px;}
.evorschau{display:flex;justify-content:center;padding:14px;background:#E3E7EC;border-radius:10px;overflow:auto;}
.evorschau iframe{border:0;background:#fff;box-shadow:0 4px 14px rgba(35,43,53,.18);transform-origin:top left;}
.evhalter{position:relative;}
.ewahl{border:1px solid #E1E5E9;border-radius:8px;padding:8px 10px;font-size:13.5px;line-height:1.45;background:#F5F7F9;display:flex;gap:8px;align-items:flex-start;}
.ewahl span{flex:1;}
.sdbl{display:flex;flex-direction:column;border:1px solid #E1E5E9;border-radius:8px;max-height:340px;overflow:auto;}
.sdbz{display:flex;align-items:center;gap:10px;padding:7px 10px;border-top:1px solid #EEF1F4;cursor:pointer;font-size:13.5px;} .sdbz:first-child{border-top:0;}
.sdbz input[type=checkbox]{width:16px;height:16px;accent-color:#323E4E;flex:none;}
.sdbn{flex:1;min-width:0;display:flex;flex-direction:column;} .sdbn small{color:#6B7079;font-size:12px;} .sdbn small.sdbfehlt{color:#B4423A;}
.sdbanz{width:70px!important;height:30px!important;flex:none;}
</style>
</head>
<body>
<header class="app"><div class="wrap">
  <a class="backlink" href="index.html">Startseite</a>
  <div class="brand"><h1>Einstellungen</h1></div>
  <span class="userbar hidden" id="userbar"><span id="userbarText"></span><button id="logoutBtn">Abmelden</button></span>
</div></header>
<span class="kgd-weg" data-kg-seite="links"><a class="kgd-zurueck" href="einstellungen-uebersicht-live-v1.html" id="zurueck"></a><span>/</span><b>Etiketten</b></span>
<main id="appMain"></main>
<script>
// Einstellungen › Allgemein › Etiketten: Format und Absender für alle Adressetiketten (app_einstellung 'etiketten', nur Admin ändert),
// Vorrat drucken: Adresse aus Kunden oder Lieferanten wählen, Anzahl, Vorschau, Drucken (kg-etikette.js).
const $ = id => document.getElementById(id);
async function aufbau(main){
  const { esc, ic } = KGD, sb = KGD.sb;
  KGE.verbinden(sb);
  $('zurueck').innerHTML = KG.icon('chev', 14) + 'Einstellungen';
  const { data: ich } = await sb.from('benutzer').select('rolle').eq('id', KGD.ich).maybeSingle();
  const admin = ich?.rolle === 'admin';
  let E = await KGE.laden(true), wahl = null, anzahl = 20;

  main.innerHTML = `<div class="ek">
    <div class="ekarte"><h2>Vorrat drucken</h2>
      <span class="kgd-hinweis">Etiketten für Empfänger, an die oft etwas geht (z. B. Aqua Solar für Rücksendungen). Einmal drucken und zum Versandmaterial legen.</span>
      <div class="ereihe"><div class="kgd-feld" style="flex:3"><label for="adrQ">Adresse</label><div id="adrBox"></div></div>
        <div class="kgd-feld" style="flex:0 0 100px"><label for="anz">Anzahl</label><input class="kgd-t" id="anz" type="number" min="1" max="200" value="${anzahl}"></div>
        <button type="button" class="kgd-btn prim" id="druck" style="height:36px">${ic('drucken', 14)}Drucken</button></div>
      <div class="evorschau"><div class="evhalter" id="evHalter"><iframe id="ev" title="Vorschau der Etikette" scrolling="no"></iframe></div></div></div>
    <div class="ekarte" id="sdb"><h2>Sicherheitsdatenblätter</h2>
      <span class="kgd-hinweis">Kleber für Kanister auf gelbem P-touch-Band (z. B. TZe-661). Der QR öffnet ohne Anmeldung das Datenblatt mit Notfallnummer Tox Info 145. Datenblätter und UFI-Nummer pflegst du im Nachschlagewerk beim Produkt.</span>
      <div id="sdbBox"><span class="kgd-hinweis">Lädt …</span></div></div>
    <div class="ekarte"><h2>Format und Absender${admin ? '<button type="button" class="kgd-btn ghost" id="speichern">Speichern</button>' : ''}</h2>
      <span class="kgd-hinweis">Gilt für alle Adressetiketten im Tool (z. B. Knopf «Etikette» in Kontakte). Brother-Rolle DK-11240 = 102 × 51 mm.${admin ? '' : ' Ändern kann nur ein Admin.'}</span>
      <div class="ereihe"><div class="kgd-feld"><label for="br">Breite (mm)</label><input class="kgd-t" id="br" type="number" min="40" max="200" value="${E.breite}" ${admin ? '' : 'disabled'}></div>
        <div class="kgd-feld"><label for="ho">Höhe (mm)</label><input class="kgd-t" id="ho" type="number" min="20" max="200" value="${E.hoehe}" ${admin ? '' : 'disabled'}></div></div>
      <div class="kgd-feld"><label>Absender (hochkant links)</label>
        ${[0, 1, 2].map(k => `<input class="kgd-t" data-abs="${k}" value="${esc(E.absender[k] || '')}" ${admin ? '' : 'disabled'} style="margin-bottom:6px">`).join('')}</div></div></div>`;

  // Adresse wählen: Kundenliste (kunde_suche) und Lieferanten
  function adrBox(){
    $('adrBox').innerHTML = wahl ? `<div class="ewahl"><span>${wahl.zeilen.map((s, i) => i === 0 ? `<b>${esc(s)}</b>` : esc(s)).join('<br>')}</span><button type="button" class="kg-ibtn" id="adrWeg" title="Andere Adresse">${ic('x', 12)}</button></div>`
      : `<input class="kgd-t" id="adrQ" autocomplete="off" placeholder="Kunde oder Lieferant suchen, z. B. Aqua Solar"><div class="kgd-menue hidden" id="adrM"></div>`;
    vorschau();
  }
  let T = null, lauf = 0, treffer = [];
  main.addEventListener('input', e => {
    if(e.target.id === 'adrQ'){ const q = e.target.value.trim(), m = $('adrM'); clearTimeout(T); if(q.length < 2){ m.classList.add('hidden'); return; }
      T = setTimeout(async () => { const nr = ++lauf, w = q.replace(/[%_,()]/g, ' ').trim();
        const [k, l] = await Promise.all([sb.rpc('kunde_suche', { q: w, anzahl: 8 }),
          sb.from('lieferant').select('id,firma,name,vorname,nachname,zusatz1,zusatz2,strasse,plz,ort,land').is('archiviert_am', null).or(`firma.ilike.%${w}%,name.ilike.%${w}%,ort.ilike.%${w}%`).limit(6)]);
        if(nr !== lauf) return;
        treffer = (l.data || []).filter(x => x.strasse).map(x => ({ art: 'Lieferant', zeilen: KGE.zeilen(x) }))
          .concat((k.data || []).map(x => ({ art: 'Kunde', zeilen: [x.name, x.strasse, [x.plz, x.ort].filter(Boolean).join(' ')].filter(Boolean) })));
        m.innerHTML = treffer.map((t, j) => `<button type="button" data-adr="${j}"><b>${esc(t.zeilen[0])}</b><small>${esc(t.art + ' · ' + t.zeilen.slice(1).join(', '))}</small></button>`).join('') || '<div class="kopfzeile">Nichts gefunden.</div>';
        m.classList.remove('hidden'); }, 250); }
    else if(e.target.id === 'anz'){ anzahl = Math.max(1, Math.min(200, +e.target.value || 1)); }
    else if(['br', 'ho'].includes(e.target.id) || e.target.dataset.abs != null){ E = { breite: +$('br').value || 102, hoehe: +$('ho').value || 51, absender: [0, 1, 2].map(k => main.querySelector(`[data-abs="${k}"]`).value.trim()).filter(Boolean) }; vorschau(); }
  });
  main.addEventListener('mousedown', e => { const b = e.target.closest('[data-adr]'); if(!b) return; e.preventDefault(); wahl = treffer[+b.dataset.adr]; adrBox(); });
  main.addEventListener('click', async e => {
    const b = e.target.closest('button'); if(!b) return;
    if(b.id === 'adrWeg'){ wahl = null; adrBox(); setTimeout(() => $('adrQ')?.focus(), 0); }
    if(b.id === 'druck'){ if(!wahl) return KGD.toast('Zuerst eine Adresse wählen.', true); KGE.verbinden(sb); await KGE.laden(true); KGE.drucken({ an: wahl.zeilen, anzahl }); }
    if(b.id === 'speichern'){ const wert = JSON.stringify({ breite: E.breite, hoehe: E.hoehe, absender: E.absender });
      const { error } = await sb.from('app_einstellung').upsert({ schluessel: 'etiketten', wert, aktualisiert_am: new Date().toISOString() });
      if(error) return KGD.toast('Speichern fehlgeschlagen: ' + error.message, true); KGE.verbinden(sb); KGD.toast('Gespeichert'); }
  });

  // Vorschau in Originalgrösse ×2 (1 mm ≈ 3.78 px)
  function vorschau(){
    const f = $('ev'), w = E.breite * 3.78, h = E.hoehe * 3.78, s = Math.min(2, 640 / w);
    f.style.width = w + 'px'; f.style.height = h + 'px'; f.style.transform = `scale(${s})`;
    $('evHalter').style.width = w * s + 'px'; $('evHalter').style.height = h * s + 'px';
    f.srcdoc = KGE.html(wahl ? wahl.zeilen : ['Empfänger wählen', 'Strasse 1', '3600 Ort'], E, 1);
  }
  // Sicherheitsdatenblätter: alle Produkte mit Datenblatt, ankreuzen + Anzahl, eine Serie auf den P-touch (kg-sdb.js)
  let sdbListe = [], sdbG = (() => { try { return localStorage.getItem('kgSdbGr') || 'M'; } catch(_){ return 'M'; } })();
  const sdbWahl = new Map();
  async function sdbLaden(){
    const { data: d } = await sb.from('wissen_datei').select('eintrag_id').eq('bereich', 'sdb').is('exemplar_id', null);
    const ids = [...new Set((d || []).map(x => x.eintrag_id))];
    const { data: e } = ids.length ? await sb.from('wissen_eintrag').select('id,titel,untertitel,ufi,sdb_code').in('id', ids).is('archiviert_am', null).order('titel') : { data: [] };
    sdbListe = e || []; sdbZeichnen();
  }
  function sdbZeichnen(){
    const box = $('sdbBox'); if(!box) return;
    if(!sdbListe.length){ box.innerHTML = '<span class="kgd-hinweis">Noch kein Produkt mit Sicherheitsdatenblatt. Im Nachschlagewerk beim Produkt unter Arbeitssicherheit hochladen.</span>'; return; }
    const total = [...sdbWahl.values()].reduce((s, n) => s + n, 0);
    box.innerHTML = `<div class="sdbl">${sdbListe.map(p => `<label class="sdbz"><input type="checkbox" data-sdbw="${p.id}"${sdbWahl.has(p.id) ? ' checked' : ''}>
        <span class="sdbn"><b>${esc(p.titel)}</b>${p.untertitel ? `<small>${esc(p.untertitel)}</small>` : ''}${p.ufi ? '' : '<small class="sdbfehlt">UFI-Nummer fehlt</small>'}</span>
        <input class="kgd-t sdbanz" type="number" min="1" max="50" data-sdba="${p.id}" value="${sdbWahl.get(p.id) || 1}" aria-label="Anzahl"${sdbWahl.has(p.id) ? '' : ' disabled'}></label>`).join('')}</div>
      <div class="ereihe" style="align-items:center"><div class="kg-seg" role="group" aria-label="Grösse">${Object.entries(KGS.GR).map(([k, mm]) => `<button type="button" data-sdbg="${k}" class="${k === sdbG ? 'on' : ''}">${k} · ${mm} mm</button>`).join('')}</div>
        <button type="button" class="kgd-btn prim" id="sdbDruck"${total ? '' : ' disabled'}>${ic('drucken', 14)}${total ? `${total} Kleber drucken` : 'Drucken'}</button></div>
      ${sdbListe[0] ? `<div class="evorschau" style="justify-content:flex-start">${KGS.vorschau({ titel: (sdbListe.find(p => sdbWahl.has(p.id)) || sdbListe[0]).titel, ufi: 'XXXX-XXXX-XXXX-XXXX', code: 'vorschauvorschau' }, sdbG)}</div>` : ''}`;
  }
  main.addEventListener('change', e => {
    const w = e.target.dataset.sdbw, a = e.target.dataset.sdba;
    if(w){ if(e.target.checked) sdbWahl.set(w, 1); else sdbWahl.delete(w); sdbZeichnen(); }
    if(a && sdbWahl.has(a)){ sdbWahl.set(a, Math.max(1, Math.min(50, +e.target.value || 1))); sdbZeichnen(); }
  });
  main.addEventListener('click', async e => {
    const g = e.target.closest('[data-sdbg]'); if(g){ sdbG = g.dataset.sdbg; try { localStorage.setItem('kgSdbGr', sdbG); } catch(_){} sdbZeichnen(); return; }
    if(e.target.closest('#sdbDruck')){
      try { const liste = [];
        for(const p of sdbListe.filter(p => sdbWahl.has(p.id))){ await KGS.code(sb, p); liste.push({ titel: p.titel, ufi: p.ufi, code: p.sdb_code, anzahl: sdbWahl.get(p.id) }); }
        KGS.drucken(liste, sdbG);
      } catch(err){ KGD.toast(err.message, true); }
    }
  });
  sdbLaden().then(() => { if(location.hash === '#sdb') $('sdb')?.scrollIntoView({ block: 'start' }); });
  adrBox();
}
KGD.start(aufbau);
</script>
</body>
</html>
