<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Tool (live) – Pflege &amp; Service Jahresplan</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg:#F5F7F9; --card:#FFFFFF; --primary:#323E4E; --primary-l:#4C5C70;
  --ink:#232B35; --muted:#8B9097; --line:#E1E5E9; --soft:#EEF3F7;
  --accent-blue:#D6E7F4; --accent-lime:#D1DB5F; --accent-lime-light:#F4F6D8; --danger:#B4655F;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--ink);line-height:1.45;font-size:13px;}
.wrap{max-width:1400px;margin:0 auto;padding:0 16px;}
.hidden{display:none !important;}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;}

header.app{background:var(--primary);color:#fff;}
header.app .backlink{display:inline-flex;align-items:center;gap:5px;color:var(--primary);text-decoration:none;font-size:12px;font-weight:700;flex-shrink:0;background:var(--accent-lime);border-radius:20px;padding:6px 12px;}
header.app .backlink:hover{background:#c3cd52;}
header.app .wrap{display:flex;align-items:center;gap:20px;padding:0 16px;}
header.app .brand{padding:11px 0;}
header.app .brand h1{font-size:15px;font-weight:600;color:#fff;}
header.app .brand .sub{font-size:11px;opacity:.75;margin-top:1px;}
header.app .userbar{display:flex;align-items:center;gap:10px;margin-left:auto;}
header.app .userbar span{opacity:.85;font-size:11.5px;}
header.app .userbar button{font-size:11.5px;color:#c7ccd1;background:none;border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:3px 9px;cursor:pointer;}
header.app .userbar button:hover{background:rgba(255,255,255,.1);color:#fff;}
nav.subnav{background:#fff;border-bottom:1px solid var(--line);}
nav.subnav .wrap{display:flex;gap:2px;}
nav.subnav a{display:flex;align-items:center;gap:7px;padding:12px 12px 10px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;text-decoration:none;font-size:12.5px;}
nav.subnav a:hover{color:var(--primary);}
nav.subnav a.on{color:var(--primary);border-bottom-color:var(--primary);}
nav.subnav a .i{width:16px;height:16px;}

main.wrap{padding-top:20px;padding-bottom:40px;}
main.with-side{max-width:none;margin-left:max(0px, calc((100vw - 1400px) / 2));padding-right:396px;}
h1.page{font-size:19px;color:var(--primary);font-variant-numeric:tabular-nums;}
h3{font-size:13px;color:var(--primary);}
.muted{color:var(--muted);} .small{font-size:11.5px;}
.head{margin-bottom:12px;}
.yr-sw{display:flex;align-items:center;gap:10px;}
input[type=text],select,textarea{font:inherit;font-size:12.5px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 8px;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);}
.btn{border:none;border-radius:7px;padding:7px 14px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-l);}
.btn-primary:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;}
.btn-ghost{background:#fff;color:var(--primary);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--primary);}
.icon-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;flex:none;border-radius:50%;border:1px solid var(--primary);background:#fff;color:var(--primary);box-sizing:border-box;}
.icon-btn .i{width:14px;height:14px;}
.icon-btn:hover{background:var(--primary);color:#fff;}
.hint{font-size:12px;color:var(--muted);background:var(--soft);border-radius:6px;padding:9px 11px;}
.kdot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;border:1px solid rgba(50,62,78,.25);}

.vj{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-left:3px solid var(--danger);border-radius:7px;padding:8px 12px;margin-bottom:12px;font-size:12.5px;}
.kat-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;}
.kat-tabs button{all:unset;cursor:pointer;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:12.5px;display:inline-flex;gap:6px;align-items:center;}
.kat-tabs button[aria-pressed="true"]{background:var(--primary);color:#fff;border-color:var(--primary);}
.kat-tabs .n{font-size:11px;opacity:.7;}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.abof{display:inline-flex;align-items:center;gap:4px;padding-right:8px;}
.abof .muted{margin-right:4px;}
.abob{all:unset;cursor:pointer;border-radius:50%;padding:2px;display:inline-flex;border:2px solid transparent;}
.abob[aria-pressed="true"]{border-color:var(--primary);}
.abob.off{opacity:.3;}
.abob:hover{opacity:1;}
.aboi{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;}
.aboi .i{width:14px;height:14px;}
.aboi.a1{background:#323E4E;color:#fff;}
.aboi.a2{background:#D6E7F4;color:#323E4E;}
.aboi.a3{border:1px solid #8B9097;color:#8B9097;}
.tip{position:relative;}
/* Einsatz im Plan: Name der Kategorie + Arbeiten sofort beim Darueberfahren */
.jtip{position:relative;}
.jtip:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 5px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#323E4E;color:#fff;font-size:11.5px;font-weight:600;padding:4px 8px;border-radius:5px;z-index:40;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.18);}
.tip:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#323E4E;color:#fff;font-size:11.5px;font-weight:500;padding:4px 8px;border-radius:5px;z-index:40;pointer-events:none;}
.ms{position:relative;}
.ms summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;background:#fff;max-width:260px;}
.ms summary::-webkit-details-marker{display:none;}
.ms summary .i{width:15px;height:15px;}
.msf-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ms-panel{position:absolute;top:calc(100% + 4px);left:0;z-index:30;min-width:200px;background:#fff;border:1px solid var(--line);border-radius:7px;box-shadow:0 6px 20px rgba(30,37,48,.14);padding:6px;display:flex;flex-direction:column;}
.ms-panel label{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:5px;cursor:pointer;font-size:12.5px;}
.ms-panel label:hover{background:var(--soft);}
.ms-panel input{accent-color:var(--primary);width:15px;height:15px;}
.ms-panel .ms-none{all:unset;cursor:pointer;padding:7px 8px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:4px;}
.seg{display:inline-flex;}
.seg button{all:unset;cursor:pointer;padding:6px 11px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--primary);}
.seg button + button{border-left:0;}
.seg button:first-child{border-radius:6px 0 0 6px;}
.seg button:last-child{border-radius:0 6px 6px 0;}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff;border-color:var(--primary);}

/* Jahresplan-Raster */
.plan-wrap{overflow:auto;max-height:70vh;background:#fff;border:1px solid var(--line);border-radius:7px;}
.plan{border-collapse:separate;border-spacing:0;width:max-content;}
.plan th,.plan td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);height:30px;}
.plan thead th{position:sticky;background:#fff;z-index:2;text-align:center;font-size:10.5px;color:var(--muted);font-weight:600;}
.plan thead tr:first-child th{top:0;height:24px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;}
.plan thead tr:nth-child(2) th{top:24px;height:24px;}
.plan .nm{position:sticky;left:0;background:#fff;z-index:1;text-align:left;padding:0 10px;box-sizing:border-box;min-width:210px;max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.plan thead .nm,.plan thead .ob{z-index:3;}
/* Spalte Objekt: eigene Zeile pro Objekt (Hauptadresse = leer) */
.plan .ob{position:sticky;left:210px;background:#fff;z-index:1;text-align:left;padding:0 10px;box-sizing:border-box;min-width:160px;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;color:#6B7420;}
.plan tfoot .ob{background:var(--soft);}
.plan .nm a{color:var(--ink);text-decoration:none;font-weight:700;cursor:pointer;}
.plan .nm a:hover{text-decoration:underline;}
.plan .nm .s{font-size:11px;color:var(--muted);font-weight:400;margin-left:6px;}
.plan td.c{width:34px;min-width:34px;text-align:center;vertical-align:middle;padding:2px 0;}
.plan td.c.now,.plan th.now{background:#F2F5D6;}
.plan td.c.leer{cursor:copy;}
.plan td.c.leer:hover{background:var(--soft);}
.plan td.c.leer:hover::after,.plan td.c.neu::after{content:"+";color:var(--muted);font-size:14px;line-height:1;}
.plan td.c.neu{background:var(--accent-blue);}
.plan tfoot td{position:sticky;bottom:0;background:var(--soft);font-size:10.5px;text-align:center;font-weight:700;border-top:1px solid var(--line);}
.plan tfoot .nm{background:var(--soft);font-size:11.5px;}
.job{display:flex;align-items:center;justify-content:center;height:15px;margin:1px 2px;border-radius:2px;font-size:9px;font-weight:700;letter-spacing:.03em;line-height:1;padding:0;cursor:pointer;border:1px solid rgba(50,62,78,.18);width:calc(100% - 4px);background:var(--kc);color:var(--kt);}
.job:hover{filter:brightness(.92);}
.job.sel{outline:2px solid var(--primary);outline-offset:1px;}
.job .i{width:12px;height:12px;stroke-width:2.4;}
.count{font-size:11.5px;color:var(--muted);margin-top:8px;}

/* Kunden-Popup (Mouse-over Name) */
.pop{position:fixed;z-index:50;width:270px;max-width:calc(100vw - 16px);background:#fff;border:1px solid var(--line);border-radius:7px;box-shadow:0 6px 24px rgba(30,37,48,.14);padding:12px 14px;display:flex;flex-direction:column;gap:9px;}
.pop[hidden]{display:none;}
.pk-row{display:flex;gap:8px;align-items:flex-start;}
.pk-row > .i{color:var(--muted);margin-top:1px;width:16px;height:16px;}
.pk-row a{color:var(--ink);font-weight:700;font-size:14px;text-decoration:none;}
.pk-row a:hover{text-decoration:underline;}
.pk-row .icon-btn{margin-left:auto;}

/* Seitenfenster */
.sidepanel{position:fixed;top:0;right:0;bottom:0;z-index:45;width:380px;max-width:100vw;background:#fff;border-left:1px solid var(--line);box-shadow:-6px 0 24px rgba(30,37,48,.10);overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:16px 20px 24px;}
.sd-head{display:flex;justify-content:space-between;align-items:center;}
.sd-meta{display:flex;gap:8px;align-items:center;}
.kchip{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:5px;background:var(--kc);color:var(--kt);border:1px solid rgba(50,62,78,.18);}
.sd-k{font-size:18px;color:var(--primary);}
.sd-k a{color:inherit;text-decoration:none;}
.sd-k a:hover{text-decoration:underline;}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.stat button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;padding:8px 0;border-radius:6px;border:1px solid var(--line);font-weight:700;font-size:12.5px;color:var(--muted);}
.stat button .i{width:15px;height:15px;}
.stat .s-offen[aria-pressed="true"]{background:#323E4E;color:#fff;border-color:#323E4E;}
.stat .s-erl[aria-pressed="true"]{background:#D1DB5F;color:#323E4E;border-color:#D1DB5F;}
.sd-sec{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
.sd-item{border-bottom:1px solid var(--line);}
.sd-item summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:58px minmax(0,1fr) 18px;gap:8px;align-items:center;padding:8px 0;}
.sd-item summary::-webkit-details-marker{display:none;}
.sd-item summary .i{width:16px;height:16px;color:var(--muted);transition:transform .15s;}
.sd-item[open] summary .i{transform:rotate(180deg);}
.sd-art{font-size:11.5px;color:var(--muted);}
.sd-n{font-size:13px;}
.sd-item > ol,.sd-item > div{margin:0 0 10px 66px;font-size:12.5px;}
.dlist{padding-left:18px;display:flex;flex-direction:column;gap:4px;}
.sd-b{white-space:pre-wrap;line-height:1.5;}
.sd-dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);border-top:1px solid var(--line);}
.sd-dl dt,.sd-dl dd{padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.sd-dl dt{color:var(--muted);}
.sd-dl dd{white-space:pre-wrap;}
.sd-dl .full{grid-column:1/-1;}
.sd-dl dt.full{border-bottom:0;padding-bottom:0;}
.sd-l{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-right:8px;}
.sd-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;}
.tabl-w{overflow-x:auto;border:1px solid var(--line);border-radius:6px;margin-top:4px;}
.tabl{width:100%;border-collapse:collapse;font-size:11.5px;}
.tabl th{font-size:10px;padding:5px 6px;background:var(--soft);white-space:nowrap;text-align:left;color:var(--muted);}
.tabl td{padding:5px 6px;border-bottom:1px solid var(--soft);white-space:nowrap;}
.field{display:flex;flex-direction:column;gap:4px;}
.field > label{font-size:11px;color:var(--muted);}
.row-end{display:flex;justify-content:flex-end;gap:8px;}

.sd-doks{display:flex;flex-direction:column;}
.sd-dok{all:unset;cursor:pointer;display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--soft);font-size:12.5px;}
.sd-dok:hover span{text-decoration:underline;}
.sd-dok .i{color:var(--danger);width:17px;height:17px;flex:none;}
.sd-dok small{display:block;color:var(--muted);font-size:11px;}
.sd-fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;}
.sd-foto{all:unset;cursor:zoom-in;aspect-ratio:4/3;border-radius:5px;background:var(--soft);overflow:hidden;}
.sd-foto img{width:100%;height:100%;object-fit:cover;display:block;}
.lb{position:fixed;inset:0;z-index:80;background:rgba(20,25,32,.9);display:flex;align-items:center;justify-content:center;padding:50px 60px;}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;}
.lb .lb-x{position:absolute;top:14px;right:14px;}
.lb .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;}
.lb .lb-nav.l{left:14px;} .lb .lb-nav.r{right:14px;}
.lb .lb-cap{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#fff;font-size:12.5px;}
.toastwrap{position:fixed;bottom:16px;left:16px;z-index:70;display:flex;flex-direction:column;gap:6px;}
.toast{background:var(--primary);color:#fff;font-size:12.5px;padding:9px 14px;border-radius:7px;box-shadow:0 6px 20px rgba(0,0,0,.2);}
.toast.err{background:var(--danger);}
.loginwrap{min-height:80vh;display:flex;align-items:center;justify-content:center;}
.logincard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:28px 26px;width:100%;max-width:320px;}
.logincard h2{font-size:16px;color:var(--primary);margin-bottom:14px;}
.logincard .fld{margin-bottom:10px;}
.logincard label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;}
.logincard input{width:100%;font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;}
.status{font-size:11.5px;color:var(--muted);margin-top:6px;}
.status.err{color:var(--danger);}
.pendingcard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:28px 26px;width:100%;max-width:360px;text-align:center;}
.pendingcard h2{font-size:16px;color:var(--primary);margin-bottom:10px;}
.pendingcard p{font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:16px;}
.card{background:#fff;border:1px solid var(--line);border-radius:11px;}
@media (max-width:900px){ main.with-side{padding-right:16px;} }
/* Bewaesserungsplan (nur lesen), Ventile abwechselnd weiss/grau */
.bp-l{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:7px;overflow:hidden;font-size:12.5px;}
.bp-v{padding:5px 9px;display:grid;gap:1px;}
.bp-v:nth-child(even){background:#E3E8EE;}
.bp-m{display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums;}
.bp-m span:first-child{font-weight:600;min-width:86px;}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const $ = id => document.getElementById(id);
const SUPABASE_URL = 'https://oalapdxinqlnzwxhyuzy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_DoeD4uEnwemmnFu4AxE9uw_5lmQYc5P';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const ROLLE_LABEL = { admin: 'Admin', buero_team: 'Büro-Team', mitarbeitende: 'Mitarbeitende', service_team: 'Service-Team' };

const I = id => `<svg class="i"><use href="#i-${id}"/></svg>`;
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(message, isErr){
  const t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : '');
  t.textContent = message;
  $('toastwrap').appendChild(t);
  setTimeout(() => t.remove(), isErr ? 5000 : 1600);
}
const friendlyError = e => e?.message || 'Unbekannter Fehler';

// ---------------------------------------------------------------------------
// Login / Rollen-Gate (vorerst nur Buero-Team + Admin)
// ---------------------------------------------------------------------------
let aktuelleRolle = null, aktuelleUserId = null;
function zeigeNur(id){ ['loginwrap','pendingWrap','keinZugriff','appMain'].forEach(x => $(x).classList.toggle('hidden', x !== id)); }
async function pruefeAnmeldung(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ zeigeNur('loginwrap'); return; }
  aktuelleUserId = session.user.id;
  const { data: benutzer } = await sb.from('benutzer').select('rolle,email').eq('id', session.user.id).maybeSingle();
  if(!benutzer || !benutzer.rolle){ zeigeNur('pendingWrap'); return; }
  aktuelleRolle = benutzer.rolle;
  $('userbar').classList.remove('hidden');
  $('userbarText').textContent = `${benutzer.email} (${ROLLE_LABEL[benutzer.rolle] || benutzer.rolle})`;
  // Techniker / Mitarbeitende arbeiten mit der Handy-Ansicht
  if(aktuelleRolle !== 'admin' && aktuelleRolle !== 'buero_team'){ location.replace('pflege-handy-live-v1.html' + location.hash); return; }
  zeigeNur('appMain');
  await ladeAlles();
}
$('loginBtn').addEventListener('click', async () => {
  const statusEl = $('loginStatus');
  statusEl.textContent = 'Melde an …'; statusEl.className = 'status';
  const { error } = await sb.auth.signInWithPassword({ email: $('loginEmail').value.trim(), password: $('loginPassword').value });
  if(error){ statusEl.textContent = 'Login fehlgeschlagen: ' + error.message; statusEl.className = 'status err'; return; }
  await pruefeAnmeldung();
});
$('logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });
$('pendingLogoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

// ---------------------------------------------------------------------------
// Hilfen (gleich wie pflege-kunden-live-v1.html)
// ---------------------------------------------------------------------------
const ABO = [
  { id: 'ohne_voranmeldung', n: 'Abo ohne Voranmeldung', ic: 'repeat', cls: 'a1' },
  { id: 'mit_voranmeldung',  n: 'Abo mit Voranmeldung',  ic: 'phone',  cls: 'a2' },
  { id: 'kein_abo',          n: 'Kein Abo (nur Daten)',  ic: 'minus',  cls: 'a3' }
];
const aboIcon = id => { const a = ABO.find(x => x.id === id) || ABO[2]; return `<span class="aboi ${a.cls} tip" data-tip="${a.n}" aria-label="${a.n}">${I(a.ic)}</span>`; };
function isoKw(d = new Date()){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const tag = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - tag);
  const j0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - j0) / 86400000 + 1) / 7);
}
const KW_NOW = isoKw(), YEAR_NOW = new Date().getFullYear();
const wochenImJahr = y => isoKw(new Date(y, 11, 28));   // 52 oder 53
const MONATE = [['Jan',1,5],['Feb',6,9],['Mär',10,13],['Apr',14,18],['Mai',19,22],['Jun',23,26],['Jul',27,31],['Aug',32,35],['Sep',36,39],['Okt',40,44],['Nov',45,48],['Dez',49,53]];
const nachReihe = (a, b) => (a.reihenfolge ?? 0) - (b.reihenfolge ?? 0);
function txtOn(hex){
  const n = parseInt(String(hex).slice(1), 16), r = n>>16, g = (n>>8)&255, b = n&255;
  return (0.299*r + 0.587*g + 0.114*b) / 255 > 0.6 ? '#323E4E' : '#FFFFFF';
}
const katStyle = k => `--kc:${esc(k.farbe)};--kt:${txtOn(k.farbe)}`;
const dot = k => `<span class="kdot" style="background:${esc(k.farbe)}"></span>`;
function zustName(id){
  const b = S.zust.find(x => x.id === id);
  if(!b) return 'Unbekannt';
  if(b.anzeigename) return b.anzeigename;
  return b.email.split('@')[0].split(/[._-]+/).filter(Boolean).map(s => s[0].toUpperCase() + s.slice(1)).join(' ');
}
const telVon = k => { const c = k.kunde?.kontaktdaten || {}; return c.telefon1 || c.mobil || c.telefon2 || ''; };

// ---------------------------------------------------------------------------
// Daten
// ---------------------------------------------------------------------------
const S = {
  kat: [], felder: [], arbeiten: [], tabellen: [], spalten: [], zust: [],
  kunden: [], obj: [], kk: [], kz: [], ka: [], status: new Set(), fotos: [], fk: [], urls: {}, lb: null,
  jahr: YEAR_NOW, katSel: [], f: { abo: [], ma: [], status: '' },
  side: null, neu: null, scroll: null
};
const katById = id => S.kat.find(k => k.id === id);
const felderVon = katId => S.felder.filter(f => f.kategorie_id === katId).sort(nachReihe);
const tabelleVon = katId => S.tabellen.find(t => t.kategorie_id === katId);
const spaltenVon = tabId => S.spalten.filter(s => s.tabelle_id === tabId).sort(nachReihe);
const zustVon = kkId => S.kz.filter(z => z.kunde_kategorie_id === kkId).map(z => z.benutzer_id);
const kundeById = id => S.kunden.find(k => k.kunde_id === id);
const objById = id => id ? S.obj.find(o => o.id === id) : null;
const objekteVon = kundeId => S.obj.filter(o => o.kunde_id === kundeId).sort((a, b) => nachReihe(a, b) || a.erstellt_am.localeCompare(b.erstellt_am));
const objektName = o => [o.strasse, o.ort].filter(Boolean).join(', ') || 'Neues Objekt';
const detailLink = (kundeId, objektId) => `pflege-kunden-live-v1.html#k=${kundeId}${objektId ? '&o=' + objektId : ''}`;
const statusKey = (kkId, jahr, kw) => `${kkId}|${jahr}|${kw}`;

async function ladeAlles(){
  const r = await Promise.all([
    sb.from('pflege_kategorie').select('*').order('reihenfolge'),
    sb.from('pflege_feld').select('*'),
    sb.from('pflege_arbeit').select('*'),
    sb.from('pflege_tabelle').select('*'),
    sb.from('pflege_tabelle_spalte').select('*'),
    sb.rpc('pflege_zustaendige'),
    sb.from('pflege_kunde').select('*, kunde(id,name,strasse,plz,ort,kontaktdaten)'),
    sb.from('pflege_objekt').select('*'),
    sb.from('pflege_kunde_kategorie').select('*'),
    sb.from('pflege_kunde_kategorie_zustaendig').select('*'),
    sb.from('pflege_kunde_arbeit').select('*'),
    sb.from('pflege_einsatz_status').select('kunde_kategorie_id,jahr,kw'),
    sb.from('pflege_foto').select('*').order('aufgenommen_am', { ascending: false }),
    sb.from('pflege_foto_kategorie').select('*'),
    sb.from('pflege_dokument').select('*').order('datum', { ascending: false, nullsFirst: false }),
    sb.from('pflege_dokument_kategorie').select('*')
  ]);
  const fehler = r.find(x => x.error);
  if(fehler){ showToast(friendlyError(fehler.error), true); return; }
  let st;
  [S.kat, S.felder, S.arbeiten, S.tabellen, S.spalten, S.zust, S.kunden, S.obj, S.kk, S.kz, S.ka, st, S.fotos, S.fk, S.dok, S.dk] = r.map(x => x.data || []);
  S.status = new Set(st.map(s => statusKey(s.kunde_kategorie_id, s.jahr, s.kw)));
  S.kunden.sort((a, b) => (a.kunde?.name || '').localeCompare(b.kunde?.name || '', 'de'));
  render();
}

// Einsaetze eines Kunden in einem Jahr: jede Woche jeder Arbeit (Standard-Wochen +/- Abweichung) in den Jahren, in denen sie gilt
function arbeitName(ka){ return ka.arbeit_id ? (S.arbeiten.find(a => a.id === ka.arbeit_id)?.name || '') : (ka.titel || 'Zusatzarbeit'); }
function wochenVon(ka){
  if(!ka.arbeit_id) return [...(ka.kws || [])].sort((a, b) => a - b);
  const std = S.arbeiten.find(a => a.id === ka.arbeit_id)?.standard_kws || [], minus = ka.kws_minus || [];
  return [...new Set([...std.filter(w => !minus.includes(w)), ...(ka.kws_plus || [])])].sort((a, b) => a - b);
}
// objektId: null = Hauptadresse, id = nur dieses Objekt, undefined = alles des Kunden
function jobsVon(kundeId, jahr, objektId){
  const out = [];
  S.kk.filter(x => x.kunde_id === kundeId && (objektId === undefined || (x.objekt_id || null) === objektId)).forEach(kk => {
    const kat = katById(kk.kategorie_id); if(!kat) return;
    S.ka.filter(x => x.kunde_kategorie_id === kk.id).forEach(ka => {
      if(ka.arbeit_id && !S.arbeiten.some(a => a.id === ka.arbeit_id)) return;
      if((ka.abgewaehlte_jahre || []).includes(jahr)) return;
      wochenVon(ka).filter(kw => kw <= wochenImJahr(jahr)).forEach(kw => out.push({ kk, kat, kw, ka, zust: zustVon(kk.id) }));
    });
  });
  return out;
}
const erledigt = (kkId, jahr, kw) => S.status.has(statusKey(kkId, jahr, kw));

// ---------------------------------------------------------------------------
// Darstellung
// ---------------------------------------------------------------------------
const zustPass = (zust, sel) => !sel.length || sel.some(s => s === '-' ? zust.length === 0 : zust.includes(s));
function zustFilterHtml(){
  const sel = S.f.ma;
  const ids = [...new Set(S.kz.map(z => z.benutzer_id))];
  const opts = [['-', 'Niemand zuständig'], ...S.zust.filter(b => b.pflege_zustaendig || ids.includes(b.id)).map(b => [b.id, zustName(b.id)])];
  const label = !sel.length ? 'Alle Zuständigen' : opts.filter(o => sel.includes(o[0])).map(o => o[1]).join(', ');
  return `<details class="ms" id="fma">
    <summary>${I('user')}<span class="msf-l">${esc(label)}</span>${I('chev')}</summary>
    <div class="ms-panel">
      ${opts.map(([v, l]) => `<label><input type="checkbox" data-act="f-ma" value="${esc(v)}" ${sel.includes(v) ? 'checked' : ''}>${esc(l)}</label>`).join('')}
      <button type="button" class="ms-none" data-act="f-ma-alle">Alle Zuständigen</button>
    </div>
  </details>`;
}
// Liegengebliebenes: im laufenden Jahr vor der aktuellen Woche, im Folgejahr aus dem laufenden Jahr
function offeneVor(jahr, bisKw){
  const n = new Set();
  S.kunden.forEach(k => jobsVon(k.kunde_id, jahr).forEach(j => { if(j.kw < bisKw && !erledigt(j.kk.id, jahr, j.kw)) n.add(statusKey(j.kk.id, jahr, j.kw)); }));
  return n.size;
}
function vorjahrHinweis(){
  if(S.jahr !== YEAR_NOW && S.jahr !== YEAR_NOW + 1) return '';
  const n = offeneVor(YEAR_NOW, KW_NOW);
  if(!n || (S.jahr === YEAR_NOW && S.f.status === 'offen')) return '';
  const txt = S.jahr === YEAR_NOW
    ? `${n} ${n === 1 ? 'Einsatz' : 'Einsätze'} vor KW ${KW_NOW} ${n === 1 ? 'ist' : 'sind'} noch offen.`
    : `Aus ${YEAR_NOW} ${n === 1 ? 'ist' : 'sind'} noch ${n} ${n === 1 ? 'Einsatz' : 'Einsätze'} offen.`;
  return `<div class="vj"><span>${txt}</span><button class="btn btn-ghost" data-act="vj">Offene ${YEAR_NOW} anzeigen</button></div>`;
}

function render(){
  const jahr = S.jahr, f = S.f, kws = Array.from({ length: wochenImJahr(jahr) }, (_, i) => i + 1);
  const statusPass = j => !f.status || erledigt(j.kk.id, jahr, j.kw) === (f.status === 'erledigt');
  const katPass = j => !S.katSel.length || S.katSel.includes(j.kat.id);
  const kundePass = k => !f.abo.length || f.abo.includes(k.abo_typ);
  // eine Zeile pro Kunde (Hauptadresse) und pro Objekt
  const zeilen = S.kunden.filter(kundePass)
    .flatMap(k => [null, ...objekteVon(k.kunde_id)].map(o => ({ k, o, jobs: jobsVon(k.kunde_id, jahr, o ? o.id : null).filter(j => katPass(j) && zustPass(j.zust, f.ma) && statusPass(j)) })))
    .filter(z => z.jobs.length);
  const zaehle = id => S.kunden.filter(k => kundePass(k) && jobsVon(k.kunde_id, jahr).some(j => (id === 'alle' || j.kat.id === id) && zustPass(j.zust, f.ma) && statusPass(j))).length;
  const proWoche = Array(54).fill(0);
  zeilen.forEach(z => new Set(z.jobs.map(j => j.kw + '|' + j.kat.id)).forEach(x => proWoche[+x.split('|')[0]]++));
  const jetzt = w => jahr === YEAR_NOW && w === KW_NOW;

  const zelle = (z, w) => {
    const kats = [...new Set(z.jobs.filter(j => j.kw === w).map(j => j.kk.id))].map(id => z.jobs.find(j => j.kk.id === id));
    const oid = z.o ? z.o.id : '';
    const neu = S.neu && S.neu.kundeId === z.k.kunde_id && (S.neu.objektId || '') === oid && S.neu.kw === w;
    return `<td class="c${jetzt(w) ? ' now' : ''}${kats.length ? '' : ' leer'}${neu ? ' neu' : ''}" data-kunde="${z.k.kunde_id}" data-objekt="${oid}" data-kw="${w}">${kats.map(j => {
      const done = erledigt(j.kk.id, jahr, w), sel = S.side && S.side.kkId === j.kk.id && S.side.kw === w;
      // Mouse-over: Kategorie, Arbeiten dieser Woche und Status (Details per Klick im Seitenfenster)
      const arb = [...new Set(z.jobs.filter(x => x.kk.id === j.kk.id && x.kw === w).map(x => arbeitName(x.ka)).filter(Boolean))];
      const tip = `${j.kat.name}${arb.length ? ': ' + arb.join(', ') : ''} · ${done ? 'erledigt' : 'offen'}`;
      return `<button class="job jtip${sel ? ' sel' : ''}" style="${katStyle(j.kat)}" data-act="job" data-kk="${j.kk.id}" data-kw="${w}" data-tip="${esc(tip)}" aria-label="${esc(j.kat.name)} KW ${w}, ${done ? 'erledigt' : 'offen'}">${done ? I('check') : esc(j.kat.kuerzel)}</button>`;
    }).join('')}</td>`;
  };

  const altScroll = document.querySelector('.plan-wrap')?.scrollLeft;
  $('app').innerHTML = `
    <div class="head">
      <div class="yr-sw"><button class="icon-btn" data-act="jahr" data-d="-1" aria-label="Vorjahr">${I('back')}</button><h1 class="page">Jahresplan ${jahr}</h1><button class="icon-btn" data-act="jahr" data-d="1" aria-label="Nächstes Jahr">${I('next')}</button></div>
      <div class="muted small">Klick auf einen Einsatz: Arbeiten, Angaben und Status. Klick auf «+» in einer leeren Woche: Arbeit für diese KW hinzufügen.</div>
    </div>
    ${vorjahrHinweis()}
    <div class="kat-tabs" role="group" aria-label="Pflegekategorie">
      ${[{ id: 'alle', name: 'Alle' }, ...S.kat].map(c => `<button data-act="kat" data-kat="${c.id}" aria-pressed="${c.id === 'alle' ? !S.katSel.length : S.katSel.includes(c.id)}">${c.farbe ? dot(c) : ''}${esc(c.name)}<span class="n">${zaehle(c.id)}</span></button>`).join('')}
    </div>
    <div class="filters">
      <div class="abof" role="group" aria-label="Abo-Typ"><span class="muted small">Abo</span>${ABO.map(a =>
        `<button class="abob${f.abo.length && !f.abo.includes(a.id) ? ' off' : ''}" data-act="f-abo" data-abo="${a.id}" aria-pressed="${f.abo.includes(a.id)}">${aboIcon(a.id)}</button>`).join('')}</div>
      ${zustFilterHtml()}
      <div class="seg" role="group" aria-label="Status">${[['', 'Alle'], ['offen', 'Offen'], ['erledigt', 'Erledigt']].map(([v, l]) =>
        `<button data-act="f-status" data-v="${v}" aria-pressed="${f.status === v}">${l}</button>`).join('')}</div>
    </div>
    <div class="plan-wrap"><table class="plan">
      <thead>
        <tr><th class="nm"></th><th class="ob"></th>${MONATE.map(([m, a, b]) => { const n = Math.min(b, kws.length) - a + 1; return n > 0 ? `<th colspan="${n}">${m}</th>` : ''; }).join('')}</tr>
        <tr><th class="nm small">Kunde</th><th class="ob small">Objekt</th>${kws.map(w => `<th class="${jetzt(w) ? 'now' : ''}">${w}</th>`).join('')}</tr>
      </thead>
      <tbody>${zeilen.map(z => `<tr><td class="nm"><a data-act="kunde" data-kunde="${z.k.kunde_id}" href="${detailLink(z.k.kunde_id, z.o?.id)}">${esc(z.k.kunde?.name)}</a><span class="s">${esc(z.k.kunde?.ort)}</span></td><td class="ob"${z.o ? ` title="${esc(objektName(z.o))}"` : ''}>${z.o ? esc(objektName(z.o)) : ''}</td>${kws.map(w => zelle(z, w)).join('')}</tr>`).join('')
        || `<tr><td class="nm muted">Keine Einsätze</td><td class="ob"></td>${kws.map(() => '<td class="c"></td>').join('')}</tr>`}</tbody>
      <tfoot><tr><td class="nm">Einsätze pro Woche</td><td class="ob"></td>${kws.map(w => `<td>${proWoche[w] || ''}</td>`).join('')}</tr></tfoot>
    </table></div>
    <div class="count">${zeilen.length} ${zeilen.length === 1 ? 'Zeile' : 'Zeilen'} (Kunden und Objekte) ·${proWoche.reduce((a, b) => a + b, 0)} Einsätze${jahr === YEAR_NOW ? ` · aktuelle Woche KW ${KW_NOW} hervorgehoben` : ''}</div>`;
  const pw = document.querySelector('.plan-wrap');
  pw.scrollLeft = altScroll ?? S.scroll ?? Math.max(0, (KW_NOW - 8) * 35);
  S.scroll = pw.scrollLeft;
  renderSide();
}

// ---------------------------------------------------------------------------
// Seitenfenster: Einsatz (Kunde + Kategorie + KW) oder «Arbeit hinzufuegen»
// ---------------------------------------------------------------------------
// Bewaesserungsplan nur lesen: pro Ventil Name + Sensor, darunter je Muster eine Zeile
const BP_TAGE = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const bpTage = t => { const s = [...(t || [])].sort((a, b) => a - b); if(s.length === 7) return 'täglich'; if(s.length === 5 && s.every((x, i) => x === i)) return 'Mo–Fr'; return s.map(i => BP_TAGE[i]).join(' '); };
function bpLese(kk){
  const vl = kk.bewaesserung || [];
  if(!vl.length) return '<span class="muted">–</span>';
  return `<div class="bp-l">${vl.map(v => `<div class="bp-v"><div><b>${esc(v.name)}</b>${v.sensor ? ` <span class="muted small">· ${esc(v.sensor)}</span>` : ''}</div>
    ${(v.muster || []).map(m => `<div class="bp-m"><span>${esc(m.von)}–${esc(m.bis)}</span><span>${bpTage(m.tage)}</span><span>${m.gw == null ? 'ohne Sensor' : m.gw + ' %'}</span>${m.zr ? `<span>${esc(m.zr)}</span>` : ''}</div>`).join('') || '<div class="muted small">Keine Zeiten hinterlegt</div>'}
    ${v.bem ? `<div class="muted small"><i>${esc(v.bem)}</i></div>` : ''}</div>`).join('')}</div>`;
}
function tabLese(kk, tab){
  const sp = spaltenVon(tab.id), rows = kk.tabelle_zeilen || [];
  if(!rows.length) return '<span class="muted">–</span>';
  const z = (s, v) => { if(s.typ === 'zeitspanne'){ const [a, b] = String(v || '|').split('|'); return a || b ? `${esc(a)}–${esc(b)}` : ''; } return v == null || v === '' ? '' : esc(v) + (s.typ === 'zahl' && s.einheit ? ` ${esc(s.einheit)}` : ''); };
  return `<div class="tabl-w"><table class="tabl"><thead><tr>${sp.map(s => `<th>${esc(s.name)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${sp.map(s => `<td>${z(s, r[s.id])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function renderSide(){
  $('appMain').classList.toggle('with-side', !!(S.side || S.neu));
  if(S.neu) return renderNeu();
  if(!S.side){ $('side').innerHTML = ''; return; }
  const kk = S.kk.find(x => x.id === S.side.kkId), kw = S.side.kw, jahr = S.jahr;
  if(!kk){ S.side = null; $('side').innerHTML = ''; return; }
  const kat = katById(kk.kategorie_id), k = kundeById(kk.kunde_id), ku = k.kunde || {}, o = objById(kk.objekt_id);
  const adr = o || ku;
  const done = erledigt(kk.id, jahr, kw);
  const jobs = jobsVon(kk.kunde_id, jahr, kk.objekt_id || null).filter(j => j.kk.id === kk.id && j.kw === kw);
  const punkte = t => (t || '').split('\n').map(s => s.replace(/^[-•*\d.)\s]+/, '').trim()).filter(Boolean);
  const arbeiten = jobs.map(j => {
    const a = j.ka.arbeit_id && S.arbeiten.find(x => x.id === j.ka.arbeit_id);
    const p = punkte(a ? a.ablauf : j.ka.beschrieb);
    return `<details class="sd-item" open>
      <summary><span class="sd-art">${a ? 'Standard' : 'Zusatz'}</span><span class="sd-n">${esc(arbeitName(j.ka))}</span>${I('chev')}</summary>
      ${p.length ? (a ? `<ol class="dlist">${p.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : `<div class="sd-b">${p.map(esc).join('\n')}</div>`) : `<div class="muted small">${a ? 'Kein Ablauf erfasst.' : 'Kein Beschrieb erfasst.'}</div>`}
    </details>`;
  }).join('') || '<div class="muted small">Keine Arbeiten in dieser Woche.</div>';
  const wert = f => {
    const v = (kk.werte || {})[f.id];
    if(v == null || v === '') return '<span class="muted">–</span>';
    if(f.typ === 'janein') return v === 'ja' ? 'Ja' : 'Nein';
    return esc(v) + (f.typ === 'zahl' && f.einheit ? ` ${esc(f.einheit)}` : '');
  };
  const tab = !kat.individuell && tabelleVon(kat.id);
  const angaben = kat.individuell ? '<div class="muted small">Für «Individuell» gibt es keine Angaben.</div>' : `
    <dl class="sd-dl">${felderVon(kat.id).map(f => { const c = f.typ === 'notiz' ? ' class="full"' : ''; return `<dt${c}>${esc(f.name)}</dt><dd${c}>${wert(f)}</dd>`; }).join('')}</dl>
    ${kat.sondertabelle === 'bewaesserung' ? `<div class="sd-l" style="margin-top:8px">Bewässerungsplan</div>${bpLese(kk)}` : tab ? `<div class="sd-l" style="margin-top:8px">${esc(tab.name)}</div>${tabLese(kk, tab)}` : ''}`;
  const zust = zustVon(kk.id);
  $('side').innerHTML = `
    <aside class="sidepanel" aria-label="Einsatz ${esc(kat.name)} KW ${kw}">
      <div class="sd-head"><div class="sd-meta"><span class="kchip" style="${katStyle(kat)}">${esc(kat.name)}</span><span class="muted small">KW ${kw} · ${jahr}</span></div>
        <button class="icon-btn" data-act="side-zu" aria-label="Seitenfenster schliessen">${I('x')}</button></div>
      <h2 class="sd-k"><a href="${detailLink(kk.kunde_id, kk.objekt_id)}">${esc(ku.name)}</a></h2>
      ${o ? '<div class="small" style="color:#6B7420;font-weight:700">Objekt</div>' : ''}
      <div class="muted small">${esc([adr.strasse, [adr.plz, adr.ort].filter(Boolean).join(' ')].filter(Boolean).join(', '))}</div>
      ${o?.notiz ? `<div class="hint" style="white-space:pre-wrap">${esc(o.notiz)}</div>` : ''}
      ${k.notiz ? `<div class="hint" style="white-space:pre-wrap">${esc(k.notiz)}</div>` : ''}
      <div class="stat" role="group" aria-label="Status">
        <button data-act="status" data-v="offen" class="s-offen" aria-pressed="${!done}">Offen</button>
        <button data-act="status" data-v="erledigt" class="s-erl" aria-pressed="${done}">${I('check')}Erledigt</button>
      </div>
      <section class="sd-sec"><h3>Arbeiten</h3><div>${arbeiten}</div></section>
      <section class="sd-sec"><h3>Angaben / Eckdaten</h3>${angaben}</section>
      ${(() => { const dl = (S.dok || []).filter(d => d.kunde_id === kk.kunde_id && (d.objekt_id || null) === (kk.objekt_id || null) && !d.ersetzt && (() => { const k2 = S.dk.filter(x => x.dokument_id === d.id).map(x => x.kategorie_id); return !k2.length || k2.includes(kk.kategorie_id); })());
        return dl.length ? `<section class="sd-sec"><h3>Angebote und Dokumente</h3><div class="sd-doks">${dl.map(d =>
          `<button class="sd-dok" data-act="dok" data-dok="${d.id}">${I('file')}<span>${esc(d.titel)}<small>${esc(d.easybill_nummer || 'PDF')}${d.datum ? ' · ' + esc(d.datum.split('-').reverse().join('.')) : ''}</small></span></button>`).join('')}</div></section>` : ''; })()}
      ${(() => { const fl = fotosFuer(kk); return fl.length ? `<section class="sd-sec"><h3>Fotos</h3><div class="sd-fotos">${fl.map(f =>
        `<button class="sd-foto" data-act="lb" data-foto="${f.id}" aria-label="${esc(f.beschriftung || 'Foto')} vergrössern">${S.urls[vorschauPfad(f.storage_pfad)] ? `<img alt="" src="${esc(S.urls[vorschauPfad(f.storage_pfad)])}">` : ''}</button>`).join('')}</div></section>` : ''; })()}
      <div class="sd-foot"><span class="sd-l">Zuständig</span>${zust.length ? esc(zust.map(zustName).join(', ')) : '<span class="muted">Niemand zuständig</span>'}</div>
    </aside>`;
  ladeFotoUrls(fotosFuer(kk));
}

// Fotos im Seitenfenster: mit Schlagwort dieser Kategorie oder ohne Zuordnung (privater Speicher, Links 1 h gueltig)
const vorschauPfad = p => p.replace(/\.jpg$/, '_t.jpg');
const fotoKats = fotoId => S.fk.filter(x => x.foto_id === fotoId).map(x => x.kategorie_id);
const fotosFuer = kk => S.fotos.filter(f => f.kunde_id === kk.kunde_id && (f.objekt_id || null) === (kk.objekt_id || null) && (!fotoKats(f.id).length || fotoKats(f.id).includes(kk.kategorie_id)));
let urlsZeit = Date.now();
async function ladeFotoUrls(fotos){
  if(Date.now() - urlsZeit > 50 * 60000){ S.urls = {}; urlsZeit = Date.now(); }
  const pfade = fotos.flatMap(f => [f.storage_pfad, vorschauPfad(f.storage_pfad)]).filter(p => !S.urls[p]);
  if(!pfade.length) return;
  const { data, error } = await sb.storage.from('pflege-fotos').createSignedUrls(pfade, 3600);
  if(error){ showToast(friendlyError(error), true); return; }
  (data || []).forEach(d => { if(d.signedUrl) S.urls[d.path] = d.signedUrl; });
  document.querySelectorAll('.sd-foto[data-foto]').forEach(b => {
    const f = S.fotos.find(x => x.id === b.dataset.foto), url = f && S.urls[vorschauPfad(f.storage_pfad)];
    if(url && !b.querySelector('img')) b.innerHTML = `<img alt="" src="${esc(url)}">`;
  });
}
const datumCh = iso => { const d = new Date(iso); return `${d.getDate()}.${d.getMonth() + 1}.${d.getFullYear()}`; };
function zeigeLb(){
  const el = $('lb');
  if(!S.lb){ el.classList.add('hidden'); el.innerHTML = ''; return; }
  const { liste, i } = S.lb, f = S.fotos.find(x => x.id === liste[i]);
  const kats = fotoKats(f.id).map(id => katById(id)?.name).filter(Boolean);
  el.innerHTML = `
    <button class="icon-btn lb-x" data-lb="zu" aria-label="Schliessen">${I('x')}</button>
    ${liste.length > 1 ? `<button class="icon-btn lb-nav l" data-lb="-1" aria-label="Vorheriges">${I('back')}</button><button class="icon-btn lb-nav r" data-lb="1" aria-label="Nächstes">${I('next')}</button>` : ''}
    ${S.urls[f.storage_pfad] ? `<img alt="" src="${esc(S.urls[f.storage_pfad])}">` : '<span style="color:#fff">Bild wird geladen …</span>'}
    <div class="lb-cap">${esc([f.beschriftung, datumCh(f.aufgenommen_am), kats.join(', ')].filter(Boolean).join(' · '))} · ${i + 1} / ${liste.length}</div>`;
  el.classList.remove('hidden');
}
$('lb').addEventListener('click', e => {
  const b = e.target.closest('[data-lb]');
  if(e.target.id === 'lb' || b?.dataset.lb === 'zu'){ S.lb = null; return zeigeLb(); }
  if(b){ const n = S.lb.liste.length; S.lb.i = (S.lb.i + +b.dataset.lb + n) % n; zeigeLb(); }
});
function renderNeu(){
  const n = S.neu, k = kundeById(n.kundeId), o = objById(n.objektId), kks = S.kk.filter(x => x.kunde_id === n.kundeId && (x.objekt_id || null) === (n.objektId || null));
  if(!kks.some(x => x.id === n.kkId)) n.kkId = kks[0]?.id;
  const kk = kks.find(x => x.id === n.kkId), kat = kk && katById(kk.kategorie_id);
  // alle Standardarbeiten der Kategorie, die in dieser Woche noch nicht eingeplant sind
  const kaVon = a => S.ka.find(x => x.kunde_kategorie_id === kk?.id && x.arbeit_id === a.id);
  const frei = !kat || kat.individuell ? [] : S.arbeiten.filter(a => a.kategorie_id === kat.id && !(kaVon(a) && wochenVon(kaVon(a)).includes(n.kw))).sort(nachReihe);
  const art = kat?.individuell ? 'zus' : n.art;
  $('side').innerHTML = `
    <aside class="sidepanel" aria-label="Arbeit hinzufügen">
      <div class="sd-head"><div class="sd-meta"><span class="muted small">Arbeit hinzufügen · KW ${n.kw}</span></div>
        <button class="icon-btn" data-act="side-zu" aria-label="Schliessen">${I('x')}</button></div>
      <h2 class="sd-k">${esc(k.kunde?.name)}</h2>
      ${o ? `<div class="small" style="color:#6B7420;font-weight:700">Objekt ${esc(objektName(o))}</div>` : ''}
      <div class="field"><label for="nk">Pflegekategorie</label><select id="nk" data-act="neu-kat">${kks.map(x => { const c = katById(x.kategorie_id); return `<option value="${x.id}" ${x.id === n.kkId ? 'selected' : ''}>${esc(c?.name)}</option>`; }).join('')}</select></div>
      ${kat?.individuell ? '' : `<div class="seg" role="group" aria-label="Art">
        <button data-act="neu-art" data-v="std" aria-pressed="${art === 'std'}">Standardarbeit</button><button data-act="neu-art" data-v="zus" aria-pressed="${art === 'zus'}">Zusatzarbeit</button></div>`}
      ${art === 'std'
        ? (frei.length
          ? `<div class="field"><label for="ns">Standardarbeit</label><select id="ns">${frei.map(a => `<option value="${a.id}">${esc(a.name)}${kaVon(a) ? ' (schon eingeplant, Woche dazu)' : ''}</option>`).join('')}</select></div>
             <div class="muted small">KW ${n.kw} wird bei diesem Kunden dazu genommen, jedes Jahr.</div>`
          : `<div class="hint">Alle Standardarbeiten von «${esc(kat?.name)}» sind bei diesem Kunden schon eingeplant.</div>`)
        : `<div class="field"><label for="nt">Arbeit</label><input id="nt" type="text" placeholder="z. B. Rosen zurückschneiden"></div>
           <div class="field"><label for="nb">Infos</label><textarea id="nb" rows="4" placeholder="Was genau zu tun ist, Material, Hinweise"></textarea></div>
           <div class="muted small">Wird bei diesem Kunden in KW ${n.kw} eingeplant, jedes Jahr.</div>`}
      <div class="row-end"><button class="btn btn-ghost" data-act="side-zu">Abbrechen</button><button class="btn btn-primary" data-act="neu-add" ${art === 'std' && !frei.length ? 'disabled' : ''}>Hinzufügen</button></div>
    </aside>`;
}

// ---------------------------------------------------------------------------
// Ereignisse
// ---------------------------------------------------------------------------
document.addEventListener('click', async e => {
  document.querySelectorAll('details.ms[open]').forEach(d => { if(!d.contains(e.target)) d.open = false; });
  const b = e.target.closest('[data-act]');
  if(b && b.dataset.act === 'kunde') return;   // normaler Link zum Kunden-Detail
  if(!b){
    const td = e.target.closest('.plan td.c.leer');
    if(td){
      const kundeId = td.dataset.kunde, objektId = td.dataset.objekt || null, kw = +td.dataset.kw;
      S.side = null;
      S.neu = S.neu && S.neu.kundeId === kundeId && S.neu.objektId === objektId && S.neu.kw === kw ? null : { kundeId, objektId, kw, art: 'std', kkId: null };
      render(); $('nt')?.focus();
    }
    return;
  }
  if(b.tagName === 'INPUT' || b.tagName === 'SELECT') return;
  const act = b.dataset.act, f = S.f;
  if(act === 'jahr'){ S.jahr += +b.dataset.d; S.side = null; S.neu = null; render(); }
  else if(act === 'vj'){ S.jahr = YEAR_NOW; f.status = 'offen'; S.side = null; S.neu = null; render(); document.querySelector('.plan-wrap').scrollLeft = 0; }
  else if(act === 'kat'){
    const id = b.dataset.kat;
    S.katSel = id === 'alle' ? [] : (S.katSel.includes(id) ? S.katSel.filter(x => x !== id) : [...S.katSel, id]);
    if(S.katSel.length === S.kat.length) S.katSel = [];
    render();
  }
  else if(act === 'f-abo'){
    const a = b.dataset.abo; f.abo = f.abo.includes(a) ? f.abo.filter(x => x !== a) : [...f.abo, a];
    if(f.abo.length === ABO.length) f.abo = [];
    render();
  }
  else if(act === 'f-ma-alle'){ f.ma = []; render(); }
  else if(act === 'f-status'){ f.status = b.dataset.v; render(); }
  else if(act === 'job'){
    const kkId = b.dataset.kk, kw = +b.dataset.kw;
    S.neu = null;
    S.side = S.side && S.side.kkId === kkId && S.side.kw === kw ? null : { kkId, kw };
    render();
  }
  else if(act === 'side-zu'){ S.side = null; S.neu = null; render(); }
  else if(act === 'dok'){
    const d = S.dok.find(x => x.id === b.dataset.dok), w = window.open('', '_blank');
    const { data, error } = await sb.storage.from('pflege-dokumente').createSignedUrl(d.storage_pfad, 3600);
    if(error){ w?.close(); showToast(friendlyError(error), true); return; }
    if(w) w.location = data.signedUrl; else location.href = data.signedUrl;
  }
  else if(act === 'lb'){
    const liste = fotosFuer(S.kk.find(x => x.id === S.side.kkId)).map(f => f.id);
    S.lb = { liste, i: Math.max(0, liste.indexOf(b.dataset.foto)) }; zeigeLb();
  }
  else if(act === 'status'){
    const { kkId, kw } = S.side, key = statusKey(kkId, S.jahr, kw), soll = b.dataset.v === 'erledigt';
    if(soll === S.status.has(key)) return;
    const { error } = soll
      ? await sb.from('pflege_einsatz_status').insert({ kunde_kategorie_id: kkId, jahr: S.jahr, kw, erledigt_von: aktuelleUserId })
      : await sb.from('pflege_einsatz_status').delete().eq('kunde_kategorie_id', kkId).eq('jahr', S.jahr).eq('kw', kw);
    if(error){ showToast(friendlyError(error), true); return; }
    if(soll) S.status.add(key); else S.status.delete(key);
    showToast(soll ? 'Als erledigt markiert.' : 'Wieder offen.');
    render();
  }
  else if(act === 'neu-art'){ S.neu.art = b.dataset.v; renderSide(); }
  else if(act === 'neu-add'){
    const n = S.neu, kk = S.kk.find(x => x.id === n.kkId), kat = katById(kk.kategorie_id);
    let row, vorhanden = null;
    if($('ns') && !kat.individuell && n.art === 'std'){
      const a = S.arbeiten.find(x => x.id === $('ns').value), std = a.standard_kws || [];
      vorhanden = S.ka.find(x => x.kunde_kategorie_id === kk.id && x.arbeit_id === a.id);
      if(vorhanden){
        // Woche dazu: weggelassene Standard-Woche zurueckholen oder als zusaetzliche Woche
        row = std.includes(n.kw)
          ? { kws_minus: (vorhanden.kws_minus || []).filter(w => w !== n.kw) }
          : { kws_plus: [...new Set([...(vorhanden.kws_plus || []), n.kw])].sort((x, y) => x - y) };
      } else {
        // neu beim Kunden: nur diese Woche (die anderen Standard-Wochen weglassen)
        row = { kunde_kategorie_id: kk.id, arbeit_id: a.id, kws_plus: std.includes(n.kw) ? [] : [n.kw], kws_minus: std.filter(w => w !== n.kw) };
      }
    } else {
      const titel = $('nt').value.trim();
      if(!titel){ $('nt').focus(); showToast('Bitte einen Titel für die Arbeit eingeben.', true); return; }
      row = { kunde_kategorie_id: kk.id, titel, beschrieb: $('nb').value.trim() || null, kws: [n.kw] };
    }
    const { data, error } = vorhanden
      ? await sb.from('pflege_kunde_arbeit').update(row).eq('id', vorhanden.id).select().single()
      : await sb.from('pflege_kunde_arbeit').insert(row).select().single();
    if(error){ showToast(friendlyError(error), true); return; }
    if(vorhanden) Object.assign(vorhanden, data); else S.ka.push(data);
    S.neu = null; S.side = { kkId: kk.id, kw: n.kw };
    showToast('Arbeit hinzugefügt.');
    render();
  }
});
document.addEventListener('change', e => {
  const el = e.target, act = el.dataset.act;
  if(act === 'f-ma'){
    S.f.ma = el.checked ? [...S.f.ma, el.value] : S.f.ma.filter(v => v !== el.value);
    render(); $('fma').open = true;
  }
  else if(act === 'neu-kat'){ S.neu.kkId = el.value; renderSide(); }
});
document.addEventListener('keydown', e => {
  if(S.lb){
    if(e.key === 'Escape'){ S.lb = null; zeigeLb(); }
    if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){ const n = S.lb.liste.length; S.lb.i = (S.lb.i + (e.key === 'ArrowRight' ? 1 : -1) + n) % n; zeigeLb(); }
    return;
  }
  if(e.key === 'Escape' && (S.side || S.neu)){ S.side = null; S.neu = null; render(); }
});

// Mouse-over auf dem Kundennamen: Adresse, Telefon (anrufbar + kopierbar), Notiz
let popTimer = null, popFuer = null;
function zeigePop(a){
  clearTimeout(popTimer);
  if(popFuer === a && !$('pop').hidden) return;
  popFuer = a;
  const k = kundeById(a.dataset.kunde), ku = k.kunde || {}, tel = telVon(k);
  $('pop').innerHTML = `
    <strong>${esc(ku.name)}</strong>
    <div class="pk-row">${I('pin')}<span>${esc(ku.strasse)}<br>${esc([ku.plz, ku.ort].filter(Boolean).join(' '))}</span></div>
    ${tel ? `<div class="pk-row">${I('phone')}<a href="tel:${esc(tel.replace(/\s+/g, ''))}">${esc(tel)}</a><button class="icon-btn" id="popCopy" title="Nummer kopieren" aria-label="Nummer kopieren">${I('copy')}</button></div>` : ''}
    ${k.notiz ? `<div class="muted small" style="white-space:pre-wrap">${esc(k.notiz)}</div>` : ''}`;
  const pop = $('pop'); pop.hidden = false;
  const r = a.getBoundingClientRect();
  pop.style.left = Math.max(8, r.left) + 'px';
  let y = r.bottom + 6; if(y + pop.offsetHeight > innerHeight - 8) y = r.top - pop.offsetHeight - 6;
  pop.style.top = y + 'px';
  $('popCopy')?.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(tel); showToast('Nummer kopiert.'); } catch { showToast('Kopieren nicht möglich.', true); }
  });
}
const versteckePop = () => { popTimer = setTimeout(() => { $('pop').hidden = true; popFuer = null; }, 220); };
document.addEventListener('mouseover', e => { const a = e.target.closest('.plan .nm a[data-kunde]'); if(a) zeigePop(a); });
document.addEventListener('mouseout', e => { if(e.target.closest('.plan .nm a[data-kunde]')) versteckePop(); });
$('pop').addEventListener('mouseenter', () => clearTimeout(popTimer));
$('pop').addEventListener('mouseleave', versteckePop);

pruefeAnmeldung();
</script>
