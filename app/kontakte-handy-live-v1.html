<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=66"></script>
<title>Kontakte – Knechtgarten</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#323E4E">
<style>
/* Kontakte fürs Handy: wie die Kontakte-App – Suche, Liste A–Z, Karte mit Anrufen/Mail/Navigation/Kundenordner/Pendenzen.
   Bearbeiten und alles Weitere bleibt im Kontakte-Tool am PC (tool-d-kunden-live-v1.html). */
:root{ --bg:#F5F7F9; --primary:#323E4E; --ink:#232B35; --muted:#6B7079; --line:#E1E5E9; }
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);line-height:1.4;font-size:15px;-webkit-tap-highlight-color:transparent;}
.hidden{display:none !important;}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.kopf{position:sticky;top:0;z-index:20;background:var(--primary);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;flex-direction:column;gap:10px;}
.kopf b{font-size:19px;}
.such{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:0 10px;height:42px;color:var(--muted);}
.such input{all:unset;flex:1;min-width:0;font-size:16px;color:var(--ink);}
.seg{display:flex;background:rgba(255,255,255,.12);border-radius:9px;padding:3px;}
.seg button{all:unset;flex:1;text-align:center;font-size:13.5px;font-weight:600;padding:6px 0;border-radius:7px;color:#D6E7F4;cursor:pointer;}
.seg button.on{background:#fff;color:var(--primary);}
.liste{padding:0 28px calc(90px + env(safe-area-inset-bottom,0px)) 0;}
.buchst{position:sticky;top:var(--kopf,124px);z-index:5;background:var(--bg);padding:6px 16px 4px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.05em;}
.k{all:unset;box-sizing:border-box;display:flex;flex-direction:column;width:100%;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);cursor:pointer;}
.k b{font-size:15.5px;font-weight:600;}
.k small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.az{position:fixed;right:2px;top:calc(var(--kopf,124px) + 6px);bottom:calc(80px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:space-between;align-items:center;width:24px;z-index:15;touch-action:none;}
.az span{font-size:10.5px;font-weight:700;color:var(--primary);line-height:1;padding:1px 0;}
.leer{padding:24px 16px;color:var(--muted);font-size:14px;text-align:center;}
/* Karte */
.karte{position:fixed;inset:0;z-index:95;background:var(--bg);overflow-y:auto;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));}
.khead{background:var(--primary);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 20px;display:flex;flex-direction:column;gap:10px;}
.khead button{all:unset;cursor:pointer;display:flex;align-items:center;gap:4px;font-size:15px;color:#D6E7F4;padding:6px 4px;width:max-content;}
.khead h1{font-size:22px;line-height:1.25;padding:0 4px;}
.khead .adr{font-size:14px;opacity:.85;padding:0 4px;}
.aktion{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 12px 4px;}
.aktion a,.aktion button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--primary);background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 4px;text-align:center;}
.aktion svg.i{width:24px;height:24px;}
.aktion .aus{opacity:.35;pointer-events:none;}
.block{margin:12px 12px 0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.block h2{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 14px 4px;}
.zeile{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);}
.zeile:first-of-type{border-top:0;}
.zeile .w{flex:1;min-width:0;}
.zeile .w small{display:block;font-size:12px;color:var(--muted);}
.zeile .w span{display:block;font-size:15.5px;word-break:break-word;}
.zeile a.r{width:40px;height:40px;border-radius:50%;background:#D6E7F4;color:var(--primary);display:flex;align-items:center;justify-content:center;flex:none;}
.loginwrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);z-index:99}
.logincard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
.logincard input{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
.logincard button{all:unset;cursor:pointer;text-align:center;height:46px;border-radius:12px;background:var(--primary);color:#fff;font-weight:600;}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:#323E4E;color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;z-index:120;max-width:90%;}
.toast.err{background:#7A2638;}
</style>
</head>
<body>
<div class="loginwrap hidden" id="loginwrap"><div class="logincard"><b style="font-size:18px;color:#323E4E">Knechtgarten</b>
  <input autocomplete="username" id="loginEmail" type="email" placeholder="E-Mail"><input autocomplete="current-password" id="loginPassword" type="password" placeholder="Passwort">
  <button type="button" id="loginBtn">Anmelden</button><div style="font-size:13px;color:#6B7079" id="loginStatus"></div></div></div>

<div id="app" class="hidden">
  <div class="kopf" id="kopf"><b>Kontakte</b>
    <label class="such"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input type="search" id="q" placeholder="Name, Ort, Telefon …" aria-label="Kontakte durchsuchen" autocomplete="off" data-lpignore="true" data-1p-ignore="true"></label>
    <div class="seg" role="group" aria-label="Art"><button type="button" class="on" data-art="kunden">Kunden</button><button type="button" data-art="lief">Lieferanten</button></div>
  </div>
  <div class="liste" id="liste"><div class="leer">Lädt …</div></div>
  <div class="az" id="az"></div>
</div>
<div class="karte hidden" id="karte"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kg-doku.js?v=9"></script>
<script src="/kg-kundenordner.js?v=6"></script>
<script>
const sb = window.supabase.createClient('https://oalapdxinqlnzwxhyuzy.supabase.co', 'sb_publishable_DoeD4uEnwemmnFu4AxE9uw_5lmQYc5P');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const svg = p => `<svg class="i" viewBox="0 0 24 24">${p}</svg>`;
const IC = {
  tel: svg('<path d="M5 3.5h3.5l1.7 4.3-2.2 1.4a11 11 0 0 0 6.8 6.8l1.4-2.2 4.3 1.7V19a1.5 1.5 0 0 1-1.6 1.5C10.6 20 4 13.4 3.5 5.1A1.5 1.5 0 0 1 5 3.5z"/>'),
  mail: svg('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>'),
  nav: svg('<path d="M12 21s-6.5-5.6-6.5-11A6.5 6.5 0 0 1 18.5 10c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>'),
  ordner: svg('<path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2h8.4A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/>'),
  wa: svg('<path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21"/>'),
  zurueck: svg('<path d="M15 5l-7 7 7 7"/>')
};
const toast = (t, err) => { const d = document.createElement('div'); d.className = 'toast' + (err ? ' err' : ''); d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3500); };

let KUNDEN = [], LIEF = [], ART = 'kunden', OFFENE = {};
const nameVon = k => k.firma || [k.vorname, k.nachname].filter(Boolean).join(' ') || k.name || '(unbenannt)';
const sortName = k => [k.nachname, k.firma, k.name].map(s => String(s || '').replace(/^[^0-9A-Za-zÄÖÜäöüÉéÈè]+/, '').trim()).find(Boolean) || '';
const kd = k => (k.kontaktdaten && typeof k.kontaktdaten === 'object') ? k.kontaktdaten : {};
const telVon = k => { const d = kd(k); return [['Mobil', d.mobil], ['Telefon', d.telefon1], ['Telefon 2', d.telefon2]].filter(([, v]) => v); };
const mailVon = k => (kd(k).emails || []).filter(Boolean);
const adrVon = k => [k.strasse, [k.plz, k.ort].filter(Boolean).join(' ')].filter(Boolean).join(', ');
const nur = s => String(s || '').replace(/[^\d+]/g, '');

async function pruefeAnmeldung(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ $('loginwrap').classList.remove('hidden'); return; }
  $('loginwrap').classList.add('hidden'); $('app').classList.remove('hidden');
  KKO.init(sb);
  document.documentElement.style.setProperty('--kopf', $('kopf').offsetHeight + 'px');
  await laden();
}
$('loginBtn').onclick = async () => { $('loginStatus').textContent = 'Melde an …';
  const { error } = await KG.anmelden(sb, { email: $('loginEmail').value, password: $('loginPassword').value });
  if(error){ $('loginStatus').textContent = 'Anmelden hat nicht geklappt: ' + error.message; return; } pruefeAnmeldung(); };

async function alleZeilen(q){ const out = []; for(let von = 0; ; von += 1000){ const { data, error } = await q().range(von, von + 999); if(error || !data) break; out.push(...data); if(data.length < 1000) break; } return out; }
async function laden(){
  const [k, el, li, pz] = await Promise.all([
    alleZeilen(() => sb.from('kunde').select('id,name,firma,vorname,nachname,strasse,plz,ort,kontaktdaten,geo_lat,geo_lon').order('name')),
    alleZeilen(() => sb.from('easybill_lieferant').select('easybill_id,name,firma,vorname,nachname,strasse,plz,ort,kontaktdaten,archiviert,lieferant_id')),
    alleZeilen(() => sb.from('lieferant').select('id,name,firma,strasse,plz,ort,kontaktdaten,archiviert_am')),
    alleZeilen(() => sb.from('pendenz').select('kunde_id').eq('erledigt', false).not('kunde_id', 'is', null))
  ]);
  KUNDEN = k.map(x => ({ ...x, art: 'kunde' }));
  const verbunden = new Set(el.map(e => e.lieferant_id).filter(Boolean));
  LIEF = el.filter(e => !e.archiviert).map(e => ({ ...e, id: 'eb' + e.easybill_id, art: 'lief' }))
    .concat(li.filter(l => !verbunden.has(l.id) && !l.archiviert_am).map(l => ({ ...l, id: 'li' + l.id, art: 'lief' })));
  OFFENE = {}; pz.forEach(p => OFFENE[p.kunde_id] = (OFFENE[p.kunde_id] || 0) + 1);
  zeichne();
}

// Liste: gefiltert, alphabetisch mit Buchstaben-Zwischentiteln; rechts A–Z zum Springen
function zeichne(){
  const q = $('q').value.trim().toLowerCase(), w = q.split(/\s+/).filter(Boolean);
  const quelle = ART === 'kunden' ? KUNDEN : LIEF;
  const l = quelle.filter(k => !w.length || (() => { const t = [nameVon(k), k.strasse, k.plz, k.ort, ...telVon(k).map(x => x[1]), ...mailVon(k)].join(' ').toLowerCase(); return w.every(x => t.includes(x) || nur(t).includes(nur(x)) && nur(x).length > 3); })())
    .sort((a, b) => sortName(a).localeCompare(sortName(b), 'de'));
  if(!l.length){ $('liste').innerHTML = `<div class="leer">${q ? 'Nichts gefunden.' : 'Keine Kontakte.'}</div>`; $('az').innerHTML = ''; return; }
  let h = '', akt = '';
  const gesehen = [];
  l.forEach(k => { const b = (sortName(k)[0] || '#').toUpperCase().replace(/[^A-ZÄÖÜ]/, '#');
    if(b !== akt){ akt = b; gesehen.push(b); h += `<div class="buchst" id="b-${b}">${b}</div>`; }
    h += `<button type="button" class="k" data-id="${k.id}"><b>${esc(nameVon(k))}</b><small>${esc([k.ort, telVon(k)[0]?.[1]].filter(Boolean).join(' · ') || ' ')}</small></button>`; });
  $('liste').innerHTML = h;
  $('az').innerHTML = q ? '' : gesehen.map(b => `<span data-b="${b}">${b}</span>`).join('');
}
let qT = null; $('q').addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(zeichne, 120); });
document.querySelectorAll('[data-art]').forEach(b => b.onclick = () => { ART = b.dataset.art; document.querySelectorAll('[data-art]').forEach(x => x.classList.toggle('on', x === b)); scrollTo(0, 0); zeichne(); });
// A–Z: tippen oder mit dem Finger darüberfahren
const springe = y => { const el = document.elementFromPoint(window.innerWidth - 12, y); const b = el && el.dataset && el.dataset.b; const z = b && $('b-' + b);
  if(z) scrollTo(0, z.offsetTop - $('kopf').offsetHeight); };
$('az').addEventListener('pointerdown', e => { springe(e.clientY); $('az').setPointerCapture(e.pointerId); });
$('az').addEventListener('pointermove', e => { if(e.buttons) springe(e.clientY); });
$('liste').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if(b) zeigeKarte(b.dataset.id); });

// Karte: grosse Knöpfe, darunter Telefonnummern, Mails, Adresse, offene Pendenzen
async function zeigeKarte(id){
  const k = (ART === 'kunden' ? KUNDEN : LIEF).find(x => String(x.id) === String(id)); if(!k) return;
  const tel = telVon(k), mails = mailVon(k), adr = adrVon(k), nav = k.geo_lat ? `${k.geo_lat},${k.geo_lon}` : adr;
  const mobil = kd(k).mobil;
  $('karte').innerHTML = `<div class="khead"><button type="button" data-zu>${IC.zurueck}Kontakte</button><h1>${esc(nameVon(k))}</h1>${adr ? `<div class="adr">${esc(adr)}</div>` : ''}</div>
    <div class="aktion">
      <a href="${tel[0] ? 'tel:' + nur(tel[0][1]) : '#'}" class="${tel.length ? '' : 'aus'}">${IC.tel}Anrufen</a>
      <a href="${mails[0] ? 'mailto:' + esc(mails[0]) : '#'}" class="${mails.length ? '' : 'aus'}">${IC.mail}Mail</a>
      <a href="${nav ? 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(nav) : '#'}" target="_blank" rel="noopener" class="${nav ? '' : 'aus'}">${IC.nav}Navigation</a>
      ${k.art === 'kunde' ? `<button type="button" data-ordner>${IC.ordner}Ordner</button>` : `<a href="${mobil ? 'https://wa.me/' + nur(mobil).replace(/^0/, '41') : '#'}" target="_blank" rel="noopener" class="${mobil ? '' : 'aus'}">${IC.wa}WhatsApp</a>`}
    </div>
    ${tel.length ? `<div class="block"><h2>Telefon</h2>${tel.map(([t, v]) => `<div class="zeile"><div class="w"><small>${t}</small><span>${esc(v)}</span></div>${t === 'Mobil' ? `<a class="r" href="https://wa.me/${nur(v).replace(/^0/, '41')}" target="_blank" rel="noopener" aria-label="WhatsApp">${IC.wa}</a>` : ''}<a class="r" href="tel:${nur(v)}" aria-label="Anrufen">${IC.tel}</a></div>`).join('')}</div>` : ''}
    ${mails.length ? `<div class="block"><h2>E-Mail</h2>${mails.map(m => `<div class="zeile"><div class="w"><span>${esc(m)}</span></div><a class="r" href="mailto:${esc(m)}" aria-label="Mail schreiben">${IC.mail}</a></div>`).join('')}</div>` : ''}
    ${adr ? `<div class="block"><h2>Adresse</h2><div class="zeile"><div class="w"><span>${esc(adr)}</span></div><a class="r" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(nav)}" target="_blank" rel="noopener" aria-label="Navigation">${IC.nav}</a></div></div>` : ''}
    ${k.art === 'kunde' ? `<div class="block" id="kpend"><h2>Offene Pendenzen${OFFENE[k.id] ? ' · ' + OFFENE[k.id] : ''}</h2>${OFFENE[k.id] ? '<div class="zeile"><div class="w"><small>Lädt …</small></div></div>' : '<div class="zeile"><div class="w"><small>Keine offenen Pendenzen.</small></div></div>'}</div>` : ''}`;
  $('karte').classList.remove('hidden'); $('karte').scrollTop = 0; history.pushState({ karte: id }, '');
  $('karte').querySelector('[data-zu]').onclick = () => history.back();
  const ob = $('karte').querySelector('[data-ordner]'); if(ob) ob.onclick = () => ordner(k);
  if(k.art === 'kunde' && OFFENE[k.id]){
    const { data } = await sb.from('pendenz').select('titel,zeit').eq('kunde_id', k.id).eq('erledigt', false).order('zeit').limit(20);
    const el = $('kpend'); if(el) el.innerHTML = `<h2>Offene Pendenzen · ${OFFENE[k.id]}</h2>` + (data || []).map(p => `<div class="zeile"><div class="w"><span>${esc(p.titel)}</span></div></div>`).join('');
  }
}
addEventListener('popstate', () => $('karte').classList.add('hidden'));
// Kundenordner im Drive (gleiche Ansicht wie am PC, auf dem Handy untereinander)
async function ordner(k){
  try { const l = await KKO.liste(k.id); if(!l.length) return toast('Für diesen Kunden ist noch kein Ordner verknüpft (am PC in Kontakte verknüpfen).');
    if(!(await KKO.verbunden())) await KKO.verbinden();
    KKO.ablage({ kunde: k, ordner: l, titel: nameVon(k), untertitel: adrVon(k) });
  } catch(e){ toast('Drive: ' + e.message, true); }
}

pruefeAnmeldung();
</script>
</body>
</html>
