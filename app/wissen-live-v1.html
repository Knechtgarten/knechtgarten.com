<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=1"></script>
<title>Nachschlagewerk &amp; Maschinen – Knechtgarten</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&display=swap">
<style>
:root{
  --bg:#F5F7F9; --card:#FFFFFF; --primary:#323E4E; --primary-l:#4C5C70;
  --ink:#232B35; --muted:#8B9097; --line:#E1E5E9; --soft:#EEF3F7;
  --accent-blue:#D6E7F4; --accent-lime:#D1DB5F; --accent-lime-light:#F4F6D8; --danger:#B4655F;
  --ok:#4E8A5B; --ok-soft:#E3F0E5; --danger-soft:#F6E6E4;
  --f-head:"Jost","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);line-height:1.45;font-size:13.5px;}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px;}
.hidden{display:none !important;}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;}
h1,h2,h3{font-family:var(--f-head);font-weight:600;color:var(--primary);}
.muted{color:var(--muted);} .small{font-size:12px;}
button{font:inherit;color:inherit;}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{font:inherit;font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 8px;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);}

header.app{background:var(--primary);color:#fff;}
header.app .wrap{display:flex;align-items:center;gap:20px;}
header.app .backlink{display:inline-flex;align-items:center;gap:5px;color:var(--primary);text-decoration:none;font-size:12px;font-weight:700;flex-shrink:0;background:var(--accent-lime);border-radius:20px;padding:6px 12px;}
header.app .backlink:hover{background:#c3cd52;}
header.app .brand{padding:11px 0;}
header.app .brand h1{font-size:16px;color:#fff;}
header.app .brand .sub{font-size:11px;opacity:.75;margin-top:1px;}
header.app .userbar{display:flex;align-items:center;gap:10px;margin-left:auto;}
header.app .userbar span{opacity:.85;font-size:11.5px;}
header.app .userbar button{font-size:11.5px;color:#c7ccd1;background:none;border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:3px 9px;cursor:pointer;}
nav.subnav{background:#fff;border-bottom:1px solid var(--line);}
nav.subnav .wrap{display:flex;gap:2px;align-items:center;overflow-x:auto;}
nav.subnav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;padding:12px 12px 10px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap;}
nav.subnav button:hover{color:var(--primary);}
nav.subnav button.on{color:var(--primary);border-bottom-color:var(--accent-lime);}
nav.subnav .neu{margin-left:auto;}
nav.subnav .navmodus{margin-left:auto;margin-right:6px;flex:0 0 auto;}
nav.subnav .navmodus button{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border:0;font-size:12.5px;color:var(--muted);}
nav.subnav .navmodus button.on{background:var(--primary);color:#fff;}
nav.subnav .navmodus .i{width:14px;height:14px;}
.bearbstreifen{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid #D6E7F4;color:var(--primary);border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;margin-bottom:12px;}
.bearbstreifen .i{width:14px;height:14px;}
@media (max-width:620px){ nav.subnav .navmodus .mtxt{display:none;} }
main.wrap{padding-top:22px;padding-bottom:70px;}

.card{background:var(--card);border:1px solid var(--line);border-radius:11px;}
.btn{border:none;border-radius:7px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn .i{width:16px;height:16px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-l);}
.btn-ghost{background:#fff;color:var(--primary);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--primary);}
.btn-danger{background:var(--danger);color:#fff;}
.btn[disabled]{opacity:.45;cursor:default;}
.btn-sm{padding:4px 10px;font-size:12.5px;}
.addrow{all:unset;cursor:pointer;color:var(--primary);font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center;padding:4px 0;}
.addrow .i{width:16px;height:16px;}
.addrow:hover{text-decoration:underline;}
.addlinks{display:flex;gap:18px;flex-wrap:wrap;align-items:center;}
.xbtn{all:unset;cursor:pointer;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none;box-sizing:border-box;background:#fff;}
.xbtn .i{width:13px;height:13px;}
.xbtn svg.i{stroke-width:1.5;} .xbtn:hover{background:#FBEFEC;}
.xbtn:hover{color:var(--danger);border-color:var(--danger);}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:20px;padding:2px 9px;font-size:12px;background:#fff;white-space:nowrap;}
.chip .i{width:13px;height:13px;}
.chip.typ{background:var(--accent-blue);border-color:transparent;color:var(--primary);font-weight:600;}
.chip.tag{color:var(--muted);}
.chip.planer{border-color:var(--accent-lime);background:var(--accent-lime-light);color:var(--primary);}
.grp-title{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.hint{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:6px;padding:9px 11px;}
.lockline{font-size:12px;color:var(--muted);display:inline-flex;gap:5px;align-items:center;text-transform:none;letter-spacing:0;font-weight:400;}
.lockline .i{width:14px;height:14px;}

/* Suche */
.hero-search{display:flex;flex-direction:column;gap:12px;margin-bottom:18px;}
.searchbox{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--muted);border-radius:10px;padding:0 14px;max-width:720px;}
.searchbox:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--accent-blue);}
.searchbox input{all:unset;flex:1;padding:12px 0;font-size:16px;min-width:0;}
.searchbox .i{color:var(--muted);width:20px;height:20px;}
.filterrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.resakt{display:flex;gap:10px;align-items:center;}
.ehead .acts .segm.modus button{display:inline-flex;align-items:center;gap:5px;}
.ehead .acts .segm.modus .i{width:14px;height:14px;}
.katart{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.filterrow .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);width:78px;flex:none;}
.fchip{all:unset;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 11px;font-size:12.5px;}
.fchip:hover{border-color:var(--primary-l);}
.fchip.on{background:var(--primary);border-color:var(--primary);color:#fff;}
.reshead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;}
.viewtg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;}
.viewtg button{all:unset;cursor:pointer;width:36px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--muted);}
.viewtg button + button{border-left:1px solid var(--line);}
.viewtg button.on{background:var(--primary);color:#fff;}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;}
.gcard{all:unset;cursor:pointer;box-sizing:border-box;display:flex;flex-direction:column;gap:7px;min-width:0;}
.ph{background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden;}
.ph img{width:100%;height:100%;object-fit:cover;display:block;}
.gcard .ph{aspect-ratio:4/3;border-radius:10px;border:1px solid var(--line);}
.gcard .ph .i{width:52px;height:52px;stroke-width:1;}
.gcard:hover .ph{border-color:var(--primary-l);}
.gcard .t{font-family:var(--f-head);font-weight:600;font-size:15px;color:var(--primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px;}
.lst{overflow:hidden;}
.lrow{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);}
.lrow:last-child{border-bottom:0;}
.lrow:hover{background:var(--soft);}
.lrow .ph{width:56px;height:42px;border-radius:6px;}
.lrow .ph .i{width:24px;height:24px;stroke-width:1.2;}
.lrow .tx{display:flex;flex-direction:column;min-width:0;}
.lrow .tx b{font-weight:600;color:var(--primary);}
.lrow .tx .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lrow .mt{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;}
/* Übersicht als Liste: Titel · Untertitel · neueste Notiz, Foto erst beim Überfahren des Titels */
[hidden]{display:none !important;}
.kurzl{margin-bottom:12px;}
/* Suche: Mikrofon und KI-Antwort */
.mic{all:unset;cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--primary);flex:none;}
.mic:hover{background:var(--soft);} .mic .i{width:20px;height:20px;color:inherit;}
.mic.hoert{background:var(--danger);color:#fff;animation:puls 1s infinite;}
@keyframes puls{50%{box-shadow:0 0 0 7px rgba(180,101,95,.25);}}
@media (prefers-reduced-motion:reduce){.mic.hoert{animation:none;}}
.kiknopf{display:flex;gap:10px;align-items:center;margin-bottom:12px;}
.ki{border:1px solid #8DB6DB;background:linear-gradient(180deg,#F3F8FC,#fff 70%);border-radius:11px;padding:14px 18px;display:flex;flex-direction:column;gap:8px;margin-bottom:14px;max-width:820px;}
.ki.leer{border-color:var(--line);background:#fff;}
.kikopf{display:flex;gap:8px;align-items:center;font-family:var(--f-head);font-weight:600;color:var(--primary);}
.kitext{font-size:14px;line-height:1.55;} .kitext p{margin:0 0 4px;} .kitext ul{margin:4px 0;padding-left:20px;display:flex;flex-direction:column;gap:3px;}
.kiquellen{display:flex;gap:6px;flex-wrap:wrap;align-items:center;} .kiquellen button.chip{cursor:pointer;} .kiquellen .chip .i{width:13px;height:13px;}
.kilaedt{display:flex;gap:8px;align-items:center;color:var(--muted);}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:#8DB6DB;margin-right:3px;animation:dot 1s infinite;}
.dots span:nth-child(2){animation-delay:.15s} .dots span:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{opacity:.25}} .lrow.kurz{cursor:default;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:16px;padding:9px 14px;}
.lrow.kurz .tt{display:flex;flex-direction:column;min-width:0;} .lrow.kurz .tt b{font-weight:600;color:var(--primary);}
.lrow.kurz .kw{font-weight:600;font-variant-numeric:tabular-nums;white-space:pre-line;user-select:all;}
.lrow.kurz .kb{display:flex;gap:6px;}
.lrow.zl{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.6fr);gap:16px;padding:8px 14px;}
.lrow.zl .tt{position:relative;min-width:0;} .lrow.zl .tt b{font-weight:600;color:var(--primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.lrow.zl .ut,.lrow.zl .nz{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lrow.zl .nz{color:var(--ink);}
.lrow.zl .vorschau{display:none;position:absolute;left:0;top:100%;z-index:20;width:180px;height:135px;border-radius:8px;overflow:hidden;background:var(--soft);box-shadow:0 8px 24px rgba(0,0,0,.18);}
.lrow.zl .vorschau img{width:100%;height:100%;object-fit:cover;}
.lrow.zl .tt:hover .vorschau{display:block;}
.card.lst.zl{overflow:visible;}
.empty{padding:30px;text-align:center;color:var(--muted);}

/* Eintrag */
.back{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center;color:var(--muted);font-size:13px;margin-bottom:12px;}
.back:hover{color:var(--primary);}
.ehead{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;padding:18px;margin-bottom:12px;}
.ehead .ph{aspect-ratio:4/3;border-radius:8px;position:relative;}
.ehead .ph .i{width:60px;height:60px;stroke-width:1;}
.ehead .ph .fotobtn{position:absolute;right:6px;bottom:6px;}
.ehead h2{font-size:24px;line-height:1.2;}
.ehead .subt{color:var(--muted);margin-top:2px;}
.ehead .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;}
.ehead .facts{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted);}
.ehead .facts b{color:var(--ink);font-weight:600;}
.ehead .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
/* Kopf je Rubrik: Produkte klein mit Bild, Wissen nur Titel */
.ehead.klein{grid-template-columns:72px minmax(0,1fr);align-items:center;}
.ehead.klein .ph{aspect-ratio:1;width:72px;} .ehead.klein .ph .i{width:30px;height:30px;} .ehead.klein .ph .fotobtn{display:none;}
.ehead.klein h2{font-size:20px;}
.ehead.text{grid-template-columns:minmax(0,1fr);}
.crumb{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:4px;} .crumb .i{width:14px;height:14px;}
.kopflinks{display:flex;gap:6px;flex-wrap:wrap;}
/* Handy: zugeklappte Abschnitte als Knöpfe */
.mehr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
.mehr .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:2px;}
.mehr button{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;font-size:12.5px;font-weight:600;color:var(--primary);}
.mehr button.on{background:var(--soft);border-color:var(--primary);}
.mehr button.warn{background:var(--danger-soft);border-color:#E2A6A0;color:var(--danger);}
.mehr .i{width:15px;height:15px;}
.eform{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 14px;}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0;}
.fld.voll{grid-column:1/-1;}
.fld input,.fld select{width:100%;}
.fld .chk input{width:auto;margin:0;}
.qrtab col.c-chk{width:96px;} .qrtab col.c-bs{width:190px;}
.einst .tbl-wrap:has(> .felder){overflow-x:auto;} table.felder{min-width:520px;}
/* Einzelne Knöpfe statt zusammengeklebter Schalter (Rubrik, Aus/Zu/Offen, Felder) */
.bkreihe{display:inline-flex;gap:5px;flex-wrap:wrap;}
.bk{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--muted);font-size:12.5px;font-weight:600;white-space:nowrap;}
.bk:hover{border-color:var(--primary);color:var(--primary);}
.bk.on{background:var(--primary);border-color:var(--primary);color:#fff;}
.bk[disabled]{opacity:.4;cursor:default;} .bk .i{width:14px;height:14px;}
.qrtab col.c-bs{width:200px;} .qrtab .mid{text-align:right;}
.kfwahl tr.frei td{padding-top:3px;padding-bottom:3px;} .kfwahl .chk{margin:0;display:inline-flex;gap:8px;align-items:center;} .kfwahl .chk.muted{color:var(--muted);}
.bsname{display:flex;gap:8px;align-items:center;flex-wrap:wrap;} .felderknopf{margin-left:auto;} .felderknopf .chev{width:14px;height:14px;transition:transform .15s;} .felderknopf.on .chev{transform:rotate(180deg);} .felderknopf.on{border-color:var(--primary);}
.qrtab tr.feldpanel > td{background:var(--soft);padding:12px 14px 14px;} .qrtab tr.feldpanel > td > *{margin-top:8px;} .qrtab tr.feldpanel > td > :first-child{margin-top:0;}
.felder col.c-art{width:120px;}
.felder col.c-art{width:110px;} .felder col.c-pro{width:74px;} .felder .mid{text-align:center;} .felder input[type=checkbox]{accent-color:var(--primary);width:16px;height:16px;}
.qrtab tr.aus td:nth-child(2){color:var(--muted);}
.qrtab .segm button{padding:4px 10px;font-size:12px;}
.qrtab tbody td:nth-child(2){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qrtab .mid{text-align:center;}
.qrtab input[type=checkbox]{accent-color:var(--primary);width:16px;height:16px;cursor:pointer;}
.qrtab .stat{margin-right:6px;}
.stat.aus{background:var(--soft);color:var(--muted);}
.svsym{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;} .svsym .i{width:14px;height:14px;stroke-width:2;}
.svsym.ok{background:var(--ok-soft);color:var(--ok);} .svsym.no{background:var(--danger-soft);color:var(--danger);} .svsym.aus{background:var(--soft);color:var(--muted);} .svsym.spaeter{color:#C5CAD0;}
td.svsymz{width:34px;text-align:center;}
.qrkarte{padding:14px 16px;margin-bottom:10px;display:flex;flex-direction:column;gap:10px;}
.extabs .svalle{margin-left:auto;align-self:center;margin-bottom:4px;}
table.svz td{padding:3px 8px;font-size:13px;line-height:1.3;} table.svz th{padding:6px 8px;} table.svz .svsym{width:20px;height:20px;} table.svz .svsym .i{width:12px;height:12px;} table.svz .xbtn{width:22px;height:22px;}
.sveintrag{box-shadow:inset 0 0 0 1.5px var(--primary);}
.svkopf{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.svklein{display:flex;flex-direction:column;gap:6px;background:var(--soft);border-radius:8px;padding:8px 10px;}
.svk{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:4px;}
.svk1{display:flex;align-items:center;gap:6px;flex-wrap:wrap;} .svk1 .svwahl{margin-left:auto;}
.svk2{display:flex;align-items:center;gap:6px;} .svk2 .svin{flex:1;min-width:0;} .svk2 input[type=date].svin{flex:0 0 132px;}
.segm.klein button{padding:3px 8px;font-size:12px;}
.svwahl{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff;}
.svwahl button{all:unset;cursor:pointer;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--primary);}
.svwahl button + button{border-left:1px solid var(--line);}
.svwahl button:hover{background:var(--soft);}
.svwahl button.on{background:var(--primary);color:#fff;}
.svwahl button.on.offen{background:var(--soft);color:var(--primary);}
.svwahl button.on.offen.rot{background:var(--danger-soft);color:var(--danger);}
.svwahl button[disabled]{opacity:.5;cursor:default;}
table.sveint td{padding:4px 6px;vertical-align:middle;} table.sveint .svin{width:100%;min-width:80px;} table.sveint input[type=date].svin{min-width:125px;}
table.sveint input[type=date]::-webkit-calendar-picker-indicator{opacity:.35;cursor:pointer;}
.belege{display:inline-flex;align-items:center;gap:3px;}
.ibtn,.minidoc{all:unset;cursor:pointer;box-sizing:border-box;width:26px;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);}
.ibtn:hover{color:var(--primary);background:var(--soft);} .ibtn .i{width:17px;height:17px;}
.minidoc{color:var(--primary);background:var(--accent-blue);width:22px;height:26px;} .minidoc .i{width:14px;height:14px;} .minidoc:hover{background:#C3DBEE;}
table.sveint tr.aktiv td{background:#EEF5FB;} table.sveint tr.aktiv td:first-child{box-shadow:inset 3px 0 0 var(--primary);}
.stat.wichtig{background:#D1DB5F;color:#323E4E;} .stat.plan{background:#D6E7F4;color:#323E4E;}
.fldtitel{color:var(--primary);font-weight:600;}
.plknoepfe{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;}
.plk{all:unset;cursor:pointer;padding:6px 14px;border-radius:6px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--muted);}
.plk:hover{border-color:var(--primary);}
.plk.aus[aria-pressed="true"]{background:#323E4E;border-color:#323E4E;color:#fff;}

async function ladeAlles(){
  const r = await Promise.all([
    sb.from('wissen_kategorie').select('*').order('sortierung'),
    sb.from('wissen_bereich').select('*').order('sortierung'),
    sb.from('wissen_eintrag').select('*').is('archiviert_am', null).order('titel'),
    sb.from('wissen_service').select('*').order('sortierung'),
    sb.from('wissen_exemplar').select('*').is('archiviert_am', null),
    sb.from('wissen_service_erledigt').select('*').gte('jahr', NOW_Y - 3),
    sb.from('lieferant').select('id,name,firma').is('archiviert_am', null).order('name'),
    sb.from('planer_ressource').select('id,typ,nummer,name,aktiv,stamm_person_id'),
    sb.from('planer_person').select('id,name,aktiv').order('sortierung'),
  ]);
  const err = r.find(x => x.error); if(err) return fehler(err.error, 'Laden');
  [S.kats, S.bereiche, S.eintraege, S.service, S.exemplare, S.erledigt, S.lieferanten, S.planer, S.personen] = r.map(x => x.data || []);
  { const [fe, li] = await Promise.all([sb.from('wissen_feld').select('*').order('name'), sb.from('wissen_liste').select('*').order('sortierung')]); S.felder = fe.data || []; S.listen = li.data || []; felderAbleiten(); }
  S.eintraege.sort((a,b) => a.titel.localeCompare(b.titel, 'de', {numeric:true}));
  S.exemplare.sort((a,b) => a.sortierung - b.sortierung || String(a.nummer || '').localeCompare(String(b.nummer || ''), 'de', {numeric:true}));
  await signiere(S.eintraege.map(e => e.titelfoto_pfad && vorschau(e.titelfoto_pfad)).filter(Boolean));
}
const vorschau = p => p.replace(/\.jpg$/, '_t.jpg');
async function signiere(pfade){
  const neu = [...new Set(pfade)].filter(p => p && !urls.has(p));
  for(let i = 0; i < neu.length; i += 100){
    const { data } = await sb.storage.from(BUCKET).createSignedUrls(neu.slice(i, i+100), 3600 * 6);
    (data || []).forEach(d => { if(d.signedUrl) urls.set(d.path, d.signedUrl); });
  }
}
async function ladeDetail(id){
  const r = await Promise.all([
    sb.from('wissen_notiz').select('*').eq('eintrag_id', id).order('erstellt_am', { ascending: false }),
    sb.from('wissen_kontakt').select('*').eq('eintrag_id', id).order('sortierung'),

  S.det = { id, notizen, kontakte, dateien, kunden };

// Exemplare + Service: Arbeiten und Startwochen gelten fuer alle Exemplare eines
// Eintrags, «erledigt» wird pro Exemplar eingetragen.
// ---------------------------------------------------------------------------
const exVon = e => S.exemplare.filter(x => x.eintrag_id === e.id);
const exById = id => S.exemplare.find(x => x.id === id);
const exName = (x, i) => x.nummer || 'Exemplar ' + ((i ?? exVon(byId(x.eintrag_id)).indexOf(x)) + 1);
const exTitel = x => { const e = byId(x.eintrag_id); return (e ? e.titel : '') + (x.nummer ? ' ' + x.nummer : ''); };
const exAktiv = e => { const l = exVon(e); return l.find(x => x.id === S.xid) || l[0] || null; };
const servicesVon = e => S.service.filter(s => s.eintrag_id === e.id).sort((a,b) => a.sortierung - b.sortierung);
// Startwochen im Jahr j (leer, wenn die Arbeit in diesem Jahr abgewählt ist)
const wochen = (s, j = NOW_Y) => (s.aus_jahre || []).includes(j) ? [] : [...s.kws].sort((a,b) => a-b);
const erledigtIn = (x, s, kw, jahr = NOW_Y) => S.erledigt.find(r => r.exemplar_id === x.id && r.service_id === s.id && r.jahr === jahr && r.kw === kw);
function naechster(x){
  let best = null; const e = byId(x.eintrag_id); if(!e) return null;
  for(const s of servicesVon(e)) for(const w of wochen(s)){
    if(erledigtIn(x, s, w)) continue;
    const d = w < NOW_KW - 8 ? w + 53 : w;
    if(!best || d < best.d) best = { d, w, s };
  }
  return best;
}

function icoFuer(e){
  const ga = (e.geraeteart || '').toLowerCase(), kat = katName(e.kategorie_id);
  if(/bagger|dumper|lader|stapler/.test(ga)) return 'excav';
  if(/lieferwagen|bus/.test(ga)) return 'truck';
  if(/personenwagen|auto/.test(ga)) return 'car';
  if(/anhänger/.test(ga)) return 'trailer';
  if(e.typ === 'wissen') return 'book';
  if(/Kleber/.test(kat)) return 'tube';
  if(/Pflanzen|Dünger/.test(kat)) return 'leaf';

  if(/Metall/.test(kat)) return 'bolt';

}

// --- Suche ---
// Suchtext eines Eintrags (alles, was man finden können soll)
function heu(e){
  const xs = exVon(e);
  const steck = [...(e.steckbrief || []), ...xs.flatMap(x => x.steckbrief || [])].map(r => r.label + ' ' + r.wert + ' ' + (r.hinweis || ''));
  return [e.titel, e.untertitel, e.wert, e.geraeteart, ...xs.flatMap(x => [x.nummer, x.zustaendig]), katName(e.kategorie_id), ...e.tags, ...steck,
    ohneHtml(e.anwendung_html), ohneHtml(e.sicherheit_html), ...psaText(e), ...(S.alleNotizen || []).filter(n => n.eintrag_id === e.id).map(n => ohneHtml(n.html))].join(' ').toLowerCase();
}
// Frage statt Stichwort: «Welcher Beton für …?», «Wie …», «Wann …»
const istFrage = q => (q || '').trim().length > 6 && (/\?\s*$/.test(q) || /^(welche[rsn]?|wann|wie|was|wo|wer|wieso|warum|darf|muss|kann|soll|gibt)\b/i.test(q.trim()));
const STOPP = new Set('welche welcher welches welchen wann wie was wo wer wieso warum darf muss kann soll gibt es ist sind der die das den dem des ein eine einen einem einer für fur von mit bei auf aus an in im zu zum zur und oder man ich wir unser unsere unseren nehmen braucht brauche machen viel viele genau bitte am im um ab bis als so noch schon auch nur sehr beim vom ins ans nicht kein keine hat haben wird werden welchem'.split(' '));
const suchWoerter = q => q.toLowerCase().replace(/[?!.,;:«»"()]/g, ' ').split(/\s+/).filter(t => t && !(istFrage(q) && (STOPP.has(t) || t.length < 3)));
// Treffer pro Eintrag: wie viele Suchwörter vorkommen (auch ohne Endung, z. B. «Hecken» → «hecke»)
const treffer = (e, woerter) => { const h = heu(e); return woerter.filter(t => h.includes(t) || (t.length > 4 && h.includes(t.slice(0, -1)))).length; };
// Rangfolge: Treffer im Titel/Untertitel zählen dreifach (sonst verdrängen z. B. Anbaugeräte «passt an Raupenbagger» die Bagger selbst)
const rang = (e, woerter) => { const t = (e.titel + ' ' + (e.untertitel || '')).toLowerCase(); return treffer(e, woerter) + 2 * woerter.filter(w => t.includes(w) || (w.length > 4 && t.includes(w.slice(0, -1)))).length; };
function passt(e){
  if(S.kat && e.kategorie_id !== S.kat) return false;
  if(!S.q) return true;
  const w = suchWoerter(S.q); if(!w.length) return true;
  // Stichworte: alle müssen vorkommen; Frage: mindestens eines
  return istFrage(S.q) ? treffer(e, w) > 0 : treffer(e, w) === w.length;
}
// --- KI-Antwort: Frage + die passendsten Einträge gehen an die Funktion «wissen-ki-antwort» (Claude antwortet nur daraus) ---
function eintragText(e){
  const k = katVon(e), defs = S.merkmale.filter(m => m.kategorie_id === e.kategorie_id);
  const infos = [...(e.steckbrief || []), ...exVon(e).flatMap(x => x.steckbrief || [])].filter(r => r.wert).map(r => `${r.label}: ${infoWert(defs.find(m => m.name === r.label), r.wert)}`);
  const notiz = (S.alleNotizen || []).filter(n => n.eintrag_id === e.id && !n.exemplar_id).map(n => ohneHtml(n.html)).join(' ');
  return [k && `Kategorie: ${k.name}`, e.untertitel && `Untertitel: ${e.untertitel}`, e.wert && `Wert: ${e.wert}`, e.tags?.length && `Stichwörter: ${e.tags.join(', ')}`,
    infos.length && `Infos: ${unik(infos).join('; ')}`, ohneHtml(e.anwendung_html) && `Anwendung: ${ohneHtml(e.anwendung_html)}`,
    (psaText(e).length || ohneHtml(e.sicherheit_html)) && `Arbeitssicherheit: ${[psaText(e).join(', '), ohneHtml(e.sicherheit_html)].filter(Boolean).join(' – ')}`,
    notiz && `Notizen: ${notiz}`, servicesVon(e).length && `Service-Arbeiten: ${servicesVon(e).map(s => s.arbeit).join(', ')}`,
    exVon(e).length > 1 && `Stücke: ${exVon(e).map(x => [x.nummer, x.zustaendig].filter(Boolean).join(' ')).join(', ')}`].filter(Boolean).join('\n');
}
async function kiFragen(){
  const q = S.q.trim(); if(!q) return;
  S.ki = { q, status: 'laedt' }; render();
  if(!S.alleNotizen){ S.notizenLaden = true; await ladeAlleNotizen(); }
  const w = suchWoerter(q), kand = S.eintraege.map(e => [e, rang(e, w)]).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([e]) => e);
  if(!kand.length){ S.ki = { q, status: 'fertig', gefunden: false, antwort: 'Dazu steht noch nichts im Nachschlagewerk.', quellen: [] }; return render(); }
  const { data, error } = await sb.functions.invoke('wissen-ki-antwort', { body: { frage: q, eintraege: kand.map(e => ({ id: e.id, titel: e.titel, text: eintragText(e) })) } });
  if(S.ki?.q !== q) return; // inzwischen anders gesucht
  S.ki = error || data?.error ? { q, status: 'fehler', antwort: error?.message || data.error } : { q, status: 'fertig', ...data };
  render();
}
// einfache Formatierung: **fett**, Zeilen mit «- » als Liste
const kiHtml = t => { const z = esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').split('\n').filter(x => x.trim());
  const li = z.filter(x => /^\s*[-•]\s/.test(x)), rest = z.filter(x => !/^\s*[-•]\s/.test(x));
  return rest.map(x => `<p>${x}</p>`).join('') + (li.length ? `<ul>${li.map(x => `<li>${x.replace(/^\s*[-•]\s/, '')}</li>`).join('')}</ul>` : ''); };
function kiBox(){
  const q = S.q.trim(); if(!q) return '';
  const k = S.ki?.q === q ? S.ki : null;
  if(!k) return istFrage(q) ? `<div class="kiknopf"><button class="btn btn-ghost btn-sm" data-act="kiFragen">${ic('spark')}KI-Antwort aus dem Nachschlagewerk</button><span class="small muted">oder Enter drücken</span></div>` : '';
  if(k.status === 'laedt') return `<div class="ki"><div class="kikopf">${ic('spark')}Antwort aus dem Nachschlagewerk</div><div class="kilaedt"><span class="dots"><span></span><span></span><span></span></span>Liest die passenden Einträge …</div></div>`;
  if(k.status === 'fehler') return `<div class="ki"><div class="kikopf">${ic('spark')}Antwort aus dem Nachschlagewerk</div><div class="small">Die KI ist gerade nicht erreichbar (${esc(k.antwort)}). Die Treffer unten gelten trotzdem.</div></div>`;
  const quellen = (k.quellen || []).map(byId).filter(Boolean);
  return `<div class="ki ${k.gefunden ? '' : 'leer'}"><div class="kikopf">${ic('spark')}Antwort aus dem Nachschlagewerk</div><div class="kitext">${kiHtml(k.antwort || '')}</div>
    ${quellen.length ? `<div class="kiquellen"><span class="small muted">Aus:</span>${quellen.map(e => istKurz(e) ? `<span class="chip">${esc(e.titel)}</span>` : `<button class="chip" data-act="open" data-id="${e.id}">${ic('book')}${esc(e.titel)}</button>`).join('')}</div>` : ''}
    <div class="small muted">KI-Antwort nur aus unseren Einträgen. Im Zweifel den Eintrag öffnen.</div></div>`;
}
// Mikrofon: Spracherkennung des Browsers (Chrome, Edge, Safari); ohne Unterstützung erscheint kein Knopf
const Sprache = window.SpeechRecognition || window.webkitSpeechRecognition;
function mikrofon(){
  if(!Sprache) return;
  if(S.hoert){ S.hoert.stop(); return; }
  const r = new Sprache(); r.lang = 'de-CH'; r.interimResults = true; r.maxAlternatives = 1;
  r.onresult = ev => { const t = [...ev.results].map(x => x[0].transcript).join(' ').trim(); S.q = t.charAt(0).toUpperCase() + t.slice(1); const q = $('q'); if(q) q.value = S.q;
    if(ev.results[ev.results.length - 1].isFinal){ r.stop(); } };
  r.onerror = ev => { if(ev.error === 'not-allowed') toast('Mikrofon ist im Browser gesperrt. In den Website-Einstellungen erlauben.', true); else if(ev.error !== 'no-speech' && ev.error !== 'aborted') toast('Spracherkennung: ' + ev.error, true); };
  r.onend = () => { S.hoert = null; render(); if(S.q && istFrage(S.q.trim() + (/\?$/.test(S.q) ? '' : '?'))){ if(!/\?$/.test(S.q)) S.q += '?'; kiFragen(); } };
  S.hoert = r; r.start(); render();
}
// Kurzinfo: keine Detailseite – Titel, Wert (zum Kopieren) und kurzer Hinweis direkt in der Übersicht
const kurzZeile = e => `<div class="lrow kurz"><span class="tt"><b>${esc(e.titel)}</b>${e.untertitel ? `<span class="small muted">${esc(e.untertitel)}</span>` : ''}</span>

function kurzDialog(e){

// Merkmal / Wert / Hinweis als Tabelle (Technische Daten des Eintrags, Angaben des Exemplars).

// key: steckbrief = Eintrag, xsteck = Angaben des Exemplars
const KVFELD = { steckbrief: 'steckbrief', xsteck: 'steckbrief' };
// Vorschläge: Merkmale der Kategorie des Eintrags plus «für alle», in beiden Tabellen gleich
// Felder je Kategorie (aus der gemeinsamen Feldliste und der Auswahl der Kategorie): wie früher wissen_merkmal, nur abgeleitet
function felderAbleiten(){
  S.merkmale = S.kats.flatMap(k => (k.felder || []).map((z, i) => { const f = (S.felder || []).find(x => x.id === z.f);
    return f ? { id: f.id, feld_id: f.id, name: f.name, art: f.art, einheit: f.einheit, optionen: f.optionen, pro_stueck: !!z.s, kategorie_id: k.id, sortierung: i } : null; })).filter(Boolean);
}
const merkmaleFuer = e => S.merkmale.filter(m => m.kategorie_id === e.kategorie_id)
  .sort((a, b) => (!a.kategorie_id - !b.kategorie_id) || a.sortierung - b.sortierung);
// Einheit eines Merkmals (aus den Einstellungen), nur angehängt, wenn der Wert eine reine Zahl ist
const einheitVon = (e, label) => e && merkmaleFuer(e).find(m => m.name === label)?.einheit || '';
const mitEinheit = (e, r) => { const u = einheitVon(e, r.label); return u && /^[\d\s.,'’-]+$/.test(r.wert || '') ? `${r.wert} ${u}` : r.wert; };

  const benutzt = gleiche.flatMap(x => [...(x.steckbrief || []), ...exVon(x).flatMap(y => y.steckbrief || [])]).map(r => r.label);
  const l = [...new Set([...merkmaleFuer(e).map(m => m.name), ...benutzt.filter(Boolean).sort((a,b) => a.localeCompare(b, 'de'))])];
  return `<datalist id="kvl">${[...(mehrfachVon(e) ? [PLANER_FELD] : []), ...l].map(v => `<option value="${esc(v)}">`).join('')}</datalist>`;

// --- Baustein «Infos»: Felder pro Kategorie (Einstellungen), Werte im steckbrief des Eintrags bzw. des Stücks ---
// pro = true: Felder des einzelnen Stücks (Angaben des Exemplars), sonst des Eintrags
const felderVon = (e, pro) => S.merkmale.filter(m => m.kategorie_id === e.kategorie_id && !!m.pro_stueck === !!pro).sort((a, b) => a.sortierung - b.sortierung);
const istIso = v => /^\d{4}-\d{2}-\d{2}$/.test(v || '');
// Wert für die Ansicht: Datum schweizerisch, Zahl mit Einheit

}

async function infFeld(el){

const kvZiel = (key, e) => key === 'steckbrief' ? e : exAktiv(e);
async function kvSpeichern(key, e, rows){
  const ziel = kvZiel(key, e), sauber = rows.filter(r => r.label || r.wert || r.hinweis).map(r => ({ label: r.label || '', wert: r.wert || '', ...(r.hinweis ? { hinweis: r.hinweis } : {}) }));
  return key === 'steckbrief' ? speichereEintrag(ziel.id, { steckbrief: sauber }) : speichereExemplar(ziel.id, { [KVFELD[key]]: sauber });

async function kvFeld(el){
  const e = byId(S.eid), key = el.dataset.kvk, i = +el.dataset.i, f = el.dataset.f, v = el.value.trim();
  const rows = JSON.parse(JSON.stringify(kvZiel(key, e)[KVFELD[key]] || []));
  const neu = i >= rows.length;
  if(f === 'label' && v.toLowerCase() === PLANER_FELD.toLowerCase()){ el.value = ''; S.kvNeu = null; return planSetzen(true); } // Spezialfeld
  if(neu){ if(!v) return; rows.push({ label: '', wert: '' }); }
  if((rows[i][f] || '') === v) return;
  const alt = rows[i].label, x = exAktiv(e);
  rows[i][f] = v;
  // Merkmal umbenannt: bei den anderen Exemplaren gleich mit
  if(key === 'xsteck' && f === 'label' && !neu && alt && v) await exAlleZeilen(e, (r, y) => y.id !== x.id && r.some(q => q.label === alt) && !r.some(q => q.label === v) ? r.map(q => q.label === alt ? { ...q, label: v } : q) : null);
  const leer = !rows[i].label && !rows[i].wert && !rows[i].hinweis;
  if(await kvSpeichern(key, e, rows)){
    if(neu) S.kvNeu = null;
    // neue Zeile bekommt jetzt ihr Löschen-Kreuz, leere Zeile verschwindet – nur neu zeichnen, wenn kein anderes Feld der Tabelle den Fokus hat
    if(neu || leer) setTimeout(() => { if(!document.activeElement?.dataset?.kvk) render(); }, 0);
  }
}

// Exemplar-Merkmale gelten als Zeilen für alle Exemplare des Eintrags (Werte pro Exemplar):
// fn bekommt die Zeilen eines Exemplars und gibt die neuen zurück (null = unverändert)
const kvSauber = rows => rows.filter(r => r.label || r.wert || r.hinweis).map(r => ({ label: r.label || '', wert: r.wert || '', ...(r.hinweis ? { hinweis: r.hinweis } : {}) }));

async function merkmalDazu(key, label){
  const e = byId(S.eid); if(!label) return;

async function medienLaden(root){

const speicherTimer = {};

async function rteSpeichern(ed){

  else if(kind === 'sich'){ r = await sb.from('wissen_eintrag').update({ sicherheit_html: html || null }).eq('id', id); if(!r.error) byId(id).sicherheit_html = html || null; }

  if(r.error) return fehler(r.error, 'Speichern');

let rteZiel = null;   // Textfeld + Cursor fuer Foto/Video-Upload
function rteBefehl(btn){
  const ed = btn.closest('.rte').querySelector('.rte-ed'), sel = getSelection();
  if(!sel.rangeCount || !ed.contains(sel.anchorNode)){
    ed.focus(); const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false); sel.removeAllRanges(); sel.addRange(r);
  }
  const c = btn.dataset.cmd;
  if(c === 'bold') document.execCommand('bold');
  else if(c === 'ul') document.execCommand('insertUnorderedList');
  else if(c === 'ol') document.execCommand('insertOrderedList');
  else if(c === 'datum') document.execCommand('insertHTML', false, '<b>' + datumCH(heuteISO()) + ':</b>&nbsp;');
  else if(c === 'table') document.execCommand('insertHTML', false,
    '<table><tr><th>Spalte 1</th><th>Spalte 2</th><th>Spalte 3</th></tr><tr><td><br></td><td><br></td><td><br></td></tr><tr><td><br></td><td><br></td><td><br></td></tr></table><p><br></p>');
  else if(c === 'mark'){
    // Leuchtstift umschalten: liegt die Auswahl (oder der Cursor) in einer Markierung, wird sie entfernt, sonst markiert
    const r = sel.getRangeAt(0), markVon = n => (n.nodeType === 3 ? n.parentElement : n)?.closest('mark');
    const marks = new Set([markVon(r.startContainer), markVon(r.endContainer), ...[...ed.querySelectorAll('mark')].filter(m => r.intersectsNode(m))].filter(m => m && ed.contains(m)));
    if(marks.size){ marks.forEach(m => m.replaceWith(...m.childNodes)); ed.normalize(); }
    else if(!sel.isCollapsed){ const m = document.createElement('mark');
      try{ r.surroundContents(m); }catch(err){ m.appendChild(r.extractContents()); r.insertNode(m); } }
  }
  else if(c === 'foto' || c === 'video'){
    rteZiel = { ed, range: sel.getRangeAt(0).cloneRange(), art: c };
    return waehleDateien(c === 'foto' ? 'image/*' : 'video/*', false, dateien => rteMedium(dateien[0]));
  }
  rteGeaendert(ed);
}
async function rteMedium(datei){
  const { ed, range, art } = rteZiel || {}; if(!ed || !datei) return;
  await notizAnlegen(ed);
  const [kind, id] = ed.dataset.rte.split(':');
  const e = byId(kind === 'anw' ? id : S.eid);
  toast(art === 'video' ? 'Video wird hochgeladen …' : 'Foto wird hochgeladen …');
  const d = await hochladen(datei, e.id, kind === 'notiz' ? 'notiz' : 'anwendung', kind === 'notiz' ? id : null);
  if(!d) return;
  await signiere([d.storage_pfad]);
  const el = document.createElement(art === 'video' ? 'video' : 'img');
  el.dataset.pfad = d.storage_pfad; el.src = urls.get(d.storage_pfad) || '';
  if(art === 'video'){ el.controls = true; el.setAttribute('playsinline', ''); el.setAttribute('preload', 'metadata'); }
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
  range.insertNode(el); range.setStartAfter(el); range.collapse(true);
  rteSpeichern(ed);
}

function lisSortiert(l){
  let rows = lisZeilen(l);
  const k = S.lsort && l.spalten.includes(S.lsort) ? S.lsort : l.spalten[0];
  const num = v => { const m = String(v).match(/^[^\d-]*(-?\d+(?:[.,]\d+)?)/); return m ? parseFloat(m[1].replace(',', '.')) : null; };
  return rows.sort((a, b) => { const x = lisWert(a, k), y = lisWert(b, k), nx = num(x), ny = num(y);
    if(!x !== !y) return x ? -1 : 1;   // leere Felder immer zuunterst
    if(k === 'svc_next') return ((a.xs.map(naechster).filter(Boolean)[0]?.d ?? 999) - (b.xs.map(naechster).filter(Boolean)[0]?.d ?? 999)) * S.lsortDir;
    return (nx != null && ny != null && /^\W*\d/.test(x) && /^\W*\d/.test(y) ? nx - ny : String(x).localeCompare(String(y), 'de', {numeric:true})) * S.lsortDir; });
}
function lisTabelle(l, druck){
  const rows = lisSortiert(l), sp = l.spalten.filter(k => istBuero() || !k.startsWith('v:'));
  const zelle = (z, k) => { const v = lisWert(z, k); return k === 'titel' ? `<b>${esc(v)}</b>` : k === 'planer' && v ? `<span class="chk-ok">${ic('check')}</span>` : esc(v); };
  return `<div class="tbl-wrap"><table class="t ttbl"><thead><tr>${druck ? '' : '<th class="nw">#</th>'}${sp.map(k => `<th class="sort" data-act="lsort" data-k="${esc(k)}">${esc(spName(k))}${(S.lsort || l.spalten[0]) === k ? (S.lsortDir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead>

      || `<tr><td colspan="${sp.length + 1}" class="small muted">Keine Einträge passen zu dieser Liste.</td></tr>`}</tbody></table></div>`;
}

const FMT = {

};
function qrSVG(text, mm){
  try{
    const q = qrcode(0, 'H'); q.addData(text); q.make();
    const n = q.getModuleCount(); let d = '';
    for(let r = 0; r < n; r++) for(let c = 0; c < n; c++) if(q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
    return `<svg width="${mm}mm" height="${mm}mm" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><path d="${d}" fill="#232B35"/></svg>`;
  }catch(err){ return ''; }
}
function etiketteHTML(x, F){
  const klein = F.w < 80, e = byId(x.eintrag_id);
  const qmm = Math.min(F.h - 14, F.w * (klein ? .42 : .38));
  const nr = x.nummer || '';
  const name = nr && e.titel.endsWith(nr) ? e.titel.slice(0, -nr.length).trim() : e.titel;
  return `<div class="lab ${klein ? 's' : ''}"><div class="l"><img class="logo" src="${LOGO}" alt="Knechtgarten">
      <div class="nm">${esc(name)}</div>${nr ? `<div class="nr ${nr.length > 6 ? 'long' : ''}">${esc(nr)}</div>` : ''}
      ${S.foto && e.titelfoto_pfad ? `<div class="foto"><img data-pfad="${esc(vorschau(e.titelfoto_pfad))}" alt=""></div>` : ''}
      <div class="adr">Knechtgarten · Badhaus 42 · 3615 Heimenschwand<br>033 453 10 20</div></div>
    <div class="r">${qrSVG(QR_BASIS + x.qr_nr, qmm.toFixed(1))}<div class="url">Anleitung scannen</div></div></div>`;
}

}

function waehleDateien(accept, mehrere, fertig){
  const inp = $('fileInput'); inp.value = ''; inp.accept = accept; inp.multiple = mehrere;
  inp.onchange = () => { const f = [...inp.files]; if(f.length) fertig(f); };
  inp.click();
}
async function verkleinere(datei, max, qualitaet){
  const bild = await createImageBitmap(datei);
  const f = Math.min(1, max / Math.max(bild.width, bild.height));
  const c = document.createElement('canvas'); c.width = Math.round(bild.width * f); c.height = Math.round(bild.height * f);
  c.getContext('2d').drawImage(bild, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('Bild konnte nicht umgewandelt werden')), 'image/jpeg', qualitaet));
}
async function hochladen(datei, eintragId, bereich, notizId, extra = {}){
  const id = crypto.randomUUID();
  const istBild = /^image\//.test(datei.type) && !/svg/.test(datei.type);
  const istVideo = /^video\//.test(datei.type);
  const art = istBild ? 'foto' : istVideo ? 'video' : datei.type === 'application/pdf' ? 'pdf' : 'datei';
  if(art === 'datei'){ toast('Nur PDF, Fotos und Videos sind möglich.', true); return null; }
  if(istVideo && datei.size > 50 * 1024 * 1024){ toast('Video ist zu gross (max. 50 MB). Tipp: Handykamera auf 720p stellen oder Video kürzen.', true); return null; }
  try{
    let pfad, vpfad = null, groesse = datei.size;
    if(istBild){
      const gross = await verkleinere(datei, 1920, .85), klein = await verkleinere(datei, 480, .8);
      pfad = `${eintragId}/${id}.jpg`; vpfad = `${eintragId}/${id}_t.jpg`; groesse = gross.size;
      const [a, b] = await Promise.all([
        sb.storage.from(BUCKET).upload(pfad, gross, { contentType: 'image/jpeg' }),
        sb.storage.from(BUCKET).upload(vpfad, klein, { contentType: 'image/jpeg' })]);
      if(a.error || b.error) throw (a.error || b.error);
    } else {
      const ext = (datei.name.split('.').pop() || (istVideo ? 'mp4' : 'pdf')).toLowerCase().replace(/[^a-z0-9]/g, '');
      pfad = `${eintragId}/${id}.${ext}`;
      const { error } = await sb.storage.from(BUCKET).upload(pfad, datei, { contentType: datei.type });
      if(error) throw error;
    }
    const zeile = { id, eintrag_id: eintragId, notiz_id: notizId, bereich, art, name: datei.name, storage_pfad: pfad, vorschau_pfad: vpfad, groesse, erstellt_von: S.userId, ...extra };
    const { data, error } = await sb.from('wissen_datei').insert(zeile).select().single();
    if(error){ await sb.storage.from(BUCKET).remove([pfad, vpfad].filter(Boolean)); throw error; }
    if(S.det && S.det.id === eintragId) S.det.dateien.push(data);
    return data;
  }catch(e){ fehler(e, 'Hochladen'); return null; }
}

// (Ersatz: Titel); die Nummer steht im Planer separat davor. Bei Fahrzeugen ist der Fahrer der Stamm-Fahrer.
const planerVon = x => x.planer_ressource_id && S.planer.find(p => p.id === x.planer_ressource_id) || null;

}
function planerFelder(x, typ){
  const e = byId(x.eintrag_id), marke = stkWert(x, 'Marke / Modell'), vorname = (x.zustaendig || '').split(' ')[0];
  return { nummer: x.nummer || null, name: (typ === 'fahrzeug' && vorname) || marke || e.titel, ...(typ === 'fahrzeug' ? { stamm_person_id: personId(x.zustaendig) } : {}) };

async function planerAbgleich(res, felder){
  if(Object.entries(felder).every(([k, v]) => (res[k] ?? null) === v)) return true;
  const { error } = await sb.from('planer_ressource').update(felder).eq('id', res.id);
  if(error){ fehler(error, 'Planer'); return false; }
  Object.assign(res, felder); return true;
}

// Haken: an = aufnehmen bzw. wieder einblenden (Art wird nur beim ersten Mal gefragt), aus = ausblenden
async function planSetzen(an, typ){
  const e = byId(S.eid), x = exAktiv(e), res = planerVon(x);
  if(an && !res){
    if(!typ) return ovl(`<h3>Planer: als was?</h3><div class="small muted">So erscheint ${esc(x.nummer || e.titel)} im Einsatzplaner. Nur Fahrzeuge haben einen Stamm-Fahrer.</div>

      <div class="ovlbtns"><button class="btn btn-ghost" data-act="ovlZu">Abbrechen</button></div>`);
    const { data, error } = await sb.from('planer_ressource').insert({ typ, ...planerFelder(x, typ), sortierung: 999 }).select('id,typ,nummer,name,aktiv,stamm_person_id').single();
    if(error) return fehler(error, 'Planer');

}
