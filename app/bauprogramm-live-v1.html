<!DOCTYPE html>
<html lang="de">
<head>

<title>Bauprogramm – Einsatzplaner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#323E4E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
/* Bauprogramm: Tage von oben nach unten, alle Angebote der Auftragsbestätigung als Blöcke mit Lappen
   (Angebot › Arbeitsschritt › Teilschritt), wie im abgesegneten Mockup «Bauprogramm mit Lappen». */
body{margin:0;background:#F5F7F9;color:#232B35;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.4;}
*{box-sizing:border-box;}
.hidden{display:none!important;}
header.app{background:#323E4E;color:#fff;}
header.app .wrap{display:flex;align-items:center;gap:16px;padding:0 16px;}
header.app .brand h1{font-size:15px;margin:0;}
nav.subnav{background:#fff;border-bottom:1px solid #E1E5E9;} nav.subnav .wrap{display:flex;gap:2px;padding:0 16px;}
nav.subnav a{padding:12px 12px 10px;color:#6B7079;font-weight:600;text-decoration:none;font-size:13px;border-bottom:2px solid transparent;}
nav.subnav a.on{color:#323E4E;border-bottom-color:#323E4E;}
.loginwrap{min-height:70vh;display:flex;align-items:center;justify-content:center;}
.logincard{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(35,43,53,.08),0 0 0 1px rgba(35,43,53,.04);padding:24px 22px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;}
.logincard h2{font-size:17px;margin:0 0 4px;color:#323E4E;}
.logincard label{font-size:12px;color:#6B7079;}
.logincard input{height:40px;border:1px solid #B9C0C8;border-radius:8px;padding:0 10px;font:inherit;font-size:15px;width:100%;}
.logincard button{all:unset;box-sizing:border-box;cursor:pointer;height:40px;border-radius:8px;background:#323E4E;color:#fff;font-weight:600;text-align:center;}
.logincard .status{font-size:12.5px;color:#6B7079;min-height:16px;} .logincard .status.err{color:#B4655F;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#323E4E;color:#fff;font-size:13px;padding:9px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:100;}
.toast.err{background:#B4655F;}
.t{height:32px;border:1px solid #B9C0C8;border-radius:8px;padding:0 10px;font:inherit;font-size:13px;color:#232B35;background:#fff;}
.t:focus{outline:none;border-color:#323E4E;}
.btn{all:unset;box-sizing:border-box;cursor:pointer;height:32px;padding:0 12px;border-radius:8px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn.prim{background:#323E4E;color:#fff;} .btn.ghost{background:#fff;border:1px solid #D5DBE1;color:#323E4E;} .btn.ghost:hover{border-color:#4C5C70;}
.btn:focus-visible,.t:focus-visible{outline:2px solid #323E4E;outline-offset:2px;}
.lbl{font-size:12.5px;color:#6B7079;display:inline-flex;align-items:center;gap:6px;}
.kwahl{position:relative;}
.kwahl input{width:280px;}
.menue{position:absolute;left:0;top:100%;margin-top:4px;z-index:30;background:#fff;border:1px solid #D5DBE1;border-radius:8px;box-shadow:0 8px 24px rgba(20,28,38,.16);width:340px;max-height:380px;overflow-y:auto;font-size:13px;}
.menue button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;width:100%;padding:7px 10px;border-top:1px solid #EEF1F4;}
.menue button:hover{background:#F5F7F9;} .menue small{color:#6B7079;font-size:12px;}
.menue .kopfzeile{padding:6px 10px;font-size:11.5px;color:#8B9097;background:#F5F7F9;}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid #EEF1F4;background:#fff;}
.chip{font-size:12.5px;padding:4px 10px;border-radius:99px;background:#F5F7F9;border:1px solid #D5DBE1;color:#4C5C70;}
.chip b{color:#323E4E;font-variant-numeric:tabular-nums;}
.chip.warn{background:#F9D3B2;border-color:#E57E34;color:#8A3F12;}
.haupt{display:grid;grid-template-columns:14px minmax(0,1fr);}
.lscroll{overflow-y:scroll;overflow-x:hidden;height:calc(100vh - 150px);border-right:1px solid #EEF1F4;background:#fff;} .lscroll > div{width:1px;}
/* Drei Ebenen nebeneinander gestaffelt, je ein Drittel sichtbar: vorne Arbeitsschritt, Mitte Teilschritte, hinten Angebot.
   Ein Arbeitstag = 24 px hoch, Wochenende 10 px. */
.ang{margin:1px 2px;border-radius:7px;z-index:1;position:relative;}
.ang .lap{position:absolute;top:0;right:0;bottom:0;width:33.4%;display:flex;flex-direction:column;align-items:stretch;padding:3px 6px;box-sizing:border-box;}
.ang .lap[draggable]{cursor:grab;}
.ang .lap .lk{position:sticky;top:36px;display:flex;gap:4px;align-items:flex-start;font-size:11px;font-weight:700;line-height:1.25;overflow:hidden;}
.ang .lap .lk svg{width:12px;height:12px;flex:none;margin-top:1px;}
.ang.los{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 5px,transparent 5px 10px);}
.ang.ziehe,.as.ziehe{opacity:.45;} .ang.ziel-o{box-shadow:0 -3px 0 #323E4E;} .ang.ziel-u{box-shadow:0 3px 0 #323E4E;}
.ts{margin:1px 33.4% 1px 2px;border-radius:6px;z-index:2;position:relative;cursor:pointer;overflow:visible;}
.ts.erster{cursor:default;}
.ts .lbl{position:absolute;left:50%;right:4px;top:0;font-size:11px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:6px;}
.ts .tip{display:none;position:absolute;left:50%;bottom:100%;z-index:9;background:#323E4E;color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;box-shadow:0 4px 12px rgba(20,28,38,.25);}
.ts:hover .tip{display:block;} .ts:hover{filter:brightness(.94);}
.ts .sch{position:absolute;left:50%;top:-7px;margin-left:-6px;width:12px;height:14px;display:none;align-items:center;justify-content:center;color:#323E4E;z-index:8;background:#fff;border-radius:3px;}
.ts .sch svg{width:11px;height:11px;}
.ts:not(.erster):hover .sch{display:flex;}
.as{margin:1px 66.7% 1px 2px;border-radius:6px;z-index:3;position:relative;padding:2px 6px 6px;font-size:12px;line-height:20px;display:flex;flex-direction:column;min-width:0;overflow:hidden;box-shadow:0 1px 2px rgba(35,43,53,.18);cursor:grab;}
.as .z1{display:flex;align-items:center;gap:4px;min-width:0;}
.as .z1 b{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.as small{font-size:11px;line-height:15px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.as .dauer{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
.as .ib{all:unset;cursor:pointer;width:18px;height:18px;border-radius:50%;border:1px solid #D5DBE1;background:#fff;display:inline-flex;align-items:center;justify-content:center;color:#4C5C70;flex:none;}
.as .ib:hover{border-color:#323E4E;color:#323E4E;} .as .ib svg{width:11px;height:11px;}
.as .fix{font-size:10.5px;font-weight:700;}
.as.konflikt{outline:2px solid #B4655F;outline-offset:-2px;}
.as.gewaehlt{outline:2px solid #323E4E;outline-offset:-2px;}
.as.ziel-o{box-shadow:0 -3px 0 #323E4E,0 1px 2px rgba(35,43,53,.15);} .as.ziel-u{box-shadow:0 3px 0 #323E4E,0 1px 2px rgba(35,43,53,.15);}
.as .griff{position:absolute;left:0;right:0;bottom:0;height:6px;cursor:ns-resize;display:flex;justify-content:center;align-items:center;}
.as .griff::before{content:"";width:22px;height:2px;border-radius:2px;background:currentColor;opacity:.45;}
/* Material, Subunternehmer, Notizen: direkt hineinschreiben, gehört zum Arbeitsschritt und wandert beim Verschieben mit */
.infot{margin:1px 3px;font:inherit;font-size:12px;line-height:1.3;padding:3px 6px;border:1px solid transparent;border-left:3px solid var(--fb);border-radius:0 5px 5px 0;background:rgba(255,255,255,.75);resize:none;color:#232B35;min-height:0;z-index:1;overflow:hidden;}
.infot:hover{border-color:#D5DBE1;border-left-color:var(--fb);} .infot:focus{outline:none;border-color:#323E4E;border-left-color:var(--fb);background:#fff;}
.infot::placeholder{color:#C4CBD3;}
.nurlesen .as{cursor:pointer;}
.leer-start{padding:60px 20px;text-align:center;color:#6B7079;font-size:15px;line-height:1.5;}
.prog{overflow:auto;height:calc(100vh - 150px);border-right:1px solid #D5DBE1;position:relative;background:#fff;}
.raster{display:grid;position:relative;min-width:960px;}
/* Planer-Spalte: Balken der Leute bei diesem Kunden hochkant, nur zum Vergleichen (an Wochenenden unterbrochen) */
.kopf.pl{padding:4px 2px;border-right:1px solid #D5DBE1;display:flex;align-items:center;justify-content:center;gap:3px;font-size:9.5px;letter-spacing:.02em;}
.hbtn{all:unset;cursor:pointer;min-width:20px;height:20px;padding:0 4px;box-sizing:border-box;border-radius:99px;background:#323E4E;color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;letter-spacing:0;text-transform:none;}
.hbtn.an{background:#fff;color:#323E4E;border:1px solid #323E4E;} .hbtn:focus-visible{outline:2px solid #323E4E;outline-offset:2px;}
.plz{border-bottom:1px solid #EEF1F4;border-right:1px solid #D5DBE1;} .plz.frei{background:#F5F7F9;} .plz.fei{background:#FCF5D8;}
.pls{margin:1px 4px;border-radius:4px;z-index:1;overflow:hidden;display:flex;justify-content:center;}
.pls span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:600;white-space:nowrap;padding:5px 0;}
.pls.hilfe{opacity:.55;}
.pls.prov{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.6) 0 3px,transparent 3px 7px)!important;}
.pls.abs{background:repeating-linear-gradient(135deg,#C9D1DB 0 4px,#E3E7EC 4px 8px);}
.plende{height:0;border-top:2px dashed;align-self:end;z-index:2;position:relative;pointer-events:none;}
.plende span{position:absolute;top:-10px;color:#fff;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;white-space:nowrap;}
button.chip{all:unset;cursor:pointer;font-size:12.5px;padding:4px 10px;border-radius:99px;background:#fff;border:1px solid #D5DBE1;color:#323E4E;font-weight:600;}
button.chip:hover{border-color:#4C5C70;} button.chip:focus-visible{outline:2px solid #323E4E;outline-offset:2px;}
/* Fenster-Modus: im Planer als grosses Fenster geöffnet (?fenster=1) */
html.bp-fenster header.app,html.bp-fenster nav.subnav{display:none!important;}
html.bp-fenster body{background:#fff;}
/* Fenster füllt die ganze Höhe; Kopf + Chips bleiben stehen, Programm und Baum scrollen je für sich */
html.bp-fenster,html.bp-fenster body{height:100%;overflow:hidden;}
html.bp-fenster body{display:flex;flex-direction:column;}
html.bp-fenster #appMain{flex:1;min-height:0;display:flex;flex-direction:column;}
html.bp-fenster .haupt{flex:1;min-height:0;grid-template-rows:minmax(0,1fr);}
html.bp-fenster .prog,html.bp-fenster .lscroll{height:auto;min-height:0;}
.kopf{position:sticky;top:0;z-index:3;background:#F5F7F9;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#8B9097;font-weight:600;padding:8px 10px;border-bottom:1px solid #D5DBE1;}
.tag{font-size:12.5px;color:#4C5C70;padding:0 10px;display:flex;align-items:center;gap:6px;border-bottom:1px solid #EEF1F4;font-variant-numeric:tabular-nums;white-space:nowrap;}
.tag b{width:22px;color:#323E4E;}
.tag.frei{background:#F5F7F9;color:#A3B0BE;font-size:9px;line-height:10px;overflow:hidden;} .tag.frei b{color:#A3B0BE;}
.tag.fei{background:#FAEBB0;color:#8A6410;font-size:11.5px;overflow:hidden;}
.zelle{border-bottom:1px solid #EEF1F4;}
.zelle.frei{background:#F5F7F9;} .zelle.fei{background:#FCF5D8;}
.zelle.ziel-tag{background:#D6E7F4!important;box-shadow:inset 0 2px 0 #323E4E;}
.ziel-leer{grid-column:2/5;margin:8px;border:2px dashed #D5DBE1;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:#6B7079;font-size:14px;line-height:1.5;z-index:1;background:rgba(255,255,255,.85);}
.ziel-leer.ziel,.ende.ziel{border-color:#323E4E;color:#323E4E;background:#D6E7F4;}
.ende{grid-column:2/5;margin:4px 8px;border:1.5px dashed #D5DBE1;border-radius:8px;font-size:12px;color:#8B9097;display:flex;align-items:center;justify-content:center;z-index:1;}
.info{margin:2px 6px;font-size:12.5px;padding:5px 4px 5px 8px;line-height:1.3;border-left:3px solid var(--fb);background:rgba(255,255,255,.6);white-space:pre-line;overflow:hidden;}
.detail{position:sticky;bottom:0;z-index:4;background:#fff;border-top:1px solid #D5DBE1;padding:10px 16px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;box-shadow:0 -4px 16px rgba(20,28,38,.08);}
.detail .feld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:#4C5C70;font-weight:600;}
.detail .feld small{font-weight:400;color:#8B9097;}
.detail input.t{width:165px;} .detail .klein{width:66px!important;}
.sp{flex:1;}
.dlgs{position:fixed;inset:0;background:rgba(35,43,53,.35);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:90px 12px 12px;}
.dlg{width:min(460px,100%);max-height:calc(100vh - 110px);overflow:auto;background:#fff;border-radius:12px;box-shadow:0 18px 50px rgba(20,28,38,.3);padding:18px;display:flex;flex-direction:column;gap:12px;}
.dlg h3{margin:0;font-size:17px;color:#323E4E;} .dlg p{margin:0;font-size:13.5px;line-height:1.45;color:#6B7079;}
.dlg .knoepfe{display:flex;gap:8px;justify-content:flex-end;}
@media print{
  header.app,nav.subnav,.kg-seite,.detail,.chips,.lscroll,.as .griff,.as .ic,.ts .sch,.ang .lap > svg{display:none!important;}
  body{background:#fff;} .haupt{display:block;} .prog{height:auto;overflow:visible;border:0;}
  .as{box-shadow:none;break-inside:avoid;} .druckkopf{display:block!important;}
  @page{size:A4 portrait;margin:12mm;}
}
.druckkopf{display:none;padding:0 0 8px;font-size:16px;font-weight:700;color:#323E4E;}
@media (max-width:900px){ .prog{height:auto;max-height:none;border-right:0;} }

</style>

<body>
<header class="app"><div class="wrap">
  <a class="backlink" href="index.html">Startseite</a>
  <div class="brand"><h1>Einsatzplaner</h1></div>
  <span class="userbar hidden" id="userbar"><span id="userbarText"></span><button id="logoutBtn">Abmelden</button></span>
</div></header>
<nav class="subnav"><div class="wrap">
  <a href="einsatzplaner-live-v1.html#plan">Planer</a>
  <a href="bauprogramm-live-v1.html" class="on">Bauprogramm</a>
</div></nav>
<span class="kwahl" data-kg-seite="links"><input class="t" id="kundeSuche" placeholder="Baustelle / Kunde wählen …" autocomplete="off"><span class="menue hidden" id="kundeMenue"></span></span>
<label class="lbl" data-kg-seite="mitte">Start <input class="t" type="date" id="start"></label>
<button type="button" class="btn ghost" data-kg-seite="mitte" id="zumProgBtn" title="Zum Anfang des Programms scrollen">Zum Programm</button>
<button type="button" class="btn ghost" data-kg-seite="rechts" id="druckBtn">Drucken / PDF</button>
<button type="button" class="kg-ibtn hidden" data-kg-seite="rechts" id="zuBtn" title="Schliessen (zurück zum Planer)" aria-label="Schliessen"></button>
<main id="appMain"></main>
<script>
// Bauprogramm pro Kunde/Baustelle. Quellen: Auftragsbestätigungen + Angebote aus dem Easybill-Abgleich (easybill_dokument)
// und Offerten aus dem Offertentool (Teilschritt-Tage). Blöcke + Reihenfolge in bauprogramm / bauprogramm_block.
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const ic = (n, s = 14) => KG.icon(n, s);
const TAG_H = 8.5, TEAM = 2;
const FAM = ['erde', 'blau', 'petrol', 'gold', 'gruen', 'orange', 'violett', 'beere', 'oliv'];
const farbe = f => { const p = KG.palette[f] || KG.palette.grau; return { f: p[1], h: p[4], t: p[0] }; };
const WT = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const iso = d => d.toISOString().slice(0, 10);
const plus = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const kurz = d => `${d.getDate()}.${d.getMonth() + 1}.`;
const toast = (t, err) => { const e = document.createElement('div'); e.className = 'toast' + (err ? ' err' : ''); e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), err ? 5000 : 2000); };
let sb, ICH, DARF = true;
// Fenster-Modus: im Planer über dem Planer geöffnet; Schliessen schickt eine Nachricht an den Planer
const FENSTER = new URLSearchParams(location.search).has('fenster');
if(FENSTER){ document.documentElement.classList.add('bp-fenster'); $('zuBtn').classList.remove('hidden'); $('zuBtn').innerHTML = ic('x'); }
async function schliessen(){ if(speicherTimer) await speichern(); parent.postMessage({ bp: 'zu' }, location.origin); }
$('zuBtn').addEventListener('click', schliessen);
addEventListener('keydown', e => { if(FENSTER && e.key === 'Escape' && !document.querySelector('.dlgs')) schliessen(); });

// ---------------------------------------------------------------- Start / Login
async function start(){
  KG._sb = KG._sb || window.supabase.createClient('https://oalapdxinqlnzwxhyuzy.supabase.co', 'sb_publishable_DoeD4uEnwemmnFu4AxE9uw_5lmQYc5P');
  sb = KG._sb;
  $('logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });
  const { data: { session } } = await sb.auth.getSession();
  if(!session) return login();
  const { data: b } = await sb.from('benutzer').select('rolle,aktiv,email,anzeigename').eq('id', session.user.id).maybeSingle();
  if(!b || !b.rolle || b.aktiv === false){ $('appMain').innerHTML = '<div class="loginwrap"><div class="logincard"><h2>Noch nicht freigeschaltet</h2></div></div>'; return; }
  ICH = session.user.id;
  if(KG.ladeRechte) await KG.ladeRechte();
  const r = KG.darf ? KG.darf('plan', 'einsaetze', 'bearbeiten') : null; DARF = r === null || r !== 'K';
  $('userbar').classList.remove('hidden'); $('userbarText').textContent = b.anzeigename || b.email || '';
  await ladeGrund();
  const k = new URLSearchParams(location.search).get('kunde');
  if(k) await kundeOeffnen(k); else zeigeLeer();
}
function login(){
  $('appMain').innerHTML = `<div class="loginwrap"><div class="logincard"><h2>Anmelden</h2>
    <label for="lE">E-Mail</label><input autocomplete="username" id="lE" type="email"><label for="lP">Passwort</label><input autocomplete="current-password" id="lP" type="password">
    <button type="button" id="lB">Anmelden</button><div class="status" id="lS"></div></div></div>`;
  const los = async () => { $('lS').textContent = 'Melde an …';
    const { error } = await sb.auth.signInWithPassword({ email: $('lE').value.trim(), password: $('lP').value });
    if(error){ $('lS').textContent = 'Login fehlgeschlagen: ' + error.message; $('lS').className = 'status err'; return; } location.reload(); };
  $('lB').addEventListener('click', los); $('lP').addEventListener('keydown', e => { if(e.key === 'Enter') los(); });
}
function zeigeLeer(){ $('appMain').innerHTML = '<div class="leer-start">Oben links eine Baustelle wählen.<br>Vorgeschlagen werden Kunden mit Auftragsbestätigung oder bestätigter Offerte.</div>'; }

// ---------------------------------------------------------------- Grunddaten: Feiertage, Kunden mit Auftrag
let FEIERTAGE = {}, VORSCHLAG = [];
async function ladeGrund(){
  const [f, ab, of, bp] = await Promise.all([
    sb.from('planer_feiertag').select('datum,name'),
    sb.from('easybill_dokument').select('kunde_id,datum,nummer').eq('typ', 'ORDER').not('kunde_id', 'is', null).order('datum', { ascending: false }),
    sb.from('offerte').select('kunde_id,datum').eq('status', 'bestaetigt').not('kunde_id', 'is', null),
    sb.from('bauprogramm').select('kunde_id,geaendert_am')
  ]);
  (f.data || []).forEach(x => FEIERTAGE[x.datum] = x.name);
  const info = new Map();
  (bp.data || []).forEach(x => info.set(x.kunde_id, { t: 'Bauprogramm vorhanden', d: x.geaendert_am }));
  (ab.data || []).forEach(x => { if(!info.has(x.kunde_id)) info.set(x.kunde_id, { t: 'AB ' + x.nummer, d: x.datum }); });
  (of.data || []).forEach(x => { if(!info.has(x.kunde_id)) info.set(x.kunde_id, { t: 'Offerte bestätigt', d: x.datum }); });
  const ids = [...info.keys()];

  G.forEach(g => {
    const fam = g.angebot ? famVon(g.angebot) : 'grau', p5 = pal(fam), r1 = zeile(g.von), r2 = zeile(g.bis) + 1;
    // Ebene 1 (hinten): Angebot bzw. herausgelöster Block, Lappen rechts zum Verschieben
    const lapT = g.los ? (g.angebot ? 'aus ' + (KNOTEN[g.angebot]?.nr || 'Angebot') : 'Eigener Block') : angText(g);
    h += `<div class="ang${g.los ? ' los' : ''}" data-g="${g.id}" style="grid-column:${cA};grid-row:${r1}/${r2};background:${p5[3]}">
      <span class="lap"${DARF ? ` draggable="true" data-zg="${g.id}"` : ''} title="${esc((g.los ? lapT : 'Angebot ' + angText(g)) + (DARF ? ' – ziehen = verschieben' : ''))}" style="color:${p5[0]}"><span class="lk">${DARF ? IC.griff : ''}<span>${esc(lapT)}${g.neu ? ' · neu' : ''}</span></span></span></div>`;
    g.teile.forEach(p => {
      const pr1 = zeile(p.von), pr2 = zeile(p.bis) + 1, tg = teilTage(p);
      // Ebene 2 (Mitte): Teilschritte als schmaler Lappen, Name per Mouse-over, Klick = vor diesem Teilschritt teilen
      const ts = p.teile.filter(id => String(id).startsWith('ts:'));
      if(ts.length){
        const W = []; for(let d = new Date(p.von); d <= p.bis; d = plus(d, 1)) if(arbeitstag(d)) W.push(new Date(d));
        let cum = 0;
        ts.forEach((id, i) => {
          const x = blattTage(KNOTEN[id], p.team), s0 = Math.min(W.length - 1, Math.floor(cum + 1e-9));
          let e0 = Math.min(W.length - 1, Math.max(s0, Math.ceil(cum + x - 1e-9) - 1)); if(i === ts.length - 1) e0 = W.length - 1;
          cum += x;
          const tip = `${KNOTEN[id].n} · ${Math.round(x * 10) / 10} T${i && DARF ? ' — Klick: hier teilen' : ''}`;
          h += `<div class="ts${i === 0 || !DARF ? ' erster' : ''}" data-teil="${p.id}" data-i="${i}" style="grid-column:${cA};grid-row:${zeile(W[s0])}/${zeile(W[e0]) + 1};background:${i % 2 ? p5[4] : '#fff'};box-shadow:inset 0 0 0 1px ${p5[3]}">
            <span class="lbl">${esc(KNOTEN[id].n)}</span><span class="tip">${esc(tip)}</span>${i && DARF ? `<span class="sch">${IC.schere}</span>` : ''}</div>`;
        });
      }
      // Ebene 3 (vorne): Arbeitsschritt
      const nTs = ts.length, knopf = !DARF ? '' : g.los ? `<button type="button" class="ib" data-zur="${g.id}" title="${g.angebot ? 'Zurück ins Angebot' : 'Eigenen Block löschen'}" aria-label="Zurück">${g.angebot ? IC.zurueck : ic('trash', 12)}</button>`
        : g.teile.length > 1 && nTs ? `<button type="button" class="ib" data-los="${p.id}" data-lg="${g.id}" title="Herauslösen (eigener Block, frei verschiebbar)" aria-label="Herauslösen">${IC.los}</button>` : '';
      const kl = KNOTEN[p.teile[0]]?.klein;
      h += `<div class="as${p.konflikt ? ' konflikt' : ''}${gewaehlt === p.id ? ' gewaehlt' : ''}"${DARF ? ' draggable="true"' : ''} data-p="${p.id}" data-pg="${g.id}" style="grid-column:${cA};grid-row:${pr1}/${pr2};background:${p5[4]};color:${p5[0]}">
        <span class="z1"><b title="${esc(teilName(p))}">${esc(teilName(p))}</b>${knopf}<span class="dauer">${tg} T</span></span>
        ${tg > 1 ? `<small>${kurz(p.von)}–${kurz(p.bis)}${nTs ? ` · ${nTs} TS` : kl ? ' · ' + esc(kl) : ''}${p.fix ? ' · <span class="fix">fix</span>' : ''}${p.konflikt ? ' · <span class="fix">zu spät</span>' : ''}</small>` : ''}
        ${DARF ? `<span class="griff" data-griff="${p.id}" title="Ziehen = länger/kürzer"></span>` : ''}</div>
        ${['mat', 'sub', 'notiz'].map((f, i) => `<textarea class="infot" data-feld="${f}" data-tp="${p.id}" style="grid-column:${cA + 1 + i};grid-row:${pr1}/${pr2};--fb:${p5[3]}" aria-label="${['Spez. Material', 'Subunternehmer', 'Notiz'][i]} zu ${esc(teilName(p))}"${DARF ? '' : ' readonly'}>${esc(p[f] || '')}</textarea>`).join('')}`;
    });
  });
  // Linie, wo der Vorarbeiter-Balken im Planer endet
  const pe = planerEnde();
  if(pe && G.length && zeile(pe.bis) > 1) h += `<div class="plende" style="grid-column:1/-1;grid-row:${zeile(pe.bis)};border-color:${pe.farbe}"><span style="left:${nP * 28 + 110}px;background:${pe.farbe};color:${KG.textAuf(pe.farbe)}">${esc(pe.name)} im Planer bis ${kurz(pe.bis)}</span></div>`;
  R.innerHTML = h;
  if($("lsInner")) $("lsInner").style.height = $("prog").scrollHeight + "px";
  chips(ende); binden(); detail();
}
// Ende des (ersten) Vorarbeiters im Planer, nur Baustellen-Balken
function planerEnde(){
  const p = PL.find(x => x.va); if(!p) return null;
  const ein = p.ein.filter(x => !x.hilfe); if(!ein.length) return null;
  const l = ein.reduce((m, x) => x.bis > m.bis ? x : m);
  return { name: p.kurz, bis: D(l.bis), farbe: l.farbe };
}
function chips(ende){
  const drin = alleTeile().reduce((s, p) => s + teilTage(p), 0), konf = alleTeile().filter(p => p.konflikt).length, nNeu = G.filter(g => g.neu).length;
  const pe = planerEnde(), nH = PL.filter(p => !p.va).length;
  const diff = pe && G.length ? (ende > pe.bis ? atZwischen(pe.bis, ende) : -atZwischen(ende, pe.bis)) : 0;
  $('chips').innerHTML = `<span class="chip">Programm <b>${drin} Tage</b> · ${ANG.length} Angebot${ANG.length === 1 ? '' : 'e'}</span>
    ${G.length ? `<span class="chip">Start <b>${kurz(startDatum())}</b> · Ende <b>${WT[ende.getDay()]} ${kurz(ende)}</b></span>` : ''}
    ${nNeu ? `<span class="chip warn">${nNeu === 1 ? '1 neues Angebot' : nNeu + ' neue Angebote'} hinten angehängt</span>` : ''}
    ${konf ? `<span class="chip warn">${konf === 1 ? '1 fixer Termin ist' : konf + ' fixe Termine sind'} gefährdet</span>` : ''}
    ${diff ? `<span class="chip warn">Planer-Balken ${esc(pe.name)} ${Math.abs(diff)} Arbeitstage ${diff > 0 ? 'kürzer' : 'länger'} als das Programm</span>` : ''}
    ${DARF ? '<button type="button" class="chip" id="eigenBtn" title="z. B. Reserve oder Arbeit ohne Angebot">+ Eigener Block</button>' : ''}`;
  if($('hilfeBtn')) $('hilfeBtn').onclick = () => { HILFE = !HILFE; try{ localStorage.setItem('bp-hilfe', HILFE ? '1' : '0'); }catch(e){} zeichnen(); };
  if($('eigenBtn')) $('eigenBtn').onclick = () => { const p = neuerTeil([], { name: 'Reserve', extra: 1 }); G.push({ id: crypto.randomUUID(), angebot: null, los: true, teile: [p] }); gewaehlt = p.id; geaendert(); };
}
const teilVon = id => { for(const g of G){ const p = g.teile.find(x => x.id === id); if(p) return { g, p }; } return {}; };
function binden(){
  const R = $('raster');
  R.querySelectorAll('.as').forEach(el => el.addEventListener('click', e => { if(e.target.closest('.griff,.ib')) return; gewaehlt = gewaehlt === el.dataset.p ? null : el.dataset.p; zeichnen(); }));
  if(!DARF) return;
  // Material, Subunternehmer, Notizen direkt eintippen: speichern ohne neu zu zeichnen (Cursor bleibt im Feld)
  R.querySelectorAll('.infot').forEach(t => t.addEventListener('input', () => { const { p } = teilVon(t.dataset.tp); if(!p) return;
    p[t.dataset.feld] = t.value.trim() || null; clearTimeout(speicherTimer); speicherTimer = setTimeout(speichern, 800); }));
  // Ziehen: Angebot/Block am Lappen, Arbeitsschritt nur innerhalb seines Angebots
  R.querySelectorAll('[data-zg]').forEach(l => l.addEventListener('dragstart', e => { ziehen = { g: l.dataset.zg }; e.dataTransfer.setData('text/plain', ''); l.closest('.ang').classList.add('ziehe'); }));
  R.querySelectorAll('.as').forEach(el => el.addEventListener('dragstart', e => { if(e.target.closest('.griff,.ib')){ e.preventDefault(); return; } ziehen = { p: el.dataset.p, g: el.dataset.pg }; e.dataTransfer.setData('text/plain', ''); el.classList.add('ziehe'); }));
  const unten = (e, el) => e.clientY > el.getBoundingClientRect().top + el.offsetHeight / 2;
  const weg = () => R.querySelectorAll('.ziel-o,.ziel-u').forEach(x => x.classList.remove('ziel-o', 'ziel-u'));
  R.querySelectorAll('.ang,.as').forEach(el => {
    el.addEventListener('dragover', e => { if(!ziehen) return; const ziel = ziehen.p ? e.target.closest('.as') : e.target.closest('.ang') || (e.target.closest('.as') && R.querySelector(`.ang[data-g="${e.target.closest('.as').dataset.pg}"]`));
      if(!ziel || (ziehen.p ? ziel !== el : !el.classList.contains('ang') && !el.classList.contains('as'))) return; e.preventDefault(); weg(); (ziehen.p ? el : ziel).classList.add(unten(e, ziehen.p ? el : ziel) ? 'ziel-u' : 'ziel-o'); });
    el.addEventListener('drop', e => { if(!ziehen) return; e.preventDefault(); e.stopPropagation(); weg(); const z0 = ziehen; ziehen = null;
      if(z0.p && el.classList.contains('as')){
        if(el.dataset.pg !== z0.g){ toast('In ein anderes Angebot geht nicht – zuerst herauslösen.'); zeichnen(); return; }
        const g = G.find(x => x.id === z0.g), i = g.teile.findIndex(x => x.id === z0.p), [m] = g.teile.splice(i, 1);
        let j = g.teile.findIndex(x => x.id === el.dataset.p); if(unten(e, el)) j++; g.teile.splice(j < 0 ? g.teile.length : j, 0, m);
      } else if(!z0.p){
        const zielG = el.classList.contains('ang') ? el.dataset.g : el.dataset.pg, zEl = R.querySelector(`.ang[data-g="${zielG}"]`);
        if(zielG === z0.g){ zeichnen(); return; }
        const i = G.findIndex(x => x.id === z0.g), [m] = G.splice(i, 1); let j = G.findIndex(x => x.id === zielG); if(unten(e, zEl)) j++; G.splice(j, 0, m);
      }
      geaendert(); });
  });
  // Auf einen freien Tag ziehen = dort beginnen: erstes Angebot verschiebt den Start, sonst fixes Datum auf dem ersten Teil
  // (früher als möglich = rot «zu spät»). Gilt nur fürs Bauprogramm, im Planer ändert sich nichts.
  R.querySelectorAll('.zelle[data-di]').forEach(c => {
    c.addEventListener('dragover', e => { if(!ziehen) return; e.preventDefault(); R.querySelectorAll('.ziel-tag').forEach(x => x.classList.remove('ziel-tag')); c.classList.add('ziel-tag'); });
    c.addEventListener('dragleave', () => c.classList.remove('ziel-tag'));
    c.addEventListener('drop', e => { if(!ziehen) return; e.preventDefault(); c.classList.remove('ziel-tag'); const z0 = ziehen; ziehen = null;
      let d = plus(T0, +c.dataset.di); while(!arbeitstag(d)) d = plus(d, 1);
      if(z0.p){ const { p } = teilVon(z0.p); if(p) p.fix = iso(d); }
      else { const g = G.find(x => x.id === z0.g); if(!g) return;
        if(G.indexOf(g) === 0){ $('start').value = iso(d); g.teile[0].fix = null; } else g.teile[0].fix = iso(d); }
      geaendert(); toast('Beginnt jetzt am ' + kurz(d) + '. Fixes Datum entfernen: Arbeitsschritt anklicken.'); });
  });
  // Herauslösen: eigener Block (gestreifter Lappen «aus …») direkt nach dem Angebot
  R.querySelectorAll('[data-los]').forEach(b => b.onclick = e => { e.stopPropagation(); const g = G.find(x => x.id === b.dataset.lg), i = g.teile.findIndex(x => x.id === b.dataset.los), [p] = g.teile.splice(i, 1);
    G.splice(G.indexOf(g) + 1, 0, { id: crypto.randomUUID(), angebot: g.angebot, los: true, teile: [p] }); gewaehlt = p.id; geaendert(); toast('Herausgelöst – am gestreiften Lappen frei verschiebbar.'); });
  // Zurück ins Angebot (Reihenfolge wie im Angebot); eigener Block ohne Angebot: löschen
  R.querySelectorAll('[data-zur]').forEach(b => b.onclick = e => { e.stopPropagation(); const g = G.find(x => x.id === b.dataset.zur);
    if(!g.angebot){ if(!confirm(`«${teilName(g.teile[0])}» löschen?`)) return; G.splice(G.indexOf(g), 1); gewaehlt = null; geaendert(); return; }
    const ziel = G.find(x => x.angebot === g.angebot && !x.los); G.splice(G.indexOf(g), 1);
    if(!ziel){ g.los = false; G.push(g); geaendert(); return; }
    const ord = blaetter(KNOTEN[g.angebot]).map(k => k.id); ziel.teile.push(...g.teile); ziel.teile.sort((x, y) => ord.indexOf(x.teile[0]) - ord.indexOf(y.teile[0])); geaendert(); });
  // Teilen: Klick auf einen Teilschritt-Lappen schneidet den Arbeitsschritt vor diesem Teilschritt
  R.querySelectorAll('.ts:not(.erster)').forEach(el => el.onclick = () => { const { g, p } = teilVon(el.dataset.teil); if(!p) return; const i = +el.dataset.i;
    const ts = p.teile.filter(id => String(id).startsWith('ts:')), rest = ts.slice(i);
    p.teile = p.teile.filter(id => !rest.includes(id)); g.teile.splice(g.teile.indexOf(p) + 1, 0, neuerTeil(rest, { team: p.team })); geaendert(); toast('Geteilt – den zweiten Teil kannst du jetzt herauslösen.'); });
  // Länge: unten am Arbeitsschritt ziehen
  R.querySelectorAll('[data-griff]').forEach(gr => gr.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation(); const { p } = teilVon(gr.dataset.griff);
    const bewegen = ev => {
      const t = [...R.querySelectorAll('.tag')].find(x => { const r = x.getBoundingClientRect(); return ev.clientY >= r.top && ev.clientY < r.bottom; });
      if(!t) return; const tagIso = iso(plus(T0, +t.dataset.i));
      let n = 0; for(let d = new Date(p.von); iso(d) <= tagIso; d = plus(d, 1)) if(arbeitstag(d)) n++;
      n = Math.max(1, n); const alt = teilTage(p); if(n !== alt){ p.extra = (p.extra || 0) + n - alt; zeichnen(); }
    };
    const los = () => { document.removeEventListener('pointermove', bewegen); document.removeEventListener('pointerup', los); speichern(); };
    document.addEventListener('pointermove', bewegen); document.addEventListener('pointerup', los);
  }));
}
function detail(){
  const { g, p } = teilVon(gewaehlt), Dt = $('detail');
  if(!p){ Dt.classList.add('hidden'); return; }
  Dt.classList.remove('hidden');
  const ro = DARF ? '' : ' disabled', eigen = !p.teile.length;
  Dt.innerHTML = `${eigen ? `<div class="feld">Arbeit<input class="t" id="dN" value="${esc(p.name || '')}"${ro}></div>` : `<div class="feld">Arbeit<b style="font-size:14px;color:#232B35;padding:6px 0">${esc(teilName(p))}</b></div>`}
    <div class="feld">Tage<input class="t klein" id="dT" type="number" min="1" value="${teilTage(p)}"${ro}></div>
    ${hatStunden(p) ? `<div class="feld">Team <small>Personen</small><input class="t klein" id="dTeam" type="number" min="1" max="8" value="${p.team}"${ro}></div>` : ''}
    <div class="feld">Fixes Datum <small>optional</small><input class="t" id="dF" type="date" value="${p.fix || ''}"${ro}></div>
    <span class="sp"></span><span style="font-size:12px;color:#6B7079;align-self:center">Material, Subunternehmer und Notizen schreibst du rechts direkt in die Spalten.</span><button class="btn prim" type="button" id="dOk">Fertig</button>`;
  const an = (id, fn) => { const el = $(id); if(el) el.addEventListener('change', e => { fn(e.target.value); geaendert(); }); };
  an('dN', v => p.name = v.trim() || p.name);
  an('dT', v => { const n = Math.max(1, parseInt(v) || 1); p.extra = (p.extra || 0) + n - teilTage(p); });
  an('dTeam', v => p.team = Math.max(1, parseInt(v) || TEAM));
  an('dF', v => p.fix = v || null); an('dM', v => p.mat = v.trim() || null); an('dS', v => p.sub = v.trim() || null); an('dNo', v => p.notiz = v.trim() || null);
  $('dOk').onclick = () => { gewaehlt = null; zeichnen(); };
}

// ---------------------------------------------------------------- Speichern (nach jeder Änderung, kurz verzögert)
let speicherTimer = null;
function geaendert(){ G.forEach(g => delete g.neu); zeichnen(); clearTimeout(speicherTimer); speicherTimer = setTimeout(speichern, 500); }
async function speichern(){
  clearTimeout(speicherTimer); speicherTimer = null;
  if(!DARF || !KUNDE) return;
  if(!PROG){
    const { data, error } = await sb.from('bauprogramm').insert({ kunde_id: KUNDE.id, start: $('start').value || iso(new Date()) }).select('*').single();
    if(error){ toast('Speichern fehlgeschlagen: ' + error.message, true); return; }
    PROG = data;
  } else await sb.from('bauprogramm').update({ start: $('start').value, geaendert_am: new Date().toISOString() }).eq('id', PROG.id);
  let i = 0;
  const zeilen = G.flatMap(g => g.teile.map(p => ({ id: p.id, programm_id: PROG.id, sortierung: i++, name: teilName(p), farbe: g.angebot ? famVon(g.angebot) : 'grau', teile: p.teile,
    extra: p.extra || 0, team: p.team || TEAM, fix: p.fix || null, mat: p.mat || null, sub: p.sub || null, notiz: p.notiz || null, ursprung_id: null, gruppe: g.id, angebot: g.angebot, los: !!g.los })));
  if(zeilen.length){
    const { error } = await sb.from('bauprogramm_block').upsert(zeilen);
    if(error){ toast('Speichern fehlgeschlagen: ' + error.message, true); return; }
  }
  const ids = zeilen.map(z => z.id);
  const q = sb.from('bauprogramm_block').delete().eq('programm_id', PROG.id);
  const { error: e3 } = ids.length ? await q.not('id', 'in', `(${ids.join(',')})`) : await q;
  if(e3) toast('Speichern fehlgeschlagen: ' + e3.message, true);
}
$('start').addEventListener('change', () => { if(KUNDE){ geaendert(); zumProgramm(); } });
$('zumProgBtn').addEventListener('click', zumProgramm);
$('druckBtn').addEventListener('click', () => { if(!KUNDE) return toast('Zuerst eine Baustelle wählen.', true); gewaehlt = null; zeichnen(); window.print(); });
window.addEventListener('beforeunload', () => { if(speicherTimer) speichern(); });
start();
</script>
