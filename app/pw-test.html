<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=4"></script>
<title>Passwort-Manager-Test – Knechtgarten</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font:14px/1.4 -apple-system,"Segoe UI",Arial,sans-serif;background:#F5F7F9;color:#232B35;margin:0;padding:20px;}
h1{font-size:18px;color:#323E4E;} h2{font-size:14px;color:#323E4E;margin:0 0 6px;}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.karte{background:#fff;border:1px solid #E1E5E9;border-radius:10px;padding:12px 14px;}
table{width:100%;border-collapse:collapse;} td{padding:3px 4px;border-bottom:1px solid #EEF1F3;}
input{font:inherit;width:100%;box-sizing:border-box;border:1px solid #E1E5E9;border-radius:6px;padding:5px 8px;}
label{display:block;font-size:12px;color:#8B9097;}
.leise{color:#8B9097;font-size:12.5px;}
</style>
</head>
<body>
<h1>Test: Welche Feld-Art lässt Dashlane in Ruhe?</h1>
<p class="leise">Diese Seite dient nur zum Testen und ändert nichts. Mit «?pwdiag» in der Adresse erscheint nach etwa 6 Sekunden unten der Diagnose-Kasten, dann «Kopieren» klicken und den Text in den Chat einfügen.</p>
<div class="raster" id="raster"></div>
<!-- unsichtbares Login wie in den Tools (?login=weg: wird vor dem Aufbau der Felder aus der Seite entfernt) -->
<div class="hidden" id="loginwrap" style="display:none"><div class="logincard">
  <input autocomplete="username" id="loginEmail" type="text"><input autocomplete="current-password" id="loginPassword" type="password">
  <button id="loginBtn">Anmelden</button></div></div>
<script>
const MODUS = new URLSearchParams(location.search).get('login') || 'ohne';
if(MODUS === 'ohne') document.getElementById('loginwrap').remove();
document.querySelector('h1').textContent += ` (Login: ${MODUS})`;
// Gleiche Werte wie in den Einstellungen (dort von Dashlane als «Hausnummer» eingestuft)
const WERTE = ['Maschinen & Fahrzeuge', 'Geräte & Werkzeug', 'Pooltechnik', 'Pflanzen', 'Baustelle', 'Pflege'];
const VARIANTEN = [
  ['A', 'wie heute (ohne Beschriftung)', v => `<input type="text" data-variante="A" value="${v}">`],
  ['B', 'mit name="freitext"', v => `<input type="text" data-variante="B" name="freitext" value="${v}">`],
  ['C', 'mit aria-label', v => `<input type="text" data-variante="C" aria-label="Kategorie-Bezeichnung" value="${v}">`],
  ['D', 'type="search"', v => `<input type="search" data-variante="D" value="${v}">`],
  ['E', 'Einstufung «other» vorgegeben', v => `<input type="text" data-variante="E" data-dashlane-classification="other" value="${v}">`],
  ['F', 'autocomplete="nope"', v => `<input type="text" data-variante="F" autocomplete="nope" value="${v}">`],
  ['G', 'mit <label>', v => `<label>Kategorie<input type="text" data-variante="G" value="${v}"></label>`],
  ['H', 'mit Platzhalter', v => `<input type="text" data-variante="H" placeholder="Kategorie" value="${v}">`],
  ['I', 'mit id', v => `<input type="text" data-variante="I" id="kat-${WERTE.indexOf(v)}" value="${v}">`],
  ['J', 'name + aria-label + Platzhalter', v => `<input type="text" data-variante="J" name="kategorie" aria-label="Kategorie" placeholder="Kategorie" value="${v}">`],
];
// wie in den Tools: Felder entstehen erst nach dem Anmelden (hier nach 2 Sekunden)
setTimeout(() => { if(MODUS === 'weg'){ const l = document.getElementById('loginwrap'); if(l) (l.closest('form') || l).remove(); } }, 1000);
setTimeout(() => {
  document.getElementById('raster').innerHTML = VARIANTEN.map(([k, t, f]) =>
    `<div class="karte"><h2>${k}: ${t.replace(/</g, '&lt;')}</h2><table>${WERTE.map(v => `<tr><td>${f(v)}</td></tr>`).join('')}</table></div>`).join('');
}, 2000);
</script>
</body>
</html>
