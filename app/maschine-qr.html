<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=98"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Knechtgarten · Maschine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@600&display=swap" rel="stylesheet">
<style>
/* Handy-Seite nach dem Scan eines Maschinen-Klebers (ohne Anmeldung).
   Ein Kleber pro Stück: Auswahl Arbeitssicherheit / Anleitung (alter Sicherheits-Kleber direkt Sicherheit) – Daten über die Edge Function «maschine-qr». */
:root{--navy:#323E4E;--bg:#F5F7F9;--grau:#8B9097;--line:#E1E5EA;--blau:#D6E7F4;--gruen:#D1DB5F;--rot:#B42318;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--navy);font:16px/1.5 -apple-system,"Segoe UI",Arial,sans-serif;}
.kopf{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;}
.kopf .marke{font-family:Jost,sans-serif;font-weight:600;font-size:17px;letter-spacing:.2px;}
main{max-width:640px;margin:0 auto;padding:14px 16px 32px;}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;}
.titel{display:flex;gap:12px;align-items:center;}
.titel img{width:72px;height:72px;object-fit:cover;border-radius:8px;flex:none;}
h1{font-family:Jost,sans-serif;font-weight:600;font-size:22px;line-height:1.2;margin:0;}
.nr{color:var(--grau);font-size:14px;}
.art{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:20px;padding:3px 10px;margin-bottom:6px;}
.art.sicherheit{background:var(--rot);color:#fff;}
.art.verwendung{background:var(--blau);color:var(--navy);}
.art svg{width:15px;height:15px;}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--grau);margin:0 0 8px;font-weight:700;}
.psa{display:flex;flex-wrap:wrap;gap:6px;}
.psa span{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:14px;font-weight:600;}
.txt img,.txt video{max-width:100%;height:auto;border-radius:8px;}
.txt table{border-collapse:collapse;width:100%;font-size:14px;} .txt td,.txt th{border:1px solid var(--line);padding:4px 6px;}
.txt p:first-child{margin-top:0;} .txt p:last-child{margin-bottom:0;}
.doc{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);color:var(--navy);text-decoration:none;font-weight:600;}
.doc:first-of-type{border-top:0;}
.doc svg{width:20px;height:20px;flex:none;color:var(--grau);}
.leer{color:var(--grau);}
.wahl{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
.kachel{display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;color:var(--navy);text-decoration:none;}
.kachel svg{grid-row:1/3;width:30px;height:30px;justify-self:center;} .kachel b{font-size:18px;} .kachel span{font-size:14px;color:var(--grau);}
.kachel.sicherheit{border-color:#F2C9C4;} .kachel.sicherheit svg{color:var(--rot);}
.kachel:active{background:var(--bg);}
.zurueck{display:inline-block;margin:2px 0 4px;color:var(--navy);font-weight:600;text-decoration:none;font-size:15px;}
.fuss{text-align:center;color:var(--grau);font-size:13px;margin-top:20px;}
.fuss a{color:var(--navy);}
</style>
</head>
<body data-kg-ohne-leiste>
<div class="kopf"><span class="marke">Knechtgarten</span></div>
<main id="inhalt"><div class="card leer">Lädt …</div></main>
<script>
const SUPABASE_URL = 'https://oalapdxinqlnzwxhyuzy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_DoeD4uEnwemmnFu4AxE9uw_5lmQYc5P';
const PSA = { brille: 'Schutzbrille', gesicht: 'Gesichtsschutz', gehoer: 'Gehörschutz', atem: 'Atemschutz', handschuhe: 'Schutzhandschuhe',
  schuhe: 'Sicherheitsschuhe', helm: 'Schutzhelm', schnitt: 'Schnittschutz', weste: 'Warnweste', kleidung: 'Schutzkleidung' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
// Überschrift-Icons (eigene erlaubt): Helm, Buch, Datei
const HELM = svg('<path d="M4 16h16M5 16a7 7 0 0 1 14 0M10 9.5V6.5h4v3"/><path d="M3 16v2h18v-2"/>');
const BUCH = svg('<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7"/>');
const DATEI = window.KG?.icon ? KG.icon('dokument', 20) : svg('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>');
// Text aus dem eigenen Editor: Skripte und Ereignis-Attribute sicherheitshalber entfernen
function sauber(html){
  const t = document.createElement('template'); t.innerHTML = html || '';
  t.content.querySelectorAll('script,iframe,object,embed,style').forEach(n => n.remove());
  t.content.querySelectorAll('*').forEach(n => [...n.attributes].forEach(a => { if(/^on/i.test(a.name) || /^\s*javascript:/i.test(a.value)) n.removeAttribute(a.name); }));
  return t.innerHTML;
}
const leerText = h => !(h || '').replace(/<[^>]+>/g, '').trim() && !/<(img|video|table)/.test(h || '');
async function start(){
  const m = location.pathname.match(/^\/m\/([a-z0-9]+)/i), code = m ? m[1] : new URLSearchParams(location.search).get('c');
  const el = document.getElementById('inhalt');
  if(!code){ el.innerHTML = '<div class="card leer">Kein Code gefunden. Bitte den QR-Code auf der Maschine nochmals scannen.</div>'; return; }
  let d;
  try{
    const r = await fetch(`${SUPABASE_URL}/functions/v1/maschine-qr`, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY }, body: JSON.stringify({ code }) });
    d = await r.json(); if(!r.ok) throw new Error(d.error || r.status);
  }catch(e){ el.innerHTML = '<div class="card leer">Dieser QR-Code ist nicht mehr gültig. Bitte im Büro melden.</div>'; return; }
  // Ein Kleber pro Stück: Auswahl (Arbeitssicherheit / Anleitung) – nur was es gibt; nur eines → direkt.
  // Alter Sicherheits-Kleber (art 'sicherheit'): direkt Sicherheit. Ansicht im Hash, damit «Zurück» am Handy zur Auswahl führt.
  D = d;
  const hatSich = d.psa.length || !leerText(d.html) || d.dateien.length, hatAnl = !leerText(d.anleitung);
  D.teile = [hatSich && 'sicherheit', hatAnl && 'anleitung'].filter(Boolean);
  if(!location.hash){ const start = d.art === 'sicherheit' ? 'sicherheit' : D.teile.length === 1 ? D.teile[0] : 'auswahl'; history.replaceState(null, '', '#' + start); }
  zeigen();
}
let D = null;
function zeigen(){
  const d = D, el = document.getElementById('inhalt'); if(!d) return;
  let v = location.hash.slice(1); if(!['auswahl', 'sicherheit', 'anleitung'].includes(v)) v = 'auswahl';
  document.title = `${d.titel}${d.nummer ? ' ' + d.nummer : ''}${v === 'sicherheit' ? ' · Sicherheit' : v === 'anleitung' ? ' · Anleitung' : ''}`;
  let h = `<div class="card titel">${d.foto ? `<img src="${esc(d.foto)}" alt="">` : ''}<div>
    ${v === 'sicherheit' ? `<span class="art sicherheit">${HELM}Arbeitssicherheit</span>` : v === 'anleitung' ? `<span class="art verwendung">${BUCH}Anleitung</span>` : ''}
    <h1>${esc(d.titel)}</h1>${d.nummer ? `<div class="nr">${esc(d.nummer)}</div>` : ''}</div></div>`;
  if(v === 'auswahl'){
    h += d.teile.length ? `<div class="wahl">${d.teile.includes('sicherheit') ? `<a class="kachel sicherheit" href="#sicherheit">${HELM}<b>Arbeitssicherheit</b><span>Schutzausrüstung, worauf achten, Datenblätter</span></a>` : ''}
      ${d.teile.includes('anleitung') ? `<a class="kachel" href="#anleitung">${BUCH}<b>Anleitung</b><span>So wird das Gerät benutzt</span></a>` : ''}</div>`
      : '<div class="card leer">Für dieses Gerät ist noch nichts erfasst. Fragen bitte ans Büro.</div>';
  } else if(v === 'sicherheit'){
    h += `<div class="card"><h2>Schutzausrüstung</h2>${d.psa.length ? `<div class="psa">${d.psa.map(k => `<span>${esc(PSA[k] || k)}</span>`).join('')}</div>` : '<div class="leer">Keine besondere Schutzausrüstung.</div>'}</div>`;
    if(!leerText(d.html)) h += `<div class="card"><h2>Worauf achten</h2><div class="txt">${sauber(d.html)}</div></div>`;
    if(d.dateien.length) h += `<div class="card"><h2>Sicherheitsdatenblätter</h2>${d.dateien.map(f => `<a class="doc" href="${esc(f.url || '#')}" target="_blank" rel="noopener">${DATEI}${esc(f.name)}</a>`).join('')}</div>`;
  } else {
    h += `<div class="card">${leerText(d.anleitung) ? '<div class="leer">Noch keine Anleitung erfasst.</div>' : `<div class="txt">${sauber(d.anleitung)}</div>`}</div>`;
  }
  if(v !== 'auswahl' && d.teile.length > 1) h += `<a class="zurueck" href="#auswahl">‹ Zur Auswahl</a>`;
  h += `<div class="fuss">Fragen oder Schaden? Knechtgarten · <a href="tel:+41334531020">033 453 10 20</a></div>`;
  el.innerHTML = h; scrollTo(0, 0);
}
addEventListener('hashchange', zeigen);
start();
</script>
</body>
</html>
