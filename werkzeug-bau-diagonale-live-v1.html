<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=39"></script>
<title>Rechter Winkel – Werkzeuge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#323E4E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kg-werkzeuge.js?v=9"></script>
<style>
.drei{position:relative;width:100%;max-width:340px;margin:0 auto;aspect-ratio:1/1;}
.drei svg{position:absolute;left:26%;top:8%;width:40%;height:70%;overflow:visible;}
.drei label{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700;color:#4C5C70;}
.drei input{width:92px;height:44px;border:1px solid #B9C0C8;border-radius:8px;text-align:center;font:inherit;font-size:17px;font-weight:400;color:#232B35;background:#fff;}
.drei input:focus{outline:none;border-color:#323E4E;}
.drei input.erg{background:#F5F7F9;border-color:var(--kf,#6E4C35);font-weight:700;color:#323E4E;}
.drei .t{left:0;top:34%;}
.drei .s{right:0;top:34%;}
.drei .r{left:46%;bottom:0;transform:translateX(-50%);}
</style>
</head>
<body>
<header class="app"><div class="wrap">
  <a class="backlink" href="index.html">Startseite</a>
  <div class="brand"><h1>Werkzeuge</h1></div>
  <span class="userbar hidden" id="userbar"><span id="userbarText"></span><button id="logoutBtn">Abmelden</button></span>
</div></header>
<main id="appMain"></main>
<script>
// Rechter Winkel (Pythagoras): t² = r² + s². Zwei Seiten eingeben, die dritte wird gerechnet.
// Gerechnet wird immer die Seite, die am längsten nicht angefasst wurde.
KGW.werkzeug('bau_diagonale', inhalt => {
  const $ = id => document.getElementById(id), f = KGW.fmt;
  inhalt.insertAdjacentHTML('beforeend', KGW.karte('Seiten in m', `<div class="drei">
    <svg viewBox="0 0 100 160" preserveAspectRatio="none" aria-hidden="true" fill="none" stroke="#4C5C70" stroke-width="2" vector-effect="non-scaling-stroke">
      <path d="M0 160 L100 0 L100 160 Z" vector-effect="non-scaling-stroke"/>
      <path d="M86 160 V146 H100" vector-effect="non-scaling-stroke"/></svg>
    ${['t', 's', 'r'].map(k => `<label class="${k}">${k}<input id="${k}" inputmode="decimal" autocomplete="off" aria-label="Seite ${k} in m"></label>`).join('')}
  </div>`));
  let reihe = []; // zuletzt eingegebene Seiten, neueste zuletzt
  const rechne = () => {
    const w = k => KGW.num($(k).value);
    ['t', 's', 'r'].forEach(k => $(k).classList.remove('erg'));
    if(reihe.length < 2) return;
    const [a, b] = reihe.slice(-2), ziel = ['t', 's', 'r'].find(k => k !== a && k !== b);
    let x;
    if(ziel === 't') x = Math.sqrt(w('r') ** 2 + w('s') ** 2);
    else { const andere = ziel === 's' ? 'r' : 's'; x = w('t') > w(andere) ? Math.sqrt(w('t') ** 2 - w(andere) ** 2) : NaN; }
    $(ziel).value = isFinite(x) && x > 0 ? f(x, 2).replace(/['’]/g, '') : '';
    $(ziel).classList.add('erg');
  };
  ['t', 's', 'r'].forEach(k => $(k).addEventListener('input', () => {
    reihe = reihe.filter(x => x !== k);
    if($(k).value.trim()) reihe.push(k);
    rechne();
  }));
});
</script>
</body>
</html>
