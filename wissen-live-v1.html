<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Wissen &amp; Geräte – Knechtgarten</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&display=swap">
<style>
:root{
  --bg:#F5F7F9; --card:#FFFFFF; --primary:#323E4E; --primary-l:#4C5C70;
  --ink:#232B35; --muted:#8B9097; --line:#E1E5E9; --soft:#EEF3F7;
  --accent-blue:#D6E7F4; --accent-lime:#D1DB5F; --accent-lime-light:#F4F6D8; --danger:#B4655F;
  --ok:#4E8A5B; --ok-soft:#E3F0E5; --danger-soft:#F6E6E4;
  --f-head:"Jost","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);line-height:1.45;font-size:13.5px;}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px;}
.hidden{display:none !important;}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;}
h1,h2,h3{font-family:var(--f-head);font-weight:600;color:var(--primary);}
.muted{color:var(--muted);} .small{font-size:12px;}
button{font:inherit;color:inherit;}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{font:inherit;font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 8px;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);}

header.app{background:var(--primary);color:#fff;}
header.app .wrap{display:flex;align-items:center;gap:20px;}
header.app .backlink{display:inline-flex;align-items:center;gap:5px;color:var(--primary);text-decoration:none;font-size:12px;font-weight:700;flex-shrink:0;background:var(--accent-lime);border-radius:20px;padding:6px 12px;}
header.app .backlink:hover{background:#c3cd52;}
header.app .brand{padding:11px 0;}
header.app .brand h1{font-size:16px;color:#fff;}
header.app .brand .sub{font-size:11px;opacity:.75;margin-top:1px;}
header.app .userbar{display:flex;align-items:center;gap:10px;margin-left:auto;}
header.app .userbar span{opacity:.85;font-size:11.5px;}
header.app .userbar button{font-size:11.5px;color:#c7ccd1;background:none;border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:3px 9px;cursor:pointer;}
nav.subnav{background:#fff;border-bottom:1px solid var(--line);}
nav.subnav .wrap{display:flex;gap:2px;align-items:center;overflow-x:auto;}
nav.subnav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;padding:12px 12px 10px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap;}
nav.subnav button:hover{color:var(--primary);}
nav.subnav button.on{color:var(--primary);border-bottom-color:var(--accent-lime);}
nav.subnav .neu{margin-left:auto;}
main.wrap{padding-top:22px;padding-bottom:70px;}

.card{background:var(--card);border:1px solid var(--line);border-radius:11px;}
.btn{border:none;border-radius:7px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn .i{width:16px;height:16px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-l);}
.btn-ghost{background:#fff;color:var(--primary);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--primary);}
.btn-danger{background:var(--danger);color:#fff;}
.btn[disabled]{opacity:.45;cursor:default;}
.btn-sm{padding:4px 10px;font-size:12.5px;}
.addrow{all:unset;cursor:pointer;color:var(--primary);font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center;padding:4px 0;}
.addrow .i{width:16px;height:16px;}
.addrow:hover{text-decoration:underline;}
.addlinks{display:flex;gap:18px;flex-wrap:wrap;align-items:center;}
.xbtn{all:unset;cursor:pointer;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none;box-sizing:border-box;background:#fff;}
.xbtn .i{width:13px;height:13px;}
.xbtn:hover{color:var(--danger);border-color:var(--danger);}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:20px;padding:2px 9px;font-size:12px;background:#fff;white-space:nowrap;}
.chip .i{width:13px;height:13px;}
.chip.typ{background:var(--accent-blue);border-color:transparent;color:var(--primary);font-weight:600;}
.chip.tag{color:var(--muted);}
.chip.planer{border-color:var(--accent-lime);background:var(--accent-lime-light);color:var(--primary);}
.grp-title{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.hint{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:6px;padding:9px 11px;}
.lockline{font-size:12px;color:var(--muted);display:inline-flex;gap:5px;align-items:center;text-transform:none;letter-spacing:0;font-weight:400;}
.lockline .i{width:14px;height:14px;}

/* Suche */
.hero-search{display:flex;flex-direction:column;gap:12px;margin-bottom:18px;}
.searchbox{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--muted);border-radius:10px;padding:0 14px;max-width:720px;}
.searchbox:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--accent-blue);}
.searchbox input{all:unset;flex:1;padding:12px 0;font-size:16px;min-width:0;}
.searchbox .i{color:var(--muted);width:20px;height:20px;}
.filterrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.filterrow .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);width:78px;flex:none;}
.fchip{all:unset;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 11px;font-size:12.5px;}
.fchip:hover{border-color:var(--primary-l);}
.fchip.on{background:var(--primary);border-color:var(--primary);color:#fff;}
.reshead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;}
.viewtg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;}
.viewtg button{all:unset;cursor:pointer;width:36px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--muted);}
.viewtg button + button{border-left:1px solid var(--line);}
.viewtg button.on{background:var(--primary);color:#fff;}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;}
.gcard{all:unset;cursor:pointer;box-sizing:border-box;display:flex;flex-direction:column;gap:7px;min-width:0;}
.ph{background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden;}
.ph img{width:100%;height:100%;object-fit:cover;display:block;}
.gcard .ph{aspect-ratio:4/3;border-radius:10px;border:1px solid var(--line);}
.gcard .ph .i{width:52px;height:52px;stroke-width:1;}
.gcard:hover .ph{border-color:var(--primary-l);}
.gcard .t{font-family:var(--f-head);font-weight:600;font-size:15px;color:var(--primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px;}
.lst{overflow:hidden;}
.lrow{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);}
.lrow:last-child{border-bottom:0;}
.lrow:hover{background:var(--soft);}
.lrow .ph{width:56px;height:42px;border-radius:6px;}
.lrow .ph .i{width:24px;height:24px;stroke-width:1.2;}
.lrow .tx{display:flex;flex-direction:column;min-width:0;}
.lrow .tx b{font-weight:600;color:var(--primary);}
.lrow .tx .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lrow .mt{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;}
.empty{padding:30px;text-align:center;color:var(--muted);}

/* Eintrag */
.back{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center;color:var(--muted);font-size:13px;margin-bottom:12px;}
.back:hover{color:var(--primary);}
.ehead{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;padding:18px;margin-bottom:12px;}
.ehead .ph{aspect-ratio:4/3;border-radius:8px;position:relative;}
.ehead .ph .i{width:60px;height:60px;stroke-width:1;}
.ehead .ph .fotobtn{position:absolute;right:6px;bottom:6px;}
.ehead h2{font-size:24px;line-height:1.2;}
.ehead .subt{color:var(--muted);margin-top:2px;}
.ehead .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;}
.ehead .facts{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted);}
.ehead .facts b{color:var(--ink);font-weight:600;}
.ehead .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.eform{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 14px;}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0;}
.fld.voll{grid-column:1/-1;}
.fld input,.fld select{width:100%;}
.berchips{display:flex;gap:5px;flex-wrap:wrap;}
.sec{margin-bottom:10px;overflow:hidden;}
.sec-h{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;padding:13px 18px;}
.sec-h:hover{background:var(--soft);}
.sec-h h3{font-size:16px;flex:1;}
.sec-h .cnt{font-size:12px;color:var(--muted);}
.sec-h .chev{transition:transform .15s;}
.sec.open .sec-h .chev{transform:rotate(180deg);}
.sec-b{padding:4px 18px 18px;display:none;flex-direction:column;gap:12px;}
.sec.open .sec-b{display:flex;}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;}
.kv div{padding:9px 12px;box-shadow:1px 1px 0 var(--line);}
.kv dt{font-size:11.5px;color:var(--muted);}
.kv dd{margin:2px 0 0;font-weight:600;font-variant-numeric:tabular-nums;white-space:pre-wrap;}
.kvedit{display:flex;flex-direction:column;gap:6px;}
.kvedit .r{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr) 24px;gap:8px;align-items:center;}
.anbau{display:flex;gap:6px;flex-wrap:wrap;}
.anbau button{all:unset;cursor:pointer;}

/* Textfeld wie Notizfeld Tool A */
.rte{border:1px solid var(--line);border-radius:8px;background:#fff;}
.rte-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px 0 14px;min-height:24px;}
.rte-h .nh{font-size:12px;color:var(--muted);margin-right:auto;}
.rte-tb{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;align-items:center;}
.tbtn{all:unset;cursor:pointer;box-sizing:border-box;width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink);}
.tbtn:hover{border-color:var(--primary);color:var(--primary);}
.tbtn .i{width:15px;height:15px;stroke-width:1.8;}
.tsep{width:1px;height:18px;background:var(--line);margin:0 3px;}
.rte-ed{padding:6px 14px 14px;min-height:60px;outline:none;overflow-x:auto;}
.rte-ed[contenteditable="true"]:focus{box-shadow:inset 0 0 0 2px var(--accent-blue);border-radius:0 0 8px 8px;}
.rte-ed:empty:before{content:attr(data-placeholder);color:var(--muted);}
.rte-ed ol,.rte-ed ul{margin:6px 0;padding-left:24px;max-width:80ch;}
.rte-ed li{margin:3px 0;}
.rte-ed p,.rte-ed div{max-width:80ch;}
.rte-ed p{margin:5px 0;}
.rte-ed mark{background:var(--accent-lime-light);color:inherit;padding:1px 3px;border-radius:3px;}
.rte-ed table{border-collapse:collapse;margin:8px 0;font-size:13px;}
.rte-ed td,.rte-ed th{border:1px solid var(--line);padding:5px 10px;min-width:72px;text-align:left;vertical-align:top;}
.rte-ed th{background:var(--soft);font-weight:600;}
.rte-ed img{max-width:min(100%,420px);border-radius:6px;display:inline-block;margin:6px 8px 6px 0;vertical-align:top;cursor:zoom-in;}
.rte-ed video{max-width:min(100%,420px);border-radius:6px;display:block;margin:6px 0;background:#000;}
.rte-ed img:not([src]),.rte-ed video:not([src]){min-width:160px;min-height:100px;background:var(--soft);}
.notes{display:flex;flex-direction:column;gap:10px;}
.saving{font-size:11.5px;color:var(--muted);}

/* Listen (Dokumente, Kontakte, Erledigt) */
.docs{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;}
.doc{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);}
.doc:last-child{border-bottom:0;}
.doc .n{font-weight:600;}
.doc a.n{color:var(--primary);text-decoration:none;}
.doc a.n:hover{text-decoration:underline;}
.doc > .i{color:var(--muted);}
.doc .grow{flex:1;min-width:0;}

/* Service */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:#fff;}
table.t{border-collapse:collapse;width:100%;font-size:13px;}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fff;}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums;}
table.t tr:last-child td{border-bottom:0;}
.nw{white-space:nowrap;}
.wkbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;white-space:nowrap;}
.wkbtn:hover,.wkbtn.on{border-color:var(--primary);}
.wkbtn .i{width:15px;height:15px;}
.stat{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;}
.stat.ok{background:var(--ok-soft);color:var(--ok);}
.stat.no{background:var(--danger-soft);color:var(--danger);}
.stat.open{background:var(--soft);color:var(--primary);}
.stat .i{width:13px;height:13px;}
.kwpanel{background:var(--soft);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;}
.kwgrid{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px;}
.kwm{display:flex;flex-direction:column;gap:3px;}
.kwm span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;height:13px;}
.kwm .row{display:flex;gap:3px;}
.kwc{all:unset;cursor:pointer;width:22px;height:26px;border:1px solid var(--line);background:#fff;border-radius:4px;font-size:10.5px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;box-sizing:border-box;}
.kwc.std{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:inset 0 -3px 0 var(--accent-lime);}
.kwc.plus{background:var(--primary);color:#fff;border-color:var(--primary);}
.kwc.minus{border:1.5px dashed var(--ink);}
.kwc.now{outline:2px solid var(--accent-lime);outline-offset:-1px;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.legend i{width:14px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line);}
.ask{background:var(--soft);border-left:3px solid var(--accent-lime);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;}
.ask .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink);cursor:pointer;}
.segm{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;}
.segm button{all:unset;cursor:pointer;padding:4px 10px;font-size:12.5px;}
.segm button.on{background:var(--primary);color:#fff;}

/* Tabelle */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.ttbl tbody tr{cursor:pointer;}
.ttbl tbody tr:hover td{background:var(--soft);}
.ttbl th.sort{cursor:pointer;}
.ttbl th.sort:hover{color:var(--primary);}
.chk-ok{color:var(--ok);}

/* Etiketten */
.lbl-layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:start;}
.pick{padding:14px 16px;display:flex;flex-direction:column;gap:12px;}
.picklist{display:flex;flex-direction:column;max-height:420px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;}
.picklist label{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;}
.picklist label:last-child{border-bottom:0;}
.picklist label span.n{flex:1;min-width:0;}
.sheetwrap{overflow:auto;}
.sheetscale{width:calc(210mm * .72);height:calc(297mm * .72);margin:0 auto;}
.sheet{width:210mm;height:297mm;background:#fff;border:1px solid #C9CED4;box-shadow:0 4px 18px rgba(35,43,53,.12);position:relative;transform:scale(.72);transform-origin:top left;}
.cell{all:unset;cursor:pointer;box-sizing:border-box;position:absolute;border:1px dashed #C9CED4;border-radius:2mm;overflow:hidden;}
.cell.used{background:repeating-linear-gradient(45deg,#EEF0F2 0 6px,#FFFFFF 6px 12px);}
.cell.used::after{content:"benutzt";position:absolute;inset:auto 0 3mm 0;text-align:center;font-size:9pt;color:#8B9097;}
.lab{position:absolute;inset:0;padding:3.5mm;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3mm;border:.3mm solid #323E4E;border-radius:2mm;background:#fff;color:#323E4E;}
.lab .l{display:flex;flex-direction:column;gap:1.2mm;min-width:0;}
.lab img.logo{height:10mm;width:auto;align-self:flex-start;margin-bottom:1mm;}
.lab .nm{font-family:var(--f-head);font-weight:600;font-size:12pt;line-height:1.15;}
.lab .nr{font-size:22pt;font-weight:700;line-height:1;white-space:nowrap;}
.lab .nr.long{font-size:15pt;}
.lab .foto{width:24mm;height:17mm;border-radius:1mm;overflow:hidden;background:#EEF3F7;}
.lab .foto img{width:100%;height:100%;object-fit:cover;}
.lab .adr{font-size:6.5pt;color:#4F5358;margin-top:auto;line-height:1.3;}
.lab .r{display:flex;flex-direction:column;align-items:center;gap:1mm;}
.lab .url{font-size:6pt;color:#4F5358;}
.lab.s{padding:2.5mm;} .lab.s img.logo{height:7mm;} .lab.s .nm{font-size:9.5pt;} .lab.s .nr{font-size:15pt;} .lab.s .nr.long{font-size:10pt;}
.sheetinfo{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:12.5px;}

/* QR-Ansicht (Handy) */
body.qr main.wrap{max-width:640px;padding-top:12px;}
body.qr nav.subnav{display:none;}
.qtop .ph{height:190px;border-radius:10px;}
.qtop .ph .i{width:60px;height:60px;stroke-width:1;}
.qtop h2{font-size:22px;margin-top:10px;}

/* Overlays, Toast, Login */
.ovl{position:fixed;inset:0;background:rgba(35,43,53,.45);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:60px 16px 16px;}
.ovl.show{display:flex;}
.ovlbox{background:#fff;border-radius:12px;max-width:520px;width:100%;padding:20px 22px;box-shadow:0 12px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 80px);overflow-y:auto;}
.ovlbox h3{font-size:16px;}
.ovlbtns{display:flex;justify-content:flex-end;gap:8px;}
.pickrows{display:flex;flex-direction:column;max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;}
.pickrows button{all:unset;cursor:pointer;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px;}
.pickrows button:hover,.pickrows button.on{background:var(--soft);}
.pickrows button:last-child{border-bottom:0;}
.lightbox{position:fixed;inset:0;background:rgba(20,24,30,.88);display:none;align-items:center;justify-content:center;z-index:80;padding:20px;cursor:zoom-out;}
.lightbox.show{display:flex;}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px;}
.toastwrap{position:fixed;bottom:16px;right:16px;z-index:90;display:flex;flex-direction:column;gap:6px;}
.toast{background:var(--primary);color:#fff;font-size:12.5px;padding:9px 14px;border-radius:7px;box-shadow:0 6px 20px rgba(0,0,0,.2);}
.toast.err{background:var(--danger);}
.loginwrap{min-height:70vh;display:flex;align-items:center;justify-content:center;}
.logincard,.pendingcard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:28px 26px;width:100%;max-width:340px;}
.logincard h2,.pendingcard h2{font-size:17px;margin-bottom:14px;}
.logincard .fld{margin-bottom:10px;}
.logincard input{width:100%;}
.pendingcard p{font-size:12.5px;color:var(--muted);margin-bottom:16px;}
.status{font-size:11.5px;color:var(--muted);margin-top:6px;}
.status.err{color:var(--danger);}

@media (max-width:900px){
  .lbl-layout{grid-template-columns:minmax(0,1fr);}
  .ehead{grid-template-columns:minmax(0,1fr);}
  .ehead .ph{max-width:260px;}
}
@media (max-width:620px){
  .lrow .mt{display:none;} .lrow{grid-template-columns:48px minmax(0,1fr);}
  .gal{grid-template-columns:repeat(2,minmax(0,1fr));}
  .filterrow .lbl{width:100%;}
  .sec-h,.sec-b{padding-left:12px;padding-right:12px;}

  header.app .brand h1{font-size:15px;white-space:nowrap;}
  .ehead{padding:14px;gap:12px;}
  .ehead .ph{max-width:none;aspect-ratio:16/9;}
  .kvedit .r{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 24px;}
}
@media print{
  @page{size:A4;margin:0;}
  body{background:#fff;}
  body > *:not(#druck){display:none !important;}
  #druck{display:block !important;}
  #druck .sheet{transform:none;border:0;box-shadow:none;}
  #druck .cell{border:0;}
  #druck .cell.used::after{content:none;}
  #druck .cell.used{background:none;}
}
#druck{display:none;}

const ic = (n, cls='') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, err){
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  $('toastwrap').appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 1800);
}
function fehler(e, wo){ console.error(wo, e); toast((wo ? wo + ': ' : '') + (e?.message || e || 'Fehler'), true); }

// ISO-Kalenderwoche
function isoWoche(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const tag = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - tag);
  const j1 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return { jahr: t.getUTCFullYear(), kw: Math.ceil(((t - j1) / 86400000 + 1) / 7) };
}
const HEUTE = new Date();
const { jahr: NOW_Y, kw: NOW_KW } = isoWoche(HEUTE);
const heuteISO = () => new Date(HEUTE.getTime() - HEUTE.getTimezoneOffset()*60000).toISOString().slice(0,10);
const datumCH = iso => iso ? iso.slice(8,10).replace(/^0/,'') + '.' + iso.slice(5,7).replace(/^0/,'') + '.' + iso.slice(0,4) : '';

// ---------------------------------------------------------------------------
function lies(k, d){ try{ const v = localStorage.getItem('wissen_' + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }
function merke(k, v){ try{ localStorage.setItem('wissen_' + k, JSON.stringify(v)); }catch(e){} }

const S = {
  rolle: null, userId: null, buero: false,
  kats: [], bereiche: [], eintraege: [], service: [], abw: [], erledigt: [], lieferanten: [], benutzer: {}, planer: [],
  view: 'suche', eid: null, det: null, qr: false,
  q: '', ber: lies('ber', null), kat: lies('kat', null), typ: lies('typ', null), mode: lies('mode', 'foto'),
  open: new Set(), edit: null, kwEdit: null, kwScope: 'eintrag', ask: null, neuService: null,
  tblTab: lies('tbl', 'Raupenbagger'), sort: null, sortDir: 1,
  sel: new Set(), used: new Set(), fmt: lies('fmt', '8'), foto: false, pickQ: '',
};
const urls = new Map();   // storage_pfad -> signierter Link
const istBuero = () => S.buero;
const byId = id => S.eintraege.find(e => e.id === id);
const katName = id => S.kats.find(k => k.id === id)?.name || '';
const berName = id => S.bereiche.find(b => b.id === id)?.name || '';

// ---------------------------------------------------------------------------
// Login
// ---------------------------------------------------------------------------
function zeige(id){ ['loginwrap','pendingWrap','appMain'].forEach(x => $(x).classList.toggle('hidden', x !== id)); $('subnav').classList.toggle('hidden', id !== 'appMain' || S.qr); }
async function pruefeAnmeldung(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ zeige('loginwrap'); $('userbar').classList.add('hidden'); return; }
  const { data: b } = await sb.from('benutzer').select('rolle,email,anzeigename').eq('id', session.user.id).maybeSingle();
  if(!b || !b.rolle){ zeige('pendingWrap'); return; }
  S.rolle = b.rolle; S.userId = session.user.id; S.buero = b.rolle === 'admin' || b.rolle === 'buero_team';
  $('userbar').classList.remove('hidden');
  $('userbarText').textContent = `${b.anzeigename || b.email} (${ROLLE_LABEL[b.rolle] || b.rolle})`;
  zeige('appMain');
  await ladeAlles();
  starteAusUrl();
}
$('loginBtn').addEventListener('click', async () => {
  const st = $('loginStatus'); st.textContent = 'Melde an …'; st.className = 'status';
  const { error } = await sb.auth.signInWithPassword({ email: $('loginEmail').value.trim(), password: $('loginPassword').value });
  if(error){ st.textContent = 'Login fehlgeschlagen: ' + error.message; st.className = 'status err'; return; }
  await pruefeAnmeldung();
});
$('loginPassword').addEventListener('keydown', e => { if(e.key === 'Enter') $('loginBtn').click(); });
$('logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });
$('pendingLogoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

// ---------------------------------------------------------------------------
// Daten laden
// ---------------------------------------------------------------------------
async function ladeAlles(){
  const r = await Promise.all([
    sb.from('wissen_kategorie').select('*').order('sortierung'),
    sb.from('wissen_bereich').select('*').order('sortierung'),
    sb.from('wissen_eintrag').select('*').is('archiviert_am', null).order('titel'),
    sb.from('wissen_service').select('*').order('sortierung'),
    sb.from('wissen_service_abw').select('*'),
    sb.from('wissen_service_erledigt').select('*').gte('jahr', NOW_Y - 3),
    sb.from('lieferant').select('id,name,firma').is('archiviert_am', null).order('name'),
    sb.from('planer_ressource').select('id,typ,nummer,name,aktiv'),
  ]);
  const err = r.find(x => x.error); if(err) return fehler(err.error, 'Laden');
  [S.kats, S.bereiche, S.eintraege, S.service, S.abw, S.erledigt, S.lieferanten, S.planer] = r.map(x => x.data || []);
  S.eintraege.sort((a,b) => a.titel.localeCompare(b.titel, 'de', {numeric:true}));
  await signiere(S.eintraege.map(e => e.titelfoto_pfad && vorschau(e.titelfoto_pfad)).filter(Boolean));
}
const vorschau = p => p.replace(/\.jpg$/, '_t.jpg');
async function signiere(pfade){
  const neu = [...new Set(pfade)].filter(p => p && !urls.has(p));
  for(let i = 0; i < neu.length; i += 100){
    const { data } = await sb.storage.from(BUCKET).createSignedUrls(neu.slice(i, i+100), 3600 * 6);
    (data || []).forEach(d => { if(d.signedUrl) urls.set(d.path, d.signedUrl); });
  }
}
async function ladeDetail(id){
  const r = await Promise.all([
    sb.from('wissen_notiz').select('*').eq('eintrag_id', id).order('erstellt_am', { ascending: false }),
    sb.from('wissen_kontakt').select('*').eq('eintrag_id', id).order('sortierung'),
    sb.from('wissen_datei').select('*').or(`eintrag_id.eq.${id},auch_bei.cs.{${id}}`).order('erstellt_am'),
  ]);
  const err = r.find(x => x.error); if(err) return fehler(err.error, 'Laden');
  const [notizen, kontakte, dateien] = r.map(x => x.data || []);
  const kundenIds = kontakte.filter(k => k.kunde_id).map(k => k.kunde_id);
  let kunden = [];
  if(kundenIds.length){ const { data } = await sb.from('kunde').select('id,name,firma,vorname,nachname,ort').in('id', kundenIds); kunden = data || []; }
  const autoren = [...new Set(notizen.map(n => n.erstellt_von).filter(Boolean))].filter(u => !S.benutzer[u]);
  if(autoren.length){ const { data } = await sb.rpc('pflege_zustaendige'); (data || []).forEach(b => { S.benutzer[b.id] = b.anzeigename || b.email; }); }
  S.det = { id, notizen, kontakte, dateien, kunden };
  await signiere(dateien.flatMap(d => [d.storage_pfad, d.vorschau_pfad]).filter(Boolean));
}
const kundeName = k => k ? (k.firma || [k.vorname, k.nachname].filter(Boolean).join(' ') || k.name || 'Kunde') + (k.ort ? ', ' + k.ort : '') : 'Kunde';

// ---------------------------------------------------------------------------
// Service-Logik (Standard pro Geraeteart wie Pflegekategorien, Abweichung pro Geraet)
// ---------------------------------------------------------------------------
const servicesVon = e => S.service.filter(s => (s.geraeteart && e.geraeteart && s.geraeteart === e.geraeteart) || s.eintrag_id === e.id);
const abwVon = (e, s) => S.abw.find(a => a.eintrag_id === e.id && a.service_id === s.id);
function wochen(e, s){
  if(s.eintrag_id) return [...s.kws].sort((a,b) => a-b);
  const a = abwVon(e, s) || { kws_plus: [], kws_minus: [] };
  return [...new Set([...s.kws.filter(w => !a.kws_minus.includes(w)), ...a.kws_plus])].sort((x,y) => x-y);
}
const erledigtIn = (e, s, kw, jahr = NOW_Y) => S.erledigt.find(x => x.eintrag_id === e.id && x.service_id === s.id && x.jahr === jahr && x.kw === kw);
function naechster(e){
  let best = null;
  for(const s of servicesVon(e)) for(const w of wochen(e, s)){
    if(erledigtIn(e, s, w)) continue;
    const d = w < NOW_KW - 8 ? w + 53 : w;
    if(!best || d < best.d) best = { d, w, s };
  }
  return best;
}

// ---------------------------------------------------------------------------
// Navigation / URL
// ---------------------------------------------------------------------------
function starteAusUrl(){
  const p = new URLSearchParams(location.search);
  if(p.get('qr')){
    const e = S.eintraege.find(x => String(x.qr_nr) === p.get('qr'));
    if(e){ S.qr = true; document.body.classList.add('qr'); zeige('appMain'); return oeffne(e.id, 'anw'); }
    toast('Diesen Eintrag gibt es nicht (mehr).', true);
  }
  const h = location.hash.match(/^#e-([0-9a-f-]{36})$/);
  if(h && byId(h[1])) return oeffne(h[1]);
  if(location.hash === '#tabelle') S.view = 'tabelle';
  if(location.hash === '#etiketten') S.view = 'etiketten';
  render();
}
window.addEventListener('popstate', () => {
  if(S.qr) return;
  const h = location.hash.match(/^#e-([0-9a-f-]{36})$/);
  if(h && byId(h[1])){ if(S.eid !== h[1]) oeffne(h[1], null, true); return; }
  S.view = location.hash === '#tabelle' ? 'tabelle' : location.hash === '#etiketten' ? 'etiketten' : 'suche';
  S.eid = null; render();
});
function geheZu(view){
  S.view = view; S.eid = null; S.edit = null;
  history.pushState(null, '', location.pathname + (view === 'suche' ? '' : '#' + view));
  render(); window.scrollTo(0, 0);
}
async function oeffne(id, sec, ohneHistory){
  S.view = 'eintrag'; S.eid = id; S.edit = null; S.kwEdit = null; S.ask = null; S.neuService = null; S.det = null;
  const e = byId(id);
  if(!ohneHistory && !S.qr) history.pushState(null, '', location.pathname + '#e-' + id);
  S.open = new Set([sec || (e.steckbrief?.length || !e.anwendung_html ? 'steck' : 'anw')]);
  render(); window.scrollTo(0, 0);
  await ladeDetail(id);
  if(S.eid !== id) return;
  // gewuenschter Abschnitt leer (z.B. noch keine Anleitung) -> ersten vorhandenen oeffnen
  if(![...S.open].some(k => hatSec(e, k))){ const erster = SECS.find(([k]) => hatSec(e, k)); if(erster) S.open = new Set([erster[0]]); }
  render();
}

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------
function render(){
  if(!S.qr){
    const nav = [['suche','search','Suche'],['tabelle','table','Fahrzeuge & Maschinen'],['etiketten','label','Etiketten']];
    $('subnavInner').innerHTML = nav.map(([k,i,n]) =>
      `<button data-act="nav" data-v="${k}" class="${S.view===k||(k==='suche'&&S.view==='eintrag')?'on':''}">${ic(i)}${n}</button>`).join('')
      + (istBuero() ? `<button class="neu" data-act="neu">${ic('plus')}Neuer Eintrag</button>` : '');
  }
  const m = $('appMain');
  m.innerHTML = S.view === 'eintrag' ? vEintrag() : S.view === 'tabelle' ? vTabelle() : S.view === 'etiketten' ? vEtiketten() : vSuche();
  medienLaden(m);
}
function icoFuer(e){
  const ga = (e.geraeteart || '').toLowerCase(), kat = katName(e.kategorie_id);
  if(/bagger|dumper|lader|stapler/.test(ga)) return 'excav';
  if(/lieferwagen|bus/.test(ga)) return 'truck';
  if(/personenwagen|auto/.test(ga)) return 'car';
  if(/anhänger/.test(ga)) return 'trailer';
  if(e.typ === 'wissen') return 'book';
  if(/Kleber/.test(kat)) return 'tube';
  if(/Pflanzen|Dünger/.test(kat)) return 'leaf';
  if(/Bewässerung|Pool/.test(kat)) return 'drop';
  if(/Chemikalien/.test(kat)) return 'flask';
  if(/Metall/.test(kat)) return 'bolt';
  if(/Software/.test(kat)) return 'monitor';
  return 'tool';
}
function bildHTML(e, gross){
  const p = e.titelfoto_pfad && (gross ? e.titelfoto_pfad : vorschau(e.titelfoto_pfad));
  return p ? `<img data-pfad="${esc(p)}" alt="">` : ic(icoFuer(e));
}

}

function hatSec(e, k){
  const d = S.det && S.det.id === e.id ? S.det : null;
  if(istBuero() && !S.qr) return true;   // Buero sieht alle Abschnitte (auch leere, zum Befuellen)
  return ({
    steck: !!(e.steckbrief?.length || e.gehoert_zu_id || S.eintraege.some(x => x.gehoert_zu_id === e.id)),
    anw: !!(e.anwendung_html || '').replace(/<[^>]+>/g, '').trim() || /<(img|video|table)/.test(e.anwendung_html || ''),
    service: servicesVon(e).length > 0,
    kontakte: !!d?.kontakte.length,
    docs: !!d?.dateien.filter(x => x.bereich === 'dokument' && x.storage_pfad !== e.titelfoto_pfad).length,
    notizen: true,
  })[k];
}
function zaehl(e, k){
  const d = S.det && S.det.id === e.id ? S.det : null;
  if(k === 'service'){ const n = servicesVon(e).length; return n ? n + (n === 1 ? ' Arbeit' : ' Arbeiten') : ''; }
  if(!d) return '';

  if(k === 'docs') return d.dateien.filter(x => x.bereich === 'dokument' && x.storage_pfad !== e.titelfoto_pfad).length || '';
  if(k === 'notizen') return d.notizen.length || '';
  return '';
}

// Medien in Textfeldern: gespeichert nur mit data-pfad, Link wird beim Anzeigen frisch signiert
async function medienLaden(root){
  const els = [...root.querySelectorAll('[data-pfad]')];
  if(!els.length) return;
  await signiere(els.map(x => x.dataset.pfad));
  els.forEach(x => { const u = urls.get(x.dataset.pfad); if(u && x.getAttribute('src') !== u) x.src = u; });
}
function saubererHTML(ed){
  const c = ed.cloneNode(true);
  c.querySelectorAll('[data-pfad]').forEach(x => x.removeAttribute('src'));
  return c.innerHTML.trim();
}
const speicherTimer = {};
function rteGeaendert(ed){
  const key = ed.dataset.rte;
  const hinweis = document.querySelector(`[data-saving="${key}"]`);
  if(hinweis) hinweis.textContent = 'ungespeichert …';
  clearTimeout(speicherTimer[key]);
  speicherTimer[key] = setTimeout(() => rteSpeichern(ed), 900);
}
async function rteSpeichern(ed){
  const [kind, id] = ed.dataset.rte.split(':');
  const html = saubererHTML(ed);
  const hinweis = document.querySelector(`[data-saving="${ed.dataset.rte}"]`);
  let r;
  if(kind === 'anw'){ r = await sb.from('wissen_eintrag').update({ anwendung_html: html }).eq('id', id); if(!r.error) byId(id).anwendung_html = html; }

  if(r.error) return fehler(r.error, 'Speichern');

let rteZiel = null;   // Textfeld + Cursor fuer Foto/Video-Upload
function rteBefehl(btn){
  const ed = btn.closest('.rte').querySelector('.rte-ed'), sel = getSelection();
  if(!sel.rangeCount || !ed.contains(sel.anchorNode)){
    ed.focus(); const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false); sel.removeAllRanges(); sel.addRange(r);
  }
  const c = btn.dataset.cmd;
  if(c === 'bold') document.execCommand('bold');
  else if(c === 'ul') document.execCommand('insertUnorderedList');
  else if(c === 'ol') document.execCommand('insertOrderedList');
  else if(c === 'table') document.execCommand('insertHTML', false,
    '<table><tr><th>Spalte 1</th><th>Spalte 2</th><th>Spalte 3</th></tr><tr><td><br></td><td><br></td><td><br></td></tr><tr><td><br></td><td><br></td><td><br></td></tr></table><p><br></p>');
  else if(c === 'mark' && !sel.isCollapsed){
    const r = sel.getRangeAt(0), m = document.createElement('mark');
    try{ r.surroundContents(m); }catch(err){ m.appendChild(r.extractContents()); r.insertNode(m); }
  }
  else if(c === 'foto' || c === 'video'){
    rteZiel = { ed, range: sel.getRangeAt(0).cloneRange(), art: c };
    return waehleDateien(c === 'foto' ? 'image/*' : 'video/*', false, dateien => rteMedium(dateien[0]));
  }
  rteGeaendert(ed);
}
async function rteMedium(datei){
  const { ed, range, art } = rteZiel || {}; if(!ed || !datei) return;
  const [kind, id] = ed.dataset.rte.split(':');
  const e = byId(kind === 'anw' ? id : S.eid);
  toast(art === 'video' ? 'Video wird hochgeladen …' : 'Foto wird hochgeladen …');
  const d = await hochladen(datei, e.id, kind === 'anw' ? 'anwendung' : 'notiz', kind === 'notiz' ? id : null);
  if(!d) return;
  await signiere([d.storage_pfad]);
  const el = document.createElement(art === 'video' ? 'video' : 'img');
  el.dataset.pfad = d.storage_pfad; el.src = urls.get(d.storage_pfad) || '';
  if(art === 'video'){ el.controls = true; el.setAttribute('playsinline', ''); el.setAttribute('preload', 'metadata'); }
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
  range.insertNode(el); range.setStartAfter(el); range.collapse(true);
  rteSpeichern(ed);
}

    for(let r = 0; r < n; r++) for(let c = 0; c < n; c++) if(q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
    return `<svg width="${mm}mm" height="${mm}mm" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><path d="${d}" fill="#232B35"/></svg>`;

function waehleDateien(accept, mehrere, fertig){
  const inp = $('fileInput'); inp.value = ''; inp.accept = accept; inp.multiple = mehrere;
  inp.onchange = () => { const f = [...inp.files]; if(f.length) fertig(f); };
  inp.click();
}
async function verkleinere(datei, max, qualitaet){
  const bild = await createImageBitmap(datei);
  const f = Math.min(1, max / Math.max(bild.width, bild.height));
  const c = document.createElement('canvas'); c.width = Math.round(bild.width * f); c.height = Math.round(bild.height * f);
  c.getContext('2d').drawImage(bild, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('Bild konnte nicht umgewandelt werden')), 'image/jpeg', qualitaet));
}
async function hochladen(datei, eintragId, bereich, notizId, extra = {}){
  const id = crypto.randomUUID();
  const istBild = /^image\//.test(datei.type) && !/svg/.test(datei.type);
  const istVideo = /^video\//.test(datei.type);
  const art = istBild ? 'foto' : istVideo ? 'video' : datei.type === 'application/pdf' ? 'pdf' : 'datei';
  if(art === 'datei'){ toast('Nur PDF, Fotos und Videos sind möglich.', true); return null; }
  if(istVideo && datei.size > 50 * 1024 * 1024){ toast('Video ist zu gross (max. 50 MB). Tipp: Handykamera auf 720p stellen oder Video kürzen.', true); return null; }
  try{
    let pfad, vpfad = null, groesse = datei.size;
    if(istBild){
      const gross = await verkleinere(datei, 1920, .85), klein = await verkleinere(datei, 480, .8);
      pfad = `${eintragId}/${id}.jpg`; vpfad = `${eintragId}/${id}_t.jpg`; groesse = gross.size;
      const [a, b] = await Promise.all([
        sb.storage.from(BUCKET).upload(pfad, gross, { contentType: 'image/jpeg' }),
        sb.storage.from(BUCKET).upload(vpfad, klein, { contentType: 'image/jpeg' })]);
      if(a.error || b.error) throw (a.error || b.error);
    } else {
      const ext = (datei.name.split('.').pop() || (istVideo ? 'mp4' : 'pdf')).toLowerCase().replace(/[^a-z0-9]/g, '');
      pfad = `${eintragId}/${id}.${ext}`;
      const { error } = await sb.storage.from(BUCKET).upload(pfad, datei, { contentType: datei.type });
      if(error) throw error;
    }

<script>
/* kgPasswortManagerSchutz: Passwort-Manager sollen ausserhalb der Anmeldung nichts in Eingabefelder schreiben. */
(function(){
  var AUSNAHMEN = ['username', 'current-password', 'new-password', 'one-time-code'];
  function schuetze(el){
    if(!el || el.nodeType !== 1 || el.dataset.kgPw) return;
    var tag = el.tagName;
    if(tag !== 'INPUT' && tag !== 'TEXTAREA') return;
    var typ = (el.getAttribute('type') || 'text').toLowerCase();
    if(typ === 'password' || typ === 'hidden' || typ === 'checkbox' || typ === 'radio' || typ === 'file' || typ === 'button' || typ === 'submit') return;
    if(AUSNAHMEN.indexOf((el.getAttribute('autocomplete') || '').toLowerCase()) !== -1) return;
    if(el.closest && el.closest('.logincard')) return;
    el.dataset.kgPw = '1';
    el.setAttribute('autocomplete', 'off');
    el.setAttribute('data-lpignore', 'true');
    el.setAttribute('data-1p-ignore', 'true');
    el.setAttribute('data-dashlane-ignore', 'true');
    el.setAttribute('data-form-type', 'other');
  }
  function alle(root){
    if(root.nodeType !== 1) return;
    schuetze(root);
    var liste = root.querySelectorAll ? root.querySelectorAll('input, textarea') : [];
    for(var i = 0; i < liste.length; i++) schuetze(liste[i]);
  }
  var karten = document.querySelectorAll('.logincard');
  for(var ki = 0; ki < karten.length; ki++){
    var karte = karten[ki];
    if(!karte.parentNode || karte.closest('form') || !karte.querySelector('input[type="password"]')) continue;
    var f = document.createElement('form');
    f.setAttribute('novalidate', '');
    f.style.display = 'contents';
    f.addEventListener('submit', function(e){ e.preventDefault(); });
    karte.parentNode.insertBefore(f, karte);
    f.appendChild(karte);
  }
  alle(document.documentElement);
  new MutationObserver(function(ms){
    for(var i = 0; i < ms.length; i++) for(var k = 0; k < ms[i].addedNodes.length; k++) alle(ms[i].addedNodes[k]);
  }).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
