<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=99"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Knechtgarten · Sicherheitsdatenblatt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@600&display=swap" rel="stylesheet">
<style>
/* Handy-Seite nach dem Scan eines gelben Sicherheitsdatenblatt-Klebers (ohne Anmeldung): Produkt, Notfall Tox Info 145
   mit UFI-Nummer, Sicherheitsdatenblätter, Schutzausrüstung und Verhaltensregeln – Daten über die Edge Function «sdb-qr». */
:root{--navy:#323E4E;--bg:#F5F7F9;--grau:#8B9097;--line:#E1E5EA;--gelb:#FFE15A;--gelbhell:#FFF8D6;--rot:#B42318;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--navy);font:16px/1.5 -apple-system,"Segoe UI",Arial,sans-serif;}
.kopf{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;}
.kopf .marke{font-family:Jost,sans-serif;font-weight:600;font-size:17px;letter-spacing:.2px;}
main{max-width:640px;margin:0 auto;padding:14px 16px 32px;}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;}
.titel{display:flex;gap:12px;align-items:center;}
.titel img{width:72px;height:72px;object-fit:cover;border-radius:8px;flex:none;}
h1{font-family:Jost,sans-serif;font-weight:600;font-size:22px;line-height:1.2;margin:0;}
.unter{color:var(--grau);font-size:14px;}
.art{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:20px;padding:3px 10px;margin-bottom:6px;background:var(--gelb);color:#1a1a1a;}
.art svg{width:15px;height:15px;}
.notfall{background:#FDECEA;border-color:#F2C9C4;}
.notfall .tel{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--rot);color:#fff;text-decoration:none;font-weight:700;font-size:19px;border-radius:10px;padding:14px;}
.notfall .tel svg{width:22px;height:22px;}
.notfall p{margin:10px 0 0;font-size:14px;}
.ufi{margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;}
.ufi b{font-family:Consolas,monospace;font-size:16px;letter-spacing:.5px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px 8px;user-select:all;}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--grau);margin:0 0 8px;font-weight:700;}
.doc{display:flex;align-items:center;gap:10px;padding:11px 12px;margin-top:6px;border-radius:8px;background:var(--gelbhell);color:var(--navy);text-decoration:none;font-weight:700;}
.doc svg{width:20px;height:20px;flex:none;}
.psa{display:flex;flex-wrap:wrap;gap:6px;}
.psa span{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:14px;font-weight:600;}
.txt img,.txt video{max-width:100%;height:auto;border-radius:8px;}
.txt table{border-collapse:collapse;width:100%;font-size:14px;} .txt td,.txt th{border:1px solid var(--line);padding:4px 6px;}
.txt p:first-child{margin-top:0;} .txt p:last-child{margin-bottom:0;}
.leer{color:var(--grau);}
.fuss{text-align:center;color:var(--grau);font-size:13px;margin-top:20px;}
.fuss a{color:var(--navy);}
</style>
</head>
<body data-kg-ohne-leiste>
<div class="kopf"><span class="marke">Knechtgarten</span></div>
<main id="inhalt"><div class="card leer">Lädt …</div></main>
<script>
const SUPABASE_URL = 'https://oalapdxinqlnzwxhyuzy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_DoeD4uEnwemmnFu4AxE9uw_5lmQYc5P';
const PSA = { brille: 'Schutzbrille', gesicht: 'Gesichtsschutz', gehoer: 'Gehörschutz', atem: 'Atemschutz', handschuhe: 'Schutzhandschuhe',
  schuhe: 'Sicherheitsschuhe', helm: 'Schutzhelm', schnitt: 'Schnittschutz', weste: 'Warnweste', kleidung: 'Schutzkleidung' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
// Überschrift-Icons (eigene erlaubt): Warnzeichen, Telefon, Datei
const WARN = svg('<path d="M12 3l9.5 17h-19z"/><path d="M12 10v4.5M12 17.5h.01"/>');
const TEL = svg('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>');
const DATEI = svg('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>');
function sauber(html){
  const t = document.createElement('template'); t.innerHTML = html || '';
  t.content.querySelectorAll('script,iframe,object,embed,style').forEach(n => n.remove());
  t.content.querySelectorAll('*').forEach(n => [...n.attributes].forEach(a => { if(/^on/i.test(a.name) || /^\s*javascript:/i.test(a.value)) n.removeAttribute(a.name); }));
  return t.innerHTML;
}
const leerText = h => !(h || '').replace(/<[^>]+>/g, '').trim() && !/<(img|video|table)/.test(h || '');
async function start(){
  const m = location.pathname.match(/^\/s\/([a-z0-9]+)/i), code = m ? m[1] : new URLSearchParams(location.search).get('c');
  const el = document.getElementById('inhalt');
  if(!code){ el.innerHTML = '<div class="card leer">Kein Code gefunden. Bitte den QR-Code auf dem Behälter nochmals scannen.</div>'; return; }
  let d;
  try{
    const r = await fetch(`${SUPABASE_URL}/functions/v1/sdb-qr`, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY }, body: JSON.stringify({ code }) });
    d = await r.json(); if(!r.ok) throw new Error(d.error || r.status);
  }catch(e){ el.innerHTML = '<div class="card leer">Dieser QR-Code ist nicht mehr gültig. Bitte im Büro melden. Im Notfall: Tox Info Suisse <a href="tel:145">145</a>.</div>'; return; }
  document.title = `${d.titel} · Sicherheitsdatenblatt`;
  let h = `<div class="card titel">${d.foto ? `<img src="${esc(d.foto)}" alt="">` : ''}<div>
    <span class="art">${WARN}Sicherheitsdatenblatt</span><h1>${esc(d.titel)}</h1>${d.untertitel ? `<div class="unter">${esc(d.untertitel)}</div>` : ''}</div></div>`;
  h += `<div class="card notfall"><a class="tel" href="tel:145">${TEL}Notfall: Tox Info Suisse 145</a>
    <p>Bei Vergiftung oder Unklarheit 145 anrufen und den Produktnamen${d.ufi ? ' und die UFI-Nummer' : ''} nennen. Bei Lebensgefahr 144.</p>
    ${d.ufi ? `<div class="ufi">UFI-Nummer <b>${esc(d.ufi)}</b></div>` : ''}</div>`;
  const sdb = d.dateien.filter(f => f.sdb !== false), merk = d.dateien.filter(f => f.sdb === false);
  const link = f => `<a class="doc" href="${esc(f.url || '#')}" target="_blank" rel="noopener">${DATEI}${esc(f.name)}</a>`;
  h += `<div class="card"><h2>Sicherheitsdatenblatt</h2>${sdb.length ? sdb.map(link).join('') : '<div class="leer">Noch kein Datenblatt hinterlegt. Bitte im Büro melden.</div>'}</div>`;
  if(merk.length) h += `<div class="card"><h2>Merkblätter</h2>${merk.map(link).join('')}</div>`;
  if(d.psa.length) h += `<div class="card"><h2>Schutzausrüstung</h2><div class="psa">${d.psa.map(k => `<span>${esc(PSA[k] || k)}</span>`).join('')}</div></div>`;
  if(!leerText(d.html)) h += `<div class="card"><h2>Worauf achten, Erste Hilfe</h2><div class="txt">${sauber(d.html)}</div></div>`;
  h += `<div class="fuss">Fragen? Knechtgarten · <a href="tel:+41334531020">033 453 10 20</a></div>`;
  el.innerHTML = h;
}
start();
</script>
</body>
</html>
