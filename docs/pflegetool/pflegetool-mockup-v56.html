<title>Pflege- und Service-Tool</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&display=swap">
<style>
/* Layout: App-Rahmen mit Kopfleiste + Ansichts-Reitern; Inhalte als ruhige Tabellen/Karten, Jahresplan als KW-Raster */
:root{
  --bg:#f5f7f9; --surface:#ffffff; --surface-2:#eef1f4; --fg:#323e4e; --ink:#1e2530; --muted:#8b9097; --line:#dde2e8;
  --brand:#323e4e; --on-brand:#ffffff; --blue:#d6e7f4; --green:#d1db5f; --reg:#e3eaf1;
  --plan-bg:#d6e7f4; --plan-fg:#323e4e; --done-bg:#d1db5f; --done-fg:#323e4e;
  --now:#d1db5f;
  --f-head:"Jost",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-body:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --r:3px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171c23; --surface:#1f262f; --surface-2:#262e39; --fg:#e3e8ee; --ink:#f1f4f7; --muted:#9aa1aa; --line:#323b47;
  --brand:#d6e7f4; --on-brand:#1f262f; --blue:#2f4256; --green:#b7c046;
  --plan-bg:#2f4256; --plan-fg:#d6e7f4; --done-bg:#b7c046; --done-fg:#1f262f; --now:#b7c046; --reg:#1d2530; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171c23; --surface:#1f262f; --surface-2:#262e39; --fg:#e3e8ee; --ink:#f1f4f7; --muted:#9aa1aa; --line:#323b47;
  --brand:#d6e7f4; --on-brand:#1f262f; --blue:#2f4256; --green:#b7c046;
  --plan-bg:#2f4256; --plan-fg:#d6e7f4; --done-bg:#b7c046; --done-fg:#1f262f; --now:#b7c046; --reg:#1d2530; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{font-family:var(--f-head);font-weight:600;color:var(--fg);margin:0;text-wrap:balance}
h1{font-size:24px} h2{font-size:19px} h3{font-size:15px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.tabnum{font-variant-numeric:tabular-nums}

/* Kopf */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:24px;padding-block:0;flex-wrap:wrap}
.brand{font-family:var(--f-head);font-weight:600;font-size:17px;padding-block:14px;display:flex;align-items:center;gap:8px}
.brand small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav button svg.i{width:16px;height:16px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;padding:16px 12px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500}
.nav button:hover{color:var(--fg)}
.nav button[aria-current="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.nav button:focus-visible{outline:2px solid var(--fg);outline-offset:-2px}
.mock{margin-left:auto;font-size:12px;color:var(--muted);border:1px dashed var(--line);padding:3px 8px;border-radius:var(--r)}

/* Allgemein */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:24px 16px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r);font-weight:500;font-size:13.5px}
.btn-p{background:var(--brand);color:var(--on-brand)}
.btn-s{border:1px solid var(--line);color:var(--fg);background:var(--surface)}
.btn-s:hover{border-color:var(--muted)}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.icon-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;flex:none;border-radius:50%;border:1px solid var(--fg);background:var(--surface);color:var(--fg);box-sizing:border-box}
.icon-btn svg.i{width:14px;height:14px}
.icon-btn:hover{color:#B4655F;border-color:#B4655F}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 10px;color:var(--muted);min-width:0}
.search input[type=text]{border:0;outline:none;background:transparent;color:var(--fg);padding:8px 0;font:inherit;outline:none;width:200px;max-width:100%}
select,input[type=text],input[type=number],textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px}
select:focus,input:focus,textarea:focus{outline:2px solid var(--blue);border-color:var(--brand)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 7px;border-radius:var(--r);background:var(--surface-2);color:var(--fg);white-space:nowrap}
.chip b{font-weight:600;letter-spacing:.03em}
.abo{font-size:12px;padding:2px 8px;border-radius:var(--r);border:1px solid var(--line);white-space:nowrap}
.abo.a1{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.abo.a2{background:var(--blue);color:var(--plan-fg);border-color:transparent}
.abo.a3{color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
.kunden tbody tr{cursor:pointer}
.kunden td{padding:5px 12px;white-space:nowrap;font-size:13.5px}
.kunden td:last-child{white-space:normal;min-width:220px}
.kunden th{padding:9px 12px}
.kchips{display:flex;flex-wrap:wrap;gap:1px 8px;line-height:1.25}
.kc{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--fg);white-space:nowrap}
.kc .kdot{width:7px;height:7px}
.aboi{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;box-sizing:border-box;border-radius:50%}
.aboi svg.i{width:14px;height:14px}
.aboi.a1{background:#323E4E;color:#fff}
.aboi.a2{background:#D6E7F4;color:#323E4E}
.aboi.a3{border:1px solid #8B9097;color:#8B9097}
.count{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.abof{display:inline-flex;align-items:center;gap:4px;padding:0 10px 0 0}
.abof .muted{margin-right:4px}
.abob{all:unset;cursor:pointer;border-radius:50%;padding:2px;display:inline-flex;border:2px solid transparent}
.abob[aria-pressed="true"]{border-color:var(--fg)}
.abob.off{opacity:.3}
.abob:hover{opacity:1}
.abob:focus-visible{outline:2px solid var(--fg);outline-offset:1px}
.rbtn{all:unset;cursor:pointer;width:24px;height:24px;box-sizing:border-box;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--fg);background:var(--surface);color:var(--fg);justify-self:center;flex:none}

.rbtn:hover{background:var(--brand);color:var(--on-brand)}

.rbtn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.rbtn svg.i{width:14px;height:14px}
.rbtn.sm{margin-left:8px;vertical-align:middle}

.lbl-n{display:inline-flex;align-items:center}
.wt{width:100%;border-collapse:collapse}
.wt th{padding:6px 8px;font-size:11px}
.wt td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.wt tbody tr:last-child td{border-bottom:0}
.wt .c{text-align:center}
.wt .w-i{width:44px}.wt .w-kw{width:72px}.wt .w-x{width:36px}
.wt td input[type=number]{width:56px;padding:4px 6px;text-align:center}
.wt-n{font-size:14px}
.wt-s{display:block;color:var(--muted);font-size:11.5px}
.wt .ask-row td{padding:0 0 8px}
.wt .ask{margin:0}
.tin{width:calc(100% + 7px);margin-left:-7px;font-size:14px;border-color:transparent !important;background:transparent !important;padding:3px 6px !important}
.tin:hover{border-color:var(--line) !important}
.tin:focus{border-color:var(--brand) !important;background:var(--surface) !important}
input.tin{font-weight:400}
.wt td input.tin{font-size:14px !important;line-height:1.45}
textarea.tin{min-height:0;resize:vertical;font-size:12.5px;color:var(--muted);line-height:1.45}
.addlinks{display:flex;gap:24px;flex-wrap:wrap;align-items:center}
.wt .w-art{width:120px}.wt .w-std{width:74px}
.wt-art{font-size:12.5px;color:var(--fg)}
.wt-std{font-size:12.5px;color:var(--muted);white-space:nowrap}
.spick summary.addrow{list-style:none;cursor:pointer;display:inline-flex;border:0;padding:8px 0;background:transparent;font-size:13px;border-radius:0}
.spick summary::-webkit-details-marker{display:none}
.sp-panel{width:320px;max-width:calc(100vw - 48px);gap:2px}
.sp-panel .search{margin:2px 2px 6px}
.sp-panel .search input{width:100%}
.sp-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px 8px 2px}
.sp-item{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:8px;border-radius:var(--r);font-size:13.5px}
.sp-item:hover,.sp-item:focus-visible{background:var(--surface-2)}
.sp-none{padding:8px}
.jr.std{grid-template-columns:24px 34px minmax(0,1fr) 92px}
.jr .c{text-align:center}
.jr.std > .rbtn{justify-self:center}
.dtext{min-height:260px;line-height:1.7}
.dlist{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;line-height:1.5}
.row-end{display:flex;justify-content:flex-end}
.job.sel{outline:2px solid var(--fg);outline-offset:1px}
/* Drag & Drop in den Pflegekategorien */
.fn-wrap{display:flex;align-items:center;gap:4px;min-width:0}
.fn-wrap input{flex:1;min-width:0}
.grip{cursor:grab;display:inline-flex;color:var(--muted);padding:2px;border-radius:var(--r);flex:none}
.grip:hover{color:var(--fg);background:var(--surface-2)}
.grip:active{cursor:grabbing}
.grip svg.i{width:16px;height:16px}
[data-drag].dragging{opacity:.4}
[data-drag].dz-top{box-shadow:inset 0 2px 0 #323E4E}
[data-drag].dz-bot{box-shadow:inset 0 -2px 0 #323E4E}
/* Feldtyp Tabelle */
.tabf{gap:6px}
.tabf-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tabf-st{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.tabf-st input{width:120px;padding:3px 6px;font-size:12.5px}
.tabf-w{border:1px solid var(--line)}
.tabf-t{width:100%;border-collapse:collapse;font-size:12.5px}
.tabf-t th{font-size:10.5px;padding:6px;white-space:nowrap;background:var(--surface-2)}
.tabf-t td{padding:3px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.tabf-t td input,.tabf-t td select{font-size:12.5px !important;padding:3px 5px;width:100%;min-width:0;box-sizing:border-box}
.tabf-t td input.zeit{width:62px;text-align:center;font-variant-numeric:tabular-nums}
.tz{display:flex;align-items:center;gap:3px;white-space:nowrap}
.tz small{color:var(--muted);font-size:10.5px;margin-left:3px;min-width:44px}
.tu{display:flex;align-items:center;gap:3px}
.tu input{width:60px !important}
.tu span{font-size:11px;color:var(--muted)}
.tabl-w{border:1px solid var(--line);margin-top:4px}
.tabl{width:100%;border-collapse:collapse;font-size:12px}
.tabl th{font-size:10px;padding:5px 6px;background:var(--surface-2);white-space:nowrap}
.tabl td{padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.modal.wide{width:720px}
.def.sp{grid-template-columns:minmax(0,1.3fr) 170px minmax(0,1fr) 28px}
/* Register (wechselt pro Pflegekategorie) und «Kunde allgemein» */
.reg-wrap{margin-top:22px}
.reg-tabs{margin-top:0;border-bottom:0;gap:4px;padding-left:12px}
.reg-tabs button[role=tab]{background:transparent;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;padding:9px 16px;color:var(--muted)}
.reg-tabs button[role=tab]:hover{background:var(--surface-2);color:var(--fg)}
.reg-tabs button[role=tab][aria-selected="true"]{background:var(--reg);border-color:var(--line);color:var(--ink);font-weight:600;box-shadow:inset 0 4px 0 var(--kc);position:relative;top:1px}
.reg{background:var(--reg);border:1px solid var(--line);border-radius:10px;padding:3px 16px 16px;box-shadow:inset 0 3px 0 var(--kc, var(--line))}  /* Farblinie als Innenschatten: folgt sauber der Rundung */
.reg > .kbody{margin-top:16px}
.allg-h{display:flex;align-items:baseline;gap:10px;margin:30px 2px 0;padding-top:14px;border-top:1px solid var(--line)}
.allg-h span{font-family:var(--f-head);font-weight:600;font-size:16px;color:var(--fg)}
.allg-h small{font-size:12px;color:var(--muted)}
.ftags{display:flex;flex-wrap:wrap;gap:6px}
.ftags button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:12.5px}
.ftags button span{font-size:11px;color:var(--muted)}
.ftags button[aria-pressed="true"]{background:#323E4E;border-color:#323E4E;color:#fff}
.ftags button[aria-pressed="true"] span{color:#d6e7f4}
.ftags button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.ft-d{display:flex;align-items:center;gap:4px}
.ft-d .kdot{width:7px;height:7px}
/* Fotos */
#fotocard.over{outline:2px dashed var(--brand);outline-offset:-6px}
.foto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.ft{position:relative;display:flex;flex-direction:column;gap:2px;min-width:0}
.ft-img{all:unset;cursor:zoom-in;display:block;aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:var(--surface-2);position:relative}
.ft-img img,.ft-img svg.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ft-img:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.ft .dok-more{background:rgba(255,255,255,.85);top:4px;right:4px}
.ft-n{font-size:12px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft-d{font-size:11px;color:var(--muted)}
button.ph{all:unset;cursor:zoom-in;aspect-ratio:4/3;border-radius:var(--r);background:var(--surface-2);display:flex;align-items:flex-end;padding:6px;font-size:11px;color:var(--muted);position:relative;overflow:hidden;box-sizing:border-box}
button.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
button.ph span{position:relative;background:var(--surface);padding:1px 5px;border-radius:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.photos.sm{grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.lb{position:fixed;inset:0;z-index:80;background:rgba(20,25,32,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:max(48px,env(safe-area-inset-top,0px)) 56px 32px}
.lb-img{position:relative;width:min(900px,100%);aspect-ratio:4/3;max-height:75vh;border-radius:8px;overflow:hidden;background:#2a323d}
.lb-img img,.lb-img svg.art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.lb-cap{color:#e3e8ee;font-size:13.5px;text-align:center}
.lb-x{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));background:#fff !important}
.lb-nav{all:unset;cursor:pointer;position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.9);color:#323E4E;display:flex;align-items:center;justify-content:center}
.lb-nav.l{left:max(8px,env(safe-area-inset-left,0px))}.lb-nav.r{right:max(8px,env(safe-area-inset-right,0px))}
.lb-nav:focus-visible{outline:3px solid var(--blue)}
.lb-thumb{position:relative;aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:var(--surface-2);max-height:220px}
.lb-thumb img,.lb-thumb svg.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* Angebote / Dokumente: kompakte Kacheln */
.dok-sec{display:flex;flex-direction:column;gap:8px}
.dok-sec + .dok-sec{margin-top:10px;padding-top:14px;border-top:1px solid var(--line)}
.dok-h{display:flex;align-items:baseline;gap:8px}
.dok-h h3{font-size:15px}
.dok-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.dok{position:relative;display:flex;flex-direction:column;gap:1px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0}
.dok.fremd{opacity:.5}
.dok.ers{opacity:.4;background:var(--surface-2)}
.dok-pdf{display:flex;align-items:center;gap:4px;color:#B4655F;text-decoration:none;font-size:10px;font-weight:700;margin-bottom:3px;width:max-content}
.dok-pdf svg.i{width:20px;height:20px}
.dok-pdf:hover{text-decoration:underline}
.dok-more{all:unset;cursor:pointer;position:absolute;top:4px;right:6px;width:22px;height:22px;border-radius:50%;text-align:center;line-height:20px;color:var(--fg);font-weight:700}
.dok-more:hover,.dok-more:focus-visible{background:var(--surface-2);outline:none}
.dok-nr{font-size:11.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.dok-d{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.dok-t{font-size:11.5px;color:var(--fg);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.dok-k{display:flex;gap:3px;margin-top:4px;min-height:9px}
.btn.danger{color:#B4655F;border-color:#B4655F}
/* Angebote (alt) */
.ang-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:10px}
.ang{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.ang.fremd{opacity:.55}
.ang.ers{opacity:.45;background:var(--surface-2)}
.ang-pdf{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:52px;height:64px;border:1px solid var(--line);border-radius:4px;color:#B4655F;text-decoration:none;font-size:10px;font-weight:700;background:var(--surface)}
.ang-pdf svg.i{width:22px;height:22px}
.ang-pdf:hover{border-color:#B4655F}
.ang-t{font-weight:600;color:var(--ink);font-size:14px}
.ang-tag{font-size:11px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:var(--r);padding:0 5px;margin-left:4px}
.ang-m{font-size:12px;color:var(--muted);margin-top:2px}
.ang-k{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:6px}
.ang-act{display:flex;flex-direction:column;gap:6px}
.ang-chk{display:flex;flex-direction:column;gap:6px}
.ang-chk label{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.ang-chk input{accent-color:var(--brand);width:16px;height:16px}
.eb-row.dis strong{color:var(--muted)}
.ang-mini{display:flex;flex-direction:column}
.ang-mini a{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13.5px}
.ang-mini a:last-child{border-bottom:0}
.ang-mini svg.i{color:#B4655F;flex:none}
.ang-mini small{display:block;color:var(--muted);font-size:11.5px}
/* Handy-Ansicht */
.phone-wrap{display:flex;justify-content:center;padding-block:8px 24px}
.phone{width:390px;max-width:100%;height:800px;border:10px solid #1e2530;border-radius:40px;background:var(--bg);overflow:hidden;box-shadow:0 10px 40px rgba(30,37,48,.18)}
.phone-screen{height:100%;overflow-y:auto;overflow-x:hidden}
.mh{display:flex;flex-direction:column;gap:10px;padding:14px 14px 24px}
.mh-top{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:-14px;background:var(--bg);padding-top:14px;margin-top:-14px;z-index:2}
.mh-kw{display:flex;flex-direction:column;align-items:center}
.mh-kw strong{font-family:var(--f-head);font-size:22px;font-weight:600}
.mh-kw span{font-size:12px;color:var(--muted)}
.mh-ic{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--fg);color:var(--fg);background:var(--surface);flex:none;box-sizing:border-box}
.mh-ic svg.i{width:18px;height:18px}
.mh-ic:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.mh-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.mh-strip::-webkit-scrollbar{display:none}
.mh-w{all:unset;cursor:pointer;flex:none;width:38px;text-align:center;padding:7px 0;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:13px;font-variant-numeric:tabular-nums}
.mh-w.now{border-color:var(--green);box-shadow:inset 0 -3px 0 var(--green)}
.mh-w.on{background:#323E4E;border-color:#323E4E;color:#fff}
.mh-filter{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mh-filter select{width:100%;padding:10px 8px;font-size:14px}
.mh-icons{display:flex;justify-content:space-between;align-items:center}
.mh-icons .abof{padding:0}
.aboi.st-offen{border:1.5px solid #323E4E;background:var(--surface)}
.aboi.st-erledigt{background:#D1DB5F;color:#323E4E}
.aboi.st-erledigt .ck{width:14px;height:14px;stroke-width:2.2}
.mh-sum{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding-top:2px}
.mh-list{display:flex;flex-direction:column;gap:10px}
.mc{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.mc.done{opacity:.75}
.mc-main{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:12px 14px 10px;width:100%;box-sizing:border-box}
.mc-n{font-weight:600;font-size:15.5px;color:var(--ink)}
.mc-o{font-size:13px;color:var(--muted)}
.mc-j{font-size:13.5px;margin-top:4px}
.mc-z{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.mc-z svg.i{width:13px;height:13px}
.mc-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 14px 12px}
.mc-done{all:unset;cursor:pointer;margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:20px;border:1px solid #323E4E;font-weight:600;font-size:14px;color:#323E4E;box-sizing:border-box}
.mc-done .ck{width:16px;height:16px;stroke-width:2.2}
.mc-done.on{background:#D1DB5F;border-color:#D1DB5F}
.mc-done:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.mh-leer{font-size:14px;color:var(--muted);text-align:center;padding:30px 10px}
.md-top{display:flex;align-items:center;gap:10px}
.md-k{font-size:22px}
.md-row{display:flex;flex-direction:column;gap:8px}
.md-link{display:flex;gap:10px;align-items:flex-start;color:var(--ink);text-decoration:none;font-size:15px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.md-link svg.i{color:var(--fg);margin-top:2px}
.md .stat button{padding:12px 0;font-size:15px}
.md-cam{justify-content:center;margin-top:6px}
.phone-screen{display:flex;flex-direction:column}
.phone-screen > .mh{flex:1}
.mh-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.mh-title h2{font-size:24px}
.mh-sec{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.mh-sh{display:flex;justify-content:space-between;font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--muted);padding-bottom:4px;border-bottom:1px solid var(--line)}
.mh-sh .n{font-variant-numeric:tabular-nums}
.mh-sec.late .mh-sh{color:#B4655F;border-color:#B4655F}
.mc-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kchip.sm{font-size:10.5px;padding:2px 6px}
.mc-foto{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 16px;border-radius:22px;background:#323E4E;color:#fff;font-weight:600;font-size:14px;box-sizing:border-box}
.mc-foto svg.i{width:18px;height:18px}
.mc-act .mc-done{margin-left:0;height:44px;padding:0 18px;border-radius:22px}
.mc-act .mh-ic.sm:first-of-type{margin-left:auto}
.mh-ic.sm{width:34px;height:34px;border-color:var(--line);color:var(--muted)}
.mh-ic.sm svg.i{width:16px;height:16px}
.mh-search{width:100%;box-sizing:border-box}
.mh-search input[type=text]{width:100%;padding:11px 0;font-size:15px}
.mh-klist{display:flex;flex-direction:column;gap:8px}
.mk{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.mk-kats{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:3px}
.mk:focus-visible{outline:2px solid var(--fg)}
.md-top .md-k{font-size:20px}
.md-mini{display:flex;flex-direction:column;gap:4px;font-size:13px}
.md-mini a{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none}
.md-mini svg.i{width:15px;height:15px}
.mh-ktabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.mh-ktabs button{all:unset;cursor:pointer;flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:13.5px}
.mh-ktabs button[aria-pressed="true"]{background:#323E4E;border-color:#323E4E;color:#fff}
.mh-wk{display:flex;gap:6px;flex-wrap:wrap}
.mh-wk button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:var(--r);border:1px solid var(--line);font-size:12.5px;background:var(--surface)}
.mh-wk button .ck{width:12px;height:12px;stroke-width:2.2}
.mh-wk button.ok{color:var(--muted)}
.mh-wk button.on{border-color:#323E4E;box-shadow:inset 0 0 0 1px #323E4E;font-weight:600;color:var(--ink)}
.md-big{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.big-done,.big-foto{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;height:46px;border-radius:10px;font-weight:600;font-size:15.5px;box-sizing:border-box}
.big-foto{margin-top:4px}
.big-done{border:2px solid #323E4E;color:#323E4E;background:var(--surface)}
.big-done.on{background:#D1DB5F;border-color:#D1DB5F}
.big-done .ck{width:19px;height:19px;stroke-width:2.2}
.big-foto{background:#323E4E;color:#fff}
.big-foto svg.i{width:22px;height:22px}
.big-done:focus-visible,.big-foto:focus-within{outline:3px solid var(--blue);outline-offset:2px}
.addrow.sm{font-size:12.5px;color:var(--muted);padding:6px 0}
.mz{display:flex;flex-direction:column;gap:6px;padding:10px;background:var(--surface-2);border-radius:6px}
.mz input,.mz textarea{width:100%;box-sizing:border-box}
.md-arb{padding:8px 0}
.md-arb-h{display:flex;gap:8px;align-items:baseline;margin-bottom:4px}
.md-arb .dlist{margin:0 0 4px;padding-left:20px;font-size:14px}
.md-editbtn{justify-content:center;margin-top:6px}
.md-edit-act{display:flex;gap:8px;justify-content:flex-end}
.md-anl{border-top:0}
.md-anl summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--muted);padding:6px 0}
.md-anl summary::-webkit-details-marker{display:none}
.md-anl summary svg.i{width:16px;height:16px}
.md-anl[open] summary svg.i{transform:rotate(180deg)}
.fgrid.one{grid-template-columns:1fr;margin:6px 0}
.mh-tabbar{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:3}
.mh-tabbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;font-size:12px;color:var(--muted)}
.mh-tabbar button svg.i{width:22px;height:22px}
.mh-tabbar button[aria-current="true"]{color:var(--fg);font-weight:600}
@media (max-width:500px){
  .phone{border:0;border-radius:0;height:auto;box-shadow:none;width:100%}
  .phone-screen{height:auto;overflow:visible}
  .phone-wrap{padding:0;margin-inline:-16px}
}
.plan td.c.leer{cursor:copy}
.plan td.c.leer:hover{background:var(--surface-2)}
.plan td.c.leer:hover::after,.plan td.c.neu::after{content:"+";color:var(--muted);font-size:14px;line-height:1}
.plan td.c.neu{background:var(--blue)}
.yr-sw{display:flex;align-items:center;gap:10px}
.yr-sw h1{font-variant-numeric:tabular-nums}
.vj{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:3px solid #B4655F;border-radius:var(--r);padding:8px 12px;margin-bottom:12px;font-size:13.5px}
.vj .btn{padding:5px 12px;font-size:13px}
.yrs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.yb{all:unset;cursor:pointer;text-align:center;padding:6px 0;border-radius:var(--r);font-size:13px;font-variant-numeric:tabular-nums;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.yb[aria-pressed="true"]{background:#323E4E;border-color:#323E4E;color:#fff}
.yb:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.sidepanel .seg{align-self:flex-start}
.rh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rh-y{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.rh-y input{width:84px}
.rh-sec{margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
input.err{border-color:#B4655F !important}
.sidepanel{position:fixed;top:0;right:0;bottom:0;z-index:45;width:380px;max-width:100vw;border-radius:0;border-width:0 0 0 1px;box-shadow:-6px 0 24px rgba(30,37,48,.10);overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 24px 20px}
#app.with-side{max-width:none;margin-left:max(0px, calc((100vw - 1400px) / 2));padding-right:max(396px, env(safe-area-inset-right,0px))}
.sd-head{display:flex;justify-content:space-between;align-items:center}
.sd-meta{display:flex;gap:8px;align-items:center}
.sd-k{font-size:20px;margin-top:2px}
.sd-hint{margin:0}
.sd-sec{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.sd-tabs button{padding:8px 12px}
.sd-body{display:flex;flex-direction:column;gap:10px}
.sd-list{display:flex;flex-direction:column}
.sd-item{border-bottom:1px solid var(--line);padding:2px 0}
.sd-item summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:64px minmax(0,1fr) 18px;gap:8px;align-items:center;padding:9px 0}
.sd-item summary::-webkit-details-marker{display:none}
.sd-item summary svg.i{width:16px;height:16px;color:var(--muted);transition:transform .15s}
.sd-item[open] summary svg.i{transform:rotate(180deg)}
.sd-item summary:focus-visible{outline:2px solid var(--fg)}
.sd-art{font-size:12px;color:var(--muted)}
.sd-n{font-size:14px;color:var(--ink)}
.sd-item > ol,.sd-item > div{margin:0 0 10px 72px;font-size:13.5px}
.sd-b{display:flex;flex-direction:column;gap:4px;line-height:1.5}
.sd-dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);margin:0;border-top:1px solid var(--line)}
.sd-dl dt,.sd-dl dd{margin:0;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.sd-dl dt{color:var(--muted)}
.sd-dl dd{color:var(--ink);white-space:pre-wrap}
.sd-dl dt.full,.sd-dl dd.full{grid-column:1/-1}
.sd-dl dt.full{border-bottom:0;padding-bottom:0}
.fgrid > .field.full{grid-column:1/-1}
textarea.autogrow{min-height:0;resize:none;overflow:hidden;line-height:1.5}
.sd-l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-right:8px}
.sd-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px}
@media (max-width:900px){#app.with-side{margin-left:auto;padding-right:max(16px,env(safe-area-inset-right,0px))}}
@media (prefers-reduced-motion:reduce){.sd-item summary svg.i{transition:none}}
.tip{position:relative}
.tip:hover::after,.abob:focus-visible .tip::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#323E4E;color:#fff;font-size:12px;font-weight:500;padding:4px 8px;border-radius:var(--r);z-index:40;pointer-events:none}
.abo-leg .tip:hover::after{display:none}
.abo-leg{display:flex;gap:14px;flex-wrap:wrap}
.abo-leg > span{display:inline-flex;align-items:center;gap:6px}
.abo-leg .aboi{width:22px;height:22px}
.abo-leg .aboi svg.i{width:14px;height:14px}
.kunden tbody tr:hover td{background:var(--surface-2)}
.kunden td .name{font-weight:600;color:var(--ink)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.count{font-size:12.5px;color:var(--muted);margin-top:8px}

/* Jahresplan */
.kat-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.kat-tabs button{all:unset;cursor:pointer;padding:7px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:13px;display:inline-flex;gap:6px;align-items:center}
.kat-tabs button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.kat-tabs button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.kat-tabs .n{font-size:11px;opacity:.7}
.legend{display:flex;gap:14px;align-items:center;font-size:12.5px;color:var(--muted);margin-left:auto;flex-wrap:wrap}
.lg{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:12px;border-radius:2px;display:inline-block}
.plan-wrap{overflow:auto;max-height:70vh;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.plan{border-collapse:separate;border-spacing:0;width:max-content}
.plan th,.plan td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);height:30px}
.plan thead th{position:sticky;background:var(--surface);z-index:2;text-align:center;font-size:10.5px;letter-spacing:0;text-transform:none}
.plan thead tr:first-child th{top:0;height:24px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.plan thead tr:nth-child(2) th{top:24px;height:24px}
.plan .nm{position:sticky;left:0;background:var(--surface);z-index:1;text-align:left;padding:0 10px;min-width:200px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan thead .nm{z-index:3}
.plan .nm a{color:var(--ink);text-decoration:none;font-weight:600;cursor:pointer}
.plan .nm a:hover{text-decoration:underline}
.plan .nm .s{font-size:11.5px;color:var(--muted);font-weight:400;margin-left:6px}
.plan td.c{width:34px;min-width:34px;text-align:center;vertical-align:middle;padding-block:2px}
.plan td.c.now,.plan th.now{background:color-mix(in srgb,var(--now) 22%,var(--surface))}
.plan .mon{border-right:1px solid var(--line)}
.job{display:flex;align-items:center;justify-content:center;height:15px;margin:1px 2px;border-radius:2px;font-size:9px;font-weight:700;letter-spacing:.03em;line-height:1;padding:0;cursor:pointer;border:1px solid rgba(50,62,78,.18);width:calc(100% - 4px);font-family:var(--f-body);background:var(--kc);color:var(--kt)}
.job:hover{filter:brightness(.92)}
.job:focus-visible{outline:2px solid var(--fg);outline-offset:1px}
.job .ck{width:12px;height:12px;stroke-width:2.4}
.job.m-grau{background:#C9CED4;color:#323E4E;border-color:#C9CED4}
.job.m-strich{text-decoration:line-through;text-decoration-thickness:1.5px}
.kdot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;border:1px solid rgba(50,62,78,.25)}
.kchip{font-size:12px;font-weight:600;padding:3px 8px;border-radius:var(--r);background:var(--kc);color:var(--kt);border:1px solid rgba(50,62,78,.18)}
.seg{display:inline-flex}
.seg button{all:unset;cursor:pointer;padding:6px 11px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--fg)}
.seg button + button{border-left:0}
.seg button:first-child{border-radius:var(--r) 0 0 var(--r)}
.seg button:last-child{border-radius:0 var(--r) var(--r) 0}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.seg button:focus-visible{outline:2px solid var(--fg);outline-offset:1px}
.legend .seg button{padding:4px 9px;font-size:12px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 0;border-radius:var(--r);border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--muted)}
.stat button .ck{width:15px;height:15px}
.stat .s-offen[aria-pressed="true"]{background:#323E4E;color:#fff;border-color:#323E4E}
.stat .s-erl[aria-pressed="true"]{background:#D1DB5F;color:#323E4E;border-color:#D1DB5F}
.stat button:focus-visible{outline:2px solid var(--fg);outline-offset:1px}
.pk-row{display:flex;gap:8px;align-items:flex-start}
.pk-row > svg.i{color:var(--muted);margin-top:1px}
.pk-row a{color:var(--ink);font-weight:600;font-size:15px;text-decoration:none}
.pk-row a:hover{text-decoration:underline}
.pk-row .icon-btn{padding:2px;margin-left:auto}
.pk-row .icon-btn.ok{color:var(--fg)}
.pop-l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:3px}
.pop-z{display:flex;flex-direction:column;gap:1px;margin-top:4px}
.pop-z span{color:var(--muted);font-size:12.5px}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swatch{all:unset;cursor:pointer;width:34px;height:34px;border-radius:var(--r);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.swatch[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:2px}
.swatch:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.swatch .ck{width:16px;height:16px;stroke-width:2.2}
.custom{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:4px 10px 4px 4px;border:1px dashed var(--line);border-radius:var(--r)}
.custom input{width:30px;height:28px;border:0;padding:0;background:transparent;cursor:pointer}
.preview{display:flex;gap:6px;align-items:center}
.preview .job{width:30px;display:inline-flex;margin:0}
.pop{position:fixed;z-index:50;width:260px;max-width:calc(100vw - 16px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 6px 24px rgba(30,37,48,.14);padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.pop-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pop-h strong{color:var(--ink)}
.pop-kat{display:flex;gap:6px;flex-wrap:wrap}
.pop ul{margin:0;padding-left:18px}
.pop .small svg.i{width:14px;height:14px;vertical-align:-2px}
.pop .btn{justify-content:center}
.au-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.yr{all:unset;cursor:pointer;font-size:12.5px;padding:4px 10px;border:1px solid var(--line);border-radius:var(--r)}
.yr[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.yr:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

// Wiederholung pro Arbeit: die nächsten 10 Jahre, standardmässig alle aktiv; einzelne Jahre lassen sich abwählen
const YEAR_NOW = 2026;
const YEARS = Array.from({length:10}, (_,i) => YEAR_NOW + i);
const rhGilt = (rh, y) => !(rh && rh.aus && rh.aus.includes(y));
const rhAktiv = rh => YEARS.filter(y => rhGilt(rh, y));
const rhKurz = rh => { const n = rhAktiv(rh).length; return n === YEARS.length ? '' : `${n} von ${YEARS.length} J.`; };
const rhLang = rh => rhKurz(rh) ? `nur ${rhAktiv(rh).join(', ')}` : 'jedes Jahr';
// Einsätze eines Kunden für ein Jahr ableiten: Standardarbeit-KW aus der Kategorie, pro Kunde übersteuerbar
function jobsOf(k, y = st.year){
  const out = [];
  for (const [kid, d] of Object.entries(k.kats)){
    const kat = katById(kid);
    if (!kat.indiv) d.an.forEach(i => { const a = kat.arb[i]; if (rhGilt(d.rh && d.rh[i], y)) out.push({kat, n:a.n, kw:d.kw[i] ?? a.kw, zust:d.zust, i}); });
    d.zusatz.forEach((z, zj) => { if (rhGilt(z.rh, y)) out.push({kat, n:z.t || 'Zusatzarbeit', kw:z.kw, zust:d.zust, zus:true, zj}); });
  }
  return out;
}
function nextJob(k){
  const j = jobsOf(k).filter(j => j.kw >= KW_NOW).sort((a,b) => a.kw-b.kw)[0];
  return j ? `KW ${j.kw} · ${j.n}` : '–';
}

  KUNDEN.forEach(k => new Set(jobsOf(k, y).filter(j => j.kw < bisKw).map(j => `${j.kat.id}|${j.kw}`))
    .forEach(x => { const [c, w] = x.split('|'); if (!st.done.has(jobKey(k.id, c, +w, y))) n++; }));
  return n;
}
function vorjahrHinweis(){

  else if (st.year === YEAR_NOW + 1){ y = YEAR_NOW; n = offeneBis(y, KW_NOW); txt = `Aus ${y} ${n===1?'ist':'sind'} noch ${n} ${n===1?'Einsatz':'Einsätze'} offen.`; }

function bindAngebote(app, k, kat){
  const nextId = () => Math.max(0, ...k.angebote.map(a => a.id)) + 1;
  const eb = app.querySelector('#aeb'); if (eb) eb.onclick = () => { st.ang = {step:'liste', q:''}; render(); document.getElementById('aq')?.focus(); };
  app.querySelectorAll('.aup').forEach(up => up.onchange = () => { const f = up.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => { st.ang = {step:'detail', neu:true, draft:{art: up.dataset.art, quelle:'upload', n:f.name, url:r.result, datum:'', t:f.name.replace(/\.pdf$/i,''), kats: kat && up.dataset.art === 'angebot' ? [kat.id] : [], ersetzt:false}}; render(); };
    r.readAsDataURL(f); });
  app.querySelectorAll('[data-aedit]').forEach(b => b.onclick = () => { const a = k.angebote.find(x => x.id === +b.dataset.aedit); st.ang = {step:'detail', neu:false, id:a.id, draft:{...a, kats:[...a.kats]}}; render(); });
  if (!st.ang || !app.querySelector('#abg')) return;
  const close = () => { st.ang = null; render(); };
  app.querySelector('#ax').onclick = close;
  app.querySelector('#abg').onclick = e => { if (e.target.id === 'abg') close(); };
  const q = app.querySelector('#aq');
  if (q) q.oninput = () => { const p = q.selectionStart; st.ang.q = q.value; render(); const n = document.getElementById('aq'); n.focus(); n.setSelectionRange(p,p); };
  app.querySelectorAll('[data-apick]').forEach(b => b.onclick = () => {
    const a = ebAngeboteOf(k).find(x => x.eb === b.dataset.apick);
    st.ang = {step:'detail', neu:true, draft:{art:'angebot', quelle:'easybill', eb:a.eb, datum:a.datum, t:a.t, kats: kat ? [kat.id] : [], ersetzt:false}}; render();
  });
  const zur = app.querySelector('#azur'); if (zur) zur.onclick = () => { st.ang = {step:'liste', q:''}; render(); };
  const rm = app.querySelector('#arm'); if (rm) rm.onclick = () => { k.angebote = k.angebote.filter(x => x.id !== st.ang.id); close(); };
  const ok = app.querySelector('#aok');
  if (ok) ok.onclick = () => {
    const d = st.ang.draft; d.t = app.querySelector('#at').value.trim() || d.t;
    const dat = app.querySelector('#ad'); if (dat) d.datum = dat.value.trim();
    const ers = app.querySelector('#aers'); if (ers) d.ersetzt = ers.checked;
    d.kats = [...app.querySelectorAll('.ang-chk input:checked')].map(i => i.value);
    if (st.ang.neu) k.angebote.push({...d, id: nextId()});
    else Object.assign(k.angebote.find(x => x.id === st.ang.id), d);
    close();
  };
}

function bindTab(app, d, kat){
  const fld = n => kat.tab && kat.tab.n === n ? kat.tab : kat.felder.find(f => f.n === n);
  const get = n => (d.w[n] = tabVal(d.w[n]));
  // Zeit direkt eintippen: «2100», «21.00» oder «9» wird zu «21:00» bzw. «09:00»
  app.querySelectorAll('input.zeit').forEach(el => el.addEventListener('change', () => {
    const s = el.value.replace(/[^0-9]/g, ''); if (!s) return;
    const h = s.length <= 2 ? s : s.slice(0, s.length - 2), mi = s.length <= 2 ? '00' : s.slice(-2);
    if (+h < 24 && +mi < 60) el.value = h.padStart(2, '0') + ':' + mi.padStart(2, '0');

  app.querySelectorAll('[data-tc]').forEach(el => el.addEventListener('change', () => {

// Drag & Drop: Felder und Standardarbeiten am Griff verschieben. Bei Standardarbeiten werden die Kunden-Zuordnungen (Index) mitgeführt.
function bindDrag(app, kat){
  let von = null;
  const rows = app.querySelectorAll('[data-drag]');
  rows.forEach(row => {
    const g = row.querySelector('.grip');
    g.ondragstart = e => { von = {typ: row.dataset.drag, i: +row.dataset.di}; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', ''); e.dataTransfer.setDragImage(row, 20, 20); row.classList.add('dragging'); };
    g.ondragend = () => { row.classList.remove('dragging'); rows.forEach(r => r.classList.remove('dz-top', 'dz-bot')); };
    row.ondragover = e => {
      if (!von || von.typ !== row.dataset.drag) return;
      e.preventDefault();
      const r = row.getBoundingClientRect(), oben = e.clientY < r.top + r.height / 2;
      row.classList.toggle('dz-top', oben); row.classList.toggle('dz-bot', !oben);
    };
    row.ondragleave = () => row.classList.remove('dz-top', 'dz-bot');
    row.ondrop = e => {
      if (!von || von.typ !== row.dataset.drag) return;
      e.preventDefault();
      let ziel = +row.dataset.di + (row.classList.contains('dz-bot') ? 1 : 0);
      if (von.i < ziel) ziel--;
      if (ziel === von.i) { von = null; render(); return; }
      if (von.typ === 'f'){ const [f] = kat.felder.splice(von.i, 1); kat.felder.splice(ziel, 0, f); }
      else if (von.typ === 's'){   // Tabellenspalte: auch die Zellen in den Kundenzeilen mitverschieben
        const mv = arr => { const [x] = arr.splice(von.i, 1); arr.splice(ziel, 0, x); };
        mv(kat.tab.sp);
        KUNDEN.forEach(k => { const d = k.kats[kat.id]; if (d && d.w[kat.tab.n]) d.w[kat.tab.n].rows.forEach(r => { while (r.length < kat.tab.sp.length) r.push(''); mv(r); }); });
      }
      else {
        const neu = [...kat.arb.keys()]; const [x] = neu.splice(von.i, 1); neu.splice(ziel, 0, x);   // neu[pos] = alter Index
        const map = {}; neu.forEach((alt, pos) => map[alt] = pos);
        kat.arb = neu.map(alt => kat.arb[alt]);
        KUNDEN.forEach(k => { const d = k.kats[kat.id]; if (!d) return;
          d.an = d.an.map(i => map[i]);
          const re = o => { if (!o) return o; const n = {}; Object.entries(o).forEach(([i, v]) => n[map[i]] = v); return n; };
          d.kw = re(d.kw); d.rh = re(d.rh);
        });
      }
      von = null; render();
    };
  });
}

// Fotos gehören zum Kunden (k.fotos). Jedes Foto hat 0..n Kategorien als Schlagwort (kats). Beispielbilder sind nur Text.
const fotoObj = f => typeof f === 'string' ? {n: f, kats: []} : f;
const fotoBild = (f, i) => f.url ? `<img alt="" src="${f.url}">` : ART(i);
// Fotos zu einer Kategorie: mit diesem Schlagwort oder ganz ohne Schlagwort (allgemein); liefert {f, i} mit Index in k.fotos
const fotosFuer = (k, katId) => k.fotos.map((f, i) => ({f, i})).filter(({f}) => !f.kats.length || f.kats.includes(katId));
const fotoHtml = (f, i, kid) => { const o = fotoObj(f);
  return `<button type="button" class="ph" ${kid != null ? `data-lb="${kid}|${i}"` : ''} aria-label="${esc(o.n || 'Foto')} vergrössern">${fotoBild(o, i)}${o.n ? `<span>${esc(o.n)}</span>` : ''}</button>`; };
// Grossansicht (Lightbox) mit Pfeilen über alle Fotos des Kunden
function lbHtml(){
  if (!st.lb) return '';
  const [kid, iS] = st.lb.split('|'), k = KUNDEN.find(x => x.id === +kid), i = +iS, f = k && k.fotos[i];
  if (!f) return '';
  return `<div class="lb" id="lb">
    <button class="lb-x icon-btn" id="lbx" aria-label="Schliessen">${ICON('x')}</button>
    ${k.fotos.length > 1 ? `<button class="lb-nav l" data-lbn="-1" aria-label="Vorheriges">${ICON('back')}</button><button class="lb-nav r" data-lbn="1" aria-label="Nächstes"><svg class="i" style="transform:scaleX(-1)"><use href="#i-back"/></svg></button>` : ''}
    <div class="lb-img">${fotoBild(f, i)}</div>
    <div class="lb-cap">${esc(f.n || '')}${f.datum ? ` · ${esc(f.datum)}` : ''}${f.kats.length ? ' · ' + f.kats.map(id => katById(id).n).join(', ') : ''} · ${i+1} / ${k.fotos.length}</div>
  </div>`;
}
function bindLb(app){
  app.querySelectorAll('[data-lb]').forEach(b => b.onclick = e => { e.preventDefault(); st.lb = b.dataset.lb; keepRender(); });
  const lb = app.querySelector('#lb'); if (!lb) return;
  const [kid, iS] = st.lb.split('|'), n = KUNDEN.find(x => x.id === +kid).fotos.length;
  lb.querySelector('#lbx').onclick = () => { st.lb = null; keepRender(); };
  lb.onclick = e => { if (e.target.id === 'lb') { st.lb = null; keepRender(); } };
  lb.querySelectorAll('[data-lbn]').forEach(b => b.onclick = () => { st.lb = `${kid}|${(+iS + +b.dataset.lbn + n) % n}`; keepRender(); });
}
// Rendern ohne Sprung (Scrollposition von Seite und Handy-Bildschirm bleibt)
function keepRender(){
  const wy = window.scrollY, ps = document.getElementById('pscreen'), py = ps ? ps.scrollTop : 0;
  render(); window.scrollTo(0, wy); const p2 = document.getElementById('pscreen'); if (p2) p2.scrollTop = py;
}
// Rahmen «Fotos» im Kunden-Detail: gehört zum ganzen Kunden; Filter-Chips nach Schlagwort
function viewFotos(k){
  const tag = st.fotoTag || '';
  const cats = Object.keys(k.kats);
  const zahl = t => k.fotos.filter(f => t === '' ? true : t === '-' ? !f.kats.length : f.kats.includes(t)).length;
  const l = k.fotos.map((f, i) => ({f, i})).filter(({f}) => tag === '' ? true : tag === '-' ? !f.kats.length : f.kats.includes(tag));
  return `
  <section class="card panel" id="fotocard" style="margin-top:16px">
    <div class="panel-h"><h3>Fotos <span class="muted small">${k.fotos.length}</span></h3></div>
    <div class="ftags" role="group" aria-label="Fotos filtern">
      <button data-ftag="" aria-pressed="${tag===''}">Alle <span>${zahl('')}</span></button>
      ${cats.map(id => `<button data-ftag="${id}" aria-pressed="${tag===id}">${dot(katById(id))}${katById(id).n} <span>${zahl(id)}</span></button>`).join('')}
      <button data-ftag="-" aria-pressed="${tag==='-'}">Ohne Zuordnung <span>${zahl('-')}</span></button>
    </div>
    <div class="foto-grid">${l.map(({f, i}) => `
      <div class="ft">
        <button type="button" class="ft-img" data-lb="${k.id}|${i}" aria-label="${esc(f.n || 'Foto')} vergrössern">${fotoBild(f, i)}</button>
        <button class="dok-more" data-fe="${i}" aria-label="Foto bearbeiten">⋯</button>
        <div class="ft-n">${esc(f.n || '')}</div>
        <div class="ft-d">${f.kats.map(id => `<span class="kdot" style="background:${katById(id).c}" title="${katById(id).n}"></span>`).join('')}${f.datum ? `<span>${esc(f.datum)}</span>` : ''}</div>
      </div>`).join('') || '<div class="muted small">Keine Fotos für diese Auswahl. Fotos auch einfach hierher ziehen.</div>'}</div>
    <label class="addrow" style="cursor:pointer">${ICON('plus')}Fotos hinzufügen<input id="fadd" type="file" accept="image/*" capture="environment" multiple hidden></label>
    ${st.fe != null && k.fotos[st.fe] ? (() => { const fi = st.fe, o = k.fotos[fi]; return `
    <div class="modal-bg" id="febg"><div class="modal card" role="dialog" aria-modal="true" aria-labelledby="feh">
      <div class="panel-h"><h2 id="feh">Foto</h2><button class="icon-btn" id="fex" aria-label="Schliessen">${ICON('x')}</button></div>
      <div class="lb-thumb">${fotoBild(o, fi)}</div>
      <div class="field"><label for="fen">Beschriftung</label><input id="fen" type="text" value="${esc(o.n || '')}" placeholder="z. B. Steuergerät Garage"></div>
      <div class="field"><label>Gehört zu (optional)</label><div class="ang-chk">${cats.map(id=>`<label><input type="checkbox" value="${id}" ${o.kats.includes(id)?'checked':''}>${dot(katById(id))}${katById(id).n}</label>`).join('')}</div></div>
      <div class="row-end" style="gap:8px;justify-content:space-between"><button class="btn btn-s danger" id="ferm">Löschen</button><button class="btn btn-p" id="feok">Speichern</button></div>
    </div></div>`; })() : ''}
  </section>`;
}
function bindFotos(app, k, kat){
  const card = app.querySelector('#fotocard'); if (!card) return;
  const heute = () => { const t = new Date(); return `${t.getDate()}.${t.getMonth()+1}.${t.getFullYear()}`; };
  // Neue Fotos bekommen die gerade offene Kategorie als Schlagwort (ausser der Filter steht auf «Ohne Zuordnung»)
  const add = files => [...files].filter(f => f.type.startsWith('image/')).forEach(f => {
    const r = new FileReader(); r.onload = () => { k.fotos.push({n: '', url: r.result, datum: heute(), kats: st.fotoTag === '-' || !kat ? [] : [st.fotoTag || kat.id]}); keepRender(); }; r.readAsDataURL(f);
  });
  card.querySelector('#fadd').onchange = e => add(e.target.files);
  ['dragenter','dragover'].forEach(ev => card.addEventListener(ev, e => { e.preventDefault(); card.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => card.addEventListener(ev, e => { e.preventDefault(); card.classList.remove('over'); }));
  card.addEventListener('drop', e => add(e.dataTransfer.files));
  card.querySelectorAll('[data-ftag]').forEach(b => b.onclick = () => { st.fotoTag = b.dataset.ftag; keepRender(); });
  card.querySelectorAll('[data-fe]').forEach(b => b.onclick = () => { st.fe = +b.dataset.fe; keepRender(); });
  if (st.fe != null && card.querySelector('#febg')){
    const fi = st.fe;
    const close = () => { st.fe = null; keepRender(); };
    card.querySelector('#fex').onclick = close;
    card.querySelector('#febg').onclick = e => { if (e.target.id === 'febg') close(); };
    card.querySelector('#ferm').onclick = () => { k.fotos.splice(fi, 1); close(); };
    card.querySelector('#feok').onclick = () => {
      k.fotos[fi] = {...k.fotos[fi], n: card.querySelector('#fen').value.trim(), kats: [...card.querySelectorAll('.ang-chk input:checked')].map(x => x.value)};
      close();
    };
  }
}
const kwText = kw => `KW ${kw}`;
// Einsätze (Kunde + Kategorie + KW) eines Jahres, gefiltert wie im Handy-Kopf
function handyEinsaetze(){
  const m = st.m, out = [];
  KUNDEN.forEach(k => {
    if (m.abo.length && !m.abo.includes(k.abo)) return;
    Object.entries(k.kats).forEach(([kid, d]) => {
      if (m.kat && kid !== m.kat) return;
      if (m.ma && !zustPass(d.zust, [m.ma])) return;
      const proKw = {};
      jobsOf(k).filter(j => j.kat.id === kid).forEach(j => (proKw[j.kw] = proKw[j.kw] || []).push(j));
      Object.entries(proKw).forEach(([kw, jobs]) => {
        const done = st.done.has(jobKey(k.id, kid, +kw));
        if (m.status.length && !m.status.includes(done ? 'erledigt' : 'offen')) return;
        out.push({k, d, kat: katById(kid), kw: +kw, jobs, done});
      });
    });
  });
  return out;
}

  const m = st.m;
  return `
    <div class="mh-filter">
      <select id="mkat" aria-label="Pflegekategorie"><option value="">Alle Kategorien</option>${KAT.map(c=>`<option value="${c.id}" ${c.id===m.kat?'selected':''}>${c.n}</option>`).join('')}</select>
      <select id="mma" aria-label="Zuständig"><option value="">Alle Zuständigen</option>${MA.map(n=>`<option ${m.ma===n?'selected':''}>${n}</option>`).join('')}<option value="-" ${m.ma==='-'?'selected':''}>Niemand zuständig</option></select>
    </div>

      <div class="abof" role="group" aria-label="Status">${STATUS_IC.map(([v,ic,l])=>`<button class="abob${m.status.length && !m.status.includes(v)?' off':''}" data-ms="${v}" aria-pressed="${m.status.includes(v)}"><span class="aboi st-${v} tip" data-tip="${l}" aria-label="${l}">${v==='erledigt'?CHECK:''}</span></button>`).join('')}</div>
    </div>`;
}
const STATUS_IC = [['offen','circle','Offen'],['erledigt','check','Erledigt']];
function handyFaellig(){
  const alle = handyEinsaetze();
  const abschn = [
    ['Überfällig', alle.filter(c => c.kw < KW_NOW && !c.done)],
    [`Diese Woche · KW ${KW_NOW}`, alle.filter(c => c.kw === KW_NOW)],
    [`Nächste Woche · KW ${KW_NOW+1}`, alle.filter(c => c.kw === KW_NOW+1)]
  ];
  return `
    <div class="mh-title"><h2>Fällig</h2><span class="muted small">Heute KW ${KW_NOW} · ${kwDatum(KW_NOW)}</span></div>
    ${handyFilter()}
    ${abschn.map(([t, l], ix) => `
      <section class="mh-sec${ix===0 && l.length ? ' late' : ''}">
        <div class="mh-sh"><span>${t}</span><span class="n">${l.length}</span></div>
        <div class="mh-list">${l.map(handyKarte).join('') || '<div class="mh-leer">Nichts fällig.</div>'}</div>
      </section>`).join('')}`;
}

// Kundenseite / Einsatz: oben gross Erledigt + Foto, darunter Arbeiten, unten Anlagedaten zum Bearbeiten
function handyKunde(){
  const m = st.m, k = KUNDEN.find(x => x.id === m.kunde);
  const ids = Object.keys(k.kats);
  if (!m.ktab || !k.kats[m.ktab]) m.ktab = ids[0];
  const d = k.kats[m.ktab], kat = katById(m.ktab);
  const jobs = jobsOf(k).filter(j => j.kat.id === m.ktab);
  const wochen = [...new Set(jobs.map(j => j.kw))].sort((a,b) => a-b);
  // Fokus-Woche: aus «Fällig» übernommen, sonst die nächste offene
  let kw = m.kw && wochen.includes(m.kw) ? m.kw : (wochen.find(w => w >= KW_NOW && !st.done.has(jobKey(k.id, m.ktab, w))) ?? wochen.find(w => !st.done.has(jobKey(k.id, m.ktab, w))) ?? [...wochen].reverse().find(w => w <= KW_NOW) ?? wochen[0]);
  const done = kw != null && st.done.has(jobKey(k.id, m.ktab, kw));
  const punkte = t => (t||'').split('\n').map(s => s.trim()).filter(Boolean);
  const diese = jobs.filter(j => j.kw === kw);
  return `
    <div class="md-top"><button class="mh-ic sm" id="mback" aria-label="Zurück">${ICON('back')}</button><h2 class="md-k">${esc(k.name)}</h2></div>
    <div class="md-mini">
      <a href="https://maps.google.com/?q=${encodeURIComponent(k.adr+', '+k.ort)}" target="_blank" rel="noopener">${ICON('pin')}${esc(k.adr)}, ${esc(k.ort.replace(/^\d+\s/,''))}</a>
      <a href="tel:${k.tel.replace(/\s/g,'')}">${ICON('phone')}${esc(k.tel)}</a>
    </div>
    ${k.notiz ? `<div class="hint">${esc(k.notiz)}</div>` : ''}
    <div class="mh-ktabs">${ids.map(id=>`<button data-mkt="${id}" aria-pressed="${id===m.ktab}">${dot(katById(id))}${katById(id).n}</button>`).join('')}</div>
    ${wochen.length ? `<div class="mh-wk">${wochen.map(w=>`<button data-mwk="${w}" class="${w===kw?'on':''}${st.done.has(jobKey(k.id, m.ktab, w))?' ok':''}">${st.done.has(jobKey(k.id, m.ktab, w))?CHECK:''}KW ${w}</button>`).join('')}</div>` : ''}
    ${kw != null ? `
    <div class="md-big">
      <button class="big-done${done?' on':''}" data-mbig="${kw}" aria-pressed="${done}">${CHECK}${done ? `Erledigt · KW ${kw}` : `Als erledigt markieren · KW ${kw}`}</button>
    </div>
    <section class="sd-sec"><h3>Fotos</h3>
      ${(() => { const l = fotosFuer(k, m.ktab); return l.length ? `<div class="photos sm">${l.map(({f, i}) => fotoHtml(f, i, k.id)).join('')}</div>` : '<div class="muted small">Noch keine Fotos.</div>'; })()}
      <label class="big-foto">${ICON('cam')}Foto hinzufügen<input type="file" accept="image/*" capture="environment" hidden data-mfoto="${k.id}|${m.ktab}"></label>
    </section>
    <section class="sd-sec"><h3>Arbeiten KW ${kw}</h3><div class="sd-list">
      ${diese.map(j => { const t = j.zus ? d.zusatz[j.zj].b : kat.arb[j.i].b, p = punkte(t); return `<div class="sd-item md-arb"><div class="md-arb-h"><span class="sd-art">${j.zus?'Zusatz':'Standard'}</span><span class="sd-n">${esc(j.n)}</span></div>${p.length ? `<ol class="dlist">${p.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>` : '<div class="muted small">Keine Infos erfasst.</div>'}</div>`; }).join('')}
    </div>
    </section>` : '<div class="mh-leer">Für diese Kategorie sind keine Arbeiten geplant.</div>'}
    ${kat.indiv ? '' : `<section class="sd-sec md-anl"><h3>Angaben / Eckdaten</h3>
      ${m.anlEdit ? `
        <div class="fgrid one">${kat.felder.filter(f=>f.t!=='fotos').map(f=>feldInput('m'+kat.id, f, d.w[f.n])).join('')}${kat.tab ? tabInput(kat.tab, d.w[kat.tab.n]) : ''}</div>
        <div class="md-edit-act"><button class="btn btn-s" id="manlab">Abbrechen</button><button class="btn btn-p" id="manlok">Speichern</button></div>`
      : `<dl class="sd-dl">${kat.felder.filter(f=>f.t!=='fotos').map(f=>{ const v = d.w[f.n], c = f.t==='notiz' || f.t==='tabelle' ? ' class="full"' : '';
          const w = f.t === 'tabelle' ? tabLese(f, v) : v == null || v === '' ? '<span class="muted">–</span>' : f.t === 'janein' ? (v === 'ja' ? 'Ja' : 'Nein') : esc(v) + (f.t === 'zahl' && f.e ? ` ${esc(f.e)}` : '');
          return `<dt${c}>${esc(f.n)}</dt><dd${c}>${w}</dd>`; }).join('')}</dl>
        ${kat.tab ? `<div class="sd-l" style="margin-top:8px">${esc(kat.tab.n)}</div>${tabLese(kat.tab, d.w[kat.tab.n])}` : ''}
        <button class="btn btn-s md-editbtn" id="manled">${ICON('set')}Angaben bearbeiten</button>`}
    </section>`}
    ${angListe(k, m.ktab)}
    <div class="sd-foot"><span class="sd-l">Zuständig</span>${d.zust.length ? esc(d.zust.join(', ')) : '<span class="muted">Niemand zuständig</span>'}</div>`;
}
function kwDatum(kw){
  const mo = new Date(2025, 11, 29 + (kw - 1) * 7), so = new Date(mo); so.setDate(mo.getDate() + 6);
  const f = d => `${d.getDate()}.${d.getMonth()+1}.`;
  return `${f(mo)}–${f(so)}`;
}
function viewHandyInhalt(){
  const m = st.m;
  const body = m.kunde ? handyKunde() : (m.tab === 'kunden' ? handyKundenListe() : handyFaellig());

      <button data-mtab="kunden" aria-current="${!!m.kunde || m.tab==='kunden'}">${ICON('users')}Kunden</button>
    </nav>`;
}
