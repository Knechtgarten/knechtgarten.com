/* ---------------- Events ---------------- */
const bind = {
  kunden(app){
    const upd = () => { const pos = app.querySelector('#q').selectionStart; render(); const q = document.getElementById('q'); q.focus(); q.setSelectionRange(pos,pos); };
    app.querySelector('#q').addEventListener('input', e => { st.f.q = e.target.value; upd(); });
    bindZustFilter(app, 'fma', () => st.f.ma, v => st.f.ma = v);
    bindAboFilter(app, 'fabo', st.f);
    app.querySelector('#fkat').onchange = e => { st.f.kat = e.target.value; render(); };
    app.querySelector('#neu').onclick = () => { st.ebOpen = true; st.ebQ = ''; render(); app.querySelector('#ebq')?.focus(); };
    if (st.ebOpen){
      const close = () => { st.ebOpen = false; render(); };
      app.querySelector('#ebx').onclick = close;
      app.querySelector('#ebbg').onclick = e => { if (e.target.id === 'ebbg') close(); };
      const q = app.querySelector('#ebq');
      q.oninput = () => { const p = q.selectionStart; st.ebQ = q.value; render(); const n = document.getElementById('ebq'); n.focus(); n.setSelectionRange(p,p); };
      app.querySelectorAll('[data-eb]').forEach(b => b.onclick = () => {
        const e = EB_KUNDEN.find(x => x.eb === +b.dataset.eb);
        const id = Math.max(...KUNDEN.map(k=>k.id)) + 1;
        KUNDEN.push({id, eb:e.eb, name:e.name, adr:e.adr, ort:e.ort, tel:e.tel, abo:'a2', kats:{}});
        st.ebOpen = false; go('detail', {kunde:id, ktab:null});
      });
    }
    app.querySelectorAll('tbody tr[data-id]').forEach(tr => {
      const open = () => go('detail', {kunde:+tr.dataset.id, ktab:null});
      tr.onclick = open; tr.onkeydown = e => { if (e.key==='Enter') open(); };
    });
  },
  jahr(app){
    // Mehrfachauswahl: Kategorien an-/abwählen, «Alle» setzt zurück
    app.querySelectorAll('.kat-tabs button').forEach(b => b.onclick = () => {
      const id = b.dataset.kat;
      st.jahrKat = id === 'alle' ? [] : (st.jahrKat.includes(id) ? st.jahrKat.filter(x => x !== id) : [...st.jahrKat, id]);
      if (st.jahrKat.length === KAT.length) st.jahrKat = [];
      render();
    });
    bindZustFilter(app, 'jma', () => st.jf.ma, v => st.jf.ma = v);
    bindAboFilter(app, 'jabo', st.jf);
    app.querySelectorAll('.seg[data-seg]').forEach(g => g.querySelectorAll('button').forEach(b => b.onclick = () => {
      st.jf.status = b.dataset.v; render();
    }));
    app.querySelectorAll('.plan .nm a[data-id]').forEach(el => el.onclick = () => go('detail', {kunde:+el.dataset.id, ktab:null}));
    const pw = app.querySelector('.plan-wrap');
    pw.scrollLeft = st.planScroll ?? Math.max(0, (KW_NOW-8)*35);
    const pop = app.querySelector('#pop');
    // Klick auf einen Einsatz öffnet das Seitenfenster (kein Mouse-over mehr, geht auch auf Touch)
    app.querySelectorAll('.job').forEach(b => b.onclick = () => {
      const key = jobKey(b.dataset.k, b.dataset.kat, b.dataset.kw);
      st.side = st.side === key ? null : key;
      st.planScroll = pw.scrollLeft; render();
    });
    // Jahr umschalten: gleiche Regeln, eigener Status pro Jahr
    app.querySelectorAll('[data-yr]').forEach(b => b.onclick = () => { st.year += +b.dataset.yr; st.side = null; st.planScroll = pw.scrollLeft; render(); });
    app.querySelectorAll('[data-vj]').forEach(b => b.onclick = () => { st.year = +b.dataset.vj; st.jf.status = 'offen'; st.side = null; st.planScroll = 0; render(); });
    // Klick in eine leere Woche: einmalige Zusatzarbeit erfassen
    app.querySelectorAll('.plan td.c.leer').forEach(td => td.onclick = () => {
      const key = `neu|${st.year}|${td.dataset.k}|${td.dataset.kw}`;
      if (st.side !== key) st.neu = null;
      st.side = st.side === key ? null : key; st.planScroll = pw.scrollLeft; render();
      document.getElementById('nt')?.focus();
    });
    if (st.side && st.side.startsWith('neu|')){
      const sp = app.querySelector('.sidepanel');
      const [, y, kid, kw] = st.side.split('|');
      const close = () => { st.side = null; st.planScroll = pw.scrollLeft; render(); };
      sp.querySelector('#sdx').onclick = close;
      sp.querySelector('#nab').onclick = close;
      sp.querySelector('#nk').onchange = e => { st.neu.kat = e.target.value; st.planScroll = pw.scrollLeft; render(); };
      sp.querySelectorAll('[data-nart]').forEach(b => b.onclick = () => { st.neu.art = b.dataset.nart; st.planScroll = pw.scrollLeft; render(); });
      sp.querySelector('#nadd').onclick = () => {
        const katId = st.neu.kat, kat = katById(katId), d = KUNDEN.find(x => x.id === +kid).kats[katId];
        if (sp.querySelector('#ns')){
          const i = +sp.querySelector('#ns').value;
          d.an = [...d.an, i];
          if (+kw !== kat.arb[i].kw) d.kw[i] = +kw; else delete d.kw[i];
        } else {
          const nt = sp.querySelector('#nt'), t = nt.value.trim();
          if (!t){ nt.focus(); nt.classList.add('err'); return; }
          d.zusatz.push({t, b: sp.querySelector('#nb').value, kw: +kw});
        }
        st.neu = null; st.side = jobKey(+kid, katId, +kw, +y); st.planScroll = pw.scrollLeft; render();
      };
    }
    const side = st.side && !st.side.startsWith('neu|') ? app.querySelector('.sidepanel') : null;
    if (side){
      side.querySelector('#sdx').onclick = () => { st.side = null; st.planScroll = pw.scrollLeft; render(); };
      side.querySelectorAll('[data-sdt]').forEach(b => b.onclick = () => { st.sideTab = b.dataset.sdt; st.planScroll = pw.scrollLeft; render(); });
      side.querySelectorAll('[data-st]').forEach(s => s.onclick = () => {
        if (s.dataset.st === 'erledigt') st.done.add(st.side); else st.done.delete(st.side);
        st.planScroll = pw.scrollLeft; render();
      });
    }
    let hideT = null, cur = null;
    const hide = () => { hideT = setTimeout(() => { pop.hidden = true; cur = null; }, 220); };
    // Mouse-over auf dem Kundennamen: Adresse und Telefon
    const showKunde = a => {
      clearTimeout(hideT);
      if (cur === a && !pop.hidden) return;
      cur = a;
      const k = KUNDEN.find(x => x.id === +a.dataset.id);
      pop.innerHTML = `
        <div class="pop-h"><strong>${esc(k.name)}</strong></div>
        <div class="pk-row">${ICON('pin')}<span>${esc(k.adr)}<br>${esc(k.ort)}</span></div>
        <div class="pk-row">${ICON('phone')}<a class="tabnum" href="tel:${k.tel.replace(/\s/g,'')}">${esc(k.tel)}</a>
          <button class="icon-btn" id="pkcopy" title="Nummer kopieren" aria-label="Nummer kopieren">${ICON('copy')}</button></div>
        ${k.notiz ? `<div class="muted small">${esc(k.notiz)}</div>` : ''}`;
      pop.hidden = false;
      const r = a.getBoundingClientRect();
      pop.style.left = Math.max(8, r.left) + 'px';
      let y = r.bottom + 6; if (y + pop.offsetHeight > innerHeight - 8) y = r.top - pop.offsetHeight - 6;
      pop.style.top = y + 'px';
      pop.querySelector('#pkcopy').onclick = async e => {
        const b = e.currentTarget;
        try { await navigator.clipboard.writeText(k.tel); b.title = 'Kopiert'; b.classList.add('ok'); }
        catch { const s = getSelection(), rg = document.createRange(); rg.selectNodeContents(pop.querySelector('a.tabnum')); s.removeAllRanges(); s.addRange(rg); }
      };
    };
    app.querySelectorAll('.plan .nm a[data-id]').forEach(a => {
      a.addEventListener('mouseenter', () => showKunde(a));
      a.addEventListener('mouseleave', hide);
      a.addEventListener('focus', () => showKunde(a));
    });
    pop.addEventListener('mouseenter', () => clearTimeout(hideT));
    pop.addEventListener('mouseleave', hide);
    pw.addEventListener('scroll', () => { pop.hidden = true; cur = null; });
  },
  handy(app){
    const m = st.m, scr = app.querySelector('#pscreen');
    const re = keep => { const y = scr.scrollTop, wy = window.scrollY; render(); if (keep){ document.getElementById('pscreen').scrollTop = y; window.scrollTo(0, wy); } };
    app.querySelectorAll('[data-mtab]').forEach(b => b.onclick = () => { m.tab = b.dataset.mtab; m.kunde = null; m.kw = null; re(); });
    const mk = app.querySelector('#mkat'); if (mk) mk.onchange = () => { m.kat = mk.value; re(true); };
    const mm = app.querySelector('#mma'); if (mm) mm.onchange = () => { m.ma = mm.value; re(true); };
    app.querySelectorAll('[data-ma]').forEach(b => b.onclick = () => {
      const a = b.dataset.ma; m.abo = m.abo.includes(a) ? m.abo.filter(x => x !== a) : [...m.abo, a];
      if (m.abo.length === ABO.length) m.abo = []; re(true);
    });
    app.querySelectorAll('[data-ms]').forEach(b => b.onclick = () => {
      const s = b.dataset.ms; m.status = m.status.includes(s) ? m.status.filter(x => x !== s) : [...m.status, s];
      if (m.status.length === 2) m.status = []; re(true);
    });
    const toggle = (kid, katId, kw) => { const key = jobKey(kid, katId, kw); if (st.done.has(key)) st.done.delete(key); else st.done.add(key); };
    app.querySelectorAll('[data-mdone]').forEach(b => b.onclick = () => { const [k, c, w] = b.dataset.mdone.split('|'); toggle(+k, c, +w); re(true); });
    app.querySelectorAll('[data-mopen]').forEach(b => b.onclick = () => { const [k, c, w] = b.dataset.mopen.split('|'); m.kunde = +k; m.ktab = c; m.kw = +w; m.anlEdit = false; re(); });
    // Fotos: Kamera bzw. Datei, wird beim Kunden in der Kategorie gespeichert
    app.querySelectorAll('[data-mfoto]').forEach(inp => inp.onchange = () => {
      const [k, c] = inp.dataset.mfoto.split('|'), kd = KUNDEN.find(x => x.id === +k);
      [...inp.files].forEach(f => { const r = new FileReader(); r.onload = () => { const t = new Date(); kd.fotos.push({n: '', url: r.result, datum: `${t.getDate()}.${t.getMonth()+1}.${t.getFullYear()}`, kats: [c]}); re(true); }; r.readAsDataURL(f); });
    });
    // Kunden-Reiter
    const q = app.querySelector('#mkq');
    if (q) q.oninput = () => { const p = q.selectionStart; m.kq = q.value; re(true); const n = document.getElementById('mkq'); n.focus(); n.setSelectionRange(p,p); };
    app.querySelectorAll('[data-mkunde]').forEach(b => b.onclick = () => { m.kunde = +b.dataset.mkunde; m.ktab = null; m.kw = null; m.anlEdit = false; re(); });
    const back = app.querySelector('#mback'); if (back) back.onclick = () => { m.kunde = null; m.kw = null; m.anlEdit = false; re(); };
    app.querySelectorAll('[data-mkt]').forEach(b => b.onclick = () => { m.ktab = b.dataset.mkt; m.kw = null; m.anlEdit = false; re(true); });
    app.querySelectorAll('[data-mwk]').forEach(b => b.onclick = () => { m.kw = +b.dataset.mwk; re(true); });
    app.querySelectorAll('[data-mbig]').forEach(b => b.onclick = () => { m.kw = +b.dataset.mbig; toggle(m.kunde, m.ktab, m.kw); re(true); });
    const za = app.querySelector('#mzadd');
    if (za) za.onclick = () => { m.zneu = true; re(true); document.getElementById('mzt')?.focus(); };
    const zok = app.querySelector('#mzok');
    if (zok) zok.onclick = () => {
      const t = app.querySelector('#mzt').value.trim(); if (!t){ app.querySelector('#mzt').classList.add('err'); return; }
      const kw = +app.querySelector('[data-mbig]').dataset.mbig, d = KUNDEN.find(x => x.id === m.kunde).kats[m.ktab];
      d.zusatz.push({t, b: app.querySelector('#mzb').value, kw}); m.kw = kw; m.zneu = false; re(true);
    };
    const zab = app.querySelector('#mzab'); if (zab) zab.onclick = () => { m.zneu = false; re(true); };
    // Anlagedaten: erst lesen, «Bearbeiten» schaltet die Felder frei, «Speichern» übernimmt alles auf einmal
    if (m.kunde){
      const d = KUNDEN.find(x => x.id === m.kunde).kats[m.ktab], kat = katById(m.ktab);
      if (m.anlEdit) bindTab(app, d, kat);
      const ed = app.querySelector('#manled'); if (ed) ed.onclick = () => { m.anlEdit = true; re(true); };
      const ab = app.querySelector('#manlab'); if (ab) ab.onclick = () => { m.anlEdit = false; re(true); };
      const ok = app.querySelector('#manlok');
      if (ok) ok.onclick = () => {
        kat.felder.forEach((f, ix) => {
          if (f.t === 'fotos') return;
          if (f.t === 'janein'){
            const g = app.querySelectorAll('.md-anl .yn')[kat.felder.filter((x, j) => j < ix && x.t === 'janein').length];
            const p = g && g.querySelector('[aria-pressed="true"]'); if (p) d.w[f.n] = p.textContent === 'Ja' ? 'ja' : 'nein';
            return;
          }
          const el = app.querySelector(`#f-m${kat.id}-${f.n.replace(/\W+/g,'')}`); if (el) d.w[f.n] = el.value;
        });
        m.anlEdit = false; re(true);
      };
      app.querySelectorAll('.md-anl .yn').forEach(g => g.querySelectorAll('button').forEach(b => b.onclick = () => g.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x===b)))));
      app.querySelectorAll('.md-anl textarea.autogrow').forEach(t => { const fit = () => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; }; t.addEventListener('input', fit); fit(); });
    }
  },
  detail(app){
    app.querySelector('#back').onclick = () => go('kunden');
    // Notiz-Felder wachsen mit dem Text mit (mindestens 3 Zeilen)
    app.querySelectorAll('textarea.autogrow').forEach(t => {
      const fit = () => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; };
      t.addEventListener('input', fit); fit();
    });
    app.querySelectorAll('.ktabs [data-t]').forEach(b => b.onclick = () => { st.ktab = b.dataset.t; st.kwAsk = null; st.zinfo = null; render(); });
    const k = KUNDEN.find(x => x.id === st.kunde);
    app.querySelectorAll('[data-dabo]').forEach(b => b.onclick = () => { k.abo = b.dataset.dabo; keepRender(); });
    const dn = app.querySelector('#dn'); if (dn) dn.oninput = () => { k.notiz = dn.value; };
    bindAngebote(app, k, st.ktab ? katById(st.ktab) : null);
    if (st.ktab) bindFotos(app, k, katById(st.ktab));
    const ak = app.querySelector('#addkat');
    if (ak) ak.onchange = e => {
      const kat = katById(e.target.value);
      k.kats[kat.id] = {w:{}, an:kat.arb.map((_,i)=>i), kw:{}, fotos:[], zust:[], zusatz:[]};
      st.ktab = kat.id; render();
    };
    app.querySelectorAll('.yr').forEach(b => b.onclick = () => {
      const y = +b.dataset.y; st.auJahre = st.auJahre.includes(y) ? st.auJahre.filter(x=>x!==y) : [...st.auJahre, y]; render();
    });
    const aun = app.querySelector('#aunur'); if (aun) aun.onchange = e => { st.auNurKat = e.target.checked; render(); };
    const d = k.kats[st.ktab];
    if (!d) return;
    bindTab(app, d, katById(st.ktab));
    bindZust(app.querySelector('.zust'), d, render);
    app.querySelectorAll('.yn').forEach(g => g.querySelectorAll('button').forEach(b => b.onclick = () => g.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x===b)))));
    if (app.querySelector('#zbg')){
      const close = () => { st.zinfo = null; render(); };
      app.querySelector('#zx').onclick = close;
      app.querySelector('#zbg').onclick = e => { if (e.target.id === 'zbg') close(); };
      bindRh(app, 'zrh');
      app.querySelector('#zsave').onclick = () => { const z = d.zusatz[st.zinfo]; z.b = app.querySelector('#ztext').value; z.rh = rhRead(app, 'zrh'); close(); };
    }
    app.querySelectorAll('[data-srm]').forEach(b => b.onclick = () => {
      const i = +b.dataset.srm; d.an = d.an.filter(x => x !== i); delete d.kw[i]; render();
    });
    const sp = app.querySelector('#spick');
    if (sp){
      sp.addEventListener('toggle', () => { st.msfOpen = sp.open ? 'spick' : (st.msfOpen === 'spick' ? null : st.msfOpen); if (sp.open) sp.querySelector('#sq').focus(); });
      const sq = sp.querySelector('#sq');
      sq.oninput = () => { const p = sq.selectionStart; st.sq = sq.value; st.msfOpen = 'spick'; render(); const n = document.getElementById('sq'); n.focus(); n.setSelectionRange(p,p); };
      sp.querySelectorAll('[data-sadd]').forEach(b => b.onclick = () => { d.an = [...d.an, +b.dataset.sadd]; st.sq = ''; st.msfOpen = null; render(); });
    }
    // Standardwoche übersteuern nur mit Rückfrage
    const kat = katById(st.ktab);
    app.querySelectorAll('.kwin').forEach(inp => inp.onchange = () => {
      const i = +inp.dataset.i, v = +inp.value;
      if (!v) return render();
      if (v === kat.arb[i].kw){ delete d.kw[i]; st.kwAsk = null; }
      else st.kwAsk = {kat:st.ktab, i, v};
      render();
    });
    app.querySelectorAll('[data-ask]').forEach(b => b.onclick = () => {
      if (b.dataset.ask === 'ja') d.kw[st.kwAsk.i] = st.kwAsk.v;
      st.kwAsk = null; render();
    });
    app.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => { delete d.kw[+b.dataset.reset]; render(); });
    // Zusatzarbeiten
    app.querySelectorAll('.zrow').forEach(row => {
      const z = d.zusatz[+row.dataset.i];
      row.querySelector('.zt').oninput = e => z.t = e.target.value;
      row.querySelector('[data-zinfo]').onclick = () => { st.zinfo = +row.dataset.i; render(); app.querySelector('#ztext')?.focus(); };
      row.querySelector('.zk').onchange = e => z.kw = +e.target.value;
      row.querySelector('.zrm').onclick = () => { d.zusatz.splice(+row.dataset.i, 1); render(); };
    });
    app.querySelector('#addz').onclick = () => {
      d.zusatz.push({t:'', b:'', kw:KW_NOW}); const j = d.zusatz.length - 1; render();
      document.querySelector(`.zrow[data-i="${j}"] .zt`)?.focus();
    };
    const drop = app.querySelector('#drop'), file = app.querySelector('#file'), ph = app.querySelector('#photos');
    if (drop){
      const add = files => [...files].filter(f => f.type.startsWith('image/')).forEach(f => {
        const r = new FileReader(); r.onload = () => { d.fotos.push({n: f.name, url: r.result}); render(); }; r.readAsDataURL(f);
      });
      ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
      ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
      drop.addEventListener('drop', e => add(e.dataTransfer.files));
      file.onchange = () => add(file.files);
    }
  },
  set(app){
    app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { st.setKat = b.dataset.s; render(); });
    const kat = katById(st.setKat);
    // Feldtyp wechseln: Rückfrage, wenn Kunden schon Werte haben; Optionen bleiben im Hintergrund erhalten
    const setTyp = (i, v) => { kat.felder[i].t = v; };
    app.querySelectorAll('.funit').forEach(sel => sel.onchange = () => { kat.felder[+sel.dataset.i].e = sel.value; });
    app.querySelectorAll('.ftyp').forEach(sel => sel.onchange = () => {
      const i = +sel.dataset.i, n = wertCount(kat.id, kat.felder[i]);
      if (n) st.typAsk = {kat:kat.id, i, v:sel.value, n}; else setTyp(i, sel.value);
      render();
    });
    app.querySelectorAll('[data-typ]').forEach(b => b.onclick = () => {
      if (b.dataset.typ === 'ja') setTyp(st.typAsk.i, st.typAsk.v);
      st.typAsk = null; render();
    });
    app.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => { st.opt = b.dataset.opt; st.optDraft = [...(optZiel(st.opt).o || [])]; render(); });
    if (st.opt){
      const close = () => { st.opt = null; render(); };
      app.querySelector('#ox').onclick = close;
      app.querySelectorAll('.oin').forEach(inp => inp.oninput = () => { st.optDraft[+inp.dataset.j] = inp.value; });
      app.querySelectorAll('.orm').forEach(b => b.onclick = () => { st.optDraft.splice(+b.dataset.j, 1); render(); });
      app.querySelector('#oadd').onclick = () => { st.optDraft.push(''); render(); const all = document.querySelectorAll('.oin'); all[all.length-1]?.focus(); };
      app.querySelector('#obg').onclick = e => { if (e.target.id === 'obg') close(); };
      app.querySelector('#osave').onclick = () => {
        const [kid, i] = st.opt.split('|');
        optZiel(st.opt).o = st.optDraft.map(s => s.trim()).filter(Boolean);
        close();
      };
    }
    app.querySelectorAll('.swatch').forEach(b => b.onclick = () => { katById(st.setKat).c = b.dataset.c; render(); });
    bindDrag(app, kat);
    // Tabelle der Kategorie: Name, Spalten (Name, Typ, Einheit, Optionen), Spalten hinzufügen/entfernen
    const tabn = app.querySelector('#tabn');
    if (tabn) tabn.onchange = () => { const alt = kat.tab.n, neu = tabn.value.trim() || alt; if (neu === alt) return;
      KUNDEN.forEach(k => { const d = k.kats[kat.id]; if (d && d.w[alt] !== undefined){ d.w[neu] = d.w[alt]; delete d.w[alt]; } }); kat.tab.n = neu; };
    app.querySelectorAll('[data-spn]').forEach(el => el.oninput = () => { kat.tab.sp[+el.dataset.spn].n = el.value; });
    app.querySelectorAll('[data-spt]').forEach(el => el.onchange = () => { kat.tab.sp[+el.dataset.spt].t = el.value; render(); });
    app.querySelectorAll('[data-spe]').forEach(el => el.onchange = () => { kat.tab.sp[+el.dataset.spe].e = el.value; });
    const tabRows = fn => KUNDEN.forEach(k => { const d = k.kats[kat.id]; if (d && d.w[kat.tab.n]) d.w[kat.tab.n].rows.forEach(fn); });
    app.querySelectorAll('[data-sprm]').forEach(b => b.onclick = () => { const j = +b.dataset.sprm; kat.tab.sp.splice(j, 1); tabRows(r => r.splice(j, 1)); render(); });
    const sa = app.querySelector('#spadd2'); if (sa) sa.onclick = () => { kat.tab.sp.push({n:'', t:'text'}); render(); const l = document.querySelectorAll('[data-spn]'); l[l.length-1]?.focus(); };
    const tn = app.querySelector('#tabneu'); if (tn) tn.onclick = () => { kat.tab = {n:'Tabelle', t:'tabelle', sp:[{n:'', t:'text'}]}; render(); document.getElementById('tabn')?.select(); };
    const tr = app.querySelector('#tabrm'); if (tr) tr.onclick = () => { if (!st.tabRmAsk){ st.tabRmAsk = true; render(); return; } delete kat.tab; st.tabRmAsk = false; render(); };
    const cc = app.querySelector('#cc'); if (cc) cc.onchange = () => { katById(st.setKat).c = cc.value.toUpperCase(); render(); };
    const af = app.querySelector('#addf');
    if (af) af.onclick = () => { katById(st.setKat).felder.push({n:'Neues Feld', t:'text'}); render(); };
  }
};
document.querySelectorAll('.nav button').forEach(b => b.onclick = () => go(b.dataset.view));
render();
</script>
