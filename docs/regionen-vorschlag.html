<!doctype html>
<html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regionen Vorschlag</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root{--p:#323e4e;--bg:#f5f7f9;--m:#8b9097;--line:#dde1e6;}
*{box-sizing:border-box}
body{margin:0;font:13px/1.4 system-ui,Segoe UI,Arial,sans-serif;color:var(--p);background:var(--bg);display:grid;grid-template-columns:400px 1fr;height:100vh;}
aside{overflow:auto;border-right:1px solid var(--line);background:#fff;padding:14px 14px 30px;}
#map{height:100vh;}
h1{font-size:17px;margin:0 0 2px}
.muted{color:var(--m);font-size:12px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--m);margin:18px 0 6px}
.reg{border:1px solid var(--line);border-radius:9px;padding:7px 9px;margin-bottom:6px;cursor:pointer}
.reg:hover,.reg.an{border-color:var(--p)}
.reg .t{display:flex;align-items:center;gap:8px;font-weight:700}
.reg .t .n{margin-left:auto;font-weight:400;color:var(--m);font-size:12px;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.25)}
.plz{font-size:11.5px;color:#4a5567;margin-top:4px;line-height:1.5}
.plz b{color:var(--p)}
.hint{font-size:11.5px;color:#5c4a00;background:#f3f6d0;border-radius:6px;padding:4px 7px;margin-top:5px}
.warn li{margin-bottom:3px}
ul{padding-left:18px;margin:4px 0}
.lbl{background:none;border:none;box-shadow:none;font-weight:700;font-size:10px;color:#fff;text-shadow:0 0 2px rgba(0,0,0,.8);padding:0}
.leaflet-tooltip.lbl:before{display:none}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.tools label{font-size:12px;display:flex;gap:4px;align-items:center}
@media (max-width:800px){body{grid-template-columns:1fr;height:auto}#map{height:55vh;order:-1}aside{border:none}}
</style></head><body>

  const pts = ORTE.filter(o => o.r === r.id).map(o => [o[4], o[5]]);
  if(pts.length >= 3) hullLayer[r.id] = L.polygon(hull(pts), { color:r.f, weight:1.5, fillOpacity:.13 }).bindTooltip(r.n, { sticky:true }).addTo(lgHull);
  else if(pts.length) hullLayer[r.id] = L.circle(pts[0], { radius:1500, color:r.f, weight:1.5, fillOpacity:.13 }).bindTooltip(r.n, { sticky:true }).addTo(lgHull);
});
ORTE.forEach(o => { if(o.r) L.circleMarker([o[4], o[5]], { radius:2.5, stroke:false, fillColor:RM[o.r].f, fillOpacity:.95 }).bindTooltip(`${o[0]} ${o[1]} (${o[2]}) → ${RM[o.r].n}`).addTo(lgOrte); });
Object.values(PLZ).filter(p => p.k).sort((a, b) => b.k - a.k).forEach(p => {
  const f = p.r ? RM[p.r].f : '#bbb';
  L.circleMarker([p.lat, p.lon], { radius:6 + Math.sqrt(p.k) * 3, color:p.r ? '#323e4e' : '#d00', weight:p.r ? 1 : 3, fillColor:f, fillOpacity:.9 })
    .bindTooltip(`<b>${p.plz} ${p.orte.map(o => o[1]).join(', ')}</b><br>${p.k} Kunden/Objekte<br>${p.r ? RM[p.r].n : '<b style="color:#d00">keine Region</b>'}`).addTo(lgK);
  L.marker([p.lat, p.lon], { interactive:false, icon:L.divIcon({ className:'lbl', html:String(p.k), iconSize:[20, 12] }) }).addTo(lgK);
});
cbHull.onchange = () => cbHull.checked ? map.addLayer(lgHull) : map.removeLayer(lgHull);
cbOrte.onchange = () => cbOrte.checked ? map.addLayer(lgOrte) : map.removeLayer(lgOrte);
cbLeer.onchange = seite;

function seite(){
  const kundenPlz = Object.values(PLZ).filter(p => p.k);
  const ohne = kundenPlz.filter(p => !p.r);
  const fremd = Object.keys(KUNDEN).filter(z => !PLZ[z]);
  const konflikt = kundenPlz.filter(p => p.regionen.length > 1);
  const total = Object.values(KUNDEN).reduce((s, n) => s + n, 0);
  let h = `<h2>${R.length} Regionen · ${total} Kunden/Objekte mit PLZ</h2>`;
  R.forEach(r => {
    const ps = Object.values(PLZ).filter(p => p.r === r.id).sort((a, b) => a.plz - b.plz);
    const k = ps.reduce((s, p) => s + p.k, 0), mitK = ps.filter(p => p.k);
    const zeige = cbLeer.checked ? ps : mitK;
    h += `<div class="reg" data-r="${r.id}"><div class="t"><span class="dot" style="background:${r.f}"></span>${r.n}<span class="n">${k} · ${ps.length} PLZ</span></div>
      <div class="plz">${zeige.map(p => p.k ? `<b>${p.plz} ${p.orte[0][1]} (${p.k})</b>` : `${p.plz} ${p.orte[0][1]}`).join(', ') || '<span class="muted">noch keine Kunden</span>'}${!cbLeer.checked && ps.length > mitK.length ? ` <span class="muted">+ ${ps.length - mitK.length} PLZ ohne Kunden</span>` : ''}</div>
      ${r.hint ? `<div class="hint">${r.hint}</div>` : ''}</div>`;
  });
  h += `<h2>Kunden-PLZ ohne Region</h2><ul class="warn">${[...ohne.map(p => `<li>${p.plz} ${p.orte.map(o => o[1] + ' (' + o[2] + ')').join(', ')} – ${p.k}</li>`), ...fremd.map(z => `<li>${z} – ${KUNDEN[z]} (ausserhalb Kartenausschnitt)</li>`)].join('') || '<li>keine</li>'}</ul>`;
  h += `<h2>PLZ mit Ortschaften in verschiedenen Regionen</h2><ul class="warn">${konflikt.map(p => `<li><b>${p.plz}</b> (${p.k}) → ${RM[p.r].n}<br><span class="muted">${p.orte.map(o => o[1] + ': ' + (o.r ? RM[o.r].n : '–')).join(' · ')}</span></li>`).join('') || '<li>keine</li>'}</ul>`;
  if(nichtGefunden.length) h += `<h2>Gemeinden nicht gefunden</h2><div class="muted">${nichtGefunden.join(', ')}</div>`;
  side.innerHTML = h;
  side.querySelectorAll('.reg').forEach(el => el.onclick = () => {
    side.querySelectorAll('.reg').forEach(x => x.classList.toggle('an', x === el));
    const hl = hullLayer[el.dataset.r]; if(hl) map.fitBounds(hl.getBounds(), { padding:[30, 30], maxZoom:12 });
  });
}
seite();
</script></body></html>
