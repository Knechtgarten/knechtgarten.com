<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=28"></script>
<title>Volumen – Werkzeuge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#323E4E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kg-werkzeuge.js?v=5"></script>
<style>
.teil-kopf{display:flex;align-items:center;gap:8px;}
.teil-kopf .kgw-text{flex:1;font-weight:600;}
.teil-kopf .vol{font-weight:700;color:#323E4E;white-space:nowrap;}
.teil-masse{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
.teil-masse label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:#6B7079;}
.teil-masse .kgw-zahl{width:100%;}
.neu{all:unset;box-sizing:border-box;cursor:pointer;height:48px;border:1px dashed #A3B0BE;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;color:#323E4E;}
.summe{position:sticky;bottom:0;margin:0 -12px -32px;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:#323E4E;color:#fff;display:flex;align-items:baseline;gap:8px;}
.summe span{flex:1;font-size:13px;font-weight:600;color:#D6E7F4;}
.summe b{font-size:30px;}
</style>
</head>
<body>
<header class="app"><div class="wrap">
  <a class="backlink" href="index.html">Startseite</a>
  <div class="brand"><h1>Werkzeuge</h1></div>
  <span class="userbar hidden" id="userbar"><span id="userbarText"></span><button id="logoutBtn">Abmelden</button></span>
</div></header>
<main id="appMain"></main>
<script>
// Volumen aus mehreren Teilen: Länge × Breite × Höhe × Anzahl pro Teil, Total unten. Teile bleiben auf diesem Gerät gespeichert.
KGW.werkzeug('allg_volumen', inhalt => {
  const $ = id => document.getElementById(id), LS = 'kgw-vol-teile';
  let teile = KGW.lsGet(LS, null) || [{ id: 1, name: 'Teil 1', l: '', b: '', h: '', n: '1' }];
  inhalt.insertAdjacentHTML('beforeend', `<div class="kgw-stapel" id="teile"></div>
    <button type="button" class="neu" id="neu">${KGW.svg(KG.pfad('plus'), 16)}Teil hinzufügen</button>
    <div class="summe"><span id="anzahl"></span><b id="total"></b>m³</div>`);
  const vol = t => KGW.num(t.l) * KGW.num(t.b) * KGW.num(t.h) * KGW.num(t.n);
  const summe = () => {
    teile.forEach(t => { const el = document.querySelector(`[data-vol="${t.id}"]`); if(el) el.textContent = KGW.fmt(vol(t), 2) + ' m³'; });
    $('total').textContent = KGW.fmt(teile.reduce((a, t) => a + vol(t), 0), 2);
    $('anzahl').textContent = `Total ${teile.length} ${teile.length === 1 ? 'Teil' : 'Teile'}`;
    KGW.lsSet(LS, teile);
  };
  const zeichnen = () => {
    $('teile').innerHTML = teile.map(t => `<section class="kgw-karte"><div class="kgw-body">
      <div class="teil-kopf"><input class="kgw-text" data-id="${t.id}" data-k="name" value="${KGW.esc(t.name)}" aria-label="Name des Teils" autocomplete="off">
        <span class="vol" data-vol="${t.id}"></span>
        <button type="button" class="kg-ibtn danger" data-weg="${t.id}" aria-label="Teil löschen" title="Teil löschen">${KG.icon('trash', 14)}</button></div>
      <div class="teil-masse">${[['l', 'Länge m'], ['b', 'Breite m'], ['h', 'Höhe m'], ['n', 'Anzahl']].map(([k, n]) =>
        `<label>${n}<input class="kgw-zahl" inputmode="decimal" autocomplete="off" data-id="${t.id}" data-k="${k}" value="${KGW.esc(t[k])}"></label>`).join('')}</div>
    </div></section>`).join('');
    $('teile').querySelectorAll('input').forEach(i => i.addEventListener('input', () => {
      const t = teile.find(x => x.id === +i.dataset.id); t[i.dataset.k] = i.value; summe();
    }));
    $('teile').querySelectorAll('[data-weg]').forEach(b => b.addEventListener('click', () => {
      const t = teile.find(x => x.id === +b.dataset.weg);
      if(!confirm(`«${t.name || 'Teil'}» löschen?`)) return;
      teile = teile.filter(x => x !== t); zeichnen();
    }));
    summe();
  };
  $('neu').addEventListener('click', () => {
    const id = Math.max(0, ...teile.map(t => t.id)) + 1;
    teile.push({ id, name: 'Teil ' + (teile.length + 1), l: '', b: '', h: '', n: '1' }); zeichnen();
    const f = document.querySelector(`[data-id="${id}"][data-k="l"]`); if(f) f.focus();
  });
  zeichnen();
});
</script>
</body>
</html>
