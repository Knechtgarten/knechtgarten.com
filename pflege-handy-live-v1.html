<title>Pflege &amp; Service</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#323E4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#F5F7F9; --card:#FFFFFF; --primary:#323E4E; --primary-l:#4C5C70;
  --ink:#232B35; --muted:#8B9097; --line:#E1E5E9; --soft:#EEF3F7;
  --accent-blue:#D6E7F4; --accent-lime:#D1DB5F; --danger:#B4655F;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);line-height:1.4;font-size:15px;-webkit-tap-highlight-color:transparent;}
.hidden{display:none !important;}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.muted{color:var(--muted);} .small{font-size:12.5px;}
h2{font-size:22px;color:var(--primary);}
h3{font-size:14px;color:var(--primary);}
input[type=text],input[type=number],input[type=email],input[type=password],select,textarea{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);}

.mh{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(90px + env(safe-area-inset-bottom,0px));}
.mh-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.mh-title a{font-size:12.5px;color:var(--muted);text-decoration:none;}
.mh-filter{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.mh-filter select{padding:10px 8px;font-size:15px;}
.mh-icons{display:flex;justify-content:space-between;align-items:center;}
.abof{display:inline-flex;align-items:center;gap:4px;}
.abob{all:unset;cursor:pointer;border-radius:50%;padding:2px;display:inline-flex;border:2px solid transparent;}
.abob[aria-pressed="true"]{border-color:var(--primary);}
.abob.off{opacity:.3;}
.aboi{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;}
.aboi .i{width:15px;height:15px;}
.aboi.a1{background:#323E4E;color:#fff;} .aboi.a2{background:#D6E7F4;color:#323E4E;} .aboi.a3{border:1px solid #8B9097;color:#8B9097;}
.aboi.st-offen{border:1.5px solid #323E4E;background:#fff;}
.aboi.st-erledigt{background:#D1DB5F;color:#323E4E;}
.aboi.st-erledigt .i{stroke-width:2.2;}
.kdot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;border:1px solid rgba(50,62,78,.25);}
.kchip{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:5px;background:var(--kc);color:var(--kt);border:1px solid rgba(50,62,78,.18);white-space:nowrap;}

.mh-sec{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
.mh-sh{display:flex;justify-content:space-between;font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--muted);padding-bottom:4px;border-bottom:1px solid var(--line);}
.mh-sec.late .mh-sh{color:var(--danger);border-color:var(--danger);}
.mh-list{display:flex;flex-direction:column;gap:10px;}
.mh-leer{font-size:14px;color:var(--muted);text-align:center;padding:24px 10px;}
.mc{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.mc.done{opacity:.75;}
.mc-main{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:12px 14px 10px;width:100%;box-sizing:border-box;}
.mc-head{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.mc-n{font-weight:700;font-size:16px;color:var(--ink);}
.mc-o{font-size:13px;color:var(--muted);}
.mc-j{font-size:14px;margin-top:4px;}
.mc-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 14px 12px;}
.mc-done{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 18px;border-radius:22px;border:1px solid #323E4E;font-weight:700;font-size:14px;color:#323E4E;box-sizing:border-box;}
.mc-done .i{width:17px;height:17px;stroke-width:2.2;}
.mc-done.on{background:#D1DB5F;border-color:#D1DB5F;}
.mc-foto{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 16px;border-radius:22px;background:#323E4E;color:#fff;font-weight:700;font-size:14px;box-sizing:border-box;}
.mh-ic{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);color:var(--muted);background:#fff;flex:none;box-sizing:border-box;}
.mh-ic .i{width:17px;height:17px;}
.mc-act .mh-ic:first-of-type{margin-left:auto;}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:0 12px;color:var(--muted);}
.search input{border:0;padding:12px 0;}
.mh-klist{display:flex;flex-direction:column;gap:8px;}
.mk{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:10px;}
.mk-kats{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:3px;}
.kc{display:inline-flex;align-items:center;gap:4px;font-size:12px;}
.kc .kdot{width:7px;height:7px;}

.md-top{display:flex;align-items:center;gap:10px;}
.md-top .mh-ic{border-color:var(--primary);color:var(--primary);}
.md-mini{display:flex;flex-direction:column;gap:6px;font-size:14px;}
.md-mini a{display:inline-flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;}
.md-mini .i{color:var(--muted);width:16px;height:16px;}
.vm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;}
.vm-l{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--primary,#323E4E);margin-right:4px;}
.vm-l .i,.vk .i{width:16px;height:16px;}
.vk{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:18px;background:#D6E7F4;color:#323E4E;font-size:14px;font-weight:700;text-decoration:none;}
.hint{font-size:13px;color:var(--muted);background:var(--soft);border-radius:8px;padding:10px 12px;white-space:pre-wrap;}
.mh-ktabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;}
.mh-ktabs::-webkit-scrollbar{display:none;}
.mh-ktabs button{all:unset;cursor:pointer;flex:none;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:18px;border:1px solid var(--line);background:#fff;font-size:14px;}
.mh-ktabs button[aria-pressed="true"]{background:#323E4E;border-color:#323E4E;color:#fff;}
/* Objekte: Auswahl Hauptadresse / Objekt, Objektname gruen */
.mh-orte{margin-top:10px;}
.mh-orte button[aria-pressed="true"]{background:var(--accent-lime, #D1DB5F);border-color:var(--accent-lime, #D1DB5F);color:#323E4E;font-weight:700;}
.mc-ob{color:#6B7420;}
.mh-wk{display:flex;gap:6px;flex-wrap:wrap;}
.mh-wk button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:6px;border:1px solid var(--line);font-size:13px;background:#fff;}
.mh-wk button .i{width:13px;height:13px;stroke-width:2.2;}
.mh-wk button.ok{color:var(--muted);}
.mh-wk button.on{border-color:#323E4E;box-shadow:inset 0 0 0 1px #323E4E;font-weight:700;color:var(--ink);}
.big-done,.big-foto{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;height:48px;border-radius:10px;font-weight:700;font-size:16px;box-sizing:border-box;}
.big-done{border:2px solid #323E4E;color:#323E4E;background:#fff;}
.big-done.on{background:#D1DB5F;border-color:#D1DB5F;}
.big-done .i{width:20px;height:20px;stroke-width:2.2;}
.big-foto{background:#323E4E;color:#fff;margin-top:6px;}
.big-foto .i{width:22px;height:22px;}
.sd-sec{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
.md-arb{padding:8px 0;border-bottom:1px solid var(--line);}
.md-arb-h{display:flex;gap:8px;align-items:baseline;margin-bottom:4px;}
.sd-art{font-size:12px;color:var(--muted);}
.sd-n{font-size:15px;font-weight:600;}
.dlist{padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px;}
.sd-b{white-space:pre-wrap;font-size:14px;}
.sd-dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);border-top:1px solid var(--line);}
.sd-dl dt,.sd-dl dd{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;}
.sd-dl dt{color:var(--muted);}
.sd-dl dd{white-space:pre-wrap;}
.sd-dl .full{grid-column:1/-1;}
.sd-dl dt.full{border-bottom:0;padding-bottom:0;}
.sd-l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-right:8px;}
.sd-foot{padding-top:12px;border-top:1px solid var(--line);font-size:14px;}
.tabl-w{overflow-x:auto;border:1px solid var(--line);border-radius:8px;}
.tabl{width:100%;border-collapse:collapse;font-size:12.5px;}
.tabl th{font-size:10.5px;padding:6px;background:var(--soft);white-space:nowrap;text-align:left;color:var(--muted);}
.tabl td{padding:6px;border-bottom:1px solid var(--soft);white-space:nowrap;}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;}
.ph{all:unset;cursor:zoom-in;aspect-ratio:4/3;border-radius:6px;background:var(--soft);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);}
.ph img{width:100%;height:100%;object-fit:cover;display:block;}
.doks{display:flex;flex-direction:column;}
.dok{all:unset;cursor:pointer;display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--soft);font-size:14px;}
.dok .i{color:var(--danger);}
.dok small{display:block;color:var(--muted);font-size:12px;}
.field{display:flex;flex-direction:column;gap:4px;}
.field > label{font-size:12px;color:var(--muted);}
.fgrid{display:flex;flex-direction:column;gap:12px;}
.unit{display:flex;}
.unit input{border-top-right-radius:0;border-bottom-right-radius:0;}
.unit span{border:1px solid var(--line);border-left:0;padding:10px;background:var(--soft);color:var(--muted);border-radius:0 8px 8px 0;font-size:14px;white-space:nowrap;}
.yn{display:flex;}
.yn button{all:unset;cursor:pointer;flex:1;text-align:center;padding:10px;border:1px solid var(--line);background:#fff;}
.yn button:first-child{border-radius:8px 0 0 8px;}
.yn button:last-child{border-radius:0 8px 8px 0;border-left:0;}
.yn button[aria-pressed="true"]{background:var(--primary);color:#fff;border-color:var(--primary);}
.btn{border:none;border-radius:8px;padding:11px 16px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-ghost{background:#fff;color:var(--primary);border:1px solid var(--line);}
.row-end{display:flex;justify-content:flex-end;gap:8px;}

.mh-tabbar{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20;}
.mh-tabbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;font-size:12px;color:var(--muted);}
.mh-tabbar button .i{width:23px;height:23px;}
.mh-tabbar button[aria-current="true"]{color:var(--primary);font-weight:700;}

.lb{position:fixed;inset:0;z-index:80;background:rgba(20,25,32,.94);display:flex;align-items:center;justify-content:center;padding:56px 10px;}
.lb img{max-width:100%;max-height:100%;object-fit:contain;}
.lb .mh-ic{position:absolute;background:#fff;}
.lb .lb-x{top:calc(12px + env(safe-area-inset-top,0px));right:12px;}
.lb .lb-l{left:10px;top:50%;} .lb .lb-r{right:10px;top:50%;}
.lb .lb-cap{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-size:13px;}
.toastwrap{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;}
.toast{background:var(--primary);color:#fff;font-size:14px;padding:10px 16px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2);}
.toast.err{background:var(--danger);}
.loginwrap{min-height:90vh;display:flex;align-items:center;justify-content:center;padding:16px;}
.logincard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px 22px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;}
.logincard h2{font-size:18px;}
.status{font-size:13px;color:var(--muted);}
.status.err{color:var(--danger);}
/* Bewaesserungsplan (nur lesen), Ventile abwechselnd weiss/grau */
.bp-l{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:7px;overflow:hidden;font-size:12.5px;}
.bp-v{padding:5px 9px;display:grid;gap:1px;}
.bp-v:nth-child(even){background:#E3E8EE;}
.bp-m{display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums;}
.bp-m span:first-child{font-weight:600;min-width:86px;}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const $ = id => document.getElementById(id);
const SUPABASE_URL = 'https://oalapdxinqlnzwxhyuzy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_DoeD4uEnwemmnFu4AxE9uw_5lmQYc5P';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const I = id => `<svg class="i"><use href="#i-${id}"/></svg>`;
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(message, isErr){
  const t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : '');
  t.textContent = message;
  $('toastwrap').appendChild(t);
  setTimeout(() => t.remove(), isErr ? 5000 : 1800);
}
const friendlyError = e => e?.message || 'Unbekannter Fehler';

// ---------------------------------------------------------------------------
// Login: jede freigeschaltete Rolle (Techniker = Service-Team), Login bleibt gespeichert
// ---------------------------------------------------------------------------
let aktuelleUserId = null;
async function pruefeAnmeldung(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ $('loginwrap').classList.remove('hidden'); return; }
  aktuelleUserId = session.user.id;
  const { data: b } = await sb.from('benutzer').select('rolle,aktiv').eq('id', session.user.id).maybeSingle();
  if(!b?.rolle || b.aktiv === false){ $('pendingWrap').classList.remove('hidden'); return; }
  $('loginwrap').classList.add('hidden');
  $('appMain').classList.remove('hidden');
  await ladeAlles();
}
$('loginBtn').addEventListener('click', async () => {
  $('loginStatus').textContent = 'Melde an …'; $('loginStatus').className = 'status';
  const { error } = await sb.auth.signInWithPassword({ email: $('loginEmail').value.trim(), password: $('loginPassword').value });
  if(error){ $('loginStatus').textContent = 'Login fehlgeschlagen: ' + error.message; $('loginStatus').className = 'status err'; return; }
  await pruefeAnmeldung();
});
$('pendingLogoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

// ---------------------------------------------------------------------------
// Hilfen (gleiche Logik wie Jahresplan)

const ABO = [
  { id: 'ohne_voranmeldung', n: 'Abo ohne Voranmeldung', ic: 'repeat', cls: 'a1' },
  { id: 'mit_voranmeldung',  n: 'Abo mit Voranmeldung',  ic: 'finger', cls: 'a2' },
  { id: 'kein_abo',          n: 'Kein Abo (nur Daten)',  ic: 'minus',  cls: 'a3' }
];
const aboIcon = id => { const a = ABO.find(x => x.id === id) || ABO[2]; return `<span class="aboi ${a.cls}" aria-label="${a.n}" title="${a.n}">${I(a.ic)}</span>`; };
function isoKw(d = new Date()){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const tag = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - tag);
  const j0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return { jahr: t.getUTCFullYear(), kw: Math.ceil(((t - j0) / 86400000 + 1) / 7) };
}
const JETZT = isoKw(), NAECHSTE = isoKw(new Date(Date.now() + 7 * 86400000));
const wochenImJahr = y => isoKw(new Date(y, 11, 28)).kw;
function kwDatum(jahr, kw){
  const j4 = new Date(jahr, 0, 4), mo = new Date(j4); mo.setDate(j4.getDate() - ((j4.getDay() || 7) - 1) + (kw - 1) * 7);
  const so = new Date(mo); so.setDate(mo.getDate() + 6);
  const f = d => `${d.getDate()}.${d.getMonth() + 1}.`;
  return `${f(mo)}–${f(so)}`;
}
const nachReihe = (a, b) => (a.reihenfolge ?? 0) - (b.reihenfolge ?? 0);
function txtOn(hex){
  const n = parseInt(String(hex).slice(1), 16), r = n>>16, g = (n>>8)&255, b = n&255;
  return (0.299*r + 0.587*g + 0.114*b) / 255 > 0.6 ? '#323E4E' : '#FFFFFF';
}
const katStyle = k => `--kc:${esc(k.farbe)};--kt:${txtOn(k.farbe)}`;
const dot = k => `<span class="kdot" style="background:${esc(k.farbe)}"></span>`;
function zustName(id){
  const b = S.zust.find(x => x.id === id);
  if(!b) return 'Unbekannt';
  if(b.anzeigename) return b.anzeigename;
  return b.email.split('@')[0].split(/[._-]+/).filter(Boolean).map(s => s[0].toUpperCase() + s.slice(1)).join(' ');
}
// Voranmeldung: Knoepfe oeffnen direkt WhatsApp-Chat, Anruf oder neues Mail (nur Kanaele, die beim Kunden gewaehlt sind)
function voranmeldungHtml(k){
  if(k.abo_typ !== 'mit_voranmeldung') return '';
  const c = k.kunde?.kontaktdaten || {}, kan = k.voranmeldung_kanaele || [];
  const nr = s => String(s || '').match(/\+?\d[\d ]{7,}\d/)?.[0] || '';
  const handy = nr(c.mobil) || nr(c.telefon1) || nr(c.telefon2), tel = nr(c.telefon1) || nr(c.mobil) || nr(c.telefon2);
  const wa = handy.replace(/\D/g, '').replace(/^00/, '').replace(/^0/, '41'), mail = (c.emails || [])[0];
  const knopf = { whatsapp: wa && `<a class="vk" href="https://wa.me/${wa}" target="_blank" rel="noopener">${I('whatsapp')}WhatsApp</a>`,
    telefon: tel && `<a class="vk" href="tel:${esc(tel.replace(/\s+/g, ''))}">${I('phone')}Anrufen</a>`,
    mail: mail && `<a class="vk" href="mailto:${esc(mail)}">${I('mail')}Mail</a>` };
  const btn = kan.map(x => knopf[x]).filter(Boolean).join('');
  return `<div class="vm"><span class="vm-l">${I('finger')}Voranmeldung${kan.length ? '' : ' (Kanal offen)'}</span>${btn}</div>`;
}
const telVon = k => { const c = k.kunde?.kontaktdaten || {}; return c.telefon1 || c.mobil || c.telefon2 || ''; };
const adresse = ku => [ku.strasse, [ku.plz, ku.ort].filter(Boolean).join(' ')].filter(Boolean).join(', ');
const mapsLink = ku => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(adresse(ku));
// Route: oeffnet auf dem Handy direkt die Navigation in Google Maps (ohne API-Schluessel)

async function ladeAlles(){
  const r = await Promise.all([
    sb.from('pflege_kategorie').select('*').order('reihenfolge'),
    sb.from('pflege_feld').select('*'),
    sb.from('pflege_arbeit').select('*'),
    sb.from('pflege_tabelle').select('*'),
    sb.from('pflege_tabelle_spalte').select('*'),
    sb.rpc('pflege_zustaendige'),
    sb.from('pflege_kunde').select('*, kunde(id,name,strasse,plz,ort,kontaktdaten)'),
    sb.from('pflege_objekt').select('*'),
    sb.from('pflege_kunde_kategorie').select('*'),
    sb.from('pflege_kunde_kategorie_zustaendig').select('*'),
    sb.from('pflege_kunde_arbeit').select('*'),
    sb.from('pflege_einsatz_status').select('kunde_kategorie_id,jahr,kw'),
    sb.from('pflege_foto').select('*').order('aufgenommen_am', { ascending: false }),
    sb.from('pflege_foto_kategorie').select('*'),
    sb.from('pflege_dokument').select('*').order('datum', { ascending: false, nullsFirst: false }),
    sb.from('pflege_dokument_kategorie').select('*')
  ]);
  const fehler = r.find(x => x.error);
  if(fehler){ showToast(friendlyError(fehler.error), true); return; }
  let st;
  [S.kat, S.felder, S.arbeiten, S.tabellen, S.spalten, S.zust, S.kunden, S.obj, S.kk, S.kz, S.ka, st, S.fotos, S.fk, S.dok, S.dk] = r.map(x => x.data || []);
  S.status = new Set(st.map(s => statusKey(s.kunde_kategorie_id, s.jahr, s.kw)));
  S.kunden.sort((a, b) => (a.kunde?.name || '').localeCompare(b.kunde?.name || '', 'de'));
  // Techniker sieht standardmaessig die eigenen Einsaetze (wenn er bei «Pflegetool» angehakt ist)
  if(S.f.ma === null) S.f.ma = S.zust.some(b => b.id === aktuelleUserId && b.pflege_zustaendig) ? aktuelleUserId : '';
  render();
}

// Einsaetze (Kunde + Kategorie + KW) eines Jahres
function arbeitName(ka){ return ka.arbeit_id ? (S.arbeiten.find(a => a.id === ka.arbeit_id)?.name || '') : (ka.titel || 'Zusatzarbeit'); }
// Wochen einer Arbeit: Standard-Wochen der Kategorie +/- Abweichung beim Kunden, Zusatzarbeit = eigene Liste
function wochenVon(ka){
  if(!ka.arbeit_id) return [...(ka.kws || [])].sort((a, b) => a - b);
  const std = S.arbeiten.find(a => a.id === ka.arbeit_id)?.standard_kws || [], minus = ka.kws_minus || [];
  return [...new Set([...std.filter(w => !minus.includes(w)), ...(ka.kws_plus || [])])].sort((a, b) => a - b);
}
// Arbeiten einer Kunden-Kategorie im Jahr, als Liste { ka, kw } (eine Arbeit kann mehrere Wochen haben)
function jobsVonKk(kk, jahr){
  return S.ka.filter(x => x.kunde_kategorie_id === kk.id)
    .filter(ka => !(ka.arbeit_id && !S.arbeiten.some(a => a.id === ka.arbeit_id)) && !(ka.abgewaehlte_jahre || []).includes(jahr))
    .flatMap(ka => wochenVon(ka).filter(kw => kw <= wochenImJahr(jahr)).map(kw => ({ ka, kw })));
}
function einsaetze(jahr){
  const f = S.f, out = [];
  S.kunden.forEach(k => {
    if(f.abo.length && !f.abo.includes(k.abo_typ)) return;
    kkVonKunde(k.kunde_id).forEach(kk => {
      const kat = katById(kk.kategorie_id); if(!kat) return;
      if(f.kat && kat.id !== f.kat) return;
      const zust = zustVon(kk.id);
      if(f.ma === '-' ? zust.length : (f.ma && !zust.includes(f.ma))) return;
      const proKw = {};
      jobsVonKk(kk, jahr).forEach(j => (proKw[j.kw] = proKw[j.kw] || []).push(j.ka));
      Object.entries(proKw).forEach(([kw, jobs]) => {
        const done = erledigt(kk.id, jahr, +kw);
        if(f.status.length && !f.status.includes(done ? 'erledigt' : 'offen')) return;
        out.push({ k, o: objById(kk.objekt_id), kk, kat, jahr, kw: +kw, jobs, done, zust });
      });
    });
  });
  return out;
}

function renderFaellig(){

  const abschn = [
    ['Überfällig', jetzt.filter(c => c.kw < JETZT.kw && !c.done).sort((a, b) => a.kw - b.kw), true],
    [`Diese Woche · KW ${JETZT.kw}`, jetzt.filter(c => c.kw === JETZT.kw), false],
    [`Nächste Woche · KW ${NAECHSTE.kw}`, naechste.filter(c => c.kw === NAECHSTE.kw), false]
  ];
  $('app').innerHTML = `
    <div class="mh-title"><h2>Fällig</h2><span class="muted small">KW ${JETZT.kw} · ${kwDatum(JETZT.jahr, JETZT.kw)}</span></div>

// Bewaesserungsplan nur lesen: pro Ventil Name + Sensor, darunter je Muster eine Zeile
const BP_TAGE = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const bpTage = t => { const s = [...(t || [])].sort((a, b) => a - b); if(s.length === 7) return 'täglich'; if(s.length === 5 && s.every((x, i) => x === i)) return 'Mo–Fr'; return s.map(i => BP_TAGE[i]).join(' '); };
const BG_NAME = { rainbird: 'Rain Bird', hunter: 'Hunter', gardena: 'Gardena', claber: 'Claber', geka: 'GEKA' };
function bpLese(kk){
  const vl = kk.bewaesserung || [], bg = kk.bewaesserung_geraete || {};
  const geraete = Object.keys(BG_NAME).flatMap(sys => (bg[sys] || []).map(r => `<div class="bp-v"><div><b>${esc(r.name || BG_NAME[sys])}</b> <span class="muted small">· ${BG_NAME[sys]}</span></div>

  if(!vl.length && !geraete.length) return '<span class="muted">–</span>';
  return `<div class="bp-l">${geraete.join('')}${vl.map(v => `<div class="bp-v"><div><b>${esc(v.name)}</b>${v.sensor ? ` <span class="muted small">· ${esc(v.sensor)}</span>` : ''}</div>
    ${(v.muster || []).map(m => `<div class="bp-m"><span>${esc(m.von)}–${esc(m.bis)}</span><span>${bpTage(m.tage)}</span><span>${m.gw == null ? 'ohne Sensor' : m.gw + ' %'}</span>${m.zr ? `<span>${esc(m.zr)}</span>` : ''}</div>`).join('') || '<div class="muted small">Keine Zeiten hinterlegt</div>'}
    ${v.bem ? `<div class="muted small"><i>${esc(v.bem)}</i></div>` : ''}</div>`).join('')}</div>`;

function feldInput(f, val){
  const a = `data-feld="${f.id}"`;
  if(f.typ === 'auswahl'){ const o = [...(f.optionen || [])]; if(val && !o.includes(val)) o.push(val);
    return `<div class="field"><label>${esc(f.name)}</label><select ${a}><option value="">–</option>${o.map(x => `<option ${x === val ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>`; }
  if(f.typ === 'janein') return `<div class="field"><label>${esc(f.name)}</label><div class="yn" ${a} data-yn="${val || ''}">${['ja', 'nein'].map(v => `<button type="button" data-act="yn" data-v="${v}" aria-pressed="${val === v}">${v === 'ja' ? 'Ja' : 'Nein'}</button>`).join('')}</div></div>`;
  if(f.typ === 'zahl') return `<div class="field"><label>${esc(f.name)}</label>${f.einheit ? `<div class="unit"><input type="number" step="any" inputmode="decimal" ${a} value="${esc(val)}"><span>${esc(f.einheit)}</span></div>` : `<input type="number" step="any" inputmode="decimal" ${a} value="${esc(val)}">`}</div>`;
  if(f.typ === 'notiz') return `<div class="field"><label>${esc(f.name)}</label><textarea rows="3" ${a}>${esc(val)}</textarea></div>`;
  return `<div class="field"><label>${esc(f.name)}</label><input type="text" ${a} value="${esc(val)}"></div>`;
}

function renderKunde(r){
  const k = kundeById(r.kunde), ku = k.kunde || {}, tel = telVon(k), objs = objekteVon(k.kunde_id);
  // Hauptadresse oder Objekt; ohne Angabe die Hauptadresse, ausser nur Objekte haben Kategorien
  let o = objById(r.o);
  if(!r.o && !kkVonKunde(k.kunde_id, null).length) o = objs.find(x => kkVonKunde(k.kunde_id, x.id).length) || null;
  const kks = kkVonKunde(k.kunde_id, o ? o.id : null), adr = o || ku;
  const kk = kks.find(x => x.kategorie_id === r.kat) || kks[0];
  aktObjekt = o ? o.id : null; aktKkId = kk?.id || null;
  const kopf = `
    <div class="md-top"><button class="mh-ic" data-act="zurueck" aria-label="Zurück">${I('back')}</button><h2>${esc(ku.name)}</h2></div>
    ${objs.length ? `<div class="mh-ktabs mh-orte">${[null, ...objs].map(x => `<button data-act="ort" data-o="${x ? x.id : ''}" aria-pressed="${(x ? x.id : null) === (o ? o.id : null)}">${x ? esc(objektName(x)) : 'Hauptadresse'}</button>`).join('')}</div>` : ''}
    <div class="md-mini">
      <a href="${mapsLink(adr)}" target="_blank" rel="noopener">${I('pin')}${esc(adresse(adr))}</a>
      <a href="${routeLink(adr)}" target="_blank" rel="noopener">${I('next')}Route</a>
      ${tel ? `<a href="tel:${esc(tel.replace(/\s+/g, ''))}">${I('phone')}${esc(tel)}</a>` : ''}
    </div>
    ${voranmeldungHtml(k)}
    ${o?.notiz ? `<div class="hint">${esc(o.notiz)}</div>` : ''}
    ${k.notiz ? `<div class="hint">${esc(k.notiz)}</div>` : ''}`;
  if(!kk){ $('app').innerHTML = kopf + `<div class="mh-leer">Für ${o ? 'dieses Objekt' : 'diesen Kunden'} ist noch keine Pflegekategorie erfasst.</div>`; return; }
  const kat = katById(kk.kategorie_id);

  // Wochen dieser Kategorie (laufendes + naechstes Jahr), Fokus: aus «Faellig» uebernommen, sonst naechste offene
  const wochen = [];
  [JETZT.jahr, JETZT.jahr + 1].forEach(j => [...new Set(jobsVonKk(kk, j).map(x => x.kw))].sort((a, b) => a - b).forEach(w => wochen.push({ jahr: j, kw: w })));
  const wk = x => `${x.jahr}-${x.kw}`, nachJetzt = x => x.jahr > JETZT.jahr || x.kw >= JETZT.kw;
  // wie Mockup: naechste offene ab heute, sonst irgendeine offene, sonst die letzte vergangene
  const fokus = wochen.find(x => wk(x) === r.wk)
    || wochen.find(x => nachJetzt(x) && !erledigt(kk.id, x.jahr, x.kw))
    || wochen.find(x => !erledigt(kk.id, x.jahr, x.kw))
    || [...wochen].reverse().find(x => !nachJetzt(x)) || wochen[0];
  const sichtbar = wochen.filter(x => x.jahr === JETZT.jahr || (fokus && x.jahr === fokus.jahr));
  const done = fokus && erledigt(kk.id, fokus.jahr, fokus.kw);
  const diese = fokus ? jobsVonKk(kk, fokus.jahr).filter(x => x.kw === fokus.kw).map(x => x.ka) : [];
  const fotos = fotosFuer(kk);
  const doks = S.dok.filter(d => d.kunde_id === k.kunde_id && (d.objekt_id || null) === (kk.objekt_id || null) && !d.ersetzt && (() => { const kd = S.dk.filter(x => x.dokument_id === d.id).map(x => x.kategorie_id); return !kd.length || kd.includes(kat.id); })());
  const tab = !kat.individuell && tabelleVon(kat.id), zust = zustVon(kk.id);

  $('app').innerHTML = kopf + `
    <div class="mh-ktabs">${kks.map(x => { const c = katById(x.kategorie_id); return c ? `<button data-act="kat" data-kat="${c.id}" aria-pressed="${c.id === kat.id}">${dot(c)}${esc(c.name)}</button>` : ''; }).join('')}</div>
    ${sichtbar.length ? `<div class="mh-wk">${sichtbar.map(x => { const ok = erledigt(kk.id, x.jahr, x.kw); return `<button data-act="wk" data-wk="${wk(x)}" class="${fokus && wk(x) === wk(fokus) ? 'on' : ''}${ok ? ' ok' : ''}">${ok ? I('check') : ''}KW ${x.kw}${x.jahr !== JETZT.jahr ? ' / ' + x.jahr : ''}</button>`; }).join('')}</div>` : ''}
    ${fokus ? `<button class="big-done${done ? ' on' : ''}" data-act="erledigt" data-kk="${kk.id}" data-wk="${wk(fokus)}" aria-pressed="${done}">${I('check')}${done ? `Erledigt · KW ${fokus.kw}` : `Als erledigt markieren · KW ${fokus.kw}`}</button>` : ''}
    <section class="sd-sec"><h3>Fotos</h3>
      ${fotos.length ? `<div class="photos">${fotos.map(f => `<button class="ph" data-act="lb" data-foto="${f.id}">${S.urls[vorschauPfad(f.storage_pfad)] ? `<img alt="" src="${esc(S.urls[vorschauPfad(f.storage_pfad)])}">` : ''}</button>`).join('')}</div>` : '<div class="muted small">Noch keine Fotos.</div>'}
      <label class="big-foto">${I('cam')}Foto hinzufügen<input type="file" accept="image/*" capture="environment" hidden data-act="foto" data-kunde="${k.kunde_id}" data-objekt="${kk.objekt_id || ''}" data-kat="${kat.id}"></label>
    </section>
    ${fokus ? `<section class="sd-sec"><h3>Arbeiten KW ${fokus.kw}</h3>${diese.map(ka => {
        const a = ka.arbeit_id && S.arbeiten.find(x => x.id === ka.arbeit_id), p = punkte(a ? a.ablauf : ka.beschrieb);
        return `<div class="md-arb"><div class="md-arb-h"><span class="sd-art">${a ? 'Standard' : 'Zusatz'}</span><span class="sd-n">${esc(arbeitName(ka))}</span></div>
          ${p.length ? (a ? `<ol class="dlist">${p.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : `<div class="sd-b">${p.map(esc).join('\n')}</div>`) : '<div class="muted small">Keine Infos erfasst.</div>'}</div>`;
      }).join('')}</section>` : '<div class="mh-leer">Für diese Kategorie sind keine Arbeiten geplant.</div>'}
    ${kat.individuell ? '' : `<section class="sd-sec"><h3>Angaben / Eckdaten</h3>
      ${S.bearbeiten
        ? `<div class="fgrid">${felderVon(kat.id).map(f => feldInput(f, (kk.werte || {})[f.id] ?? '')).join('')}</div>
           <div class="row-end"><button class="btn btn-ghost" data-act="ang-ab">Abbrechen</button><button class="btn btn-primary" data-act="ang-ok" data-kk="${kk.id}">Speichern</button></div>`
        : `<dl class="sd-dl">${felderVon(kat.id).map(f => { const c = f.typ === 'notiz' ? ' class="full"' : ''; return `<dt${c}>${esc(f.name)}</dt><dd${c}>${wertText(f, (kk.werte || {})[f.id])}</dd>`; }).join('')}</dl>
           ${kat.sondertabelle === 'bewaesserung' ? `<div class="sd-l" style="margin-top:8px">Bewässerungsplan</div>${bpLese(kk)}` : tab ? `<div class="sd-l" style="margin-top:8px">${esc(tab.name)}</div>${tabLese(kk, tab)}` : ''}
           ${felderVon(kat.id).length ? `<button class="btn btn-ghost" data-act="ang-edit">${I('set')}Angaben bearbeiten</button>` : ''}`}
    </section>`}
    ${doks.length ? `<section class="sd-sec"><h3>Angebote und Dokumente</h3><div class="doks">${doks.map(d => `<button class="dok" data-act="dok" data-dok="${d.id}">${I('file')}<span>${esc(d.titel)}<small>${esc(d.easybill_nummer || 'PDF')}${d.datum ? ' · ' + esc(d.datum.split('-').reverse().join('.')) : ''}</small></span></button>`).join('')}</div></section>` : ''}
    <div class="sd-foot"><span class="sd-l">Zuständig</span>${zust.length ? esc(zust.map(zustName).join(', ')) : '<span class="muted">Niemand zuständig</span>'}</div>`;
  ladeFotoUrls(fotos);
}

// Fotos: privater Speicher, Links 1 h gueltig
let urlsZeit = Date.now();
async function ladeFotoUrls(fotos){
  if(Date.now() - urlsZeit > 50 * 60000){ S.urls = {}; urlsZeit = Date.now(); }
  const pfade = fotos.flatMap(f => [f.storage_pfad, vorschauPfad(f.storage_pfad)]).filter(p => !S.urls[p]);
  if(!pfade.length) return;
  const { data, error } = await sb.storage.from('pflege-fotos').createSignedUrls(pfade, 3600);
  if(error) return;
  (data || []).forEach(d => { if(d.signedUrl) S.urls[d.path] = d.signedUrl; });
  document.querySelectorAll('.ph[data-foto]').forEach(b => {
    const f = S.fotos.find(x => x.id === b.dataset.foto), url = f && S.urls[vorschauPfad(f.storage_pfad)];
    if(url && !b.querySelector('img')) b.innerHTML = `<img alt="" src="${esc(url)}">`;
  });
}
async function verkleinere(datei, max, qualitaet){
  const bild = await createImageBitmap(datei, { imageOrientation: 'from-image' });
  const f = Math.min(1, max / Math.max(bild.width, bild.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bild.width * f); c.height = Math.round(bild.height * f);
  c.getContext('2d').drawImage(bild, 0, 0, c.width, c.height);
  bild.close?.();
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('Bild konnte nicht umgewandelt werden')), 'image/jpeg', qualitaet));
}
// Foto vom Handy: verkleinern, hochladen, Kategorie des Einsatzes als Schlagwort
async function ladeFotoHoch(datei, kundeId, katId, objektId){
  showToast('Foto wird hochgeladen …');
  try {
    const [gross, klein] = await Promise.all([verkleinere(datei, 1920, 0.85), verkleinere(datei, 480, 0.8)]);
    const id = crypto.randomUUID(), pfad = `${kundeId}/${id}.jpg`;
    const up = await Promise.all([
      sb.storage.from('pflege-fotos').upload(pfad, gross, { contentType: 'image/jpeg' }),
      sb.storage.from('pflege-fotos').upload(vorschauPfad(pfad), klein, { contentType: 'image/jpeg' })
    ]);
    const ue = up.find(x => x.error); if(ue) throw ue.error;
    const { data, error } = await sb.from('pflege_foto').insert({ id, kunde_id: kundeId, objekt_id: objektId || null, storage_pfad: pfad, erstellt_von: aktuelleUserId }).select().single();
    if(error) throw error;
    S.fotos.unshift(data);
    const { error: e2 } = await sb.from('pflege_foto_kategorie').insert({ foto_id: id, kategorie_id: katId });
    if(!e2) S.fk.push({ foto_id: id, kategorie_id: katId });
    showToast('Foto gespeichert.');
    render();
  } catch(err){ showToast('Foto konnte nicht gespeichert werden: ' + friendlyError(err), true); }
}

function zeigeLb(){
  const el = $('lb');
  if(!S.lb){ el.classList.add('hidden'); el.innerHTML = ''; return; }
  const { liste, i } = S.lb, f = S.fotos.find(x => x.id === liste[i]);
  el.innerHTML = `<button class="mh-ic lb-x" data-lb="zu" aria-label="Schliessen">${I('x')}</button>
    ${liste.length > 1 ? `<button class="mh-ic lb-l" data-lb="-1" aria-label="Vorheriges">${I('back')}</button><button class="mh-ic lb-r" data-lb="1" aria-label="Nächstes">${I('next')}</button>` : ''}
    ${S.urls[f.storage_pfad] ? `<img alt="" src="${esc(S.urls[f.storage_pfad])}">` : '<span style="color:#fff">Bild wird geladen …</span>'}
    <div class="lb-cap">${esc(f.beschriftung || '')} ${i + 1} / ${liste.length}</div>`;
  el.classList.remove('hidden');
}
$('lb').addEventListener('click', e => {
  const b = e.target.closest('[data-lb]');
  if(e.target.id === 'lb' || b?.dataset.lb === 'zu'){ S.lb = null; return zeigeLb(); }
  if(b){ const n = S.lb.liste.length; S.lb.i = (S.lb.i + +b.dataset.lb + n) % n; zeigeLb(); }
});

// ---------------------------------------------------------------------------
// Ereignisse
// ---------------------------------------------------------------------------
async function setzeErledigt(kkId, jahr, kw, soll){
  const { error } = soll
    ? await sb.from('pflege_einsatz_status').insert({ kunde_kategorie_id: kkId, jahr, kw, erledigt_von: aktuelleUserId })
    : await sb.from('pflege_einsatz_status').delete().eq('kunde_kategorie_id', kkId).eq('jahr', jahr).eq('kw', kw);
  if(error){ showToast(friendlyError(error), true); return; }
  if(soll) S.status.add(statusKey(kkId, jahr, kw)); else S.status.delete(statusKey(kkId, jahr, kw));
  showToast(soll ? 'Erledigt.' : 'Wieder offen.');
  render();
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if(!b || b.tagName === 'INPUT' || b.tagName === 'SELECT') return;
  const act = b.dataset.act, f = S.f, r = route();
  if(act === 'tab'){ S.tab = b.dataset.tab; if(location.hash) location.hash = ''; else render(); window.scrollTo(0, 0); }
  else if(act === 'oeffne') zeigeKunde(b.dataset.kunde, b.dataset.objekt, b.dataset.kat, b.dataset.wk);
  else if(act === 'ort') zeigeKunde(r.kunde, b.dataset.o || '');
  else if(act === 'zurueck') location.hash = '';
  else if(act === 'f-abo' || act === 'f-status'){
    const liste = act === 'f-abo' ? 'abo' : 'status', v = b.dataset.v, max = act === 'f-abo' ? 3 : 2;
    f[liste] = f[liste].includes(v) ? f[liste].filter(x => x !== v) : [...f[liste], v];
    if(f[liste].length === max) f[liste] = [];
    render();
  }
  else if(act === 'erledigt'){ const [j, w] = b.dataset.wk.split('-').map(Number); await setzeErledigt(b.dataset.kk, j, w, b.getAttribute('aria-pressed') !== 'true'); }
  else if(act === 'kat') zeigeKunde(r.kunde, aktOrt(), b.dataset.kat);
  else if(act === 'wk'){ const p = new URLSearchParams({ k: r.kunde }); if(aktOrt()) p.set('o', aktOrt()); p.set('kat', r.kat || ''); p.set('wk', b.dataset.wk); history.replaceState(null, '', '#' + p.toString()); render(); }
  else if(act === 'lb'){
    const kk = S.kk.find(x => x.id === aktKkId);
    const liste = fotosFuer(kk).map(x => x.id); S.lb = { liste, i: Math.max(0, liste.indexOf(b.dataset.foto)) }; zeigeLb();
  }
  else if(act === 'dok'){
    const d = S.dok.find(x => x.id === b.dataset.dok), w = window.open('', '_blank');
    const { data, error } = await sb.storage.from('pflege-dokumente').createSignedUrl(d.storage_pfad, 3600);
    if(error){ w?.close(); showToast(friendlyError(error), true); return; }
    if(w) w.location = data.signedUrl; else location.href = data.signedUrl;
  }
  else if(act === 'ang-edit'){ S.bearbeiten = true; render(); }
  else if(act === 'ang-ab'){ S.bearbeiten = false; render(); }
  else if(act === 'yn'){
    const g = b.parentElement, v = b.getAttribute('aria-pressed') === 'true' ? '' : b.dataset.v;
    g.dataset.yn = v; g.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.v === v)));
  }
  else if(act === 'ang-ok'){
    const kk = S.kk.find(x => x.id === b.dataset.kk), werte = { ...(kk.werte || {}) };
    $('app').querySelectorAll('[data-feld]').forEach(el => {
      const fld = S.felder.find(x => x.id === el.dataset.feld);
      let v = el.classList.contains('yn') ? el.dataset.yn : el.value.trim();
      if(fld.typ === 'zahl' && v !== '') v = Number(v);
      if(v === '' || v == null) delete werte[fld.id]; else werte[fld.id] = v;
    });
    const { error } = await sb.from('pflege_kunde_kategorie').update({ werte }).eq('id', kk.id);
    if(error){ showToast(friendlyError(error), true); return; }
    kk.werte = werte; S.bearbeiten = false; showToast('Angaben gespeichert.'); render();
  }
});
document.addEventListener('change', e => {
  const el = e.target, act = el.dataset.act;
  if(act === 'f-kat'){ S.f.kat = el.value; render(); }
  else if(act === 'f-ma'){ S.f.ma = el.value; render(); }
  else if(act === 'foto'){ const d = el.files[0]; el.value = ''; if(d) ladeFotoHoch(d, el.dataset.kunde, el.dataset.kat, el.dataset.objekt); }
});
document.addEventListener('input', e => { if(e.target.dataset.act === 'q'){ S.q = e.target.value; renderKundenTreffer(); } });

pruefeAnmeldung();
</script>
