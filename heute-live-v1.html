<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=63"></script>
<title>Heute – Knechtgarten</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#323E4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Knechtgarten">
<link rel="manifest" href="/heute-manifest.json">
<link rel="apple-touch-icon" href="/knecht-tool-180.png">
<style>
/* Handy-Startseite: Infos vom Büro, mein Einsatz (Tage durchblättern), meine Pendenzen heute, Schnellzugriffe, Leiste unten */
:root{ --bg:#F5F7F9; --primary:#323E4E; --ink:#232B35; --muted:#6B7079; --line:#E1E5E9; --gruen:#3F7D3F; }
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);line-height:1.4;font-size:15px;-webkit-tap-highlight-color:transparent;}
.hidden{display:none !important;}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.kopf{background:var(--primary);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;display:flex;align-items:center;gap:10px;}
.kopf .t{flex:1;display:flex;flex-direction:column;}
.kopf b{font-size:19px;}
.kopf small{font-size:13px;opacity:.75;}
.kopf button{all:unset;cursor:pointer;font-size:13px;opacity:.8;padding:6px 4px;}
.w{max-width:560px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;}
.karte{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;}
.karte h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px;}
.karte h2 a{margin-left:auto;text-transform:none;letter-spacing:0;font-size:13px;color:var(--primary);text-decoration:none;font-weight:600;}
.klein{font-size:12.5px;color:var(--muted);}
.leer{font-size:14px;color:var(--muted);padding:4px 0;}
/* Tage: Datum klein neben dem Titel, Tag wechseln durch Wischen (oder ‹ ›) */
.edatum{display:inline-flex;align-items:center;gap:2px;color:var(--ink);}
.tagpf{all:unset;cursor:pointer;width:20px;height:20px;border-radius:6px;text-align:center;line-height:19px;font-size:15px;color:var(--muted);}
.tagpf:hover{background:var(--bg);color:var(--primary);} .tagpf[disabled]{opacity:.25;cursor:default;background:none;}
#einsatz{touch-action:pan-y;gap:0 !important;}
/* Einsatz kompakt: zwei Zeilen pro Einsatz, drei passen ohne Scrollen */
.ez{display:grid;grid-template-columns:40px minmax(0,1fr) 28px;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);}
.ez:first-child{border-top:0;padding-top:0;}
.ez .zt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;align-self:start;padding-top:1px;}
.ez .tx{display:flex;flex-direction:column;min-width:0;}
.ez .l1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);} .ez .l1 b{color:var(--ink);font-weight:600;}
.ez .l2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ez.absenz .l1 b{color:var(--muted);font-weight:500;}
.ezd{all:unset;box-sizing:border-box;cursor:pointer;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);}
.ezd svg{width:14px;height:14px;} .ezd:active{background:var(--bg);}
.eins .mit{font-size:13.5px;color:var(--ink);} .eins .mit span{color:var(--muted);}
.tage{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px;}
.tage::-webkit-scrollbar{display:none;}
.tag{all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:52px;height:56px;border-radius:12px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--muted);position:relative;}
.tag b{font-size:17px;color:var(--ink);}
.tag[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:#D6E7F4;}
.tag[aria-pressed=true] b{color:#fff;}
.tag i{position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:#8B9097;}
.tag[aria-pressed=true] i{background:#D1DB5F;}
/* Einsatz */
.eins{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;background:var(--bg);border-left:4px solid var(--primary);}
.eins.absenz{border-left-color:#8B9097;}
.eins .art{font-size:12px;color:var(--muted);}
.eins .n{font-size:18px;font-weight:600;color:var(--primary);line-height:1.25;}
.eins .adr{font-size:14px;}
.eins .info{font-size:14px;background:#fff;border-radius:8px;padding:8px 10px;border:1px solid var(--line);white-space:pre-line;}
.knoepfe{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.knopf{all:unset;box-sizing:border-box;cursor:pointer;min-height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;text-align:center;padding:0 12px;text-decoration:none;}
.knopf.hell{border:1px solid #D5DBE1;background:#fff;color:var(--primary);}
.knopf.dunkel{background:var(--primary);color:#fff;}
/* Pendenzen */
/* einzeilig, damit mindestens 4–5 Pendenzen in die feste Höhe passen */
.pz{display:flex;align-items:center;gap:8px;height:34px;flex:none;border-top:1px solid var(--line);}
.pz:first-of-type{border-top:0;}
.pz .t{all:unset;cursor:pointer;flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;height:100%;}
.pz .t span{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pz .t small{flex:none;max-width:40%;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pz .ok{all:unset;cursor:pointer;width:24px;height:24px;color:#B6BCC3;display:flex;align-items:center;justify-content:center;flex:none;}
.pz .ok svg.i{width:13px;height:13px;}
.pz .ok:active,.pz .ok.ja{color:#3F7D3F;}
/* Details einer Pendenz: Blatt von unten */
.blatt{position:fixed;inset:0;z-index:96;background:rgba(35,43,53,.45);display:flex;align-items:flex-end;}
.blatt .in{background:#fff;width:100%;max-height:85vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;}
/* Einsatz-Details: ganze Höhe, von oben – wirkt wie eine eigene Seite */
.blatt.oben{align-items:stretch;}
.blatt.oben .in{max-height:none;height:100%;border-radius:0;padding-top:calc(16px + env(safe-area-inset-top,0px));}
.blatt.oben .in > [data-zu]{margin-top:auto;flex:none;}
.blatt .griff{width:40px;height:4px;border-radius:2px;background:#D5DBE1;align-self:center;}
.blatt h3{font-size:19px;color:var(--primary);line-height:1.3;word-break:break-word;}
.blatt .meta{display:flex;flex-wrap:wrap;gap:6px;}
.blatt .meta span{font-size:12.5px;background:var(--bg);border-radius:20px;padding:3px 10px;color:var(--muted);}
.blatt .notiz{font-size:15px;line-height:1.5;word-break:break-word;}
.blatt .notiz p{margin:0 0 6px;}
.blatt .fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.blatt .fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;}
.blatt .knoepfe{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
/* Pendenz erfassen: eine flache Zeile – Textfeld, Mikrofon, ab in die Sammelbox */
.slot{height:var(--slot,220px);min-height:170px;overflow:hidden;}
.slot > :last-child{flex:1;min-height:0;}
.erf{display:flex;flex-direction:column;gap:6px;border:1.5px solid #9DC2DF;border-radius:12px;padding:8px 8px 8px 12px;}
.erf textarea{flex:1;min-height:0;border:0;resize:none;font:inherit;font-size:17px;color:var(--ink);background:transparent;outline:none;}
.erf.schreibt textarea{opacity:.4;}
.erfknoepfe{display:flex;align-items:center;gap:8px;justify-content:flex-end;}
.erf .kam{background:#D6E7F4;color:var(--primary);}
.erffotos{display:flex;gap:6px;margin-right:auto;}
.erffotos span{position:relative;width:28px;height:28px;border-radius:6px;overflow:hidden;}
.erffotos img{width:100%;height:100%;object-fit:cover;display:block;}
.erf button{all:unset;cursor:pointer;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;}
.erf .mic{background:#D6E7F4;color:var(--primary);}
.erf .mic.an{background:#C0392B;color:#fff;animation:puls 1.2s ease-in-out infinite;}
.erf .ab{background:var(--primary);color:#fff;}
.erf button svg.i{width:16px;height:16px;}
.erf .ab[disabled]{opacity:.35;pointer-events:none;}
@keyframes puls{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.45);}50%{box-shadow:0 0 0 8px rgba(192,57,43,0);}}
.aufn{flex:1;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;}
.pegel{display:flex;align-items:center;gap:3px;height:28px;flex:1;}
.pegel i{width:5px;border-radius:3px;background:var(--primary);height:3px;transition:height .08s;}
.karte h2 a.plus{width:28px;height:28px;border-radius:50%;border:1px solid #D5DBE1;display:flex;align-items:center;justify-content:center;}
.karte h2 a.plus svg.i{width:16px;height:16px;}
/* Widgets höchstens so hoch: schmal wenn wenig drin, wachsen nie darüber hinaus */
#pend{overflow-y:auto;display:flex;flex-direction:column;}
#einsatz{overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
/* Apps: alle Funktionen, Stern = in den Schnellzugriff */
.apps{display:flex;flex-direction:column;}
.app{display:flex;align-items:center;gap:12px;height:56px;border-top:1px solid var(--line);}
.app:first-child{border-top:0;}
.app a{flex:1;display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);font-size:15px;min-width:0;}
.app button{all:unset;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#B6BCC3;}
.app button[aria-pressed=true]{color:#D1A21F;}
.app button svg{width:24px;height:24px;}
/* Schnellzugriffe */
.schnell{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.schnell a{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:12px;text-align:center;padding:6px 2px;border-radius:12px;}
.schnell a:active{background:var(--bg);}
/* Leiste unten */
.unten{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));z-index:20;}
.unten a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);text-decoration:none;padding:4px 0;}
.unten a svg.i{width:24px;height:24px;}
.unten a.akt{color:var(--primary);font-weight:600;}
.unten a.kam{color:#fff;}
.unten a.kam span.r{width:52px;height:52px;margin-top:-22px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(50,62,78,.25);}
.unten a.kam span.r svg.i{width:26px;height:26px;}
.unten a.kam em{font-style:normal;color:var(--muted);}
.loginwrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.logincard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
.logincard input{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
.toastwrap{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;z-index:50;pointer-events:none}
.toast{background:#323E4E;color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;max-width:90%}.toast.err{background:#7A2638}
</style>
</head>
<body>
<div class="loginwrap hidden" id="loginwrap"><div class="logincard"><b style="font-size:18px;color:#323E4E">Knechtgarten</b>
  <input autocomplete="username" id="loginEmail" type="email" placeholder="E-Mail"><input autocomplete="current-password" id="loginPassword" type="password" placeholder="Passwort">
  <button class="knopf dunkel" id="loginBtn">Anmelden</button><div class="klein" id="loginStatus"></div></div></div>

<div id="app" class="hidden">
  <div class="kopf"><span class="t"><b id="gruss">Guten Tag</b><small id="datum"></small></span><button type="button" id="logoutBtn">Abmelden</button></div>
  <div class="w" id="startSeite">
    <div data-kg-infos></div><!-- Infos vom Büro (kg-infos.js) -->
    <div class="karte slot" data-w="erfassen"><h2>Pendenz erfassen</h2>
      <div class="erf" id="erf"><textarea id="pzText" placeholder="Was soll nicht vergessen gehen?" aria-label="Neue Pendenz" enterkeyhint="send" autocomplete="off"></textarea>
        <div class="aufn hidden" id="pzAufn"><span class="pegel" id="pzPegel"></span><span><b style="color:#C0392B">●</b> <span id="pzZeit">0:00</span> · nochmals tippen zum Beenden</span></div>
        <div class="erfknoepfe"><span class="erffotos" id="pzFotos"></span><button type="button" class="kam hidden" id="pzKI" aria-label="Mit KI kürzen" title="Mit KI kürzen" style="font-size:10.5px;font-weight:700">KI</button><button type="button" class="kam" id="pzKam" aria-label="Foto aufnehmen" title="Foto"></button><input type="file" id="pzDatei" accept="image/*" capture="environment" hidden><button type="button" class="mic hidden" id="pzMic" aria-label="Diktieren"></button><button type="button" class="ab" id="pzAb" disabled></button></div></div></div>
    <div class="karte slot" data-w="pend"><h2>Meine Pendenzen heute<a class="plus" href="pendenzen-app.html" aria-label="Pendenzen-App öffnen" title="Pendenzen-App">+</a></h2><div id="pend"><div class="leer">Lädt …</div></div></div>
    <div class="karte slot" data-w="einsatz"><h2>Mein Einsatz<span class="edatum"><button type="button" class="tagpf" data-tagpf="-1" aria-label="Vorheriger Tag">‹</button><span id="tage"></span><button type="button" class="tagpf" data-tagpf="1" aria-label="Nächster Tag">›</button></span><a href="einsatzplaner-live-v1.html">Planer</a></h2><div id="einsatz"><div class="leer">Lädt …</div></div></div>
    <div class="karte slot" data-w="schnell"><h2>Schnellzugriff</h2><div class="schnell" id="schnell"></div></div>
  </div>
  <div class="w hidden" id="appsSeite">
    <div class="karte"><h2>Apps</h2><div class="klein">Mit dem Stern kommt eine App in deinen Schnellzugriff auf der Startseite.</div><div class="apps" id="apps"></div></div>
  </div>
  <nav class="unten" id="unten"></nav>
</div>
<div class="toastwrap" id="toastwrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kg-pendenz.js?v=1"></script>
<script>
const sb = window.supabase.createClient('https://oalapdxinqlnzwxhyuzy.supabase.co', 'sb_publishable_DoeD4uEnwemmnFu4AxE9uw_5lmQYc5P');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const svg = p => `<svg class="i" viewBox="0 0 24 24">${p}</svg>`;
const I = k => svg(KG.pfade[k] || KG.toolIcons[k] || '');
const toast = (t, err) => { const d = document.createElement('div'); d.className = 'toast' + (err ? ' err' : ''); d.textContent = t; $('toastwrap').appendChild(d); setTimeout(() => d.remove(), 3500); };
const tagKey = d => new Date(d).toLocaleDateString('sv');   // JJJJ-MM-TT in Ortszeit
const WT = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const ART = { baustelle: 'Baustelle', termin: 'Termin', hilfe: 'Mithilfe', absenz: 'Abwesend' };

let ICH = null, PERS = [], TAGE = [], EINS = [], HAUPT = [], HELFER = [], KUNDEN = {}, INFOS = [], TAG = null;

async function pruefeAnmeldung(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ $('loginwrap').classList.remove('hidden'); return; }
  const { data: b } = await sb.from('benutzer').select('id,anzeigename,email,rolle,aktiv').eq('id', session.user.id).maybeSingle();
  if(!b?.rolle || b.aktiv === false){ $('loginwrap').classList.remove('hidden'); $('loginStatus').textContent = 'Dein Konto ist noch nicht freigeschaltet.'; return; }
  ICH = b; $('loginwrap').classList.add('hidden'); $('app').classList.remove('hidden');
  KG.infosBereit.then(i => i && i.start());
  start();
}
$('loginBtn').onclick = async () => { $('loginStatus').textContent = 'Melde an …';
  const { error } = await KG.anmelden(sb, { email: $('loginEmail').value.trim(), password: $('loginPassword').value });
  if(error){ $('loginStatus').textContent = 'Anmelden hat nicht geklappt: ' + error.message; return; } pruefeAnmeldung(); };
$('logoutBtn').onclick = async () => { await sb.auth.signOut(); location.reload(); };

// Widgets der eigenen Gruppe (Einstellungen › Handy-Ansichten); ?als_gruppe=… zeigt die Ansicht einer anderen Gruppe (Vorschau)
const STANDARD_W = ['erfassen', 'pend', 'einsatz', 'schnell'];
let GRUPPE = null;
async function widgetsAnwenden(){
  const als = new URLSearchParams(location.search).get('als_gruppe');
  const gid = als || ((await sb.from('benutzer').select('recht_gruppe_id').eq('id', ICH.id).maybeSingle()).data || {}).recht_gruppe_id;
  if(gid) GRUPPE = (await sb.from('recht_gruppe').select('id,schluessel,ist_admin,handy_widgets').eq('id', gid).maybeSingle()).data;
  if(als && KG.rechteVorschau) await KG.rechteVorschau(als);
  const W = GRUPPE && GRUPPE.handy_widgets && GRUPPE.handy_widgets.length ? GRUPPE.handy_widgets : STANDARD_W, box = $('startSeite');
  document.querySelectorAll('[data-w]').forEach(c => c.classList.toggle('hidden', !W.includes(c.dataset.w)));
  W.forEach(k => { const c = document.querySelector(`[data-w="${k}"]`); if(c) box.appendChild(c); });
  if(als) $('logoutBtn').classList.add('hidden');
}
async function start(){
  await widgetsAnwenden();
  const h = new Date().getHours(), vn = (ICH.anzeigename || '').split(' ')[0];
  $('gruss').textContent = (h < 11 ? 'Guten Morgen' : h < 17 ? 'Guten Tag' : 'Guten Abend') + (vn ? ', ' + vn : '');
  $('datum').textContent = new Date().toLocaleDateString('de-CH', { weekday: 'long', day: 'numeric', month: 'long' });
  leisteUnten(); slots(); addEventListener('resize', slots); if(location.hash === '#apps') ansicht('apps'); schnell(); ladeEinsatz(); ladePend(); erfassenEinrichten();
}

function slots(){
  const k = document.querySelector('.kopf').offsetHeight, u = $('unten').offsetHeight, inf = document.querySelector('[data-kg-infos]').offsetHeight;
  const frei = innerHeight - k - u - 72 - (inf ? inf + 14 : 0);
  document.documentElement.style.setProperty('--slot', Math.max(170, Math.floor(frei / 3)) + 'px');
}
function leisteUnten(){
  $('unten').innerHTML = [
    `<a class="akt" href="#" data-ansicht="start">${I('home')}Start</a>`,
    `<a href="kontakte-handy-live-v1.html">${svg(KG.toolIcons.kunden || '')}Kontakte</a>`,
    `<a class="kam" href="fotos-live-v1.html"><span class="r">${I('foto')}</span><em>Foto</em></a>`,
    `<a href="reservieren-live-v1.html">${svg(KG.pfade.kalender)}Reservieren</a>`,
    `<a href="#" data-ansicht="apps">${I('raster')}Apps</a>`].join('');
  $('unten').querySelectorAll('[data-ansicht]').forEach(a => a.onclick = e => { e.preventDefault(); ansicht(a.dataset.ansicht); });
}
// Start oder Apps im selben Fenster (kein Seitenwechsel)
function ansicht(v){
  $('startSeite').classList.toggle('hidden', v !== 'start'); $('appsSeite').classList.toggle('hidden', v !== 'apps');
  $('unten').querySelectorAll('[data-ansicht]').forEach(a => a.classList.toggle('akt', a.dataset.ansicht === v));
  if(v === 'apps') zeigeApps(); else schnell(); scrollTo(0, 0);
}

// Alle Apps, die diese Person benutzen darf (Handy: Pendenzen öffnen die Handy-Ansicht)
let FAV = null;
const HANDY_URL = { pend: 'pendenzen-app.html' };
async function appsListe(){
  if(KG.ladeRechte) await KG.ladeRechte();
  // Büro = Büro-Gruppe (Vorschau) bzw. Rolle Admin/Büro; Tools ohne eigenes Recht (z. B. Pool-Konfigurator) nur fürs Büro
  const buero = new URLSearchParams(location.search).get('als_gruppe') ? !!GRUPPE && (GRUPPE.ist_admin || GRUPPE.schluessel === 'buero') : ['admin', 'buero_team'].includes(ICH.rolle);

    let s = 0; for(let i = 0; i < d.length; i++) s += d[i] * d[i]; aufn.pegel.push(Math.min(1, Math.sqrt(s / d.length) * 6)); aufn.pegel.shift(); };
  src.connect(proc); proc.connect(ctx.destination);
  $('pzMic').classList.add('an'); $('pzAufn').classList.remove('hidden'); $('pzText').classList.add('hidden'); $('pzPegel').innerHTML = '<i></i>'.repeat(24);
  const male = () => { if(!aufn) return; const sek = Math.floor((Date.now() - aufn.start) / 1000);
    $('pzZeit').textContent = `${Math.floor(sek / 60)}:${String(sek % 60).padStart(2, '0')}`;
    [...$('pzPegel').children].forEach((b, i) => b.style.height = (3 + aufn.pegel[i] * 25) + 'px');
    if(sek >= 120) return aufnahmeStopp(); requestAnimationFrame(male); };
  male();
}
async function aufnahmeStopp(){
  const a = aufn; if(!a) return; aufn = null;
  a.proc.disconnect(); a.stream.getTracks().forEach(t => t.stop()); const rate = a.ctx.sampleRate; a.ctx.close().catch(() => {});
  $('pzMic').classList.remove('an'); $('pzAufn').classList.add('hidden'); $('pzText').classList.remove('hidden');
  if(Date.now() - a.start < 700) return toast('Zu kurz – Mikrofon antippen, sprechen, nochmals antippen.');
  $('erf').classList.add('schreibt'); $('pzText').placeholder = 'KI schreibt …';
  try { const b64 = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.readAsDataURL(wav(a.teile, rate)); });
    const { data, error } = await sb.functions.invoke('pendenz-diktat', { body: { audio_base64: b64, mime_type: 'audio/wav' } });
    if(error || data?.error) throw new Error(data?.error || error?.message);
    if(!data.titel) toast('Nichts verstanden – bitte nochmals versuchen.');
    else { const t = $('pzText').value.trim(); $('pzText').value = (t ? t + ' ' : '') + data.titel; diktatNotiz = [diktatNotiz, data.wortlich].filter(Boolean).join(' '); }
  } catch(e){ toast(navigator.onLine ? 'Diktat hat nicht geklappt – bitte nochmals.' : 'Kein Netz – bitte die Pendenzen-App (+) benutzen, sie nimmt auch ohne Netz auf.', true); }
  $('erf').classList.remove('schreibt'); $('pzText').placeholder = 'Was soll nicht vergessen gehen?';
  $('pzAb').disabled = !$('pzText').value.trim() && !FOTOS.length;
}
function erfassenEinrichten(){
  $('pzAb').innerHTML = SAMMEL_ICON; $('pzAb').setAttribute('aria-label', 'In die Sammelbox'); $('pzAb').title = 'In die Sammelbox'; $('pzAb').onclick = inSammelbox;
  $('pzText').oninput = () => { $('pzAb').disabled = !$('pzText').value.trim() && !FOTOS.length; if(!$('pzText').value.trim()) diktatNotiz = ''; };
  $('pzKam').innerHTML = I('foto'); $('pzKam').onclick = () => $('pzDatei').click();
  $('pzDatei').onchange = async e => { for(const d of [...e.target.files]){ const blob = await verkleinern(d); FOTOS.push({ blob, url: URL.createObjectURL(blob) }); } e.target.value = ''; zeigeFotos(); };
  $('pzText').onkeydown = e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); inSammelbox(); } };
  // Mikrofon: Spracheingabe des Handys schreibt sofort mit; «KI» kürzt bei Bedarf zu einer sauberen Pendenz.
  // Ohne Spracheingabe im Browser: wie bisher Aufnahme, die KI schreibt den Titel.
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const kiZeigen = () => $('pzKI').classList.toggle('hidden', $('pzText').value.trim().length < 35);
  $('pzText').addEventListener('input', kiZeigen);
  $('pzKI').onclick = async () => { const t = $('pzText').value.trim(); if(!t) return; $('erf').classList.add('schreibt');
    try { const { data, error } = await sb.functions.invoke('pendenz-diktat', { body: { text: t } }); if(error || data?.error) throw new Error(data?.error || error?.message);
      if(data.titel) $('pzText').value = data.titel; } catch(e){ toast(navigator.onLine ? 'KI hat nicht geklappt – bitte nochmals.' : 'Ohne Netz geht die KI nicht.', true); }
    $('erf').classList.remove('schreibt'); kiZeigen(); };
  if(SR){ let rec = null; $('pzMic').classList.remove('hidden'); $('pzMic').innerHTML = I('mikrofon');
    $('pzMic').onclick = () => { if(rec){ rec.stop(); return; }
      rec = new SR(); rec.lang = 'de-CH'; rec.interimResults = true; rec.continuous = true; const basis = $('pzText').value.trim(); $('pzMic').classList.add('an');
      rec.onresult = ev => { const t = [...ev.results].map(r => r[0].transcript).join(' ').trim(); $('pzText').value = (basis ? basis + ' ' : '') + t; $('pzAb').disabled = !$('pzText').value.trim() && !FOTOS.length; kiZeigen(); };
      rec.onend = rec.onerror = () => { rec = null; $('pzMic').classList.remove('an'); };
      try { rec.start(); } catch(e){ rec = null; $('pzMic').classList.remove('an'); } }; }
  else if(navigator.mediaDevices?.getUserMedia && (window.AudioContext || window.webkitAudioContext)){
    $('pzMic').classList.remove('hidden'); $('pzMic').innerHTML = I('mikrofon'); $('pzMic').onclick = () => aufn ? aufnahmeStopp() : aufnahmeStart(); }
  const plus = document.querySelector('a.plus'); if(plus) plus.innerHTML = I('plus');
}

pruefeAnmeldung();
