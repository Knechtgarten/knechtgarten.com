# Noetig fuer die automatische Bereitstellung ueber die Supabase-GitHub-
# Integration (Project Settings -> Integrations -> GitHub, "Deploy to
# production") - nur hier deklarierte Edge Functions werden bei einem Push
# auf den Produktions-Branch automatisch neu deployt.
