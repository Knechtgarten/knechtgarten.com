<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=1"></script>
<title>Einsatzplaner – Knechtgarten</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg:#F5F7F9; --card:#FFFFFF; --primary:#323E4E; --primary-l:#4C5C70;
  --ink:#232B35; --muted:#8B9097; --line:#E1E5E9; --soft:#EEF3F7;
  --accent-blue:#D6E7F4; --accent-lime:#D1DB5F; --danger:#B4655F; --red:#C0392B;
  --namew:225px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);line-height:1.45;font-size:13px;}
.wrap{max-width:1400px;margin:0 auto;padding:0 16px;}
.hidden{display:none !important;}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;}

header.app{background:var(--primary);color:#fff;}
header.app .wrap{display:flex;align-items:center;gap:20px;max-width:none;}
header.app .backlink{display:inline-flex;align-items:center;gap:5px;color:var(--primary);text-decoration:none;font-size:12px;font-weight:700;flex-shrink:0;background:var(--accent-lime);border-radius:20px;padding:6px 12px;}
header.app .brand{padding:11px 0;}
header.app .brand h1{font-size:15px;font-weight:600;color:#fff;}
header.app .brand .sub{font-size:11px;opacity:.75;margin-top:1px;}
header.app .userbar{display:flex;align-items:center;gap:10px;margin-left:auto;}
header.app .userbar span{opacity:.85;font-size:11.5px;}
header.app .userbar button{font-size:11.5px;color:#c7ccd1;background:none;border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:3px 9px;cursor:pointer;}
nav.subnav{background:#fff;border-bottom:1px solid var(--line);}
nav.subnav .wrap{display:flex;gap:2px;max-width:none;overflow-x:auto;}
nav.subnav a{display:flex;align-items:center;gap:7px;padding:12px 12px 10px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;text-decoration:none;font-size:12.5px;white-space:nowrap;cursor:pointer;}
nav.subnav a:hover{color:var(--primary);}
nav.subnav a.on{color:var(--primary);border-bottom-color:var(--primary);}
nav.subnav a .i{width:16px;height:16px;}
nav.subnav .navsp{flex:1;}
nav.subnav .navic{all:unset;cursor:pointer;display:flex;align-items:center;padding:12px 9px 10px;color:var(--muted);border-bottom:2px solid transparent;}
nav.subnav .navic .i{width:18px;height:18px;}
nav.subnav .navic:hover,nav.subnav .navic.on{color:var(--primary);}
nav.subnav .navic.on{border-bottom-color:var(--primary);}
nav.subnav .navic[hidden]{display:none;}
nav.subnav .navic:focus-visible{outline:2px solid var(--primary);outline-offset:-2px;}

input[type=text],input[type=date],input[type=search],select,textarea{font:inherit;font-size:12.5px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 8px;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);}
.btn{border:none;border-radius:7px;padding:7px 14px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-l);}
.btn-ghost{background:#fff;color:var(--primary);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--primary);}
.btn-danger{background:#fff;color:var(--danger);border:1px solid #E6CFCC;}
.btn .i{width:15px;height:15px;}
.icon-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;flex:none;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--muted);box-sizing:border-box;}
.icon-btn .i{width:14px;height:14px;}
.icon-btn:hover{border-color:var(--primary);color:var(--primary);}
.icon-btn.danger:hover{border-color:var(--danger);color:var(--danger);background:#FBEFEC;}
.icon-btn.on{background:var(--primary);color:#fff;border-color:var(--primary);}
.seg{display:inline-flex;}
.seg button{all:unset;cursor:pointer;padding:5px 11px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--primary);}
.seg button + button{border-left:0;}
.seg button:first-child{border-radius:6px 0 0 6px;}
.seg button:last-child{border-radius:0 6px 6px 0;}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff;border-color:var(--primary);}
.muted{color:var(--muted);} .small{font-size:11.5px;}
.hint{font-size:11.5px;color:var(--muted);}
.card{background:#fff;border:1px solid var(--line);border-radius:11px;}

/* Login */
.loginwrap{min-height:80vh;display:flex;align-items:center;justify-content:center;}
.logincard,.pendingcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:28px 26px;width:100%;max-width:330px;}
.logincard h2,.pendingcard h2{font-size:16px;color:var(--primary);margin-bottom:14px;}
.logincard .fld{margin-bottom:10px;}
.logincard label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;}
.logincard input{width:100%;}
.status{font-size:11.5px;color:var(--muted);margin-top:6px;} .status.err{color:var(--danger);}

/* Werkzeugleiste */
.bar-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px 8px;}
.bar-top .sp{flex:1;}
.plsel{padding:4px 8px;font-size:12.5px;max-width:190px;}
.plsel.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);font-weight:700;}
.cpychip{display:inline-flex;align-items:center;gap:5px;color:var(--primary);font-weight:700;font-size:12px;}
.cpychip .i{width:13px;height:13px;}
.cpychip .icon-btn{width:18px;height:18px;}
.rgrip{color:#A9AFB5;display:inline-flex;cursor:pointer;touch-action:none;}
.rgrip .i{width:14px;height:14px;}
.prow.rdrag{opacity:.5;}
.wdhp{display:flex;flex-direction:column;gap:7px;width:260px;}
.wdhp select{width:100%;}
.wdhp .wrow{display:flex;align-items:center;gap:6px;}
.wdhp .wrow input{width:54px;}
.wdhp .wtage{display:flex;gap:3px;}
.wdhp .wtage button{all:unset;cursor:pointer;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);}
.wdhp .wtage button.on{background:var(--primary);border-color:var(--primary);color:#fff;}
.wdhp .wrad{display:flex;flex-direction:column;gap:4px;font-size:12.5px;}
.wdhp .wrad label{display:flex;align-items:center;gap:6px;}
.wdhp .wrad input[type=radio]{accent-color:var(--primary);}
.wdhp .wrad input[type=number]{width:56px;}
.wdhp .wlab{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-top:2px;}
.wdhp .wsum{font-size:12px;color:var(--primary);}
.infop{display:flex;flex-direction:column;gap:5px;max-height:72vh;overflow:auto;}
.infop > b{margin-top:6px;color:var(--primary);}
.infop > b:first-child{margin-top:0;}
.infop .ir{display:flex;align-items:center;gap:8px;font-size:12px;}
.infop .ir > :first-child{flex:none;}
.infop .sw{width:22px;height:11px;border-radius:2px;border:1px solid rgba(50,62,78,.25);display:inline-block;}
.infop .ir .i{width:14px;height:14px;}
.infop a{color:var(--primary);}
.hc.t1.kw{font-size:14px;font-weight:800;}

/* Planer-Raster */
.tl{position:relative;overflow:auto;background:#fff;border-top:1px solid var(--line);height:calc(100vh - 200px);min-height:300px;}
.grid{position:relative;}
.hdr{position:sticky;top:0;z-index:6;display:flex;background:#fff;border-bottom:1px solid var(--line);}
.hdr .corner{position:sticky;left:0;z-index:7;width:var(--namew);flex:none;background:#fff;border-right:1px solid var(--line);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;display:flex;align-items:flex-end;padding:0 10px 5px;}
.hlane{position:relative;flex:none;}
.hc{position:absolute;overflow:hidden;white-space:nowrap;text-overflow:clip;font-size:10.5px;color:var(--muted);border-left:1px solid var(--line);padding:0 4px;}
.hc.t1{top:0;height:20px;line-height:20px;font-weight:700;color:var(--primary);}
.hc.t2{top:20px;height:20px;line-height:20px;text-align:center;}
.hc.t3{top:40px;height:15px;line-height:15px;text-align:center;font-size:9.5px;}
.hc.we{background:#F3F5F7;} .hc.fe{background:#F6F2E6;} .hc.td{background:#F2F5D6;color:var(--primary);font-weight:700;}
.row{display:flex;border-bottom:1px solid #EEF1F3;}
.row .nm{position:sticky;left:0;z-index:4;width:var(--namew);flex:none;background:#fff;border-right:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 8px 0 10px;font-size:12px;white-space:nowrap;overflow:hidden;}
.row .nm .n{overflow:hidden;text-overflow:ellipsis;font-weight:600;}
.row .nm .z{font-size:10.5px;color:var(--muted);flex:none;}
.row .nm .dot{width:9px;height:9px;border-radius:2px;flex:none;border:1px solid rgba(50,62,78,.25);}
.row .nm .me{font-size:9.5px;background:var(--accent-lime);color:var(--primary);border-radius:3px;padding:0 4px;font-weight:700;}
.row.grp .nm{background:var(--primary);color:#fff;font-weight:700;cursor:pointer;font-size:11.5px;}
.row.grp .nm .i{width:13px;height:13px;transition:transform .15s;}
.row.grp.zu .nm .i{transform:rotate(-90deg);}
.row.grp .lane{background:#F7F9FA;}
.row.grp.arch .nm{background:#8B9097;}
.row.grp.ajahr .nm{background:var(--soft);color:var(--primary);padding-left:22px;font-weight:600;}
.lane{position:relative;flex:none;height:24px;}
.lane.ed{cursor:crosshair;}
.tdl{position:absolute;top:0;bottom:0;width:2px;background:var(--accent-lime);pointer-events:none;z-index:1;}
.fel{position:absolute;top:0;bottom:0;background:rgba(214,190,120,.16);pointer-events:none;}
.bar{position:absolute;top:3px;height:17px;border-radius:3px;border:1px solid;font-size:10.5px;font-weight:600;cursor:pointer;user-select:none;touch-action:none;overflow:hidden;z-index:1;}
.bar.ed{cursor:pointer;}
.bar .t,.brg .t{position:absolute;top:0;bottom:0;line-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;font-size:10.5px;pointer-events:none;}
.bar .hl,.bar .hr{position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize;z-index:2;}
.bar .hl{left:0;} .bar .hr{right:0;}
.bar:not(.ed) .hl,.bar:not(.ed) .hr{display:none;}
.bar:hover{filter:brightness(.95);}
.bar.sel{outline:2px solid var(--primary);outline-offset:1px;z-index:3;}
.bar.dim,.brg.dim{opacity:.22;}
.bar.provi{border-style:dashed;}
.bar.mini{top:13px;height:9px;z-index:2;box-shadow:0 0 0 1.5px #fff;border-radius:2px;}
.bar.mini .t{line-height:7px;font-size:8px;}
.bar.tgrp{background:#fff;color:var(--primary);border:1px dashed #8B9097;}
.bar.tgrp .t{font-weight:600;}
.bar.occ{border-style:dotted;}
.brg{position:absolute;top:10px;height:3px;opacity:.55;pointer-events:none;overflow:visible;}
.brg .t{top:-7px;height:17px;line-height:15px;}
.rdot{position:absolute;top:0;width:7px;height:7px;border-radius:50%;background:var(--red);border:1px solid #fff;z-index:3;pointer-events:none;}
.rdot.blau{background:#2F6F9F;}
.rdot.blau.cf{border-color:var(--red);box-shadow:0 0 0 1px var(--red);}
.rdot.ph{background:#C3C8CE;opacity:0;transition:opacity .1s;}
.lane:hover .rdot.ph{opacity:1;}
.rdot.klick{pointer-events:auto;cursor:pointer;}
.rdot.klick:hover,.rdot.wahl{transform:scale(1.45);}
.rdot.wahl{outline:1.5px solid var(--primary);outline-offset:1px;opacity:1;}
.bdot{position:absolute;top:0;width:7px;height:7px;border-radius:50%;background:#2F6F9F;border:1px solid #fff;z-index:3;pointer-events:none;}
.planwrap{display:flex;}
.planwrap .tl{flex:1;min-width:0;}
.aufp{width:300px;flex:none;border-left:1px solid var(--line);border-top:1px solid var(--line);background:#fff;overflow:auto;height:calc(100vh - 200px);min-height:300px;font-size:12px;}
.aufp.zu{width:34px;overflow:hidden;}
.aufp.drop{background:#F2F5D6;}
.auftab{all:unset;cursor:pointer;writing-mode:vertical-rl;padding:12px 8px;font-weight:700;color:var(--primary);font-size:12px;}
.ahead{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line);}
.ahint{font-size:10.5px;color:var(--muted);padding:6px 10px;}
.aleer{padding:8px 10px;color:var(--muted);}
/* Magazin */
.mtit{display:inline-flex;align-items:center;gap:6px;color:var(--primary);font-size:13px;}
.mtit span{color:var(--muted);font-weight:600;}
.madd{padding:3px 9px;font-size:11.5px;margin-left:auto;margin-right:6px;}
.mseg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--soft);border-radius:8px;padding:3px;margin:8px 10px;}
.mseg button{all:unset;cursor:pointer;text-align:center;border-radius:6px;padding:4px 2px;display:flex;flex-direction:column;line-height:1.2;}
.mseg button b{font-size:12px;color:var(--primary);}
.mseg button b span{font-weight:400;color:var(--muted);}
.mseg button small{font-size:10px;color:var(--muted);}
.mseg button.on{background:#fff;box-shadow:0 1px 3px rgba(30,37,48,.15);}
.mseg button.can{outline:2px dashed #8FB3D1;outline-offset:-2px;}
.mseg button.hot{background:#D6E7F4;outline-color:var(--primary);}
.mseg button:focus-visible,.mck:focus-visible{outline:2px solid var(--primary);outline-offset:1px;}
.maddln{display:flex;gap:6px;margin:0 10px 8px;align-items:center;}
.maddln input[type=text],.maddln #magIn{flex:1;min-width:0;}
.mlist{border-top:1px solid var(--line);}
.mrow{border-bottom:1px solid var(--soft);}
.mrow.open{background:#F7F9FA;}
.mln{display:flex;align-items:center;gap:7px;padding:4px 8px 4px 10px;min-height:28px;cursor:pointer;}
.mln:hover{background:#F2F5F7;}
.mgrip{color:#A9AFB5;display:inline-flex;cursor:pointer;margin-left:-4px;touch-action:none;}
.mgrip .i{width:13px;height:13px;}
.mck{all:unset;cursor:pointer;width:14px;height:14px;border:1.5px solid #9AA1A8;border-radius:50%;display:flex;align-items:center;justify-content:center;color:transparent;flex:none;}
.mck:hover{border-color:var(--primary);color:var(--primary);}
.mck .i{width:10px;height:10px;stroke-width:2.4;}
.mt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-size:12.5px;}
.mrep{color:#5E7F99;display:inline-flex;}
.mrep .i,.mchev .i{width:12px;height:12px;}
.mchev{color:#A9AFB5;display:inline-flex;transition:transform .15s;}
.mrow.open .mchev{transform:rotate(90deg);}
.mdet{padding:2px 10px 10px 31px;display:flex;flex-direction:column;gap:8px;}
.mdet .mh{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:3px;}
.mdet textarea{width:100%;min-height:48px;font-size:12.5px;}
.mcl{display:flex;flex-direction:column;gap:1px;}
.mcl label{display:flex;gap:6px;align-items:center;font-size:12.5px;cursor:pointer;}
.mcl label input{accent-color:var(--primary);}
.mcl label span{flex:1;min-width:0;}
.mcl label.ok span{text-decoration:line-through;color:var(--muted);}
.mclx{all:unset;cursor:pointer;color:#B5BABF;display:inline-flex;}
.mclx .i{width:12px;height:12px;}
.mclx:hover{color:var(--danger);}
.mcladd{border:0 !important;border-bottom:1px dashed var(--line) !important;border-radius:0 !important;background:transparent !important;padding:3px 0 !important;font-size:12.5px;}
.mfotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:5px;}
.mfotos .file{cursor:pointer;}
.mfotos .mdok{color:var(--primary);}
.mfadd{all:unset;cursor:pointer;aspect-ratio:4/3;border-radius:5px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);}
.mfadd:hover{border-color:var(--primary);color:var(--primary);}
.madm{display:flex;align-items:center;justify-content:flex-end;gap:6px;border-top:1px solid var(--line);padding-top:8px;}
.bar.prov{background:repeating-linear-gradient(135deg,#E9EDB8 0 4px,#FFFFFF 4px 8px);border:1px dashed #9CA43A;color:#323E4E;cursor:pointer;}
.bar.prov.over{border:1.5px solid var(--red);}
.bar.altb{border:1.5px solid var(--red) !important;}
/* Service aus «Nachschlagewerk & Maschinen»: hellblau gestreift = noch offen, rot = Woche vorbei, nicht abgehakt */
.bar.svc{background:repeating-linear-gradient(135deg,#D6E7F4 0 4px,#FFFFFF 4px 8px);border:1px dashed #6F8FAF;color:#323E4E;cursor:pointer;z-index:2;}
.bar.svc .t{font-size:9.5px;}
.bar.svc.wichtig{background:repeating-linear-gradient(135deg,#8DB6DB 0 4px,#FFFFFF 4px 8px);border:2px solid #323E4E;font-weight:700;}
.bar.svc.over{border:1.5px solid var(--red);}
.svcw{display:inline-block;background:#323E4E;color:#fff;border-radius:8px;padding:0 6px;font-size:10.5px;font-weight:700;margin-left:4px;}
.svcf{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--red);color:#fff;font-size:9px;line-height:12px;text-align:center;font-weight:800;z-index:3;pointer-events:none;}
.svclist{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow:auto;}
.svci{display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:6px;}
.svci .btn{padding:3px 8px;font-size:12px;flex:none;}
.bar.prov.nozeit{background:repeating-linear-gradient(135deg,#E9EDB8 0 4px,#FFFFFF 4px 8px);border:1px dashed #C08A2E;}
.row.grp .lane .bar{top:2px;height:15px;}
.aghost{position:fixed;z-index:95;background:var(--primary);color:#fff;font-size:11.5px;padding:4px 8px;border-radius:5px;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.2);}
.lane.drop{background:#F2F5D6 !important;}
.pgrip{display:inline-flex;width:12px;margin-left:-8px;margin-right:-4px;color:#9AA1A8;cursor:grab;opacity:0;flex:none;} .pgrip .i{width:12px;height:12px;}
.row:hover > .nm .pgrip{opacity:1;}
.gadd{all:unset;cursor:pointer;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;color:rgba(255,255,255,.6);flex:none;margin-left:auto;}
.gadd .i{width:13px;height:13px;}
.gadd:hover{color:#fff;background:rgba(255,255,255,.15);}
.dropline{position:fixed;height:3px;background:var(--primary);z-index:96;pointer-events:none;border-radius:2px;}
.tl.sortable .row .nm{cursor:pointer;}
.tl.sortable .row .nm button{cursor:pointer;}
.vchip{position:absolute;height:15px;border-radius:3px;font-size:10px;line-height:13px;padding:0 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:#fff;border:1px solid #8B9097;color:var(--ink);z-index:2;user-select:none;touch-action:none;}
.vchip.ed{cursor:pointer;}
.vchip.ed:hover{border-color:var(--primary);box-shadow:0 1px 4px rgba(30,37,48,.18);}
.vchip.ev{background:repeating-linear-gradient(135deg,#EEF1F3 0 4px,#fff 4px 8px);border-style:dashed;color:#5E646B;}
.vmore{position:absolute;font-size:10px;color:var(--primary);cursor:pointer;font-weight:600;z-index:2;}
.vwk{position:absolute;top:4px;height:15px;font-size:10px;color:var(--primary);text-align:center;font-weight:600;}
.row.vpool .lane{background-color:#F7F9FA;}
.lane.vown.drop{background:#F2F5D6 !important;}
.nm .lk{all:unset;cursor:pointer;color:var(--primary);font-size:10.5px;margin-left:4px;}
.fxw .lk{all:unset;cursor:pointer;color:var(--primary);text-decoration:underline;margin-left:4px;}
.mab{all:unset;cursor:pointer;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;color:#9AA1A8;flex:none;margin-left:auto;}
.mab .i{width:14px;height:14px;}
.mab:hover{color:var(--primary);background:var(--soft);}
.mab.on{color:#fff;background:var(--primary);}
.mab + .mab{margin-left:1px;}
.row.ov.fov .nm{background:#fff;padding-left:22px;}
.row.ov.fov,.row.ov.fov .lane{background-color:#fff;}
/* Ablage freier Lieferwagen: kräftigere Linie oben und ganz helles Grau (näher bei Weiss), damit «verfügbar» klar getrennt ist */

.lbox{position:fixed;inset:0;z-index:80;background:rgba(20,25,32,.9);display:flex;align-items:center;justify-content:center;padding:40px;}
.lbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;}
.lbox .x{position:absolute;top:14px;right:14px;}
.toastwrap{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;}
.toast{background:var(--primary);color:#fff;font-size:12.5px;padding:9px 14px;border-radius:7px;box-shadow:0 6px 20px rgba(0,0,0,.2);display:flex;gap:12px;align-items:center;}
.toast.err{background:var(--danger);}
.toast button{all:unset;cursor:pointer;color:var(--accent-lime);font-weight:700;}

/* Einstellungen */
.page{padding:18px 16px 40px;max-width:1000px;}
.page h2{font-size:17px;color:var(--primary);margin-bottom:4px;}
.gcard{margin-top:14px;}
.ghead{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);}
.ghead b{font-size:13.5px;color:var(--primary);}
.prow{display:grid;grid-template-columns:16px minmax(0,1.6fr) minmax(0,1fr) minmax(0,1.4fr) auto;gap:10px;align-items:center;padding:7px 14px;border-bottom:1px solid var(--soft);font-size:12.5px;}
.prow:last-child{border-bottom:0;}
.prow.off{opacity:.5;}
.tag{font-size:10.5px;background:var(--soft);border-radius:4px;padding:1px 6px;margin-right:4px;color:var(--primary);}
.acts{display:flex;gap:4px;}
.dlg{position:fixed;inset:0;z-index:70;background:rgba(20,26,34,.35);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;}
.dlg .in{background:#fff;border-radius:11px;width:100%;max-width:520px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;}
.pal{display:flex;gap:5px;flex-wrap:wrap;}
.pal button{all:unset;cursor:pointer;width:24px;height:24px;border-radius:5px;border:2px solid transparent;}
.pal button[aria-pressed="true"]{border-color:var(--ink);}
table.ft{border-collapse:collapse;width:100%;font-size:12.5px;}
table.ft td{padding:7px 10px;border-bottom:1px solid var(--soft);}

/* Handy */
.m{max-width:560px;margin:0 auto;padding:0 0 90px;}
.m-top{position:sticky;top:0;z-index:5;background:var(--primary);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px;}
.m-top .nav{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;}
.m-top .ti{flex:1;text-align:center;}
.m-top .ti b{display:block;font-size:15px;}
.m-top .ti span{font-size:11.5px;opacity:.8;}
.m-top > span:first-child{width:34px;flex:none;}
.m-madd{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;background:#D1DB5F;color:#232B35;display:flex;align-items:center;justify-content:center;flex:none;}
.m-madd:focus-visible{outline:2px solid #fff;outline-offset:2px;}
.m-q{padding:0 12px;font-weight:700;color:var(--primary);font-size:14px;}
.m-mag{background:#fff;margin:6px 0 0;border-top:1px solid var(--line);}
.m-mag .mseg{margin:8px 12px;} .m-mag .mseg button{padding:8px 2px;} .m-mag .mseg button b{font-size:14px;}
.m-mag .maddln{margin:0 12px 10px;} .m-mag .maddln input{font-size:15px;padding:9px 10px;} .m-mag .maddln .icon-btn{width:40px;height:40px;}
.m-mag .mln{min-height:44px;padding:6px 12px;gap:10px;}
.m-mag .mck{width:22px;height:22px;} .m-mag .mck .i{width:13px;height:13px;}
.m-mag .mt{font-size:15px;}
.m-mag .mdet{padding:4px 12px 14px;}
.m-mag .mdet textarea,.m-mag .mcl label,.m-mag .mcladd{font-size:15px;}
.m-mag .mcl label input{width:20px;height:20px;}
.m-mag .mfotos{grid-template-columns:repeat(auto-fill,minmax(80px,1fr));}
.m-sw{display:flex;gap:8px;padding:10px 12px;}
.m-sw .seg{flex:1;} .m-sw .seg button{flex:1;text-align:center;padding:7px 0;}
.m-day{padding:12px 12px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;}
.m-day.td{color:var(--primary);}
.mc{margin:6px 12px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;cursor:pointer;}
.mc .h{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--muted);}
.mc .h .who{margin-left:auto;}
.mc b{font-size:15px;color:var(--ink);}
.mc .o{font-size:12px;color:var(--muted);}
.mc .nt{font-size:12.5px;white-space:pre-wrap;display:none;border-top:1px solid var(--soft);padding-top:6px;margin-top:2px;}
.mc.open .nt{display:block;}
.mc .fl{display:none;gap:6px;flex-wrap:wrap;}
.mc.open .fl{display:flex;}
.mc .fl a{font-size:12px;color:var(--primary);background:var(--soft);border-radius:5px;padding:3px 8px;text-decoration:none;}
.mc.provi{border-style:dashed;}
.m-empty{margin:6px 12px;color:var(--muted);font-size:12.5px;padding:8px 0;}
.m-in{border:1px solid var(--line);border-radius:8px;padding:10px;font-size:15px;width:100%;background:#fff;font-family:inherit;}

@media (max-width:760px){ header.app .brand .sub,header.app .userbar span{display:none;} .sidepanel{width:100vw;} }

<script>
(function(){
const $ = id => document.getElementById(id);
const SUPABASE_URL = 'https://oalapdxinqlnzwxhyuzy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_DoeD4uEnwemmnFu4AxE9uw_5lmQYc5P';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const ROLLE_LABEL = { admin: 'Admin', buero_team: 'Büro-Team', mitarbeitende: 'Mitarbeitende', service_team: 'Service-Team' };
const I = id => `<svg class="i"><use href="#i-${id}"/></svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const lsGet = (k, d) => { try { const v = localStorage.getItem('ep_' + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } };
const lsSet = (k, v) => { try { localStorage.setItem('ep_' + k, JSON.stringify(v)); } catch(e){} };

// ---------------------------------------------------------------------------
// Meldungen (mit «Rückgängig»)
// ---------------------------------------------------------------------------
function toast(msg, undo, isErr){
  const t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : '');
  t.innerHTML = `<span>${esc(msg)}</span>`;
  if(undo){ const b = document.createElement('button'); b.textContent = 'Rückgängig'; b.onclick = () => { t.remove(); undo(); }; t.appendChild(b); }
  $('toastwrap').appendChild(t);
  setTimeout(() => t.remove(), undo ? 7000 : isErr ? 6000 : 2200);
}
const fehler = (e, was) => { console.error(e); toast((was ? was + ': ' : '') + (e?.message || 'Unbekannter Fehler'), null, true); };

// ---------------------------------------------------------------------------
// Login / Rollen
// ---------------------------------------------------------------------------
let ROLLE = null, ME = null;
const isBuero = () => ROLLE === 'admin' || ROLLE === 'buero_team';
function zeigeNur(id){ ['loginwrap','pendingWrap','appMain'].forEach(x => $(x).classList.toggle('hidden', x !== id)); }
async function pruefeAnmeldung(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ zeigeNur('loginwrap'); return; }
  ME = session.user.id;
  const { data: b } = await sb.from('benutzer').select('rolle,email,anzeigename').eq('id', ME).maybeSingle();
  if(!b || !b.rolle){ zeigeNur('pendingWrap'); return; }
  ROLLE = b.rolle;
  $('userbar').classList.remove('hidden');
  $('userbarText').textContent = `${b.anzeigename || b.email} (${ROLLE_LABEL[b.rolle] || b.rolle})`;
  $('subnav').classList.remove('hidden');
  document.querySelectorAll('#subnav .buero').forEach(a => a.classList.toggle('hidden', !isBuero()));
  zeigeNur('appMain');
  await ladeAlles();
  await starteLive();
  route();
}
$('loginBtn').addEventListener('click', async () => {
  const st = $('loginStatus'); st.textContent = 'Melde an …'; st.className = 'status';
  const { error } = await sb.auth.signInWithPassword({ email: $('loginEmail').value.trim(), password: $('loginPassword').value });
  if(error){ st.textContent = 'Login fehlgeschlagen: ' + error.message; st.className = 'status err'; return; }
  await pruefeAnmeldung();
});
$('loginPassword').addEventListener('keydown', e => { if(e.key === 'Enter') $('loginBtn').click(); });
$('logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });
$('pendingLogoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

// ---------------------------------------------------------------------------
// Zeitachse: 1 Einheit = 1 Tag, jeder Tag zeigt 06:00–18:00.
// Halbtage: Vormittag 06–12, Nachmittag 12–18. Tag-Index ab D0 (Montag).
// ---------------------------------------------------------------------------
const heute = new Date(); heute.setHours(0,0,0,0);
const D0 = new Date(heute); D0.setDate(D0.getDate() - ((D0.getDay() + 6) % 7) - 7 * 8);
const NDAYS = 7 * 70;
const dDate = i => new Date(D0.getFullYear(), D0.getMonth(), D0.getDate() + i);
const dayIdx = dt => Math.round((Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()) - Date.UTC(D0.getFullYear(), D0.getMonth(), D0.getDate())) / 864e5);
const TODAY = dayIdx(heute);
const toU = ts => { const t = new Date(ts); const h = t.getHours() + t.getMinutes() / 60; return dayIdx(t) + Math.max(0, Math.min(1, (h - 6) / 12)); };

function setZoom(z){ if(z === zoom) return; const t = tlEl(); const a = t.scrollLeft / dayW, b = a + visW() / dayW; const tv = TODAY + 1 > a + .05 && TODAY < b - .05; const c = centerU(); zoom = z; lsSet('zoom', z); dayW = calcDayW(); renderRows(); scrollToU(c, 'center'); renderPlan(); if(tv) goToday(); }

  const r = resById(z.rid), weg = RESE.find(o => o.rid === z.rid && o.art === 'stamm_weg' && o.s === z.s && o.e === z.e);
  RESE = RESE.filter(o => o !== z && o !== weg); renderRows();
  const ids = [z.id, weg?.id].filter(x => x && !String(x).startsWith('tmp'));
  const { error } = ids.length ? await sb.from('planer_ressource_einsatz').delete().in('id', ids) : {}; if(error){ fehler(error, 'Entfernen'); await neuLaden(); return; }
  toast(`${resName(r)} zurück in die Ablage`, () => assignVeh(r, z.s, z.e, z.mid));
}
function openResPop(zid, rid, rect, u){
  const r = resById(rid); const ed = canEditRes(r.typ);
  if(zid.startsWith('stamm_')){
    const d = Math.floor(u); const wegs = RESE.filter(z => z.rid === rid && z.art === 'stamm_weg' && z.e > TODAY - 7).sort((a, b) => a.s - b.s);
    const pop = popAt(rect, `<b>${esc(resName(r))}</b><span class="muted small">Stammfahrzeug von ${esc(P[r.stamm_person_id]?.name || '')}. Gehört an allen Arbeitstagen zu ihr/ihm, ausser bei Absenz oder Freigabe.</span>
      ${isBuero() ? `<button class="btn btn-ghost" id="rpFrei">Am ${esc(dLab(d))} freigeben</button>` : ''}
      ${wegs.length ? `<span class="small muted">Freigegeben:</span>${wegs.map(z => `<span class="small" style="display:flex;gap:6px;align-items:center">${esc(spanLabel({ s: z.s, e: z.e }))}${isBuero() ? `<button class="icon-btn" data-wx="${z.id}" aria-label="Freigabe aufheben" style="margin-left:auto">${I('x')}</button>` : ''}</span>`).join('')}` : ''}`);
    const fb = pop.querySelector('#rpFrei'); if(fb) fb.onclick = async () => { closePop(); const ok = await resInsert({ ressource_id: rid, art: 'stamm_weg', person_id: r.stamm_person_id, beginn: fromU(d), ende: fromU(d + 1, true) }); if(ok) toast(`${resName(r)} am ${dLab(d)} frei`, () => resDelete(ok.id)); };
    pop.querySelectorAll('[data-wx]').forEach(b => b.onclick = async () => { closePop(); await resDelete(b.dataset.wx); });
    return;
  }
  const x = (RU[rid]?.list || []).find(o => o.id === zid); if(!x) return; const b = x.bau ? byId(x.bau) : null;
  if(x.masch && b){ // Maschine an Baustelle: fest/vorläufig, unterbrechen, tauschen (gleicher Typ), entfernen
    const z = RESE.find(o => o.id === zid), i = slotIdx(x.all, u), ps = z.pz || [], sav = row => sb.from('planer_ressource_einsatz').update(row).eq('id', zid);
    const teid = r.istTyp ? r.eid : r.typ_eid;
    const frei = RES.filter(m => m.typ === 'maschine' && m.aktiv && m.id !== rid && teid && m.typ_eid === teid && !x.slots.some(k => (RU[m.id]?.cnt[k] || 0) > 0));
    const ed2 = ed && (!openMid || b.mid === openMid);
    const pop = popAt(rect, `<b>${esc(resName(r))}</b><span class="muted small">${esc(titleOf(b))} · ${esc(P[b.mid]?.name || '')}<br>${z.fest ? 'Fest reserviert' : 'Vorläufig reserviert (Typ, noch ohne Nummer)'}${z.ab || z.bv ? ' · Teil der Baustelle' : ' · ganze Baustelle'}${ps.length ? ` · ${ps.length} Unterbruch` : ''}</span>
      ${ed2 ? `${r.istTyp ? '' : `<button class="btn btn-ghost" id="mpF" style="justify-content:flex-start">${I('lock')}Schloss öffnen (wieder vorläufig)</button>`}
      <button class="btn btn-ghost" id="mpU" style="justify-content:flex-start">${I('pause')}Hier 1 Tag unterbrechen</button>
      ${ps.length || z.ab || z.bv ? `<button class="btn btn-ghost" id="mpG" style="justify-content:flex-start">Wieder ganze Baustelle, ohne Unterbruch</button>` : ''}
      ${frei.length ? `<span class="small muted">${r.istTyp ? 'Fest reservieren – frei:' : `Frei, gleicher Typ (${esc(r.typ_planung)}):`}</span>${frei.map(m => `<button class="btn btn-ghost" data-swap="${m.id}" style="justify-content:flex-start">${r.istTyp ? I('lock') + esc(resName(m)) : 'Tauschen auf ' + esc(resName(m))}</button>`).join('')}` : r.istTyp ? '<span class="small" style="color:var(--red)">Keine Maschine dieses Typs frei</span>' : ''}
      <div style="display:flex;justify-content:flex-end"><button class="icon-btn danger" id="mpD" title="Reservierung löschen" aria-label="Reservierung löschen">${I('trash')}</button></div>` : ''}`);
    const on = (s, fn) => { const el = pop.querySelector(s); if(el) el.onclick = async () => { closePop(); await fn(); await neuLaden(); }; };
    on('#mpF', () => sav(r.typ_eid ? { ressource_id: null, typ_eintrag_id: r.typ_eid, fest: false } : { fest: false }));
    on('#mpU', () => sav({ pausen: [...ps, [i, Math.min(x.all.length, i + 2)]] }).then(() => toast(`${resName(r)} am ${dLab(x.all[i] >> 1)} nicht gebraucht`)));
    on('#mpG', () => sav({ ab_slot: 0, bis_vor_ende_slot: 0, pausen: [] }));
    pop.querySelectorAll('[data-swap]').forEach(bt => bt.onclick = async () => { closePop(); const { error } = await sav({ ressource_id: bt.dataset.swap, typ_eintrag_id: null, fest: true }); if(error) return fehler(error); await neuLaden(); toast(`${r.istTyp ? 'Fest' : 'Getauscht auf'} ${resName(resById(bt.dataset.swap))}`); });
    const del = pop.querySelector('#mpD'); if(del) del.onclick = () => { closePop(); bestaetige('Reservierung löschen?', `<div>${esc(resName(r))} · ${esc(labOf(b))}</div>`, 'Löschen', () => resDelete(zid)); };
    return; }
  const pop = popAt(rect, `<b>${esc(resName(r))}</b><span class="muted small">${r.typ === 'maschine' ? `${esc(b ? titleOf(b) : '')} · ${esc(b ? P[b.mid]?.name : '')}<br>${x.own ? esc(spanLabel({ s: x.s, e: x.e })) + ' (eigene Dauer)' : 'ganze Baustelle, wandert mit'}` : `${esc(P[x.mid]?.name || '')}<br>${esc(spanLabel({ s: x.s, e: x.e }))}`}</span>
    ${ed ? `${r.typ === 'maschine' && x.own ? '<button class="btn btn-ghost" id="rpGanz">Wieder ganze Baustelle</button>' : ''}${r.typ === 'maschine' && !x.own && b ? `<button class="btn btn-ghost" id="rpEigen">Nur ${esc(dLab(Math.floor(u)))}</button>` : ''}<button class="btn btn-danger" id="rpDel">${I('trash')}Entfernen</button>` : ''}`);
  const on = (s, fn) => { const el = pop.querySelector(s); if(el) el.onclick = fn; };
  on('#rpDel', async () => { closePop(); const z = RESE.find(o => o.id === zid); const ok = await resDelete(zid); if(ok && z) toast(`${resName(r)} entfernt`, () => resInsert({ ressource_id: z.rid, art: z.art, einsatz_id: z.eid, person_id: z.mid, beginn: z.s != null ? fromU(z.s) : null, ende: z.e != null ? fromU(z.e, true) : null })); });
  on('#rpGanz', async () => { closePop(); const { error } = await sb.from('planer_ressource_einsatz').update({ beginn: null, ende: null }).eq('id', zid); if(error) return fehler(error); await neuLaden(); });
  on('#rpEigen', async () => { closePop(); const d = Math.floor(u); const { error } = await sb.from('planer_ressource_einsatz').update({ beginn: fromU(d), ende: fromU(d + 1, true) }).eq('id', zid); if(error) return fehler(error); await neuLaden(); });
}

// ---------------------------------------------------------------------------
// MAGAZIN (Spalte rechts): Arbeiten auf Vorrat. Wer früher fertig ist, nimmt
// sich eine. Reihenfolge = Priorität, nur das Büro sortiert (am Griff ziehen,
// auch auf Kurz/Mittel/Lang = Kategorie wechseln). Mittel/Lang kann das Büro in
// den Plan ziehen; Balken in die Spalte ziehen = zurück ins Magazin.
// ---------------------------------------------------------------------------
let MAG = [], PZ = [], aufOpen = lsGet('aufOpen', true), magK = lsGet('magK', 'kurz'), magOpen = null, magAdd = false;
const MAGK = { kurz: ['Kurz', 'bis 2 Std.'], mittel: ['Mittel', '½–1 Tag'], lang: ['Lang', 'mehr als 1 Tag'] };
const personOf = uid => PERSONEN.find(p => p.benutzer_id === uid);
const creatorName = uid => personOf(uid)?.name || BENUTZER.find(b => b.id === uid)?.email || '';
const magList = k => MAG.filter(m => m.dauer === k).sort((a, b) => a.sort - b.sort);
const magMax = k => Math.max(0, ...MAG.filter(m => m.dauer === k).map(m => m.sort));
const magById = id => MAG.find(m => m.id === id);
function magRender(){ if(VIEW === 'plan') renderAuf(); else if(VIEW === 'handy') renderHandy(); }
function renderAuf(){
  const box = $('aufp'); if(!box) return;
  if(!aufOpen){ box.className = 'aufp zu'; box.innerHTML = `<button class="auftab" id="aufTog" title="Magazin öffnen">Magazin (${MAG.length})</button>`; $('aufTog').onclick = () => { aufOpen = true; lsSet('aufOpen', true); renderAuf(); recalc(); }; return; }
  box.className = 'aufp';
  box.innerHTML = `<div class="ahead"><b class="mtit">${I('box')}Magazin <span>${MAG.length}</span></b><button class="btn btn-ghost madd" id="magAddB">${I('plus')}Erfassen</button><button class="icon-btn" id="aufX" aria-label="Einklappen">${I('next')}</button></div>${magBody()}`;
  $('aufX').onclick = () => { aufOpen = false; lsSet('aufOpen', false); renderAuf(); recalc(); };
  bindMag(box);
}
function magBody(){
  const seg = `<div class="mseg" role="group" aria-label="Wie viel Zeit?">${Object.entries(MAGK).map(([k, [t, s]]) => `<button data-mk="${k}" class="${magK === k ? 'on' : ''}"><b>${t} <span>${magList(k).length}</span></b><small>${s}</small></button>`).join('')}</div>`;
  const add = magAdd ? `<div class="maddln"><input type="text" id="magIn" placeholder="Was ist zu tun? (${MAGK[magK][0]}, Enter)" autocomplete="off" enterkeyhint="done"><label class="icon-btn" title="Mit Foto erfassen" aria-label="Mit Foto erfassen">${I('camera')}<input type="file" accept="image/*" multiple hidden id="magInF"></label></div>` : '';
  const l = magList(magK);
  return seg + add + `<div class="mlist">${l.map(magRow).join('') || '<div class="aleer">Nichts im Magazin.</div>'}</div>`
    + `<div class="ahint">${isBuero() ? 'Zuoberst = am wichtigsten. Am Griff ziehen: sortieren, auf Kurz/Mittel/Lang verschieben oder (Mittel/Lang) in den Plan.' : 'Zuoberst = am wichtigsten.'}</div>`;
}
function magRow(m){
  const open = magOpen === m.id;
  const rep = m.wiederkehrend ? `<span class="mrep" title="Wiederkehrend${m.zuletzt_am ? ', zuletzt ' + dLab(toU(m.zuletzt_am) | 0) : ''}">${I('repeat')}</span>` : '';
  return `<div class="mrow${open ? ' open' : ''}" data-mag="${m.id}"><div class="mln">${isBuero() ? `<span class="mgrip" title="Ziehen">${I('grip')}</span>` : ''}<button class="mck" data-mck="${m.id}" aria-label="Erledigt: ${esc(m.titel)}">${I('check')}</button><span class="mt">${esc(m.titel)}</span>${rep}<span class="mchev">${I('chev')}</span></div>${open ? magDet(m) : ''}</div>`;
}
function magDet(m){
  const li = m.liste || [], fs = m.planer_datei || [];
  return `<div class="mdet">
    <div><span class="mh">Notiz</span><textarea id="mN-${m.id}" data-mnotiz="${m.id}" placeholder="Was ist zu beachten?">${esc(m.notiz || '')}</textarea></div>
    <div><span class="mh">Liste</span><div class="mcl">${li.map((c, i) => `<label class="${c.ok ? 'ok' : ''}"><input type="checkbox" data-mcl="${i}" ${c.ok ? 'checked' : ''}><span>${esc(c.t)}</span><button class="mclx" data-mclx="${i}" aria-label="Punkt entfernen">${I('x')}</button></label>`).join('')}<input type="text" id="mC-${m.id}" class="mcladd" placeholder="+ Punkt hinzufügen, Enter" enterkeyhint="done"></div></div>
    <div><span class="mh">Fotos</span><div class="mfotos">${fs.map(f => f.art === 'foto' ? `<div class="file" data-mf="${f.id}" title="${esc(f.name)}"><img alt=""><button class="icon-btn x danger" data-mfx="${f.id}" aria-label="Foto löschen">${I('x')}</button></div>` : `<div class="file mdok" data-mf="${f.id}" title="${esc(f.name)}">${I('file')}<button class="icon-btn x danger" data-mfx="${f.id}" aria-label="Datei löschen">${I('x')}</button></div>`).join('')}<label class="mfadd" title="Foto hinzufügen">${I('camera')}<input type="file" accept="image/*,application/pdf" multiple hidden class="mfup"></label></div></div>
    ${m.wiederkehrend && m.zuletzt_am ? `<span class="small muted">Zuletzt erledigt am ${esc(dLab(toU(m.zuletzt_am) | 0))}${m.zuletzt_von ? ' von ' + esc(first(creatorName(m.zuletzt_von))) : ''}</span>` : ''}
    ${isBuero() ? `<div class="madm"><button class="icon-btn${m.wiederkehrend ? ' on' : ''}" data-mrep title="${m.wiederkehrend ? 'Wiederkehrend (ein)' : 'Wiederkehrend (aus)'}" aria-label="Wiederkehrend ein- oder ausschalten" aria-pressed="${!!m.wiederkehrend}">${I('repeat')}</button><button class="icon-btn danger" data-mdel title="Löschen" aria-label="Löschen">${I('trash')}</button></div>` : ''}
  </div>`;
}
function bindMag(root){
  root.querySelectorAll('[data-mk]').forEach(b => b.onclick = () => { magK = b.dataset.mk; lsSet('magK', magK); magOpen = null; magRender(); });
  const ab = root.querySelector('#magAddB'); if(ab) ab.onclick = () => { magAdd = !magAdd; magRender(); if(magAdd) setTimeout(() => $('magIn')?.focus(), 0); };
  const mi = root.querySelector('#magIn'); if(mi) mi.onkeydown = e => { if(e.key === 'Enter'){ const t = mi.value.trim(); if(t) neueMag(t, []); } else if(e.key === 'Escape'){ magAdd = false; magRender(); } };
  const mf = root.querySelector('#magInF'); if(mf) mf.onchange = () => neueMag($('magIn')?.value.trim() || 'Neue Arbeit (Foto)', [...mf.files]);
  root.querySelectorAll('.mrow').forEach(r => {
    const m = magById(r.dataset.mag); if(!m) return;
    r.querySelector('.mln').onclick = e => { if(e.target.closest('.mck,.mgrip')) return; magOpen = magOpen === m.id ? null : m.id; magRender(); };
    r.querySelector('.mck').onclick = () => magErledigt(m);
    const g = r.querySelector('.mgrip'); if(g) g.addEventListener('pointerdown', e => { if(e.button !== 0) return; drag = { kind: 'mag', m, x0: e.clientX, y0: e.clientY, moved: false }; e.preventDefault(); });
    if(magOpen !== m.id) return;
    let nt; r.querySelector('[data-mnotiz]').oninput = e => { m.notiz = e.target.value; clearTimeout(nt); nt = setTimeout(() => magSpeichere(m, { notiz: m.notiz || null }), 700); };
    const saveListe = () => { magSpeichere(m, { liste: m.liste }); magRender(); };
    r.querySelectorAll('[data-mcl]').forEach(c => c.onchange = () => { m.liste[+c.dataset.mcl].ok = c.checked; saveListe(); });
    r.querySelectorAll('[data-mclx]').forEach(b => b.onclick = e => { e.preventDefault(); m.liste.splice(+b.dataset.mclx, 1); saveListe(); });
    const ca = r.querySelector('.mcladd'); ca.onkeydown = e => { if(e.key !== 'Enter') return; const t = ca.value.trim(); if(!t) return; (m.liste ||= []).push({ t, ok: false }); saveListe(); setTimeout(() => $('mC-' + m.id)?.focus(), 0); };
    r.querySelector('.mfup').onchange = e => magHoch(m, [...e.target.files]);
    const rp = r.querySelector('[data-mrep]'); if(rp) rp.onclick = async () => { m.wiederkehrend = !m.wiederkehrend; await magSpeichere(m, { wiederkehrend: m.wiederkehrend }); magRender(); toast(m.wiederkehrend ? 'Wiederkehrend: bleibt nach dem Abhaken im Magazin' : 'Einmalig: verschwindet nach dem Abhaken'); };
    const dl = r.querySelector('[data-mdel]'); if(dl) dl.onclick = () => magLoeschen(m);
    magFotos(m, r);
  });
}
async function magSpeichere(m, patch){ const { error } = await sb.from('planer_magazin').update(patch).eq('id', m.id); if(error){ fehler(error, 'Speichern'); return false; } return true; }
async function neueMag(titel, files){
  const { data, error } = await sb.from('planer_magazin').insert({ titel, dauer: magK, sort: magMax(magK) + 1, erstellt_von: ME }).select('*, planer_datei(id,art,name,storage_pfad)').single();
  if(error) return fehler(error, 'Erfassen');
  MAG.push(data); magAdd = false; magOpen = data.id; magRender();
  if(files.length) await magHoch(data, files);
  toast(`Erfasst unter ${MAGK[magK][0]}, zuunterst`);
}
function bestaetige(titel, html, ja, fn){
  const d = document.createElement('div'); d.className = 'dlg';
  d.innerHTML = `<div class="in" style="max-width:380px" role="dialog" aria-modal="true" aria-label="${esc(titel)}"><b style="font-size:15px">${esc(titel)}</b>${html}<div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-ghost" data-no>Abbrechen</button><button class="btn btn-primary" data-ja>${esc(ja)}</button></div></div>`;
  document.body.appendChild(d); const zu = () => d.remove();
  d.querySelector('[data-no]').onclick = zu; d.onclick = e => { if(e.target === d) zu(); };
  d.onkeydown = e => { if(e.key === 'Escape') zu(); };
  d.querySelector('[data-ja]').onclick = () => { zu(); fn(); }; d.querySelector('[data-ja]').focus();
}
function magErledigt(m){
  const li = m.liste || [], offen = li.filter(c => !c.ok).length;
  bestaetige('Ist wirklich alles erledigt?', `<div style="font-weight:600">${esc(m.titel)}</div>${offen ? `<div class="info warn">In der Liste sind noch ${offen} von ${li.length} Punkten offen.</div>` : ''}<div class="small muted">${m.wiederkehrend ? 'Die Arbeit bleibt im Magazin und kommt ans Ende der Liste.' : 'Die Arbeit verschwindet aus dem Magazin.'}</div>`, 'Ja, erledigt', async () => {
    const jetzt = new Date().toISOString();
    const alt = m.wiederkehrend ? { sort: m.sort, zuletzt_am: m.zuletzt_am, zuletzt_von: m.zuletzt_von, liste: li } : { erledigt_am: null, erledigt_von: null };
    const patch = m.wiederkehrend ? { sort: magMax(m.dauer) + 1, zuletzt_am: jetzt, zuletzt_von: ME, liste: li.map(c => ({ ...c, ok: false })) } : { erledigt_am: jetzt, erledigt_von: ME };
    if(!await magSpeichere(m, patch)) return;
    magOpen = null; await neuLaden();
    toast((m.wiederkehrend ? 'Erledigt, wieder ans Ende: ' : 'Erledigt: ') + m.titel, async () => { await magSpeichere(m, alt); await neuLaden(); });
  });
}
function magLoeschen(m){
  bestaetige('Arbeit löschen?', `<div style="font-weight:600">${esc(m.titel)}</div><div class="small muted">Sie wird ganz aus dem Magazin entfernt${m.wiederkehrend ? ', auch für später' : ''}. Fotos werden mitgelöscht.</div>`, 'Löschen', async () => {
    const pf = (m.planer_datei || []).map(f => f.storage_pfad);
    const { error } = await sb.from('planer_magazin').delete().eq('id', m.id); if(error) return fehler(error, 'Löschen');
    if(pf.length) await sb.storage.from('planer-dateien').remove(pf);
    magOpen = null; MAG = MAG.filter(x => x.id !== m.id); magRender(); toast('Gelöscht: ' + m.titel);
  });
}
async function magHoch(m, files){
  for(const f of files){
    const isPdf = f.type === 'application/pdf', fid = crypto.randomUUID();
    const ext = isPdf ? 'pdf' : (f.name.split('.').pop() || 'jpg').toLowerCase(), pfad = `magazin/${m.id}/${fid}.${ext}`;
    toast('Lade hoch: ' + f.name);
    const { error } = await sb.storage.from('planer-dateien').upload(pfad, f, { contentType: f.type }); if(error){ fehler(error, 'Hochladen'); continue; }
    const { data, error: e2 } = await sb.from('planer_datei').insert({ id: fid, magazin_id: m.id, art: isPdf ? 'pdf' : 'foto', name: f.name, storage_pfad: pfad }).select('id,art,name,storage_pfad').single();
    if(e2){ fehler(e2); continue; } (m.planer_datei ||= []).push(data);
  }
  magRender();
}
async function magFotos(m, r){
  const fs = m.planer_datei || []; if(!fs.length) return;
  const { data } = await sb.storage.from('planer-dateien').createSignedUrls(fs.map(f => f.storage_pfad), 3600);
  const url = {}; (data || []).forEach(x => url[x.path] = x.signedUrl);
  r.querySelectorAll('[data-mf]').forEach(el => { const f = fs.find(x => x.id === el.dataset.mf); if(!f) return; const u = url[f.storage_pfad]; const img = el.querySelector('img'); if(img && u) img.src = u;
    el.onclick = e => { if(e.target.closest('[data-mfx]') || !u) return; if(f.art !== 'foto'){ window.open(u, '_blank'); return; }
      const lb = document.createElement('div'); lb.className = 'lbox'; lb.innerHTML = `<img src="${esc(u)}" alt=""><button class="icon-btn x" aria-label="Schliessen">${I('x')}</button>`; lb.onclick = () => lb.remove(); document.body.appendChild(lb); }; });
  r.querySelectorAll('[data-mfx]').forEach(b => b.onclick = async () => { const f = fs.find(x => x.id === b.dataset.mfx);
    const { error } = await sb.from('planer_datei').delete().eq('id', f.id); if(error) return fehler(error);
    await sb.storage.from('planer-dateien').remove([f.storage_pfad]); m.planer_datei = fs.filter(x => x.id !== f.id); magRender(); });
}
// Ziehen im Magazin: Reihenfolge, Kategorie oder in den Plan
async function magSort(m, zielId, vorher){
  const l = magList(m.dauer).filter(x => x.id !== m.id), i = l.findIndex(x => x.id === zielId); if(i < 0) return;
  const a = vorher ? l[i - 1] : l[i], b = vorher ? l[i] : l[i + 1];
  const s = a && b ? (a.sort + b.sort) / 2 : a ? a.sort + 1 : b.sort - 1;
  const alt = m.sort; m.sort = s; magRender();
  if(!await magSpeichere(m, { sort: s })){ m.sort = alt; magRender(); }
}
async function magKategorie(m, k){
  const alt = { dauer: m.dauer, sort: m.sort }; m.dauer = k; m.sort = magMax(k) + 1; magOpen = null; magRender();
  if(!await magSpeichere(m, { dauer: m.dauer, sort: m.sort })){ Object.assign(m, alt); magRender(); return; }
  toast(`Verschoben nach ${MAGK[k][0]} (zuunterst)`, async () => { Object.assign(m, alt); await magSpeichere(m, alt); magRender(); });
}

function waehleArt(art){

function sortTarget(d, y){

async function sortApply(d){

    const ids = GRUPPEN.map(g => g.id).filter(id => id !== d.gid); const ti = ids.indexOf(t.gid); ids.splice(t.before ? ti : ti + 1, 0, d.gid);

// Fotos und Dokumente des Auftrags (eigene Dateien, gleiche Darstellung wie beim Pflege-Kunden)
async function renderFiles(it){
  const fBox = $('pFotos'), dBox = $('pDoks'); if(!fBox && !dBox) return;
  const fs = it.files || [], fotos = fs.filter(f => f.art === 'foto'), doks = fs.filter(f => f.art !== 'foto');

  setN('a-fot', fotos.length); setN('a-dok', doks.length);
  const { data } = fs.length ? await sb.storage.from('planer-dateien').createSignedUrls(fs.map(f => f.storage_pfad), 3600) : { data: [] };
  const url = {}; (data || []).forEach(x => url[x.path] = x.signedUrl);
  const ed = canEdit(it.mid), del = f => ed ? `<button class="icon-btn x danger" data-fx="${f.id}" aria-label="Datei löschen">${I('x')}</button>` : '';
  if(fBox) fBox.innerHTML = fotos.map(f => `<div class="file" data-f="${f.id}" title="${esc(f.name)}"><img src="${esc(url[f.storage_pfad] || '')}" alt="">${del(f)}</div>`).join('') || '<span class="small muted">Keine</span>';
  if(dBox) dBox.innerHTML = doks.map(f => `<div class="dokrow"><button class="dokl" data-f="${f.id}">${I('file')}${esc(f.name)}</button>${del(f)}</div>`).join('') || '<span class="small muted">Keine</span>';
  $('side').querySelectorAll('[data-f]').forEach(el => el.onclick = e => { if(e.target.closest('[data-fx]')) return; const f = fs.find(x => x.id === el.dataset.f); const u = url[f.storage_pfad]; if(!u) return;
    if(f.art !== 'foto'){ window.open(u, '_blank'); return; }
    const lb = document.createElement('div'); lb.className = 'lbox'; lb.innerHTML = `<img src="${esc(u)}" alt=""><button class="icon-btn x" aria-label="Schliessen">${I('x')}</button>`; lb.onclick = () => lb.remove(); document.body.appendChild(lb); });
  $('side').querySelectorAll('[data-fx]').forEach(b => b.onclick = async () => { const f = fs.find(x => x.id === b.dataset.fx);
    const { error } = await sb.from('planer_datei').delete().eq('id', f.id); if(error){ fehler(error); return; }
    await sb.storage.from('planer-dateien').remove([f.storage_pfad]); it.files = fs.filter(x => x.id !== f.id); renderFiles(it); });
}
async function ladeHoch(it, files){
  for(const f of files){
    const isPdf = f.type === 'application/pdf'; const fid = crypto.randomUUID();
    const ext = isPdf ? 'pdf' : (f.name.split('.').pop() || 'jpg').toLowerCase();
    const pfad = `${it.id}/${fid}.${ext}`;
    toast('Lade hoch: ' + f.name);
    const { error } = await sb.storage.from('planer-dateien').upload(pfad, f, { contentType: f.type });
    if(error){ fehler(error, 'Hochladen'); continue; }
    const { data, error: e2 } = await sb.from('planer_datei').insert({ id: fid, einsatz_id: it.id, art: isPdf ? 'pdf' : 'foto', name: f.name, storage_pfad: pfad }).select().single();
    if(e2){ fehler(e2); continue; }
    (it.files ||= []).push(data);
  }
  renderFiles(it);
}

const wdhFelder = m => ({ kind: m.kind, kid: m.kid, title: m.title, text: m.text, pl: m.pl, ok: m.ok, link: m.link, allein: m.allein });
const wdhTag = o => o.rep ? o.d : Math.floor(o.s + 1e-9);
async function wdhSpeichern(m, wdh){ const { error } = await sb.from('planer_einsatz').update({ wdh }).eq('id', m.id); if(error){ fehler(error, 'Speichern'); return false; } m.wdh = wdh; return true; }
function wdhFrage(titel, fn){
  const d = document.createElement('div'); d.className = 'dlg';
  d.innerHTML = `<div class="in" style="max-width:360px" role="dialog" aria-modal="true" aria-label="${esc(titel)}"><b style="font-size:15px">${esc(titel)}</b><span class="small muted">Das ist ein wiederkehrender Eintrag.</span>
    <button class="btn btn-ghost" data-w="nur" style="justify-content:flex-start">Nur diesen</button><button class="btn btn-ghost" data-w="folgende" style="justify-content:flex-start">Diesen und alle folgenden</button>
    <div style="display:flex;justify-content:flex-end"><button class="btn btn-ghost" data-w="">Abbrechen</button></div></div>`;
  document.body.appendChild(d); const zu = () => d.remove();
  d.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { zu(); if(b.dataset.w) fn(b.dataset.w); });
  d.onclick = e => { if(e.target === d) zu(); }; d.onkeydown = e => { if(e.key === 'Escape') zu(); };
  d.querySelector('[data-w="nur"]').focus();
}
function wdhVerschieben(o, neu){
  const m = o.rep ? byId(o.rep) : o; if(!m || !m.wdh) return; const tag = wdhTag(o), d0 = Math.floor(m.s + 1e-9);
  wdhFrage('Verschieben', async art => {
    if(art === 'nur'){ // Termin aus der Serie nehmen, an der neuen Stelle als normaler Eintrag
      if(!await wdhSpeichern(m, { ...m.wdh, aus: [...(m.wdh.aus || []), isoDate(tag)] })) return;
      await neuerEinsatz({ ...wdhFelder(m), mid: neu.mid, s: neu.s, e: neu.e }, false); await neuLaden(); toast('Nur dieser Termin verschoben'); return; }
    const delta = Math.floor(neu.s + 1e-9) - tag;
    const r = { ...m.wdh, aus: (m.wdh.aus || []).filter(x => fromIso(x) > tag).map(x => isoDate(fromIso(x) + delta)) };
    if(r.u === 'w' && r.days) r.days = r.days.map(x => ((x + delta) % 7 + 7) % 7);
    if(tag === d0){ // ab dem ersten Termin = ganze Serie verschieben
      const { error } = await sb.from('planer_einsatz').update({ beginn: fromU(neu.s), ende: fromU(neu.e, true), person_id: neu.mid, wdh: r }).eq('id', m.id);
      if(error) return fehler(error, 'Verschieben'); await neuLaden(); toast('Ganze Serie verschoben'); return; }
    if(r.ende === 'anzahl'){ const vorher = 1 + wdhTage(m, true).filter(x => x.d < tag).length; r.anzahl = Math.max(1, (m.wdh.anzahl || 1) - vorher); }
    if(!await wdhSpeichern(m, { ...m.wdh, ende: 'bis', bis: isoDate(tag - 1), anzahl: null })) return;
    await neuerEinsatz({ ...wdhFelder(m), mid: neu.mid, s: neu.s, e: neu.e, wdh: r }, false); await neuLaden(); toast('Ab diesem Termin verschoben');
  });
}
async function wdhLoeschen(o, art){
  const m = o.rep ? byId(o.rep) : o; if(!m || !m.wdh) return; const tag = wdhTag(o), d0 = Math.floor(m.s + 1e-9), alt = m.wdh;
  if(art === 'folgende' && tag === d0) return loescheEinsatz(m);
  const neu = art === 'nur' ? { ...alt, aus: [...(alt.aus || []), isoDate(tag)] } : { ...alt, ende: 'bis', bis: isoDate(tag - 1), anzahl: null };
  if(!await wdhSpeichern(m, neu)) return; renderRows();
  toast(art === 'nur' ? `Termin am ${dLab(tag)} gelöscht` : `Ab ${dLab(tag)} gelöscht`, async () => { if(await wdhSpeichern(m, alt)) renderRows(); });
}
// Das kleine Feld hinter dem Pfeil-Symbol im Detailfeld: Vorlage, Benutzerdefiniert, Ende, Feiertage
function openWdh(it, btn){
  if($('popwrap').querySelector('.wdhp')){ closePop(); return; }
  const d0 = Math.floor(it.s + 1e-9), a = dDate(d0), wd = a.getDay(), nth = Math.ceil(a.getDate() / 7);
  const PR = [['none', 'Nicht wiederholen'], ['w1', `Jede Woche am ${WDL[wd]}`], ['w2', `Alle 2 Wochen am ${WDL[wd]}`], ['mn', `Jeden Monat am ${nth}. ${WDL[wd]}`], ['ml', `Jeden Monat am letzten ${WDL[wd]}`],
    ['md', `Jeden Monat am ${a.getDate()}.`], ['y', `Jedes Jahr am ${a.getDate()}. ${MONL[a.getMonth()]}`], ['wt', 'Jeden Werktag (Mo–Fr)'], ['custom', 'Benutzerdefiniert …']];
  const VOR = { w1: { u: 'w', n: 1, days: [wd] }, w2: { u: 'w', n: 2, days: [wd] }, mn: { u: 'm', n: 1, mm: 'nth' }, ml: { u: 'm', n: 1, mm: 'last' }, md: { u: 'm', n: 1, mm: 'date' }, y: { u: 'y', n: 1 }, wt: { u: 'w', n: 1, days: [1, 2, 3, 4, 5] } };
  let r = it.wdh ? JSON.parse(JSON.stringify(it.wdh)) : { p: 'none', u: 'w', n: 1, days: [wd], mm: 'date', ende: 'nie', fe: 'skip', aus: [] };
  const pop = popAt(btn.getBoundingClientRect(), '<div class="wdhp"></div>'), box = pop.querySelector('.wdhp');
  const WDK = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  const zus = () => { if(r.p === 'none') return 'Einmaliger Eintrag';
    const n = 1 + wdhTage({ ...it, wdh: r }, true).length; return r.ende === 'nie' ? 'Ohne Ende' : `${n} ${n === 1 ? 'Termin' : 'Termine'}${r.ende === 'bis' ? ' bis ' + r.bis.split('-').reverse().join('.') : ''}`; };
  const draw = () => {
    const c = r.p === 'custom', on = r.p !== 'none';
    box.innerHTML = `<select id="wP" aria-label="Wiederholung">${PR.map(([k, l]) => `<option value="${k}"${r.p === k ? ' selected' : ''}>${l}</option>`).join('')}</select>
      ${c ? `<div class="wrow">Alle <input type="number" id="wN" min="1" max="12" value="${r.n || 1}" aria-label="Anzahl"><select id="wU" aria-label="Einheit"><option value="w"${r.u === 'w' ? ' selected' : ''}>Wochen</option><option value="m"${r.u === 'm' ? ' selected' : ''}>Monate</option><option value="y"${r.u === 'y' ? ' selected' : ''}>Jahre</option></select></div>
        ${r.u === 'w' ? `<div class="wtage">${[1, 2, 3, 4, 5, 6, 0].map(x => `<button data-t="${x}" class="${(r.days || []).includes(x) ? 'on' : ''}" aria-pressed="${(r.days || []).includes(x)}" title="${WDL[x]}">${WDK[x]}</button>`).join('')}</div>` : ''}
        ${r.u === 'm' ? `<div class="wrad">${[['date', `am ${a.getDate()}.`], ['nth', `am ${nth}. ${WDL[wd]}`], ['last', `am letzten ${WDL[wd]}`]].map(([k, l]) => `<label><input type="radio" name="wM" value="${k}"${r.mm === k ? ' checked' : ''}>${l}</label>`).join('')}</div>` : ''}` : ''}
      ${on ? `<span class="wlab">Ende</span><div class="wrad">
        <label><input type="radio" name="wE" value="nie"${r.ende === 'nie' ? ' checked' : ''}>Ohne Ende</label>
        <label><input type="radio" name="wE" value="bis"${r.ende === 'bis' ? ' checked' : ''}>Bis <input type="date" id="wB" value="${r.bis || isoDate(d0 + 91)}"></label>
        <label><input type="radio" name="wE" value="anzahl"${r.ende === 'anzahl' ? ' checked' : ''}>Nach <input type="number" id="wA" min="1" max="200" value="${r.anzahl || 10}"> Terminen</label></div>
        <span class="wlab">An Feiertagen</span><select id="wF" aria-label="An Feiertagen"><option value="skip"${r.fe === 'skip' ? ' selected' : ''}>Auslassen</option><option value="next"${r.fe === 'next' ? ' selected' : ''}>Auf nächsten Werktag verschieben</option><option value="keep"${r.fe === 'keep' ? ' selected' : ''}>Trotzdem eintragen</option></select>` : ''}
      <b class="wsum">${esc(zus())}</b>`;
    const q = s => box.querySelector(s);
    q('#wP').onchange = e => { r.p = e.target.value; if(VOR[r.p]) Object.assign(r, VOR[r.p]); if(r.p === 'custom' && !r.u) Object.assign(r, VOR.w1); speichern(); };

    if(q('#wU')) q('#wU').onchange = e => { r.u = e.target.value; if(r.u === 'w' && !(r.days || []).length) r.days = [wd]; if(r.u === 'm' && !r.mm) r.mm = 'date'; speichern(); };
    box.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { const x = +b.dataset.t, s = new Set(r.days || []); s.has(x) ? s.delete(x) : s.add(x); if(!s.size) s.add(wd); r.days = [...s]; speichern(); });

    box.querySelectorAll('[name=wE]').forEach(x => x.onchange = () => { r.ende = x.value; if(r.ende === 'bis' && !r.bis) r.bis = q('#wB').value; if(r.ende === 'anzahl' && !r.anzahl) r.anzahl = +q('#wA').value || 10; speichern(); });

    if(q('#wA')) q('#wA').onchange = e => { r.anzahl = Math.max(1, +e.target.value || 1); r.ende = 'anzahl'; speichern(); };

  };
  const speichern = async () => { const v = r.p === 'none' ? null : { ...r };
    if(v && v.ende === 'bis' && !v.bis) v.bis = isoDate(d0 + 91);
    if(!await wdhSpeichern(it, v)) return; const cur = byId(it.id); if(cur && cur !== it) cur.wdh = v;
    draw(); renderRows(); const b = $('pWdh'); if(b){ b.classList.toggle('on', !!v); b.setAttribute('aria-pressed', !!v); } };
  draw();
  pop.style.left = Math.max(8, btn.getBoundingClientRect().right - pop.offsetWidth) + 'px';
}

// Sprechen: Spracherkennung des Browsers (Chrome / Safari); sonst Mikrofon der Handy-Tastatur
let diktat = null;
function diktiere(inp){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('Sprechen: bitte das Mikrofon auf der Tastatur verwenden.'); return; }
  try{ diktat?.stop(); }catch(e){}
  const r = new SR(); diktat = r; r.lang = 'de-CH'; r.interimResults = true; r.continuous = false;
  const vorher = inp.value ? inp.value + ' ' : ''; inp.classList.add('hoert');
  r.onresult = e => { inp.value = vorher + [...e.results].map(x => x[0].transcript).join(''); };
  r.onerror = e => { inp.classList.remove('hoert'); if(e.error === 'not-allowed') toast('Mikrofon ist nicht erlaubt. Bitte im Browser freigeben oder das Mikrofon der Tastatur verwenden.', null, true); };
  r.onend = () => { inp.classList.remove('hoert'); inp.placeholder = 'Neue Pendenz …'; };
  try{ r.start(); }catch(e){ inp.classList.remove('hoert'); }
}
async function pzFotoHoch(pid, files){
  const z = PZ.find(x => x.id === pid); if(!z) return;
  for(const f of files){
    const fid = crypto.randomUUID(), ext = (f.name.split('.').pop() || 'jpg').toLowerCase(), pfad = `pendenz/${pid}/${fid}.${ext}`;
    toast('Lade hoch: ' + f.name);
    const { error } = await sb.storage.from('planer-dateien').upload(pfad, f, { contentType: f.type }); if(error){ fehler(error, 'Hochladen'); continue; }
    const { data, error: e2 } = await sb.from('planer_datei').insert({ id: fid, pendenz_id: pid, art: 'foto', name: f.name, storage_pfad: pfad }).select('id,art,name,storage_pfad').single();
    if(e2){ fehler(e2); continue; } (z.planer_datei ||= []).push(data);
  }
  renderHandy(); toast('Foto gespeichert');
}
async function pzFotosZeigen(){
  const els = [...document.querySelectorAll('[data-pf]')]; if(!els.length) return;
  const fs = els.map(el => (PZ.find(z => z.id === el.dataset.pz)?.planer_datei || []).find(f => f.id === el.dataset.pf)).filter(Boolean);
  const { data } = await sb.storage.from('planer-dateien').createSignedUrls(fs.map(f => f.storage_pfad), 3600);

function mCard(it, d){

async function mFiles(card){

function frage(titel, wert){

  box.innerHTML = `<h2>Absenz-Typen</h2><p class="hint">Jeder Typ bekommt einen von sechs gut unterscheidbaren Grautönen, auf Wunsch gestreift. Der Typ steht auch als Text auf dem Balken. Beim Eintragen: ziehen, 4 drücken, dann die Nummer des Typs.</p>
    <div class="card" style="margin-top:12px;padding:4px 14px">${ABST.map((t, i) => `<div class="abrow"><b class="small muted">${i + 1}</b><input type="text" data-an="${t.id}" value="${esc(t.name)}" aria-label="Name">
      <div class="greys">${GREYS.map((c, j) => `<button data-ag="${t.id}" data-g="${j}" class="${t.grauton === j ? 'on' : ''}" style="background:${c}" aria-label="Grauton ${j + 1}"></button>`).join('')}<button data-as="${t.id}" class="stp${t.gestreift ? ' on' : ''}" title="gestreift" aria-label="gestreift"></button></div>
      <span class="prev" style="background:${absStyle(t.name).bg};color:${absStyle(t.name).fg}">${esc(t.name)}</span>
      <span class="acts"><button class="icon-btn" data-au="${t.id}" aria-label="Nach oben" ${i === 0 ? 'disabled' : ''}>${I('up')}</button><button class="icon-btn danger" data-ax="${t.id}" aria-label="Löschen">${I('trash')}</button></span></div>`).join('')}</div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><input type="text" id="aNeu" placeholder="Neuer Typ, z. B. Weiterbildung"><button class="btn btn-primary" id="aAdd">${I('plus')}Hinzufügen</button></div>`;
  $('appMain').appendChild(box);
  const upd = async (id, row) => { const { error } = await sb.from('planer_absenz_typ').update(row).eq('id', id); if(error) return fehler(error); await neuLaden(); };
  box.querySelectorAll('[data-ag]').forEach(b => b.onclick = () => upd(b.dataset.ag, { grauton: +b.dataset.g }));
  box.querySelectorAll('[data-as]').forEach(b => b.onclick = () => upd(b.dataset.as, { gestreift: !ABST.find(t => t.id === b.dataset.as).gestreift }));
  box.querySelectorAll('[data-an]').forEach(i => i.onchange = () => { const n = i.value.trim(); if(n) upd(i.dataset.an, { name: n }); });
  box.querySelectorAll('[data-au]').forEach(b => b.onclick = async () => { const l = [...ABST]; const k = l.findIndex(t => t.id === b.dataset.au); if(k < 1) return; [l[k - 1], l[k]] = [l[k], l[k - 1]]; await Promise.all(l.map((t, j) => sb.from('planer_absenz_typ').update({ sortierung: (j + 1) * 10 }).eq('id', t.id))); await neuLaden(); });
  box.querySelectorAll('[data-ax]').forEach(b => b.onclick = async () => { const { error } = await sb.from('planer_absenz_typ').delete().eq('id', b.dataset.ax); if(error) return fehler(error); await neuLaden(); });
  $('aAdd').onclick = async () => { const n = $('aNeu').value.trim(); if(!n) return; const { error } = await sb.from('planer_absenz_typ').insert({ name: n, grauton: 2, sortierung: 10 + Math.max(0, ...ABST.map(t => t.sortierung)) }); if(error) return fehler(error); await neuLaden(); };
}

// ---------------------------------------------------------------------------
// Live-Abgleich: Änderungen anderer erscheinen sofort
// ---------------------------------------------------------------------------
let reloadT = null;
async function neuLaden(){ await ladeAlles(); if(drag) return; if(boardRef) renderBoard(); if(VIEW === 'plan'){ renderRows(); renderChips(); renderAuf(); if(selId && !byId(selId)) closePanel(); } else render(); }
async function starteLive(){
  // Live-Verbindung braucht das Login-Ticket, sonst gilt sie als anonym und die Rechte filtern alles weg
  const { data: { session } } = await sb.auth.getSession(); if(session) await sb.realtime.setAuth(session.access_token);
  sb.auth.onAuthStateChange((ev, s) => { if(s && (ev === 'TOKEN_REFRESHED' || ev === 'SIGNED_IN')) sb.realtime.setAuth(s.access_token); });
  const ch = sb.channel('einsatzplaner');
  ['planer_einsatz', 'planer_person', 'planer_gruppe', 'planer_feiertag', 'planer_ressource', 'planer_ressource_einsatz', 'planer_magazin', 'planer_pendenz', 'planer_absenz_typ', 'planer_vorschlag_notiz'].forEach(t =>
    ch.on('postgres_changes', { event: '*', schema: 'public', table: t }, () => { clearTimeout(reloadT); reloadT = setTimeout(() => { if(drag){ reloadT = setTimeout(neuLaden, 800); return; } if(document.activeElement && ($('side').contains(document.activeElement) || document.activeElement.closest?.('.mdet,.maddln'))) return; neuLaden(); }, 500); }));
  ch.subscribe();
  // Beim Zurückkommen auf die Seite (Handy entsperrt) frisch laden
  document.addEventListener('visibilitychange', () => { if(!document.hidden) neuLaden(); });
}
let rzT; addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if(VIEW === 'plan'){ const c = centerU(); dayW = calcDayW(); renderRows(); scrollToU(c, 'center'); } }, 200); });

pruefeAnmeldung();
})();
</script>
