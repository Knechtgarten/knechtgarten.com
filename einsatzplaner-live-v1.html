<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Einsatzplaner – Knechtgarten</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg:#F5F7F9; --card:#FFFFFF; --primary:#323E4E; --primary-l:#4C5C70;
  --ink:#232B35; --muted:#8B9097; --line:#E1E5E9; --soft:#EEF3F7;
  --accent-blue:#D6E7F4; --accent-lime:#D1DB5F; --danger:#B4655F; --red:#C0392B;
  --namew:225px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);line-height:1.45;font-size:13px;}
.wrap{max-width:1400px;margin:0 auto;padding:0 16px;}
.hidden{display:none !important;}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;}

header.app{background:var(--primary);color:#fff;}
header.app .wrap{display:flex;align-items:center;gap:20px;max-width:none;}
header.app .backlink{display:inline-flex;align-items:center;gap:5px;color:var(--primary);text-decoration:none;font-size:12px;font-weight:700;flex-shrink:0;background:var(--accent-lime);border-radius:20px;padding:6px 12px;}
header.app .brand{padding:11px 0;}
header.app .brand h1{font-size:15px;font-weight:600;color:#fff;}
header.app .brand .sub{font-size:11px;opacity:.75;margin-top:1px;}
header.app .userbar{display:flex;align-items:center;gap:10px;margin-left:auto;}
header.app .userbar span{opacity:.85;font-size:11.5px;}
header.app .userbar button{font-size:11.5px;color:#c7ccd1;background:none;border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:3px 9px;cursor:pointer;}
nav.subnav{background:#fff;border-bottom:1px solid var(--line);}
nav.subnav .wrap{display:flex;gap:2px;max-width:none;overflow-x:auto;}
nav.subnav a{display:flex;align-items:center;gap:7px;padding:12px 12px 10px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;text-decoration:none;font-size:12.5px;white-space:nowrap;cursor:pointer;}
nav.subnav a:hover{color:var(--primary);}
nav.subnav a.on{color:var(--primary);border-bottom-color:var(--primary);}
nav.subnav a .i{width:16px;height:16px;}

input[type=text],input[type=date],input[type=search],select,textarea{font:inherit;font-size:12.5px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 8px;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);}
.btn{border:none;border-radius:7px;padding:7px 14px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-l);}
.btn-ghost{background:#fff;color:var(--primary);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--primary);}
.btn-danger{background:#fff;color:var(--danger);border:1px solid #E6CFCC;}
.btn .i{width:15px;height:15px;}
.icon-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;flex:none;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--muted);box-sizing:border-box;}
.icon-btn .i{width:14px;height:14px;}
.icon-btn:hover{border-color:var(--primary);color:var(--primary);}
.icon-btn.danger:hover{border-color:var(--danger);color:var(--danger);background:#FBEFEC;}
.icon-btn.on{background:var(--primary);color:#fff;border-color:var(--primary);}
.seg{display:inline-flex;}
.seg button{all:unset;cursor:pointer;padding:5px 11px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--primary);}
.seg button + button{border-left:0;}
.seg button:first-child{border-radius:6px 0 0 6px;}
.seg button:last-child{border-radius:0 6px 6px 0;}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff;border-color:var(--primary);}
.muted{color:var(--muted);} .small{font-size:11.5px;}
.hint{font-size:11.5px;color:var(--muted);}
.card{background:#fff;border:1px solid var(--line);border-radius:11px;}

/* Login */
.loginwrap{min-height:80vh;display:flex;align-items:center;justify-content:center;}
.logincard,.pendingcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:28px 26px;width:100%;max-width:330px;}
.logincard h2,.pendingcard h2{font-size:16px;color:var(--primary);margin-bottom:14px;}
.logincard .fld{margin-bottom:10px;}
.logincard label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;}
.logincard input{width:100%;}
.status{font-size:11.5px;color:var(--muted);margin-top:6px;} .status.err{color:var(--danger);}

/* Werkzeugleiste */
.bar-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px 8px;}
.range{font-weight:700;color:var(--primary);font-size:13.5px;margin:0 4px;white-space:nowrap;}
.bar-top .sp{flex:1;}
.chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center;}
.chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:11.5px;}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block;}
.chip[aria-pressed="true"]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);}
.legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:0 16px 8px;font-size:11px;color:var(--muted);}
.legend .lg{display:inline-flex;gap:5px;align-items:center;}
.legend .sw{width:16px;height:9px;border-radius:2px;border:1px solid rgba(50,62,78,.25);display:inline-block;}

/* Planer-Raster */
.tl{position:relative;overflow:auto;background:#fff;border-top:1px solid var(--line);height:calc(100vh - 200px);min-height:300px;}
.grid{position:relative;}
.hdr{position:sticky;top:0;z-index:6;display:flex;background:#fff;border-bottom:1px solid var(--line);}
.hdr .corner{position:sticky;left:0;z-index:7;width:var(--namew);flex:none;background:#fff;border-right:1px solid var(--line);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;display:flex;align-items:flex-end;padding:0 10px 5px;}
.hlane{position:relative;flex:none;}
.hc{position:absolute;overflow:hidden;white-space:nowrap;text-overflow:clip;font-size:10.5px;color:var(--muted);border-left:1px solid var(--line);padding:0 4px;}
.hc.t1{top:0;height:20px;line-height:20px;font-weight:700;color:var(--primary);}
.hc.t2{top:20px;height:20px;line-height:20px;text-align:center;}
.hc.t3{top:40px;height:15px;line-height:15px;text-align:center;font-size:9.5px;}
.hc.we{background:#F3F5F7;} .hc.fe{background:#F6F2E6;} .hc.td{background:#F2F5D6;color:var(--primary);font-weight:700;}
.row{display:flex;border-bottom:1px solid #EEF1F3;}
.row .nm{position:sticky;left:0;z-index:4;width:var(--namew);flex:none;background:#fff;border-right:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 8px 0 10px;font-size:12px;white-space:nowrap;overflow:hidden;}
.row .nm .n{overflow:hidden;text-overflow:ellipsis;font-weight:600;}
.row .nm .z{font-size:10.5px;color:var(--muted);flex:none;}
.row .nm .dot{width:9px;height:9px;border-radius:2px;flex:none;border:1px solid rgba(50,62,78,.25);}
.row .nm .me{font-size:9.5px;background:var(--accent-lime);color:var(--primary);border-radius:3px;padding:0 4px;font-weight:700;}
.row.grp .nm{background:var(--primary);color:#fff;font-weight:700;cursor:pointer;font-size:11.5px;}
.row.grp .nm .i{width:13px;height:13px;transition:transform .15s;}
.row.grp.zu .nm .i{transform:rotate(-90deg);}
.row.grp .lane{background:#F7F9FA;}
.lane{position:relative;flex:none;height:24px;}
.lane.ed{cursor:crosshair;}
.tdl{position:absolute;top:0;bottom:0;width:2px;background:var(--accent-lime);pointer-events:none;z-index:1;}
.fel{position:absolute;top:0;bottom:0;background:rgba(214,190,120,.16);pointer-events:none;}
.bar{position:absolute;top:3px;height:17px;border-radius:3px;border:1px solid;font-size:10.5px;font-weight:600;cursor:pointer;user-select:none;touch-action:none;overflow:hidden;z-index:1;}
.bar.ed{cursor:pointer;}
.bar .t,.brg .t{position:absolute;top:0;bottom:0;line-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;font-size:10.5px;pointer-events:none;}
.bar .hl,.bar .hr{position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize;z-index:2;}
.bar .hl{left:0;} .bar .hr{right:0;}
.bar:not(.ed) .hl,.bar:not(.ed) .hr{display:none;}
.bar:hover{filter:brightness(.95);}
.bar.sel{outline:2px solid var(--primary);outline-offset:1px;z-index:3;}
.bar.dim,.brg.dim{opacity:.22;}
.bar.provi{border-style:dashed;}
.bar.mini{top:13px;height:9px;z-index:2;box-shadow:0 0 0 1.5px #fff;border-radius:2px;}
.bar.mini .t{line-height:7px;font-size:8px;}
.bar.tgrp{background:#fff;color:var(--primary);border:1px dashed #8B9097;}
.bar.tgrp .t{font-weight:600;}
.bar.occ{border-style:dotted;}
.brg{position:absolute;top:10px;height:3px;opacity:.55;pointer-events:none;overflow:visible;}
.brg .t{top:-7px;height:17px;line-height:15px;}
.rdot{position:absolute;top:0;width:7px;height:7px;border-radius:50%;background:var(--red);border:1px solid #fff;z-index:3;pointer-events:none;}
.bdot{position:absolute;top:0;width:7px;height:7px;border-radius:50%;background:#2F6F9F;border:1px solid #fff;z-index:3;pointer-events:none;}
.planwrap{display:flex;}
.planwrap .tl{flex:1;min-width:0;}
.aufp{width:300px;flex:none;border-left:1px solid var(--line);border-top:1px solid var(--line);background:#fff;overflow:auto;height:calc(100vh - 200px);min-height:300px;font-size:12px;}
.aufp.zu{width:34px;overflow:hidden;}
.aufp.drop{background:#F2F5D6;}
.auftab{all:unset;cursor:pointer;writing-mode:vertical-rl;padding:12px 8px;font-weight:700;color:var(--primary);font-size:12px;}
.ahead{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line);}
.ahint{font-size:10.5px;color:var(--muted);padding:6px 10px;}
.aleer{padding:8px 10px;color:var(--muted);}
/* Magazin */
.mtit{display:inline-flex;align-items:center;gap:6px;color:var(--primary);font-size:13px;}
.mtit span{color:var(--muted);font-weight:600;}
.madd{padding:3px 9px;font-size:11.5px;margin-left:auto;margin-right:6px;}
.mseg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--soft);border-radius:8px;padding:3px;margin:8px 10px;}
.mseg button{all:unset;cursor:pointer;text-align:center;border-radius:6px;padding:4px 2px;display:flex;flex-direction:column;line-height:1.2;}
.mseg button b{font-size:12px;color:var(--primary);}
.mseg button b span{font-weight:400;color:var(--muted);}
.mseg button small{font-size:10px;color:var(--muted);}
.mseg button.on{background:#fff;box-shadow:0 1px 3px rgba(30,37,48,.15);}
.mseg button.can{outline:2px dashed #8FB3D1;outline-offset:-2px;}
.mseg button.hot{background:#D6E7F4;outline-color:var(--primary);}
.mseg button:focus-visible,.mck:focus-visible{outline:2px solid var(--primary);outline-offset:1px;}
.maddln{display:flex;gap:6px;margin:0 10px 8px;align-items:center;}
.maddln input[type=text],.maddln #magIn{flex:1;min-width:0;}
.mlist{border-top:1px solid var(--line);}
.mrow{border-bottom:1px solid var(--soft);}
.mrow.open{background:#F7F9FA;}
.mln{display:flex;align-items:center;gap:7px;padding:4px 8px 4px 10px;min-height:28px;cursor:pointer;}
.mln:hover{background:#F2F5F7;}
.mgrip{color:#A9AFB5;display:inline-flex;cursor:pointer;margin-left:-4px;touch-action:none;}
.mgrip .i{width:13px;height:13px;}
.mck{all:unset;cursor:pointer;width:14px;height:14px;border:1.5px solid #9AA1A8;border-radius:50%;display:flex;align-items:center;justify-content:center;color:transparent;flex:none;}
.mck:hover{border-color:var(--primary);color:var(--primary);}
.mck .i{width:10px;height:10px;stroke-width:2.4;}
.mt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-size:12.5px;}
.mrep{color:#5E7F99;display:inline-flex;}
.mrep .i,.mchev .i{width:12px;height:12px;}
.mchev{color:#A9AFB5;display:inline-flex;transition:transform .15s;}
.mrow.open .mchev{transform:rotate(90deg);}
.mdet{padding:2px 10px 10px 31px;display:flex;flex-direction:column;gap:8px;}
.mdet .mh{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:3px;}
.mdet textarea{width:100%;min-height:48px;font-size:12.5px;}
.mcl{display:flex;flex-direction:column;gap:1px;}
.mcl label{display:flex;gap:6px;align-items:center;font-size:12.5px;cursor:pointer;}
.mcl label input{accent-color:var(--primary);}
.mcl label span{flex:1;min-width:0;}
.mcl label.ok span{text-decoration:line-through;color:var(--muted);}
.mclx{all:unset;cursor:pointer;color:#B5BABF;display:inline-flex;}
.mclx .i{width:12px;height:12px;}
.mclx:hover{color:var(--danger);}
.mcladd{border:0 !important;border-bottom:1px dashed var(--line) !important;border-radius:0 !important;background:transparent !important;padding:3px 0 !important;font-size:12.5px;}
.mfotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:5px;}
.mfotos .file{cursor:pointer;}
.mfotos .mdok{color:var(--primary);}
.mfadd{all:unset;cursor:pointer;aspect-ratio:4/3;border-radius:5px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);}
.mfadd:hover{border-color:var(--primary);color:var(--primary);}
.madm{display:flex;align-items:center;justify-content:flex-end;gap:6px;border-top:1px solid var(--line);padding-top:8px;}
.bar.prov{background:repeating-linear-gradient(135deg,#E9EDB8 0 4px,#FFFFFF 4px 8px);border:1px dashed #9CA43A;color:#323E4E;cursor:pointer;}
.bar.prov.over{border:1.5px solid var(--red);}
.bar.altb{border:1.5px solid var(--red) !important;}
.bar.prov.nozeit{background:repeating-linear-gradient(135deg,#E9EDB8 0 4px,#FFFFFF 4px 8px);border:1px dashed #C08A2E;}
.row.grp .lane .bar{top:2px;height:15px;}
.aghost{position:fixed;z-index:95;background:var(--primary);color:#fff;font-size:11.5px;padding:4px 8px;border-radius:5px;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.2);}
.lane.drop{background:#F2F5D6 !important;}
.gadd{all:unset;cursor:pointer;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;color:rgba(255,255,255,.6);flex:none;margin-left:auto;}
.gadd .i{width:13px;height:13px;}
.gadd:hover{color:#fff;background:rgba(255,255,255,.15);}
.dropline{position:fixed;height:3px;background:var(--primary);z-index:96;pointer-events:none;border-radius:2px;}
.tl.sortable .row .nm{cursor:pointer;}
.tl.sortable .row .nm button{cursor:pointer;}
.vchip{position:absolute;height:15px;border-radius:3px;font-size:10px;line-height:13px;padding:0 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:#fff;border:1px solid #8B9097;color:var(--ink);z-index:2;user-select:none;touch-action:none;}
.vchip.ed{cursor:pointer;}
.vchip.ed:hover{border-color:var(--primary);box-shadow:0 1px 4px rgba(30,37,48,.18);}
.vchip.ev{background:repeating-linear-gradient(135deg,#EEF1F3 0 4px,#fff 4px 8px);border-style:dashed;color:#5E646B;}
.vmore{position:absolute;font-size:10px;color:var(--primary);cursor:pointer;font-weight:600;z-index:2;}
.vwk{position:absolute;top:4px;height:15px;font-size:10px;color:var(--primary);text-align:center;font-weight:600;}
.row.vpool .lane{background-color:#F7F9FA;}
.lane.vown.drop{background:#F2F5D6 !important;}
.nm .lk{all:unset;cursor:pointer;color:var(--primary);font-size:10.5px;margin-left:4px;}
.mab{all:unset;cursor:pointer;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;color:#9AA1A8;flex:none;margin-left:auto;}
.mab .i{width:14px;height:14px;}
.mab:hover{color:var(--primary);background:var(--soft);}
.mab.on{color:#fff;background:var(--primary);}
.mab + .pzb{margin-left:2px;}
.mab + .mab{margin-left:1px;}
.row.ov.fov .nm{background:#F7F9FA;padding-left:22px;}
.row.ov.fov{background:#FBFCFC;}
.fhl{position:absolute;top:0;bottom:0;background:rgba(209,219,95,.22);pointer-events:none;}
.pzb{all:unset;cursor:pointer;margin-left:auto;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;color:#C3C8CE;flex:none;}
.pzb .i{width:13px;height:13px;}
.pzb.has{color:var(--primary);background:var(--soft);}
.pzb.od{color:#fff;background:var(--danger);}
.dlg .in.board{max-width:980px;}
.bcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;}
.bcol{background:var(--soft);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;}
.bcol h4{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
.pzi{background:#fff;border-radius:6px;padding:6px 8px;display:flex;gap:6px;align-items:flex-start;font-size:12.5px;}
.pzi input{accent-color:var(--primary);margin-top:2px;}
.pzi .tx{flex:1;min-width:0;word-break:break-word;}
.pzi .dt{font-size:10.5px;color:var(--muted);display:block;}
.pzi .dt.od{color:var(--danger);font-weight:700;}
.padd{display:flex;gap:4px;align-items:center;}
.padd input{flex:1;min-width:0;}
.m-pz{margin:6px 12px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 12px;display:flex;flex-direction:column;gap:6px;font-size:14px;}
.m-pz label{display:flex;gap:8px;align-items:flex-start;}
.m-pz .od{color:var(--danger);font-size:11px;}
@media (max-width:900px){ .aufp:not(.zu){width:220px;} }
.band{position:absolute;border-radius:3px;font-size:10px;font-weight:600;overflow:hidden;white-space:nowrap;display:flex;align-items:center;padding:0 5px;cursor:pointer;background:var(--c);border:1px solid rgba(35,43,53,.2);user-select:none;touch-action:none;z-index:1;}
.band span{overflow:hidden;text-overflow:ellipsis;pointer-events:none;}
.band .hl,.band .hr{position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize;pointer-events:auto;}
.band .hl{left:0;} .band .hr{right:0;}
.band.ed{cursor:pointer;}
.band.tint{background:color-mix(in srgb, var(--c) 32%, #fff);border-color:transparent;}
.band.rahmen{background:#fff;border:1.5px solid var(--c);}
.band.rahmen.ev{background:#fff;border-style:dashed;}
.band.cf{background:var(--red) !important;color:#fff !important;}
.band.ev{background:repeating-linear-gradient(135deg,var(--c) 0 4px,#fff 4px 8px);opacity:.6;color:var(--ink) !important;}
.row.ov .nm{gap:5px;font-size:11.5px;}
.vl{position:absolute;bottom:1px;height:3px;border-radius:2px;pointer-events:auto;z-index:2;}
.vl.red{background:var(--red);} .vl.blue{background:#2F6F9F;}
.mchips{display:flex;flex-wrap:wrap;gap:5px;}
.mchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 4px 3px 8px;border-radius:5px;background:var(--soft);}
.mchip.cf{background:#F7E6E3;color:#7A3A33;}
.mchip .icon-btn{width:20px;height:20px;}
.ghost{position:absolute;top:3px;height:17px;border-radius:3px;background:rgba(50,62,78,.18);border:1px dashed var(--primary);pointer-events:none;z-index:2;}
.leer{padding:40px 20px;text-align:center;color:var(--muted);}

/* Seitenfenster (Details) */
.sidepanel{position:fixed;top:0;right:0;bottom:0;z-index:45;width:380px;max-width:100vw;background:#fff;border-left:1px solid var(--line);box-shadow:-6px 0 24px rgba(30,37,48,.10);overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:16px 20px 24px;}
.sd-head{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.sd-head h3{font-size:16px;color:var(--primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fld{display:flex;flex-direction:column;gap:4px;}
.fld > label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
.fld input[type=text],.fld select,.fld textarea{width:100%;}
.fld textarea{min-height:90px;resize:vertical;line-height:1.45;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.dt{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:6px;}
label.chk{display:flex;gap:8px;align-items:center;font-size:12.5px;cursor:pointer;}
label.chk input{accent-color:var(--primary);width:15px;height:15px;}
.quick{display:flex;gap:4px;flex-wrap:wrap;}
.quick button{all:unset;cursor:pointer;font-size:11.5px;padding:3px 8px;border:1px solid var(--line);border-radius:5px;color:var(--primary);}
.quick button:hover{border-color:var(--primary);}
.info{font-size:12px;background:var(--soft);border-radius:6px;padding:8px 10px;}
.info.warn{background:#F7E6E3;color:#7A3A33;}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px;}
.file{position:relative;aspect-ratio:4/3;border-radius:5px;background:var(--soft);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:10.5px;text-align:center;padding:4px;cursor:pointer;color:var(--primary);}
.file img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.file .x{position:absolute;top:2px;right:2px;width:20px;height:20px;}
.sd-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center;}
.sd-head .when{font-size:12px;color:var(--muted);margin-top:3px;}
.sd-head h3{white-space:normal;}
.acc{border:1px solid var(--line);border-radius:8px;}
.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 11px;font-weight:700;font-size:12.5px;color:var(--primary);}
.acc summary::-webkit-details-marker{display:none;}
.acc summary .n{margin-left:auto;font-weight:400;color:var(--muted);font-size:11.5px;}
.acc summary .ch{width:15px;height:15px;color:var(--muted);transition:transform .15s;}
.acc summary .n + .ch{margin-left:6px;} .acc summary > span:not(.n) + .ch{margin-left:auto;}
.acc[open] summary .ch{transform:rotate(180deg);}
.acc .body{padding:2px 11px 11px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;}
.pfhd{display:flex;align-items:center;gap:6px;color:var(--primary);border-top:2px solid var(--accent-lime);padding-top:10px;margin-top:2px;}
.banner{border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;}
.banner.vor{background:repeating-linear-gradient(135deg,#E9EDB8 0 6px,#fff 6px 12px);border:1px dashed #9CA43A;}
.confirm{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;}
.confirm .three{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px;}
.arb{display:flex;flex-direction:column;gap:3px;}
.arb .t{font-weight:700;}
.chk2,.arb .chk{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;}
.arb .chk i{width:13px;height:13px;border:1.5px solid var(--muted);border-radius:3px;flex:none;margin-top:3px;}
.dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px;margin:0;}
.dl dt{color:var(--muted);} .dl dd{margin:0;}
table.bp{border-collapse:collapse;font-size:11.5px;width:100%;}
table.bp td{padding:4px;border-top:1px solid var(--soft);white-space:nowrap;}
.days{display:flex;gap:2px;}
.days i{font-style:normal;font-size:9.5px;font-weight:700;width:19px;height:16px;border-radius:3px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted);}
.days i.on{background:var(--primary);color:#fff;border-color:var(--primary);}
.docs{display:flex;flex-direction:column;gap:4px;}
.dokl{all:unset;cursor:pointer;display:flex;gap:6px;align-items:center;font-size:12.5px;}
.dokl:hover{text-decoration:underline;}
.dokl .i{color:var(--danger);width:15px;height:15px;}
.abs-chips{display:flex;flex-wrap:wrap;gap:5px;}
.abs-chips button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:16px;padding:4px 10px;font-size:12px;}
.abs-chips button i{width:12px;height:12px;border-radius:3px;border:1px solid rgba(35,43,53,.2);}
.abs-chips button.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);font-weight:700;}
.abrow{display:grid;grid-template-columns:18px minmax(0,180px) auto 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--soft);}
.abrow:last-child{border-bottom:0;}
.greys{display:flex;gap:4px;flex-wrap:wrap;}
.greys button{all:unset;cursor:pointer;width:24px;height:22px;border-radius:5px;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(35,43,53,.15);}
.greys button.on{border-color:var(--primary);}
.greys .stp{background:repeating-linear-gradient(135deg,#A6ADB4 0 4px,#fff 4px 7px);}
.prev{border-radius:4px;padding:3px 8px;font-size:11px;font-weight:600;justify-self:start;border:1px solid rgba(35,43,53,.2);}
@media (max-width:640px){ .abrow{grid-template-columns:18px 1fr;} }
.kopf2{font-size:13.5px;color:var(--ink);}
.pdot{width:12px;height:12px;border-radius:50%;background:var(--red);flex:none;}
.fixe{display:flex;flex-direction:column;gap:5px;}
.fx{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink);}
.fx input{width:56px;padding:3px 6px;text-align:right;}
.fxw{font-size:12px;color:var(--red);font-weight:700;padding-left:30px;}
.bwarn{position:absolute;right:2px;top:1px;width:13px;height:13px;border-radius:50%;background:var(--red);color:#fff;font-size:10px;line-height:13px;text-align:center;font-weight:800;z-index:3;pointer-events:none;}
.kopf2 b{font-weight:700;}
.zst{display:flex;align-items:center;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;}
.zst select{flex:1;text-transform:none;letter-spacing:0;font-weight:400;}
.kneu{display:flex;flex-direction:column;gap:6px;}
.kneu input{width:100%;}
.kedit{all:unset;cursor:pointer;margin-left:6px;color:var(--muted);vertical-align:-2px;}
.kedit .i{width:14px;height:14px;}
.kedit:hover{color:var(--primary);}
.offenhd{min-width:0;flex:1;border-radius:8px;padding:8px 10px;border:1px dashed #9CA43A;background:repeating-linear-gradient(135deg,#E9EDB8 0 6px,#fff 6px 12px);}
.hdbtn{padding:5px 10px;font-size:12px;flex:none;align-self:flex-start;}
.dokrow{display:flex;align-items:center;gap:6px;}
.dokrow .icon-btn{width:20px;height:20px;margin-left:auto;}
.leiste{position:fixed;z-index:65;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(30,37,48,.18);padding:10px;display:flex;flex-direction:column;gap:8px;width:min(380px,calc(100vw - 16px));}
.leiste .lh{display:flex;flex-direction:column;gap:1px;color:var(--primary);font-size:12.5px;}
.leiste .lb{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;}
.leiste .lb button,.leiste .lchips button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:7px;padding:7px 5px;text-align:center;font-size:11.5px;color:var(--primary);display:flex;flex-direction:column;align-items:center;gap:2px;}
.leiste .lb button b,.leiste .lchips button b{font-size:10px;color:var(--muted);}
.leiste .lb button.on{background:var(--primary);color:#fff;border-color:var(--primary);}
.leiste .lb button.on b{color:#fff;}
.leiste .lb button:hover,.leiste .lchips button:hover{border-color:var(--primary);}
.leiste .lsub{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--soft);padding-top:8px;}
.leiste .lchips{display:flex;flex-wrap:wrap;gap:5px;}
.leiste .lchips button{flex-direction:row;padding:5px 10px;}
.pop{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(30,37,48,.16);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:220px;max-width:300px;font-size:12.5px;}
.lbox{position:fixed;inset:0;z-index:80;background:rgba(20,25,32,.9);display:flex;align-items:center;justify-content:center;padding:40px;}
.lbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;}
.lbox .x{position:absolute;top:14px;right:14px;}

.toast{background:var(--primary);color:#fff;font-size:12.5px;padding:9px 14px;border-radius:7px;box-shadow:0 6px 20px rgba(0,0,0,.2);display:flex;gap:12px;align-items:center;}
.toast.err{background:var(--danger);}
.toast button{all:unset;cursor:pointer;color:var(--accent-lime);font-weight:700;}

.page h2{font-size:17px;color:var(--primary);margin-bottom:4px;}

// ---------------------------------------------------------------------------
// Zeitachse: 1 Einheit = 1 Tag, jeder Tag zeigt 06:00–18:00.
// Halbtage: Vormittag 06–12, Nachmittag 12–18. Tag-Index ab D0 (Montag).
// ---------------------------------------------------------------------------
const heute = new Date(); heute.setHours(0,0,0,0);
const D0 = new Date(heute); D0.setDate(D0.getDate() - ((D0.getDay() + 6) % 7) - 7 * 8);
const NDAYS = 7 * 70;
const dDate = i => new Date(D0.getFullYear(), D0.getMonth(), D0.getDate() + i);
const dayIdx = dt => Math.round((Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()) - Date.UTC(D0.getFullYear(), D0.getMonth(), D0.getDate())) / 864e5);
const TODAY = dayIdx(heute);
const toU = ts => { const t = new Date(ts); const h = t.getHours() + t.getMinutes() / 60; return dayIdx(t) + Math.max(0, Math.min(1, (h - 6) / 12)); };
function fromU(u, isEnd){ let d = Math.floor(u + 1e-9), f = u - d; if(isEnd && f < 1e-9){ d -= 1; f = 1; } const x = dDate(d); x.setHours(0, Math.round((6 + f * 12) * 60), 0, 0); return x.toISOString(); }
const isoDate = d => { const x = dDate(d); return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`; };
const fromIso = s => { const [y,m,d] = s.split('-').map(Number); return dayIdx(new Date(y, m-1, d)); };
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'], WDL = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MON = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'], MONL = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function kw(d){ const x = dDate(d); const t = new Date(Date.UTC(x.getFullYear(), x.getMonth(), x.getDate())); const w = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - w); const j = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - j) / 864e5 + 1) / 7); }
const tStr = h => { const m = Math.round(h * 60); return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
const hOf = (u, d) => tStr(6 + (u - d) * 12);
const dLab = d => { const x = dDate(d); return `${WD[x.getDay()]} ${x.getDate()}.${x.getMonth()+1}.`; };
const fmtN = n => String(Math.round(n * 10) / 10).replace('.', ',');
const r48 = u => Math.round(u * 48) / 48;

// ---------------------------------------------------------------------------
// Daten
// ---------------------------------------------------------------------------
let RES = [], RESE = [], GRUPPEN = [], PERSONEN = [], P = {}, EINS = [], SERIEN = [], FEIER = new Map(), KUNDEN = {}, KLIST = [], BENUTZER = [];
async function fetchAll(mk){ let out = [], i = 0; for(;;){ const { data, error } = await mk().range(i, i + 999); if(error) throw error; out = out.concat(data); if(data.length < 1000) break; i += 1000; } return out; }
async function ladeAlles(){
  try{
    const von = fromU(0), bis = fromU(NDAYS);
    const [g, p, e, s, f, k, r, z, au, pz, at, vn] = await Promise.all([
      fetchAll(() => sb.from('planer_gruppe').select('*').order('sortierung')),
      fetchAll(() => sb.from('planer_person').select('*').order('sortierung')),
      fetchAll(() => sb.from('planer_einsatz').select('*, planer_datei(id,art,name,storage_pfad)').lt('beginn', bis).gt('ende', von)),
      fetchAll(() => sb.from('planer_serie').select('*')),
      fetchAll(() => sb.from('planer_feiertag').select('*')),
      Object.keys(KUNDEN).length ? Promise.resolve(null) : fetchAll(() => sb.from('kunde').select('id,name,firma,vorname,nachname,strasse,plz,ort').order('name')),
      fetchAll(() => sb.from('planer_ressource').select('*').order('sortierung')),

    MAG = au; PZ = pz; ABST = at; VNOT = {}; vn.forEach(x => VNOT[`${x.kunde_kategorie_id}_${x.jahr}_${x.kw}`] = { n: x.notiz || '', pl: x.projektleiter_id });
    RES = r; RESE = z.map(x => ({ id: x.id, rid: x.ressource_id, art: x.art, eid: x.einsatz_id, mid: x.person_id, s: x.beginn ? toU(x.beginn) : null, e: x.ende ? toU(x.ende) : null }));

    EINS = e.map(rowToItem); SERIEN = s;
    FEIER = new Map(); f.forEach(x => FEIER.set(fromIso(x.datum), x.name));
    if(k){ KUNDEN = {}; k.forEach(x => KUNDEN[x.id] = x); KLIST = k.map(x => ({ id: x.id, lab: kLabel(x) })); }
    if(isBuero() && !BENUTZER.length){ const { data } = await sb.rpc('pflege_zustaendige'); BENUTZER = data || []; }

}
function rowToItem(r){ return { id: r.id, mid: r.person_id, kind: r.art, s: toU(r.beginn), e: toU(r.ende), kid: r.kunde_id, title: r.titel || '', text: r.notiz || '', pl: r.projektleiter_id, link: r.mit_einsatz_id, allein: r.allein, ok: r.abgemacht, soll: r.soll_tage, files: r.planer_datei || [], pkk: r.pflege_kunde_kategorie_id, pj: r.pflege_jahr, pkw: r.pflege_kw, fix: !!r.start_fix }; }
function itemToRow(it){ return { person_id: it.mid, art: it.kind, beginn: fromU(it.s), ende: fromU(it.e, true), kunde_id: it.kid || null, titel: it.title || null, notiz: it.text || null, projektleiter_id: it.pl || null, mit_einsatz_id: it.link || null, allein: !!it.allein, abgemacht: it.ok !== false, soll_tage: it.soll ?? null, pflege_kunde_kategorie_id: it.pkk || null, pflege_jahr: it.pj || null, pflege_kw: it.pkw || null, start_fix: !!it.fix }; }
const kName = k => k ? (k.firma || [k.nachname, k.vorname].filter(Boolean).join(' ') || k.name) : '';
const kShort = k => k ? (k.firma || k.nachname || k.name || '') : '';
const kOrt = k => k ? [k.strasse, [k.plz, k.ort].filter(Boolean).join(' ')].filter(Boolean).join(', ') : '';
const kLabel = k => `${kName(k)}${k.ort ? ' · ' + k.ort : ''}`;
const byId = id => EINS.find(x => x.id === id);
const first = n => String(n || '').split(' ')[0];
const canEdit = mid => isBuero() || (P[mid] && P[mid].benutzer_id === ME);
const myPerson = () => PERSONEN.find(p => p.benutzer_id === ME && p.aktiv);
const ART = { baustelle: 'Auftrag', termin: 'Auftrag', absenz: 'Absenz', intern: 'Werkhof / intern', hilfe: 'Mithilfe' };
// Farben wie in Tom's Planner (Projektleiter, Mitarbeitende, «selber abgemacht»)
const PALETTE = ['#7A7A38','#7E9282','#62B54E','#9DBBAA','#4646B8','#B3CDF5','#93BCBC','#7DB8D6','#6E5A8C','#A97BB5','#E8A8D0','#A84E8A','#9B4150','#F2E64E','#F6F2B0','#E3CC4E','#E8A84A','#E58A3A','#7A6458'];
const SELBER = '#C9D9A8';

function titleOf(it){
  if(it.kind === 'hilfe'){ const l = byId(it.link); return l ? `Mit ${first(P[l.mid]?.name)} · ${kShort(KUNDEN[l.kid]) || l.title}` : (it.title || 'Mithilfe'); }
  return kName(KUNDEN[it.kid]) || it.title || ART[it.kind] || 'Ohne Titel';
}
function labOf(it){
  if(it.kind === 'hilfe'){ const l = byId(it.link); return l ? `Mit ${first(P[l.mid]?.name)} · ${kShort(KUNDEN[l.kid]) || l.title}` : (it.title || 'Mithilfe'); }
  return kShort(KUNDEN[it.kid]) || it.title || ART[it.kind];
}
const txtOn = c => { const m = /^#?([0-9a-f]{6})$/i.exec(c || ''); if(!m) return '#FFFFFF'; const n = parseInt(m[1], 16); const l = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; return l > .62 ? '#232B35' : '#FFFFFF'; };
// Absenz-Typen: 6 gut unterscheidbare Grautöne, optional gestreift (Seite «Feiertage & Absenzen»)
let ABST = [];
const GREYS = ['#E3E6E9', '#D0D4D8', '#BCC2C8', '#A6ADB4', '#8F969E', '#787F87'];
function absStyle(name){ const t = ABST.find(x => x.name.toLowerCase() === String(name || '').toLowerCase()); const c = GREYS[t ? t.grauton : 1];
  return { bg: t && t.gestreift ? `repeating-linear-gradient(135deg,${c} 0 5px,#FFFFFF77 5px 9px),${c}` : c, fg: (t ? t.grauton : 1) >= 4 ? '#FFFFFF' : '#323E4E', bd: 'rgba(35,43,53,.18)' }; }
function barStyle(it){

  if(it.kind === 'intern') return { bg: '#E9ECEF', fg: '#323E4E', bd: '#C9CED4' };
  let c;
  // Baustelle = Farbe des Projektleiters, ohne Projektleiter = «selber abgemacht»; Mithilfe = Farbe der Person, mit der man arbeitet
  if(it.kind === 'hilfe'){ const l = byId(it.link); c = (l && P[l.mid]?.farbe) || SELBER; }

// ---------------------------------------------------------------------------
// Berechnung: Serien-Termine, Unterbrüche, «Personal fehlt»
// ---------------------------------------------------------------------------
const isOff = d => { const w = dDate(d).getDay(); return w === 0 || w === 6 || FEIER.has(d); };
const isShort = o => o.e - o.s < .5 - 1e-6;
function covered(list, a, b){ const iv = list.map(o => [Math.max(a, o.s), Math.min(b, o.e)]).filter(x => x[1] > x[0]).sort((x, y) => x[0] - y[0]); let t = 0, ce = a; iv.forEach(([s, e]) => { s = Math.max(s, ce); if(e > s){ t += e - s; ce = e; } }); return t; }
function occs(){
  const out = [];
  SERIEN.forEach(sr => {
    const von = Math.max(0, fromIso(sr.von)), bis = Math.min(NDAYS - 1, sr.bis ? fromIso(sr.bis) : NDAYS - 1);
    const ex = new Set((sr.ausnahmen || []).map(fromIso));
    for(let d = von; d <= bis; d++){
      const wd = dDate(d).getDay() || 7;
      if(wd !== sr.wochentag || ex.has(d) || FEIER.has(d)) continue;
      if(sr.alle_zwei_wochen && Math.floor((d - von) / 7) % 2) continue;
      const [a, b] = sr.teil === 'vm' ? [0, .5] : sr.teil === 'nm' ? [.5, 1] : [0, 1];
      out.push({ id: 'S' + sr.id + '_' + d, ser: sr.id, d, mid: sr.person_id, kind: sr.art, s: d + a, e: d + b, title: sr.titel, files: [] });
    }
  });
  return out;
}
let ALL = [], LAY = {};
// Offene Aufträge (noch nicht abgemacht) sind nie fix: was vergangen ist, rutscht in die nächste
// freie Lücke ab jetzt (Arbeitstage 07–17 Uhr). In der Datenbank bleibt der ursprüngliche Wunschtermin.
function floatOffene(){
  const jetzt = toU(new Date()); const start0 = Math.max(jetzt, TODAY + 1 / 12);
  const byMid = {}; EINS.forEach(it => { if(it.ok === false && it.kind !== 'absenz' && (it._alt || it.e <= jetzt + 1e-6)) (byMid[it.mid] ??= []).push(it); });
  Object.entries(byMid).forEach(([mid, list]) => {
    const bl = EINS.filter(i => i.mid === mid && i.ok !== false).map(i => [i.s, i.e]);
    let cur = start0;
    list.sort((a, b) => (a._alt || a).s - (b._alt || b).s).forEach(it => {
      if(!it._alt) it._alt = { s: it.s, e: it.e };
      const len = Math.min(it._alt.e - it._alt.s, 10 / 12);
      for(let g = 0; g < 400; g++){ const d = Math.floor(cur);
        if(isOff(d)){ cur = d + 1 + 1 / 12; continue; }
        if(cur < d + 1 / 12) cur = d + 1 / 12;
        if(cur + len > d + 11 / 12 + 1e-6){ cur = d + 1 + 1 / 12; continue; }
        const c = bl.find(([a, b]) => a < cur + len - 1e-6 && b > cur + 1e-6); if(c){ cur = c[1]; continue; }
        break; }
      it.s = r48(cur); it.e = r48(cur + len); bl.push([it.s, it.e]); cur = it.e;
    });
  });
}
function compute(){
  floatOffene();
  ALL = EINS.concat(occs()); LAY = {};
  const rows = {}; ALL.forEach(it => (rows[it.mid] ??= []).push(it));
  Object.values(rows).forEach(list => {
    list.forEach((it, i) => it._o = i);
    list.sort((a, b) => (b.e - b.s) - (a.e - a.s) || a._o - b._o);
    list.forEach((it, i) => {
      const over = list.slice(i + 1).filter(o => o.s < it.e - 1e-6 && o.e > it.s + 1e-6);
      const multi = it.e - it.s > 1 + 1e-6, free = [];
      const k0 = Math.floor(it.s * 2 + 1e-9), k1 = Math.ceil(it.e * 2 - 1e-9) - 1;
      for(let k = k0; k <= k1; k++){
        const d = k >> 1; if(multi && isOff(d)) continue;
        const a = Math.max(it.s, k / 2), b = Math.min(it.e, (k + 1) / 2); if(b - a < 1e-6) continue;
        // Kurze Termine (unter einem Halbtag) unterbrechen nicht – ausser sie füllen zusammen mind. 4 Std. des Halbtags
        const ov = over.filter(o => o.s < b - 1e-6 && o.e > a + 1e-6);
        if(ov.length && (ov.some(o => !isShort(o)) || covered(ov, a, b) >= Math.min(b - a, 1 / 3) - 1e-6)) continue;
        free.push(k);
      }
      const segs = []; free.forEach(k => { const a = Math.max(it.s, k / 2), b = Math.min(it.e, (k + 1) / 2); const L = segs[segs.length - 1]; if(L && Math.abs(L[1] - a) < 1e-6) L[1] = b; else segs.push([a, b]); });
      LAY[it.id] = { segs, free, n: free.length / 2, miss: [] };
    });
    // Kurzer Termin auf einer laufenden Baustelle = Markierung auf dem Balken
    list.forEach(o => { if(!isShort(o) || !LAY[o.id]) return; const k = Math.floor(o.s + o.e);
      const host = list.find(h => h !== o && h.kind !== 'absenz' && !isShort(h) && LAY[h.id] && LAY[h.id].free.includes(k)); LAY[o.id].mini = host ? host.id : null; });
  });
  // Vorarbeiter-Baustelle ohne Mithilfe (und nicht «allein») = Personal fehlt (nur ab heute)
  const cover = {}; ALL.forEach(h => { if(h.kind === 'hilfe' && h.link && LAY[h.id]) LAY[h.id].free.forEach(k => (cover[h.link] ??= new Set()).add(k)); });
  ALL.forEach(b => { if(b.kind !== 'baustelle' || b.allein || !P[b.mid]?.ist_vorarbeiter || !LAY[b.id]) return; const c = cover[b.id] || new Set(); LAY[b.id].miss = LAY[b.id].free.filter(k => !c.has(k) && k >= TODAY * 2); });
  computeRU(); computeProv();
}
const spanLabel = it => {
  const d0 = Math.floor(it.s + 1e-9), d1 = Math.ceil(it.e - 1e-9) - 1;
  if(d0 === d1){ const a = it.s - d0, b = it.e - d0; const t = a === 0 && b === 1 ? 'ganzer Tag' : a === 0 && b === .5 ? 'Vormittag' : a === .5 && b === 1 ? 'Nachmittag' : `${hOf(it.s, d0)}–${hOf(it.e, d0)}`; return `${dLab(d0)} · ${t}`; }
  return `${dLab(d0)}${it.s - d0 > 0 ? ' ' + hOf(it.s, d0) : ''} – ${dLab(d1)}${it.e - d1 < 1 ? ' ' + hOf(it.e, d1) : ''}`;
};

  document.querySelectorAll('#subnav a').forEach(a => a.classList.toggle('on', a.dataset.view === VIEW));
  closePanel(); closePop();
  render();
}
window.addEventListener('hashchange', route);

  else if(VIEW === 'handy') renderHandy();
  else if(VIEW === 'personen') renderPersonen();
  else if(VIEW === 'ressourcen') renderRessourcen();

}

// ---------------------------------------------------------------------------

let zoom = lsGet('zoom', 'monat'), dayW = 26, query = '', plFilter = null, selId = null, drag = null;
const collapsed = new Set(lsGet('zu', []));
const SNAP = { jahr: 1, quartal: .5, monat: .5, woche: 1 / 12, tag: 1 / 48 };
const ZL = { jahr: 'Jahr', quartal: 'Quartal', monat: 'Monat', woche: 'Woche', tag: 'Tag' };
const snapU = u => { const s = SNAP[zoom]; return Math.round(u / s) * s; };
const NAMEW = 225;
const visW = () => Math.max(300, ($('tl')?.clientWidth || innerWidth) - NAMEW);
function calcDayW(){ return { jahr: 3.2, quartal: 9, monat: 26, woche: Math.max(60, visW() / 7.2), tag: Math.max(500, visW() - 10) }[zoom]; }

function renderPlan(){
  const main = $('appMain');
  if(!main.querySelector('#tl')){
    main.innerHTML = `
      <div class="bar-top">
        <div class="seg" id="zoomSeg">${Object.entries(ZL).map(([k, l]) => `<button data-z="${k}">${l}</button>`).join('')}</div>
        <button class="icon-btn" id="prevB" aria-label="Zurück">${I('back')}</button>
        <button class="btn btn-ghost" id="todayB" style="padding:4px 10px">Heute</button>
        <button class="icon-btn" id="nextB" aria-label="Weiter">${I('next')}</button>
        <span class="range" id="rangeL"></span>
        <div class="seg" id="laySeg" style="margin-left:8px">${Object.entries(LAYERS).map(([k, l]) => `<button data-l="${k}">${l}</button>`).join('')}</div>
        <span class="sp"></span>
        <div class="chips" id="plChips"></div>
        <button class="btn btn-ghost" id="pzFirma" style="padding:4px 10px">${I('tasks')}Pendenzen</button>
        <input type="search" id="qIn" placeholder="Kunde, Ort, Notiz suchen" style="width:190px">
      </div>
      <div class="legend" id="legend"></div>
      <div class="planwrap"><div class="tl${isBuero() ? ' sortable' : ''}" id="tl"></div><aside class="aufp" id="aufp"></aside></div>`;
    main.querySelectorAll('#zoomSeg button').forEach(b => b.onclick = () => setZoom(b.dataset.z));
    main.querySelectorAll('#laySeg button').forEach(b => b.onclick = () => { layer = b.dataset.l; lsSet('layer', layer); closePanel(); renderRows(); main.querySelectorAll('#laySeg button').forEach(x => x.setAttribute('aria-pressed', x.dataset.l === layer)); });
    $('prevB').onclick = () => step(-1); $('nextB').onclick = () => step(1);
    $('todayB').onclick = () => goToday();
    $('pzFirma').onclick = () => { const me = myPerson(); if(!me){ toast('Dein Login ist noch keiner Zeile im Planer zugeordnet.'); return; } openBoard(me.id); };
    $('qIn').oninput = e => { query = e.target.value.trim().toLowerCase(); renderRows(); };
    bindTimeline($('tl')); bindWindow();
    dayW = calcDayW(); renderRows(); goToday();
  } else { const c = centerU(); dayW = calcDayW(); renderRows(); scrollToU(c, 'center'); }
  main.querySelectorAll('#zoomSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.z === zoom));
  main.querySelectorAll('#laySeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === layer));
  renderChips(); renderAuf();
}
function renderChips(){
  const pls = PERSONEN.filter(p => p.ist_projektleiter && p.aktiv);
  $('plChips').innerHTML = pls.length ? `<span class="hint">Zuständig</span>` + pls.map(p => `<button class="chip" data-pl="${p.id}" aria-pressed="${plFilter === p.id}" title="Nur ${esc(p.name)} hervorheben"><i style="background:${p.farbe || '#5B8C6A'}"></i>${esc(p.kuerzel || first(p.name))}</button>`).join('') : '';
  $('plChips').querySelectorAll('[data-pl]').forEach(b => b.onclick = () => { plFilter = plFilter === b.dataset.pl ? null : b.dataset.pl; renderChips(); renderRows(); });
  const tag = zoom === 'tag' ? 'Viertelstunden-Raster.' : zoom === 'woche' ? 'Stunden-Raster.' : 'Halbtags-Raster.';
  $('legend').innerHTML = `<span class="lg"><span class="sw" style="background:#7E9282"></span>Auftrag (Farbe Zuständig)</span><span class="lg"><span class="sw" style="background:${SELBER}"></span>selber abgemacht</span><span class="lg"><span class="sw" style="background:#C9CED4"></span>Absenz</span><span class="lg"><span class="sw" style="background:#E9ECEF"></span>Werkhof</span><span class="lg"><span class="sw" style="background:repeating-linear-gradient(135deg,#5B8C6A99 0 3px,#fff 3px 6px)"></span>offener Auftrag</span><span class="lg"><span class="rdot" style="position:static;display:inline-block"></span>Personal fehlt</span><span class="lg"><span class="bdot" style="position:static;display:inline-block"></span>allein</span><label class="lg" style="cursor:pointer"><input type="checkbox" id="provChk" ${showProv ? 'checked' : ''} style="accent-color:var(--primary)">Pflege-Vorschläge</label><span class="lg" style="margin-left:auto">${tag} Ziehen = neuer Eintrag, Doppelklick auf Balken = dort einfügen, Rechtsklick = Menü</span>`;
  const pc = $('provChk'); if(pc) pc.onchange = () => { showProv = pc.checked; lsSet('prov', showProv); renderRows(); };
}
function setZoom(z){ if(z === zoom) return; const t = tlEl(); const a = t.scrollLeft / dayW, b = a + visW() / dayW; const tv = TODAY + 1 > a + .05 && TODAY < b - .05; const c = centerU(); zoom = z; lsSet('zoom', z); dayW = calcDayW(); renderRows(); scrollToU(c, 'center'); renderPlan(); if(tv) goToday(); }
const tlEl = () => $('tl');
const centerU = () => { const t = tlEl(); return t ? (t.scrollLeft + visW() / 2) / dayW : TODAY + .5; };
function scrollToU(u, mode){ const t = tlEl(); if(!t) return; t.scrollLeft = Math.max(0, mode === 'center' ? u * dayW - visW() / 2 : u * dayW); updateRange(); }
function goToday(){ if(zoom === 'tag') scrollToU(TODAY, 'left'); else if(zoom === 'woche'){ const w = (dDate(TODAY).getDay() + 6) % 7; scrollToU(w >= 5 ? TODAY + 7 - w : TODAY - w, 'left'); } else scrollToU(TODAY - (zoom === 'jahr' ? 28 : zoom === 'quartal' ? 7 : 3), 'left'); }
function step(dir){ const n = { jahr: 91, quartal: 28, monat: 14, woche: 7, tag: 1 }[zoom]; const t = tlEl(); t.scrollLeft += dir * n * dayW; updateRange(); }
function updateRange(){
  const t = tlEl(); if(!t) return; const a = Math.floor(t.scrollLeft / dayW + .01), b = Math.min(NDAYS - 1, Math.floor((t.scrollLeft + visW()) / dayW - .01));
  const x = dDate(a), y = dDate(b);
  $('rangeL').textContent = zoom === 'tag' ? `${WDL[x.getDay()]}, ${x.getDate()}. ${MONL[x.getMonth()]} ${x.getFullYear()} · KW ${kw(a)}` : `${x.getDate()}. ${MON[x.getMonth()]} – ${y.getDate()}. ${MON[y.getMonth()]} ${y.getFullYear()} · KW ${kw(a)}${kw(a) !== kw(b) ? '–' + kw(b) : ''}`;
}

let HR = [0, NDAYS];
function headerHTML(W){
  let t1 = '', t2 = '', t3 = '';
  // Tagesansicht: Stundenkoepfe nur um den sichtbaren Bereich (sonst sehr viele Elemente)
  const c0 = Math.floor((tlEl()?.scrollLeft || TODAY * dayW) / dayW);
  HR = zoom === 'tag' ? [Math.max(0, c0 - 10), Math.min(NDAYS, c0 + 12)] : [0, NDAYS];
  for(let d = HR[0]; d < HR[1]; d++){
    const x = dDate(d), w = x.getDay(); const L = d * dayW;
    if(zoom === 'jahr' || zoom === 'quartal'){
      if(x.getDate() === 1 || d === 0){ let n = 0; while(d + n < NDAYS && dDate(d + n).getMonth() === x.getMonth()) n++; t1 += `<div class="hc t1" style="left:${L}px;width:${n * dayW}px">${MONL[x.getMonth()]} ${x.getFullYear()}</div>`; }
      if(w === 1){ t2 += `<div class="hc t2${TODAY >= d && TODAY < d + 7 ? ' td' : ''}" style="left:${L}px;width:${7 * dayW}px">${zoom === 'jahr' ? kw(d) : 'KW ' + kw(d)}</div>`; }
    } else if(zoom === 'monat'){
      if(w === 1){ t1 += `<div class="hc t1" style="left:${L}px;width:${7 * dayW}px">KW ${kw(d)} · ${x.getDate()}. ${MON[x.getMonth()]}</div>`; }
      t2 += `<div class="hc t2${w === 0 || w === 6 ? ' we' : ''}${FEIER.has(d) ? ' fe' : ''}${d === TODAY ? ' td' : ''}" style="left:${L}px;width:${dayW}px" title="${esc(FEIER.get(d) || '')}">${WD[w].charAt(0)} ${x.getDate()}</div>`;
    } else if(zoom === 'woche'){
      if(w === 1){ t1 += `<div class="hc t1" style="left:${L}px;width:${7 * dayW}px">KW ${kw(d)} · ${x.getDate()}. ${MONL[x.getMonth()]} ${x.getFullYear()}</div>`; }
      t2 += `<div class="hc t2${w === 0 || w === 6 ? ' we' : ''}${FEIER.has(d) ? ' fe' : ''}${d === TODAY ? ' td' : ''}" style="left:${L}px;width:${dayW}px">${WDL[w]} ${x.getDate()}.${x.getMonth() + 1}.${FEIER.has(d) ? ' · ' + esc(FEIER.get(d)) : ''}</div>`;
      t3 += `<div class="hc t3" style="left:${L}px;width:${dayW / 2}px">${dayW > 150 ? 'Vormittag' : 'VM'}</div><div class="hc t3" style="left:${L + dayW / 2}px;width:${dayW / 2}px">${dayW > 150 ? 'Nachmittag' : 'NM'}</div>`;
    } else {
      t1 += `<div class="hc t1${d === TODAY ? ' td' : ''}" style="left:${L}px;width:${dayW}px">${WDL[w]}, ${x.getDate()}. ${MONL[x.getMonth()]} ${x.getFullYear()} · KW ${kw(d)}${FEIER.has(d) ? ' · ' + esc(FEIER.get(d)) : ''}</div>`;
      for(let h = 0; h < 12; h++) t2 += `<div class="hc t2" style="left:${L + h * dayW / 12}px;width:${dayW / 12}px">${pad(6 + h)}:00</div>`;
    }
  }
  const H = zoom === 'woche' ? 56 : 41;
  return `<div class="hdr"><div class="corner" style="height:${H}px">${layer === 'p' ? 'Mitarbeitende' : LAYERS[layer]}</div><div class="hlane" style="width:${W}px;height:${H}px">${t1}${t2}${t3}</div></div>`;
}
function laneBg(){
  // Wochenenden grau, Tagestrennlinien ab Monat, Stundenlinien im Tag
  const wk = 7 * dayW, we = `repeating-linear-gradient(90deg,transparent 0 ${5 * dayW}px,#F3F5F7 ${5 * dayW}px ${wk}px)`;
  const lines = zoom === 'tag' ? `repeating-linear-gradient(90deg,#EEF1F3 0 1px,transparent 1px ${dayW / 12}px),` : (zoom === 'woche' || zoom === 'monat') ? `repeating-linear-gradient(90deg,#E6EAED 0 1px,transparent 1px ${dayW}px),` : `repeating-linear-gradient(90deg,#EEF1F3 0 1px,transparent 1px ${wk}px),`;
  return `background:${lines}${we};background-position:0 0;`;
}
function feierHTML(){ let h = ''; FEIER.forEach((n, d) => { if(d >= 0 && d < NDAYS) h += `<div class="fel" style="left:${d * dayW}px;width:${dayW}px" title="${esc(n)}"></div>`; }); return h + `<div class="tdl" style="left:${(zoom === 'tag' || zoom === 'woche') ? (TODAY + Math.max(0, Math.min(1, (new Date().getHours() + new Date().getMinutes() / 60 - 6) / 12))) * dayW : (TODAY + .5) * dayW}px"></div>`; }

function personRow(p, W, bgx){
  const ed = canEdit(p.id), its = ALL.filter(i => i.mid === p.id); let bars = '';
  const hitOf = it => (!query || (titleOf(it) + ' ' + kOrt(KUNDEN[it.kid]) + ' ' + (it.text || '') + ' ' + (it.title || '')).toLowerCase().includes(query)) && (!plFilter || it.pl === plFilter || (it.kind === 'hilfe' && byId(it.link)?.pl === plFilter));
  // Ab Wochenansicht: mehrere kurze Termine im selben Halbtag = ein Block «3 Termine»
  const grpd = new Set();
  if(zoom !== 'tag'){
    const bk = {}; its.forEach(it => { const L = LAY[it.id]; if(!L || !L.segs.length || L.mini || !isShort(it)) return; (bk[Math.floor(it.s * 2)] ??= []).push(it); });
    Object.values(bk).forEach(g => { if(g.length < 2) return; g.sort((a, b) => a.s - b.s).forEach(i => grpd.add(i.id)); const d = Math.floor(g[0].s);
      const s = Math.floor(g[0].s * 2) / 2, e = Math.max(s + .5, ...g.map(i => i.e)); const l = s * dayW + 1, w = Math.max(14, (e - s) * dayW - 2);
      const tip = g.map(i => `${hOf(i.s, d)}–${hOf(i.e, d)}  ${labOf(i)}`).join('\n') + '\n\nKlick: Tagesansicht';
      bars += `<div class="bar tgrp" data-tday="${d}" style="left:${l}px;width:${w}px" title="${esc(tip)}"><span class="t" style="left:3px;width:${w - 6}px">${w > 46 ? g.length + ' Aufträge' : g.length}</span></div>`; });
  }
  its.forEach(it => {
    const L = LAY[it.id]; if(!L || !L.segs.length || grpd.has(it.id)) return;
    const st = barStyle(it), hit = hitOf(it), isOcc = !!it.ser;
    const lab = (it._alt ? `seit ${dLab(Math.floor(it._alt.s))} · ` : '') + labOf(it) + (it.e - it.s > 1 + 1e-6 && !isOcc && it.kind !== 'hilfe' && L.n >= 1 ? ` · ${fmtN(L.n)} T` : '');
    const abw = it.soll && Math.abs(L.n - it.soll) > .01; // Arbeitstage fix, aber Plan weicht ab
    const tip = `${titleOf(it)}\n${spanLabel(it)}\n${p.name}${it.e - it.s > 1 + 1e-6 ? `\n${fmtN(L.n)} Arbeitstage` : ''}${it.pl && P[it.pl] ? `\nZuständig: ${P[it.pl].name}` : ''}${it.allein ? '\nArbeitet allein' : ''}${L.miss.length ? '\nPersonal fehlt!' : ''}${it.ok === false ? '\nNoch nicht abgemacht' : ''}${isOcc ? '\nWiederkehrend' : ''}${it.fix ? '\nStart fix' : ''}${abw ? `\nGeplant ${fmtN(it.soll)} Tage, aktuell ${fmtN(L.n)} Tage` : ''}`;
    // Beschriftung läuft über Wochenenden weiter
    const x0 = L.segs[0][0] * dayW + 5, tw = Math.max(0, (L.segs[L.segs.length - 1][1] - L.segs[0][0]) * dayW - 9);
    const prov = it.ok === false;
    const txt = left => tw > 14 ? `<span class="t" data-x0="${x0}" data-x1="${x0 + tw}" data-l="${left}" style="left:${x0 - left}px;width:${tw}px">${esc(lab)}</span>` : '';
    const bgS = prov ? `background:repeating-linear-gradient(135deg,${st.bg}99 0 5px,#FFFFFF 5px 10px);color:#232B35` : `background:${st.bg};color:${st.fg}`;
    L.segs.forEach((sg, i) => {
      const l = sg[0] * dayW + 1, w = Math.max(3, (sg[1] - sg[0]) * dayW - 2);
      if(i > 0){ const pe = L.segs[i - 1][1] * dayW - 1, gw = l - pe; if(gw > 0) bars += `<div class="brg${hit ? '' : ' dim'}" style="left:${pe}px;width:${gw}px;background:${st.bg};color:${st.fg === '#FFFFFF' ? '#232B35' : st.fg}">${txt(pe)}</div>`; }
      const cls = ['bar', ed && !isOcc ? 'ed' : '', isOcc ? 'occ' : '', prov ? 'provi' : '', it._alt ? 'altb' : '', L.mini ? 'mini' : '', selId === it.id ? 'sel' : '', hit ? '' : 'dim'].join(' ');
      bars += `<div class="${cls}" data-id="${it.id}" style="left:${l}px;width:${w}px;${bgS};border-color:${st.bd}" title="${esc(tip)}">${i === 0 && !isOcc && !it.fix && w >= 30 ? '<span class="hl"></span>' : ''}${txt(l + 1)}${i === L.segs.length - 1 && !isOcc && w >= 30 ? '<span class="hr"></span>' : ''}${i === L.segs.length - 1 && abw ? `<span class="bwarn" title="Geplant ${fmtN(it.soll)} Tage, aktuell ${fmtN(L.n)} Tage">!</span>` : ''}</div>`;
    });
    if(it.allein && L.segs.length) bars += `<span class="bdot" style="left:${L.segs[0][0] * dayW + 3}px" title="Arbeitet allein"></span>`;
    if(L.miss.length){ const slotW = dayW / 2;
      if(slotW >= 7) L.miss.forEach(k => { bars += `<span class="rdot" style="left:${k / 2 * dayW + slotW / 2 - 3.5}px" title="Personal fehlt"></span>`; });
      else [...new Set(L.miss.map(k => k >> 1))].forEach((d, j) => { if(j % Math.max(1, Math.ceil(10 / dayW)) === 0) bars += `<span class="rdot" style="left:${d * dayW + dayW / 2 - 3.5}px" title="Personal fehlt"></span>`; });
    }
  });
  const mine = p.benutzer_id === ME;
  return `<div class="row" data-mid="${p.id}"><div class="nm" title="${esc(p.name + (p.zusatz ? ' · ' + p.zusatz : ''))}"><span class="dot" style="background:${p.farbe || '#fff'}"></span><span class="n">${esc(p.name)}</span>${p.zusatz ? `<span class="z">${esc(p.zusatz)}</span>` : ''}${mine ? '<span class="me">Ich</span>' : ''}${p.farbe && !p.ist_projektleiter ? `<button class="mab${openMid === p.id && openTyp === 'maschine' ? ' on' : ''}" data-mab="${p.id}" data-typ="maschine" title="Maschinen einteilen (aufklappen)" aria-label="Maschinen einteilen">${I('digger')}</button><button class="mab mab2${openMid === p.id && openTyp === 'fahrzeug' ? ' on' : ''}" data-mab="${p.id}" data-typ="fahrzeug" title="Lieferwagen und Anhänger einteilen (aufklappen)" aria-label="Lieferwagen einteilen">${I('truck')}</button>` : ''}${pzBtn(p.id)}</div><div class="lane${ed ? ' ed' : ''}" data-mid="${p.id}" style="width:${W}px;${bgx}">${feierHTML()}${bars}${provBars('p:' + p.id)}${vehLine(p)}</div></div>`;
}
function renderRows(){
  const t = tlEl(); if(!t) return; compute();
  const W = Math.round(NDAYS * dayW), bgx = laneBg();
  const act = PERSONEN.filter(p => p.aktiv);
  if(!act.length){ t.innerHTML = `<div class="leer">Noch keine Personen erfasst.${isBuero() ? '<br><br><a class="btn btn-primary" href="#personen">Personen &amp; Gruppen erfassen</a>' : ''}</div>`; return; }
  let h = headerHTML(W);
  if(layer !== 'p'){ h += ovRows(W, bgx); const sl = t.scrollLeft, stp = t.scrollTop; t.innerHTML = `<div class="grid" style="width:${W + NAMEW}px">${h}</div>`; t.scrollLeft = sl; t.scrollTop = stp; updateRange(); return; }
  const grps = GRUPPEN.concat([{ id: '_ohne', name: 'Ohne Gruppe' }]);
  grps.forEach(g => {
    const ps = act.filter(p => (p.gruppe_id || '_ohne') === g.id).sort((a, b) => a.sortierung - b.sortierung || a.name.localeCompare(b.name));
    if(!ps.length) return; const zu = collapsed.has(g.id);
    h += `<div class="row grp${zu ? ' zu' : ''}" data-g="${g.id}"><div class="nm">${I('chev')}${esc(g.name)} <span style="opacity:.6;font-weight:400">(${ps.length})</span>${isBuero() && g.id !== '_ohne' ? `<button class="gadd" data-gadd="${g.id}" title="Zeile hinzufügen" aria-label="Zeile hinzufügen">${I('plus')}</button>` : ''}</div><div class="lane" style="width:${W}px;height:20px">${provBars('g:' + g.id)}</div></div>`;
    if(!zu) ps.forEach(p => { h += personRow(p, W, bgx); if(openMid === p.id) h += openTyp === 'maschine' ? ovRows(W, bgx, 'maschine', p.id) : vehFocusRows(W, bgx, p.id) + ovRows(W, bgx, 'anhaenger', p.id); });
  });
  const sl = t.scrollLeft, stp = t.scrollTop;
  t.innerHTML = `<div class="grid" style="width:${W + NAMEW}px">${h}</div>`;
  t.scrollLeft = sl; t.scrollTop = stp; updateRange(); stickLabels();
}

// ---------------------------------------------------------------------------
// Fahrzeuge, Maschinen, Anhänger (Etappe 2)
// Maschine hängt an der Baustelle und wandert mit. Stammfahrzeug fährt immer
// mit, wenn sein Fahrer eine Baustelle hat. Doppelt verplant = rot.
// ---------------------------------------------------------------------------
let layer = lsGet('layer', 'p'), RU = {}, NEED = {};
let openMid = null, openTyp = 'maschine';
const LAYERS = { p: 'Plan', maschine: 'Maschinen', fahrzeug: 'Fahrzeuge', anhaenger: 'Anhänger' };
const RTYP = { maschine: 'Maschine', fahrzeug: 'Fahrzeug', anhaenger: 'Anhänger' };
// Fahrzeuge und Maschinen mindestens halbtags
const RS = () => Math.max(.5, SNAP[zoom]);
const rsnap = u => Math.round(u / RS()) * RS();
function rSlots(s, e){ const out = []; if(s == null || e == null) return out; const multi = e - s > 1 + 1e-6;
  for(let k = Math.floor(s * 2 + 1e-9); k <= Math.ceil(e * 2 - 1e-9) - 1; k++){ const d = k >> 1; if(multi && isOff(d)) continue; const a = Math.max(s, k / 2), b = Math.min(e, (k + 1) / 2); if(b - a > 1e-6) out.push(k); } return out; }
function segsOf(slots){ const segs = []; [...slots].sort((a, b) => a - b).forEach(k => { const L = segs[segs.length - 1]; if(L && Math.abs(L[1] - k / 2) < 1e-6) L[1] = (k + 1) / 2; else segs.push([k / 2, (k + 1) / 2]); }); return segs; }
function computeRU(){
  RU = {}; NEED = {};
  ALL.forEach(it => { if(it.kind === 'baustelle' && LAYS(it)) LAY[it.id].free.forEach(k => (NEED[it.mid] ??= new Set()).add(k)); });
  RES.forEach(r => RU[r.id] = { list: [], cnt: {} });
  RESE.forEach(z => { const u = RU[z.rid]; if(!u || z.art !== 'zuteilung') return; let s = z.s, e = z.e, b = null;
    if(z.eid){ b = byId(z.eid); if(!b) return; if(s == null){ s = b.s; e = b.e; } }
    u.list.push({ id: z.id, z, bau: z.eid, mid: z.mid || b?.mid, s, e, slots: rSlots(s, e), own: z.s != null }); });
  RES.forEach(r => { if(r.typ !== 'fahrzeug' || !r.stamm_person_id || !P[r.stamm_person_id]?.aktiv || !RU[r.id]) return; const mid = r.stamm_person_id;
    const weg = new Set(); RESE.forEach(z => { if(z.rid === r.id && z.art === 'stamm_weg') rSlots(z.s, z.e).forEach(k => weg.add(k)); });
    const span = new Set(); ALL.forEach(it => { if(it.mid === mid && it.kind === 'baustelle') rSlots(it.s, it.e).forEach(k => span.add(k)); });
    const need = NEED[mid] || new Set(); const slots = [...span].filter(k => !weg.has(k));

function kwMonday(y, w){ const j4 = new Date(y, 0, 4); const mon = new Date(y, 0, 4 - ((j4.getDay() + 6) % 7) + (w - 1) * 7); return dayIdx(mon); }

  const weeks = []; for(let i = -8; i < 12; i++){ const mon = kwMonday(y0, k0) + i * 7; if(mon < 0) continue; if(mon >= NDAYS) break; const x = dDate(mon + 3); weeks.push({ y: x.getFullYear(), w: kw(mon), mon }); }

    const lane = zu.length ? 'p:' + zu[0].id : (teamLaneId() ? 'g:' + teamLaneId() : null); if(!lane) return;

      const arb = []; let min = 0, fehlt = false;
      (byKk[kk.id] || []).forEach(a => { if((a.abgewaehlte_jahre || []).includes(y)) return; const std = a.arbeit_id ? PF.arb[a.arbeit_id] : null;
        const kws = std ? new Set([...(std.standard_kws || []).filter(x => !(a.kws_minus || []).includes(x)), ...(a.kws_plus || [])]) : new Set(a.kws || []);

    const bl = key.startsWith('p:') ? ALL.filter(i => i.mid === key.slice(2)).map(i => [i.s, i.e]) : [];
    let cur = -1; const out = [];
    list.forEach(p => {
      const len = p.min / 60 / 12; const start = Math.max(p.mon, TODAY) + 1 / 12; if(cur < start) cur = start;

        const d = Math.floor(cur);

async function ladeHoch(it, files){
  for(const f of files){
    const isPdf = f.type === 'application/pdf'; const fid = crypto.randomUUID();
    const ext = isPdf ? 'pdf' : (f.name.split('.').pop() || 'jpg').toLowerCase();
    const pfad = `${it.id}/${fid}.${ext}`;
    toast('Lade hoch: ' + f.name);
    const { error } = await sb.storage.from('planer-dateien').upload(pfad, f, { contentType: f.type });
    if(error){ fehler(error, 'Hochladen'); continue; }
    const { data, error: e2 } = await sb.from('planer_datei').insert({ id: fid, einsatz_id: it.id, art: isPdf ? 'pdf' : 'foto', name: f.name, storage_pfad: pfad }).select().single();
    if(e2){ fehler(e2); continue; }
    (it.files ||= []).push(data);
  }
  renderFiles(it);
}

function mCard(it, d){

async function mFiles(card){
