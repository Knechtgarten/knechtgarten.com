<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Dokumenten-Suche</title>
<style>
  :root {
    --kg-grey-50:  #F6F4F1;
    --kg-grey-100: #EDEAE5;
    --kg-grey-200: #D7D3CE;
    --kg-grey-300: #C1BFB7;
    --kg-grey-600: #8C8A82;
    --kg-grey-700: #4F5358;
    --kg-navy-900: #183345;
    --kg-navy-700: #2C4A5E;
    --kg-navy-100: #E3EAEE;
    --kg-ink:      #1E1E1E;
    --kg-green:       #D2DA21;
    --kg-green-light: #F2F4C9;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #FFFFFF; color: var(--kg-ink);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 13px;
  }
  body { display: flex; flex-direction: column; padding: 14px; gap: 12px; }

  .brand-row { display: flex; align-items: center; gap: 8px; }
  .brand-row .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--kg-navy-900); }
  .brand-row span { font-weight: 700; font-size: 13.5px; color: var(--kg-navy-900); }

  .connect-box { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .connect-box p { margin: 0; font-size: 12px; color: var(--kg-grey-700); line-height: 1.5; }

  button { font-family: inherit; cursor: pointer; }
  .btn-primary {
    background: var(--kg-navy-900); color: #fff; border: none; border-radius: 3px;
    padding: 8px 14px; font-size: 12.5px; font-weight: 600;
  }
  .btn-primary:hover { background: var(--kg-navy-700); }
  .btn-primary:disabled { background: var(--kg-grey-300); cursor: default; }
  .btn-secondary {
    background: transparent; color: var(--kg-navy-900); border: 1px solid var(--kg-navy-900);
    border-radius: 3px; padding: 6px 11px; font-size: 12px; font-weight: 600;
  }

  .search-row {
    display: flex; align-items: center; gap: 8px;
    background: var(--kg-grey-50); border: 1px solid var(--kg-grey-200); border-radius: 3px; padding: 8px 10px;
  }
  .search-row input {
    border: none; background: transparent; outline: none; width: 100%;
    font-size: 13px; color: var(--kg-ink); font-family: inherit;
  }

  .filters { display: flex; flex-direction: column; gap: 8px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 10px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--kg-grey-700); }
  .field input[type="date"] {
    border: 1px solid var(--kg-grey-200); border-radius: 3px; padding: 5px 7px; font-size: 12px; font-family: inherit;
  }
  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: #fff; border: 1px solid var(--kg-grey-200); border-radius: 999px;
    padding: 4px 10px; font-size: 11.5px; color: var(--kg-grey-700); cursor: pointer;
  }
  .chip.active { border-color: var(--kg-navy-900); color: var(--kg-ink); font-weight: 600; background: var(--kg-navy-100); }
  .chip-peax { margin-left: 8px; border-style: dashed; }
  .checkline { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--kg-grey-700); }

  .seg { display: flex; background: var(--kg-grey-50); border: 1px solid var(--kg-grey-200); border-radius: 3px; padding: 2px; gap: 2px; }
  .seg button { flex: 1; border: none; background: transparent; color: var(--kg-grey-700); font-size: 11px; font-family: inherit; padding: 5px 4px; border-radius: 2px; }
  .seg button.active { background: var(--kg-navy-900); color: #fff; font-weight: 600; }

  .results-header { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--kg-grey-200); padding-top: 10px; }
  .results-count { font-size: 12px; font-weight: 600; color: var(--kg-navy-900); }

  .doc-list { display: flex; flex-direction: column; gap: 6px; }
  .doc-row {
    display: flex; align-items: flex-start; gap: 8px;
    background: var(--kg-grey-50); border: 1px solid var(--kg-grey-200); border-radius: 6px; padding: 8px 9px;
    cursor: pointer; text-decoration: none; color: inherit;
  }
  .doc-icon {
    width: 26px; height: 26px; border-radius: 6px; background: var(--kg-navy-100); flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
  }
  .doc-main { flex: 1; min-width: 0; }
  .doc-top-line { display: flex; align-items: center; gap: 6px; }
  .doc-title { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .doc-meta { font-size: 10.5px; color: var(--kg-grey-700); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-begruendung { font-size: 10.5px; color: var(--kg-grey-700); margin-top: 2px; }
  .match-badge {
    flex: none; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 999px; white-space: nowrap;
  }
  .match-badge.hoch { background: var(--kg-green-light); color: var(--kg-navy-900); border: 1px solid var(--kg-green); }
  .match-badge.moeglich { background: #fff; color: var(--kg-grey-700); border: 1px solid var(--kg-grey-200); }

  .status-line { font-size: 11.5px; color: var(--kg-grey-700); }
  .status-line.err { color: #B4655F; }

  [hidden] { display: none !important; }
</style>
</head>
<body>

  <div class="brand-row"><span class="dot"></span><span>Dokumenten-Suche</span></div>

  <div id="connectBox" class="connect-box">
    <p>Für die Suche in Drive und Gmail braucht es einmalig eine Anmeldung mit deinem Google-Konto.</p>
    <button id="connectBtn" class="btn-primary">Mit Google verbinden</button>
    <div id="connectStatus" class="status-line"></div>
  </div>

  <div id="searchBox" hidden>
    <div class="search-row">
      <input id="queryInput" type="text" placeholder="Wonach suchst du?">
    </div>

    <div class="filters" style="margin-top:8px;">
      <div class="field">
        <label>Zeitraum ab</label>
        <input id="zeitraumVon" type="date">
      </div>

      <div class="field">
        <label>Quelle</label>
        <div class="chip-row">
          <span class="chip active" data-quelle="drive">Drive</span>
          <span class="chip active" data-quelle="gmail">Gmail</span>
          <span class="chip chip-peax" id="peaxBtn" title="Öffnet die PEAX-Suche in einem neuen Tab">PEAX ↗</span>
        </div>
      </div>

      <div class="field">
        <label>Suchgenauigkeit</label>
        <div class="seg">
          <button type="button" data-genauigkeit="genau">Genau</button>
          <button type="button" data-genauigkeit="teilwort">Teilwort</button>
          <button type="button" class="active" data-genauigkeit="sinngemaess">Sinngemäss</button>
        </div>
      </div>

      <div class="field">
        <label>Suchintensität</label>
        <div class="seg">
          <button type="button" data-runden="2" title="Weniger Suchrunden, schneller fertig">Schnell</button>
          <button type="button" class="active" data-runden="4" title="Übliche Balance aus Gründlichkeit und Wartezeit">Normal</button>
          <button type="button" data-runden="7" title="Mehr Suchrunden erlaubt, kann bei schwierigen Anfragen mehr finden - dauert evtl. länger">Ausführlich</button>
        </div>
      </div>

      <label class="checkline"><input type="checkbox" id="papierkorbSpam"> Auch Papierkorb/Spam durchsuchen</label>
    </div>

    <button id="searchBtn" class="btn-primary" style="margin-top:10px; width:100%;">Suchen</button>

    <div id="dokumentartFilterRow" class="chip-row" style="margin-top:10px;" hidden></div>

    <div id="resultsHeader" class="results-header" hidden>
      <span id="resultsCount" class="results-count"></span>
    </div>
    <div id="statusLine" class="status-line"></div>
    <div id="docList" class="doc-list" style="margin-top:8px;"></div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
