<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Dokumenten-Suche</title>
<style>
  :root {
    --kg-grey-50:  #F6F4F1;
    --kg-grey-100: #EDEAE5;
    --kg-grey-200: #D7D3CE;
    --kg-grey-300: #C1BFB7;
    --kg-grey-600: #8C8A82;
    --kg-grey-700: #4F5358;
    --kg-navy-900: #183345;
    --kg-navy-700: #2C4A5E;
    --kg-navy-100: #E3EAEE;
    --kg-ink:      #1E1E1E;
    --kg-green:       #D2DA21;
    --kg-green-light: #F2F4C9;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #FFFFFF; color: var(--kg-ink);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 13px;
  }
  body { display: flex; flex-direction: column; padding: 14px; gap: 12px; }

  .brand-row { display: flex; align-items: center; gap: 8px; }
  .brand-row img { width: 20px; height: 20px; border-radius: 5px; }
  .brand-row span { font-weight: 700; font-size: 13.5px; color: var(--kg-navy-900); }

  .connect-box { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .connect-box p { margin: 0; font-size: 12px; color: var(--kg-grey-700); line-height: 1.5; }

  button { font-family: inherit; cursor: pointer; }
  .btn-primary {
    background: var(--kg-navy-900); color: #fff; border: none; border-radius: 3px;
    padding: 8px 14px; font-size: 12.5px; font-weight: 600;
  }
  .btn-primary:hover { background: var(--kg-navy-700); }
  .btn-primary:disabled { background: var(--kg-grey-300); cursor: default; }
  .btn-secondary {
    background: transparent; color: var(--kg-navy-900); border: 1px solid var(--kg-navy-900);
    border-radius: 3px; padding: 6px 11px; font-size: 12px; font-weight: 600;
  }

  .search-row {
    display: flex; align-items: center; gap: 8px;
    background: var(--kg-grey-50); border: 1px solid var(--kg-grey-200); border-radius: 3px; padding: 8px 10px;
  }
  .search-row input {
    border: none; background: transparent; outline: none; width: 100%;
    font-size: 13px; color: var(--kg-ink); font-family: inherit;
  }

  .filters { display: flex; flex-direction: column; gap: 8px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 10px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--kg-grey-700); }
  .field input[type="date"] {
    border: 1px solid var(--kg-grey-200); border-radius: 3px; padding: 5px 7px; font-size: 12px; font-family: inherit; width: 100%;
  }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .zeitraum-row { display: flex; align-items: center; gap: 4px; }
  .datum-input {
    flex: 1 1 0; min-width: 0;
    border: 1px solid var(--kg-grey-200); border-radius: 3px; padding: 4px 2px; font-size: 10.5px; font-family: inherit;
  }
  .bis-sep { color: var(--kg-grey-600); flex: none; }
  .chip-klein { flex: none; padding: 4px 7px; }
  .text-input { border: 1px solid var(--kg-grey-200); border-radius: 3px; padding: 6px 8px; font-size: 12px; font-family: inherit; width: 100%; }
  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: #fff; border: 1px solid var(--kg-grey-200); border-radius: 999px;
    padding: 4px 10px; font-size: 11.5px; color: var(--kg-grey-700); cursor: pointer;
  }
  .chip.active { border-color: var(--kg-navy-900); color: var(--kg-ink); font-weight: 600; background: var(--kg-navy-100); }
  .chip-peax { margin-left: 8px; border-style: dashed; }
  .checkline { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--kg-grey-700); }
  .hinweis-klein { font-size: 10px; color: var(--kg-grey-600); margin: 2px 0 0 20px; }

  .seg { display: flex; background: var(--kg-grey-50); border: 1px solid var(--kg-grey-200); border-radius: 3px; padding: 2px; gap: 2px; }
  .seg button { flex: 1; border: none; background: transparent; color: var(--kg-grey-700); font-size: 11px; font-family: inherit; padding: 5px 4px; border-radius: 2px; }
  .seg button.active { background: var(--kg-navy-900); color: #fff; font-weight: 600; }

  .results-header { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--kg-grey-200); padding-top: 10px; gap: 8px; }
  .results-count { font-size: 12px; font-weight: 600; color: var(--kg-navy-900); flex: none; }
  .sort-select {
    font-family: inherit; font-size: 10.5px; color: var(--kg-grey-700);
    border: 1px solid var(--kg-grey-200); border-radius: 3px; padding: 3px 5px; background: #fff;
  }

  .doc-list { display: flex; flex-direction: column; gap: 4px; }
  .doc-row {
    position: relative;
    display: flex; align-items: flex-start; gap: 7px;
    background: var(--kg-grey-50); border: 1px solid var(--kg-grey-200); border-radius: 5px; padding: 5px 7px;
    cursor: pointer; text-decoration: none; color: inherit;
  }
  .doc-icon { width: 17px; height: 20px; flex: none; display: block; margin-top: 1px; }
  .doc-icon svg { width: 100%; height: 100%; display: block; }
  .doc-main { flex: 1; min-width: 0; }
  .doc-top-line { display: flex; align-items: center; gap: 5px; }
  .doc-title { font-size: 11px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .doc-meta { font-size: 9.5px; color: var(--kg-grey-700); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-begruendung {
    font-size: 9.5px; color: var(--kg-grey-700); margin-top: 1px; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .match-badge { padding: 1px 5px; }

  /* Hover-Vorschau: kleines Vorschaubild neben der Zeile, nur wenn vorhanden */
  .doc-row .hover-vorschau {
    position: absolute; left: 100%; top: 0; margin-left: 6px; z-index: 20;
    width: 130px; max-height: 160px; object-fit: contain;
    border: 1px solid var(--kg-grey-200); border-radius: 5px; background: #fff;
    box-shadow: 0 6px 16px rgba(0,0,0,.18);
    opacity: 0; pointer-events: none; transition: opacity .12s ease;
  }
  .doc-row:hover .hover-vorschau { opacity: 1; }
  .match-badge {
    flex: none; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 999px; white-space: nowrap;
  }
  .match-badge.hoch { background: var(--kg-green-light); color: var(--kg-navy-900); border: 1px solid var(--kg-green); }
  .match-badge.moeglich { background: #fff; color: var(--kg-grey-700); border: 1px solid var(--kg-grey-200); }

  .status-line { font-size: 11.5px; color: var(--kg-grey-700); }
  .status-line.err { color: #B4655F; }

  .ftype-chip { padding: 5px 10px; }
  .ftype-chip .chip-icon { width: 19px; height: 22px; display: inline-block; vertical-align: middle; }
  .ftype-chip .chip-icon svg { width: 100%; height: 100%; display: block; }

  .src-icon { width: 12px; height: 12px; display: inline-flex; vertical-align: middle; margin-right: 3px; }
  .src-icon svg { width: 100%; height: 100%; display: block; }

  .steps-details {
    background: var(--kg-grey-50); border: 1px solid var(--kg-grey-200); border-radius: 6px;
    padding: 8px 10px; margin-top: 10px; font-size: 11px; color: var(--kg-grey-700);
  }
  .steps-details summary { font-weight: 600; color: var(--kg-navy-900); cursor: pointer; }
  .steps-details ol { margin: 8px 0 0; padding-left: 18px; }
  .steps-details li { margin-bottom: 4px; }

  /* --- Vorschau-Lightbox: klicken statt sofort in neuem Tab oeffnen --- */
  .lightbox-backdrop {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(20, 26, 30, .5);
    display: none; align-items: center; justify-content: center;
  }
  .lightbox-backdrop.open { display: flex; }
  .lightbox-card {
    width: min(480px, 96%);
    max-height: 92vh; overflow-y: auto;
    background: #fff; border-radius: 10px; padding: 14px;
    display: flex; flex-direction: column; gap: 12px; position: relative;
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
  }
  .lightbox-close {
    position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%;
    border: 1px solid var(--kg-grey-200); background: var(--kg-grey-50); color: var(--kg-grey-700);
    display: flex; align-items: center; justify-content: center;
  }
  .lightbox-head { display: flex; align-items: flex-start; gap: 10px; padding-right: 20px; }
  .lightbox-head .doc-icon { width: 24px; height: 28px; }
  .lightbox-title { font-size: 13px; font-weight: 700; color: var(--kg-ink); line-height: 1.35; }
  .lightbox-meta { font-size: 10.5px; color: var(--kg-grey-700); margin-top: 3px; }
  .lightbox-vorschau-wrap {
    width: calc(100% + 28px); margin: 0 -14px; height: 65vh;
    overflow: hidden; position: relative; cursor: grab;
    border-top: 1px solid var(--kg-grey-200); border-bottom: 1px solid var(--kg-grey-200);
    background: var(--kg-grey-50);
  }
  .lightbox-vorschau-wrap.greift { cursor: grabbing; }
  .lightbox-vorschaubild {
    position: absolute; top: 0; left: 0; width: 112%; max-width: none; height: auto;
    user-select: none; -webkit-user-drag: none;
  }
  .lightbox-body { font-size: 12px; line-height: 1.55; color: var(--kg-ink); background: var(--kg-grey-50); border: 1px solid var(--kg-grey-200); border-radius: 6px; padding: 10px; }
  .lightbox-actions { display: flex; align-items: center; justify-content: space-between; }
  .lightbox-nav {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 101;
    width: 30px; height: 30px; border-radius: 50%;
    background: #fff; border: 1px solid var(--kg-grey-200); color: var(--kg-navy-900);
    display: flex; align-items: center; justify-content: center;
  }
  .lightbox-nav.prev { left: 8px; }
  .lightbox-nav.next { right: 8px; }

  [hidden] { display: none !important; }
</style>
</head>
<body>

  <div class="brand-row"><img src="icons/icon48.png" alt=""><span>Dokumenten-Suche</span></div>

  <div id="connectBox" class="connect-box">
    <p>Für die Suche in Drive und Gmail braucht es einmalig eine Anmeldung mit deinem Google-Konto.</p>
    <button id="connectBtn" class="btn-primary">Mit Google verbinden</button>
    <div id="connectStatus" class="status-line"></div>
  </div>

  <div id="searchBox" hidden>
    <div class="search-row">
      <input id="queryInput" type="text" placeholder="Wonach suchst du?">
    </div>

    <div class="filters" style="margin-top:8px;">
      <div class="field">
        <label>Zeitraum</label>
        <div class="zeitraum-row">
          <span class="chip chip-klein active" id="btnZeitraum6Wochen" title="Letzte 6 Wochen">6W</span>
          <span class="chip chip-klein" id="btnZeitraumJahr" title="Dieses Jahr">Jahr</span>
          <input id="zeitraumVon" type="date" class="datum-input">
          <span class="bis-sep">–</span>
          <input id="zeitraumBis" type="date" class="datum-input">
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Kunde</label>
          <input id="kundeFeld" type="text" placeholder="z. B. Müller" class="text-input">
        </div>
        <div class="field">
          <label>Lieferant</label>
          <input id="lieferantFeld" type="text" placeholder="tippen oder wählen" class="text-input" list="lieferantenListe" autocomplete="off">
          <datalist id="lieferantenListe"></datalist>
        </div>
      </div>

      <div class="field">
        <label>Suchgenauigkeit</label>
        <div class="seg">
          <button type="button" data-genauigkeit="genau">Genau</button>
          <button type="button" data-genauigkeit="teilwort">Teilwort</button>
          <button type="button" class="active" data-genauigkeit="sinngemaess">Sinngemäss</button>
        </div>
      </div>

      <div class="field">
        <label>Suchintensität</label>
        <div class="seg">
          <button type="button" data-modell="haiku" data-runden="3" title="Schnelleres KI-Modell (Haiku), etwas weniger differenziert bei kniffligen Fällen">Schnell</button>
          <button type="button" class="active" data-modell="sonnet" data-runden="7" title="Gründlicheres KI-Modell (Sonnet), dauert etwas länger">Ausführlich</button>
        </div>
      </div>

      <div class="field">
        <label>Dokumentart</label>
        <div id="dokumentartVorabRow" class="chip-row"></div>
      </div>

      <div class="field">
        <label>Dateiformat</label>
        <div id="dateiformatRow" class="chip-row"></div>
      </div>

      <div class="field">
        <label>Quelle</label>
        <div class="chip-row">
          <span class="chip active" id="quelleAlleBtn">Alle</span>
          <span class="chip active" data-quelle="drive">Drive</span>
          <span class="chip active" data-quelle="gmail">Gmail</span>
          <span class="chip chip-peax" id="peaxBtn" title="Öffnet die PEAX-Suche in einem neuen Tab">PEAX ↗</span>
        </div>
      </div>

      <label class="checkline"><input type="checkbox" id="papierkorbSpam"> Auch Papierkorb/Spam durchsuchen</label>

      <div>
        <label class="checkline"><input type="checkbox" id="anhaengeDurchsuchen"> Mail-Anhänge inhaltlich durchsuchen</label>
        <div class="hinweis-klein">Deutlich langsamer, da jeder Anhang einzeln geöffnet und gelesen wird.</div>
      </div>
    </div>

    <button id="searchBtn" class="btn-primary" style="margin-top:10px; width:100%;">Suchen</button>

    <details class="steps-details" id="suchschritteBox" hidden>
      <summary>Wonach die KI gesucht hat</summary>
      <ol id="suchschritteListe"></ol>
    </details>

    <div id="resultsHeader" class="results-header" hidden>
      <span id="resultsCount" class="results-count"></span>
      <select id="sortSelect" class="sort-select">
        <option value="relevanz">Relevanz</option>
        <option value="datum-neu">Datum, neueste zuerst</option>
        <option value="datum-alt">Datum, älteste zuerst</option>
        <option value="dateityp">Dateityp</option>
      </select>
    </div>
    <div id="statusLine" class="status-line"></div>
    <div id="docList" class="doc-list" style="margin-top:8px;"></div>
  </div>

  <div class="lightbox-backdrop" id="lightbox">
    <button class="lightbox-nav prev" id="lbPrev" title="Vorheriges Dokument">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <div class="lightbox-card">
      <button class="lightbox-close" id="lbClose" title="Schliessen">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="lightbox-head">
        <span class="doc-icon" id="lbIcon"></span>
        <div>
          <div class="lightbox-title" id="lbTitle"></div>
          <div class="lightbox-meta" id="lbMeta"></div>
        </div>
      </div>
      <span class="match-badge" id="lbMatch" style="align-self:flex-start;"></span>
      <div id="lbVorschauWrap" class="lightbox-vorschau-wrap" hidden>
        <img id="lbVorschauBild" class="lightbox-vorschaubild">
      </div>
      <div class="lightbox-body" id="lbBody"></div>
      <div class="lightbox-actions">
        <span class="status-line" id="lbPosition"></span>
        <button class="btn-primary" id="lbOpen">Öffnen ↗</button>
      </div>
    </div>
    <button class="lightbox-nav next" id="lbNext" title="Nächstes Dokument">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
