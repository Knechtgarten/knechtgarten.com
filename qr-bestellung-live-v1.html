<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=101"></script>
<title>QR-Bestellung</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#323E4E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kg-doku.js?v=9"></script>
<style>
/* QR-Bestellung: Mitarbeitende bestellen per Kleber-Scan (Vormerkung), das Büro legt es über die Erweiterung «Knechtgarten»
   in den Shop-Warenkorb und schickt im Shop selbst ab. Nur Lieferanten mit angebundenem Shop (bestell_anbindung). */
nav.subnav{background:#fff;border-bottom:1px solid #E1E5E9;} nav.subnav .wrap{display:flex;gap:2px;padding:0 16px;}
nav.subnav a{padding:12px 12px 10px;color:#6B7079;font-weight:600;text-decoration:none;font-size:13px;border-bottom:2px solid transparent;}
nav.subnav a.on{color:#323E4E;border-bottom-color:#323E4E;}
.qb{max-width:1100px;margin:20px auto;padding:0 16px 40px;display:flex;flex-direction:column;gap:14px;color:#232B35;}
.qb h1{margin:0;font:600 22px Jost,Arial,sans-serif;color:#323E4E;} .qb .unter{font-size:13px;color:#6B7079;margin-top:2px;}
.qb-kopf{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;} .qb-kopf>div:first-child{flex:1;min-width:220px;}
.qb .qb-such{width:280px;max-width:100%;flex:none;}
.qb-grp{background:#fff;border:1px solid #E1E5E9;border-radius:12px;overflow:hidden;}
.qb-gk{display:flex;align-items:center;gap:12px;padding:12px 14px;flex-wrap:wrap;}
.qb-logo{width:34px;height:34px;border-radius:8px;background:#E3EAEE;color:#323E4E;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;}
.qb-logo img{width:100%;height:100%;object-fit:contain;background:#fff;}
.qb-gn b{display:block;font-size:15px;} .qb-gn small{font-size:12px;color:#6B7079;}
.qb-badge{background:#EEF1F4;color:#4C5C70;font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 10px;}
.qb-gk .knoepfe{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.qb-link{all:unset;cursor:pointer;font-size:12px;color:#4C5C70;text-decoration:underline;}
.qb-kz,.kg-zeile.qb-z{display:grid;grid-template-columns:100px minmax(0,1fr) 76px 56px 150px 190px 30px;gap:10px;align-items:center;padding:8px 14px;}
.qb-kz{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:#5F6670;font-weight:700;border-top:1px solid #EEF1F4;}
.kg-zeile.qb-z{border-top:1px solid #EEF1F4;font-size:13px;}
.qb-z.grau{color:#6B7079;} .qb-z.fehler{background:#FDF1EF;}
.qb-z .fz{grid-column:2/-1;color:#B4423A;font-size:12px;}
.qb-z input{height:28px;border:1px solid #D5DBE1;border-radius:6px;padding:0 6px;font:13px inherit;font-family:inherit;width:100%;box-sizing:border-box;min-width:0;}
.qb-z input.m{text-align:right;}
.qb-z .r{text-align:right;} .qb-z .klein{font-size:12px;color:#6B7079;}
.qb-leer{background:#fff;border:1px dashed #D5DBE1;border-radius:12px;padding:22px;text-align:center;color:#6B7079;font-size:14px;}
.qb-hin{font-size:12px;color:#6B7079;}
.qb .qb-scan{display:none;}
.qb-st{display:inline-flex;font-size:12px;font-weight:700;border-radius:20px;padding:3px 10px;}
.qb-st.u{background:#D6E7F4;color:#25384D;} .qb-st.g{background:#E7EDB0;color:#3D4210;}
.qb-tab{width:100%;border-collapse:collapse;background:#fff;} .qb-tab th{padding:9px 12px;font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:#5F6670;text-align:left;}
.qb-tab td{padding:10px 12px;border-top:1px solid #EEF1F4;font-size:13px;vertical-align:top;} .qb-tab tr.kopf{cursor:pointer;} .qb-tab tr.kopf:hover td{background:#F8FAFB;}
.qb-tab .det td{background:#FAFBFC;font-size:12.5px;color:#4C5C70;}
.qb-tab input[type=checkbox]{width:18px;height:18px;accent-color:#323E4E;}
.qb-karte{background:#fff;border:1px solid #E1E5E9;border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;}
.qb-karte h2{margin:0;font-size:16px;color:#323E4E;display:flex;align-items:center;gap:10px;}
.qb-pers{display:flex;flex-direction:column;border:1px solid #E1E5E9;border-radius:8px;}
.qb-pers label{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid #EEF1F4;font-size:14px;cursor:pointer;} .qb-pers label:first-child{border-top:0;}
.qb-pers input{width:16px;height:16px;accent-color:#323E4E;}
.qb-anb{border:1px solid #E1E5E9;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;}
.qb-anb .reihe{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;} .qb-anb .kgd-feld{flex:1;min-width:180px;}
.qb-anb .kopf{display:flex;align-items:center;gap:10px;flex-wrap:wrap;} .qb-anb .kopf b{font-size:15px;}
.qb-ok{color:#4C5A10;font-size:12px;} .qb-err{color:#B4423A;font-size:12px;}
.qb-video{position:fixed;inset:0;background:#000;z-index:400;display:flex;flex-direction:column;}
.qb-video video{flex:1;width:100%;object-fit:cover;} .qb-video .zu{position:absolute;top:14px;right:14px;}
.qb-video .rahmen{position:absolute;left:50%;top:45%;width:62vw;max-width:300px;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid #D1DB5F;border-radius:16px;}
.qb-video .txt{position:absolute;bottom:40px;left:0;right:0;text-align:center;color:#fff;font-size:15px;}
@media (max-width:760px){
  .nurpc,.qb .nurpc{display:none!important;}
  .qb .qb-scan{display:flex;height:54px;border-radius:12px;font-size:17px;}
  .qb-kz{display:none;}
  .kg-zeile.qb-z{grid-template-columns:minmax(0,1fr) auto 30px;gap:4px 10px;}
  .qb-z .c-nr,.qb-z .c-ein{display:none;} .qb-z .c-bez{grid-column:1;} .qb-z .c-menge{grid-column:2;grid-row:1;}
  .qb-z .c-von,.qb-z .c-notiz{grid-column:1/3;font-size:12px;color:#6B7079;} .qb-z .c-weg{grid-column:3;grid-row:1;}
  .qb-z input.m{width:64px;}
}
</style>
</head>
<body>
<header class="app"><div class="wrap">
  <a class="backlink" href="index.html">Startseite</a>
  <div class="brand"><h1>QR-Bestellung</h1></div>
  <span class="userbar hidden" id="userbar"><span id="userbarText"></span><button id="logoutBtn">Abmelden</button></span>
</div></header>
<nav class="subnav" id="subnav"><div class="wrap">
  <a href="?r=offen" data-r="offen">Offen</a>
  <a href="?r=bestellt" data-r="bestellt" class="nurpc">Bestellt</a>
  <a href="?r=einst" data-r="einst" class="hidden nurpc">Einstellungen</a>
</div></nav>
<main id="appMain"></main>
<script>
const $ = id => document.getElementById(id);
const EXT_MIN = 34000;   // Erweiterung «Knechtgarten» ab 0.34.0
const extVer = () => { const v = document.documentElement.dataset.kgExt; return v ? v.split('.').map(Number).reduce((s, x) => s * 1000 + x, 0) : 0; };
function ext(auftrag, daten, sek = 180){
  return new Promise((ok, nein) => {
    if(!document.documentElement.dataset.kgExt) return nein(new Error('ohne'));
    if(extVer() < EXT_MIN) return nein(new Error('alt'));
    const nr = crypto.randomUUID();
    const f = e => { if(e.source !== window || e.data?.kanal !== 'kg-ext' || e.data.typ !== 'antwort' || e.data.nr !== nr) return;
      removeEventListener('message', f); clearTimeout(t); ok(e.data.antwort || { fehler: 'keine Antwort' }); };
    const t = setTimeout(() => { removeEventListener('message', f); nein(new Error('Der Shop antwortet nicht.')); }, sek * 1000);
    addEventListener('message', f);
    postMessage({ kanal: 'kg-ext', typ: 'anfrage', nr, auftrag, daten }, location.origin);
  });
}
const extFehler = e => e.message === 'ohne' ? 'Dafür braucht es die Chrome-Erweiterung «Knechtgarten» (ab Version 0.34) am PC.'
  : e.message === 'alt' ? 'Die Chrome-Erweiterung «Knechtgarten» ist zu alt. Es braucht Version 0.34 oder neuer.' : e.message;

async function aufbau(main){
  // nach dem Anmelden zurück zur Artikelseite (Kleber gescannt, «Anmelden zum Bestellen»)
  const zur = new URLSearchParams(location.search).get('zurueck');
  if(zur && /^\/a\/[A-Za-z0-9]+$/.test(zur)){ location.replace(zur); return; }
  const { esc, ic } = KGD, sb = KGD.sb;
  const { data: ich } = await sb.from('benutzer').select('rolle').eq('id', KGD.ich).maybeSingle();
  const admin = ich?.rolle === 'admin', buero = admin || ich?.rolle === 'buero_team';
  if(admin) document.querySelector('[data-r="einst"]').classList.remove('hidden');
  let ansicht = new URLSearchParams(location.search).get('r') || 'offen';
  if(ansicht === 'einst' && !admin) ansicht = 'offen';
  let POS = [], ALT = [], ANB = new Map(), suche = '', fehlerNr = new Map(), laeuft = null, offenDet = new Set();

  const datum = v => { if(!v) return ''; const d = new Date(v), h = new Date(), gestern = new Date(Date.now() - 864e5);
    if(d.toDateString() === h.toDateString()) return 'heute ' + d.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
    if(d.toDateString() === gestern.toDateString()) return 'gestern';
    return d.toLocaleDateString('de-CH', { day: '2-digit', month: '2-digit' }) + '.'; };
  const datumLang = v => v ? new Date(v).toLocaleDateString('de-CH', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '';
  const lname = l => (l && (l.name || l.firma)) || 'Lieferant';
  // Shop-Systeme, die die Erweiterung kann; Warenkorb-Adresse pro System
  const SYSTEME = { magento: 'Magento', dabag: 'Dabag', hybris: 'SAP Commerce (Hybris)' };
  const korbUrl = a => { if(!a) return '#'; const b = (a.shop_url || '').replace(/\/+$/, '');
    return a.plattform === 'dabag' ? `${b}/?srv=basket&companyYN=${a.optionen?.firmenkorb ? 1 : 0}`
      : a.plattform === 'hybris' ? `${b}/${a.sprache || 'de'}/cart` : `${b}/${a.sprache || 'de'}/checkout/cart/`; };
  const kuerzel = n => n.replace(/[^A-Za-zÄÖÜäöü ]/g, '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
  const zahl = n => (Math.round(n * 100) / 100).toLocaleString('de-CH');

  async function laden(){
    const SEL = 'id,artikel_id,lieferant_id,menge,notiz,status,erstellt_von,erstellt_name,erstellt_am,lauf,warenkorb_am,bestellt_am,geliefert_am,artikel:artikel_id(bezeichnung,artikelnummer_lieferant,einheit),lieferant:lieferant_id(name,firma,logo_url)';
    const seit = new Date(Date.now() - 60 * 864e5).toISOString();
    const [a, b, c] = await Promise.all([
      sb.from('bestell_position').select(SEL).in('status', ['offen', 'warenkorb']).order('erstellt_am'),
      sb.from('bestell_position').select(SEL).in('status', ['bestellt', 'geliefert']).gte('bestellt_am', seit).order('bestellt_am', { ascending: false }),
      sb.from('bestell_anbindung').select('*')]);
    if(a.error) KGD.toast('Laden fehlgeschlagen: ' + a.error.message, true);
    POS = a.data || []; ALT = b.data || []; ANB = new Map((c.data || []).map(x => [x.lieferant_id, x]));
  }

  // Bestätigungsseiten, die die Erweiterung im Shop erkannt hat → «Bestellt»
  async function bestaetigungen(){
    if(!buero || extVer() < EXT_MIN) return;
    let r; try { r = await ext('shopBestaetigungen', {}, 20); } catch(_){ return; }
    const liste = r?.liste || []; if(!liste.length) return;
    for(const b of liste) await sb.from('bestell_position').update({ status: 'bestellt', bestellt_am: b.am, bestellt_von: KGD.ich }).eq('lauf', b.lauf).eq('status', 'warenkorb');
    await ext('shopQuittieren', { laeufe: liste.map(b => b.lauf) }, 20).catch(() => {});
    KGD.toast('Bestellung im Shop abgeschickt, steht jetzt unter «Bestellt».');
    await laden(); zeichnen();
  }
  addEventListener('message', e => { if(e.source === window && e.data?.kanal === 'kg-ext' && e.data.typ === 'ereignis' && e.data.ereignis === 'shop-bestaetigt') bestaetigungen(); });

  function reiter(){ document.querySelectorAll('#subnav [data-r]').forEach(a => a.classList.toggle('on', a.dataset.r === ansicht)); }
  function gehe(r, push = true){ ansicht = r; if(push) history.pushState({ r }, '', '?r=' + r); reiter(); zeichnen(); }
  document.getElementById('subnav').addEventListener('click', e => { const a = e.target.closest('[data-r]'); if(!a) return; e.preventDefault(); gehe(a.dataset.r); });
  addEventListener('popstate', () => { gehe(new URLSearchParams(location.search).get('r') || 'offen', false); });

  // ---------------- Offen ----------------
  function zeileHtml(p){
    const a = p.artikel || {}, darf = p.status === 'offen' && (buero || p.erstellt_von === KGD.ich), f = fehlerNr.get(p.id);
    return `<div class="kg-zeile qb-z${p.status === 'warenkorb' ? ' grau' : ''}${f ? ' fehler' : ''}" data-id="${p.id}">
      <span class="c-nr">${esc(a.artikelnummer_lieferant || '')}</span>
      <span class="c-bez">${esc(a.bezeichnung || '')}</span>
      <span class="c-menge r">${darf ? `<input class="m" type="number" min="0.01" step="any" value="${p.menge}" data-feld="menge" aria-label="Menge">` : `<b>${zahl(p.menge)}</b>`}</span>
      <span class="c-ein">${esc(a.einheit || '')}</span>
      <span class="c-von klein">${esc(p.erstellt_name || '')} · ${datum(p.erstellt_am)}</span>
      <span class="c-notiz">${darf ? `<input type="text" value="${esc(p.notiz || '')}" data-feld="notiz" placeholder="Notiz" aria-label="Notiz">` : `<span class="klein">${esc(p.notiz || '')}</span>`}</span>
      <span class="c-weg">${darf ? `<button type="button" class="kg-ibtn danger kg-hover" data-weg="${p.id}" title="Entfernen" aria-label="Entfernen">${ic('trash', 14)}</button>` : ''}</span>
      ${f ? `<span class="fz">${esc(f)}</span>` : ''}</div>`;
  }
  function offenHtml(){
    const q = suche.toLowerCase();
    const liste = POS.filter(p => !q || [(p.artikel || {}).bezeichnung, (p.artikel || {}).artikelnummer_lieferant, lname(p.lieferant), p.notiz, p.erstellt_name].join(' ').toLowerCase().includes(q));
    const grp = new Map(); liste.forEach(p => { if(!grp.has(p.lieferant_id)) grp.set(p.lieferant_id, []); grp.get(p.lieferant_id).push(p); });
    const anzahl = POS.filter(p => p.status === 'offen').length, lief = new Set(POS.filter(p => p.status === 'offen').map(p => p.lieferant_id)).size;
    let h = `<div class="qb-kopf"><div><h1>Offene Bestellungen</h1><div class="unter">${anzahl ? `${anzahl} Artikel bei ${lief} Lieferant${lief === 1 ? '' : 'en'}` : 'Nichts offen'} · nur Lieferanten mit angebundenem Shop</div></div>
      <input class="kgd-t qb-such nurpc" type="search" id="such" placeholder="Artikel oder Lieferant …" value="${esc(suche)}" data-kg-suche aria-label="Suchen"></div>
      <button type="button" class="kgd-btn prim qb-scan" id="scan">${ic('qr', 20)}Kleber scannen</button>`;
    if(!grp.size) return h + `<div class="qb-leer">${q ? 'Nichts gefunden.' : 'Keine offenen Bestellungen. Zum Bestellen den QR-Kleber im Lager mit dem Handy scannen.'}</div>`;
    for(const [lid, ps] of grp){
      const l = ps[0].lieferant || {}, n = lname(l), offen = ps.filter(p => p.status === 'offen'), wk = ps.filter(p => p.status === 'warenkorb');
      const wkSeit = wk.length ? wk.map(p => p.warenkorb_am).sort()[0] : null, anb = ANB.get(lid);
      h += `<section class="qb-grp" data-lief="${lid}"><div class="qb-gk">
        <span class="qb-logo">${l.logo_url ? `<img src="${esc(l.logo_url)}" alt="">` : esc(kuerzel(n))}</span>
        <span class="qb-gn"><b>${esc(n)}</b><small>${ps.length} Artikel</small></span>
        ${wk.length ? `<span class="qb-badge">Im Warenkorb seit ${datum(wkSeit)} · noch nicht abgeschickt</span>` : ''}
        ${buero ? `<span class="knoepfe nurpc">
          ${wk.length ? `<button type="button" class="qb-link" data-istbestellt="${lid}">Ist schon bestellt?</button>
            <a class="kgd-btn ghost" href="${esc(korbUrl(anb))}" target="_blank" rel="noopener">${ic('link', 14)}Warenkorb öffnen</a>` : ''}
          ${offen.length ? `<button type="button" class="kgd-btn prim" data-shop="${lid}"${laeuft ? ' disabled' : ''}>${laeuft === lid ? 'Läuft …' : 'Im Shop bestellen'}</button>` : ''}</span>` : ''}
        </div>
        <div class="qb-kz"><span>Art.-Nr.</span><span>Bezeichnung</span><span style="text-align:right">Menge</span><span>Einheit</span><span>Vorgemerkt</span><span>Notiz</span><span></span></div>
        ${ps.map(zeileHtml).join('')}</section>`;
    }
    return h + (POS.some(p => p.status === 'warenkorb') ? '<div class="qb-hin">Grau = schon im Warenkorb des Shops. Sobald du im Shop abschickst, erkennt die Erweiterung die Bestätigung und die Artikel wandern zu «Bestellt».</div>' : '');
  }

  // ---------------- Bestellt ----------------
  function bestelltHtml(){
    const grp = new Map(); ALT.forEach(p => { const k = p.lauf || p.id; if(!grp.has(k)) grp.set(k, []); grp.get(k).push(p); });
    let h = '<div class="qb-kopf"><div><h1>Bestellt</h1><div class="unter">Letzte 60 Tage · Haken setzen, sobald die Ware im Lager ist</div></div></div>';
    if(!grp.size) return h + '<div class="qb-leer">Noch nichts bestellt.</div>';
    h += `<div class="qb-grp"><table class="qb-tab"><thead><tr><th style="width:110px">Bestellt am</th><th style="width:190px">Lieferant</th><th>Artikel</th><th style="width:140px">Status</th><th style="width:80px;text-align:center">Geliefert</th></tr></thead><tbody>`;
    for(const [k, ps] of grp){
      const p0 = ps[0], gel = ps.every(p => p.status === 'geliefert'), auf = offenDet.has(k);
      h += `<tr class="kopf" data-det="${k}"><td>${datumLang(p0.bestellt_am)}</td><td><b>${esc(lname(p0.lieferant))}</b></td>
        <td>${esc(ps.slice(0, 2).map(p => (p.artikel || {}).bezeichnung).join(', '))}${ps.length > 2 ? ', …' : ''} <span class="klein" style="color:#6B7079">· ${ps.length} Artikel</span></td>
        <td>${gel ? `<span class="qb-st g">Geliefert ${datum(p0.geliefert_am)}</span>` : '<span class="qb-st u">Unterwegs</span>'}</td>
        <td style="text-align:center"><input type="checkbox" data-geliefert="${k}"${gel ? ' checked' : ''}${buero ? '' : ' disabled'} aria-label="Geliefert"></td></tr>`;
      if(auf) h += ps.map(p => `<tr class="det"><td></td><td>${esc((p.artikel || {}).artikelnummer_lieferant || '')}</td><td>${esc((p.artikel || {}).bezeichnung || '')}${p.notiz ? ` · ${esc(p.notiz)}` : ''}</td><td>${zahl(p.menge)} ${esc((p.artikel || {}).einheit || '')}</td><td>${esc(p.erstellt_name || '')}</td></tr>`).join('');
    }
    return h + '</tbody></table></div><div class="qb-hin">Klick auf eine Zeile zeigt alle Artikel.</div>';
  }

  // ---------------- Einstellungen (nur Admin) ----------------
  let EINST = { zustaendig: [] }, BUERO = [], LIEF = [];
  async function einstLaden(){
    const [e, b, l] = await Promise.all([sb.from('app_einstellung').select('wert').eq('schluessel', 'qr_bestellung').maybeSingle(),
      sb.from('benutzer').select('id,anzeigename,email,rolle,aktiv').in('rolle', ['admin', 'buero_team']),
      sb.from('lieferant').select('id,name,firma').is('archiviert_am', null).order('name')]);
    try { EINST = { zustaendig: [], ...JSON.parse(e.data?.wert || '{}') }; } catch(_){ EINST = { zustaendig: [] }; }
    BUERO = (b.data || []).filter(x => x.aktiv !== false).sort((x, y) => (x.anzeigename || x.email).localeCompare(y.anzeigename || y.email, 'de'));
    LIEF = l.data || [];
  }
  function einstHtml(){
    const anb = [...ANB.values()].map(a => ({ ...a, l: LIEF.find(x => x.id === a.lieferant_id) })).sort((a, b) => lname(a.l).localeCompare(lname(b.l), 'de'));
    return `<div class="qb-kopf"><div><h1>Einstellungen</h1></div></div>
      <div class="qb-karte"><h2>Zuständig für Bestellungen</h2>
        <span class="qb-hin">Nur bei diesen Personen bekommt das Tool-Icon einen grünen Punkt, wenn neue Bestellungen offen sind. Kein Pop-up, keine Pendenz.</span>
        <div class="qb-pers">${BUERO.map(p => `<label><input type="checkbox" data-zust="${p.id}"${EINST.zustaendig.includes(p.id) ? ' checked' : ''}>${esc(p.anzeigename || p.email)}</label>`).join('') || '<span class="qb-hin" style="padding:10px">Keine Büro-Personen gefunden.</span>'}</div></div>
      <div class="qb-karte"><h2>Shop-Anbindungen</h2>
        <span class="qb-hin">Nur Lieferanten mit angebundenem Shop erscheinen beim Bestellen. Den Ablauf im Shop macht die Erweiterung «Knechtgarten» (pro Shop-System). Hier steht, was sich ändern kann.</span>
        ${anb.map(a => `<div class="qb-anb" data-anb="${a.lieferant_id}">
          <div class="kopf"><b>${esc(lname(a.l))}</b><span class="qb-badge">${esc(SYSTEME[a.plattform] || a.plattform)}</span>
            <label style="display:flex;gap:6px;align-items:center;font-size:13px"><input type="checkbox" data-anbf="aktiv"${a.aktiv ? ' checked' : ''}>aktiv</label>
            ${a.plattform === 'dabag' ? `<label style="display:flex;gap:6px;align-items:center;font-size:13px" title="Aus: persönlicher Warenkorb"><input type="checkbox" data-opt="firmenkorb"${a.optionen?.firmenkorb ? ' checked' : ''}>Firmenwarenkorb</label>` : ''}
            <span style="margin-left:auto">${a.zuletzt_ok ? `<span class="qb-ok">zuletzt geklappt ${datumLang(a.zuletzt_ok)}</span>` : ''} ${a.zuletzt_fehler ? `<span class="qb-err">${esc(a.zuletzt_fehler)}</span>` : ''}</span>
            <button type="button" class="kgd-btn ghost" data-test="${a.lieferant_id}">Testen</button></div>
          <div class="reihe"><div class="kgd-feld"><label>Shop-Adresse</label><input class="kgd-t" data-anbf="shop_url" value="${esc(a.shop_url)}"></div>
            ${a.plattform !== 'dabag' ? `<div class="kgd-feld" style="flex:0 0 90px;min-width:90px"><label>Sprache</label><input class="kgd-t" data-anbf="sprache" value="${esc(a.sprache || '')}"></div>` : ''}
            <div class="kgd-feld"><label>Bestätigungsseite (Teil der Adresse)</label><input class="kgd-t" data-anbf="bestaetigung" value="${esc(a.bestaetigung || '')}" placeholder="leer = noch unbekannt, nur «Ist schon bestellt?»"></div></div>
          <div class="kgd-feld"><label>So funktioniert es</label><textarea class="kgd-t" rows="2" data-anbf="beschrieb">${esc(a.beschrieb || '')}</textarea></div></div>`).join('')}
        <div class="reihe" style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap"><div class="kgd-feld" style="flex:1;min-width:220px"><label for="neuLief">Neuer Lieferant mit Shop</label>
          <select class="kgd-t" id="neuLief"><option value="">– wählen –</option>${LIEF.filter(l => !ANB.has(l.id)).map(l => `<option value="${l.id}">${esc(lname(l))}</option>`).join('')}</select></div>
          <div class="kgd-feld" style="flex:0 0 170px;min-width:150px"><label for="neuSys">Shop-System</label><select class="kgd-t" id="neuSys">${Object.entries(SYSTEME).map(([k, n]) => `<option value="${k}">${esc(n)}</option>`).join('')}</select></div>
          <button type="button" class="kgd-btn ghost" id="neuAnb">Anbindung anlegen</button></div>
        <span class="qb-hin">Heute kann die Erweiterung Magento (z. B. Aquasolar), Dabag (z. B. B-Team, IMMER AG) und SAP Commerce (z. B. HGC). Jeder neue Shop braucht zusätzlich eine Freigabe in der Erweiterung (neue Version).</span></div>`;
  }

  async function zeichnen(){
    reiter();
    if(ansicht === 'einst'){ await einstLaden(); main.innerHTML = `<div class="qb">${einstHtml()}</div>`; return; }
    main.innerHTML = `<div class="qb">${ansicht === 'bestellt' ? bestelltHtml() : offenHtml()}</div>`;
  }

  // ---------------- Aktionen ----------------
  async function imShopBestellen(lid){
    const anb = ANB.get(lid); if(!anb || !anb.aktiv) return KGD.toast('Für diesen Lieferanten ist kein Shop angebunden.', true);
    const offen = POS.filter(p => p.lieferant_id === lid && p.status === 'offen');
    const fehltNr = offen.filter(p => !(p.artikel || {}).artikelnummer_lieferant);
    // gleiche Artikelnummer zusammenzählen, Notizen zusammenhängen
    const m = new Map(); offen.filter(p => (p.artikel || {}).artikelnummer_lieferant).forEach(p => { const nr = p.artikel.artikelnummer_lieferant;
      const x = m.get(nr) || { nr, menge: 0, notiz: [], ids: [] }; x.menge += +p.menge; if(p.notiz) x.notiz.push(p.notiz); x.ids.push(p.id); m.set(nr, x); });
    const positionen = [...m.values()].map(x => ({ nr: x.nr, menge: x.menge, notiz: [...new Set(x.notiz)].join('; ') }));
    fehlerNr = new Map(fehltNr.map(p => [p.id, 'Keine Artikelnummer des Lieferanten im Artikelstamm']));
    if(!positionen.length){ zeichnen(); return; }
    const lauf = crypto.randomUUID();
    laeuft = lid; zeichnen();
    let r;
    try { r = await ext('shopBestellen', { lieferant_id: lid, lauf, positionen,
      anbindung: { plattform: anb.plattform, shop_url: anb.shop_url, sprache: anb.sprache, bestaetigung: anb.bestaetigung, optionen: anb.optionen || {} } }); }
    catch(e){ laeuft = null; zeichnen(); return KGD.toast(extFehler(e), true); }
    laeuft = null;
    // ganzer Ablauf gescheitert (Text) oder Liste der Artikel, die nicht geklappt haben
    if(typeof r.fehler === 'string'){ await sb.from('bestell_anbindung').update({ zuletzt_fehler: r.fehler }).eq('lieferant_id', lid); zeichnen(); return KGD.toast(r.fehler, true); }
    const ok = new Set(r.ok || []), idsOk = [...m.values()].filter(x => ok.has(x.nr)).flatMap(x => x.ids);
    for(const f of (r.fehler || [])){ const x = m.get(f.nr); if(x) x.ids.forEach(id => fehlerNr.set(id, 'Nicht im Warenkorb: ' + f.grund)); }
    if(idsOk.length) await sb.from('bestell_position').update({ status: 'warenkorb', lauf, warenkorb_am: new Date().toISOString() }).in('id', idsOk);
    await sb.from('bestell_anbindung').update(idsOk.length ? { zuletzt_ok: new Date().toISOString(), zuletzt_fehler: null } : { zuletzt_fehler: 'Nichts in den Warenkorb gelegt' }).eq('lieferant_id', lid);
    await laden(); zeichnen();
    KGD.toast(`${ok.size} von ${m.size} Artikel im Warenkorb. Jetzt im Shop prüfen und abschicken.`, ok.size < m.size);
    // Shop verkauft nur ganze Packungen (z. B. IMMER 50er-Schritte): aufgerundete Mengen melden
    if(r.angepasst?.length) KGD.dialog(`<h3>Auf ganze Packungen aufgerundet</h3><p>${r.angepasst.map(a => `${esc(a.nr)}: ${zahl(a.menge)} (Packung à ${zahl(a.schritt)})`).join('<br>')}</p><p>Bitte im Warenkorb prüfen.</p>`, [['OK', 'prim', true]]);
  }
  main.addEventListener('input', e => { if(e.target.id === 'such'){ suche = e.target.value; const p = e.target.selectionStart; zeichnen().then(() => { const s = $('such'); if(s){ s.focus(); s.setSelectionRange(p, p); } }); } });
  main.addEventListener('change', async e => {
    const z = e.target.closest('[data-id]'), feld = e.target.dataset.feld;
    if(z && feld){ const v = feld === 'menge' ? Math.max(0.01, +e.target.value || 1) : e.target.value.trim() || null;
      const { error } = await sb.from('bestell_position').update({ [feld]: v }).eq('id', z.dataset.id);
      if(error) return KGD.toast('Speichern fehlgeschlagen: ' + error.message, true);
      const p = POS.find(x => x.id === z.dataset.id); if(p) p[feld] = v; return; }
    if(e.target.dataset.geliefert){ const k = e.target.dataset.geliefert, an = e.target.checked;
      const ids = ALT.filter(p => (p.lauf || p.id) === k).map(p => p.id);
      const { error } = await sb.from('bestell_position').update({ status: an ? 'geliefert' : 'bestellt', geliefert_am: an ? new Date().toISOString() : null }).in('id', ids);
      if(error) return KGD.toast('Speichern fehlgeschlagen: ' + error.message, true); await laden(); zeichnen(); return; }
    if(e.target.dataset.zust){ const id = e.target.dataset.zust, s = new Set(EINST.zustaendig); e.target.checked ? s.add(id) : s.delete(id); EINST.zustaendig = [...s];
      const { error } = await sb.from('app_einstellung').upsert({ schluessel: 'qr_bestellung', wert: JSON.stringify(EINST), aktualisiert_am: new Date().toISOString() });
      if(error) KGD.toast('Speichern fehlgeschlagen: ' + error.message, true); else KGD.toast('Gespeichert'); return; }
    const anbBox = e.target.closest('[data-anb]');
    if(anbBox && e.target.dataset.opt){ const a = ANB.get(anbBox.dataset.anb), opt = { ...(a.optionen || {}), [e.target.dataset.opt]: e.target.checked };
      const { error } = await sb.from('bestell_anbindung').update({ optionen: opt, aktualisiert_am: new Date().toISOString() }).eq('lieferant_id', a.lieferant_id);
      if(error) return KGD.toast('Speichern fehlgeschlagen: ' + error.message, true); a.optionen = opt; KGD.toast('Gespeichert'); return; }
    if(anbBox && e.target.dataset.anbf){ const f = e.target.dataset.anbf, v = f === 'aktiv' ? e.target.checked : (e.target.value.trim() || (f === 'bestaetigung' ? null : ''));
      if(f === 'shop_url' && !/^https:\/\/[^/]+/.test(v)) return KGD.toast('Shop-Adresse muss mit https:// beginnen.', true);
      const { error } = await sb.from('bestell_anbindung').update({ [f]: v, aktualisiert_am: new Date().toISOString() }).eq('lieferant_id', anbBox.dataset.anb);
      if(error) return KGD.toast('Speichern fehlgeschlagen: ' + error.message, true);
      const a = ANB.get(anbBox.dataset.anb); if(a) a[f] = v; KGD.toast('Gespeichert'); }
  });
  main.addEventListener('click', async e => {
    const tr = e.target.closest('tr.kopf[data-det]');
    if(tr && !e.target.closest('input')){ const k = tr.dataset.det; offenDet.has(k) ? offenDet.delete(k) : offenDet.add(k); zeichnen(); return; }
    const b = e.target.closest('button'); if(!b) return;
    if(b.id === 'scan') return scannen();
    if(b.dataset.shop) return imShopBestellen(b.dataset.shop);
    if(b.dataset.weg){ const p = POS.find(x => x.id === b.dataset.weg);
      const ja = await KGD.dialog(`<h3>Bestellung entfernen?</h3><p>${esc((p?.artikel || {}).bezeichnung || '')} wird von der Liste genommen.</p>`, [['Abbrechen', 'ghost', false], ['Entfernen', 'prim', true]]);
      if(!ja) return; const { error } = await sb.from('bestell_position').delete().eq('id', b.dataset.weg);
      if(error) return KGD.toast('Entfernen fehlgeschlagen: ' + error.message, true); await laden(); zeichnen(); return; }
    if(b.dataset.istbestellt){ const lid = b.dataset.istbestellt;
      const ja = await KGD.dialog('<h3>Im Shop schon abgeschickt?</h3><p>Die Artikel im Warenkorb werden auf «Bestellt» gesetzt. Nur nötig, wenn die Erweiterung die Bestätigungsseite nicht erkannt hat.</p>', [['Abbrechen', 'ghost', false], ['Ist bestellt', 'prim', true]]);
      if(!ja) return; await sb.from('bestell_position').update({ status: 'bestellt', bestellt_am: new Date().toISOString(), bestellt_von: KGD.ich }).eq('lieferant_id', lid).eq('status', 'warenkorb');
      await laden(); zeichnen(); return; }
    if(b.dataset.test){ const a = ANB.get(b.dataset.test);
      const { data: art } = await sb.from('artikel').select('artikelnummer_lieferant').eq('lieferant_id', a.lieferant_id).not('artikelnummer_lieferant', 'is', null).limit(3);
      b.disabled = true; b.textContent = 'Teste …';
      try { const r = await ext('shopTest', { anbindung: { plattform: a.plattform, shop_url: a.shop_url, sprache: a.sprache, optionen: a.optionen || {} }, positionen: (art || []).map(x => ({ nr: x.artikelnummer_lieferant, menge: 1 })) }, 90);
        if(r.fehler){ await sb.from('bestell_anbindung').update({ zuletzt_fehler: r.fehler }).eq('lieferant_id', a.lieferant_id); KGD.toast(r.fehler, true); }
        else { await sb.from('bestell_anbindung').update({ zuletzt_ok: new Date().toISOString(), zuletzt_fehler: null }).eq('lieferant_id', a.lieferant_id);
          KGD.toast(r.nurLogin ? 'Klappt: im Shop angemeldet, Warenkorb erreichbar.' : `Klappt: angemeldet, ${r.gefunden.length} von ${r.gefunden.length + r.fehlt.length} Testartikel im Shop gefunden.`, !!r.fehlt.length); }
      } catch(err){ KGD.toast(extFehler(err), true); }
      await laden(); zeichnen(); return; }
    if(b.id === 'neuAnb'){ const lid = $('neuLief').value; if(!lid) return KGD.toast('Zuerst einen Lieferanten wählen.', true);
      const sys = $('neuSys').value;
      const { error } = await sb.from('bestell_anbindung').insert({ lieferant_id: lid, plattform: sys, shop_url: 'https://', sprache: sys === 'dabag' ? null : 'de',
        bestaetigung: sys === 'magento' ? '/checkout/onepage/success' : null });
      if(error) return KGD.toast('Anlegen fehlgeschlagen: ' + error.message, true); await laden(); zeichnen(); }
  });

  // ---------------- Kleber scannen (Handy) ----------------
  async function scannen(){
    const w = document.createElement('div'); w.className = 'qb-video';
    w.innerHTML = `<video playsinline muted></video><div class="rahmen"></div><div class="txt">QR-Kleber in den Rahmen halten</div>
      <button type="button" class="kgd-btn ghost zu">${ic('x', 14)}Schliessen</button>`;
    document.body.appendChild(w);
    let strom = null, aus = false;
    const zu = () => { aus = true; strom?.getTracks().forEach(t => t.stop()); w.remove(); };
    w.querySelector('.zu').addEventListener('click', zu);
    try { strom = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); }
    catch(_){ zu(); return KGD.toast('Kamera nicht erlaubt. Sonst den Kleber mit der normalen Kamera-App scannen.', true); }
    const v = w.querySelector('video'); v.srcObject = strom; await v.play().catch(() => {});
    let finde;
    if('BarcodeDetector' in window){ const d = new BarcodeDetector({ formats: ['qr_code'] }); finde = async () => ((await d.detect(v))[0] || {}).rawValue; }
    else { await new Promise((ok, nein) => { if(window.jsQR) return ok(); const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'; s.onload = ok; s.onerror = nein; document.head.appendChild(s); }).catch(() => {});
      const c = document.createElement('canvas'), cx = c.getContext('2d', { willReadFrequently: true });
      finde = async () => { if(!v.videoWidth || !window.jsQR) return null; c.width = v.videoWidth; c.height = v.videoHeight; cx.drawImage(v, 0, 0); const r = jsQR(cx.getImageData(0, 0, c.width, c.height).data, c.width, c.height); return r && r.data; }; }
    while(!aus){
      const t = await finde().catch(() => null);
      const m = t && String(t).match(/^https:\/\/(?:www\.)?knechtgarten\.com\/([ams])\/([A-Za-z0-9]+)\/?$/);
      if(m){ zu(); location.href = `/${m[1]}/${m[2]}`; return; }
      if(t){ w.querySelector('.txt').textContent = 'Das ist kein Knechtgarten-Kleber.'; }
      await new Promise(r => setTimeout(r, 250));
    }
  }

  await laden();
  history.replaceState({ r: ansicht }, '', '?r=' + ansicht);
  zeichnen();
  bestaetigungen();
}
KGD.start(aufbau);
</script>
</body>
</html>
