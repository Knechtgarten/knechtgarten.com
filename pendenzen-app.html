<style>
/* Pendenzen-App (Web-App fürs Handy): nur erfassen – alles landet in der Sammelbox, verteilt wird später am PC.
   Funktioniert ohne Empfang: Einträge warten auf dem Handy und gehen raus, sobald wieder Netz da ist. */
:root{ --bg:#F5F7F9; --primary:#323E4E; --muted:#8B9097; --line:#E1E5E9; --ink:#232B35; --blau:#D6E7F4; --gruen:#D1DB5F; --rot:#C0392B; }
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);font-size:16px;line-height:1.4;display:flex;flex-direction:column;}
.hidden{display:none !important;}
header{background:var(--primary);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px;}
header h1{font-size:17px;font-weight:600;}
header .netz{margin-left:auto;font-size:12px;display:flex;align-items:center;gap:6px;opacity:.9;}
header .netz i{width:9px;height:9px;border-radius:50%;background:var(--gruen);display:inline-block;}
header .netz.aus i{background:#E0A96D;}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;}
main{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;max-width:560px;width:100%;margin:0 auto;}
.feld{background:#fff;border:1.5px solid #9DC2DF;border-radius:12px;display:flex;flex-direction:column;padding:8px 8px 8px 12px;gap:6px;}
textarea{border:0;background:transparent;resize:none;font:inherit;font-size:17px;padding:0;min-height:96px;outline:none;color:var(--ink);}
.feld .unten{display:flex;align-items:center;gap:8px;justify-content:flex-end;}
.feld .tipp{font-size:12px;color:var(--muted);flex:1;}
.feld .tipp:empty{display:none;}
.mic{width:28px;height:28px;border-radius:50%;border:0;background:var(--blau);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;flex:none;}
.mic.an{background:var(--rot);color:#fff;animation:puls 1.2s ease-in-out infinite;}
@keyframes puls{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.45);}50%{box-shadow:0 0 0 10px rgba(192,57,43,0);}}
/* KI-Diktat: während der Aufnahme Pegel + Zeit statt Textfeld, danach «KI schreibt …» */
.aufnahme{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:130px;padding:14px;}
.pegel{display:flex;align-items:center;gap:3px;height:56px;}
.pegel i{width:6px;border-radius:3px;background:var(--primary);height:4px;transition:height .08s;}
.aufnahme .zeit{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums;}
.aufnahme .zeit b{color:var(--rot);}
.feld.schreibt textarea{opacity:.35;}
.speichern{height:56px;border:0;border-radius:12px;background:var(--primary);color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;}
.speichern:active{transform:scale(.98);}
.meldung{font-size:14px;text-align:center;color:var(--primary);min-height:20px;}
.meldung.ok{color:#4F7A3A;}
h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:6px;}
.liste{background:#fff;border-radius:12px;overflow:hidden;}
.zeile{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid #EEF1F4;font-size:15px;}
.zeile:first-child{border-top:0;}
.zeile span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.zeile .st{color:var(--muted);display:inline-flex;flex:none;}
.zeile .st.ok{color:#4F7A3A;}
.leer{padding:12px 14px;color:var(--muted);font-size:14px;}
.fuss{text-align:center;font-size:13px;padding-bottom:calc(10px + env(safe-area-inset-bottom));}
.fuss a{color:var(--primary);}
/* Kamera + Vorschaubilder beim Erfassen */
.mini{width:28px;height:28px;border-radius:50%;border:0;background:var(--blau);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;flex:none;}
.fotos{display:flex;gap:6px;margin-right:auto;}
.mini svg,.mic svg{width:16px;height:16px;}
.mini.ab{background:var(--primary);color:#fff;}
.mini.ab[disabled]{opacity:.35;}
.fotos img{width:28px;height:28px;border-radius:6px;object-fit:cover;display:block;}
/* Meine Pendenzen: Reiter Heute / Woche / Monat / Sammelbox */
.reiter{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:6px;}
.reiter button{border:0;background:#fff;font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);padding:9px 2px;border-left:1px solid var(--line);}
.reiter button:first-child{border-left:0;}
.reiter button.on{background:var(--primary);color:#fff;}
.reiter b{display:block;font-size:16px;color:inherit;}
.pz{display:flex;align-items:center;gap:6px;padding:0 14px 0 4px;min-height:46px;border-top:1px solid #EEF1F4;}
.pz:first-child{border-top:0;}
.pz .t{flex:1;min-width:0;border:0;background:none;font:inherit;text-align:left;color:var(--ink);padding:7px 0;display:flex;flex-direction:column;}
.pz .t span{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pz .t small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pz .ok{width:32px;height:32px;border:0;background:none;color:#B6BCC3;display:flex;align-items:center;justify-content:center;flex:none;}
.pz .ok.ja{color:#3F7D3F;}
.blatt{position:fixed;inset:0;z-index:96;background:rgba(35,43,53,.45);display:flex;align-items:flex-end;}
.blatt .in{background:#fff;width:100%;max-height:85vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;}
.blatt .griff{width:40px;height:4px;border-radius:2px;background:#D5DBE1;align-self:center;}
.blatt h3{font-size:19px;color:var(--primary);line-height:1.3;word-break:break-word;}
.blatt .meta{display:flex;flex-wrap:wrap;gap:6px;}
.blatt .meta span{font-size:12.5px;background:var(--bg);border-radius:20px;padding:3px 10px;color:var(--muted);}
.blatt .notiz{font-size:15px;line-height:1.5;word-break:break-word;}
.blatt .bilder{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.blatt .bilder img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;}
.blatt .knoepfe{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.blatt .knoepfe button{height:46px;border-radius:12px;font:inherit;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;}
.blatt .hell{border:1px solid #D5DBE1;background:#fff;color:var(--primary);}
.blatt .dunkel{border:0;background:var(--primary);color:#fff;}
.logincard{background:#fff;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px;}
.logincard h2{font-size:18px;color:var(--primary);text-transform:none;letter-spacing:0;margin:0;}
.logincard label{font-size:13px;color:var(--muted);}
.logincard input{width:100%;height:46px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:16px;}
.logincard .status{font-size:13px;color:var(--rot);min-height:16px;}
</style>

<script>
(function(){
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const K = (n, s = 20) => KG.icon(n, s);
const SAMMEL_ICON = '<svg class="i" viewBox="0 0 24 24"><path d="M3 13h5l1.5 3h5l1.5-3h5"/><path d="M5.5 5h13L21 13v6H3v-6z"/></svg>';
let sb = null; try { sb = window.supabase.createClient('https://oalapdxinqlnzwxhyuzy.supabase.co', 'sb_publishable_DoeD4uEnwemmnFu4AxE9uw_5lmQYc5P'); } catch(e){}

// Speicher auf dem Handy: Warteschlange (noch nicht gesendet) und die letzten Einträge
const lies = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e){ return d; } };
const schreib = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
let warte = lies('pzapp_warte', []), zuletzt = lies('pzapp_zuletzt', []), me = lies('pzapp_me', null);
const uuid = () => crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });

$('speichern').innerHTML = SAMMEL_ICON;
$('wartet').addEventListener('click', () => sende());

function zeichne(){
  const n = warte.length;
  $('wartetTitel').classList.toggle('hidden', !n); $('wartet').classList.toggle('hidden', !n);
  $('wartet').innerHTML = warte.map(w => `<div class="zeile"><span>${esc(w.titel)}</span><span class="st" title="wartet">${K('upload', 16)}</span></div>`).join('');
  const on = navigator.onLine; $('netz').classList.toggle('aus', !on); $('netzText').textContent = on ? (n ? `${n} wartet` : 'Online') : `Kein Netz${n ? ' · ' + n + ' wartet' : ''}`;
}
function meldung(t, ok){ const m = $('meldung'); m.textContent = t; m.className = 'meldung' + (ok ? ' ok' : ''); clearTimeout(meldung.t); meldung.t = setTimeout(() => { m.textContent = ''; }, 3500); }

// Erfassen: sofort auf dem Handy speichern, dann senden versuchen
let FOTOS = [];
const verkleinern = datei => new Promise(ok => { const img = new Image(), url = URL.createObjectURL(datei);
  img.onload = () => { const f = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * f); c.height = Math.round(img.height * f); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url); c.toBlob(b => ok(b || datei), 'image/jpeg', 0.85); };
  img.onerror = () => { URL.revokeObjectURL(url); ok(datei); }; img.src = url; });
const zeigeFotos = () => { $('fotos').innerHTML = FOTOS.map(f => `<img src="${f.url}" alt="">`).join(''); };
async function erfassen(){
  let t = $('text').value.trim(); if(!t && !FOTOS.length){ $('text').focus(); return; }
  if(!t) t = 'Foto vom ' + new Date().toLocaleDateString('de-CH', { day: 'numeric', month: 'long' });
  const e = { id: uuid(), titel: t, am: new Date().toISOString(), ...(diktatNotiz ? { wortlich: diktatNotiz } : {}) }; diktatNotiz = '';
  if(FOTOS.length){ e.fotoIds = []; for(const f of FOTOS){ const fid = uuid(); try { await audioLegen('foto_' + fid, f.blob); e.fotoIds.push(fid); } catch(err){ meldung('Foto konnte nicht gespeichert werden.'); } URL.revokeObjectURL(f.url); }
    FOTOS = []; zeigeFotos(); }
  warte.push(e); zuletzt.unshift({ ...e, ok: false }); zuletzt = zuletzt.slice(0, 20);
  schreib('pzapp_warte', warte); schreib('pzapp_zuletzt', zuletzt);
  $('text').value = ''; $('text').focus(); zeichne();
  meldung(navigator.onLine ? 'Gespeichert' : 'Gespeichert – geht raus, sobald wieder Netz da ist', true);
  sende();
}
$('speichern').addEventListener('click', erfassen);
$('kam').innerHTML = K('foto', 20); $('kam').onclick = () => $('datei').click();
$('datei').onchange = async ev => { for(const d of [...ev.target.files]){ const blob = await verkleinern(d); FOTOS.push({ blob, url: URL.createObjectURL(blob) }); } ev.target.value = ''; zeigeFotos(); };
$('text').addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); erfassen(); } });

// Sammelbox-Liste im eigenen Board suchen (wird gemerkt, damit es auch ohne Netz klar ist)
async function sammelListe(){
  let lid = lies('pzapp_liste', null); if(lid && lid.me === me) return lid.id;
  const { data: b } = await sb.from('pendenz_board').select('id').eq('typ', 'person').eq('besitzer_id', me).maybeSingle();
  if(!b) throw new Error('Bitte das Pendenzentool einmal am PC öffnen.');
  let { data: l } = await sb.from('pendenz_liste').select('id').eq('board_id', b.id).eq('art_id', 'sammel').maybeSingle();
  if(!l){ ({ data: l } = await sb.from('pendenz_liste').insert({ board_id: b.id, art_id: 'sammel', titel: 'Sammelbox', bereich: 'team', x: 20, y: 150 }).select('id').single()); }
  schreib('pzapp_liste', { me, id: l.id }); return l.id;
}
let sendet = false;
async function sende(){
  if(sendet || !warte.length || !navigator.onLine || !sb || !me) return zeichne();
  sendet = true;
  try {
    const ziel = await KGPZ.ziel(sb, me);   // Mitarbeiter → Heute, Büro → Sammelbox
    for(const w of [...warte]){
      // Sprachnotiz ohne Netz aufgenommen: jetzt zuerst von der KI schreiben lassen
      let titel = w.titel, wortlich = w.wortlich || '';
      if(w.audio){ const blob = await audioHolen(w.id);
        if(blob){ const r = await diktatAuswerten(blob); titel = r.titel || 'Sprachnotiz (nicht verstanden)'; wortlich = r.wortlich; } else titel = 'Sprachnotiz (Aufnahme fehlt)'; }
      // feste ID: wird ein Eintrag doppelt gesendet (Netz bricht ab), entsteht trotzdem nur eine Pendenz
      const { error } = await sb.from('pendenz').insert({ id: w.id, ...ziel, titel, notiz: notizHtml(wortlich), sortierung: Date.parse(w.am) / 1000, erstellt_von: me, herkunft: 'handy' });
      if(error && error.code !== '23505') throw error;
      for(const fid of (w.fotoIds || [])){ const blob = await audioHolen('foto_' + fid); if(!blob) continue; const pfad = `${w.id}/${fid}.jpg`;
        const { error: e1 } = await sb.storage.from('pendenz-dateien').upload(pfad, blob, { contentType: 'image/jpeg', upsert: true }); if(e1) throw e1;
        const { error: e2 } = await sb.from('pendenz_datei').insert({ id: fid, pendenz_id: w.id, art: 'foto', name: 'Foto.jpg', storage_pfad: pfad }); if(e2 && e2.code !== '23505') throw e2;
        audioWeg('foto_' + fid).catch(() => {}); }
      if(w.audio) audioWeg(w.id).catch(() => {});
      warte = warte.filter(x => x.id !== w.id); schreib('pzapp_warte', warte);
      zuletzt.forEach(z => { if(z.id === w.id){ z.ok = true; z.titel = titel; } }); schreib('pzapp_zuletzt', zuletzt); zeichne();
    }
  } catch(e){ console.error(e); if(navigator.onLine) meldung('Senden klappt gerade nicht – Eintrag ist gespeichert und geht später raus.'); }
  sendet = false; zeichne(); if(navigator.onLine) ladeMeine();
}
addEventListener('online', sende); addEventListener('offline', zeichne);
document.addEventListener('visibilitychange', () => { if(!document.hidden) sende(); });
setInterval(sende, 30000);

// ---------------------------------------------------------------------------
// KI-Diktat: Aufnahme als WAV (16 kHz mono, läuft auf Android und iPhone gleich), Pegel + Zeit während dem Sprechen.
// Mit Netz: Gemini (Edge Function pendenz-diktat) schreibt eine saubere Pendenz ins Feld, der wörtliche Text kommt in die Notiz.
// Ohne Netz: Aufnahme bleibt auf dem Handy (IndexedDB) und wird ausgewertet + gesendet, sobald wieder Netz da ist.
// ---------------------------------------------------------------------------
const MAX_SEK = 120;
let aufn = null, diktatNotiz = '';
const idb = () => new Promise((ok, fehler) => { const r = indexedDB.open('pzapp', 1); r.onupgradeneeded = () => r.result.createObjectStore('audio'); r.onsuccess = () => ok(r.result); r.onerror = () => fehler(r.error); });
const idbTun = async (modus, f) => { const db = await idb(); return new Promise((ok, fehler) => { const t = db.transaction('audio', modus), q = f(t.objectStore('audio')); t.oncomplete = () => ok(q?.result); t.onerror = () => fehler(t.error); }); };
const audioLegen = (id, blob) => idbTun('readwrite', s => s.put(blob, id));
const audioHolen = id => idbTun('readonly', s => s.get(id));
const audioWeg = id => idbTun('readwrite', s => s.delete(id));
const alsBase64 = blob => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.readAsDataURL(blob); });
const notizHtml = w => null;   // wörtliches Diktat wird nicht mehr gespeichert – die KI-Fassung ist der Titel

// 16-Bit-WAV aus den aufgenommenen Stücken, auf 16 kHz heruntergerechnet (klein genug fürs Handy-Netz)
function wav(teile, rate){
  const roh = new Float32Array(teile.reduce((s, t) => s + t.length, 0)); let o = 0; teile.forEach(t => { roh.set(t, o); o += t.length; });
  const ziel = 16000, f = rate / ziel, n = Math.floor(roh.length / f), daten = new Int16Array(n);
  for(let i = 0; i < n; i++){ const v = Math.max(-1, Math.min(1, roh[Math.floor(i * f)])); daten[i] = v < 0 ? v * 0x8000 : v * 0x7FFF; }
  const kopf = new DataView(new ArrayBuffer(44)), txt = (p, s) => [...s].forEach((c, i) => kopf.setUint8(p + i, c.charCodeAt(0)));
  txt(0, 'RIFF'); kopf.setUint32(4, 36 + n * 2, true); txt(8, 'WAVE'); txt(12, 'fmt '); kopf.setUint32(16, 16, true); kopf.setUint16(20, 1, true); kopf.setUint16(22, 1, true);
  kopf.setUint32(24, ziel, true); kopf.setUint32(28, ziel * 2, true); kopf.setUint16(32, 2, true); kopf.setUint16(34, 16, true); txt(36, 'data'); kopf.setUint32(40, n * 2, true);
  return new Blob([kopf.buffer, daten.buffer], { type: 'audio/wav' });
}
async function aufnahmeStart(){
  let stream; try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
  catch(e){ return meldung('Kein Zugriff aufs Mikrofon – bitte in den Handy-Einstellungen erlauben.'); }
  const ctx = new (window.AudioContext || window.webkitAudioContext)(), src = ctx.createMediaStreamSource(stream), proc = ctx.createScriptProcessor(4096, 1, 1);
  aufn = { stream, ctx, proc, teile: [], start: Date.now(), pegel: Array(18).fill(0) };
  proc.onaudioprocess = e => { const d = e.inputBuffer.getChannelData(0); aufn.teile.push(new Float32Array(d));
    let s = 0; for(let i = 0; i < d.length; i++) s += d[i] * d[i]; aufn.pegel.push(Math.min(1, Math.sqrt(s / d.length) * 6)); aufn.pegel.shift(); };
  src.connect(proc); proc.connect(ctx.destination);
  $('mic').classList.add('an'); $('text').classList.add('hidden'); $('aufnahme').classList.remove('hidden'); $('tipp').textContent = 'Hört zu …';
  $('pegel').innerHTML = '<i></i>'.repeat(18);
  const male = () => { if(!aufn) return; const sek = Math.floor((Date.now() - aufn.start) / 1000);
    $('zeit').textContent = `${Math.floor(sek / 60)}:${String(sek % 60).padStart(2, '0')}`;
    [...$('pegel').children].forEach((b, i) => b.style.height = (4 + aufn.pegel[i] * 52) + 'px');
    if(sek >= MAX_SEK) return aufnahmeStopp(); requestAnimationFrame(male); };
  male();
}
async function aufnahmeStopp(){
  const a = aufn; if(!a) return; aufn = null;
  a.proc.disconnect(); a.stream.getTracks().forEach(t => t.stop()); const rate = a.ctx.sampleRate; a.ctx.close().catch(() => {});
  $('mic').classList.remove('an'); $('aufnahme').classList.add('hidden'); $('text').classList.remove('hidden'); $('tipp').textContent = 'Mikrofon antippen und sprechen.';
  if(Date.now() - a.start < 700) return meldung('Zu kurz – Mikrofon antippen, sprechen, nochmals antippen.');
  const blob = wav(a.teile, rate);
  if(navigator.onLine && sb && me){
    $('feld').classList.add('schreibt'); $('tipp').textContent = 'KI schreibt …';
    try { const r = await diktatAuswerten(blob);
      if(!r.titel) meldung('Nichts verstanden – bitte nochmals versuchen.');
      else { const t = $('text').value.trim(); $('text').value = (t ? t + ' ' : '') + r.titel; diktatNotiz = [diktatNotiz, r.wortlich].filter(Boolean).join(' '); }
      $('feld').classList.remove('schreibt'); $('tipp').textContent = 'Kontrollieren, dann «In die Sammelbox».'; $('text').focus(); return;
    } catch(e){ console.error(e); $('feld').classList.remove('schreibt'); }
  }
  // ohne Netz (oder KI nicht erreichbar): Aufnahme direkt als Pendenz vormerken, wird später ausgewertet
  const e = { id: uuid(), titel: 'Sprachnotiz – wird ausgewertet', am: new Date().toISOString(), audio: true };
  try { await audioLegen(e.id, blob); } catch(err){ return meldung('Aufnahme konnte nicht gespeichert werden.'); }
  warte.push(e); zuletzt.unshift({ ...e, ok: false }); zuletzt = zuletzt.slice(0, 20); schreib('pzapp_warte', warte); schreib('pzapp_zuletzt', zuletzt);
  $('tipp').textContent = 'Mikrofon antippen und sprechen.'; zeichne();
  meldung('Sprachnotiz gespeichert – wird ausgewertet, sobald wieder Netz da ist', true);
}
async function diktatAuswerten(blob){
  const { data, error } = await sb.functions.invoke('pendenz-diktat', { body: { audio_base64: await alsBase64(blob), mime_type: 'audio/wav' } });
  if(error || data?.error) throw new Error(data?.error || error?.message || 'Diktat fehlgeschlagen');
  return { titel: data.titel || '', wortlich: data.wortlich || '' };
}
// Mikrofon: Spracheingabe des Handys schreibt sofort mit (mit Netz); «KI» kürzt bei Bedarf zu einer sauberen Pendenz.
// Ohne Spracheingabe oder ohne Netz: Aufnahme wie bisher – die KI schreibt den Titel (ohne Netz später).
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const kiZeigen = () => $('ki').classList.toggle('hidden', $('text').value.trim().length < 35);
$('text').addEventListener('input', kiZeigen);
$('ki').innerHTML = 'KI';
$('ki').onclick = async () => { const t = $('text').value.trim(); if(!t || !sb) return; $('feld').classList.add('schreibt');
  try { const { data, error } = await sb.functions.invoke('pendenz-diktat', { body: { text: t } }); if(error || data?.error) throw new Error(data?.error || error?.message);
    if(data.titel) $('text').value = data.titel; } catch(e){ meldung(navigator.onLine ? 'KI hat nicht geklappt – bitte nochmals.' : 'Ohne Netz geht die KI nicht.'); }
  $('feld').classList.remove('schreibt'); kiZeigen(); };
if(SR || (navigator.mediaDevices?.getUserMedia && (window.AudioContext || window.webkitAudioContext))){
  const mic = $('mic'); mic.classList.remove('hidden'); mic.innerHTML = K('mikrofon', 24); let rec = null;
  mic.addEventListener('click', () => {
    if(rec){ rec.stop(); return; } if(aufn) return aufnahmeStopp();
    if(SR && navigator.onLine){ rec = new SR(); rec.lang = 'de-CH'; rec.interimResults = true; rec.continuous = true; const basis = $('text').value.trim(); mic.classList.add('an'); $('tipp').textContent = 'Hört zu … nochmals tippen zum Beenden';
      rec.onresult = ev => { const t = [...ev.results].map(r => r[0].transcript).join(' ').trim(); $('text').value = (basis ? basis + ' ' : '') + t; kiZeigen(); };
      rec.onend = rec.onerror = () => { rec = null; mic.classList.remove('an'); $('tipp').textContent = 'Mikrofon antippen und sprechen.'; };
      try { rec.start(); } catch(e){ rec = null; mic.classList.remove('an'); } return; }
    aufnahmeStart(); });
} else $('tipp').textContent = 'Tipp: Mikrofon der Tastatur zum Diktieren';
$('text').addEventListener('input', () => { if(!$('text').value.trim()) diktatNotiz = ''; });

// Mitarbeiter (Gruppe): nur Heute und Notizen; Büro: Heute / Woche / Monat / Sammelbox. Gemerkt fürs Erfassen ohne Netz.
let MA = lies('pzapp_ma', false);
const reiterListe = () => MA ? [[1, 'Heute'], ['notiz', 'Notizen']] : [[1, 'Heute'], [2, 'Woche'], [3, 'Monat'], ['sammel', 'Sammelbox']];
let MEINE = [], LISTEN = {}, REITER_AKT = lies('pzapp_reiter', 1);
async function ladeMeine(){
  if(!sb || !me || !navigator.onLine){ $('meine').innerHTML = '<div class="leer">Ohne Netz sind deine Pendenzen nicht sichtbar – Erfassen geht trotzdem.</div>'; return; }
  try {
    const { data: boards } = await sb.from('pendenz_board').select('id').eq('besitzer_id', me);
    const bIds = (boards || []).map(b => b.id); if(!bIds.length){ $('meine').innerHTML = '<div class="leer">Noch kein eigenes Board – bitte das Pendenzentool einmal am PC öffnen.</div>'; return; }
    const { data: ls } = await sb.from('pendenz_liste').select('id,titel,art_id').in('board_id', bIds);
    LISTEN = Object.fromEntries((ls || []).map(l => [l.id, l]));
    const { data: pz } = Object.keys(LISTEN).length ? await sb.from('pendenz').select('id,titel,liste_id,zeit,zeit_sortierung,sortierung').eq('erledigt', false).in('liste_id', Object.keys(LISTEN)).order('zeit_sortierung').order('sortierung', { ascending: false }) : { data: [] };
    MEINE = pz || []; zeigeMeine();
  } catch(e){ console.error(e); $('meine').innerHTML = '<div class="leer">Pendenzen konnten nicht geladen werden.</div>'; }
}
const imReiter = (p, r) => r === 'sammel' ? (LISTEN[p.liste_id] || {}).art_id === 'sammel' : r === 'notiz' ? (LISTEN[p.liste_id] || {}).art_id === 'notizen' && !p.zeit : p.zeit === r;
function zeigeMeine(){
  $('reiter').innerHTML = reiterListe().map(([r, t]) => `<button type="button" role="tab" data-r="${r}" class="${String(r) === String(REITER_AKT) ? 'on' : ''}"><b>${MEINE.filter(p => imReiter(p, r)).length}</b>${t}</button>`).join('');
  $('reiter').querySelectorAll('[data-r]').forEach(b => b.onclick = () => { REITER_AKT = isNaN(+b.dataset.r) ? b.dataset.r : +b.dataset.r; schreib('pzapp_reiter', REITER_AKT); zeigeMeine(); });
  const l = MEINE.filter(p => imReiter(p, REITER_AKT));
  $('meine').innerHTML = l.map(p => `<div class="pz"><button type="button" class="ok" data-erl="${p.id}" aria-label="Erledigt" title="Erledigt">${K('x', 14)}</button><button type="button" class="t" data-det="${p.id}"><span>${esc(p.titel)}</span><small>${esc((LISTEN[p.liste_id] || {}).titel || '')}</small></button></div>`).join('')
    || `<div class="leer">${REITER_AKT === 'sammel' ? 'Die Sammelbox ist leer.' : 'Hier ist nichts offen.'}</div>`;
  $('meine').querySelectorAll('[data-erl]').forEach(b => b.onclick = () => erledigt(b.dataset.erl, b));
  $('meine').querySelectorAll('[data-det]').forEach(b => b.onclick = () => details(b.dataset.det));
}
async function erledigt(id, knopf){
  if(knopf) knopf.classList.add('ja');
  const { error } = await sb.from('pendenz').update({ erledigt: true, erledigt_am: new Date().toISOString(), erledigt_von: me }).eq('id', id);
  if(error){ if(knopf) knopf.classList.remove('ja'); return meldung('Konnte nicht gespeichert werden: ' + error.message); }
  meldung('Erledigt', true); document.querySelector('.blatt')?.remove(); MEINE = MEINE.filter(p => p.id !== id); setTimeout(zeigeMeine, 250);
}
const sauber = html => { const d = new DOMParser().parseFromString(String(html || ''), 'text/html');
  d.querySelectorAll('script,style,iframe,object,embed').forEach(e => e.remove());
  d.querySelectorAll('*').forEach(e => [...e.attributes].forEach(a => { if(/^on/i.test(a.name) || /javascript:/i.test(a.value)) e.removeAttribute(a.name); }));
  return d.body.innerHTML; };
async function details(id){
  const p = MEINE.find(x => x.id === id); if(!p) return;
  const b = document.createElement('div'); b.className = 'blatt';
  b.innerHTML = `<div class="in"><span class="griff"></span><h3>${esc(p.titel)}</h3><div class="meta" data-meta><span>${esc((LISTEN[p.liste_id] || {}).titel || '')}</span></div>
    <div class="notiz" data-notiz><span class="tipp">Lädt …</span></div><div class="bilder" data-bilder></div>
    <div class="knoepfe"><button type="button" class="hell" data-zu>Schliessen</button><button type="button" class="dunkel" data-ok>${K('check', 18)}Erledigt</button>${MA ? `<button type="button" class="hell" data-zu-ebene style="grid-column:1/-1">${p.zeit === 1 ? 'Zu Notizen verschieben' : 'Zu Heute verschieben'}</button>` : ''}</div></div>`;
  document.body.appendChild(b); const q = s => b.querySelector(s);
  b.addEventListener('click', e => { if(e.target === b || e.target.closest('[data-zu]')) b.remove(); });
  q('[data-ok]').onclick = () => erledigt(id);
  if(q('[data-zu-ebene]')) q('[data-zu-ebene]').onclick = async () => { const { error } = await KGPZ.verschiebe(sb, me, id, p.zeit === 1 ? 'notizen' : 'heute');
    if(error) return meldung('Konnte nicht verschoben werden: ' + error.message); b.remove(); meldung(p.zeit === 1 ? 'Zu Notizen verschoben' : 'Zu Heute verschoben', true); ladeMeine(); };
  const [{ data: d }, { data: fs }] = await Promise.all([sb.from('pendenz').select('notiz,erstellt_am,kunde_id').eq('id', id).maybeSingle(), sb.from('pendenz_datei').select('storage_pfad,art').eq('pendenz_id', id)]);
  const meta = []; if(d && d.erstellt_am) meta.push('erfasst ' + new Date(d.erstellt_am).toLocaleDateString('de-CH', { day: 'numeric', month: 'short' }));
  if(d && d.kunde_id){ const { data: k } = await sb.from('kunde').select('name,firma,vorname,nachname').eq('id', d.kunde_id).maybeSingle(); if(k) meta.push(k.firma || [k.vorname, k.nachname].filter(Boolean).join(' ') || k.name); }
  if(!document.body.contains(b)) return;
  q('[data-meta]').innerHTML += meta.map(m => `<span>${esc(m)}</span>`).join('');
  q('[data-notiz]').innerHTML = d && d.notiz ? sauber(d.notiz) : '<span class="tipp">Keine Notiz.</span>';
  const bilder = (fs || []).filter(f => f.art === 'foto');
  if(bilder.length){ const { data: u } = await sb.storage.from('pendenz-dateien').createSignedUrls(bilder.map(f => f.storage_pfad), 3600);
    q('[data-bilder]').innerHTML = (u || []).filter(x => x.signedUrl).map(x => `<a href="${x.signedUrl}" target="_blank" rel="noopener"><img src="${x.signedUrl}" alt=""></a>`).join(''); }
}

// Anmeldung: Sitzung bleibt auf dem Handy gespeichert; ohne Netz geht Erfassen trotzdem (mit der gemerkten Person)
async function start(){
  if(sb){ try { const { data: { session } } = await sb.auth.getSession(); if(session){ me = session.user.id; schreib('pzapp_me', me); } } catch(e){} }
  if(!me){ $('login').classList.remove('hidden'); $('erfassen').classList.add('hidden'); return; }
  $('login').classList.add('hidden'); $('erfassen').classList.remove('hidden'); zeichne();
  if(sb && navigator.onLine){ try { MA = (await KGPZ.ansicht(sb, me)) === 'mitarbeiter'; schreib('pzapp_ma', MA); } catch(e){} }
  if(MA && !reiterListe().some(([r]) => String(r) === String(REITER_AKT))) REITER_AKT = 1;
  $('speichern').title = $('speichern').ariaLabel = MA ? 'Bei Heute eintragen' : 'In die Sammelbox';
  sende(); ladeMeine();
}
$('loginBtn').addEventListener('click', async () => {
  if(!sb) return $('loginStatus').textContent = 'Kein Netz – zum ersten Anmelden braucht es Empfang.';
  $('loginStatus').textContent = '';
  const { error } = await KG.anmelden(sb, { email: $('loginEmail').value.trim(), password: $('loginPassword').value });
  if(error) return $('loginStatus').textContent = 'Anmelden fehlgeschlagen: ' + error.message;
  start();
});
$('loginPassword').addEventListener('keydown', e => { if(e.key === 'Enter') $('loginBtn').click(); });

if('serviceWorker' in navigator) navigator.serviceWorker.register('/pendenzen-app-sw.js', { scope: '/pendenzen-app' }).catch(e => console.warn('SW', e));
start();
})();
</script>
