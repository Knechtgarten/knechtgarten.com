<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=7"></script>
<title>Pendenzen</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#323E4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pendenzen">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/pendenzen-app-manifest.json">
<link rel="apple-touch-icon" href="/pendenzen-app-180.png">
<link rel="icon" href="/pendenzen-app-192.png">
<style>
/* Pendenzen-App (Web-App fürs Handy): nur erfassen – alles landet in der Sammelbox, verteilt wird später am PC.
   Funktioniert ohne Empfang: Einträge warten auf dem Handy und gehen raus, sobald wieder Netz da ist. */
:root{ --bg:#F5F7F9; --primary:#323E4E; --muted:#8B9097; --line:#E1E5E9; --ink:#232B35; --blau:#D6E7F4; --gruen:#D1DB5F; --rot:#C0392B; }
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);font-size:16px;line-height:1.4;display:flex;flex-direction:column;}
.hidden{display:none !important;}
header{background:var(--primary);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px;}
header h1{font-size:17px;font-weight:600;}
header .netz{margin-left:auto;font-size:12px;display:flex;align-items:center;gap:6px;opacity:.9;}
header .netz i{width:9px;height:9px;border-radius:50%;background:var(--gruen);display:inline-block;}
header .netz.aus i{background:#E0A96D;}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;}
main{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;max-width:560px;width:100%;margin:0 auto;}
.feld{background:#fff;border:1.5px solid #9DC2DF;border-radius:12px;display:flex;flex-direction:column;}
textarea{border:0;background:transparent;resize:none;font:inherit;font-size:19px;padding:14px;min-height:130px;outline:none;color:var(--ink);}
.feld .unten{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line);}
.feld .tipp{font-size:12px;color:var(--muted);flex:1;}
.mic{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--primary);display:inline-flex;align-items:center;justify-content:center;}
.mic.an{background:var(--rot);border-color:var(--rot);color:#fff;}
.speichern{height:56px;border:0;border-radius:12px;background:var(--primary);color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;}
.speichern:active{transform:scale(.98);}
.meldung{font-size:14px;text-align:center;color:var(--primary);min-height:20px;}
.meldung.ok{color:#4F7A3A;}
h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:6px;}
.liste{background:#fff;border-radius:12px;overflow:hidden;}
.zeile{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid #EEF1F4;font-size:15px;}
.zeile:first-child{border-top:0;}
.zeile span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.zeile .st{color:var(--muted);display:inline-flex;flex:none;}
.zeile .st.ok{color:#4F7A3A;}
.leer{padding:12px 14px;color:var(--muted);font-size:14px;}
.fuss{text-align:center;font-size:13px;padding-bottom:calc(10px + env(safe-area-inset-bottom));}
.fuss a{color:var(--primary);}
.logincard{background:#fff;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px;}
.logincard h2{font-size:18px;color:var(--primary);text-transform:none;letter-spacing:0;margin:0;}
.logincard label{font-size:13px;color:var(--muted);}
.logincard input{width:100%;height:46px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:16px;}
.logincard .status{font-size:13px;color:var(--rot);min-height:16px;}
</style>
</head>
<body>
<header><h1>Pendenzen</h1><span class="netz" id="netz"><i></i><span id="netzText">Online</span></span></header>

<main id="login" class="hidden">
  <div class="logincard">
    <h2>Anmelden</h2>
    <div><label for="loginEmail">E-Mail</label><input autocomplete="username" id="loginEmail" type="email"></div>
    <div><label for="loginPassword">Passwort</label><input autocomplete="current-password" id="loginPassword" type="password"></div>
    <button class="speichern" id="loginBtn">Anmelden</button>
    <div class="status" id="loginStatus"></div>
  </div>
</main>

<main id="erfassen" class="hidden">
  <div class="feld">
    <textarea id="text" placeholder="Was soll nicht vergessen gehen?" aria-label="Neue Pendenz" enterkeyhint="done"></textarea>
    <div class="unten"><span class="tipp">Tipp: Mikrofon der Tastatur zum Diktieren</span><button class="mic hidden" id="mic" aria-label="Sprechen"></button></div>
  </div>
  <button class="speichern" id="speichern"></button>
  <div class="meldung" id="meldung"></div>
  <h2 id="wartetTitel" class="hidden">Wartet auf Netz</h2>
  <div class="liste hidden" id="wartet"></div>
  <h2>Zuletzt erfasst</h2>
  <div class="liste" id="zuletzt"></div>
  <div class="fuss"><a href="/pendenzen-live-v1.html">Zum Pendenzentool</a></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const K = (n, s = 20) => KG.icon(n, s);
const SAMMEL_ICON = '<svg class="i" viewBox="0 0 24 24"><path d="M3 13h5l1.5 3h5l1.5-3h5"/><path d="M5.5 5h13L21 13v6H3v-6z"/></svg>';
let sb = null; try { sb = window.supabase.createClient('https://oalapdxinqlnzwxhyuzy.supabase.co', 'sb_publishable_DoeD4uEnwemmnFu4AxE9uw_5lmQYc5P'); } catch(e){}

// Speicher auf dem Handy: Warteschlange (noch nicht gesendet) und die letzten Einträge
const lies = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e){ return d; } };
const schreib = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
let warte = lies('pzapp_warte', []), zuletzt = lies('pzapp_zuletzt', []), me = lies('pzapp_me', null);
const uuid = () => crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });

$('speichern').innerHTML = SAMMEL_ICON + 'In die Sammelbox';
$('wartet').addEventListener('click', () => sende());

function zeichne(){
  const n = warte.length;
  $('wartetTitel').classList.toggle('hidden', !n); $('wartet').classList.toggle('hidden', !n);
  $('wartet').innerHTML = warte.map(w => `<div class="zeile"><span>${esc(w.titel)}</span><span class="st" title="wartet">${K('upload', 16)}</span></div>`).join('');
  $('zuletzt').innerHTML = zuletzt.length ? zuletzt.slice(0, 8).map(z => `<div class="zeile"><span>${esc(z.titel)}</span><span class="st${z.ok ? ' ok' : ''}">${z.ok ? K('check', 16) : K('upload', 16)}</span></div>`).join('') : '<div class="leer">Noch nichts erfasst.</div>';
  const on = navigator.onLine; $('netz').classList.toggle('aus', !on); $('netzText').textContent = on ? (n ? `${n} wartet` : 'Online') : `Kein Netz${n ? ' · ' + n + ' wartet' : ''}`;
}
function meldung(t, ok){ const m = $('meldung'); m.textContent = t; m.className = 'meldung' + (ok ? ' ok' : ''); clearTimeout(meldung.t); meldung.t = setTimeout(() => { m.textContent = ''; }, 3500); }

// Erfassen: sofort auf dem Handy speichern, dann senden versuchen
function erfassen(){
  const t = $('text').value.trim(); if(!t){ $('text').focus(); return; }
  const e = { id: uuid(), titel: t, am: new Date().toISOString() };
  warte.push(e); zuletzt.unshift({ ...e, ok: false }); zuletzt = zuletzt.slice(0, 20);
  schreib('pzapp_warte', warte); schreib('pzapp_zuletzt', zuletzt);
  $('text').value = ''; $('text').focus(); zeichne();
  meldung(navigator.onLine ? 'Gespeichert' : 'Gespeichert – geht raus, sobald wieder Netz da ist', true);
  sende();
}
$('speichern').addEventListener('click', erfassen);
$('text').addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); erfassen(); } });

// Sammelbox-Liste im eigenen Board suchen (wird gemerkt, damit es auch ohne Netz klar ist)
async function sammelListe(){
  let lid = lies('pzapp_liste', null); if(lid && lid.me === me) return lid.id;
  const { data: b } = await sb.from('pendenz_board').select('id').eq('typ', 'person').eq('besitzer_id', me).maybeSingle();
  if(!b) throw new Error('Bitte das Pendenzentool einmal am PC öffnen.');
  let { data: l } = await sb.from('pendenz_liste').select('id').eq('board_id', b.id).eq('art_id', 'sammel').maybeSingle();
  if(!l){ ({ data: l } = await sb.from('pendenz_liste').insert({ board_id: b.id, art_id: 'sammel', titel: 'Sammelbox', bereich: 'team', x: 20, y: 150 }).select('id').single()); }
  schreib('pzapp_liste', { me, id: l.id }); return l.id;
}
let sendet = false;
async function sende(){
  if(sendet || !warte.length || !navigator.onLine || !sb || !me) return zeichne();
  sendet = true;
  try {
    const lid = await sammelListe();
    for(const w of [...warte]){
      // feste ID: wird ein Eintrag doppelt gesendet (Netz bricht ab), entsteht trotzdem nur eine Pendenz
      const { error } = await sb.from('pendenz').insert({ id: w.id, liste_id: lid, titel: w.titel, sortierung: Date.parse(w.am) / 1000, erstellt_von: me, herkunft: 'handy' });
      if(error && error.code !== '23505') throw error;
      warte = warte.filter(x => x.id !== w.id); schreib('pzapp_warte', warte);
      zuletzt.forEach(z => { if(z.id === w.id) z.ok = true; }); schreib('pzapp_zuletzt', zuletzt); zeichne();
    }
  } catch(e){ console.error(e); if(navigator.onLine) meldung('Senden klappt gerade nicht – Eintrag ist gespeichert und geht später raus.'); }
  sendet = false; zeichne();
}
addEventListener('online', sende); addEventListener('offline', zeichne);
document.addEventListener('visibilitychange', () => { if(!document.hidden) sende(); });
setInterval(sende, 30000);

// Diktieren im Browser (wo vorhanden); sonst das Mikrofon der Handy-Tastatur
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SR){ const mic = $('mic'); mic.classList.remove('hidden'); mic.innerHTML = K('mikrofon', 22); let rec = null;
  mic.addEventListener('click', () => {
    if(rec){ rec.stop(); return; }
    rec = new SR(); rec.lang = 'de-CH'; rec.interimResults = false; const vor = $('text').value;
    rec.onresult = ev => { const t = [...ev.results].map(r => r[0].transcript).join(' '); $('text').value = (vor ? vor + ' ' : '') + t; };
    rec.onend = () => { rec = null; mic.classList.remove('an'); $('text').focus(); };
    rec.onerror = () => { meldung('Diktieren geht gerade nicht – Mikrofon der Tastatur verwenden.'); };
    mic.classList.add('an'); rec.start(); }); }

// Anmeldung: Sitzung bleibt auf dem Handy gespeichert; ohne Netz geht Erfassen trotzdem (mit der gemerkten Person)
async function start(){
  if(sb){ try { const { data: { session } } = await sb.auth.getSession(); if(session){ me = session.user.id; schreib('pzapp_me', me); } } catch(e){} }
  if(!me){ $('login').classList.remove('hidden'); $('erfassen').classList.add('hidden'); return; }
  $('login').classList.add('hidden'); $('erfassen').classList.remove('hidden'); zeichne(); $('text').focus(); sende();
}
$('loginBtn').addEventListener('click', async () => {
  if(!sb) return $('loginStatus').textContent = 'Kein Netz – zum ersten Anmelden braucht es Empfang.';
  $('loginStatus').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('loginEmail').value.trim(), password: $('loginPassword').value });
  if(error) return $('loginStatus').textContent = 'Anmelden fehlgeschlagen: ' + error.message;
  start();
});
$('loginPassword').addEventListener('keydown', e => { if(e.key === 'Enter') $('loginBtn').click(); });

if('serviceWorker' in navigator) navigator.serviceWorker.register('/pendenzen-app-sw.js', { scope: '/pendenzen-app' }).catch(e => console.warn('SW', e));
start();
})();
</script>
</body>
</html>
