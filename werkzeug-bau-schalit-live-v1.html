<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=42"></script>
<title>Beton für Schalungssteine – Werkzeuge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#323E4E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kg-werkzeuge.js?v=9"></script>
</head>
<body>
<header class="app"><div class="wrap">
  <a class="backlink" href="index.html">Startseite</a>
  <div class="brand"><h1>Werkzeuge</h1></div>
  <span class="userbar hidden" id="userbar"><span id="userbarText"></span><button id="logoutBtn">Abmelden</button></span>
</div></header>
<main id="appMain"></main>
<script>
// CREABETON SCHALIT Schalungsstein (Produktblatt H0301, Mai 2020):
// Füllbeton pro m² Mauer (Tabelle 1), Steine 40 × 25 cm = 10 pro m², m² pro Palette (Tabelle 3)
const SCHALIT = {
  15: { m3: 0.09, palette: 4.2, art: '124174' },
  20: { m3: 0.14, palette: 3.6, art: '134556' },
  25: { m3: 0.18, palette: 2.4, art: '139678' }
};
KGW.werkzeug('bau_schalit', inhalt => {
  const $ = id => document.getElementById(id), g = (id, alt) => KGW.lsGet('kgw-schalit-' + id, alt);
  inhalt.insertAdjacentHTML('beforeend', KGW.karte('SCHALIT Steinbreite', KGW.seg('breite', [['15', '15 cm'], ['20', '20 cm'], ['25', '25 cm']], g('seg-breite', '20'))
    + '<span class="kgw-klein" id="info"></span>', 'steinKarte'));
  inhalt.insertAdjacentHTML('beforeend', KGW.karte('Mauerfläche', `${KGW.seg('eingabe', [['masse', 'Länge × Höhe'], ['flaeche', 'Fläche']], g('seg-eingabe', 'masse'))}
    <div id="eMasse" style="display:flex;flex-direction:column;gap:10px">${KGW.feld('laenge', 'Länge (m)', g('laenge', '10'), 0.5)}${KGW.feld('hoehe', 'Höhe (m)', g('hoehe', '1'), 0.25)}</div>
    <div id="eFlaeche">${KGW.feld('flaeche', 'Fläche (m²)', g('flaeche', '10'), 1)}</div>
    <div class="kgw-zeile kgw-trenn"><span>Fläche</span><b id="anzFlaeche"></b></div>`, 'flaecheKarte'));
  inhalt.insertAdjacentHTML('beforeend', KGW.karte('Füllbeton', `<div class="kgw-gross"><b id="beton"></b><span>m³</span></div>
    <span class="kgw-klein" id="weg"></span>
    <div class="kgw-zeile kgw-trenn"><span>Steine (ca. 10 pro m²)</span><b id="steine"></b></div>
    <div class="kgw-zeile"><span>Paletten</span><b id="paletten"></b></div>`));
  inhalt.insertAdjacentHTML('beforeend', KGW.karte('So gehts', `<div>
    <div class="kgw-info"><b>Beton</b><span>Pumpbeton PC 375, 0–8 mm, zusätzlich 1,2 % Fliessmittel</span></div>
    <div class="kgw-info"><b>Vorher</b><span>Steine gründlich vornässen</span></div>
    <div class="kgw-info"><b>Aufbau</b><span>Bis 3 Lagen trocken versetzen. Höhere Mauern: Steine zusammenkleben</span></div>
    <div class="kgw-info"><b>Quelle</b><span>Füllmenge: Creabeton Produktblatt H0301 (Richtwerte, ca.)</span></div></div>`));
  const rechne = () => {
    const b = KGW.segWert($('steinKarte'), 'breite'), s = SCHALIT[b], masse = KGW.segWert($('flaecheKarte'), 'eingabe') === 'masse';
    $('eMasse').classList.toggle('hidden', !masse); $('eFlaeche').classList.toggle('hidden', masse);
    const A = masse ? KGW.zahl('laenge') * KGW.zahl('hoehe') : KGW.zahl('flaeche');
    $('anzFlaeche').textContent = KGW.fmt(A, 2) + ' m²';
    $('beton').textContent = KGW.fmt(A * s.m3, 2);
    $('weg').textContent = `${KGW.fmt(A, 2)} m² × ca. ${KGW.fmt(s.m3, 2)} m³/m² = ${KGW.fmt(A * s.m3 * 1000, 0)} Liter`;
    $('steine').textContent = 'ca. ' + KGW.fmt(Math.ceil(A * 10), 0);
    $('paletten').textContent = A ? `${KGW.fmt(Math.ceil(A / s.palette), 0)} (à ${KGW.fmt(s.palette, 1)} m²)` : '–';
    $('info').textContent = `Normalstein 40 × ${b} × 25 cm · Art.-Nr. ${s.art}`;
  };
  KGW.binden($('steinKarte'), rechne, 'kgw-schalit-');
  KGW.binden($('flaecheKarte'), rechne, 'kgw-schalit-');
  rechne();
});
</script>
</body>
</html>
