<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=3"></script>
<title>Pendenzen – Knechtgarten</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg:#F5F7F9; --card:#FFFFFF; --primary:#323E4E; --primary-l:#4C5C70;
  --ink:#232B35; --muted:#8B9097; --line:#E1E5E9; --soft:#EEF3F7;
  --accent-blue:#D6E7F4; --accent-lime:#D1DB5F; --danger:#B4655F; --red:#C0392B;
  --z1:#D1DB5F; --z2:#9DC2DF; --z3:#A9B0B7;
  --listw:320px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);line-height:1.45;font-size:13px;}
.wrap{padding:0 16px;}
.hidden,[hidden]{display:none !important;}
header.app .wrap{flex-wrap:wrap;row-gap:0;}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;}
header.app{background:var(--primary);color:#fff;}
header.app .wrap{display:flex;align-items:center;gap:20px;}
header.app .backlink{display:inline-flex;align-items:center;gap:5px;color:var(--primary);text-decoration:none;font-size:12px;font-weight:700;flex-shrink:0;background:var(--accent-lime);border-radius:20px;padding:6px 12px;}
header.app .brand{padding:11px 0;}
header.app .brand h1{font-size:15px;font-weight:600;color:#fff;}
header.app .brand .sub{font-size:11px;opacity:.75;margin-top:1px;}
header.app .userbar{display:flex;align-items:center;gap:10px;margin-left:auto;}
header.app .userbar span{opacity:.85;font-size:11.5px;}
header.app .userbar button.lo{font-size:11.5px;color:#c7ccd1;background:none;border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:3px 9px;cursor:pointer;}
.hbtn{all:unset;cursor:pointer;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;border:1px solid rgba(255,255,255,.3);}
.hbtn:hover,.hbtn[aria-pressed="true"]{background:rgba(255,255,255,.15);}
.hbtn svg{width:16px;height:16px;}
.bbar{background:#fff;border-bottom:1px solid var(--line);}
.bbar .wrap{display:flex;align-items:center;gap:10px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap;}
.bbar .bname{font-size:14px;font-weight:700;color:var(--primary);}
.sp{flex:1;}
input[type=text],input[type=email],input[type=password],select{font:inherit;font-size:12.5px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 8px;}
input:focus,select:focus{outline:none;border-color:var(--primary);}
.btn{border:none;border-radius:7px;padding:7px 14px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn-primary{background:var(--primary);color:#fff;} .btn-primary:hover{background:var(--primary-l);}
.btn-ghost{background:#fff;color:var(--primary);border:1px solid var(--line);} .btn-ghost:hover{border-color:var(--primary);}
.btn-danger{background:var(--danger);color:#fff;}
.btn svg{width:15px;height:15px;}
button:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
.seg{display:inline-flex;flex-wrap:wrap;}
.seg button{all:unset;cursor:pointer;padding:5px 11px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--primary);display:inline-flex;align-items:center;gap:5px;}
.seg button + button{border-left:0;}
.seg button:first-child{border-radius:6px 0 0 6px;} .seg button:last-child{border-radius:0 6px 6px 0;}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff;border-color:var(--primary);}
.seg i{width:9px;height:9px;border-radius:50%;}
.muted{color:var(--muted);} .small{font-size:11.5px;}
.av{width:17px;height:17px;border-radius:50%;color:#fff;font-size:8px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;}

/* Login */
.loginwrap{display:flex;justify-content:center;padding:60px 0;}
.logincard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:28px 26px;width:100%;max-width:330px;display:flex;flex-direction:column;gap:12px;}
.logincard h2{font-size:17px;}
.logincard .fld{display:flex;flex-direction:column;gap:4px;}
.logincard label{font-size:11.5px;color:var(--muted);}
.status{font-size:12px;color:var(--muted);} .status.err{color:var(--danger);}

/* Bereiche */
.zones{display:flex;height:calc(100vh - 106px);min-height:480px;}
.pane{display:flex;flex-direction:column;min-width:0;flex:none;}
.pane.mitte{flex:1;}
.pane.zeit,.pane.team{background:#EFF2F5;}
.ptitle{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:8px 20px 0;display:flex;gap:6px;align-items:center;flex:none;}
.ptitle svg{width:13px;height:13px;}
.pane.schmal .ptitle{padding:8px 0 0;justify-content:center;}
.pane.schmal .ptitle span{display:none;}
.canvas{position:relative;overflow:auto;flex:1;min-height:0;}
.pane.zeit .canvas,.pane.team .canvas{overflow-x:hidden;}
.sheet{position:relative;}
.canvas.ziehen .sheet{background-image:radial-gradient(circle,#C5CCD3 1px,transparent 1.2px);background-size:20px 20px;}
.canvas.stack .sheet{display:flex;flex-direction:column;gap:12px;padding:12px;width:auto !important;height:auto !important;}
.canvas.stack .list{position:relative;left:auto !important;top:auto !important;width:100%;max-width:var(--listw);}
.split{width:9px;flex:none;cursor:col-resize;position:relative;touch-action:none;}
.split::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:1px;background:#C9D0D7;}
.split:hover::before,.split.on::before{background:var(--primary);width:2px;left:3.5px;}
.split .grip{position:absolute;top:50%;left:1px;width:7px;height:30px;margin-top:-15px;border-radius:4px;background:#fff;border:1px solid #C9D0D7;}
.split:hover .grip,.split.on .grip{border-color:var(--primary);}
.vstack{display:flex;flex-direction:column;gap:8px;padding:10px 0;align-items:center;overflow-y:auto;flex:1;}
.vstrip{all:unset;cursor:pointer;width:32px;border-radius:9px;color:#fff;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;gap:8px;padding:12px 0;font-weight:700;font-size:12.5px;white-space:nowrap;flex:none;}
.vstrip svg.i{width:18px;height:18px;transform:rotate(180deg);}
.vstrip.hell{color:var(--ink);}

/* Listen und Pendenzen */
.list{position:absolute;width:var(--listw);background:var(--soft);border-radius:10px;box-shadow:0 1px 2px rgba(35,43,53,.08);display:flex;flex-direction:column;}
.list.flieg{position:fixed !important;z-index:40;box-shadow:0 14px 34px rgba(35,43,53,.28);pointer-events:none;}
.lh{display:flex;align-items:center;gap:7px;padding:7px 8px 7px 6px;border-radius:10px;color:#fff;cursor:grab;user-select:none;}
.list:not(.zu) .lh{border-radius:10px 10px 0 0;}
.lh.hell{color:var(--ink);}
.lh > svg.i{width:20px;height:20px;}
.lh b{font-size:13px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tog{all:unset;cursor:pointer;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;flex:none;}
.tog:hover{background:rgba(255,255,255,.18);}
.tog svg{width:14px;height:14px;transition:transform .15s;}
.zu > .lh .tog svg,.gh.zu .tog svg{transform:rotate(-90deg);}
.lh .kg-ibtn{background:transparent;border-color:rgba(255,255,255,.45);color:inherit;}
.lh.hell .kg-ibtn{border-color:rgba(35,43,53,.25);}
.lh .kg-ibtn:hover{background:rgba(255,255,255,.2);color:inherit;}
.list.zu .body{display:none;}
.cards{display:flex;flex-direction:column;gap:4px;padding:6px 6px 2px;min-height:12px;}
.gh{display:flex;align-items:center;gap:4px;margin:6px 6px 0;padding:3px 4px;font-size:11.5px;font-weight:700;color:var(--primary);border-radius:6px;cursor:pointer;user-select:none;}
.gh:hover{background:rgba(50,62,78,.06);}
.gcards{padding-left:12px;}
.gh.zu + .gcards{display:none;}
.card{background:#fff;border-radius:6px;height:30px;display:flex;align-items:center;gap:6px;padding:0 6px 0 0;cursor:pointer;border:1px solid transparent;overflow:hidden;flex:none;}
.card:hover{border-color:var(--line);}
.card.sel{border-color:var(--primary);}
.card .pr{all:unset;cursor:pointer;width:6px;align-self:stretch;flex:none;background:#EEF1F4;}
.card .pr:hover{width:9px;}
.card .ck{all:unset;width:14px;height:14px;border:1.5px solid #B8BEC4;border-radius:4px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;margin-left:2px;}
.card .ck:hover{border-color:var(--primary);}
.card .ty{width:21px;height:21px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none;}
.card .ty svg{width:17px;height:17px;}
.card .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;}
.card .ind{display:flex;gap:3px;align-items:center;color:var(--muted);flex:none;}
.card .ind svg{width:12px;height:12px;}
.card.dragging{opacity:.35;}
.ph{height:3px;background:var(--primary);border-radius:2px;margin:-2px 0;}
.ladd{display:flex;gap:4px;padding:4px 6px 8px;}
.ladd input{flex:1;min-width:0;height:30px;background:transparent;border-color:transparent;}
.ladd input:hover,.ladd input:focus{background:#fff;border-color:var(--line);}
.ladd .kg-ibtn{margin-top:3px;}
.zhint{font-size:11px;color:var(--muted);padding:4px 4px 6px;}

/* Popover */
.pop{position:fixed;z-index:25;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(35,43,53,.18);padding:10px;display:flex;flex-direction:column;gap:9px;}
.fld{display:flex;flex-direction:column;gap:5px;}
.fld > label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.zopt{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;font-size:12.5px;}
.zopt:hover{background:var(--soft);}
.zopt i{width:10px;height:10px;border-radius:50%;border:1px solid var(--line);}
.zopt[aria-pressed="true"]{font-weight:700;}
.artchip{all:unset;cursor:grab;display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;color:#fff;font-weight:700;font-size:12.5px;}
.artchip svg{width:18px;height:18px;}
.confirm{background:#FBEFEC;border:1px solid #E6CFCC;border-radius:8px;padding:8px;display:flex;gap:6px;align-items:center;font-size:12px;flex-wrap:wrap;}

/* Pendenz: Fenster oder rechts angeheftet */
.dbg{position:fixed;inset:0;background:rgba(35,43,53,.35);z-index:15;display:flex;justify-content:center;align-items:flex-start;padding:7vh 16px 16px;overflow:auto;}
.det{background:#fff;display:flex;flex-direction:column;gap:14px;}
.det.fenster{width:100%;max-width:600px;border-radius:12px;padding:18px;box-shadow:0 18px 50px rgba(35,43,53,.25);}
.det.rechts{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(35,43,53,.12);padding:16px;overflow:auto;z-index:15;}
.det .hd{display:flex;gap:8px;align-items:flex-start;}
.det .hd .ty{width:28px;height:28px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none;margin-top:2px;}
.det .hd .ty svg{width:20px;height:20px;}
.det .hd input{flex:1;min-width:0;font-size:16px;font-weight:700;border-color:transparent;padding:4px 6px;}
.det .hd input:hover{border-color:var(--line);}
.det .von{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:-8px;padding-left:36px;}
.ed{border:1px solid #C9CFD5;border-radius:8px;display:flex;flex-direction:column;}
.ed:focus-within{border-color:var(--primary);}
.etb{display:flex;align-items:center;gap:2px;padding:5px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap;position:relative;}
.etb .sepv{width:1px;height:18px;background:var(--line);margin:0 6px;}
.eb{all:unset;cursor:pointer;height:28px;min-width:28px;padding:0 5px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:2px;color:var(--primary);font-size:13px;}
.eb:hover{background:var(--soft);}
.eb svg{width:17px;height:17px;}
.eb svg.dd{width:11px;height:11px;}
.emenu{position:absolute;top:36px;z-index:3;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 20px rgba(35,43,53,.15);padding:4px;display:flex;flex-direction:column;min-width:150px;}
.emenu button{all:unset;cursor:pointer;padding:6px 9px;border-radius:5px;font-size:12.5px;}
.emenu button:hover{background:var(--soft);}
.elink{display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);}
.elink input{flex:1;min-width:0;}
.ebody{min-height:130px;padding:10px 14px;outline:none;font-size:13.5px;line-height:1.55;overflow-wrap:anywhere;}
.ebody:empty::before{content:attr(data-ph);color:var(--muted);}
.ebody h3{font-size:15px;margin:6px 0 2px;} .ebody p{margin:0 0 4px;} .ebody ul,.ebody ol{margin:2px 0 6px;padding-left:20px;}
.ebody a{color:#2E6A9A;} .ebody img{max-width:100%;border-radius:6px;}
.strip{display:flex;flex-direction:column;gap:6px;}
.strip .lab{display:flex;align-items:center;gap:6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;}
.strip .lab svg{width:13px;height:13px;}
.tiles{display:flex;gap:6px;flex-wrap:wrap;}
.tile{position:relative;}
.tile a{display:block;text-decoration:none;color:var(--ink);}
.tile img{width:64px;height:48px;border-radius:6px;object-fit:cover;display:block;background:var(--soft);}
.datei{height:48px;max-width:190px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;display:flex;align-items:center;gap:7px;font-size:11.5px;background:#fff;}
.datei:hover{border-color:var(--primary);}
.datei span:last-child{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.ft{font-size:9px;font-weight:800;color:#fff;border-radius:3px;padding:2px 4px;flex:none;background:#4F7C8A;}
.ft.pdf{background:var(--danger);}
.tile .kg-ibtn{position:absolute;top:-7px;right:-7px;width:20px;height:20px;display:none;}
.tile .kg-ibtn svg{width:11px;height:11px;}
.tile:hover .kg-ibtn{display:inline-flex;}
.fadd{width:48px;height:48px;border-radius:6px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;background:#fff;}
.fadd:hover{border-color:var(--primary);color:var(--primary);}
.det .foot{display:flex;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:10px;font-size:11px;color:var(--muted);}

/* Einstellungen, Notizzettel, Meldungen */
.set{width:100%;max-width:520px;background:#fff;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 50px rgba(35,43,53,.25);}
.set h2{font-size:15px;display:flex;justify-content:space-between;align-items:center;}
.artrow{display:flex;align-items:center;gap:8px;padding:4px 0;flex-wrap:wrap;}
.artrow .ty{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none;}
.artrow .ty svg{width:17px;height:17px;}
.artrow .n{width:150px;font-size:12.5px;}
.sws{display:flex;gap:3px;flex-wrap:wrap;}
.sw{all:unset;cursor:pointer;width:16px;height:16px;border-radius:50%;}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--primary);}
.zettel{position:fixed;top:64px;right:16px;width:min(340px,calc(100% - 32px));height:300px;background:#FFFDF2;border-radius:4px;box-shadow:0 12px 34px rgba(35,43,53,.25);z-index:22;display:flex;flex-direction:column;}
.zettel .zt{display:flex;align-items:center;gap:2px;padding:4px 6px;position:relative;}
.zettel .zt .eb{height:24px;min-width:24px;}
.zettel .zt .eb svg{width:15px;height:15px;}
.zettel .ebody{flex:1;overflow:auto;padding:4px 14px 12px;min-height:0;font-size:13px;}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--primary);color:#fff;border-radius:8px;padding:8px 14px;font-size:12.5px;display:flex;gap:12px;align-items:center;z-index:30;max-width:calc(100% - 32px);}
.toast.err{background:var(--danger);}
.toast button{all:unset;cursor:pointer;color:var(--accent-lime);font-weight:700;}
.laden{padding:40px;text-align:center;color:var(--muted);}
@media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<header class="app"><div class="wrap">
  <a class="backlink" href="index.html" title="Zurück zur Hauptübersicht"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg> Startseite</a>
  <div class="brand"><h1>Pendenzen</h1><div class="sub">Knechtgarten</div></div>
  <span class="userbar hidden" id="userbar"><span id="userbarText"></span><span id="hknoepfe" style="display:flex;gap:8px;opacity:1"></span><button class="lo" id="logoutBtn">Abmelden</button></span>
</div></header>

<div class="wrap hidden" id="loginwrap"><div class="loginwrap"><div class="logincard">

  <button class="btn btn-primary" style="justify-content:center" id="loginBtn">Anmelden</button>

</div></div></div>

</div></div></div>

<div class="hidden" id="appMain">

</div>
<div id="over"></div>

async function eigenesBoard(){
  let { data: b, error } = await sb.from('pendenz_board').select('*').eq('typ', 'person').eq('besitzer_id', ME).maybeSingle();
  if(error) throw error;
  if(b) return b;

  if(error) throw error;
  const arten = Object.values(S.arten).filter(a => a.aktiv).sort((x, y) => x.sortierung - y.sortierung);
  const rows = [1, 2, 3].map((z, i) => ({ board_id: b.id, zeit: z, titel: ZEIT[z].t, bereich: 'zeit', x: R, y: R + i * 120 }));
  rows.push({ board_id: b.id, art_id: 'team', titel: art('team').titel, bereich: 'team', x: R, y: R });
  rows.push({ board_id: b.id, art_id: 'besprechen', titel: art('besprechen').titel, bereich: 'team', x: R, y: R + 140 });
  arten.filter(a => !a.funktion && a.id !== 'besprechen').forEach((a, i) => rows.push({ board_id: b.id, art_id: a.id, titel: a.titel, bereich: 'mitte', x: R + (i % 3) * (LW + R), y: R + Math.floor(i / 3) * 140 }));

async function ladeAlles(){

      sb.from('benutzer').select('id,anzeigename,email'),
      sb.from('pendenz_benutzer').select('*').eq('benutzer_id', ME).maybeSingle()

    if(ra.error) throw ra.error;
    S.arten = Object.fromEntries(ra.data.map(a => [a.id, a]));
    S.benutzer = Object.fromEntries((rb.data || []).map(b => [b.id, b]));
    if(re.data) S.ein = { oeffnen: re.data.oeffnen, breiten: re.data.breiten || {}, farben: re.data.farben || {}, notizzettel: re.data.notizzettel || '' };
    S.board = await eigenesBoard();

}
async function ladeBoard(){
  const { data: ls, error } = await sb.from('pendenz_liste').select('*').eq('board_id', S.board.id); if(error) return fehler(error, 'Listen');
  S.listen = ls; const ids = ls.map(l => l.id);

}
