<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=67"></script>
<title>Reservieren – Knechtgarten</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#323E4E">
<style>
/* Reservieren (Handy): Geräte mit Haken «selber reservierbar» (zuerst Transportanhänger) im Monatskalender.
   Tag antippen → Vormittag · Nachmittag · Ganzer Tag. Gespeichert in planer_ressource_einsatz auf die eigene Planer-Zeile,
   also gleich sichtbar im Einsatzplaner (Ebene Anhänger). Ändern/löschen nur eigene; Doppelbelegung sperrt die Datenbank. */
:root{ --bg:#F5F7F9; --primary:#323E4E; --ink:#232B35; --muted:#6B7079; --line:#E1E5E9; --soft:#EEF1F4; --belegt:#D6E7F4; }
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);line-height:1.4;font-size:15px;-webkit-tap-highlight-color:transparent;}
.hidden{display:none !important;}
.kopf{position:sticky;top:0;z-index:20;background:var(--primary);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;}
.kopf b{font-size:19px;display:block;}
.kopf select{all:unset;font-size:13px;opacity:.85;cursor:pointer;}
.w{max-width:560px;margin:0 auto;padding:12px 14px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;}
.karte{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;}
.mon{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.mon b{font-size:15px;}
.mon button{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:20px;}
.mon button:active{background:var(--soft);}
.wt,.tage{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.wt span{font-size:10.5px;text-align:center;color:var(--muted);font-weight:600;padding-bottom:2px;}
.tag{all:unset;cursor:pointer;box-sizing:border-box;height:48px;border-radius:8px;border:1px solid var(--line);background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;}
.tag .n{position:absolute;top:3px;left:5px;font-size:11.5px;font-weight:600;z-index:2;}
.tag .h{flex:1;} .tag .h.b{background:var(--belegt);} .tag .h.m{background:var(--primary);}
.tag .k{position:absolute;bottom:3px;right:4px;font-size:9.5px;font-weight:700;z-index:2;color:var(--primary);max-width:90%;overflow:hidden;white-space:nowrap;}
.tag.mvm .n{color:#fff;} .tag.mnm .k{color:#fff;}
.tag.aus{opacity:.35;cursor:default;}
.tag.heute{outline:2px solid #D1DB5F;outline-offset:-2px;}
.tag.leer{visibility:hidden;}
.leg{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-top:8px;}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line);}
h3{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;}
.r{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--soft);font-size:14px;}
.r:first-of-type{border-top:0;} .r span{flex:1;} .r small{color:var(--muted);}
.x{all:unset;cursor:pointer;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none;}
.x svg{width:13px;height:13px;}
.hinweis{font-size:13px;color:var(--muted);}
.blatt{position:fixed;inset:0;z-index:96;background:rgba(35,43,53,.45);display:flex;align-items:flex-end;}
.blatt .in{background:#fff;width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;}
.blatt .griff{width:40px;height:4px;border-radius:2px;background:#D5DBE1;align-self:center;}
.blatt b.t{font-size:17px;}
.wahl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.wahl button{all:unset;cursor:pointer;text-align:center;padding:14px 0;border-radius:12px;border:1px solid var(--line);font-weight:600;font-size:14px;}
.wahl button:active{background:var(--soft);}
.wahl button[disabled]{opacity:.35;cursor:default;}
.wahl small{display:block;font-weight:400;font-size:11px;color:var(--muted);}
.belegt{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13.5px;display:flex;align-items:center;gap:10px;}
.belegt span{flex:1;}
.wa{all:unset;cursor:pointer;background:#25D366;color:#fff;font-weight:600;font-size:13px;border-radius:99px;padding:6px 12px;text-decoration:none;}
.zu{all:unset;cursor:pointer;text-align:center;color:var(--muted);font-size:14px;padding:6px;}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#323E4E;color:#fff;font-size:14px;padding:9px 14px;border-radius:10px;z-index:120;max-width:90%;}
.toast.f{background:#A33F3A;}
.loginwrap{display:flex;justify-content:center;padding:60px 16px;}
.logincard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;}
.logincard input{font:inherit;border:1px solid #D5DBE1;border-radius:8px;padding:10px;}
.logincard button{all:unset;cursor:pointer;text-align:center;background:var(--primary);color:#fff;border-radius:8px;padding:10px;font-weight:600;}
</style>
</head>
<body>
<div class="loginwrap hidden" id="loginwrap"><div class="logincard"><b style="font-size:18px;color:#323E4E">Knechtgarten</b>
  <input autocomplete="username" id="loginEmail" type="email" placeholder="E-Mail"><input autocomplete="current-password" id="loginPassword" type="password" placeholder="Passwort">
  <button type="button" id="loginBtn">Anmelden</button><div style="font-size:13px;color:#6B7079" id="loginStatus"></div></div></div>

<div id="app" class="hidden">
  <div class="kopf"><b>Reservieren</b><select id="geraet" aria-label="Gerät"></select></div>
  <div class="w">
    <div class="hinweis hidden" id="keinRecht"></div>
    <div class="karte">
      <div class="mon"><button type="button" id="vor" aria-label="Vorheriger Monat">‹</button><b id="monat"></b><button type="button" id="nach" aria-label="Nächster Monat">›</button></div>
      <div class="wt"><span>Mo</span><span>Di</span><span>Mi</span><span>Do</span><span>Fr</span><span>Sa</span><span>So</span></div>
      <div class="tage" id="tage"></div>
      <div class="leg"><span><i></i>frei</span><span><i style="background:var(--belegt)"></i>belegt</span><span><i style="background:var(--primary)"></i>meine</span></div>
    </div>
    <div class="karte"><h3>Meine Reservationen</h3><div id="meine"></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const sb = window.supabase.createClient('https://oalapdxinqlnzwxhyuzy.supabase.co', 'sb_publishable_DoeD4uEnwemmnFu4AxE9uw_5lmQYc5P');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const WT = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'], MON = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const TEIL = { vm: 'Vormittag', nm: 'Nachmittag', ganz: 'ganzer Tag' };
// Halbtage wie im Einsatzplaner: Vormittag 06–12 Uhr, Nachmittag 12–18 Uhr
const zeit = (d, h) => { const x = new Date(d); x.setHours(h, 0, 0, 0); return x; };
const slot = (d, t) => t === 'vm' ? [zeit(d, 6), zeit(d, 12)] : t === 'nm' ? [zeit(d, 12), zeit(d, 18)] : [zeit(d, 6), zeit(d, 18)];
let ICH = null, PERS = {}, GERAETE = [], G = null, RES = [], MONAT = new Date(), DARF = false;
MONAT = new Date(MONAT.getFullYear(), MONAT.getMonth(), 1);
const heute = new Date(); heute.setHours(0, 0, 0, 0);
function toast(t, fehler){ const x = document.createElement('div'); x.className = 'toast' + (fehler ? ' f' : ''); x.textContent = t; document.body.appendChild(x); setTimeout(() => x.remove(), 3200); }

async function pruefeAnmeldung(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ $('loginwrap').classList.remove('hidden'); return; }
  $('loginwrap').classList.add('hidden'); $('app').classList.remove('hidden');
  if(KG.ladeRechte) await KG.ladeRechte();
  const [pp, ge] = await Promise.all([
    sb.from('planer_person').select('id,name,kuerzel,benutzer_id,aktiv').eq('ist_ablage', false),
    sb.from('planer_ressource').select('id,name,nummer,typ').eq('selbst_reservierbar', true).eq('aktiv', true).order('sortierung')]);
  (pp.data || []).forEach(p => PERS[p.id] = p);
  ICH = (pp.data || []).find(p => p.benutzer_id === session.user.id && p.aktiv) || null;
  const recht = KG.darf ? KG.darf('plan', 'reservieren', 'an') : null;
  DARF = !!ICH && (recht === 'J' || recht === null);
  if(!DARF){ $('keinRecht').classList.remove('hidden');
    $('keinRecht').textContent = !ICH ? 'Du bist im Einsatzplaner noch keiner Zeile zugeordnet – darum kannst du nur ansehen.' : 'Du kannst die Reservationen ansehen. Reservieren dürfen Vorarbeiter und Büro.'; }
  GERAETE = ge.data || [];
  if(!GERAETE.length){ $('tage').innerHTML = ''; $('meine').innerHTML = '<span class="hinweis">Kein Gerät zum Reservieren freigegeben.</span>'; return; }
  let gw = null; try { gw = localStorage.getItem('res_geraet'); } catch(e){}
  G = GERAETE.find(g => g.id === gw) || GERAETE[0];
  $('geraet').innerHTML = GERAETE.map(g => `<option value="${g.id}"${g.id === G.id ? ' selected' : ''}>${esc([g.name, g.name.includes(g.nummer || '#') ? '' : g.nummer].filter(Boolean).join(' '))}</option>`).join('');
  $('geraet').disabled = GERAETE.length < 2;
  $('geraet').onchange = () => { G = GERAETE.find(g => g.id === $('geraet').value); try { localStorage.setItem('res_geraet', G.id); } catch(e){} laden(); };
  await laden();
}
// Reservationen des Monats (eigene Einträge und Zuteilungen über einen Einsatz aus dem Planer)
async function laden(){
  const von = new Date(MONAT), bis = new Date(MONAT.getFullYear(), MONAT.getMonth() + 1, 1);
  const { data, error } = await sb.from('planer_ressource_einsatz').select('id,person_id,einsatz_id,beginn,ende,art,einsatz:einsatz_id(beginn,ende,person_id)').eq('ressource_id', G.id).eq('art', 'zuteilung');
  if(error){ toast('Konnte nicht geladen werden.', true); return; }
  RES = (data || []).map(r => ({ id: r.id, eigen: !r.einsatz_id, pid: r.person_id || r.einsatz?.person_id, s: new Date(r.beginn || r.einsatz?.beginn), e: new Date(r.ende || r.einsatz?.ende) }))
    .filter(r => r.s < bis && r.e > von || (r.eigen && r.pid === ICH?.id && r.e > heute));
  zeichne();
}
// Wer hat welchen Halbtag? → { vm: res|null, nm: res|null }
const belegung = d => ({ vm: RES.find(r => r.s < slot(d, 'vm')[1] && r.e > slot(d, 'vm')[0]) || null, nm: RES.find(r => r.s < slot(d, 'nm')[1] && r.e > slot(d, 'nm')[0]) || null });
const meins = r => r && ICH && r.pid === ICH.id;
const kuerzel = pid => (PERS[pid] && (PERS[pid].kuerzel || PERS[pid].name.split(' ').map(w => w[0]).join(''))) || '?';
function zeichne(){
  $('monat').textContent = `${MON[MONAT.getMonth()]} ${MONAT.getFullYear()}`;
  const tage = new Date(MONAT.getFullYear(), MONAT.getMonth() + 1, 0).getDate(), vorlauf = (MONAT.getDay() + 6) % 7;
  let h = '<span class="tag leer"></span>'.repeat(vorlauf);
  for(let n = 1; n <= tage; n++){
    const d = new Date(MONAT.getFullYear(), MONAT.getMonth(), n), wd = d.getDay(), b = belegung(d);
    const aus = wd === 0 || wd === 6 || d < heute, hf = k => b[k] ? (meins(b[k]) ? 'm' : 'b') : '';
    const kz = [...new Set([b.vm, b.nm].filter(r => r && !meins(r)).map(r => kuerzel(r.pid)))].join('/');
    h += `<button type="button" class="tag${aus ? ' aus' : ''}${+d === +heute ? ' heute' : ''}${meins(b.vm) ? ' mvm' : ''}${meins(b.nm) ? ' mnm' : ''}" data-n="${n}"${aus ? ' disabled' : ''} aria-label="${n}. ${MON[MONAT.getMonth()]}">
      <span class="n">${n}</span><span class="h ${hf('vm')}"></span><span class="h ${hf('nm')}"></span>${kz ? `<span class="k">${esc(kz)}</span>` : ''}</button>`;
  }
  $('tage').innerHTML = h;
  $('tage').querySelectorAll('.tag[data-n]:not([disabled])').forEach(x => x.onclick = () => blatt(new Date(MONAT.getFullYear(), MONAT.getMonth(), +x.dataset.n)));
  // Meine kommenden Reservationen, pro Tag eine Zeile
  const meine = []; RES.filter(r => r.eigen && meins(r) && r.e > heute).forEach(r => { for(let d = new Date(r.s.getFullYear(), r.s.getMonth(), r.s.getDate()); d < r.e; d.setDate(d.getDate() + 1)){
      if(d < heute) continue; const b = belegung(d), t = meins(b.vm) && meins(b.nm) ? 'ganz' : meins(b.vm) ? 'vm' : meins(b.nm) ? 'nm' : null;
      if(t && !meine.some(m => +m.d === +d)) meine.push({ d: new Date(d), t }); } });
  meine.sort((a, b) => a.d - b.d);
  $('meine').innerHTML = meine.map(m => `<div class="r"><span>${WT[m.d.getDay()]} ${m.d.getDate()}.${m.d.getMonth() + 1}. <small>· ${TEIL[m.t]}</small></span><button type="button" class="x" data-weg="${+m.d}" aria-label="Löschen">${KG.icon('x', 13)}</button></div>`).join('')
    || '<span class="hinweis">Noch nichts reserviert.</span>';
  $('meine').querySelectorAll('[data-weg]').forEach(x => x.onclick = () => freigeben(new Date(+x.dataset.weg), 'ganz'));
}
async function telefon(pid){ const { data } = await sb.rpc('planer_person_telefon', { p: pid }); return String(data || '').replace(/[^\d+]/g, '').replace(/^0/, '41').replace(/^\+/, ''); }
function blatt(d){
  const b = belegung(d), wd = WT[d.getDay()], andere = [...new Set([b.vm, b.nm].filter(r => r && !meins(r)).map(r => r.pid))];
  const frei = k => !b[k], ich = k => meins(b[k]);
  let h = `<span class="griff"></span><b class="t">${wd} ${d.getDate()}. ${MON[d.getMonth()]}</b>`;
  andere.forEach(pid => { const t = [b.vm, b.nm].filter(r => r && r.pid === pid).length === 2 ? 'Ganzer Tag' : b.vm && b.vm.pid === pid ? 'Vormittag' : 'Nachmittag';
    h += `<div class="belegt"><span>${t} reserviert von <b>${esc(PERS[pid]?.name || '?')}</b></span><a class="wa" data-wa="${pid}" href="#">WhatsApp</a></div>`; });
  if(ich('vm') || ich('nm')) h += `<div class="belegt"><span>Deine Reservation: ${ich('vm') && ich('nm') ? 'ganzer Tag' : ich('vm') ? 'Vormittag' : 'Nachmittag'}</span>${DARF ? `<button type="button" class="x" data-loe aria-label="Löschen">${KG.icon('x', 13)}</button>` : ''}</div>`;
  if(DARF) h += `<div class="wahl">
    <button type="button" data-t="vm"${frei('vm') ? '' : ' disabled'}>Vormittag<small>bis 12 Uhr</small></button>
    <button type="button" data-t="nm"${frei('nm') ? '' : ' disabled'}>Nachmittag<small>ab 12 Uhr</small></button>
    <button type="button" data-t="ganz"${frei('vm') && frei('nm') ? '' : ' disabled'}>Ganzer Tag<small>&nbsp;</small></button></div>`;
  h += '<button type="button" class="zu" data-zu>Schliessen</button>';
  const bl = document.createElement('div'); bl.className = 'blatt'; bl.innerHTML = `<div class="in">${h}</div>`; document.body.appendChild(bl);
  bl.addEventListener('click', e => { if(e.target === bl || e.target.closest('[data-zu]')) bl.remove(); });
  bl.querySelectorAll('[data-t]').forEach(x => x.onclick = () => { bl.remove(); reservieren(d, x.dataset.t); });
  const l = bl.querySelector('[data-loe]'); if(l) l.onclick = () => { bl.remove(); freigeben(d, 'ganz'); };
  bl.querySelectorAll('[data-wa]').forEach(a => a.onclick = async e => { e.preventDefault(); const nr = await telefon(a.dataset.wa);
    const text = `Hallo ${(PERS[a.dataset.wa]?.name || '').split(' ')[0]}, brauchst du den ${G.name} am ${wd} ${d.getDate()}.${d.getMonth() + 1}. wirklich? Ich bräuchte ihn auch.`;
    if(!nr) toast('Keine Handynummer hinterlegt.', true);
    location.href = `https://wa.me/${nr}?text=${encodeURIComponent(text)}`; });
}
// Reservieren: angrenzende eigene Reservation verlängern, sonst neu anlegen
async function reservieren(d, t){
  const [a, b] = slot(d, t);
  const davor = RES.find(r => r.eigen && meins(r) && +r.e === +a), danach = RES.find(r => r.eigen && meins(r) && +r.s === +b);
  let error;
  if(davor) ({ error } = await sb.from('planer_ressource_einsatz').update({ ende: b.toISOString() }).eq('id', davor.id));
  else if(danach) ({ error } = await sb.from('planer_ressource_einsatz').update({ beginn: a.toISOString() }).eq('id', danach.id));
  else ({ error } = await sb.from('planer_ressource_einsatz').insert({ ressource_id: G.id, person_id: ICH.id, beginn: a.toISOString(), ende: b.toISOString() }));
  if(error) toast(/reserviert von/.test(error.message) ? error.message : 'Reservieren hat nicht geklappt.', true);
  else toast(`Reserviert: ${WT[d.getDay()]} ${d.getDate()}.${d.getMonth() + 1}., ${TEIL[t]}`);
  await laden();
}
// Freigeben: eigenen Teil des Tages herausnehmen (ganz löschen, kürzen oder in zwei Stücke teilen)
async function freigeben(d, t){
  const [a, b] = slot(d, t);
  for(const r of RES.filter(r => r.eigen && meins(r) && r.s < b && r.e > a)){
    let q;
    if(r.s >= a && r.e <= b) q = sb.from('planer_ressource_einsatz').delete().eq('id', r.id);
    else if(r.s < a && r.e > b){ q = sb.from('planer_ressource_einsatz').update({ ende: a.toISOString() }).eq('id', r.id);
      const { error } = await sb.from('planer_ressource_einsatz').insert({ ressource_id: G.id, person_id: ICH.id, beginn: b.toISOString(), ende: r.e.toISOString() }); if(error){ toast('Freigeben hat nicht geklappt.', true); return laden(); } }
    else if(r.s < a) q = sb.from('planer_ressource_einsatz').update({ ende: a.toISOString() }).eq('id', r.id);
    else q = sb.from('planer_ressource_einsatz').update({ beginn: b.toISOString() }).eq('id', r.id);
    const { error } = await q; if(error){ toast('Freigeben hat nicht geklappt.', true); return laden(); }
  }
  toast(`Freigegeben: ${WT[d.getDay()]} ${d.getDate()}.${d.getMonth() + 1}.`); await laden();
}
$('vor').onclick = () => { MONAT = new Date(MONAT.getFullYear(), MONAT.getMonth() - 1, 1); laden(); };
$('nach').onclick = () => { MONAT = new Date(MONAT.getFullYear(), MONAT.getMonth() + 1, 1); laden(); };
// Wischen = Monat wechseln
(() => { let x0 = null, y0 = 0; const k = document.querySelector('.karte');
  k.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  k.addEventListener('touchend', e => { if(x0 === null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) (dx < 0 ? $('nach') : $('vor')).click(); }, { passive: true }); })();
$('loginBtn').onclick = async () => { $('loginStatus').textContent = 'Melde an …';
  const { error } = await KG.anmelden(sb, { email: $('loginEmail').value, password: $('loginPassword').value });
  if(error){ $('loginStatus').textContent = 'Anmelden hat nicht geklappt: ' + error.message; return; } pruefeAnmeldung(); };
pruefeAnmeldung();
</script>
</body>
</html>
