<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=71"></script>
<title>AFM Filterbefüllung – Werkzeuge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#323E4E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kg-werkzeuge.js?v=10"></script>
</head>
<body>
<header class="app"><div class="wrap">
  <a class="backlink" href="index.html">Startseite</a>
  <div class="brand"><h1>Werkzeuge</h1></div>
  <span class="userbar hidden" id="userbar"><span id="userbarText"></span><button id="logoutBtn">Abmelden</button></span>
</div></header>
<main id="appMain"></main>
<script>
// AFM-Füllung pro Apollo-Filter, Säcke à 21 kg, auf 0.5 Säcke aufgerundet (aus dem bisherigen Pool-Rechner)
const AFM = {
  560: { kg: 100, fluss: '6.6–11 m³/h', gross: false },
  630: { kg: 150, fluss: '8.4–16 m³/h', gross: false },
  780: { kg: 240, fluss: '13–22 m³/h', gross: false },
  930: { kg: 400, fluss: '19.2–32 m³/h', gross: true }
};
KGW.werkzeug('pool_afm', inhalt => {
  const $ = id => document.getElementById(id), halb = x => Math.ceil(x * 2) / 2;
  inhalt.insertAdjacentHTML('beforeend', KGW.karte('Apollo Filter (Ø mm)', KGW.seg('filter', Object.keys(AFM).map(d => [d, d]), KGW.lsGet('kgw-afm-seg-filter', '780'))
    + '<span class="kgw-klein" id="info"></span>', 'filterKarte'));
  inhalt.insertAdjacentHTML('beforeend', KGW.karte('Bestellung (Säcke à 21 kg)', `<div id="koerner"></div>
    <div class="kgw-zeile kgw-trenn"><span>Total</span></div><div class="kgw-gross"><b id="total"></b><span>Säcke</span></div>
    <span class="kgw-klein">Auf 0.5 Säcke aufgerundet</span>`));
  const rechne = () => {
    const d = KGW.segWert($('filterKarte'), 'filter'), f = AFM[d], s = f.kg / 21;
    const k = f.gross ? [['Korn 1 (0.4–0.8 mm)', 50, halb(s * 0.5)], ['Korn 2 (0.7–2.0 mm)', 25, halb(s * 0.25)], ['Korn 3', 25, halb(s * 0.25)]]
                      : [['Korn 1 (0.4–0.8 mm)', 50, halb(s * 0.5)], ['Korn 2 (0.7–2.0 mm)', 50, halb(s * 0.5)]];
    $('koerner').innerHTML = k.map(([n, p, z]) => `<div class="kgw-info"><span style="flex:1">${n}, ${p} %</span><b style="width:auto;color:#323E4E">${KGW.fmt(z, 1)} Säcke</b></div>`).join('');
    $('total').textContent = KGW.fmt(k.reduce((a, x) => a + x[2], 0), 1);
    $('info').textContent = `${f.kg} kg AFM · Durchfluss ${f.fluss}`;
  };
  KGW.binden($('filterKarte'), rechne, 'kgw-afm-');
  rechne();
});
</script>
</body>
</html>
