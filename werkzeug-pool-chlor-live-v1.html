<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=54"></script>
<title>Stosschlorung – Werkzeuge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#323E4E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kg-werkzeuge.js?v=9"></script>
</head>
<body>
<header class="app"><div class="wrap">
  <a class="backlink" href="index.html">Startseite</a>
  <div class="brand"><h1>Werkzeuge</h1></div>
  <span class="userbar hidden" id="userbar"><span id="userbarText"></span><button id="logoutBtn">Abmelden</button></span>
</div></header>
<main id="appMain"></main>
<script>
// Stosschlorung: 20 g Chlorifix pro m³ (aus dem bisherigen Pool-Rechner)
KGW.werkzeug('pool_chlor', inhalt => {
  inhalt.insertAdjacentHTML('beforeend', KGW.karte('Dosierung', `<span class="kgw-klein" style="font-size:13px">Chlorifix Granulat</span>
    <div class="kgw-gross"><b id="menge"></b><span id="einheit"></span></div><span class="kgw-klein" id="weg"></span>`));
  inhalt.insertAdjacentHTML('beforeend', KGW.karte('So gehts', `<div>
    <div class="kgw-info"><b>Wann</b><span>Abends dosieren</span></div>
    <div class="kgw-info"><b>Wo</b><span>Bei laufender Filterpumpe direkt ins Wasser</span></div>
    <div class="kgw-info"><b>Danach</b><span>Filter 24 h laufen lassen</span></div></div>`));
  const rechne = vol => {
    const [m, e] = KGW.gewicht(vol * 20);
    document.getElementById('menge').textContent = m; document.getElementById('einheit').textContent = e;
    document.getElementById('weg').textContent = `20 g pro m³ × ${KGW.fmt(vol, 1)} m³`;
  };
  const vol = KGW.poolVolumen(inhalt, rechne);
  inhalt.prepend(document.getElementById('pvKarte'));
  rechne(vol());
});
</script>
</body>
</html>
