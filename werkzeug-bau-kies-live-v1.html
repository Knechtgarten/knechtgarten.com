<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=28"></script>
<title>Kies-Gewicht – Werkzeuge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#323E4E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kg-werkzeuge.js?v=5"></script>
<style>
.wahl{height:48px;border:1px solid #B9C0C8;border-radius:8px;padding:0 10px;font:inherit;font-size:16px;background:#fff;width:100%;color:#232B35;}
</style>
</head>
<body>
<header class="app"><div class="wrap">
  <a class="backlink" href="index.html">Startseite</a>
  <div class="brand"><h1>Werkzeuge</h1></div>
  <span class="userbar hidden" id="userbar"><span id="userbarText"></span><button id="logoutBtn">Abmelden</button></span>
</div></header>
<main id="appMain"></main>
<script>
// Kies-Gewicht: Volumen × Schüttgewicht = Tonnen (und umgekehrt).
// Schüttgewichte (t pro m³, lose) aus der Preisliste des Kieswerks, Sorten die wir brauchen.
const KIES = [
  ['Gewaschen', [
    ['105', 'Sandgemisch', '0/4', 1.51], ['102', 'Rundsand', '0/8', 1.54], ['110', 'Sandkastensand', '0/4', 1.38],
    ['201', 'Rundkies (Gartenkies)', '4/8', 1.56], ['202', 'Rundkies (Gartenkies)', '8/16', 1.60], ['203', 'Rundkies', '16/32', 1.62],
    ['301', 'Betonkies', '0/16', 1.72], ['302', 'Betonkies', '0/32', 1.82], ['208', 'Biotop-Mischung', '8/50', 1.73]]],
  ['Gebrochen', [
    ['511', 'Splitt', '4/8', 1.34], ['512', 'Splitt', '8/11', 1.40], ['503', 'Splitt', '11/16', 1.44], ['504', 'Splitt', '16/22', 1.46],
    ['112', 'Brechsand', '0/4', 1.50]]],
  ['Ungewaschen', [['601', 'Wandkies 1. Kl.', '', 2.00]]]
];
KGW.werkzeug('bau_kies', inhalt => {
  const $ = id => document.getElementById(id), g = (id, alt) => KGW.lsGet('kgw-kies-' + id, alt), f = KGW.fmt;
  const sorten = KIES.flatMap(([gr, l]) => l.map(([nr, n, k, sg]) => ({ nr, n, k, sg, gr })));
  inhalt.insertAdjacentHTML('beforeend', KGW.karte('Material', `<select class="wahl" id="sorte" aria-label="Material">${KIES.map(([gr, l]) =>
    `<optgroup label="${gr}">${l.map(([nr, n, k]) => `<option value="${nr}">${KGW.esc(n)}${k ? ' ' + k + ' mm' : ''}</option>`).join('')}</optgroup>`).join('')}</select>
    <span class="kgw-klein" id="sgText"></span>`));
  inhalt.insertAdjacentHTML('beforeend', KGW.karte('Eingabe', `${KGW.seg('modus', [['m3', 'm³ → t'], ['t', 't → m³'], ['flaeche', 'Fläche × Dicke']], g('seg-modus', 'm3'))}
    <div id="eM3">${KGW.feld('m3', 'Volumen (m³)', g('m3', '5'), 0.5)}</div>
    <div id="eT">${KGW.feld('t', 'Gewicht (t)', g('t', '10'), 1)}</div>
    <div id="eFl" style="display:flex;flex-direction:column;gap:10px">${KGW.feld('fl', 'Fläche (m²)', g('fl', '20'), 1)}${KGW.feld('cm', 'Schichtdicke (cm)', g('cm', '10'), 1)}</div>`, 'eingabeKarte'));
  inhalt.insertAdjacentHTML('beforeend', KGW.karte('Ergebnis', `<span class="kgw-klein" style="font-size:13px" id="eTitel"></span>
    <div class="kgw-gross"><b id="wert"></b><span id="einheit"></span></div>
    <div class="kgw-zeile kgw-trenn"><span id="z2n"></span><b id="z2"></b></div>
    <span class="kgw-klein" id="weg"></span>
    <span class="kgw-hinweis">Schüttgewicht lose, ab Werk. Verdichtet braucht es mehr Material.</span>`));
  $('sorte').value = sorten.some(s => s.nr === g('sorte', '')) ? g('sorte', '') : '301';
  const rechne = () => {
    const s = sorten.find(x => x.nr === $('sorte').value), modus = KGW.segWert($('eingabeKarte'), 'modus');
    $('eM3').classList.toggle('hidden', modus !== 'm3'); $('eT').classList.toggle('hidden', modus !== 't'); $('eFl').classList.toggle('hidden', modus !== 'flaeche');
    $('sgText').textContent = `Schüttgewicht ${f(s.sg, 2)} t pro m³ · Art.-Nr. ${s.nr}`;
    let m3, t;
    if(modus === 't'){ t = KGW.zahl('t'); m3 = t / s.sg; } else { m3 = modus === 'flaeche' ? KGW.zahl('fl') * KGW.zahl('cm') / 100 : KGW.zahl('m3'); t = m3 * s.sg; }
    const zuT = modus !== 't';
    $('eTitel').textContent = zuT ? 'Gewicht' : 'Volumen';
    $('wert').textContent = f(zuT ? t : m3, 2); $('einheit').textContent = zuT ? 't' : 'm³';
    $('z2n').textContent = zuT ? 'Volumen' : 'Gewicht'; $('z2').textContent = zuT ? `${f(m3, 2)} m³` : `${f(t, 2)} t`;
    $('weg').textContent = (modus === 'flaeche' ? `${f(KGW.zahl('fl'), 1)} m² × ${f(KGW.zahl('cm') / 100, 2)} m = ${f(m3, 2)} m³ · ` : '')
      + `${f(m3, 2)} m³ × ${f(s.sg, 2)} t/m³ = ${f(t, 2)} t`;
  };
  $('sorte').addEventListener('change', () => { KGW.lsSet('kgw-kies-sorte', $('sorte').value); rechne(); });
  KGW.binden($('eingabeKarte'), rechne, 'kgw-kies-');
  rechne();
});
</script>
</body>
</html>
