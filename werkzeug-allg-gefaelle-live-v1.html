<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=49"></script>
<title>Gefälle – Werkzeuge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#323E4E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kg-werkzeuge.js?v=9"></script>
</head>
<body>
<header class="app"><div class="wrap">
  <a class="backlink" href="index.html">Startseite</a>
  <div class="brand"><h1>Werkzeuge</h1></div>
  <span class="userbar hidden" id="userbar"><span id="userbarText"></span><button id="logoutBtn">Abmelden</button></span>
</div></header>
<main id="appMain"></main>
<script>
// Gefälle: Prozent = Höhenunterschied ÷ Länge × 100. Zwei Werte eingeben, der dritte wird gerechnet.
KGW.werkzeug('allg_gefaelle', inhalt => {
  const $ = id => document.getElementById(id), g = (id, alt) => KGW.lsGet('kgw-gef-' + id, alt);
  inhalt.insertAdjacentHTML('beforeend', KGW.karte('Was suchst du?', KGW.seg('was', [['p', 'Gefälle %'], ['h', 'Höhe'], ['l', 'Länge']], g('seg-was', 'p'))
    + `<div id="eL">${KGW.feld('l', 'Länge (m)', g('l', '10'), 0.5)}</div>
       <div id="eH">${KGW.feld('h', 'Höhenunterschied (cm)', g('h', '20'), 1)}</div>
       <div id="eP">${KGW.feld('p', 'Gefälle (%)', g('p', '2'), 0.5)}</div>`, 'gefKarte'));
  inhalt.insertAdjacentHTML('beforeend', KGW.karte('Ergebnis', `<span class="kgw-klein" style="font-size:13px" id="was"></span>
    <div class="kgw-gross"><b id="wert"></b><span id="einheit"></span></div><span class="kgw-klein" id="weg"></span>`));
  const rechne = () => {
    const was = KGW.segWert($('gefKarte'), 'was'), L = KGW.zahl('l'), H = KGW.zahl('h'), P = KGW.zahl('p');
    ['L', 'H', 'P'].forEach(x => $('e' + x).classList.toggle('hidden', was === x.toLowerCase()));
    let p = P, wert, einheit, titel;
    if(was === 'p'){ p = L ? H / L : 0; [titel, wert, einheit] = ['Gefälle', KGW.fmt(p, 2), '%']; }
    else if(was === 'h'){ [titel, wert, einheit] = ['Höhenunterschied', KGW.fmt(P * L, 1), 'cm']; }
    else { [titel, wert, einheit] = ['Länge', KGW.fmt(P ? H / P : 0, 2), 'm']; }
    $('was').textContent = titel; $('wert').textContent = wert; $('einheit').textContent = einheit;
    $('weg').textContent = `${KGW.fmt(p, 2)} % = ${KGW.fmt(p * 10, 1)} ‰ = ${KGW.fmt(Math.atan(p / 100) * 180 / Math.PI, 2)}° · 1 % = 1 cm pro m`;
  };
  KGW.binden($('gefKarte'), rechne, 'kgw-gef-');
  rechne();
});
</script>
</body>
</html>
