<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=68"></script>
<title>Werkzeuge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#323E4E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kg-werkzeuge.js?v=10"></script>
</head>
<body>
<header class="app"><div class="wrap">
  <a class="backlink" href="index.html">Startseite</a>
  <div class="brand"><h1>Werkzeuge</h1></div>
  <span class="userbar hidden" id="userbar"><span id="userbarText"></span><button id="logoutBtn">Abmelden</button></span>
</div></header>
<main id="appMain"></main>
<script>
// Werkzeuge: Kacheln wie in Kontakte und Nachschlagewerk (KG.kachel) – zuerst die eigenen Favoriten, dann jede Kategorie
// mit ihren Werkzeugen. Der Stern pro Werkzeug setzt den Favoriten (auch auf der Startseite sichtbar).
function aufbau(main){
  const sichtbar = KGW.LISTE.filter(KGW.darf);
  main.className = ''; main.style.cssText = 'padding:16px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));max-width:1400px;margin:0 auto';
  const zeile = w => `<div class="kg-kzeile kgw-kz">${KGW.sternKnopf(w.k, KGW.favs.has(w.k))}<a class="t" href="${w.seite}.html" style="color:inherit;text-decoration:none"><b>${KGW.esc(w.n)}</b><small>${KGW.esc(w.h)}</small></a></div>`;
  const zeichnen = () => {
    const fav = sichtbar.filter(w => KGW.favs.has(w.k));
    main.innerHTML = KG.kacheln([
      KG.kachel({ titel: 'Meine Favoriten', farbe: KG.palette.gold[0], icon: KGW.svg(KG.pfad('stern'), 17), inhalt: fav.length ? fav.map(zeile).join('') : '<span class="kg-kleer">Noch keine. Beim Werkzeug den Stern antippen, dann erscheint es hier und auf deiner Startseite.</span>' }),
      ...KGW.KATEGORIEN.map(k => { const ws = sichtbar.filter(w => w.kat === k.k); return ws.length
        ? KG.kachel({ titel: `${k.n}<small>${ws.length}</small>`, farbe: k.farbe, icon: KGW.svg(k.d, 17), inhalt: ws.map(zeile).join('') }) : ''; })
    ].join(''));
    KGW.sternBinden(main, zeichnen);
  };
  if(!document.getElementById('kgwKz')){ const s = document.createElement('style'); s.id = 'kgwKz';
    s.textContent = '.kgw-kz{padding-left:0}.kgw-kz .kgw-stern{flex:none;width:30px;height:30px}.kgw-kz .kgw-stern svg{width:17px;height:17px}.kgw-kz a.t:hover b{text-decoration:underline}'; document.head.appendChild(s); }
  zeichnen();
}
KGW._start = aufbau; // zum Prüfen ohne Login
KGW.start(aufbau);
</script>
</body>
</html>
