<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>
<script src="/kg-stil.js?v=63"></script>
<title>Dokument – Doku-Tools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#323E4E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kg-doku.js?v=9"></script>
<style>
/* Mitarbeiter-Dokumente: oben das aktuelle PDF (für alle, auch Handy), darunter für Admins Hochladen (GAV) oder Editor (Reglement) */
.kgd-weg{display:flex;align-items:center;gap:6px;font-size:14px;color:#6B7079;flex-wrap:wrap;min-width:0;}
.kgd-weg a{color:#A63A52;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:2px;}
.kgd-weg b{color:#323E4E;font-size:15px;}
.kgd-zurueck svg{transform:rotate(90deg);}
.dd{max-width:1180px;margin:0 auto;padding:16px max(12px,env(safe-area-inset-left,0px)) 48px;display:flex;flex-direction:column;gap:14px;}
.dd-karte{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(35,43,53,.08),0 0 0 1px rgba(35,43,53,.04);padding:16px;display:flex;flex-direction:column;gap:10px;}
.dd-karte h2{margin:0;font-size:17px;color:#323E4E;}
.dd-aktuell{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.dd-aktuell .bl{width:44px;height:54px;border:1px solid #D5DBE1;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#5C3F94;background:#F5F7F9;flex:none;}
.dd-aktuell .txt{flex:1;min-width:180px;display:flex;flex-direction:column;gap:2px;}
.dd-aktuell .txt b{font-size:16px;color:#323E4E;} .dd-aktuell .txt span{font-size:13px;color:#6B7079;}
.dd-aktuell .knoepfe{display:flex;gap:8px;flex-wrap:wrap;}
.dd-aktuell .kgd-btn{height:40px;}
.dd-versionen{display:flex;flex-direction:column;}
.dd-v{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid #EEF1F4;font-size:13.5px;}
.dd-v:first-child{border-top:0;} .dd-v span{flex:1;} .dd-v small{color:#8B9097;}
.dd-upload{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
/* Editor: links Inhaltsverzeichnis, rechts das Dokument */
.dd-editor{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start;}
.dd-inhalt{position:sticky;top:12px;background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(35,43,53,.08),0 0 0 1px rgba(35,43,53,.04);padding:10px 6px;max-height:calc(100vh - 140px);overflow:auto;}
.dd-inhalt .ueber{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#8B9097;font-weight:600;padding:4px 8px 6px;}
.dd-th{display:flex;align-items:center;gap:4px;padding:5px 6px;border-radius:6px;font-size:13px;color:#323E4E;cursor:pointer;}
.dd-th:hover{background:#F5F7F9;} .dd-th span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dd-th .griff{color:#A3B0BE;cursor:grab;display:inline-flex;flex:none;}
.dd-th.zieht{opacity:.4;} .dd-th.ziel{box-shadow:inset 0 2px 0 #323E4E;}
.dd-rechts{display:flex;flex-direction:column;gap:10px;min-width:0;}
.dd-blatt{background:#fff;border-radius:4px;box-shadow:0 2px 14px rgba(20,28,38,.12);padding:40px 56px 56px;font-family:"Jost","Futura","Century Gothic",-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.55;color:#232B35;--b:14px;}
.dd-blatt .kgd-ed{outline:1px dashed rgba(139,144,151,.8);outline-offset:10px;min-height:300px;}
.dd-blatt .kgd-ed:focus{outline:2px solid #A63A52;}
.dd-blatt .kgd-ed h2{margin:1.4em 0 .5em;font-size:1.2em;}
.dd-blatt .kgd-ed h2:first-child{margin-top:0;}
.dd-blatt .kgd-ed p{margin:0 0 .7em;}
.dd-kopf{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:28px;}
.dd-kopf h1{margin:0;font-size:22px;color:#323E4E;} .dd-kopf small{color:#6B7079;font-size:13px;}
.dd-kopf img{width:150px;}
.dd-status{font-size:12.5px;color:#6B7079;}
/* PDF-Seiten (versteckt, nur zum Erzeugen) */
.dd-seite{width:794px;height:1123px;background:#fff;position:relative;box-sizing:border-box;padding:64px 88px 90px;font-family:"Jost","Futura","Century Gothic",sans-serif;font-size:12.5px;line-height:1.5;color:#232B35;overflow:hidden;--b:12.5px;}
.dd-seite h2{font-size:14.5px;font-weight:600;color:#323E4E;margin:14px 0 4px;}
.dd-seite p{margin:0 0 7px;} .dd-seite ul,.dd-seite ol{margin:0 0 7px;padding-left:18px;} .dd-seite li{margin:1px 0;}
.dd-seite .titel{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px;}
.dd-seite .titel h1{margin:0;font-size:22px;color:#323E4E;font-weight:600;} .dd-seite .titel small{font-size:12.5px;color:#6B7079;}
.dd-seite .titel img{width:150px;}
.dd-seite .fuss{position:absolute;left:88px;right:88px;bottom:38px;border-top:2px solid #D1DB5F;padding-top:7px;display:flex;justify-content:space-between;font-size:10.5px;color:#8B9097;}
@media (max-width:860px){ .dd-editor{grid-template-columns:1fr;} .dd-inhalt{position:static;max-height:240px;} .dd-blatt{padding:24px 18px;} }
</style>
</head>
<body>
<header class="app"><div class="wrap">
  <a class="backlink" href="index.html">Startseite</a>
  <div class="brand"><h1>Doku-Tools</h1></div>
  <span class="userbar hidden" id="userbar"><span id="userbarText"></span><button id="logoutBtn">Abmelden</button></span>
</div></header>
<nav class="subnav"><div class="wrap">
  <a href="doku-live-v1.html" class="on">Dokumente</a>
</div></nav>
<span class="kgd-weg" data-kg-seite="links"><a class="kgd-zurueck" href="doku-live-v1.html" id="ordnerLink"></a><span>/</span><b id="docTitel"></b></span>
<main id="appMain"></main>
<script>
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
const BUCKET = 'doku-dateien';
async function aufbau(main){
  const { esc, ic } = KGD, sb = KGD.sb;
  $('ordnerLink').innerHTML = KG.icon('chev', 14);
  const { data: V, error } = await sb.from('doku_vorlage').select('*, ordner:doku_ordner(name)').eq('id', P.get('v')).maybeSingle();
  if(error || !V || V.art === 'brief'){ main.innerHTML = '<div class="dd"><p class="kgd-hinweis">Dokument nicht gefunden.</p></div>'; return; }
  document.title = V.name + ' – Doku-Tools';
  $('docTitel').textContent = V.name; $('ordnerLink').insertAdjacentText('beforeend', V.ordner ? V.ordner.name : 'Dokumente');
  const admin = KGD.darfVorlagen;
  let versionen = [];
  const dateiname = () => `${V.name} ${KGD.datumKurz(V.stand || '')}`.replace(/[\\/:*?"<>|]/g, '').trim() + '.pdf';
  const oeffnen = async (pfad, laden) => {
    const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(pfad, 3600, laden ? { download: dateiname() } : undefined);
    if(error){ KGD.toast('PDF konnte nicht geöffnet werden: ' + error.message, true); return; }
    if(laden) location.href = data.signedUrl; else window.open(data.signedUrl, '_blank', 'noopener');
  };

  main.innerHTML = `<div class="dd">
    <section class="dd-karte"><div class="dd-aktuell"><span class="bl">${ic('dokument', 22)}</span>
      <div class="txt"><b>${esc(V.name)}</b><span id="standTxt"></span></div>
      <div class="knoepfe" id="knoepfe"></div></div></section>
    <div id="adminTeil"></div></div>`;
  function aktuell(){
    $('standTxt').textContent = V.datei_pfad ? 'Stand ' + KGD.datumKurz(V.stand) : 'Noch kein PDF vorhanden.';
    $('knoepfe').innerHTML = V.datei_pfad ? `<button type="button" class="kgd-btn prim" id="oeffnenBtn">${ic('eye')}Öffnen</button><button type="button" class="kgd-btn ghost" id="ladenBtn">${ic('herunterladen')}Herunterladen</button>` : '';
    if(V.datei_pfad){ $('oeffnenBtn').onclick = () => oeffnen(V.datei_pfad); $('ladenBtn').onclick = () => oeffnen(V.datei_pfad, true); }
  }
  aktuell();
  if(!admin) return;

  // Versionen (nur Admin)
  const ladeVersionen = async () => {
    const { data } = await sb.from('doku_version').select('id,stand,datei_pfad,erstellt_am').eq('vorlage_id', V.id).order('erstellt_am', { ascending: false });
    versionen = data || [];
    const el = $('versionen'); if(!el) return;
    el.innerHTML = versionen.length ? versionen.map((v, i) => `<div class="dd-v"><span>Stand ${esc(KGD.datumKurz(v.stand))}${i === 0 ? ' <small>aktuell</small>' : ''}</span><small>veröffentlicht ${esc(KGD.datumKurz(v.erstellt_am))}</small>
        <button type="button" class="kg-ibtn" data-v="${esc(v.datei_pfad)}" title="Öffnen" aria-label="Öffnen">${ic('eye')}</button></div>`).join('')
      : '<span class="kgd-hinweis">Noch keine Version.</span>';
    el.querySelectorAll('[data-v]').forEach(b => b.onclick = () => oeffnen(b.dataset.v));
  };
  // neue Version speichern: PDF hochladen, Version vermerken, Vorlage auf neuen Stand
  async function veroeffentlichen(blob, stand, inhalt){
    const pfad = `${V.schluessel}/${stand}-${Date.now()}.pdf`;
    const up = await sb.storage.from(BUCKET).upload(pfad, blob, { contentType: 'application/pdf', upsert: false });
    if(up.error){ KGD.toast('Hochladen fehlgeschlagen: ' + up.error.message, true); return false; }
    const v = await sb.from('doku_version').insert({ vorlage_id: V.id, stand, datei_pfad: pfad, inhalt: inhalt || null });
    if(v.error){ KGD.toast('Version nicht gespeichert: ' + v.error.message, true); return false; }
    const u = await sb.from('doku_vorlage').update({ datei_pfad: pfad, stand, geaendert_am: new Date().toISOString(), geaendert_von: KGD.ich }).eq('id', V.id);
    if(u.error){ KGD.toast('Stand nicht gespeichert: ' + u.error.message, true); return false; }
    V.datei_pfad = pfad; V.stand = stand; aktuell(); await ladeVersionen();
    return true;
  }
  const heuteIso = () => new Date().toISOString().slice(0, 10);

  if(V.art === 'pdf'){
    $('adminTeil').innerHTML = `<section class="dd-karte"><h2>Neue Datei hochladen</h2>
        <div class="dd-upload"><div class="kgd-feld"><label for="datei">PDF</label><input type="file" id="datei" accept="application/pdf"></div>
          <div class="kgd-feld"><label for="stand">Stand</label><input class="kgd-t" type="date" id="stand" value="${heuteIso()}" style="width:170px"></div>
          <button type="button" class="kgd-btn prim" id="hochBtn">${ic('upload')}Hochladen</button></div>
        <span class="kgd-hinweis">Die bisherige Datei bleibt unter «Versionen» erhalten.</span></section>
      <section class="dd-karte"><h2>Versionen</h2><div class="dd-versionen" id="versionen"></div></section>`;
    $('hochBtn').onclick = async () => {
      const f = $('datei').files[0], stand = $('stand').value;
      if(!f){ KGD.toast('Bitte zuerst eine PDF-Datei wählen.', true); return; }
      if(!stand){ KGD.toast('Bitte den Stand angeben.', true); return; }
      $('hochBtn').disabled = true;
      if(await veroeffentlichen(f, stand)){ KGD.toast('Hochgeladen'); $('datei').value = ''; }
      $('hochBtn').disabled = false;
    };
    ladeVersionen();
    return;
  }

  // Art «abschnitte»: ein Dokument wie in Word, jeder Titel = ein Thema (Abschnitt)
  const { data: ab } = await sb.from('doku_abschnitt').select('id,titel,html,sortierung').eq('vorlage_id', V.id).order('sortierung');
  const zuHtml = L => (L || []).map(a => `<h2>${esc(a.titel)}</h2>${KGD.sauber(a.html)}`).join('') || '<h2>Erstes Thema</h2><p>Text …</p>';
  $('adminTeil').innerHTML = `<div class="dd-editor"><nav class="dd-inhalt" id="inhalt" aria-label="Inhalt"></nav>
      <div class="dd-rechts"><div id="leisteSlot"></div>
        <div class="dd-karte" style="flex-direction:row;align-items:center;flex-wrap:wrap"><span class="dd-status" id="status" style="flex:1">Neue Themen: Zeile schreiben und oben «Titel» wählen.</span>
          <button type="button" class="kgd-btn ghost" id="speichernBtn">Entwurf speichern</button><button type="button" class="kgd-btn prim" id="pubBtn">Neue Version veröffentlichen</button></div>
        <div class="dd-blatt"><div class="dd-kopf"><div><h1>${esc(V.name)}</h1><small id="kopfStand"></small></div><img src="/logo-gruen-blau.png" alt="Knechtgarten"></div>
          <div class="kgd-ed" id="ed" contenteditable="true" spellcheck="true">${zuHtml(ab)}</div></div>
        <section class="dd-karte"><h2>Versionen</h2><div class="dd-versionen" id="versionen"></div></section></div></div>`;
  $('kopfStand').textContent = V.stand ? 'Version ' + KGD.datumKurz(V.stand) : 'noch nicht veröffentlicht';
  $('leisteSlot').innerHTML = KGD.leisteHtml().replace('Felder: ziehen zum Verschieben, anklicken zum Formatieren', 'Themen verschieben: links im Inhalt ziehen');
  const ed = $('ed'); KGD.editor(ed, $('kgdLeiste'));
  document.execCommand('defaultParagraphSeparator', false, 'p'); // Enter = neuer Absatz <p>, nicht <div>
  let geaendert = false;
  ed.addEventListener('input', () => { geaendert = true; $('status').textContent = 'Ungespeicherte Änderungen'; inhalt(); });

  // Abschnitte aus dem Editor: alles ab einem <h2> bis zum nächsten
  const abschnitte = () => {
    const L = []; let akt = null;
    [...ed.childNodes].forEach(n => {
      if(n.nodeType === 1 && n.tagName === 'H2'){ akt = { titel: n.textContent.trim(), teile: [] }; L.push(akt); return; }
      if(n.nodeType === 3 && !n.textContent.trim()) return;
      if(!akt){ akt = { titel: '', teile: [] }; L.push(akt); }
      akt.teile.push(n.nodeType === 1 ? n.outerHTML : `<p>${esc(n.textContent)}</p>`);
    });
    return L.map((a, i) => ({ titel: a.titel, html: KGD.sauber(a.teile.join('')), sortierung: i + 1 }));
  };
  // Inhaltsverzeichnis: Klick = hinspringen, Ziehen = ganzes Thema verschieben
  let gezogen = null;
  function inhalt(){
    const T = [...ed.querySelectorAll(':scope > h2')];
    $('inhalt').innerHTML = '<div class="ueber">Inhalt</div>' + T.map((h, i) => `<div class="dd-th" draggable="true" data-i="${i}"><span class="griff">${ic('griff', 14)}</span><span>${esc(h.textContent.trim() || '(ohne Titel)')}</span></div>`).join('');
    $('inhalt').querySelectorAll('.dd-th').forEach(el => {
      el.addEventListener('click', () => T[+el.dataset.i].scrollIntoView({ behavior: 'smooth', block: 'center' }));
      el.addEventListener('dragstart', e => { gezogen = +el.dataset.i; el.classList.add('zieht'); e.dataTransfer.setData('text/plain', ''); });
      el.addEventListener('dragend', () => { el.classList.remove('zieht'); gezogen = null; });
      el.addEventListener('dragover', e => { if(gezogen !== null){ e.preventDefault(); el.classList.add('ziel'); } });
      el.addEventListener('dragleave', () => el.classList.remove('ziel'));
      el.addEventListener('drop', e => {
        e.preventDefault(); const ziel = +el.dataset.i; if(gezogen === null || gezogen === ziel) return;
        const H = [...ed.querySelectorAll(':scope > h2')], block = i => { const n = []; let x = H[i]; do { n.push(x); x = x.nextSibling; } while(x && !(x.nodeType === 1 && x.tagName === 'H2')); return n; };
        const teile = block(gezogen), vor = H[ziel];
        teile.forEach(n => ed.insertBefore(n, vor));
        geaendert = true; $('status').textContent = 'Ungespeicherte Änderungen'; inhalt();
      });
    });
  }
  inhalt();

  async function speichern(){
    const L = abschnitte();
    const d = await sb.from('doku_abschnitt').delete().eq('vorlage_id', V.id);
    if(d.error){ KGD.toast('Speichern fehlgeschlagen: ' + d.error.message, true); return null; }
    const i = await sb.from('doku_abschnitt').insert(L.map(a => ({ ...a, vorlage_id: V.id })));
    if(i.error){ KGD.toast('Speichern fehlgeschlagen: ' + i.error.message, true); return null; }
    geaendert = false; $('status').textContent = 'Entwurf gespeichert ' + new Date().toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
    return L;
  }
  $('speichernBtn').onclick = speichern;
  $('pubBtn').onclick = async () => {
    if(!confirm('Neue Version veröffentlichen? Alle Mitarbeitenden sehen danach das neue PDF.')) return;
    const b = $('pubBtn'); b.disabled = true; $('status').textContent = 'PDF wird erstellt …';
    try {
      const L = await speichern(); if(!L) return;
      const stand = heuteIso();
      const blob = await pdfAusAbschnitten(L, stand);
      if(await veroeffentlichen(blob, stand, L)){ $('kopfStand').textContent = 'Version ' + KGD.datumKurz(stand); $('status').textContent = 'Veröffentlicht: Version ' + KGD.datumKurz(stand); KGD.toast('Neue Version veröffentlicht'); }
    } catch(e){ KGD.toast(e.message || String(e), true); }
    finally { b.disabled = false; }
  };
  window.addEventListener('beforeunload', e => { if(geaendert){ e.preventDefault(); e.returnValue = ''; } });
  ladeVersionen();

  // Mehrseitiges PDF: Blöcke (Titel, Absätze, Listenpunkte) auf A4-Seiten verteilen, nie mitten in einer Zeile trennen
  async function pdfAusAbschnitten(L, stand){
    const laden = src => new Promise((ok, f) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => f(new Error('PDF-Baustein konnte nicht geladen werden.')); document.head.appendChild(s); });
    if(!window.html2canvas) await laden('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf) await laden('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const halter = document.createElement('div'); halter.style.cssText = 'position:fixed;left:-10000px;top:0;'; document.body.appendChild(halter);
    try {
      const bloecke = [];
      L.forEach(a => {
        if(a.titel) bloecke.push({ html: `<h2>${esc(a.titel)}</h2>`, titel: true });
        const t = document.createElement('div'); t.innerHTML = a.html;
        [...t.children].forEach(c => {
          if(c.tagName === 'UL' || c.tagName === 'OL') [...c.children].forEach(li => bloecke.push({ html: `<${c.tagName.toLowerCase()}>${li.outerHTML}</${c.tagName.toLowerCase()}>` }));
          else bloecke.push({ html: c.outerHTML });
        });
      });
      const kopf = `<div class="titel"><div><h1>${esc(V.name)}</h1><small>Version ${esc(KGD.datumKurz(stand))}</small></div><img src="/logo-gruen-blau.png" alt=""></div>`;
      const seiten = []; let seite = null, inhalt = null;
      const neu = erste => { seite = document.createElement('div'); seite.className = 'dd-seite'; seite.innerHTML = (erste ? kopf : '') + '<div class="inh"></div>'; halter.appendChild(seite); inhalt = seite.querySelector('.inh'); seiten.push(seite); };
      const max = 1123 - 90; // unterer Rand vor der Fusszeile
      neu(true);
      if(document.fonts && document.fonts.ready) await document.fonts.ready;
      const bild = seite.querySelector('img'); if(bild && !bild.complete) await new Promise(ok => { bild.onload = bild.onerror = ok; });
      for(let i = 0; i < bloecke.length; i++){
        const w = document.createElement('div'); w.innerHTML = bloecke[i].html; inhalt.appendChild(w);
        const unten = () => w.getBoundingClientRect().bottom - seite.getBoundingClientRect().top;
        // Titel nie allein unten: braucht Platz für mindestens den nächsten Block
        let zuViel = unten() > max;
        if(!zuViel && bloecke[i].titel && bloecke[i + 1]){ const n = document.createElement('div'); n.innerHTML = bloecke[i + 1].html; inhalt.appendChild(n); zuViel = n.getBoundingClientRect().bottom - seite.getBoundingClientRect().top > max; n.remove(); }
        if(zuViel && inhalt.children.length > 1){ w.remove(); neu(false); inhalt.appendChild(w); }
      }
      seiten.forEach((s, i) => s.insertAdjacentHTML('beforeend', `<div class="fuss"><span>Knecht AG Naturnahe Gärten · ${esc(V.name)} · Version ${esc(KGD.datumKurz(stand))}</span><span>Seite ${i + 1} von ${seiten.length}</span></div>`));
      const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
      for(let i = 0; i < seiten.length; i++){
        const c = await window.html2canvas(seiten[i], { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false });
        if(i) doc.addPage();
        doc.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297);
      }
      return doc.output('blob');
    } finally { halter.remove(); }
  }
}
KGD.start(aufbau);
</script>
</body>
</html>
