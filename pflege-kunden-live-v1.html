<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Tool (live) – Pflege &amp; Service Kunden</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg:#F5F7F9; --card:#FFFFFF; --primary:#323E4E; --primary-l:#4C5C70;
  --ink:#232B35; --muted:#8B9097; --line:#E1E5E9; --soft:#EEF3F7; --reg:#E6ECF2;
  --accent-blue:#D6E7F4; --accent-lime:#D1DB5F; --accent-lime-light:#F4F6D8; --danger:#B4655F;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--ink);line-height:1.45;font-size:13px;}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px;}
.hidden{display:none !important;}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;}

header.app{background:var(--primary);color:#fff;}
header.app .backlink{display:inline-flex;align-items:center;gap:5px;color:var(--primary);text-decoration:none;font-size:12px;font-weight:700;flex-shrink:0;background:var(--accent-lime);border-radius:20px;padding:6px 12px;}
header.app .backlink:hover{background:#c3cd52;}
header.app .wrap{display:flex;align-items:center;gap:20px;padding:0 16px;}
header.app .brand{padding:11px 0;}
header.app .brand h1{font-size:15px;font-weight:600;color:#fff;}
header.app .brand .sub{font-size:11px;opacity:.75;margin-top:1px;}
header.app .userbar{display:flex;align-items:center;gap:10px;margin-left:auto;}
header.app .userbar span{opacity:.85;font-size:11.5px;}
header.app .userbar button{font-size:11.5px;color:#c7ccd1;background:none;border:1px solid rgba(255,255,255,.3);
  border-radius:5px;padding:3px 9px;cursor:pointer;}
header.app .userbar button:hover{background:rgba(255,255,255,.1);color:#fff;}
nav.subnav{background:#fff;border-bottom:1px solid var(--line);}
nav.subnav .wrap{display:flex;gap:2px;}
nav.subnav a{display:flex;align-items:center;gap:7px;padding:12px 12px 10px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;text-decoration:none;font-size:12.5px;}
nav.subnav a:hover{color:var(--primary);}
nav.subnav a.on{color:var(--primary);border-bottom-color:var(--primary);}
nav.subnav a .i{width:16px;height:16px;}

main.wrap{padding-top:22px;padding-bottom:60px;}
h1.page{font-size:19px;color:var(--primary);}
h3{font-size:14px;color:var(--primary);}
.muted{color:var(--muted);} .small{font-size:11.5px;}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px;}

.card{background:var(--card);border:1px solid var(--line);border-radius:11px;}
.panel{padding:16px 18px;display:flex;flex-direction:column;gap:12px;}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;}
input[type=text],input[type=number],select,textarea{font:inherit;font-size:12.5px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 8px;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);}
textarea{resize:vertical;line-height:1.45;}

.btn{border:none;border-radius:7px;padding:7px 14px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn .i{width:16px;height:16px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-l);}
.btn-ghost{background:#fff;color:var(--primary);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--primary);}
.icon-btn,.rbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;flex:none;border-radius:50%;
  border:1px solid var(--primary);background:#fff;color:var(--primary);box-sizing:border-box;}
.icon-btn .i,.rbtn .i{width:14px;height:14px;}
.icon-btn:hover{color:var(--danger);border-color:var(--danger);}
.rbtn:hover{background:var(--primary);color:#fff;}
.addrow{all:unset;cursor:pointer;color:var(--primary);font-size:12.5px;font-weight:700;display:inline-flex;gap:6px;align-items:center;padding:6px 0;}
.addrow .i{width:16px;height:16px;}
.addrow:hover{text-decoration:underline;}
.addrow.danger{color:var(--danger);font-weight:400;}
.addlinks{display:flex;gap:24px;flex-wrap:wrap;align-items:center;}
.hint{font-size:12px;color:var(--muted);background:var(--soft);border-radius:6px;padding:9px 11px;}
.ask{background:var(--soft);border-left:3px solid var(--accent-lime);border-radius:6px;padding:10px 12px;font-size:12.5px;display:flex;flex-direction:column;gap:8px;}
.ask .row{display:flex;gap:8px;flex-wrap:wrap;}
.kdot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;border:1px solid rgba(50,62,78,.25);}

/* Filter */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.search{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:0 10px;color:var(--muted);}
.search input[type=text]{border:0;outline:none;background:transparent;padding:7px 0;width:200px;max-width:100%;}
.abof{display:inline-flex;align-items:center;gap:4px;padding-right:8px;}
.abof .muted{margin-right:4px;}
.abob{all:unset;cursor:pointer;border-radius:50%;padding:2px;display:inline-flex;border:2px solid transparent;}
.abob[aria-pressed="true"]{border-color:var(--primary);}
.abob.off{opacity:.3;}
.abob:hover{opacity:1;}
.aboi{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;}
.aboi .i{width:14px;height:14px;}
.aboi.a1{background:#323E4E;color:#fff;}
.aboi.a2{background:#D6E7F4;color:#323E4E;}
.aboi.a3{border:1px solid #8B9097;color:#8B9097;}
.tip{position:relative;}
.tip:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#323E4E;color:#fff;font-size:11.5px;font-weight:500;padding:4px 8px;border-radius:5px;z-index:40;pointer-events:none;}

/* Mehrfachauswahl */
.ms{position:relative;}
.ms summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:5px 8px 5px 10px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;background:#fff;}
.ms summary::-webkit-details-marker{display:none;}
.ms summary .i{width:15px;height:15px;}
.ms-panel{position:absolute;top:calc(100% + 4px);left:0;z-index:30;min-width:200px;background:#fff;border:1px solid var(--line);border-radius:7px;box-shadow:0 6px 20px rgba(30,37,48,.14);padding:6px;display:flex;flex-direction:column;}
.ms-panel label{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:5px;cursor:pointer;font-size:12.5px;}
.ms-panel label:hover{background:var(--soft);}
.ms-panel input{accent-color:var(--primary);width:15px;height:15px;}
.ms-panel .ms-none{all:unset;cursor:pointer;padding:7px 8px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:4px;}
.msf summary{padding:7px 10px;max-width:260px;}
.msf-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* Kundenliste */
.tbl-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:11px;}
table{border-collapse:collapse;width:100%;}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:6px 12px;border-bottom:1px solid var(--soft);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
.kunden tbody tr{cursor:pointer;}
.kunden tbody tr:hover td{background:var(--soft);}
.kunden td{white-space:nowrap;}
.kunden td:last-child{white-space:normal;min-width:220px;}
.kunden .name{font-weight:700;color:var(--primary);}
.kchips{display:flex;flex-wrap:wrap;gap:1px 8px;line-height:1.25;}
.kc{display:inline-flex;align-items:center;gap:4px;font-size:11px;white-space:nowrap;}
.kc .kdot{width:7px;height:7px;}
.count{font-size:11.5px;color:var(--muted);margin-top:8px;}

/* Kunden-Detail */
.back{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;}
.back:hover{color:var(--primary);}
.k-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:18px 20px;margin-top:10px;}
.kh-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.kh-top h1{font-size:22px;color:var(--primary);}
.kh-abo{padding:0;gap:2px;}
.kh-abo .abob{border-color:transparent !important;}
.kh-abo .abob:not([aria-pressed="true"]){opacity:.3;}
.kh-abo .abob:hover{opacity:1;}
.meta{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:12.5px;}
.meta div{display:flex;gap:8px;align-items:center;}
.meta .i{color:var(--muted);width:16px;height:16px;}
.meta a{color:inherit;text-decoration:none;}
.meta a:hover{text-decoration:underline;}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;}
.field > label{font-size:11px;color:var(--muted);}
.kh-notiz textarea{min-height:90px;flex:1;}
.kh-notiz{align-self:stretch;}

.reg-wrap{margin-top:20px;}
.reg-tabs{display:flex;gap:4px;flex-wrap:wrap;padding-left:12px;align-items:flex-end;}
.reg-tabs button{all:unset;cursor:pointer;display:flex;gap:6px;align-items:center;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;padding:9px 16px;color:var(--muted);font-weight:600;font-size:12.5px;}
.reg-tabs button:hover{background:var(--soft);color:var(--primary);}
.reg-tabs button[aria-selected="true"]{background:var(--reg);border-color:var(--line);color:var(--ink);box-shadow:inset 0 4px 0 var(--kc);position:relative;top:1px;}
.reg-tabs select{border:0;background:transparent;color:var(--muted);padding:9px 12px;cursor:pointer;font-weight:600;}
.reg{background:var(--reg);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:inset 0 3px 0 var(--kc, var(--line));display:flex;flex-direction:column;gap:16px;}
.kbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;}
.col{display:flex;flex-direction:column;gap:16px;min-width:0;}
.kbody > .col > .card:last-child{flex:1;}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.fgrid > .full{grid-column:1/-1;}
.unit{display:flex;}
.unit input{flex:1;min-width:0;border-top-right-radius:0;border-bottom-right-radius:0;}
.unit span{border:1px solid var(--line);border-left:0;padding:6px 9px;background:var(--soft);color:var(--muted);border-radius:0 6px 6px 0;font-size:12px;white-space:nowrap;}
.yn{display:flex;}
.yn button{all:unset;cursor:pointer;padding:6px 14px;border:1px solid var(--line);font-size:12.5px;background:#fff;}
.yn button:first-child{border-radius:6px 0 0 6px;}
.yn button:last-child{border-radius:0 6px 6px 0;border-left:0;}
.yn button[aria-pressed="true"]{background:var(--primary);color:#fff;border-color:var(--primary);}

.zust{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.zchip{display:inline-flex;align-items:center;gap:5px;padding:3px 4px 3px 8px;border-radius:6px;background:var(--accent-blue);color:var(--primary);font-size:12.5px;}
.zchip .i{width:15px;height:15px;}
.zchip button{all:unset;cursor:pointer;display:inline-flex;padding:2px;border-radius:3px;opacity:.7;}
.zchip button:hover{opacity:1;background:#fff;}

.wt{width:100%;border-collapse:collapse;}
.wt th{padding:6px 8px;}
.wt td{padding:6px 8px;border-bottom:1px solid var(--soft);}
.wt .c{text-align:center;}
.wt .w-i{width:44px;} .wt .w-art{width:120px;} .wt .w-kw{width:70px;} .wt .w-std{width:70px;} .wt .w-x{width:36px;}
.wt td input[type=number]{width:56px;padding:4px 6px;text-align:center;}
.wt .ask-row td{padding:0 0 8px;}
.wt-n{font-size:13px;}
.wt-art{font-size:12px;}
.wt-std{font-size:12px;color:var(--muted);white-space:nowrap;}
.kwin.ov{border-color:var(--primary);font-weight:700;}
.tin{width:calc(100% + 7px);margin-left:-7px;border-color:transparent !important;background:transparent !important;padding:3px 6px !important;font-size:13px !important;}
.tin:hover{border-color:var(--line) !important;}
.tin:focus{border-color:var(--primary) !important;background:#fff !important;}
.sp-panel{width:320px;max-width:calc(100vw - 48px);gap:2px;}
.sp-panel .search{margin:2px 2px 6px;}
.sp-panel .search input{width:100%;}
.sp-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:6px 8px 2px;}
.sp-item{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:8px;border-radius:5px;font-size:12.5px;}
.sp-item:hover{background:var(--soft);}
.spick summary{border:0;padding:6px 0;background:transparent;font-size:12.5px;}

.tabf-w{overflow-x:auto;border:1px solid var(--line);border-radius:7px;}
.tabf-t{width:100%;border-collapse:collapse;font-size:12.5px;}
.tabf-t th{padding:6px;background:var(--soft);}
.tabf-t td{padding:3px 4px;border-bottom:1px solid var(--soft);}
.tabf-t td input,.tabf-t td select{padding:3px 5px;width:100%;min-width:0;}
.tabf-t td input.zeit{width:62px;text-align:center;font-variant-numeric:tabular-nums;}
.tz{display:flex;align-items:center;gap:3px;white-space:nowrap;}
.tz small{color:var(--muted);font-size:10.5px;margin-left:3px;min-width:44px;}
.tu{display:flex;align-items:center;gap:3px;}
.tu input{width:64px !important;}
.tu span{font-size:11px;color:var(--muted);}

.allg-h{display:flex;align-items:baseline;gap:10px;margin:28px 2px 10px;padding-top:14px;border-top:1px solid var(--line);}
.allg-h span{font-weight:700;font-size:15px;color:var(--primary);}
.allg-h small{font-size:11.5px;color:var(--muted);}

.yrs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;}
.yb{all:unset;cursor:pointer;text-align:center;padding:6px 0;border-radius:6px;font-size:12.5px;font-variant-numeric:tabular-nums;border:1px solid var(--line);background:#fff;color:var(--muted);}
.yb[aria-pressed="true"]{background:#323E4E;border-color:#323E4E;color:#fff;}
.dlist{padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:13px;}

.ovl{position:fixed;inset:0;background:rgba(35,43,53,.45);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:60px 16px 16px;}
.ovl.show{display:flex;}
.ovlbox{background:#fff;border-radius:12px;max-width:540px;width:100%;padding:20px 22px;box-shadow:0 12px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:12px;}
.ovlbox h3{font-size:15px;}
.ovlbtns{display:flex;justify-content:flex-end;gap:8px;}
.ovl-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.eb-list{display:flex;flex-direction:column;max-height:50vh;overflow:auto;}
.eb-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--soft);}
.eb-row:last-child{border-bottom:0;}

.toastwrap{position:fixed;bottom:16px;right:16px;z-index:70;display:flex;flex-direction:column;gap:6px;}
.toast{background:var(--primary);color:#fff;font-size:12.5px;padding:9px 14px;border-radius:7px;box-shadow:0 6px 20px rgba(0,0,0,.2);}
.toast.err{background:var(--danger);}
.loginwrap{min-height:80vh;display:flex;align-items:center;justify-content:center;}
.logincard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:28px 26px;width:100%;max-width:320px;}
.logincard h2{font-size:16px;color:var(--primary);margin-bottom:14px;}
.logincard .fld{margin-bottom:10px;}
.logincard label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;}
.logincard input{width:100%;font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;}
.status{font-size:11.5px;color:var(--muted);margin-top:6px;}
.status.err{color:var(--danger);}
.pendingcard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:28px 26px;width:100%;max-width:360px;text-align:center;}
.pendingcard h2{font-size:16px;color:var(--primary);margin-bottom:10px;}
.pendingcard p{font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:16px;}

@media (max-width:900px){ .k-head,.kbody{grid-template-columns:1fr;} }
@media (max-width:560px){ .fgrid{grid-template-columns:1fr;} }
</style>
</head>

<div class="wrap hidden" id="loginwrap">
  <div class="loginwrap">
    <div class="logincard">
      <h2>Anmelden</h2>
      <div class="fld"><label>E-Mail</label><input autocomplete="username" id="loginEmail" type="email"></div>
      <div class="fld"><label>Passwort</label><input autocomplete="current-password" id="loginPassword" type="password"></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" id="loginBtn">Anmelden</button>
      <div class="status" id="loginStatus"></div>
    </div>
  </div>
</div>
<div class="wrap hidden" id="pendingWrap">
  <div class="loginwrap">

function isoKw(d = new Date()){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const tag = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - tag);
  const j0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - j0) / 86400000 + 1) / 7);
}
const KW_NOW = isoKw();
const YEAR_NOW = new Date().getFullYear();
const YEARS = Array.from({ length: 10 }, (_, i) => YEAR_NOW + i);
const jahreKurz = aus => { const n = YEARS.filter(y => !(aus || []).includes(y)).length; return n === YEARS.length ? '' : `${n} von ${YEARS.length} J.`; };
const kwWert = v => { const n = parseInt(v, 10); return n >= 1 && n <= 53 ? n : null; };
const nachReihe = (a, b) => (a.reihenfolge ?? 0) - (b.reihenfolge ?? 0);
function txtOn(hex){
  const n = parseInt(String(hex).slice(1), 16), r = n>>16, g = (n>>8)&255, b = n&255;
  return (0.299*r + 0.587*g + 0.114*b) / 255 > 0.6 ? '#323E4E' : '#FFFFFF';
}

// Tabelle (z.B. Bewaesserungsplan): Zeilen = Objekte {spalte_id: wert}, Zeitspanne als «von|bis»
const minuten = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ''); return m ? +m[1]*60 + +m[2] : null; };
function dauer(von, bis){
  const a = minuten(von), b = minuten(bis); if(a == null || b == null) return '';
  let d = b - a; if(d < 0) d += 1440;
  return d >= 60 ? `${Math.floor(d/60)} h ${d%60 ? d%60 + ' min' : ''}`.trim() : `${d} min`;
}
function tabZelle(s, ri, v){
  const a = `data-act="zelle" data-ri="${ri}" data-sp="${s.id}"`;
  if(s.typ === 'zeitspanne'){ const [von, bis] = String(v || '|').split('|');
    return `<div class="tz"><input type="text" class="zeit" inputmode="numeric" maxlength="5" placeholder="hh:mm" ${a} data-p="0" value="${esc(von)}" aria-label="${esc(s.name)} von"><span>–</span><input type="text" class="zeit" inputmode="numeric" maxlength="5" placeholder="hh:mm" ${a} data-p="1" value="${esc(bis)}" aria-label="${esc(s.name)} bis"><small>${dauer(von, bis)}</small></div>`; }
  if(s.typ === 'uhrzeit') return `<input type="text" class="zeit" inputmode="numeric" maxlength="5" placeholder="hh:mm" ${a} value="${esc(v)}" aria-label="${esc(s.name)}">`;
  if(s.typ === 'zahl') return `<div class="tu"><input type="number" step="any" ${a} value="${esc(v)}" aria-label="${esc(s.name)}">${s.einheit ? `<span>${esc(s.einheit)}</span>` : ''}</div>`;
  if(s.typ === 'janein') return `<select ${a} aria-label="${esc(s.name)}"><option value="">–</option><option ${v === 'Ja' ? 'selected' : ''}>Ja</option><option ${v === 'Nein' ? 'selected' : ''}>Nein</option></select>`;
  if(s.typ === 'auswahl'){ const opts = [...(s.optionen || [])]; if(v && !opts.includes(v)) opts.push(v);
    return `<select ${a} aria-label="${esc(s.name)}"><option value="">–</option>${opts.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`; }
  return `<input type="text" ${a} value="${esc(v)}" aria-label="${esc(s.name)}">`;
}

const aktKk = () => S.kk.find(x => x.kunde_id === aktKundeId() && x.kategorie_id === S.ktab);

async function setzeWert(kk, feldId, wert){
  const werte = { ...(kk.werte || {}) };
  if(wert === '' || wert == null) delete werte[feldId]; else werte[feldId] = wert;
  if(await speichere('pflege_kunde_kategorie', { id: kk.id }, { werte })) kk.werte = werte;
}
async function speichereZeilen(kk, rows){
  if(await speichere('pflege_kunde_kategorie', { id: kk.id }, { tabelle_zeilen: rows })) kk.tabelle_zeilen = rows;
}
// Zeit direkt eintippen: «2100», «21.00» oder «9» wird zu «21:00» bzw. «09:00»
function normZeit(v){
  const s = String(v).replace(/[^0-9]/g, ''); if(!s) return '';
  const h = s.length <= 2 ? s : s.slice(0, s.length - 2), mi = s.length <= 2 ? '00' : s.slice(-2);
  return (+h < 24 && +mi < 60) ? h.padStart(2, '0') + ':' + mi.padStart(2, '0') : v;
}
async function setzeZustaendig(kk, neu){
  const alt = zustVon(kk.id);
  const weg = alt.filter(b => !neu.includes(b)), dazu = neu.filter(b => !alt.includes(b));
  const res = await Promise.all([
    ...weg.map(b => sb.from('pflege_kunde_kategorie_zustaendig').delete().eq('kunde_kategorie_id', kk.id).eq('benutzer_id', b)),
    ...(dazu.length ? [sb.from('pflege_kunde_kategorie_zustaendig').insert(dazu.map(b => ({ kunde_kategorie_id: kk.id, benutzer_id: b })))] : [])
  ]);
  const f = res.find(r => r.error);
  if(f){ showToast(friendlyError(f.error), true); return; }
  S.kz = S.kz.filter(z => z.kunde_kategorie_id !== kk.id).concat(neu.map(b => ({ kunde_kategorie_id: kk.id, benutzer_id: b })));
  showToast('Gespeichert.');
}

$('app').addEventListener('input', e => {
  const el = e.target, act = el.dataset.act;
  if(act === 'f-q'){ S.f.q = el.value; renderListeZeilen(); }
  if(el.id === 'sq'){ const q = el.value.toLowerCase(); $('spick').querySelectorAll('.sp-item').forEach(b => b.classList.toggle('hidden', !b.dataset.such.includes(q))); }
  if(el.classList.contains('autogrow')){ el.style.height = 'auto'; el.style.height = Math.max(el.scrollHeight + 2, 70) + 'px'; }
});

$('app').addEventListener('change', async e => {
  const el = e.target, act = el.dataset.act;
  if(!act) return;
  const kundeId = aktKundeId(), k = kundeId && kundeById(kundeId), kk = aktKk();

  if(act === 'f-kat'){ S.f.kat = el.value; renderListeZeilen(); }
  else if(act === 'f-ma'){
    S.f.ma = el.checked ? [...S.f.ma, el.value] : S.f.ma.filter(v => v !== el.value);
    const d = $('fma'); d.outerHTML = zustFilterHtml(); $('fma').open = true; renderListeZeilen();
  }
  else if(act === 'notiz'){
    const notiz = el.value.trim() || null;
    if(await speichere('pflege_kunde', { kunde_id: kundeId }, { notiz, aktualisiert_am: new Date().toISOString() })) k.notiz = notiz;
  }
  else if(act === 'kat-add'){
    const katId = el.value; if(!katId) return;
    const { data, error } = await sb.from('pflege_kunde_kategorie').insert({ kunde_id: kundeId, kategorie_id: katId }).select().single();
    if(error){ showToast(friendlyError(error), true); return; }
    S.kk.push(data);
    // Neue Kategorie beim Kunden = alle Standardarbeiten vorausgefuellt
    const std = katById(katId).individuell ? [] : arbeitenVon(katId);
    if(std.length){
      const { data: rows, error: e2 } = await sb.from('pflege_kunde_arbeit').insert(std.map(a => ({ kunde_kategorie_id: data.id, arbeit_id: a.id }))).select();
      if(e2) showToast(friendlyError(e2), true); else S.ka.push(...rows);
    }
    S.ktab = katId; render();
  }
  else if(act === 'feld'){
    const f = S.felder.find(x => x.id === el.dataset.feld);
    let v = el.value.trim();
    if(f.typ === 'zahl' && v !== '') v = Number(v);
    await setzeWert(kk, f.id, v);
  }
  else if(act === 'zust'){
    const neu = [...$('zustMs').querySelectorAll('input:checked')].map(x => x.value);
    await setzeZustaendig(kk, neu);
    render(); $('zustMs').open = true;
  }
  else if(act === 'kw'){
    const id = el.closest('[data-id]').dataset.id, ka = S.ka.find(x => x.id === id), v = kwWert(el.value);
    if(v === null){ showToast('KW muss zwischen 1 und 53 liegen.', true); render(); return; }
    if(!ka.arbeit_id){ if(await speichere('pflege_kunde_arbeit', { id }, { kw: v })) ka.kw = v; render(); return; }
    const std = S.arbeiten.find(a => a.id === ka.arbeit_id).standard_kw;
    if(v === std){ if(await speichere('pflege_kunde_arbeit', { id }, { kw: null })) ka.kw = null; S.kwAsk = null; render(); return; }
    // Standardwoche uebersteuern nur nach Rueckfrage
    S.kwAsk = { id, v }; render();
  }
  else if(act === 'zus-titel'){
    const id = el.closest('[data-id]').dataset.id, ka = S.ka.find(x => x.id === id), titel = el.value.trim();
    if(await speichere('pflege_kunde_arbeit', { id }, { titel })) ka.titel = titel;
  }
  else if(act === 'zelle'){
    const rows = (kk.tabelle_zeilen || []).map(r => ({ ...r })), ri = +el.dataset.ri, sp = el.dataset.sp;
    if(el.classList.contains('zeit')) el.value = normZeit(el.value);
    if(el.dataset.p != null){
      const teile = String(rows[ri][sp] || '|').split('|'); teile[+el.dataset.p] = el.value;
      rows[ri][sp] = teile.join('|') === '|' ? '' : teile.join('|');
      const small = el.closest('.tz')?.querySelector('small'); if(small) small.textContent = dauer(teile[0], teile[1]);
    } else {
      const s = S.spalten.find(x => x.id === sp);
      rows[ri][sp] = s.typ === 'zahl' && el.value !== '' ? Number(el.value) : el.value;
    }
    if(rows[ri][sp] === '') delete rows[ri][sp];
    await speichereZeilen(kk, rows);
  }
});

$('app').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if(!b || b.tagName === 'INPUT' || b.tagName === 'SELECT' || b.tagName === 'TEXTAREA') return;
  const act = b.dataset.act, kundeId = aktKundeId(), k = kundeId && kundeById(kundeId), kk = aktKk();

    b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.v === v)));
  }
  else if(act === 'zust-rm'){ await setzeZustaendig(kk, zustVon(kk.id).filter(x => x !== b.dataset.b)); render(); }
  else if(act === 'zust-niemand'){ await setzeZustaendig(kk, []); render(); }
  else if(act === 'kw-ja' || act === 'kw-nein'){
    const ka = S.ka.find(x => x.id === S.kwAsk.id);
    if(act === 'kw-ja' && await speichere('pflege_kunde_arbeit', { id: ka.id }, { kw: S.kwAsk.v })) ka.kw = S.kwAsk.v;
    S.kwAsk = null; render();
  }
  else if(act === 'arb-info') oeffneArbeitInfo(S.ka.find(x => x.id === b.closest('[data-id]').dataset.id));
  else if(act === 'arb-rm'){
    const id = b.closest('[data-id]').dataset.id, ka = S.ka.find(x => x.id === id);
    const name = ka.arbeit_id ? S.arbeiten.find(a => a.id === ka.arbeit_id)?.name : (ka.titel || 'Zusatzarbeit');
    if(!await kgBestaetigen(`«${name}» bei diesem Kunden entfernen?`, 'Arbeit entfernen?', 'Entfernen')) return;
    const { error } = await sb.from('pflege_kunde_arbeit').delete().eq('id', id);
    if(error){ showToast(friendlyError(error), true); return; }
    S.ka = S.ka.filter(x => x.id !== id); render();
  }
  else if(act === 'std-add'){
    const { data, error } = await sb.from('pflege_kunde_arbeit').insert({ kunde_kategorie_id: kk.id, arbeit_id: b.dataset.arbeit }).select().single();
    if(error){ showToast(friendlyError(error), true); return; }
    S.ka.push(data); render();
  }
  else if(act === 'zus-add'){
    const { data, error } = await sb.from('pflege_kunde_arbeit').insert({ kunde_kategorie_id: kk.id, titel: '', kw: KW_NOW }).select().single();
    if(error){ showToast(friendlyError(error), true); return; }
    S.ka.push(data); render();
    document.querySelector(`tr[data-id="${data.id}"] [data-act="zus-titel"]`)?.focus();
  }
  else if(act === 'trow-add'){
    await speichereZeilen(kk, [...(kk.tabelle_zeilen || []), {}]); render();
  }
  else if(act === 'trow-rm'){
    const ri = +b.dataset.ri, rows = [...(kk.tabelle_zeilen || [])];
    if(Object.keys(rows[ri] || {}).length && !await kgBestaetigen('Diese Zeile mit allen Werten entfernen?', 'Zeile entfernen?', 'Entfernen')) return;
    rows.splice(ri, 1);
    await speichereZeilen(kk, rows); render();
  }
  else if(act === 'kat-entfernen'){
    const kat = katById(kk.kategorie_id);
    if(!await kgBestaetigen(`«${kat.name}» bei diesem Kunden entfernen? Angaben, Tabelle, Arbeiten, Zuständige und erledigte Einsätze dieser Kategorie gehen verloren.`, 'Kategorie entfernen?', 'Entfernen')) return;
    const { error } = await sb.from('pflege_kunde_kategorie').delete().eq('id', kk.id);
    if(error){ showToast(friendlyError(error), true); return; }
    S.kk = S.kk.filter(x => x.id !== kk.id); S.ka = S.ka.filter(x => x.kunde_kategorie_id !== kk.id); S.kz = S.kz.filter(x => x.kunde_kategorie_id !== kk.id);
    S.ktab = null; render();
  }
  else if(act === 'kunde-entfernen'){
    if(!await kgBestaetigen(`«${k.kunde?.name}» aus dem Pflege-Tool entfernen? Alle Pflege-Angaben dieses Kunden gehen verloren. Der Kunde selbst bleibt im Offertentool und in Easybill.`, 'Kunde entfernen?', 'Entfernen')) return;
    const { error } = await sb.from('pflege_kunde').delete().eq('kunde_id', kundeId);
    if(error){ showToast(friendlyError(error), true); return; }
    location.hash = '';
    await ladeAlles();
  }
});
$('app').addEventListener('keydown', e => {
  const tr = e.target.closest('tr[data-act="kunde-oeffnen"]');
  if(tr && e.key === 'Enter') location.hash = 'k=' + tr.dataset.id;
});

pruefeAnmeldung();
</script>
