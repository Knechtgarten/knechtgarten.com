<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/kg-pw-schutz.js?v=5"></script>

<title>Bauprogramm – Einsatzplaner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#323E4E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
/* Bauprogramm: Tage von oben nach unten, alle Angebote der Auftragsbestätigung als Blöcke mit Lappen
   (Angebot › Arbeitsschritt › Teilschritt), wie im abgesegneten Mockup «Bauprogramm mit Lappen». */
body{margin:0;background:#F5F7F9;color:#232B35;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.4;}
*{box-sizing:border-box;}
.hidden{display:none!important;}
header.app{background:#323E4E;color:#fff;}
header.app .wrap{display:flex;align-items:center;gap:16px;padding:0 16px;}
header.app .brand h1{font-size:15px;margin:0;}
nav.subnav{background:#fff;border-bottom:1px solid #E1E5E9;} nav.subnav .wrap{display:flex;gap:2px;padding:0 16px;}
nav.subnav a{padding:12px 12px 10px;color:#6B7079;font-weight:600;text-decoration:none;font-size:13px;border-bottom:2px solid transparent;}
nav.subnav a.on{color:#323E4E;border-bottom-color:#323E4E;}
.loginwrap{min-height:70vh;display:flex;align-items:center;justify-content:center;}
.logincard{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(35,43,53,.08),0 0 0 1px rgba(35,43,53,.04);padding:24px 22px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;}
.logincard h2{font-size:17px;margin:0 0 4px;color:#323E4E;}
.logincard label{font-size:12px;color:#6B7079;}
.logincard input{height:40px;border:1px solid #B9C0C8;border-radius:8px;padding:0 10px;font:inherit;font-size:15px;width:100%;}
.logincard button{all:unset;box-sizing:border-box;cursor:pointer;height:40px;border-radius:8px;background:#323E4E;color:#fff;font-weight:600;text-align:center;}
.logincard .status{font-size:12.5px;color:#6B7079;min-height:16px;} .logincard .status.err{color:#B4655F;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#323E4E;color:#fff;font-size:13px;padding:9px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:100;}
.toast.err{background:#B4655F;}
.t{height:32px;border:1px solid #B9C0C8;border-radius:8px;padding:0 10px;font:inherit;font-size:13px;color:#232B35;background:#fff;}
.t:focus{outline:none;border-color:#323E4E;}
.btn{all:unset;box-sizing:border-box;cursor:pointer;height:32px;padding:0 12px;border-radius:8px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn.prim{background:#323E4E;color:#fff;} .btn.ghost{background:#fff;border:1px solid #D5DBE1;color:#323E4E;} .btn.ghost:hover{border-color:#4C5C70;}
.btn:focus-visible,.t:focus-visible{outline:2px solid #323E4E;outline-offset:2px;}
.lbl{font-size:12.5px;color:#6B7079;display:inline-flex;align-items:center;gap:6px;}
.menue{position:absolute;left:0;top:100%;margin-top:4px;z-index:30;background:#fff;border:1px solid #D5DBE1;border-radius:8px;box-shadow:0 8px 24px rgba(20,28,38,.16);width:340px;max-height:380px;overflow-y:auto;font-size:13px;}
.menue button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;width:100%;padding:7px 10px;border-top:1px solid #EEF1F4;}
.menue button:hover{background:#F5F7F9;} .menue small{color:#6B7079;font-size:12px;}
.menue .kopfzeile{padding:6px 10px;font-size:11.5px;color:#8B9097;background:#F5F7F9;}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid #EEF1F4;background:#fff;}
.chip{font-size:12.5px;padding:4px 10px;border-radius:99px;background:#F5F7F9;border:1px solid #D5DBE1;color:#4C5C70;}
.chip b{color:#323E4E;font-variant-numeric:tabular-nums;}
.chip.warn{background:#F9D3B2;border-color:#E57E34;color:#8A3F12;}
.haupt{display:grid;grid-template-columns:300px 22px 14px minmax(0,1fr);} .haupt.ohne-geruest{grid-template-columns:22px 14px minmax(0,1fr);}
/* Leiste mit grossem Pfeil zum Auf- und Zuklappen des Gerüsts */
.gtog{all:unset;cursor:pointer;background:#E3E7EC;border-right:1px solid #D5DBE1;display:flex;justify-content:center;align-items:flex-start;padding-top:3px;color:#323E4E;}
.gtog:hover{background:#D6E7F4;} .gtog:focus-visible{outline:2px solid #323E4E;outline-offset:-2px;}
.gtog span{width:18px;height:28px;border-radius:9px;background:#323E4E;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(35,43,53,.25);}
.gtog span svg{width:16px;height:16px;}
.gtog:hover span{background:#4C5C70;}
.lscroll{overflow-y:scroll;overflow-x:hidden;height:calc(100vh - 150px);border-right:1px solid #EEF1F4;background:#fff;} .lscroll > div{width:1px;}
/* Links das Gerüst (ein-/ausblendbar): pro Offerte der Arbeitsschritt-Balken mit seinen Teilschritten, nicht auf der Tagesachse.
   Rechts das Programm auf der Tagesachse: nur einzelne, flache Felder. Zurückhaltend: Weiss und helle Grautöne.
   Ein Arbeitstag = 24 px hoch, Wochenende 10 px. */
.geruest{background:#F5F7F9;border-right:1px solid #D5DBE1;overflow:auto;height:calc(100vh - 150px);padding:8px 10px 20px;display:flex;flex-direction:column;gap:10px;}
.geruest.ziel{background:#D6E7F4;box-shadow:inset 0 0 0 2px #323E4E;}
.ohne-geruest .geruest{display:none;}
.gkopf{display:flex;flex-direction:column;gap:1px;} .gkopf b{font-size:13px;color:#323E4E;} .gkopf span{font-size:11.5px;color:#8B9097;}
.gleer{font-size:12.5px;color:#6B7079;line-height:1.4;}
.gang{background:#EEF1F4;border:1px solid #DCE1E6;border-radius:8px;padding:5px;display:flex;flex-direction:column;gap:4px;}
.gah{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#323E4E;padding:2px 3px;border-radius:5px;}
.gah[draggable]{cursor:grab;} .gah[draggable]:hover{background:#E3E7EC;}
.gah .gan{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gah svg{width:12px;height:12px;flex:none;color:#8B9097;}
.gtg{font-size:11px;font-weight:700;color:#4C5C70;white-space:nowrap;font-variant-numeric:tabular-nums;}
.gtsl{display:flex;flex-direction:column;gap:2px;min-width:0;}
.gts{background:#fff;border:1px solid #D5DBE1;border-radius:5px;display:flex;align-items:center;gap:5px;padding:2px 6px;font-size:12px;line-height:18px;color:#232B35;min-width:0;}
.gts[draggable]{cursor:grab;} .gts[draggable]:hover{border-color:#8B9097;}
.gts .gtn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gts.eb{font-size:11.5px;color:#6B7079;}
.gang{gap:3px;} .gang:not(.auf){padding:3px 5px;}
.gah[data-aang]{cursor:pointer;}
.gpf{display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;color:#4C5C70;flex:none;}
.gpf svg{width:14px!important;height:14px!important;color:inherit!important;}
.gah:hover .gpf,.gasr:hover .gpf{background:#D5DBE1;}
.gasr{background:color-mix(in srgb, var(--gfarbe, #8B9097) 22%, #F5F7F9);border-radius:5px;display:flex;align-items:center;gap:6px;padding:2px 4px 2px 8px;min-height:24px;box-sizing:border-box;font-size:12px;font-weight:600;color:#323E4E;cursor:grab;}
.gasr:hover{background:color-mix(in srgb, var(--gfarbe, #8B9097) 32%, #F5F7F9);} .gasr .gan{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gasr.auf{border-radius:5px 5px 0 0;} .gasr.auf + .gtsl{padding:3px 0 4px 10px;}
.gfertig{display:flex;align-items:center;gap:6px;color:#2A7570;font-weight:600;padding:6px 2px;}
.gabs{display:flex;flex-direction:column;gap:2px;padding:2px 2px 6px;border-bottom:1px solid #DCE1E6;}
.gabk{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#323E4E;padding:0 2px 3px;}
.gab{display:flex;align-items:center;gap:7px;font-size:12px;color:#323E4E;padding:2px;cursor:pointer;} .gab small{margin-left:auto;color:#8B9097;font-variant-numeric:tabular-nums;}
.gab input{accent-color:#323E4E;margin:0;}
.hk{color:#2A7570;display:inline-flex;} .hk svg{width:12px;height:12px;}
.adot{width:8px;height:8px;border-radius:50%;flex:none;}
.ziehe{opacity:.45;}
.blk{margin:1px 4px;border-radius:6px;z-index:2;position:relative;background:#fff;border:1px solid #D5DBE1;padding:2px 6px 6px 7px;box-sizing:border-box;font-size:12px;line-height:18px;color:#232B35;display:flex;flex-direction:column;overflow:hidden;min-width:0;cursor:grab;}
.blk:hover{border-color:#8B9097;}
.blk .z1{display:flex;align-items:center;gap:5px;min-width:0;}
.blk .z1 b{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.blk small{font-size:11px;line-height:15px;color:#6B7079;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.blk .dauer{font-size:11px;font-weight:700;color:#4C5C70;white-space:nowrap;font-variant-numeric:tabular-nums;}
.blk .fix{font-size:10px;font-weight:700;color:#8A3F12;background:#F9D3B2;border-radius:4px;padding:0 4px;line-height:16px;}
.blk.konflikt{outline:2px solid #B4655F;outline-offset:-1px;} .blk.gewaehlt{outline:2px solid #323E4E;outline-offset:-1px;}
.blk.ziel-o{box-shadow:0 -3px 0 #323E4E;} .blk.ziel-u{box-shadow:0 3px 0 #323E4E;}
.ib{all:unset;cursor:pointer;width:18px;height:18px;border-radius:50%;border:1px solid #D5DBE1;background:#fff;display:inline-flex;align-items:center;justify-content:center;color:#4C5C70;flex:none;}
.ib:hover{border-color:#323E4E;color:#323E4E;} .ib svg{width:11px;height:11px;} .ib:focus-visible{outline:2px solid #323E4E;}
.griff{position:absolute;left:0;right:0;bottom:0;height:6px;cursor:ns-resize;display:flex;justify-content:center;align-items:center;}
.griff::before{content:"";width:16px;height:2px;border-radius:2px;background:#8B9097;}
/* Programm wie eine Tabelle: Text in jeder Tageszeile, darüber ein durchsichtiger Rahmen (erst beim Überfahren sichtbar) */
.ztxt{z-index:1;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12px;color:#232B35;white-space:nowrap;overflow:hidden;min-width:0;pointer-events:none;}
.ztxt .zt{overflow:hidden;text-overflow:ellipsis;min-width:0;} .ztxt.erst .zt{font-weight:600;}
.ztxt .fix{font-size:10px;font-weight:700;color:#8A3F12;background:#F9D3B2;border-radius:4px;padding:0 4px;line-height:16px;}
.blk{background:transparent!important;border:1px solid transparent!important;box-shadow:none!important;}
.blk:hover{border-color:#8B9097!important;background:rgba(214,231,244,.22)!important;}
.blk.gewaehlt{border-color:#323E4E!important;border-width:1.5px!important;} .blk.konflikt{border-color:#B4655F!important;}
.blk .bk{position:absolute;top:2px;right:4px;display:none;align-items:center;gap:4px;background:#fff;border-radius:99px;padding:0 2px 0 6px;box-shadow:0 1px 3px rgba(35,43,53,.15);}
.blk:hover .bk,.blk.gewaehlt .bk{display:flex;}
.blk .griff{display:none;} .blk:hover .griff,.blk.gewaehlt .griff{display:flex;}
.blk.ziel-o{box-shadow:0 -3px 0 #323E4E!important;} .blk.ziel-u{box-shadow:0 3px 0 #323E4E!important;}
.ziel-leer{pointer-events:none;}
.zelle[data-di]{cursor:text;} .zelle[data-di]:hover{background:#F5F7F9;}
.zin{width:100%;height:100%;border:0;outline:1.5px solid #323E4E;outline-offset:-1.5px;font:inherit;font-size:12px;padding:0 10px;box-sizing:border-box;background:#fff;color:#232B35;}
/* Material, Subunternehmer, Notizen: direkt hineinschreiben, gehört zum Arbeitsschritt und wandert beim Verschieben mit */
.zinfo{z-index:2;margin:0;border:0;border-radius:0;background:transparent;padding:0 8px;font:inherit;font-size:12px;line-height:23px;height:100%;width:100%;box-sizing:border-box;color:#232B35;min-width:0;text-overflow:ellipsis;}
.zinfo:hover{background:rgba(214,231,244,.25);}
.zinfo:focus{outline:1.5px solid #323E4E;outline-offset:-1.5px;background:#fff;}
.zinfo[readonly]{cursor:default;} .zinfo[readonly]:focus{outline:none;background:transparent;}
.nurlesen .blk{cursor:pointer;}
.leer-start{padding:60px 20px;text-align:center;color:#6B7079;font-size:15px;line-height:1.5;}
.prog{overflow:auto;height:calc(100vh - 150px);border-right:1px solid #D5DBE1;position:relative;background:#fff;}
.raster{display:grid;position:relative;min-width:960px;}
/* Planer-Spalte: Balken der Leute bei diesem Kunden hochkant, nur zum Vergleichen (an Wochenenden unterbrochen) */
.kopf.pl{padding:3px 2px;border-right:1px solid #D5DBE1;display:flex;align-items:center;justify-content:center;gap:3px;font-size:9.5px;letter-spacing:.02em;}
.hbtn{all:unset;cursor:pointer;width:18px;height:28px;border-radius:9px;background:#323E4E;color:#fff;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(35,43,53,.25);}
.hbtn svg{width:16px;height:16px;} .hbtn:hover{background:#4C5C70;}
.hbtn:focus-visible{outline:2px solid #323E4E;outline-offset:2px;}
.plz{border-bottom:1px solid #EEF1F4;border-right:1px solid #D5DBE1;} .plz.frei{background:#F5F7F9;} .plz.fei{background:#FCF5D8;}
.pls{margin:1px 4px;border-radius:4px;z-index:1;overflow:hidden;display:flex;justify-content:center;}
.pls span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:600;white-space:nowrap;padding:5px 0;}
.pls.hilfe{}
.pls.lang{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.7) 0 4px,transparent 4px 8px)!important;box-shadow:inset 0 0 0 1px #A3B0BE;}
.pls.prov{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.6) 0 3px,transparent 3px 7px)!important;}
.pls.abs{background:repeating-linear-gradient(135deg,#C9D1DB 0 4px,#E3E7EC 4px 8px);}
.plende{height:0;border-top:2px dashed;align-self:end;z-index:2;position:relative;pointer-events:none;}
.plende span{position:absolute;top:-10px;color:#fff;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;white-space:nowrap;}
button.chip{all:unset;cursor:pointer;font-size:12.5px;padding:4px 10px;border-radius:99px;background:#fff;border:1px solid #D5DBE1;color:#323E4E;font-weight:600;}
button.chip:hover{border-color:#4C5C70;} button.chip:focus-visible{outline:2px solid #323E4E;outline-offset:2px;}
/* Fenster-Modus: im Planer als grosses Fenster geöffnet (?fenster=1) */
html.bp-fenster header.app,html.bp-fenster nav.subnav{display:none!important;}
html.bp-fenster body{background:#fff;}
/* Fenster füllt die ganze Höhe; Kopf + Chips bleiben stehen, Programm und Baum scrollen je für sich */
html.bp-fenster,html.bp-fenster body{height:100%;overflow:hidden;}
html.bp-fenster body{display:flex;flex-direction:column;}
html.bp-fenster #appMain{flex:1;min-height:0;display:flex;flex-direction:column;}
html.bp-fenster .haupt{flex:1;min-height:0;grid-template-rows:minmax(0,1fr);}
html.bp-fenster .prog,html.bp-fenster .lscroll,html.bp-fenster .geruest{height:auto;min-height:0;}
/* Fenster: dünner dunkelblauer Balken oben, Bedienung als helle Text-Links */
html.bp-fenster .kg-seite{background:#323E4E;border-bottom:0;min-height:40px;padding:4px 10px 4px 14px;gap:14px;}
.bptitel{font-weight:700;font-size:14px;color:#323E4E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px;}
.bpliste{width:min(560px,calc(100% - 32px));margin:20px auto;max-height:calc(100% - 40px);overflow:auto;box-sizing:border-box;background:#fff;border:1px solid #E1E5E9;border-radius:12px;box-shadow:0 6px 24px rgba(35,43,53,.08);padding:8px;display:flex;flex-direction:column;}
.bplk{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#323E4E;padding:6px 10px 8px;}
.bpl{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,.9fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;font-size:13px;color:#6B7079;}
.bpl b{color:#232B35;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .bpl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .bpl .d{font-variant-numeric:tabular-nums;}
.bpl:hover{background:#F5F7F9;} .bpl:focus-visible{outline:2px solid #323E4E;}
.bplleer{padding:10px;font-size:13px;color:#6B7079;} .bplh{padding:10px 10px 6px;font-size:12px;color:#8B9097;border-top:1px solid #EEF1F4;margin-top:6px;}
html.bp-fenster .bptitel{color:#fff;padding:0 4px;}
html.bp-fenster #springen{background:none;border:0!important;box-shadow:none;gap:2px!important;height:auto;}
html.bp-fenster #springen button,html.bp-fenster #druckBtn{all:unset;border:0!important;cursor:pointer;color:#DCE2E8;font-size:13px;font-weight:500;padding:5px 9px;border-radius:6px;}
html.bp-fenster #springen button:hover,html.bp-fenster #druckBtn:hover{color:#fff;background:rgba(255,255,255,.12);}
html.bp-fenster #springen button:focus-visible,html.bp-fenster #druckBtn:focus-visible{outline:2px solid #D6E7F4;}
html.bp-fenster #zuBtn{background:transparent!important;border:0!important;color:#DCE2E8!important;}
html.bp-fenster #zuBtn:hover{background:rgba(255,255,255,.12)!important;color:#fff!important;}
.kopf{position:sticky;top:0;z-index:3;background:#F5F7F9;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#323E4E;font-weight:700;padding:8px 10px;border-bottom:1px solid #D5DBE1;}
.tag{font-size:12.5px;color:#4C5C70;padding:0 10px;display:flex;align-items:center;gap:6px;border-bottom:1px solid #DCE1E6;font-variant-numeric:tabular-nums;white-space:nowrap;}
.tag b{width:22px;color:#323E4E;}
/* Griffe am angewählten Feld: innen ganzer Arbeitsschritt, aussen ganze Offerte */
.ggr{justify-self:end;width:5px;border-radius:3px;margin:3px 0;z-index:3;cursor:grab;position:relative;opacity:.85;}
.ggr:hover{opacity:1;box-shadow:0 0 0 2px rgba(50,62,78,.18);} .ggr.as{margin-right:2px;} .ggr.ang{margin-right:10px;}
.tag.frei{background:#F5F7F9;color:#A3B0BE;font-size:9px;line-height:10px;overflow:hidden;} .tag.frei b{color:#A3B0BE;}
.tag.fei{background:#FAEBB0;color:#8A6410;font-size:11.5px;overflow:hidden;}
.zelle{border-bottom:1px solid #DCE1E6;border-left:1px solid #E3E7EC;}
.zelle.frei{background:#F5F7F9;} .zelle.fei{background:#FCF5D8;}
.zelle.ziel-tag{background:#D6E7F4!important;box-shadow:inset 0 2px 0 #323E4E;}
.ziel-leer{grid-column:2/5;margin:8px;border:2px dashed #D5DBE1;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:#6B7079;font-size:14px;line-height:1.5;z-index:1;background:rgba(255,255,255,.85);}
.ziel-leer.ziel,.ende.ziel{border-color:#323E4E;color:#323E4E;background:#D6E7F4;}
.ende{grid-column:2/5;margin:4px 8px;border:1.5px dashed #D5DBE1;border-radius:8px;font-size:12px;color:#8B9097;display:flex;align-items:center;justify-content:center;z-index:1;}
.info{margin:2px 6px;font-size:12.5px;padding:5px 4px 5px 8px;line-height:1.3;border-left:3px solid var(--fb);background:rgba(255,255,255,.6);white-space:pre-line;overflow:hidden;}
.detail{position:sticky;bottom:0;z-index:4;background:#fff;border-top:1px solid #D5DBE1;padding:10px 16px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;box-shadow:0 -4px 16px rgba(20,28,38,.08);}
.detail .feld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:#4C5C70;font-weight:600;}
.detail .feld small{font-weight:400;color:#8B9097;}
.detail input.t{width:165px;} .detail .klein{width:66px!important;}
.sp{flex:1;}
.dlgs{position:fixed;inset:0;background:rgba(35,43,53,.35);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:90px 12px 12px;}
.dlg{width:min(460px,100%);max-height:calc(100vh - 110px);overflow:auto;background:#fff;border-radius:12px;box-shadow:0 18px 50px rgba(20,28,38,.3);padding:18px;display:flex;flex-direction:column;gap:12px;}
.dlg h3{margin:0;font-size:17px;color:#323E4E;} .dlg p{margin:0;font-size:13.5px;line-height:1.45;color:#6B7079;}
.dlg .knoepfe{display:flex;gap:8px;justify-content:flex-end;}
.btn.rot{background:#B4655F;color:#fff;} .btn.rot:hover{background:#9E5550;}
/* Ausdruck: A4 quer, ganze Wochen (Mo–Fr), genau 4 Wochen pro Seite, Wochenende als feiner grauer Balken */
#druck{display:none;}
@media print{
  body > *:not(#druck){display:none!important;}
  html,body,html.bp-fenster,html.bp-fenster body{background:#fff;margin:0;height:auto!important;overflow:visible!important;display:block!important;}   /* Fenster-Modus: sonst nur 1 Seite */
  #druck{display:block!important;}
  @page{size:A4 landscape;margin:0;}
}
#druck{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#232B35;font-size:8.5pt;}
#druck .bl{width:297mm;height:209mm;padding:7mm 12mm 5mm;box-sizing:border-box;overflow:hidden;break-after:page;display:flex;flex-direction:column;}
#druck .bl:last-child{break-after:auto;}
#druck .dk{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:4mm;margin-bottom:3mm;border-bottom:.8mm solid #323E4E;position:relative;}
#druck .dk::after{content:"";position:absolute;left:0;bottom:-.8mm;width:22mm;height:.8mm;background:#D1DB5F;}
#druck .dk h1{margin:0;font-size:16pt;font-weight:700;color:#323E4E;letter-spacing:-.01em;}
#druck .dk p{margin:1mm 0 0;font-size:9pt;color:#6B7079;}
#druck .dk .fi{text-align:right;font-size:9pt;font-weight:700;color:#323E4E;} #druck .dk .fi span{display:block;font-weight:400;color:#8B9097;font-size:8pt;margin-top:.5mm;}
#druck table{width:100%;border-collapse:collapse;table-layout:fixed;}
#druck th{text-align:left;font-size:7pt;letter-spacing:.08em;text-transform:uppercase;color:#8B9097;font-weight:700;padding:0 2mm 1.5mm;border-bottom:.3mm solid #8B9097;}
#druck td{height:7mm;padding:0 2mm;border-bottom:.2mm solid #E3E7EC;vertical-align:middle;line-height:1.25;overflow:hidden;}

#druck td.kw{border-bottom:0;padding:0;text-align:center;}
#druck td.kw span{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);font-size:7.5pt;font-weight:700;letter-spacing:.08em;color:#8B9097;}
#druck td.kw{background:#F5F7F9;border-right:.3mm solid #D5DBE1;}
#druck td.wt{font-weight:700;color:#323E4E;} #druck td.dt{color:#6B7079;font-variant-numeric:tabular-nums;}
#druck td.ar{font-weight:600;color:#232B35;} #druck td.ar small{display:block;font-weight:400;color:#8B9097;font-size:7pt;}
#druck td.leer{color:#C4CBD3;}
#druck tbody.wk{border:.3mm solid #B9C0C8;}
#druck tbody.wk tr:last-child td{border-bottom:0;}
#druck tr.sa td{height:3.4mm;font-size:6.5pt;line-height:1.1;background:#F5F7F9;color:#A3B0BE;border-bottom:0;}
#druck tr.sa td.wt{font-weight:600;color:#A3B0BE;} #druck tr.sa td.ar{font-weight:600;color:#4C5C70;}
#druck tr.sa.voll td,#druck tr.sa.voll td.wt,#druck tr.sa.voll td.ar{color:#B4655F;font-weight:700;}
#druck tbody.lz td{height:1.8mm;padding:0;border:0;background:transparent;}
#druck tr.fei td:not(.kw){background:#FBF3D2;} #druck tr.fei td.ar{color:#8A6410;font-weight:600;}
#druck tr.heute td.wt{color:#2A7570;}
#druck .fix{display:inline-block;font-size:6.5pt;font-weight:700;color:#8A3F12;background:#F9D3B2;border-radius:1mm;padding:0 1.2mm;margin-left:1.5mm;vertical-align:1px;letter-spacing:.03em;}
#druck td.no{color:#4C5C70;}
@media (max-width:900px){ .prog{height:auto;max-height:none;border-right:0;} }

<body>
<header class="app"><div class="wrap">
  <a class="backlink" href="index.html">Startseite</a>
  <div class="brand"><h1>Einsatzplaner</h1></div>
  <span class="userbar hidden" id="userbar"><span id="userbarText"></span><button id="logoutBtn">Abmelden</button></span>
</div></header>
<nav class="subnav"><div class="wrap">
  <a href="einsatzplaner-live-v1.html#plan">Planer</a>
  <a href="bauprogramm-live-v1.html" class="on">Bauprogramm</a>
</div></nav>
<span class="bptitel" data-kg-seite="links" id="bpTitel">Bauprogramme</span>
<label class="lbl" data-kg-seite="mitte" style="display:none">Start <input class="t" type="date" id="start"></label>
<span class="kg-seg" data-kg-seite="mitte" id="springen"><button type="button" data-spr="anfang" title="Zum Anfang (mit einer Woche davor)">Anfang</button><button type="button" data-spr="mitte" title="In die Mitte von Programm und Planer-Balken">Mitte</button><button type="button" data-spr="ende" title="Zum Ende (mit einer Woche danach)">Ende</button></span>
<button type="button" class="btn ghost" data-kg-seite="rechts" id="druckBtn">Drucken / PDF</button>
<button type="button" class="kg-ibtn hidden" data-kg-seite="rechts" id="zuBtn" title="Schliessen (zurück zum Planer)" aria-label="Schliessen"></button>
<main id="appMain"></main>
<script>
// Bauprogramm pro Kunde/Baustelle. Quellen: Auftragsbestätigungen + Angebote aus dem Easybill-Abgleich (easybill_dokument)
// und Offerten aus dem Offertentool (Teilschritt-Tage). Blöcke + Reihenfolge in bauprogramm / bauprogramm_block.
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const NL = String.fromCharCode(10);
const ic = (n, s = 14) => KG.icon(n, s);
const TAG_H = 8.5, TEAM = 2;
const FAM = ['erde', 'blau', 'petrol', 'gold', 'gruen', 'orange', 'violett', 'beere', 'oliv'];
const farbe = f => { const p = KG.palette[f] || KG.palette.grau; return { f: p[1], h: p[4], t: p[0] }; };
const WT = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const iso = d => d.toISOString().slice(0, 10);
const plus = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const kurz = d => `${d.getDate()}.${d.getMonth() + 1}.`;
const toast = (t, err) => { const e = document.createElement('div'); e.className = 'toast' + (err ? ' err' : ''); e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), err ? 5000 : 2000); };
let sb, ICH, DARF = true;
// Fenster-Modus: im Planer über dem Planer geöffnet; Schliessen schickt eine Nachricht an den Planer
const FENSTER = new URLSearchParams(location.search).has('fenster');
if(FENSTER){ document.documentElement.classList.add('bp-fenster'); $('zuBtn').classList.remove('hidden'); $('zuBtn').innerHTML = ic('x'); }
async function schliessen(){ if(speicherTimer) await speichern(); parent.postMessage({ bp: 'zu' }, location.origin); }
$('zuBtn').addEventListener('click', schliessen);
addEventListener('keydown', e => { if(e.key !== 'Escape' || document.querySelector('.dlgs')) return;
  if(gewaehlt && !e.target.closest?.('input,textarea')){ gewaehlt = null; zeichnen(); return; }   // zuerst Auswahl aufheben
  if(FENSTER) schliessen(); });
// Klick daneben hebt die Auswahl auf (Rahmen + Leiste unten weg)
document.addEventListener('click', e => { if(!gewaehlt || e.target.closest('.blk,#detail,.dlgs,.zelle[data-di],.zinfo')) return; gewaehlt = null; zeichnen(); });

// ---------------------------------------------------------------- Start / Login
async function start(){
  KG._sb = KG._sb || window.supabase.createClient('https://oalapdxinqlnzwxhyuzy.supabase.co', 'sb_publishable_DoeD4uEnwemmnFu4AxE9uw_5lmQYc5P');
  sb = KG._sb;
  $('logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });
  const { data: { session } } = await sb.auth.getSession();
  if(!session) return login();
  const { data: b } = await sb.from('benutzer').select('rolle,aktiv,email,anzeigename').eq('id', session.user.id).maybeSingle();
  if(!b || !b.rolle || b.aktiv === false){ $('appMain').innerHTML = '<div class="loginwrap"><div class="logincard"><h2>Noch nicht freigeschaltet</h2></div></div>'; return; }
  ICH = session.user.id;
  if(KG.ladeRechte) await KG.ladeRechte();
  const r = KG.darf ? KG.darf('plan', 'einsaetze', 'bearbeiten') : null; DARF = r === null || r !== 'K';
  $('userbar').classList.remove('hidden'); $('userbarText').textContent = b.anzeigename || b.email || '';
  await ladeGrund();
  const q = new URLSearchParams(location.search);
  if(q.get('einsatz') || q.get('programm')) await programmOeffnen({ einsatz: q.get('einsatz'), programm: q.get('programm') }); else await zeigeListe();
}
function login(){
  $('appMain').innerHTML = `<div class="loginwrap"><div class="logincard"><h2>Anmelden</h2>
    <label for="lE">E-Mail</label><input autocomplete="username" id="lE" type="email"><label for="lP">Passwort</label><input autocomplete="current-password" id="lP" type="password">
    <button type="button" id="lB">Anmelden</button><div class="status" id="lS"></div></div></div>`;
  const los = async () => { $('lS').textContent = 'Melde an …';
    const { error } = await KG.anmelden(sb, { email: $('lE').value.trim(), password: $('lP').value });
    if(error){ $('lS').textContent = 'Login fehlgeschlagen: ' + error.message; $('lS').className = 'status err'; return; } location.reload(); };
  $('lB').addEventListener('click', los); $('lP').addEventListener('keydown', e => { if(e.key === 'Enter') los(); });
}
// Ohne Balken: Liste der bestehenden Bauprogramme (neu erstellen nur im Planer: Rechtsklick auf den Baustellen-Balken)
async function zeigeListe(){
  $('bpTitel').textContent = 'Bauprogramme'; ['springen', 'druckBtn'].forEach(id => $(id).classList.add('hidden'));
  $('appMain').innerHTML = '<div class="leer-start">Lädt …</div>';
  const { data: ps } = await sb.from('bauprogramm').select('id,kunde_id,einsatz_id,start,geaendert_am').order('start', { ascending: false });
  const kIds = [...new Set((ps || []).map(p => p.kunde_id))], eIds = (ps || []).map(p => p.einsatz_id).filter(Boolean);
  const [{ data: ks }, { data: es }] = await Promise.all([
    kIds.length ? sb.from('kunde').select('id,name,firma,vorname,nachname,ort').in('id', kIds) : { data: [] },
    eIds.length ? sb.from('planer_einsatz').select('id,person_id,beginn,ende').in('id', eIds) : { data: [] }]);
  const pIds = [...new Set((es || []).map(e => e.person_id).filter(Boolean))];
  const { data: pers } = pIds.length ? await sb.from('planer_person').select('id,name').in('id', pIds) : { data: [] };
  const K = new Map((ks || []).map(k => [k.id, k])), E = new Map((es || []).map(e => [e.id, e])), P = new Map((pers || []).map(p => [p.id, p.name]));
  const datum = v => { const d = new Date(String(v).slice(0, 10) + 'T12:00'); return `${d.getDate()}.${d.getMonth() + 1}.${String(d.getFullYear()).slice(2)}`; };
  const zeilen = (ps || []).filter(p => E.has(p.einsatz_id)).map(p => { const k = K.get(p.kunde_id) || {}, e = E.get(p.einsatz_id);
    return `<button type="button" class="bpl" data-prog="${p.id}"><b>${esc(kname(k))}</b><span>${esc(k.ort || '')}</span><span>${esc(P.get(e.person_id) || '')}</span><span class="d">${datum(e.beginn)} – ${datum(e.ende)}</span></button>`; }).join('');
  $('appMain').innerHTML = `<div class="bpliste"><div class="bplk">Bauprogramme</div>${zeilen || '<div class="bplleer">Noch keine Bauprogramme.</div>'}
    <div class="bplh">Neues Bauprogramm: im Planer mit der rechten Maustaste auf den Baustellen-Balken › «Bauprogramm erstellen».</div></div>`;
  $('appMain').querySelectorAll('[data-prog]').forEach(b => b.addEventListener('click', () => { ['springen', 'druckBtn'].forEach(id => $(id).classList.remove('hidden')); programmOeffnen({ programm: b.dataset.prog }); }));
}

// ---------------------------------------------------------------- Grunddaten: Feiertage, Kunden mit Auftrag
let FEIERTAGE = {};
async function ladeGrund(){ const { data } = await sb.from('planer_feiertag').select('datum,name'); (data || []).forEach(x => FEIERTAGE[x.datum] = x.name); }
const kname = k => k.name || k.firma || [k.vorname, k.nachname].filter(Boolean).join(' ') || '(ohne Name)';
// ---------------------------------------------------------------- Quellen eines Kunden → Baum
let KUNDE = null, PROG = null, KNOTEN = {}, WURZELN = [];
const blaetter = k => k.kinder ? k.kinder.flatMap(blaetter) : [k];
const blattTage = (b, team) => b.tage != null ? b.tage : (b.std || 0) / ((team || TEAM) * TAG_H);
const stdAusPositionen = pos => (pos || []).filter(p => p.typ === 'POSITION' && /^(std|h)\b/i.test(p.einheit || '') && !/projektleiter/i.test(p.text || ''))
  .reduce((s, p) => s + (Number(p.menge) || 0), 0);
const tagAusPositionen = pos => (pos || []).filter(p => p.typ === 'POSITION' && /^tag/i.test(p.einheit || '')).reduce((s, p) => s + (Number(p.menge) || 0), 0);
const knoten = (k, eltern, tiefe) => { KNOTEN[k.id] = k; k.eltern = eltern; k.tiefe = tiefe; (k.kinder || []).forEach(c => knoten(c, k.id, tiefe + 1)); return k; };

// Bauprogramm gehört zu einem Planer-Balken (einsatz). Quellen: die ausgewählten Auftragsbestätigungen des Kunden (ab_ids).
let EINSATZ = null, ABS = [], ABSEL = [];
async function programmOeffnen({ einsatz, programm }){
  $('appMain').innerHTML = '<div class="leer-start">Lädt …</div>';
  let prog = null;
  if(programm){ ({ data: prog } = await sb.from('bauprogramm').select('*').eq('id', programm).maybeSingle()); einsatz = prog && prog.einsatz_id; }
  const { data: ein } = einsatz ? await sb.from('planer_einsatz').select('id,kunde_id,person_id,beginn,ende,art,titel').eq('id', einsatz).maybeSingle() : { data: null };
  if(!ein){ $('appMain').innerHTML = '<div class="leer-start">Der Planer-Balken zu diesem Bauprogramm wurde nicht gefunden.</div>'; return; }
  if(!ein.kunde_id){ $('appMain').innerHTML = '<div class="leer-start">Der Balken hat noch keinen Kunden.<br>Im Planer in den Details einen Kunden wählen, dann geht das Bauprogramm.</div>'; return; }
  if(!prog) ({ data: prog } = await sb.from('bauprogramm').select('*').eq('einsatz_id', ein.id).maybeSingle());
  EINSATZ = ein; if(FENSTER) parent.postMessage({ bp: 'gross' }, location.origin);
  history.replaceState(null, '', '?einsatz=' + ein.id + (FENSTER ? '&fenster=1' : ''));
  const kundeId = ein.kunde_id;
  const [{ data: k }, { data: abs }, { data: offBest }, { data: andere }, { data: zus }] = await Promise.all([
    sb.from('kunde').select('id,name,firma,vorname,nachname,strasse,ort').eq('id', kundeId).maybeSingle(),
    sb.from('easybill_dokument').select('easybill_id,nummer,datum,angebot_nummern').eq('typ', 'ORDER').eq('kunde_id', kundeId).order('datum', { ascending: false }),
    sb.from('offerte').select('id,titel,easybill_document_number,datum').eq('kunde_id', kundeId).eq('status', 'bestaetigt'),
    sb.from('bauprogramm').select('id,ab_ids').eq('kunde_id', kundeId),
    // Zusage aus Pendenzen, aus der dieser Balken kommt: dort beim «In den Arbeitsvorrat» angehakte Offerten
    sb.from('pendenz').select('vorrat_offerte_ids,vorrat_easybill').eq('planer_einsatz_id', ein.id).limit(1)
  ]);
  const vz = (zus || [])[0], vOff = vz?.vorrat_offerte_ids || [], vEb = vz?.vorrat_easybill || [];
  const ausVorrat = (vOff.length || vEb.length) && !(prog && (prog.ab_ids || []).length); // gespeicherte AB-Auswahl geht vor
  if(!k){ $('appMain').innerHTML = '<div class="leer-start">Kunde nicht gefunden.</div>'; return; }
  KUNDE = k; $('bpTitel').textContent = 'Bauprogramm · ' + kname(k);
  ABS = (abs || []).slice().sort((a, b) => String(b.datum || '').localeCompare(String(a.datum || '')));   // neueste zuerst
  // Auswahl: gespeichert, sonst die neueste AB, die noch in keinem anderen Programm steckt
  const belegt = new Set((andere || []).filter(p => !prog || p.id !== prog.id).flatMap(p => p.ab_ids || []).map(Number));
  ABSEL = prog && (prog.ab_ids || []).length ? prog.ab_ids.map(Number) : ausVorrat ? [] : ABS.filter(a => !belegt.has(Number(a.easybill_id))).slice(0, 1).map(a => Number(a.easybill_id));
  const absSel = ABS.filter(a => ABSEL.includes(Number(a.easybill_id)));
  const nummern = [...new Set([...absSel.flatMap(a => a.angebot_nummern || []), ...(ausVorrat ? vEb : [])])];
  const alleNummern = new Set(ABS.flatMap(a => a.angebot_nummern || []));
  const { data: angebote } = nummern.length ? await sb.from('easybill_dokument').select('easybill_id,nummer,titel,datum,positionen,offerte_id').eq('typ', 'OFFER').in('nummer', nummern) : { data: [] };
  const offIds = [...new Set([...(angebote || []).map(a => a.offerte_id).filter(Boolean), ...(offBest || []).map(o => o.id), ...(ausVorrat ? vOff : [])])];
  const [{ data: offs }, { data: tage }] = offIds.length ? await Promise.all([
    sb.from('offerte').select('id,titel,easybill_document_number').in('id', offIds),
    sb.from('offerte_teilschritt_tage').select('offerte_id,anzahl_tage,teilschritt:teilschritt_id(id,name,reihenfolge,arbeitsschritt:arbeitsschritt_id(id,name,reihenfolge))').in('offerte_id', offIds).gt('anzahl_tage', 0)
  ]) : [{ data: [] }, { data: [] }];
  // Baum der Quellen: AB › Angebot › Arbeitsschritt › Teilschritt (nur intern, als Grundlage der Blöcke)
  KNOTEN = {};
  const offerteKnoten = (o, titel, ebLeaf) => {
    const ts = (tage || []).filter(t => t.offerte_id === o.id && t.teilschritt);
    if(!ts.length) return ebLeaf;
    const asMap = new Map();
    ts.sort((a, b) => (a.teilschritt.arbeitsschritt?.reihenfolge ?? 0) - (b.teilschritt.arbeitsschritt?.reihenfolge ?? 0) || a.teilschritt.reihenfolge - b.teilschritt.reihenfolge)
      .forEach(t => { const a = t.teilschritt.arbeitsschritt || { id: 'x', name: 'Weitere' };
        if(!asMap.has(a.id)) asMap.set(a.id, { id: 'as:' + o.id + ':' + a.id, n: a.name, kinder: [] });
        asMap.get(a.id).kinder.push({ id: 'ts:' + o.id + ':' + t.teilschritt.id, n: t.teilschritt.name, tage: Number(t.anzahl_tage) }); });
    return { id: 'of:' + o.id, n: titel, nr: o.easybill_document_number || '', quelle: 'ot', kinder: [...asMap.values()] };
  };
  const angebotKnoten = a => {
    const std = stdAusPositionen(a.positionen), tg = tagAusPositionen(a.positionen);
    const ebLeaf = { id: 'eb:' + a.easybill_id, n: 'Angebot ' + a.nummer + (a.titel && !/^angebot$/i.test(a.titel) ? ' · ' + a.titel : ''), nr: a.nummer, std: tg ? null : std, tage: tg || null, quelle: 'eb',
      klein: std ? `nur Easybill · ${std} h Vorarbeiter + Gartenarbeiter` : (tg ? `nur Easybill · ${tg} Tage` : 'nur Easybill · keine Stunden im Angebot') };
    const o = a.offerte_id && (offs || []).find(x => x.id === a.offerte_id);
    return o ? offerteKnoten(o, o.titel, ebLeaf) : ebLeaf;
  };
  // beim Vorrat angehakte Offerten: direkt als Quelle (ohne AB-Auswahl)
  if(ausVorrat){
    const ot = vOff.map(id => (offs || []).find(o => o.id === id)).filter(Boolean)
      .map(o => offerteKnoten(o, o.titel, { id: 'of:' + o.id, n: o.titel || 'Offerte', nr: o.easybill_document_number || '', quelle: 'ot', klein: 'keine Tage in der Offerte' }));
    const eb = vEb.map(nr => (angebote || []).find(a => a.nummer === nr) || { easybill_id: 'nr' + nr, nummer: nr, positionen: null }).map(angebotKnoten);
    WURZELN = [{ id: 'vorrat', n: 'Beim Vorrat angehakte Offerten', kinder: [...ot, ...eb] }].filter(w => w.kinder.length);
  } else
  WURZELN = absSel.map(ab => ({ id: 'ab:' + ab.easybill_id, n: 'AB ' + ab.nummer,
    kinder: (ab.angebot_nummern || []).map(nr => (angebote || []).find(a => a.nummer === nr)).filter(Boolean).map(angebotKnoten) })).filter(w => w.kinder.length);
  const inAb = new Set((angebote || []).map(a => a.offerte_id).filter(Boolean));
  // bestätigte Offerten ohne AB (in keiner AB des Kunden erwähnt) kommen dazu
  const ohneAb = (offBest || []).filter(o => !inAb.has(o.id) && !alleNummern.has(o.easybill_document_number)).map(o => offerteKnoten(o, o.titel, null)).filter(Boolean);
  if(ohneAb.length && !ausVorrat) WURZELN.push({ id: 'best', n: 'Bestätigte Offerten', kinder: ohneAb });
  WURZELN.forEach(w => knoten(w, null, 0));
  const gesehen = new Set();
  ANG = WURZELN.flatMap(w => w.kinder).filter(a => !gesehen.has(a.id) && gesehen.add(a.id));
  // Programm + Blöcke
  PROG = prog || null;
  let zeilen = [];
  if(PROG){ const { data: bl } = await sb.from('bauprogramm_block').select('*').eq('programm_id', PROG.id).order('sortierung'); zeilen = bl || []; }
  aufbauGruppen(zeilen);
  $('start').value = PROG ? PROG.start : String(EINSATZ.beginn).slice(0, 10);

    let fertig = false;
    const ende = ok => { if(fertig) return; fertig = true;
      const z = felder.map(x => x.inp.value.trim()); while(z.length && !z[z.length - 1]) z.pop();
      felder.forEach(x => { x.c.innerHTML = ''; });
      if(!ok || !z.length || !z[0]) return;
      let j = B.findIndex(p => p.von > d); if(j < 0) j = B.length;
      const neu = neuerTeil([], { name: z.join('\n'), extra: z.length });
      // Beginn merken, wenn der Eintrag nicht direkt ans vorherige Feld anschliesst
      let nat = j > 0 ? plus(B[j - 1].bis, 1) : null; if(nat) while(!arbeitstag(nat)) nat = plus(nat, 1);
      if(j === 0){ $('start').value = iso(d); if(B[0]) B[0].fix = B[0].fix || iso(B[0].von); } else if(iso(nat) !== iso(d)) neu.fix = iso(d);
      B.splice(j, 0, neu); geaendert(); };
    const zeileDazu = zc => {
      zc.innerHTML = `<input class="zin" type="text" placeholder="${felder.length ? 'nächste Zeile …' : 'Arbeit eintippen · Enter = nächste Zeile'}" aria-label="Eigener Eintrag, Zeile ${felder.length + 1}">`;
      const inp = zc.querySelector('input'), x = { c: zc, inp }; felder.push(x);
      inp.addEventListener('click', e => e.stopPropagation());
      inp.addEventListener('keydown', e => {
        const i = felder.indexOf(x);
        if(e.key === 'Enter'){ e.preventDefault();
          if(felder[i + 1]){ felder[i + 1].inp.focus(); return; }
          // nächster Arbeitstag
          let k = +zc.dataset.di + 1; while(R.querySelector(`.zelle[data-di="${k}"]`) && !arbeitstag(plus(T0, k))) k++;
          const nz = R.querySelector(`.zelle[data-di="${k}"]`); if(nz) zeileDazu(nz); }
        else if(e.key === 'ArrowUp' && i > 0){ e.preventDefault(); felder[i - 1].inp.focus(); }
        else if(e.key === 'ArrowDown' && felder[i + 1]){ e.preventDefault(); felder[i + 1].inp.focus(); }
        else if(e.key === 'Backspace' && !inp.value && i > 0 && i === felder.length - 1){ e.preventDefault(); felder.pop(); zc.innerHTML = ''; felder[i - 1].inp.focus(); }
        else if(e.key === 'Escape') ende(false);
      });
      inp.addEventListener('blur', () => setTimeout(() => { if(!felder.some(f2 => f2.inp === document.activeElement)) ende(true); }, 0));
      inp.focus();
    };
    zeileDazu(c);
  }));
  // Länge: unten am Feld ziehen
  R.querySelectorAll('[data-griff]').forEach(gr => gr.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation(); const { p } = teilVon(gr.dataset.griff);
    const bewegen = ev => {
      const t = [...R.querySelectorAll('.tag')].find(x => { const r = x.getBoundingClientRect(); return ev.clientY >= r.top && ev.clientY < r.bottom; });
      if(!t) return; const tagIso = iso(plus(T0, +t.dataset.i));
      let n = 0; for(let d = new Date(p.von); iso(d) <= tagIso; d = plus(d, 1)) if(arbeitstag(d)) n++;
      n = Math.max(1, n); const alt = teilTage(p); if(n !== alt){ p.extra = (p.extra || 0) + n - alt; zeichnen(); }
    };
    const los = () => { document.removeEventListener('pointermove', bewegen); document.removeEventListener('pointerup', los); speichern(); };
    document.addEventListener('pointermove', bewegen); document.addEventListener('pointerup', los);
  }));
}
document.addEventListener('dragend', () => { ziehen = null; document.querySelectorAll('.ziehe,.ziel-o,.ziel-u,.ziel-tag').forEach(x => x.classList.remove('ziehe', 'ziel-o', 'ziel-u', 'ziel-tag')); const Gr = $('geruest'); if(Gr) Gr.classList.remove('ziel'); });
function detail(){
  const { p } = teilVon(gewaehlt), Dt = $('detail');
  if(!p){ Dt.classList.add('hidden'); return; }
  Dt.classList.remove('hidden');
  const ro = DARF ? '' : ' disabled', eigen = !p.teile.length;
  Dt.innerHTML = `${eigen ? `<div class="feld">Arbeit<input class="t" id="dN" value="${esc(teilName(p))}"${ro}></div>` : `<div class="feld">Arbeit<b style="font-size:14px;color:#232B35;padding:6px 0">${esc(teilName(p))}</b></div>`}
    <div class="feld">Tage<input class="t klein" id="dT" type="number" min="1" value="${teilTage(p)}"${ro}></div>
    ${hatStunden(p) ? `<div class="feld">Team <small>Personen</small><input class="t klein" id="dTeam" type="number" min="1" max="8" value="${p.team}"${ro}></div>` : ''}
    ${p.teile.length > 1 ? `<div class="feld">Teilschritte<small style="max-width:360px;white-space:normal">${esc(p.teile.map(id => KNOTEN[id] ? KNOTEN[id].n : '').join(' · '))}</small></div>` : ''}
    <span class="sp"></span><button class="btn prim" type="button" id="dOk">Fertig</button>`;
  const an = (id, fn) => { const el = $(id); if(el) el.addEventListener('change', e => { fn(e.target.value); geaendert(); }); };
  an('dN', v => { const zl = String(p.name || '').split(NL); zl[0] = v.trim() || zl[0]; p.name = zl.join(NL); });
  an('dT', v => { const n = Math.max(1, parseInt(v) || 1); p.extra = (p.extra || 0) + n - teilTage(p); });
  an('dTeam', v => p.team = Math.max(1, parseInt(v) || TEAM));
  $('dOk').onclick = () => { gewaehlt = null; zeichnen(); };
}

// ---------------------------------------------------------------- Speichern (nach jeder Änderung, kurz verzögert)
let speicherTimer = null;
function geaendert(){ zeichnen(); clearTimeout(speicherTimer); speicherTimer = setTimeout(speichern, 500); }
async function speichern(){
  clearTimeout(speicherTimer); speicherTimer = null;
  if(!DARF || !KUNDE) return;
  if(!PROG){
    const { data, error } = await sb.from('bauprogramm').insert({ kunde_id: KUNDE.id, einsatz_id: EINSATZ.id, ab_ids: ABSEL, start: $('start').value || iso(new Date()) }).select('*').single();
    if(error){ toast('Speichern fehlgeschlagen: ' + error.message, true); return; }
    PROG = data;
  } else await sb.from('bauprogramm').update({ start: $('start').value, ab_ids: ABSEL, geaendert_am: new Date().toISOString() }).eq('id', PROG.id);
  const zeilen = B.map((p, i) => { const ang = p.teile.length ? angebotVon(p.teile[0]) : null;
    return { id: p.id, programm_id: PROG.id, sortierung: i, name: p.teile.length ? teilName(p) : (p.name || 'Eigener Block'), farbe: ang ? famVon(ang) : 'grau', teile: p.teile,
      extra: p.extra || 0, team: p.team || TEAM, fix: p.fix || null, mat: p.mat || null, sub: p.sub || null, notiz: p.notiz || null, ursprung_id: null, gruppe: p.id, angebot: ang, los: false }; })
    // eigene Einträge im Vorrat: los = true (liegen im Gerüst, nicht auf der Tagesachse)
    .concat(VOR.map((p, i) => ({ id: p.id, programm_id: PROG.id, sortierung: 10000 + i, name: p.name || 'Eigener Block', farbe: 'grau', teile: [], extra: p.extra || 0, team: p.team || TEAM,
      fix: null, mat: p.mat || null, sub: p.sub || null, notiz: p.notiz || null, ursprung_id: null, gruppe: p.id, angebot: null, los: true })));
  if(zeilen.length){
    const { error } = await sb.from('bauprogramm_block').upsert(zeilen);
    if(error){ toast('Speichern fehlgeschlagen: ' + error.message, true); return; }
  }
  const ids = zeilen.map(z => z.id);
  const q = sb.from('bauprogramm_block').delete().eq('programm_id', PROG.id);
  const { error: e3 } = ids.length ? await q.not('id', 'in', `(${ids.join(',')})`) : await q;
  if(e3) toast('Speichern fehlgeschlagen: ' + e3.message, true);
}
$('start').addEventListener('change', () => { if(KUNDE){ geaendert(); zumProgramm(); } });
document.querySelectorAll('[data-spr]').forEach(b => b.addEventListener('click', () => springen(b.dataset.spr)));
addEventListener('resize', () => infoVerteilen());
// Ausdruck: eine Zeile pro Tag (Wochentag · Datum · Arbeiten · Spez. Material · Subunternehmer · Notizen), wie das Google-Sheet-Bauprogramm.
// Arbeiten = Teilschritt des Tages (bei mehreren Teilschritten nach Tagen verteilt), Material/Subunternehmer/Notiz am ersten Tag des Felds,
// Abwesenheiten der Leute aus dem Planer in den Notizen.
const WTL = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
const MON = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
function druckTabelle(){
  rechnen();
  if(!B.length) return '';
  const proTag = {};   // iso -> [{ arbeit, mat, sub, notiz, fix }]
  B.forEach(p => {
    const tt = tagTexte(p), W = tt.W.map(iso), tagName = tt.namen, ts = tt.ts;
    W.forEach((t, i) => (proTag[t] = proTag[t] || []).push({ arbeit: tagName[i], ueber: ts.length > 1 && i === 0 ? teilName(p) : '', mat: i ? '' : p.mat, sub: i ? '' : p.sub, notiz: i ? '' : p.notiz, fix: i === 0 && p.fix }));
  });
  const abw = {}; PL.filter(x => x.va || HILFE).forEach(x => x.abw.forEach(a => { for(let d = D(a.von); d <= D(a.bis); d = plus(d, 1)) (abw[iso(d)] = abw[iso(d)] || []).push(x.kurz + ' abwesend' + (a.t && a.t !== 'abwesend' ? ' (' + a.t + ')' : '')); }));
  const von = B[0].von, bis = B[B.length - 1].bis;
  // Ganze Wochen: ab Montag der ersten bis Freitag der letzten Woche, je 4 Wochen pro Seite
  const mo = d => plus(d, -((d.getDay() + 6) % 7));
  const wochen = []; for(let w = mo(von); w <= bis; w = plus(w, 7)) wochen.push(w);
  const kw = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - n); return Math.ceil(((t - new Date(Date.UTC(t.getUTCFullYear(), 0, 1))) / 864e5 + 1) / 7); };
  const fmt = d => `${d.getDate()}. ${MON[d.getMonth()]} ${d.getFullYear()}`;
  const ort = [KUNDE.strasse, KUNDE.ort].filter(Boolean).join(', '), heute = iso(new Date());
  const seiten = []; for(let i = 0; i < wochen.length; i += 4) seiten.push(wochen.slice(i, i + 4));
  return seiten.map((ws, si) => {
    // Jede Woche ein eigenes, geschlossenes Feld (tbody mit Rahmen): Mo–Fr normal, Samstag als halbhohe Zeile
    let rows = '';
    ws.forEach((w, wi) => {
      rows += '<tbody class="wk">';
      for(let i = 0; i < 6; i++){
        const d = plus(w, i), t = iso(d), fei = FEIERTAGE[t], e = proTag[t] || [], ab = abw[t] || [], sa = i === 5;
        const z = k => e.map(x => esc(x[k] || '')).filter(Boolean).join('<br>');
        const ar = fei ? esc(fei) : e.map(x => `${x.ueber ? `<small>${esc(x.ueber)}</small>` : ''}${esc(x.arbeit)}`).join('<br>');
        const voll = sa && (e.length || ab.length);
        rows += `<tr class="${[sa ? 'sa' : '', voll ? 'voll' : '', fei ? 'fei' : '', t === heute ? 'heute' : ''].join(' ').trim()}">${i === 0 ? `<td class="kw" rowspan="6"><span>KW ${kw(d)}</span></td>` : ''}
          <td class="wt">${WTL[d.getDay()]}</td><td class="dt">${d.getDate()}. ${MON[d.getMonth()]}</td>
          <td class="ar"><div class="c">${ar}</div></td><td><div class="c">${z('mat')}</div></td><td><div class="c">${z('sub')}</div></td>
          <td class="no"><div class="c">${[z('notiz'), ...ab.map(esc)].filter(Boolean).join('<br>')}</div></td></tr>`;
      }
      rows += '</tbody>' + (wi < ws.length - 1 ? '<tbody class="lz"><tr><td colspan="7"></td></tr></tbody>' : '');
    });
    return `<section class="bl"><div class="dk"><div><h1>Bauprogramm ${esc(kname(KUNDE))}</h1><p>${esc(ort)}${ort ? ' · ' : ''}${fmt(von)} – ${fmt(bis)}</p></div>
      <div class="fi">Knechtgarten<span>Stand ${new Date().toLocaleDateString('de-CH')}${seiten.length > 1 ? ` · Seite ${si + 1} von ${seiten.length}` : ''}</span></div></div>
      <table><colgroup><col style="width:5%"><col style="width:9%"><col style="width:9%"><col style="width:29%"><col style="width:17%"><col style="width:13%"><col style="width:18%"></colgroup>
      <thead><tr><th></th><th>Tag</th><th>Datum</th><th>Arbeiten</th><th>Spez. Material usw.</th><th>Lieferant</th><th>Notizen</th></tr></thead>${rows}</table></section>`;
  }).join('');
}
$('druckBtn').addEventListener('click', () => {
  if(!KUNDE) return toast('Zuerst eine Baustelle wählen.', true);
  let d = $('druck'); if(!d){ d = document.createElement('div'); d.id = 'druck'; document.body.appendChild(d); }
  d.innerHTML = druckTabelle(); if(!d.innerHTML) return toast('Das Programm ist noch leer.', true);
  window.print();
});
window.addEventListener('beforeunload', () => { if(speicherTimer) speichern(); });
start();
</script>
